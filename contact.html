<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — boquin.xyz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f7f9;
            color: #475569;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 1px 0 #e4e8ef;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #0f172a;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #4f46e5;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 2rem 4rem;
        }

        .contact-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 3.5rem 4rem;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
            border: 1px solid #e4e8ef;
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        .contact-card h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }

        .contact-card .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
        }

        .email-wrapper {
            position: relative;
            display: inline-block;
        }

        .email-wrapper .tooltip {
            visibility: hidden;
            opacity: 0;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            white-space: nowrap;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .email-wrapper .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #0f172a;
        }

        .email-wrapper:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .email-btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.9rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .email-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        .footer {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .contact-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">boquin.xyz</a>
            <div class="nav-links">
                <a href="/">Dashboards</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="contact-card">
            <h1>Get in Touch</h1>
            <p class="subtitle">Questions, ideas, or just want to connect?</p>
            <div class="email-wrapper">
                <span class="tooltip" id="email-tooltip"></span>
                <a id="email-link" class="email-btn" href="#">Send an Email</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026, thanks Claude!</p>
    </footer>

    <script>
        (function () {
            var u = 'boquin';
            var d = 'gmail.com';
            var addr = u + '\u0040' + d;
            var el = document.getElementById('email-link');
            el.href = 'mailto:' + addr;
            el.textContent = 'boquin at gmail';
            document.getElementById('email-tooltip').textContent = addr;
        })();
    </script>
</body>
</html>
