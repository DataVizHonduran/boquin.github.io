.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

const SUMMARIES = {"oil and gas": "<p>Energy markets are shifting toward a high-margin, high-risk environment driven by geopolitical conflict and AI power demands.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Geopolitical volatility:</strong> Conflict in the Middle East is spiking refining margins and fuel prices while disrupting supply chains.</li><li>  <strong>AI infrastructure:</strong> The surge in data centers is creating a critical electricity deficit, forcing a pivot toward biomass and small nuclear reactors.</li></ul><p><strong>By the numbers:</strong></p><ul><li>  <strong>$21B:</strong> Amount Japanese firms are spending to secure US Gulf Coast LNG.</li><li>  <strong>$1.45B:</strong> Shell's sale price for its Australian gas stake to XRG.</li><li>  <strong>25%:</strong> The rate at which the US is building power lines compared to a decade ago.</li><li>  <strong>£20B:</strong> Total plan value for Drax's biomass-powered data center.</li></ul><p><strong>Between the lines:</strong></p><ul><li>  <strong>Strategic divestment:</strong> Oil majors are shedding mature assets and resisting new refinery investments to prioritize shareholder buybacks and debt reduction.</li><li>  <strong>Energy security vs. Transition:</strong> The UK and EU are struggling to balance \"clean power\" goals with the immediate need for gas storage and domestic oil production (e.g., Rosebank).</li><li>  <strong>Critical mineral bottlenecks:</strong> Despite US government backing, lobbying is outpacing actual domestic production of minerals essential for the energy transition.</li></ul><p><strong>What's next:</strong></p><ul><li>  <strong>US Policy Shift:</strong> Potential Trump-era fuel price hikes and disputes over Russian diesel imports will create volatility in East Coast ports.</li><li>  <strong>Infrastructure Crisis:</strong> The AI boom will likely accelerate the adoption of \"all of the above\" energy strategies to bypass grid limitations.</li></ul>", "corporate earnings and results": "<p>Corporate earnings reports reveal a stark divide between AI-driven expansion and traditional industrial decline.</p><p><strong>Why it matters:</strong> Capital is aggressively rotating toward high-growth tech and specialized healthcare, while legacy retail and automotive sectors face structural collapse.</p><p><strong>The winners</strong></p><ul><li><strong>Apollo:</strong> Lent a record $114bn in Q3, targeting AI leaders like Nvidia and Anthropic.</li><li><strong>Pfizer:</strong> Revenue from non-Covid medicines rose 7%, offsetting the decline in pandemic-era product sales.</li><li><strong>Private Equity:</strong> Carlyle and PAI Partners sold a menopause specialist for €2.6bn, nearly doubling their initial investment.</li></ul><p><strong>The losers</strong></p><ul><li><strong>Apple:</strong> Warned that \"unprecedented\" memory chip costs will compress profit margins despite strong holiday sales forecasts.</li><li><strong>Schaeffler:</strong> Cutting 3,500 jobs and closing four German sites as the automotive supply chain falters.</li><li><strong>Hedge Funds:</strong> Marshall Wace and Millennium suffered losses in October following an AI sector correction.</li></ul><p><strong>Cost-cutting trends</strong></p><ul><li><strong>Unilever:</strong> Slashing €1bn in costs following a food division spin-off to prioritize growth.</li><li><strong>Virgin Media O2:</strong> Targeting a 30% reduction in staff costs by 2029.</li><li><strong>Asda:</strong> Appointed a new CEO to reverse falling sales and mounting losses.</li></ul><p><strong>Between the lines:</strong> The \"AI rout\" hitting hedge funds suggests a valuation bubble, even as private equity firms like Apollo continue to pour record capital into the infrastructure.</p>", "middle east war": "<p>The U.S. is pivoting its Middle East strategy amid escalating tensions between the U.S.-Israel alliance and Iran.</p><p><strong>Why it matters:</strong> A shift in U.S. funding and military posture creates a volatile power vacuum, risking a regional war that could disrupt global trade and energy markets.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Military escalation:</strong> The U.S. struck Iran’s Qeshm Island; Iran responded by attacking a Hormuz tanker with limpet mines.</li><li><strong>Funding shift:</strong> President Trump announced an end to $4 billion in annual military aid to Israel by year-end.</li><li><strong>Diplomatic gambles:</strong> Qatari mediators are conducting last-ditch talks in Tehran to prevent a full-scale bombing campaign.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$103:</strong> The current price of crude oil, which is declining on hopes of diplomatic breakthroughs.</li><li><strong>3.4%:</strong> U.S. Q3 GDP growth, providing the domestic economic cushion for shifting foreign policy.</li><li><strong>$4B:</strong> The annual aid package to Israel slated for termination.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political leverage:</strong> The timing of these military strikes and funding cuts coincides with U.S. midterm elections, turning Middle East policy into a campaign referendum.</li><li><strong>Israeli instability:</strong> Prime Minister Netanyahu is facing internal legitimacy crises and a loss of his parliamentary majority.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market volatility:</strong> Oil prices will fluctuate based on whether Qatari mediation succeeds or Iran executes its \"immediate\" retaliation.</li><li><strong>Regional fallout:</strong> Saudi Arabia has already begun postponing high-profile events, including the Asian Cup, signaling a lack of confidence in regional stability.</li></ul>", "shipping": "<p>Global shipping is fracturing into high-risk corridors and opportunistic new routes.</p><p><strong>Why it matters:</strong> Geopolitical conflict in the Black Sea and Strait of Hormuz is driving up operational costs, inflating oil prices, and forcing a structural shift in global trade lanes.</p><p><strong>The risk zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iranian attacks on tankers have spiked daily charter costs to a record $1.2 million.</li><li><strong>Black Sea:</strong> Now the world's deadliest route for commercial sailors due to Russia-Ukraine combat.</li><li><strong>Labor:</strong> Captains are earning up to $100,000 per month to transit high-risk zones.</li></ul><p><strong>The strategic pivots</strong></p><ul><li><strong>Arctic Shift:</strong> Transits via the Northern Sea Route have quadrupled as ships avoid the Middle East and ice melts.</li><li><strong>Fleet Tactics:</strong> Russia is expanding its own flagged fleet by one-third to bypass sanctions and using \"spoofing\" to hide tanker locations.</li><li><strong>UK Infrastructure:</strong> DP World’s London Gateway is poised to overtake Felixstowe, driven by a surge in Chinese EV imports.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel of oil warned by Vitol if tanker shortages persist.</li><li><strong>24.6 million:</strong> Daily barrels exported from the Gulf, currently exceeding pre-war levels (23.3 million).</li><li><strong>90%:</strong> The peak recovery of Hormuz transit levels before recent attacks caused a sharp decline.</li></ul><p><strong>Between the lines</strong> The market is prioritizing speed over age. The value of old supertankers now exceeds new builds because immediate availability is more valuable than vessel longevity during a supply squeeze.</p><p><strong>What's next</strong> Watch for a potential \"shipping bottleneck\" despite high production levels, as the scarcity of available supertankers threatens to trigger a new wave of global inflation.</p>", "artificial intelligence": "<p>The AI industry is shifting from a phase of speculative hype to a period of intense financial and geopolitical scrutiny.</p><p><strong>Why it matters:</strong> Massive infrastructure spending is outpacing revenue growth, triggering a market correction. Simultaneously, AI is evolving from a corporate tool into a primary instrument of national security and statecraft.</p><p><strong>By the numbers</strong></p><ul><li><strong>$900 billion:</strong> The combined market value shed by Big Tech as investors question the \"cash burn\" at Google, Amazon, and Meta.</li><li><strong>$1.25 trillion:</strong> OpenAI's revised valuation target after slashing its funding goal by $10 billion.</li><li><strong>$115 billion:</strong> Marvell's bet on Lumentum to dominate AI connectivity.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Junk\" Risk:</strong> Anthropic’s potential high-junk credit rating signals that private capital is becoming wary of AI's unsustainable borrowing levels.</li><li><strong>Geopolitical Weaponization:</strong> Nvidia’s restrictions on Chinese clients and GCHQ’s warnings about Russian/Chinese cyber attacks indicate AI is now a frontline in a new Cold War.</li><li><strong>Labor Paradox:</strong> While mass layoffs haven't materialized, \"entry-level\" roles are vanishing, creating a barrier for young workers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Military Integration:</strong> OpenAI’s hiring of a former US Army secretary suggests a pivot toward official defense contracts and national security modernization.</li><li><strong>Sovereignty Shifts:</strong> Governments, led by the UK, are moving toward \"control and sovereignty\" models to prevent total dependence on US-based labs.</li><li><strong>Agentic Transition:</strong> Corporate leadership is shifting toward \"agentic tools\" to automate operations, forcing executives to pivot from management to high-level strategy.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a zero-sum struggle for global primacy that transcends traditional diplomacy.</p><p><strong>Why it matters:</strong></p><ul><li>  The \"win-win\" era of economic interdependence has ended, replaced by a \"Great Game\" where security concerns override trade logic.</li><li>  Unpredictable leadership in both Washington and Beijing increases the risk of miscalculation and systemic conflict.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The Middle Power Pivot:</strong> Smaller nations and \"middle powers\" (e.g., Australia, UAE) are diversifying supply chains to avoid becoming geopolitical hostages.</li><li>  <strong>BRICS Ascendancy:</strong> The BRICS bloc is finding rare unity against U.S. sanctions and tariffs, now surpassing the G7 in share of the global economy.</li><li>  <strong>The Détente Trap:</strong> High-level summits between Trump and Xi provide temporary stability but do not resolve fundamental structural rivalries.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Economic Warfare:</strong> Expect increased use of tariffs and sanctions as primary tools of statecraft.</li><li>  <strong>Multilateral Strain:</strong> A push from leaders in the Global South to strengthen cooperation systems to offset U.S.-China volatility.</li></ul>", "us elections": "<p>US voters are casting ballots in midterm elections that serve as a direct referendum on Donald Trump’s presidency.</p><p><strong>Why it matters:</strong> The results determine the balance of power in Congress, directly impacting federal spending, AI regulation, and US trade and energy policy.</p><p><strong>The stakes</strong></p><ul><li><strong>Legislative control:</strong> Republicans are fighting to retain majorities in the House and Senate to prevent the president from becoming a \"lame duck.\"</li><li><strong>Economic sentiment:</strong> A majority of voters disapprove of the administration's handling of inflation and rising living costs.</li><li><strong>Market volatility:</strong> Wall Street is monitoring results for signals on public spending and the S&P 500's historical post-midterm growth trend.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal friction:</strong> Democrats are facing internal fractures, highlighted by a high-profile split in Michigan.</li><li><strong>Institutional pushback:</strong> The Supreme Court's refusal to intervene in California's vote count signals a limit on executive influence over election results.</li><li><strong>Media shifts:</strong> Fox News is seeing a ratings decline due to \"viewer fatigue,\" while competitors like CNN are gaining ground.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Policy pivots:</strong> A Democratic sweep would likely trigger immediate shifts in energy and trade priorities.</li><li><strong>Regulatory impact:</strong> Online betting firms are leveraging the election to influence future gambling regulations.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Internal instability and electoral losses are paralyzing Germany's ability to pass critical economic reforms and lead the EU's budget negotiations.</p><p><strong>The crisis points</strong></p><ul><li><strong>Far-right ascent:</strong> The AfD is securing regional power and allegedly poaching votes from Merz’s CDU, fueling investor anxiety.</li><li><strong>Coalition collapse:</strong> The resignation of the labor minister stalls urgent pension and market reforms.</li><li><strong>Security threats:</strong> State officials face iPhone hacks and \"intense\" Russian espionage targeting military sites.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>€2tn:</strong> The EU budget deal currently jeopardized by Merz's weakened authority in Brussels.</li><li><strong>4 years:</strong> The gap since German and Russian foreign ministers last met to discuss Ukraine de-escalation.</li></ul><p><strong>Between the lines</strong> Merz is attempting to position himself as a \"firewall\" against extremism, but his plummeting popularity makes him vulnerable to internal challengers. Hendrik Wüst, premier of North Rhine-Westphalia, is emerging as the primary \"chancellor-in-waiting.\"</p><p><strong>What's next</strong> Watch for whether Merz can stabilize his party after regional election disasters or if the CDU pivots to Wüst to stem the AfD's momentum.</p>", "central banks": "<p>Central banks are shifting from stability to a new phase of tightening and leadership transitions.</p><p><strong>Why it matters:</strong> Persistent inflation and bond market volatility are forcing policymakers to maintain high rates longer than markets anticipated, risking economic stagnation.</p><p><strong>The leadership shakeup</strong></p><ul><li>Christine Lagarde is stepping down as ECB president in February, years ahead of her 2027 term end.</li><li>Frontrunners for her successor include Pablo Hernández de Cos and Klaas Knot.</li><li>The transition occurs amid heightened French bond market turbulence.</li></ul><p><strong>Monetary policy trends</strong></p><ul><li><strong>The Fed:</strong> Holding rates steady but shifting to seven policy meetings per year starting next year to signal a tighter path.</li><li><strong>The BoE:</strong> Preparing for a \"short and precautionary\" tightening cycle in November.</li><li><strong>The BoJ:</strong> Maintaining a quarterly tightening trajectory as inflation accelerates.</li><li><strong>The ECB:</strong> On course for further rate hikes through 2026.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hawkish shift:</strong> Analysts have raised 2027 rate forecasts for the BoE, BoJ, Fed, and ECB.</li><li><strong>Currency defense:</strong> India has spent ~$90 billion to stabilize the rupee.</li><li><strong>Digital pivot:</strong> The EU is accelerating its digital currency strategy to enhance geopolitical monetary influence.</li></ul><p><strong>What's next</strong></p><ul><li>Eurozone leaders must submit ECB president nominations by Friday.</li><li>Markets are watching for Fed hints on the timing of the next rate hike.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as record trading profits clash with AI-driven deposit risks and regulatory penalties.</p><p><strong>Why it matters:</strong> AI is creating a paradox for lenders: it offers superior supervisory tools to prevent SVB-style collapses, but threatens to trigger a $500 billion exodus of deposits as AI agents seek higher yields.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman Sachs is preparing for top executives.</li><li><strong>$350 million:</strong> Fine levied against Amex for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> Money laundering fine contributing to a 17% profit drop at BofA.</li><li><strong>$7 billion:</strong> Deposits surged into tech-focused startup bank Erebor.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Trading Pivot:</strong> Banks are shifting from taking bets to acting as \"cash cows\" for hedge funds, leveraging prime brokerage fees rather than proprietary risk.</li><li><strong>Talent Wars:</strong> Citi is shortening junior analyst programs to two years to stop private equity firms from poaching young talent.</li><li><strong>Regulatory Friction:</strong> The White House and courts continue to clash over the Fed's \"culture of risk aversion\" during the SVB collapse.</li></ul><p><strong>What's next</strong></p><ul><li><strong>China Expansion:</strong> Citi will scale its securities business in China following long-awaited approval.</li><li><strong>Earnings Cool-down:</strong> Analysts expect a sharp slowdown in trading revenue for Q3 after a record-breaking start to the year.</li><li><strong>AI Restrictions:</strong> Expect more US lenders to block AI agents from account access to protect low-cost deposit bases.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>03 Nov 2026 18:02 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
