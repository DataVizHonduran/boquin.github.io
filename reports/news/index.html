const SUMMARIES = {"oil and gas": "<p>AI's energy hunger is forcing a pivot back to fossil fuels.</p><p><strong>Why it matters:</strong> Data center power demands are outstripping grid capacity. Developers are bypassing traditional utilities to build their own gas-fired plants to avoid years of connection delays.</p><p><strong>The AI-Energy Nexus</strong></p><ul><li><strong>Direct Investment:</strong> Anthropic signed a $3.4bn deal for gas-fired power to secure scarce equipment.</li><li><strong>Grid Failure:</strong> The U.S. is building electricity lines at 25% of the rate seen a decade ago.</li><li><strong>UK Shift:</strong> British data center developers are investing in fossil fuel generation due to grid bottlenecks.</li><li><strong>Alternative Fuel:</strong> Drax is leveraging biomass to power one of the UK's largest data centers.</li></ul><p><strong>Global Gas Dynamics</strong></p><ul><li><strong>US LNG Dominance:</strong> Qatar is projected to become the largest buyer of U.S. LNG by 2033.</li><li><strong>Strategic Hedging:</strong> Japanese firms are spending $21bn to secure U.S. Gulf Coast shale resources.</li><li><strong>Asset Rotation:</strong> Shell is exiting mature assets, selling its Australian gas stake to Abu Dhabi's XRG for $1.45bn.</li></ul><p><strong>Between the lines:</strong> The \"energy transition\" is colliding with the \"AI revolution.\" While political shifts may favor renewables, the immediate physical requirement for 24/7 baseload power is reviving the strategic importance of natural gas.</p><p><strong>What's next:</strong> Watch for \"unregulated\" energy hubs, such as Argentina's proposed Patagonian data centers, as tech giants seek jurisdictions with fewer restrictions on land and energy use.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI-driven valuations clash with traditional industry volatility.</p><p><strong>Why it matters:</strong> High-growth tech firms are pursuing aggressive IPOs and tax optimization to sustain valuations, while legacy sectors rely on \"resilient\" consumer spending to offset operational headwinds.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 trillion:</strong> Target valuation for Anthropic's upcoming IPO.</li><li><strong>$50 billion:</strong> Gains for hotel groups driven by inelastic tourist demand.</li><li><strong>$9.6 billion:</strong> Berkshire Hathaway's latest share buyback spree.</li><li><strong>$2.7 billion:</strong> Tax savings for Apple via Singapore profit booking.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Efficiency:</strong> The shift toward AI is moving from software implementation to headcount reduction, specifically targeting middle management.</li><li><strong>Capital Pivot:</strong> Venture capital is streamlining; Sequoia is closing offices and funds to reduce overhead.</li><li><strong>Resource Maximization:</strong> Meat producers are diversifying revenue streams by selling animal by-products (collagen) to the wellness market.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tech Volatility:</strong> Markets remain sensitive to \"tech routs,\" though the Nasdaq 100 shows rapid recovery patterns.</li><li><strong>Regulatory Pressure:</strong> Brussels is intensifying efforts to reduce European dependence on foreign tech infrastructure.</li></ul>", "middle east war": "<p>U.S. midterm election results are triggering a fundamental pivot in Middle East security and diplomacy.</p><p><strong>Why it matters:</strong> A Democratic sweep and the defeat of Trump signal a U.S. retreat from the \"Iran war,\" removing the primary driver of regional escalation and shifting the balance of power toward China.</p><p><strong>The immediate fallout</strong></p><ul><li><strong>Israel:</strong> Trump announced an end to $4bn in annual military aid by year-end, forcing Israel to seek new security guarantees.</li><li><strong>Iran:</strong> Tehran is celebrating the U.S. political shift as Qatari mediators push for an interim deal to end hostilities.</li><li><strong>Energy:</strong> Oil prices tumbled below $100 on hopes that a diplomatic resolution will stabilize the Strait of Hormuz.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Digital Warfare:</strong> Despite diplomatic hopes, Iran-linked ships are positioning over subsea cables, signaling a pivot toward hybrid threats against digital infrastructure.</li><li><strong>Russian Influence:</strong> Moscow is deepening its military ties with Tehran via missile launcher deals, ensuring Iran remains armed even as U.S. policy softens.</li><li><strong>Saudi Vulnerability:</strong> Continued Houthi strikes on Aramco offices in Riyadh prove that Saudi Arabia remains exposed despite U.S. geopolitical shifts.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Coalition Building:</strong> Israel's Gadi Eisenkot has 28 days to form a government amidst dwindling U.S. support.</li><li><strong>Diplomatic Push:</strong> Watch for a formal interim agreement between Washington and Tehran brokered by Qatar.</li></ul>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict transforms the world's most vital maritime chokepoints into war zones.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are driving up operational costs, forcing risky route diversions, and threatening global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has intensified attacks, targeting 24 vessels in two weeks. This has spiked insurance costs and pushed captain salaries to $100,000 per month.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route. Russia is diverting grain to Arctic ports to bypass combat zones, increasing costs for buyers.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades of Iranian ports have led to direct kinetic engagements with commercial tankers.</li></ul><p><strong>The market shift</strong></p><ul><li><strong>Arctic Boom:</strong> Transits via the Northern Sea Route have quadrupled as shippers avoid the Middle East and melting ice opens new paths.</li><li><strong>Asset Value:</strong> Old supertankers are now more valuable than new builds because immediate availability outweighs vessel age in a high-rate market.</li><li><strong>Logistics Pivot:</strong> DP World’s London Gateway is poised to overtake Felixstowe due to a surge in Chinese EV imports.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel of oil warned by Vitol if tanker shortages create a critical bottleneck.</li><li><strong>$2 billion:</strong> The scale of a U.S. oil trader's gamble on tankers to spur Asian refining amid diesel shortages.</li><li><strong>24.6 million:</strong> Daily barrels of Middle East oil exports, currently exceeding pre-war levels (23.3 million) via alternative routes.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> A court case between Mercuria and the Baltic Exchange will determine the validity of shipping price estimates during active warfare.</li><li><strong>Corporate strategy:</strong> Maersk is aggressively purchasing ships to compete with CMA CGM, despite recent Q3 earnings disappointments.</li></ul>", "artificial intelligence": "<p>The AI investment bubble is facing a systemic correction driven by political backlash and market skepticism.</p><p><strong>Why it matters:</strong> A Democratic sweep in the U.S. midterms has triggered a pivot toward curbing data center expansion, threatening the physical infrastructure required for AI scaling.</p><p><strong>By the numbers</strong></p><ul><li><strong>$3.2 trillion:</strong> Total value shed by Wall Street during the recent tech plunge.</li><li><strong>6.4%:</strong> Single-day drop of the Nasdaq 100.</li><li><strong>6%:</strong> Decline in Japan's Nikkei 225 and Topix indices.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political Risk:</strong> The alliance between Silicon Valley and the previous administration backfired, leading to new regulatory threats against \"tech cheerleaders.\"</li><li><strong>Commodity Impact:</strong> Copper prices are falling as forecasts for data center demand weaken.</li><li><strong>Global Divergence:</strong> While the U.S. faces a correction, the UK is accelerating investment to avoid falling behind. China is increasing interventionism to secure dominance in robotics.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Capital Shift:</strong> Investors are moving away from \"accelerating growth\" pricing toward a more cautious valuation of AI utility.</li><li><strong>Strategic Pivot:</strong> Tech executives are redesigning political strategies to mitigate hostility toward infrastructure expansion.</li><li><strong>Concentration of Power:</strong> Despite the market rout, firms like XN continue to double down on labs like Anthropic, signaling a divide between public market panic and private equity conviction.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic rivalry that is reshaping global alliances and economic security.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Instability:</strong> Leadership volatility in Washington and Beijing creates a vacuum of far-sighted diplomacy.</li><li>  <strong>Fragmentation:</strong> Trade wars and sanctions are pushing \"middle powers\" and the BRICS bloc to build alternative economic systems.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The \"Middle Power\" Pivot:</strong> Countries like Australia and members of BRICS are diversifying supply chains to avoid becoming hostages to U.S.-China geopolitics.</li><li>  <strong>BRICS Momentum:</strong> The bloc is finding rare unity through shared opposition to U.S. tariffs and sanctions.</li><li>  <strong>Strategic Distrust:</strong> High-level summits are viewed as tactical management rather than a return to détente.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>Economic Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li>  <strong>Risk Profile:</strong> Rising regional conflicts and \"revisionist\" powers are increasing the probability of a global conflagration.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Systemic Competition:</strong> The outcome of the \"Great Game\" will likely depend on external forces—such as AI and climate change—rather than direct leadership.</li><li>  <strong>Multilateral Strain:</strong> Expect continued pressure on the UN and G7 as smaller powers thwart the agendas of traditional superpowers.</li></ul>", "us elections": "<p>Democrats secured a sweeping victory in the US midterms, signaling a voter mandate focused on economic affordability over ideological warfare.</p><p><strong>Why it matters:</strong> High living costs drove the \"blue wave,\" proving that inflation is a more potent political catalyst than election subversion or foreign interference.</p><p><strong>Between the lines</strong></p><ul><li><strong>Centrist dominance:</strong> Despite headlines about the \"radical left,\" moderate Democrats hold the primary power in the new Congress.</li><li><strong>Institutional resilience:</strong> The results suggest liberal democracy remains stable despite recent threats to electoral norms.</li><li><strong>Donor failure:</strong> Wall Street mega-donors spent over $300 million on Republicans with negligible impact on the outcome.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$120 billion:</strong> Estimated loss in Elon Musk's net worth following the results.</li><li><strong>150 years:</strong> The gap since a Black man last held a US Senate seat from Mississippi, a streak Scott Colom is poised to break.</li><li><strong>$300 million+:</strong> Total spent by hedge fund and private equity executives on losing Republican campaigns.</li></ul><p><strong>The fallout</strong></p><ul><li><strong>Market volatility:</strong> Global stocks and chip sectors plummeted as investors fear the new Democratic majority will slow AI data center expansion.</li><li><strong>Legal scrutiny:</strong> Democrats intend to launch investigations into the Trump family's financial ties and the crypto industry.</li><li><strong>Policy deadlock:</strong> Despite the shift in Congress, analysts expect minimal changes to economic policymaking for the remainder of Trump's term.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz's dwindling domestic authority weakens Germany's leadership within the EU and stalls critical economic and pension reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of Labour Minister Bärbel Bas signals deepening instability within the government.</li><li><strong>AfD ascent:</strong> The far-right has secured its first regional parliament president and is gaining ground in eastern states.</li><li><strong>CDU fragility:</strong> Allegations that CDU lawmakers traded votes with the AfD are fueling a crisis of legitimacy for the conservatives.</li></ul><p><strong>Security and defense</strong></p><ul><li><strong>Military pivot:</strong> The appointment of Christian Freuding as armed forces chief accelerates the Bundeswehr's transformation toward active deterrence.</li><li><strong>Espionage threats:</strong> Recent arrests of Russian assets and Apple warnings about hacked iPhones highlight a heightened state of intelligence vulnerability.</li><li><strong>Diplomatic tension:</strong> High-level meetings with Russia and Turkey signal a pragmatic but strained attempt to manage regional instability.</li></ul><p><strong>Between the lines</strong> Merz is increasingly viewed as a \"lame duck.\" The rise of Hendrik Wüst as a popular alternative suggests the CDU may be looking for a successor to stabilize the party before the next federal cycle.</p><p><strong>What's next</strong></p><ul><li><strong>Investment risk:</strong> Executives are weighing the AfD's growth against Germany's ability to attract foreign capital.</li><li><strong>EU budget:</strong> Merz's weakened position may jeopardize the €2tn EU budget deal in Brussels.</li></ul>", "central banks": "<p>Central banks are shifting back to hawkish stances as inflation remains entrenched globally.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing the Bank of England (BoE), European Central Bank (ECB), and Federal Reserve to prioritize tightening over planned cuts. This increases borrowing costs and risks slowing economic growth.</p><p><strong>The current landscape</strong></p><ul><li><strong>Bank of England:</strong> Raised rates to 4% for the first time since 2023; signaling further increases to combat inflation.</li><li><strong>ECB:</strong> Maintaining a tightening course as core inflation stays well above the 2% target.</li><li><strong>Federal Reserve:</strong> Holding rates steady but upgrading economic outlooks, suggesting a continued tightening path due to strong US growth.</li><li><strong>Bank of Japan:</strong> Staying on a quarterly tightening trajectory.</li></ul><p><strong>Between the lines</strong> The ECB is facing a double volatility shock:</p><ul><li><strong>Leadership:</strong> President Christine Lagarde is stepping down early in February, triggering a high-stakes race for her successor.</li><li><strong>Markets:</strong> The new president must manage French bond market turbulence while ensuring smooth policy transmission.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Policy shifts:</strong> The Fed is reducing its annual policy meetings from eight to seven starting next year.</li><li><strong>Market sentiment:</strong> Analysts are revising 2027 forecasts higher for the BoE and BoJ.</li><li><strong>Leadership transition:</strong> Eurozone leaders must submit ECB president nominees by Friday.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit flight to higher-yielding accounts, while regulatory fines for money laundering are eating into net profits.</p><p><strong>The AI paradox</strong></p><ul><li><strong>The Risk:</strong> Lenders are restricting AI agent access to accounts to prevent automated shifts of billions in deposits.</li><li><strong>The Reward:</strong> Goldman Sachs is aggressively promoting engineers to partner ranks to build the infrastructure needed to outrun AI disruption.</li><li><strong>The Oversight:</strong> Regulators are exploring AI to identify the cultural risk failures that led to the SVB collapse.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman is preparing for top executives.</li><li><strong>$350 million:</strong> Fine levied against Amex for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> Money laundering fine that contributed to a 17% profit drop at BofA.</li><li><strong>30%:</strong> Increase in Goldman's Q3 net income, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Talent War:</strong> Citi is shortening the analyst program to two years to stop private equity firms from poaching junior bankers.</li><li><strong>Strategic Shifts:</strong> Citi's approval for China securities business signals a push for growth despite geopolitical tensions.</li><li><strong>Revenue Pivot:</strong> Banks are increasingly acting as conduits for hedge fund borrowing rather than placing their own bets to avoid post-crisis regulatory penalties.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Earnings Slowdown:</strong> Analysts forecast a sharp decline in trading revenue following a record-breaking first half of the year.</li><li><strong>Leadership Flux:</strong> Evercore is restructuring leadership with new co-presidents; Goldman remains without a definitive timeline for CEO succession.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>08 Nov 2026 16:49 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
