.slider-ticks span{font-size:.72rem;color:#94a3b8}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}

const SUMMARIES = {"oil and gas": "<p>Global energy markets are navigating a volatile transition defined by geopolitical instability and a shift toward electrification.</p><p><strong>Why it matters:</strong> Resource nationalism and Middle East conflicts are destabilizing traditional supply chains. Simultaneously, the race for \"optionality\" through electrification is creating a new strategic divide between China and the West.</p><p><strong>The oil & gas landscape</strong></p><ul><li><strong>Market resilience:</strong> Crude prices remain below $100/barrel despite conflict, aided by ample stocks and reduced Chinese imports.</li><li><strong>Strategic pivots:</strong> Investment firms are targeting Venezuelan assets via new Nasdaq-listed vehicles.</li><li><strong>European tension:</strong> Norway is pressuring the EU to scrap Arctic drilling bans to prioritize energy security over environmental restrictions.</li></ul><p><strong>The energy transition</strong></p><ul><li><strong>Battery wars:</strong> GM is pivoting to sodium battery tech to break China's dominance in energy storage.</li><li><strong>Critical minerals:</strong> DR Congo's cobalt curbs are forcing Chinese smelters to seek alternative raw materials.</li><li><strong>Fusion bet:</strong> Suppliers are targeting a projected $73 billion market as reactor development accelerates.</li></ul><p><strong>Between the lines</strong> The \"new joule order\" favors nations that treat electrification as a strategic hedge. While the West focuses on climate rulebooks and regulatory buffers, China has aggressively secured the infrastructure and materials required for long-term energy autonomy.</p><p><strong>What's next</strong></p><ul><li><strong>Regulatory scrutiny:</strong> The SBTi's revised Net-zero Standard will determine if corporate climate claims remain credible or become \"best effort\" loopholes.</li><li><strong>Infrastructure friction:</strong> Growing US opposition to battery storage projects may slow the integration of renewable power into the grid.</li></ul>", "corporate earnings and results": "<p>AI investment is shifting from pure profit generation to massive capital consumption.</p><p><strong>Why it matters:</strong> Big Tech is no longer just printing cash; it is spending record sums to maintain the AI arms race. This creates a precarious dependency on investor confidence to fund ongoing losses.</p><p><strong>By the numbers</strong></p><ul><li><strong>Record hauls:</strong> SpaceX, Anthropic, and Alphabet are absorbing a \"torrent\" of new issuance.</li><li><strong>High stakes:</strong> SpaceX secured the largest IPO in history despite steep losses.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The shift:</strong> The \"nerd economy\" is bifurcated. While specialized firms like Games Workshop thrive, legacy giants like Hasbro stagnate.</li><li><strong>The risk:</strong> If confidence dips, the high-cost infrastructure of AI could become a liability rather than an asset.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Export resets:</strong> Firms like Anduril are pushing for loosened US arms export controls to scale lower-cost weapon production.</li><li><strong>Sovereignty plays:</strong> Europe is increasing investments in tech sovereignty to reduce reliance on US and Chinese infrastructure.</li></ul>", "middle east war": "<p>President Trump is leveraging a cycle of high-intensity strikes and diplomatic pressure to force a deal with Iran.</p><p><strong>Why it matters:</strong> The U.S. aims to secure the Strait of Hormuz and seize control of Iranian oil hubs to stabilize global energy markets. Failure to reach a deal risks a wider regional collapse and sustained oil price volatility.</p><p><strong>The current state</strong></p><ul><li><strong>Military:</strong> The U.S. and Iran are exchanging strikes, including U.S. hits on Iranian reservoirs and radar sites.</li><li><strong>Diplomacy:</strong> Trump claims a deal to reopen the Strait is imminent, though Israel continues strikes in Beirut.</li><li><strong>Economics:</strong> Markets are rallying on hopes of a peace deal, while oil prices have dipped.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic leverage:</strong> Trump is using \"maximum pressure\" tactics—alternating between \"hitting hard\" and offering deals—to dictate terms.</li><li><strong>Iranian resilience:</strong> U.S. bombardment has only temporarily suppressed Tehran's underground \"missile cities.\"</li><li><strong>Israeli tension:</strong> Netanyahu faces domestic backlash for curbing attacks at the U.S. president's request.</li></ul><p><strong>Global ripple effects</strong></p><ul><li><strong>India:</strong> The conflict is testing India's economic resilience and straining U.S.-India ties after sailor deaths in tanker attacks.</li><li><strong>Europe:</strong> Defense stock rallies are reversing as funding concerns and borrowing costs rise.</li><li><strong>Logistics:</strong> Emirates is offering passenger insurance to counter travel fears in Dubai.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Sunday deadline:</strong> Markets are watching for the formal signing of the U.S.-Iran agreement.</li><li><strong>Oil control:</strong> Trump has vowed to take \"total control\" of Kharg Island and Iranian gas markets.</li></ul>", "shipping": "<p>Global shipping is currently defined by a volatile tug-of-war between geopolitical conflict in the Strait of Hormuz and a strategic pivot toward defense industrialization.</p><p><strong>Why it matters:</strong> Blockages in key maritime chokepoints trigger immediate energy price spikes and force a costly shift to inefficient land-based logistics. Simultaneously, rising global instability is reviving domestic shipbuilding in the West and fueling an export boom in Asia.</p><p><strong>The Hormuz Crisis</strong></p><ul><li><strong>Market volatility:</strong> Oil prices dropped 6% following the passage of two China-bound supertankers, signaling high sensitivity to waterway accessibility.</li><li><strong>Operational risks:</strong> \"Shadow fleets\" of aging tankers increase the risk of environmental disasters; meanwhile, stranded vessels face biological fouling from barnacles and jellyfish.</li><li><strong>Failed interventions:</strong> A $40bn U.S. insurance facility has seen zero uptake because it lacks naval escorts.</li></ul><p><strong>Industrial Shifts</strong></p><ul><li><strong>Defense pivot:</strong> The acquisition of Cammell Laird in the UK signals a move toward increased naval spending.</li><li><strong>Asian dominance:</strong> South Korea is capitalizing on the intersection of AI and global conflict to drive economic growth.</li><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to compete with Dublin via freight and offshore wind.</li></ul><p><strong>Between the lines</strong> The reliance on \"shadow fleets\" and the continued servicing of Russian LNG tankers by Danish yards show that sanctions are being bypassed through fragmented, high-risk maritime networks.</p><p><strong>What's next</strong></p><ul><li><strong>Rate corrections:</strong> Tanker owners expect a steep drop in profits if the Strait of Hormuz fully reopens.</li><li><strong>Energy pivots:</strong> Asian nations will likely increase coal shipments to hedge against disrupted gas supplies.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is triggering a massive reallocation of global capital and a fundamental restructuring of corporate governance.</p><p><strong>Why it matters:</strong> The scale of infrastructure investment is outstripping current regulatory and policy frameworks. This gap creates systemic risks in national security, legal accountability, and financial stability.</p><p><strong>By the numbers</strong></p><ul><li><strong>$75 billion:</strong> SpaceX's historic IPO, signaling massive investor appetite for AI-integrated aerospace.</li><li><strong>$70 billion:</strong> Oracle's planned data center spend over the next year.</li><li><strong>$35 billion:</strong> Private credit raised by Apollo and Blackstone to fund Anthropic.</li><li><strong>$1.4 billion:</strong> Funding for humanoid robot startup Neura.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Governance lag:</strong> 80% of UK boards are discussing AI-led decision-making, but experts warn governance is not keeping pace.</li><li><strong>The \"Slop\" Factor:</strong> Productivity gains are being offset by \"AI hallucinations\" (e.g., KPMG reports) and the need for human staff to correct AI errors.</li><li><strong>Geopolitical friction:</strong> The U.S. is increasingly treating AI access as a national security tool, evidenced by blocks on foreign nationals using Anthropic models.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fiscal overhaul:</strong> Policymakers face pressure to create new tax codes to manage wealth concentration and potential mass underemployment.</li><li><strong>Infrastructure scrutiny:</strong> Insurance regulators are probing credit risks tied to the rapid build-out of AI data centers.</li><li><strong>Sovereign shifts:</strong> A push for \"AI sovereign wealth funds\" suggests a move toward socializing the financial gains of the technology.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony as the traditional rules-based order collapses.</p><p><strong>Why it matters:</strong> The shift toward \"might is right\" geopolitics increases the risk of direct conflict and forces middle powers to abandon neutrality for strategic alliances.</p><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric Leverage:</strong> Power is no longer defined by GDP or military size, but by the ability to exploit imbalances in the global system.</li><li><strong>The Leadership Vacuum:</strong> Washington is retreating from global responsibilities, but Beijing is hesitant to assume the costs of leadership.</li><li><strong>Strategic Realignment:</strong> Russia's failures in Ukraine have created a one-sided dependency on China, granting Beijing significant leverage over Moscow.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Soft Power Shift:</strong> China is actively capturing global influence as U.S. diplomatic relations fray.</li><li><strong>Economic Risk:</strong> Geopolitical instability is now a core executive priority, driving a surge in geopolitics curricula at global business schools.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Alliance Hardening:</strong> Expect Japan, South Korea, and NATO allies to accelerate \"resilience\" capabilities to hedge against U.S. volatility.</li><li><strong>Institutional Decay:</strong> Multilateral bodies like the UN face irrelevance unless they reinvent governance to reflect the current power distribution.</li></ul>", "us elections": "<p>US primary results and economic discontent are reshaping the map ahead of the November midterms.</p><p><strong>Why it matters:</strong> Trump’s influence remains dominant within the GOP base, but his preference for polarizing candidates may alienate swing voters in key battlegrounds.</p><p><strong>The battlegrounds</strong></p><ul><li><strong>Texas:</strong> Trump-backed Ken Paxton won the primary, but Democrats believe his limited appeal outside the MAGA base creates a path to victory.</li><li><strong>Maine:</strong> Democrat Graham Platner secured the nomination despite misconduct allegations, setting up a challenge against incumbent Susan Collins.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li><li><strong>Pennsylvania:</strong> A populist former firefighter won a swing district primary, signaling a working-class shift for Democrats.</li></ul><p><strong>The headwinds</strong></p><ul><li><strong>Inflation:</strong> FT polling shows voters blame Trump for high grocery prices and the cost of living.</li><li><strong>Foreign Policy:</strong> A Republican-led House blocked the president from further strikes in the Middle East as the Iran war deepens.</li><li><strong>Base Erosion:</strong> Some evangelicals are questioning if Trump's rhetoric aligns with Christian values.</li></ul><p><strong>Between the lines</strong> Trump is prioritizing loyalty over electability. By purging critics—such as the defeat of Thomas Massie in Kentucky—he has solidified control of the party but increased the risk of \"Pyrrhic victories\" in general elections.</p><p><strong>What's next</strong> Watch the \"lobster revolt\" in Maine and tax refund pressures nationwide; these localized economic grievances could flip Senate seats.</p>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy and fiscal discipline amid collapsing relations with the U.S. and France.</p><p><strong>Why it matters:</strong> Berlin is prioritizing rapid rearmament and infrastructure spending to secure its strategic position as the U.S. threatens troop withdrawals and France disputes industrial leadership.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit the 3.5% GDP NATO target six years early.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to accelerate spending and pursuing a 40% stake in tank maker KNDS.</li><li><strong>Strategic shifts:</strong> Germany is ditching France for new fighter jet partners and seeking Tomahawk missiles despite tensions with Donald Trump.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>The Right:</strong> The AfD leads opinion polls by leveraging voter anger over fuel prices and criticizing U.S. foreign policy.</li><li><strong>CDU Friction:</strong> Friedrich Merz faces internal challenges from Hendrik Wüst as polls slide.</li><li><strong>U.S. Relations:</strong> Trump is reviewing 5,000 U.S. troops in Germany following Merz's criticism of U.S. strategy in Iran.</li></ul><p><strong>Economic discipline</strong></p><ul><li><strong>Infrastructure:</strong> The Finance Ministry will cut funding for ministries failing to spend a €500bn infrastructure fund.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>EU Tension:</strong> Germany opposes new EU debt while simultaneously pushing for a Capital Markets Union.</li></ul><p><strong>Between the lines</strong> Germany is attempting a high-wire act: funding a massive military build-up and infrastructure overhaul while maintaining a strict anti-debt stance within the EU. This internal contradiction, paired with a surging far-right, leaves the chancellery vulnerable to both domestic unrest and transatlantic volatility.</p>", "central banks": "<p>Central banks are pivoting toward aggressive tightening and diversification to combat persistent inflation and geopolitical instability.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Inflation persistence:</strong> Energy shocks and strong labor markets are forcing banks to abandon \"wait and see\" strategies to avoid 2008-style policy errors.</li><li>  <strong>Dollar erosion:</strong> Geopolitical risk is driving a historic shift away from US Treasuries toward gold and alternative reserve currencies.</li></ul><p><strong>The current landscape</strong></p><ul><li>  <strong>ECB:</strong> Raising rates for the first time since 2023, driven by Middle East energy crises and broadening price rises.</li><li>  <strong>The Fed:</strong> New Chair Kevin Warsh faces immediate pressure to maintain high rates amid bumper payroll data and a desire to end \"forward guidance.\"</li><li>  <strong>Emerging Markets:</strong> Indonesia implemented an off-cycle rate hike to defend the rupiah against investor flight.</li><li>  <strong>Bank of Japan:</strong> Accelerating quantitative tightening by reducing bond purchases to curb volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Reserve Shift:</strong> Gold now represents 27% of global reserves, signaling a systemic move to diversify away from the US dollar.</li><li>  <strong>Political Friction:</strong> Former Chair Powell warns that political interference in central bank appointments undermines the rule of law.</li><li>  <strong>Policy Blindspots:</strong> Critics argue the Bank of England is basing rate decisions on corporate pricing guesses rather than hard evidence.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Warsh's Debut:</strong> The Fed's first rate meeting under Kevin Warsh will signal whether the US will maintain a \"higher for longer\" stance.</li><li>  <strong>ECB Trajectory:</strong> Expect further June hikes as core inflation remains well above targets despite potential peace deals in Iran.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and aggressively pursue global market share.</p><p><strong>Why it matters:</strong> Lighter regulatory oversight is freeing billions in capital, allowing US giants to outpace European and Swiss rivals in lending and acquisitions.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via deregulation.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan says was freed by the Trump administration's approach.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering.</li><li><strong>$114 billion:</strong> Combined revenues of trading firms like Jane Street and Citadel as they erode traditional bank dominance.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk shifting:</strong> Banks are actively offloading private equity-linked loans and AI-driven data center debt to avoid overexposure.</li><li><strong>Geopolitical friction:</strong> Morgan Stanley is issuing China-only iPhones to staff, signaling heightened data security fears in mainland China.</li><li><strong>Internal volatility:</strong> Goldman Sachs is expanding its management committee while facing executive departures over internal policy disputes.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail expansion:</strong> JPMorgan is scaling its Chase digital bank into Germany after its UK launch.</li><li><strong>Crypto integration:</strong> Morgan Stanley will launch spot crypto trading on E*Trade to capture retail digital asset flows.</li><li><strong>Strategic pivots:</strong> Citi is partnering with BlackRock in a €15bn deal to scale private lending in Europe and the Middle East.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>14 Jun 2026 12:23 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
