const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing under the dual pressure of AI-driven power demand and geopolitical instability.</p><p><strong>Why it matters:</strong> Surging electricity needs for data centers are forcing a return to fossil fuels, while conflict in the Middle East is driving fuel inflation and social unrest.</p><p><strong>The AI Power Crunch</strong></p><ul><li><strong>Grid Strain:</strong> US grid operators are prioritizing gas to meet surging demand.</li><li><strong>Strategic Mergers:</strong> NextEra and Dominion are combining to scale energy infrastructure for the AI age.</li><li><strong>Storage Pivot:</strong> Swiss battery developers are tapping UK tech to stabilize data center power.</li></ul><p><strong>Geopolitical Volatility</strong></p><ul><li><strong>Supply Shocks:</strong> Iran is using floating storage to maintain production amid conflict; the US is easing sanctions on Russian refined products to stabilize jet fuel and diesel supplies.</li><li><strong>Social Unrest:</strong> Fuel price spikes are triggering violent protests in Kenya, Comoros, and Mozambique.</li><li><strong>Strategic Shifts:</strong> Putin and Xi are advancing the Power of Siberia 2 pipeline to pivot gas flows toward China.</li></ul><p><strong>Economic Fallout</strong></p><ul><li><strong>Retail Pressure:</strong> Walmart shares plunged after absorbing fuel costs to prevent consumer price hikes.</li><li><strong>Fiscal Policy:</strong> The UK is postponing fuel duty increases and closing oil tax loopholes to fund cost-of-living packages.</li><li><strong>Monetary Risk:</strong> The ECB can no longer ignore the inflationary impact of energy shocks.</li></ul><p><strong>The Energy Transition</strong></p><ul><li><strong>EV Acceleration:</strong> IEA forecasts EVs and hybrids will hit 30% of the car market this year, driven by high fuel costs.</li><li><strong>Critical Minerals:</strong> Chinese firms warn that lithium demand is being underestimated due to industrial battery growth.</li><li><strong>Nuclear Costs:</strong> The UK's Sizewell C project is projected to be more expensive than Hinkley Point.</li></ul>", "corporate earnings and results": "<p>Corporate earnings and capital flows are shifting toward high-end luxury and specialized healthcare as macroeconomic instability persists.</p><p><strong>Why it matters:</strong> Divergent consumer spending and geopolitical volatility are forcing firms to pivot toward \"resilient\" sectors to offset losses in traditional markets.</p><p><strong>The winners</strong></p><ul><li><strong>Richemont:</strong> High-end jewelry demand (Cartier) is offsetting sales declines in the Middle East and Africa.</li><li><strong>Healthcare:</strong> CVC is bidding €10.9bn for Recordati; Brookfield is targeting Fakih IVF (valued at $1bn) as healthcare remains a stable Middle East asset.</li></ul><p><strong>The losers</strong></p><ul><li><strong>Retail:</strong> UK retail sales are sliding amid a leadership crisis and rising public borrowing.</li><li><strong>High Street:</strong> Former WHSmith chains are \"almost completely broken\" due to chronic underinvestment.</li></ul><p><strong>Risk signals</strong></p><ul><li><strong>Private Equity:</strong> JPMorgan is offloading $4bn in PE-linked loans; Harvard's endowment faces a \"hangover\" from sluggish private holdings.</li><li><strong>Supply Chain:</strong> Sandoz is urging EU probes into Chinese drug dumping to protect European antibiotic access.</li><li><strong>Shipping:</strong> TotalEnergies and Mercuria are pursuing legal action over derivative losses following the Hormuz closure.</li></ul><p><strong>What's next</strong></p><ul><li><strong>IPO Surge:</strong> Wall Street expects a wave of blockbuster IPOs, including SpaceX (led by Goldman Sachs), as passive investors rotate capital.</li><li><strong>Equity Shifts:</strong> BMW is converting preference shares to voting equity to increase investor appeal.</li></ul>", "middle east war": "<p>The Middle East conflict is triggering a global economic shockwave while pushing U.S.-Iran relations toward a critical breaking point.</p><p><strong>Why it matters:</strong> The closure of the Strait of Hormuz is disrupting global energy flows, fueling inflation, and forcing a realignment of international trade and currency.</p><p><strong>The geopolitical stakes</strong></p><ul><li><strong>U.S. Pressure:</strong> President Trump has issued a 48-to-72 hour ultimatum to Tehran to reopen the Strait or face military strikes.</li><li><strong>Diplomatic Pivot:</strong> Despite threats, Pakistani mediators are traveling to Tehran as Senator Marco Rubio signals potential for a deal.</li><li><strong>Internal Israeli Strife:</strong> Lawmakers are advancing a bill for early elections, framing the vote as a referendum on Benjamin Netanyahu.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Energy Volatility:</strong> Brent crude dropped 6% to $105/barrel after two supertankers successfully crossed the Strait.</li><li><strong>Monetary Policy:</strong> Fed officials are reconsidering April rate cuts due to war-induced inflation spikes.</li><li><strong>Fiscal Strain:</strong> Saudi Arabia has halted new consultancy work to protect Vision 2030 funding amid war-related financial pressure.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>China's Gain:</strong> The instability is accelerating the \"de-dollarization\" of oil trade, increasing the global use of the renminbi.</li><li><strong>EU Vulnerability:</strong> Europe faces a \"dramatically worse\" economic outlook as energy shocks collide with trade friction with the U.S.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Deadline:</strong> Watch for U.S. military action or a diplomatic breakthrough within the next three days.</li><li><strong>The Succession:</strong> Iranian officials are struggling to mask the absence of the Supreme Leader, signaling potential internal instability.</li></ul>", "shipping": "<p>Geopolitical conflict in the Middle East is fundamentally rerouting global trade and inflating operational costs.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the Suez Canal forces ships onto longer, more expensive routes, triggering a ripple effect of supply chain bottlenecks and price hikes.</p><p><strong>The cost of conflict</strong></p><ul><li><strong>Maersk:</strong> Reports monthly cost increases of $500 million.</li><li><strong>Gulf Freight:</strong> Rates are spiking as companies pivot to trucks to bypass maritime blockades.</li><li><strong>Insurance:</strong> A $40 billion US insurance facility has seen zero uptake due to a lack of naval escorts.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Route Diversion:</strong> Ships are abandoning the Suez Canal for the Cape of Good Hope to avoid risk.</li><li><strong>Energy Pivot:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li><li><strong>Infrastructure:</strong> Belfast Harbour is investing £1.3 billion to capture freight and offshore wind growth.</li><li><strong>Last-Mile:</strong> Walmart is repurposing empty drugstores as stockrooms to accelerate delivery speeds.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Permanent Change:</strong> Panama Canal revenues have risen 15% as trade routes are permanently reshaped.</li><li><strong>Regulatory Gridlock:</strong> US opposition is stalling UN-backed carbon levies and net-zero frameworks for the industry.</li><li><strong>Security Vacuum:</strong> Seizures off the UAE coast and a resurgence of Somali piracy highlight a decline in maritime security.</li></ul><p><strong>What's next</strong> Expect continued volatility in freight rates and a prolonged struggle between the US and international regulators over shipping emissions standards.</p>", "artificial intelligence": "<p>The AI industry is shifting from a speculative software gold rush to a high-stakes battle over hardware, infrastructure, and public market valuations.</p><p><strong>Why it matters:</strong> Massive capital expenditures are creating a \"hardware-first\" economy. While software labs chase profitability, the underlying physical infrastructure—chips and satellites—now dictates geopolitical and financial power.</p><p><strong>The IPO Wave</strong> Wall Street is preparing for a historic surge of massive listings:</p><ul><li><strong>OpenAI:</strong> Preparing a potential $1tn filing as early as September.</li><li><strong>SpaceX:</strong> Planning the largest IPO in history, blending satellite tech and AI.</li><li><strong>Anthropic:</strong> Approaching its first profitable quarter, positioning it ahead of rivals.</li><li><strong>Cerebras:</strong> A successful $6.4bn raise signals strong investor appetite for chip designers.</li></ul><p><strong>The Hardware Hegemony</strong> The \"software era\" is yielding to the \"supplier era\":</p><ul><li><strong>Nvidia's Dominance:</strong> CEO Jensen Huang is deploying $90bn in deals to lock customers into Nvidia's ecosystem.</li><li><strong>China's Pushback:</strong> Beijing is banning Nvidia gaming chips to force adoption of domestic rivals like Huawei.</li><li><strong>Investor Pivot:</strong> Top fund managers argue the primary financial spoils of AI will flow to hardware providers, not app developers.</li></ul><p><strong>Economic Disruption</strong> AI is moving from experimental tools to structural workforce replacements:</p><ul><li><strong>Labor Cuts:</strong> Standard Chartered plans to replace \"lower-value human capital\" with AI, cutting 8,000 jobs.</li><li><strong>Revenue Crisis:</strong> Governments face potential tax shortfalls as automation erodes traditional labor income.</li><li><strong>Business Models:</strong> Professional services, including law firms, are being forced to abandon hourly billing as AI accelerates output.</li></ul><p><strong>What's next:</strong> Watch for the \"transfer of risk.\" As giants like OpenAI and SpaceX go public, the financial burden of the AI boom will shift from venture capitalists to retail investors.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global hegemony defined by asymmetry and instability.</p><p><strong>Why it matters:</strong></p><ul><li>Washington's perceived decline in credibility and domestic democratic instability creates a leadership vacuum.</li><li>Beijing is leveraging this gap to build soft power and secure a one-sided strategic advantage over Russia.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Leverage Shift:</strong> Power no longer stems from raw wealth or size, but from the ability to convert imbalances into strategic leverage.</li><li><strong>The Credibility Gap:</strong> U.S. foreign policy is hampered by a \"WWII fixation,\" leading to rigid stances on appeasement that complicate current conflicts.</li><li><strong>The Russian Asset:</strong> Putin’s strategic missteps have made Russia dependent on China, granting Beijing significant regional influence.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Zero-sum dynamics:</strong> Both powers seek hegemony but avoid the responsibilities of global leadership.</li><li><strong>Multilateral decay:</strong> Existing international institutions are failing, necessitating a total rethink of global governance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Middle power rise:</strong> Smaller nations are adopting \"armadillo\" strategies—defensive, resilient, and opportunistic—to navigate the U.S.-China stalemate.</li><li><strong>Asymmetric diplomacy:</strong> Expect an increase in \"middleman\" diplomacy, using special envoys to bypass traditional diplomatic gridlock.</li></ul>", "us elections": "<p>The U.S. political landscape is fracturing as Donald Trump’s second-term grip on the GOP faces internal resistance and economic headwinds.</p><p><strong>Why it matters:</strong> Internal GOP divisions over \"lawfare\" spending and the Iran war, combined with a populist shift among working-class Democrats, threaten Republican dominance in the upcoming midterms.</p><p><strong>By the numbers</strong></p><ul><li><strong>$350 million:</strong> Total war chest raised by Maga Inc Super PAC.</li><li><strong>$1.8 billion:</strong> Disputed fund earmarked for alleged \"lawfare\" victims.</li><li><strong>$8 million:</strong> Republican-led push to reverse Elon Musk's aid cuts.</li><li><strong>$300 million:</strong> Big Tech's campaign spending to counter regulation.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The MAGA Split:</strong> The Iran war is creating a \"MAGA divorce,\" pitting \"America First\" nationalists against the administration.</li><li><strong>Democratic Pivot:</strong> Democrats are aggressively recruiting working-class, populist candidates to reclaim swing districts, specifically in Pennsylvania.</li><li><strong>Judicial Volatility:</strong> Supreme Court rulings on enfranchisement and gerrymandering are deepening partisan polarization.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Midterm Vulnerabilities:</strong> Low approval ratings on the economy and inflation are eroding Trump's lead with swing voters.</li><li><strong>Succession Battles:</strong> Early friction is emerging between JD Vance and Marco Rubio for the 2028 presidential nomination.</li><li><strong>Primary Purges:</strong> Trump continues to purge disloyal GOP members, though some senators are now pushing back on his spending priorities.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy as relations with the U.S. collapse.</p><p><strong>Why it matters:</strong> A diplomatic rift between Chancellor Friedrich Merz and Donald Trump over the Iran war is triggering a U.S. troop withdrawal, forcing Berlin to accelerate its own defense capabilities to secure Europe.</p><p><strong>The defense surge</strong></p><ul><li><strong>Spending:</strong> Berlin plans to hit a 3.5% GDP military spending target six years ahead of NATO deadlines.</li><li><strong>Industry:</strong> The government is buying a 40% stake in KNDS and overhauling procurement agencies to speed up arms acquisition.</li><li><strong>Hardware:</strong> Germany is pursuing Tomahawk missiles and a €12bn warship project via Rheinmetall to offset U.S. instability.</li></ul><p><strong>Political volatility</strong></p><ul><li><strong>The AfD:</strong> The far-right party is topping polls by capitalizing on fuel price spikes and opposing the U.S.-Iran conflict.</li><li><strong>Internal Rift:</strong> The AfD is split over conscription, with the anti-NATO wing gaining dominance ahead of eastern state elections.</li><li><strong>EU Tension:</strong> Merz is blocking new EU debt while simultaneously pushing for \"painful\" budget cuts across member states.</li></ul><p><strong>Between the lines</strong> The \"Atlanticist\" era is ending. By criticizing U.S. strategy as \"humiliating,\" Merz has traded rapport with Trump for a strategy of strategic autonomy, mirroring French goals but at a faster, more disruptive pace.</p><p><strong>What's next</strong></p><ul><li><strong>U.S. Retaliation:</strong> The Pentagon is pulling 5,000 soldiers out of Germany.</li><li><strong>EU Friction:</strong> Expect increased clashes with the ECB and France over market interventions and defense sovereignty.</li><li><strong>Election Cycle:</strong> Regional votes will test if the AfD's surge translates into governing power.</li></ul>", "central banks": "<p>Central banks are facing a simultaneous crisis of political interference and macroeconomic instability.</p><p><strong>Why it matters:</strong> Erosion of central bank independence leads to higher inflation premiums and increased bond market volatility. Geopolitical shocks are forcing a pivot from pandemic-era playbooks to new, unpredictable inflationary drivers.</p><p><strong>The political battle</strong></p><ul><li><strong>US Fed:</strong> Trump nominees are challenging Jay Powell’s tenure, while bipartisan Senate bills seek to restrict the Treasury's Exchange Stabilization Fund.</li><li><strong>France:</strong> The appointment of Emmanuel Moulin as Bank of France governor has sparked accusations of political cronyism.</li><li><strong>UK:</strong> The Bank of England is facing pressure to dilute stablecoin regulations following industry pushback.</li></ul><p><strong>Monetary pivots</strong></p><ul><li><strong>Japan:</strong> The BoJ is moving toward a rate increase in June.</li><li><strong>Eurozone:</strong> The ECB is weighing rate hikes as the Strait of Hormuz closure threatens supply chains.</li><li><strong>Turkey:</strong> The central bank scrapped its inflation target, raising it to 24% amid war-driven price surges.</li></ul><p><strong>Market vulnerabilities</strong></p><ul><li><strong>Bond Fragility:</strong> Rising public debt and hedge fund trading are increasing the risk of \"bond market freakouts.\"</li><li><strong>Communication Gap:</strong> The Bank of England is seeing larger-than-average market surprises, signaling a failure in forward guidance.</li><li><strong>Balance Sheets:</strong> The US Treasury is exploring repo investments to help shrink the Fed's balance sheet.</li></ul><p><strong>What's next:</strong> Watch for Kevin Warsh’s installation at the Fed. His preference for \"quiet\" policy over public \"incantations\" could fundamentally change how the US communicates interest rate trajectories.</p>", "us banks": "<p>Wall Street is aggressively pivoting toward AI infrastructure and private credit while navigating geopolitical volatility in China.</p><p><strong>Why it matters:</strong> Banks are racing to capture the AI boom but face a dual crisis: escalating cyber vulnerabilities and \"data center debt\" that threatens balance sheets.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>The Opportunity:</strong> Lenders are financing the AI surge but are now seeking private deals to offload risk to avoid \"choking\" on data center exposure.</li><li><strong>The Risk:</strong> Financial officials warn that new AI models, including Anthropic’s Claude, could expose critical cyber vulnerabilities in the global banking system.</li><li><strong>The Friction:</strong> Goldman Sachs has banned the use of Claude in Hong Kong, citing security concerns.</li></ul><p><strong>Geopolitical Friction</strong></p><ul><li><strong>China Strategy:</strong> Morgan Stanley is issuing China-only iPhones to Hong Kong staff to protect data security.</li><li><strong>The Contrast:</strong> JPMorgan CEO Jamie Dimon praised China's consistency, though he maintains the U.S. remains the primary \"safe haven.\"</li></ul><p><strong>Strategic Shifts</strong></p><ul><li><strong>Private Credit:</strong> Citi partnered with BlackRock in a €15bn deal to scale private European lending and PE dealmaking.</li><li><strong>Treasury Surge:</strong> U.S. banks have boosted Treasury holdings to 2007 levels, driven by anticipated regulatory cuts under the Trump administration.</li><li><strong>Retail Expansion:</strong> JPMorgan is expanding its digital \"Chase\" consumer bank into Germany.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$9.4bn:</strong> Total employee pay at Jane Street in 2025 following record $40bn revenues.</li><li><strong>3x:</strong> The factor by which Wall Street traders outperformed European rivals this quarter.</li><li><strong>€15bn:</strong> The value of the Citi-BlackRock private lending partnership.</li></ul><p><strong>What's next:</strong> Watch for increased volatility in Gulf investment priorities if Iran-related conflicts escalate, potentially disrupting Wall Street capital flows.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>22 May 2026 12:42 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
