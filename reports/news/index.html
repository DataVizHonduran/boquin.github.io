.slider-ticks span{font-size:.72rem;color:#94a3b8}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}

const SUMMARIES = {"oil and gas": "<p>Geopolitical volatility and the AI energy surge are forcing a rapid reconfiguration of global oil and gas flows.</p><p><strong>Why it matters:</strong> Supply shocks in the Middle East and shifting US policy toward Venezuela are creating extreme price instability. Simultaneously, the massive power demands of AI are accelerating the pivot toward geothermal and renewable energy.</p><p><strong>The Geopolitical Friction</strong></p><ul><li><strong>Middle East:</strong> Attacks on Saudi pipelines have spiked Chinese oil prices and prompted France to call for G7 reserve releases.</li><li><strong>Venezuela:</strong> The US is navigating a complex \"oil deal\" involving the Trump administration and private investors like Harold Hamm, amid transparency disputes over fund allocation.</li><li><strong>Russia:</strong> New US legislation authorizes tariffs up to 100% on importers of Russian energy to tighten the economic squeeze on Moscow.</li></ul><p><strong>The Energy Transition</strong></p><ul><li><strong>Carbon Capture:</strong> ExxonMobil secured approval for a $5bn Texas project, while Ineos is advancing CO2 storage in Denmark.</li><li><strong>AI Power:</strong> Australia is leveraging its landmass for renewable compute power, while geothermal developers are adapting fracking techniques to tap deep-rock heat.</li><li><strong>Wind Trade:</strong> EU developers, led by Ørsted, are pushing for protections against state-subsidized Chinese turbine manufacturers.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>69%:</strong> Europe's current energy storage level, down from over 80% last year.</li><li><strong>$230M:</strong> The amount Poland lost in a failed attempt to purchase Venezuelan oil using cryptocurrency.</li><li><strong>100%:</strong> Potential US tariffs on buyers of Russian energy supplies.</li></ul><p><strong>What's next:</strong> Watch for the \"Hormuz crisis\" to permanently erode long-term LNG demand in Asia as buyers seek cheaper, more stable alternatives to avoid price volatility.</p>", "corporate earnings and results": "<p>AI infrastructure costs are spiraling as frontier labs prioritize scale over immediate profitability.</p><p><strong>Why it matters:</strong> Massive capital expenditures are creating a precarious gap between operational spending and sustainable revenue, threatening the long-term viability of AI business models.</p><p><strong>By the numbers</strong></p><ul><li><strong>$280 billion:</strong> Projected cash burn for OpenAI by 2030.</li><li><strong>$35 billion:</strong> Target US listing for Nscale to fund Anthropic's computing needs.</li><li><strong>$18 billion:</strong> Oracle data center debt currently under strain due to construction delays.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Revenue fragility:</strong> Investors are questioning Anthropic's ability to maintain growth post-IPO amid rising competition and price wars.</li><li><strong>Safety friction:</strong> Regulatory pressure and \"kill switch\" proposals in California increase operational risk and deployment costs.</li><li><strong>Infrastructure bottlenecks:</strong> Local opposition to data centers is creating physical constraints on AI expansion.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Third-party audits:</strong> Labs like Anthropic are embedding firms like Accenture to validate safety and appease regulators.</li><li><strong>Consolidation:</strong> High burn rates may force smaller AI players to merge or seek massive corporate bailouts to survive the infrastructure race.</li></ul>", "middle east war": "<p>The Middle East is entering a phase of multi-front escalation as Houthi rebels intensify attacks on Saudi Arabia.</p><p><strong>Why it matters:</strong> The conflict is shifting from a localized proxy war to a global economic disruptor, impacting oil markets, supply chains, and U.S. fiscal stability.</p><p><strong>The strategic shift</strong></p><ul><li><strong>Saudi vulnerability:</strong> Riyadh is facing a \"war on all fronts,\" with Houthi missiles hitting the capital for the first time in years.</li><li><strong>Iranian pivot:</strong> Tehran is bypassing U.S. naval blockades via land routes through Turkey and using cyber-spyware to target critics.</li><li><strong>U.S. involvement:</strong> The Trump administration is attempting to arm Riyadh with $24bn in F-35 jets, despite Congressional opposition.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$38bn:</strong> The fiscal cost of the U.S. war in Iran.</li><li><strong>$61mn:</strong> Iranian oil proceeds laundered via Binance by Chinese groups.</li><li><strong>$1bn:</strong> Investor withdrawals from Turkish stocks amid a separate domestic fund scandal.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI integration:</strong> The battlefield is evolving rapidly with the integration of autonomous systems, creating unpredictable warfare dynamics.</li><li><strong>Supply chain fragility:</strong> The collapse of urea exports through the Strait of Hormuz is forcing a global shift in fertilizer sourcing to prevent food crises.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic pressure:</strong> Pakistan is lobbying Iran to restrain the Houthis to protect Saudi-Pakistani defense pacts.</li><li><strong>Economic fallout:</strong> U.S. manufacturers face rising input costs driven by the combination of Iran conflict tariffs and AI-driven component shortages.</li></ul>", "shipping": "<p>Global shipping is facing a structural collapse driven by geopolitical conflict and climate instability.</p><p><strong>Why it matters:</strong> The convergence of war in the Middle East and drought in Panama is breaking traditional trade routes. This forces a shift toward \"shadow fleets\" and alternative corridors, increasing costs and security risks.</p><p><strong>The primary stressors</strong></p><ul><li>  <strong>Geopolitical Chokepoints:</strong> Iranian attacks in the Strait of Hormuz have forced the U.S. to limit air defense windows for tankers.</li><li>  <strong>Climate Volatility:</strong> El Niño-driven water shortages in the Panama Canal are slashing daily transits.</li><li>  <strong>Cyber Vulnerability:</strong> Hackers are targeting \"edge devices\" connected to ship engines and navigation systems.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$1.5 billion:</strong> The amount CK Hutchison is seeking from Panama over port disputes.</li><li>  <strong>2028:</strong> The target date for the first U.S.-backed nuclear-powered merchant vessel.</li><li>  <strong>18:</strong> The number of maritime authorities warning that global shipping rules are collapsing.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Artificial Profits:</strong> Container lines are seeing a \"temporary reprieve\" in rates, but this is driven by bottlenecks and disruptions rather than organic demand growth.</li><li>  <strong>Strategic Pivots:</strong> South Korea is accelerating Arctic trade routes to bypass traditional chokepoints like Hormuz.</li><li>  <strong>Regulatory Gaps:</strong> Sanctions loopholes allow UK insurers to cover Russian gas tankers, undermining government restrictions.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Energy Transition:</strong> Industry leaders are betting on clean ammonia, methanol, and a return to wind sails to meet emission targets.</li><li>  <strong>Hard Asset Shift:</strong> Institutional investors are moving capital into shipping to hedge against Middle East volatility.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative boom to a period of systemic instability and regulatory friction.</p><p><strong>Why it matters:</strong> Rapid deployment is outpacing safety frameworks and legal precedents, creating critical vulnerabilities in national security, intellectual property, and financial markets.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Geopolitics:</strong> The West faces a dual threat: China's state-led AI acceleration and Ukraine's rapid integration of AI in active combat.</li><li>  <strong>Regulation:</strong> The UK is weighing a formal AI regulator to replace the AI Security Institute as cabinet concerns grow.</li><li>  <strong>Legal:</strong> OpenAI faces intensifying litigation from publishers over copyrighted training data and \"existential threats\" to the media industry.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$50bn:</strong> The scale of SoftBank's data center IPO, a high-stakes bet on AI infrastructure.</li><li>  <strong>Zero:</strong> The current translation of medical AI advances into measurable real-life patient care improvements.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Security gaps:</strong> A breach of OpenAI using Anthropic models proves that AI tools are now being weaponized against the labs that build them.</li><li>  <strong>VC instability:</strong> Mega-IPOs are distorting the venture capital model, creating an extreme \"feast-or-famine\" investment environment.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>The \"Backlash\" Risk:</strong> Experts warn that ignoring safeguards now will trigger a public disaster, leading to regulatory overreactions that could freeze development.</li><li>  <strong>Governance shift:</strong> Expect a move toward \"genomics-style\" ethical frameworks to manage science that moves faster than legislation.</li></ul>", "us-china relations": "<p>The U.S. is shifting toward a transactional, zero-sum foreign policy, accelerating the formation of a rival geopolitical bloc led by China.</p><p><strong>Why it matters:</strong></p><ul><li>U.S. unpredictability and \"America First\" tariffs are driving historically divided nations toward the BRICS alliance.</li><li>The erosion of U.S. security guarantees in Asia is forcing allies like Japan and South Korea to question their strategic reliance on Washington.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>GDP:</strong> BRICS now accounts for a larger share of the global economy than the G7.</li><li><strong>AI:</strong> U.S. national data center projects are consolidating American dominance in AI hardware, despite global efforts to decentralize.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Win-Win\" Death:</strong> The post-Cold War era of cooperative globalization has been replaced by \"zero-sum\" thinking, where one nation's gain is viewed as another's loss.</li><li><strong>Transactional Diplomacy:</strong> A decline in U.S. promotion of democracy is creating a vacuum, allowing authoritarians in Africa and Asia to gain ground.</li><li><strong>Internal Divergence:</strong> A gap is widening between U.S. congressional hawks and a combination of Gen Z voters and Donald Trump, who show more openness to cooperation with Beijing.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bloc Formation:</strong> Overlapping conflicts in Ukraine and the Middle East are pushing the world toward two distinct, rival power centers.</li><li><strong>Institutional Flight:</strong> Potential U.S. funding cuts are prompting international organizations to consider relocating from Geneva to Gulf or European capitals.</li></ul>", "us elections": "<p>The U.S. midterm elections have become a high-stakes referendum on Donald Trump’s personal influence and economic record.</p><p><strong>Why it matters:</strong> Trump's plummeting approval ratings and inflammatory rhetoric are creating a strategic rift within the GOP, forcing candidates to balance loyalty to the leader against voter viability.</p><p><strong>The economic friction</strong></p><ul><li><strong>Inflation:</strong> Record-high fuel and diesel prices are eroding Republican support, particularly among working-class voters.</li><li><strong>The \"Dividend\":</strong> Trump is promising a $5,000 cash payout to adults if Republicans win, attempting to offset affordability anxieties.</li><li><strong>Infrastructure:</strong> Opposition to data center construction is emerging as a volatile local issue in swing states like Pennsylvania.</li></ul><p><strong>The money trail</strong></p><ul><li><strong>Billionaire backing:</strong> Ultra-wealthy donors are overwhelmingly funding the GOP.</li><li><strong>The War Chest:</strong> Under party pressure, Trump is finally deploying Maga Inc.’s $400 million reserve to prevent congressional losses.</li><li><strong>Super PACs:</strong> Maga Inc. and America Pac are spending millions to maintain GOP control of the House and Senate.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal GOP strife:</strong> Some candidates view Trump as \"toxic,\" while others, like Rep. María Elvira Salazar, are publicly distancing the party from his immigration policies to reclaim Hispanic voters.</li><li><strong>Democratic strategy:</strong> Democrats are pivoting toward aggressive oversight, vowing to probe Trump’s family and Elon Musk if they seize the House.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> Following a Supreme Court rejection of Trump's mail-in ballot restrictions, the focus shifts to election-day execution.</li><li><strong>The \"Fear\" Pitch:</strong> Republicans are leaning into \"fear of the alternative\" messaging rather than detailed policy platforms to secure victory.</li></ul>", "german politics": "<p>The far-right Alternative for Germany (AfD) has shattered the political center with a dominant victory in Saxony-Anhalt.</p><p><strong>Why it matters:</strong> The result signals a systemic collapse of conservative dominance in eastern Germany and creates a blueprint for the AfD to challenge for national power.</p><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target for the next federal polls.</li><li><strong>3 seats:</strong> The narrow margin preventing the AfD from leading a regional government in Saxony-Anhalt.</li><li><strong>40,000:</strong> Employees the German government is fighting to protect at Commerzbank's Frankfurt HQ.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Memory Gap\":</strong> Younger voters no longer view communism or fascism as defining political boundaries, lowering the barrier for radicalism.</li><li><strong>The Merz Crisis:</strong> Chancellor Friedrich Merz is increasingly viewed as a liability, with his own party distancing themselves from him to stem the far-right tide.</li><li><strong>Unlikely Alliances:</strong> The hard-left BSW party has emerged as a potential kingmaker, complicating the effort to isolate the AfD.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal warfare:</strong> Senior politicians are now calling for the top court to ban the most radical flanks of the AfD.</li><li><strong>Hybrid threats:</strong> Berlin is bracing for increased Russian hybrid warfare following drone attacks in Leipzig.</li><li><strong>Federal pressure:</strong> The political center must deliver rapid economic and social results or risk a total rout in the next general election.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control with political pressure and volatile currency markets.</p><p><strong>Why it matters:</strong> Divergent monetary policies are triggering global bond sell-offs and currency instability, while political interference threatens the independence of policymakers.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> New Chair Kevin Warsh is raising rates to curb sticky inflation despite public pressure from Donald Trump to slash borrowing costs to 1%.</li><li><strong>Bank of Japan:</strong> Rate hikes have failed to stop the yen's slide, leaving authorities to threaten direct currency intervention.</li><li><strong>European Central Bank:</strong> Rates have risen to 2.5% as Middle East conflicts drive oil prices higher, extending inflation forecasts into 2027.</li><li><strong>Bank of England:</strong> The BoE has launched a multiyear plan to unwind quantitative easing (QE) gilt purchases by 2034.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Independence at risk:</strong> US Treasury Secretary Scott Bessent’s comments on the BoJ and Trump’s demands on the Fed signal a shift toward state-directed finance.</li><li><strong>Data noise:</strong> Social media echo chambers are distorting consumer inflation expectations, making traditional economic surveys less reliable for policymakers.</li><li><strong>The QE hangover:</strong> Despite quantitative tightening (QT) efforts, central bank balance sheets are expected to remain structurally larger than pre-pandemic levels.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Oil volatility:</strong> Surging energy prices may force the BoE and ECB into additional unexpected rate hikes.</li><li><strong>Leadership shifts:</strong> Eurozone governments are currently negotiating a \"grand package\" to replace Christine Lagarde at the ECB.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven infrastructure and asset management as traditional trading revenues plateau.</p><p><strong>Why it matters:</strong> Wall Street is shifting capital from volatile trading desks to long-term AI bets and wealth management to sustain growth. Simultaneously, a deregulatory shift under the Trump administration is narrowing the scope of federal oversight.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Infrastructure:</strong> Morgan Stanley is leading the financing of AI data centers; banks are offloading $15bn in Anthropic debt to free up lending capacity.</li><li><strong>Efficiency:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven productivity gains at law firms.</li><li><strong>Revenue:</strong> Semiconductor investments in Asia are driving record equities growth for US lenders.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulatory push:</strong> US regulators are narrowing enforcement to focus strictly on financial risks.</li><li><strong>Political ties:</strong> A Trump family crypto venture received a banking license, while Bank of America pledged $250bn to \"America First\" projects.</li><li><strong>Stress tests:</strong> Critics are calling for the end of bank stress tests, arguing they provide a misleading sense of security.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn.</li><li><strong>Digital Assets:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with tokenized systems.</li><li><strong>Wealth Management:</strong> Morgan Stanley generated $74bn in Q2 assets via IPO underwriting for firms like SpaceX.</li></ul><p><strong>Between the lines:</strong> The \"trading bonanza\" is ending. Banks are aggressively poaching talent (e.g., JPMorgan hiring from BofA) and diversifying into private credit and AI to replace shrinking margins in traditional markets.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>19 Sep 2026 14:02 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
