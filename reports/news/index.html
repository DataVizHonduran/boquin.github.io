/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and supply chain bottlenecks are driving oil prices higher while forcing a strategic pivot in critical mineral sourcing.</p><p><strong>Why it matters:</strong></p><ul><li>Middle East conflict is choking the Strait of Hormuz, creating a tanker shortage that threatens to push crude toward $200 a barrel.</li><li>Depleted global stockpiles may take two years to rebuild, leaving markets hypersensitive to any further disruption.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$2 billion:</strong> The gamble a US oil trader is taking on tankers to bypass Hormuz and spur Asian refining.</li><li><strong>€2.2 billion:</strong> The loss posted by Ineos' chemicals division, offset by its oil and gas earnings.</li><li><strong>$67 billion:</strong> The value of the NextEra-Dominion utility deal facing regulatory backlash in Virginia.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Strategic decoupling:</strong> The rise of startups like Hertha Metals signals a push to break China's monopoly on high-purity iron for rare earth magnets.</li><li><strong>Legal warfare:</strong> Big Oil is shifting its battle to the US Supreme Court to block state-led climate damage claims.</li><li><strong>Investment paradox:</strong> Despite war risks, majors like TotalEnergies and ExxonMobil are aggressively pursuing Middle East and Caribbean offshore projects.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Aramco's pivot:</strong> Saudi Arabia is deciding whether to export its growing gas surplus from the Jafurah field or use it for domestic financing.</li><li><strong>Policy tension:</strong> US administration efforts to quell fuel inflation via diesel limits face criticism for prioritizing short-term price drops over long-term stability.</li></ul>", "corporate earnings and results": "<p>AI chip demand is driving a massive divergence in corporate earnings.</p><p><strong>Why it matters:</strong> Hardware providers are seeing immediate windfall profits from the AI build-out, while software giants face scaling costs and revenue misses.</p><p><strong>By the numbers</strong></p><ul><li><strong>Samsung:</strong> Profits surged ninefold to $80bn, fueled by AI memory chip demand.</li><li><strong>OpenAI:</strong> Annualized revenues are approaching $50bn, trailing the $70bn previously reported.</li><li><strong>Fast Retailing (Uniqlo):</strong> Annual revenue jumped 16.6% to $25bn.</li><li><strong>EY:</strong> Annual revenue rose 4.7% to $57bn.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Gap:</strong> Samsung's record earnings prove the \"picks and shovels\" phase of AI is highly lucrative. OpenAI's revenue correction suggests the monetization of AI services is slower than hyped.</li><li><strong>Operational Headwinds:</strong> EasyJet is cutting 700,000 winter seats to offset fuel costs, signaling a squeeze on budget travel margins.</li><li><strong>Market Consolidation:</strong> Starbucks exploring a Chipotle takeover suggests a push for scale in the restaurant sector to combat rising costs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Agent Race:</strong> Big Tech is pivoting from chatbots to \"AI agents\" to find new revenue streams.</li><li><strong>Regulatory Risk:</strong> Deloitte's £6mn fine for audit failures highlights increasing scrutiny on professional services firms.</li></ul>", "middle east war": "<p>The Middle East conflict is expanding into a multi-front regional war with severe global economic spillover.</p><p><strong>Why it matters:</strong> Houthi missile strikes on Saudi Arabia and Iranian threats to shipping are destabilizing global energy markets and forcing a realignment of military alliances.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>New Alliances:</strong> Saudi Arabia, Pakistan, and Turkey triggered a mutual defense pact following Houthi attacks on Riyadh and Aden.</ es.</li><li><strong>Fiscal Strain:</strong> French officials warn the country risks being \"strangled by interest rates\" as bond yields climb.</li></ul><p><strong>Between the lines</strong> The traditional \"taboo\" is breaking: central banks are acknowledging that monetary policy impacts supply, not just demand. This shift suggests a more complex, less predictable approach to managing inflation moving forward.</p><p><strong>What's next</strong></p><ul><li><strong>Fed Pivot:</strong> Markets are pricing in a hold for October, though forecasters anticipate \"insurance increases\" by 2026.</li><li><strong>ECB Reshuffle:</strong> The early departure of Isabel Schnabel to the IMF will trigger a leadership shake-up.</li><li><strong>Remit Review:</strong> UK MPs are questioning if the Bank of England's current mandate is \"fit for purpose\" amid rising populism.</li></ul>", "us banks": "<p>US banks are pivoting from traditional lending toward high-margin trading, asset management, and AI-driven efficiency.</p><p><strong>Why it matters:</strong> Regulatory shifts and technological disruption are forcing banks to trade stability for agility to prevent talent poaching and deposit flight.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>The Risk:</strong> AI agents may cost banks $500bn by enabling savers to automatically migrate funds to higher-yielding accounts.</li><li><strong>The Opportunity:</strong> Banks are demanding lower fees from law firms, arguing AI has slashed the time required for routine legal work.</li><li><strong>The Exposure:</strong> Wall Street is financing massive AI infrastructure, including $15bn in debt for Anthropic data centers.</li></ul><p><strong>Strategic Shifts</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is expanding its footprint via a $2.3bn acquisition of ETF provider Neos.</li><li><strong>Talent War:</strong> Citi is shortening junior analyst programs to two years to stop private equity firms from poaching young bankers.</li><li><strong>Client Mix:</strong> Banks are increasingly acting as \"cash cows\" for hedge funds, earning massive fees from prime brokerage without taking the underlying directional bets.</li></ul><p><strong>Regulatory Landscape</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB Aftermath:</strong> Post-mortems reveal a \"culture of risk aversion\" among regulators that contributed to the Silicon Valley Bank collapse.</li><li><strong>New Entrants:</strong> Tech-focused startups like Erebor are filling the void left by SVB, surging to $7bn in deposits.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$74bn:</strong> Wealth management assets gained by Morgan Stanley following high-profile IPOs like SpaceX.</li><li><strong>$250bn:</strong> Bank of America's commitment to US projects to align with \"America First\" policies.</li><li><strong>38%:</strong> The drop in Shein shares since its Hong Kong listing, despite a $220mn investment by Goldman Sachs.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>08 Oct 2026 17:32 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
