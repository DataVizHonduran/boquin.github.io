ration of political cover, triggering a shift toward diplomacy and austerity.</p><p><strong>The pivot</strong></p><ul><li><strong>Funding cuts:</strong> President Trump announced an end to $4 billion in annual military aid to Israel by year-end.</li><li><strong>Diplomatic push:</strong> Qatar is mediating an interim agreement between Washington and Tehran to end the conflict.</li><li><strong>Political fallout:</strong> VP JD Vance explicitly linked the Republican midterm defeat to public anger over the Iran war.</li></ul><p><strong>The risks</strong></p><ul><li><strong>Digital threats:</strong> Iran-linked vessels are positioning over subsea cables in the Gulf of Oman, signaling potential strikes on digital infrastructure.</li><li><strong>Russian ties:</strong> Moscow has deepened military support for Tehran, including a missile launcher deal, despite the Ukraine war.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100:</strong> The threshold crude oil has fallen below as markets bet on a peace deal.</li><li><strong>$4B:</strong> The amount of annual U.S. aid to Israel slated for termination.</li></ul><p><strong>What's next:</strong> Watch for a formal interim deal between the U.S. and Iran as mediators accelerate talks to stabilize global energy markets.</p>", "shipping": "<p>Global shipping is fracturing under the weight of geopolitical conflict and climate change.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are forcing a massive redistribution of trade routes, spiking operational costs and threatening global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has targeted 24 vessels in two weeks. Captains now command up to $100,000 monthly to transit the area.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route. Russia is diverting grain to Arctic ports to bypass combat zones.</li><li><strong>Gulf of Oman: rong>The BRICS pivot:</strong> The bloc is finding rare unity based on shared opposition to U.S. sanctions and tariffs, shifting the global economic center of gravity.</li><li>  <strong>Middle power agency:</strong> Smaller nations are no longer passive; they are actively diversifying supply chains to avoid becoming hostages to Great Power geopolitics.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>GDP Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li>  <strong>Security cost:</strong> European allies are realizing the U.S. may no longer be willing to underwrite global defense, regardless of who holds the presidency.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Managed friction:</strong> Expect continued high-level summits that provide tactical stability without achieving a broad détente.</li><li>  <strong>Fragmentation:</strong> A move toward \"economic security\" will likely result in bifurcated supply chains and a permanent decline in multilateral cooperation.</li></ul>", "us elections": "<p>Democrats secured a historic \"blue wave\" victory in the U.S. midterms, dealing a severe blow to the Trump administration and its billionaire backers.</p><p><strong>Why it matters:</strong> The sweep signals a public rejection of Trump’s economic agenda and shifts the political landscape toward progressive governance.</p><p><strong>By the numbers</strong></p><ul><li><strong>$300M+:</strong> Amount spent by Wall Street mega-donors on Republican campaigns with little to no effect.</li><li><strong>$120B:</strong> Estimated loss in net worth for Elon Musk following the election results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market volatility:</strong> Global stocks and chip sectors plummeted as investors fear the new Democratic majority will slow AI data center buildouts.</li><li><strong>Economic disconnect:</strong> Voters prioritized personal affordability ging as a theoretical alternative to current frameworks.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual pressure: leveraging AI to drive efficiency while preventing that same technology from triggering a mass exodus of deposits to higher-yield competitors.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>The Risk:</strong> AI agents could cost banks $500 billion by automatically shifting customer deposits to better rates.</li><li><strong>The Response:</strong> Citi and other lenders are restricting AI agent access to accounts to protect deposit margins.</li><li><strong>The Upside:</strong> Regulators are exploring AI to identify cultural risks and systemic weaknesses to prevent another SVB-style collapse.</li></ul><p><strong>Talent & Leadership</strong></p><ul><li><strong>Goldman Sachs:</strong> Elevating a record number of engineers to partner and issuing $500 million in executive bonuses to secure top talent.</li><li><strong>Citi:</strong> Shortening the junior analyst program to two years to stop private equity firms from poaching young bankers.</li><li><strong>Evercore:</strong> Implementing a new co-president structure to stabilize long-term leadership.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li><li><strong>$350 million:</strong> Amex fine for systemic failures in reporting $13 billion in suspicious transactions.</li><li><strong>17%:</strong> Drop in Bank of America profits following a $1.2 billion money laundering fine.</li><li><strong>$7 billion:</strong> Deposits surged into tech-focused startup bank Erebor.</li></ul><p><strong>Between the lines</strong> The \"cash cow\" of current trading profits is not coming from bank bets, but from a trillion-dollar hedge fund borrowing spree. As this streak cools, /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>06 Nov 2026 17:41 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
