.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical volatility and regulatory friction are destabilizing global energy supplies and investment.</p><p><strong>Why it matters:</strong></p><ul><li>Supply disruptions in the Strait of Hormuz threaten immediate price spikes for oil and LNG.</li><li>Regulatory delays in the EU reflect a growing conflict between climate mandates and industrial viability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Supply risks:</strong> Hormuz closures are depleting buffer stocks, leaving oil traders with minimal protection against price shocks.</li><li><strong>Strategic pivots:</strong> US firms including Chevron and ConocoPhillips are returning to Iraq and eyeing Venezuela to secure reserves.</li><li><strong>Diplomatic cracks:</strong> Greece is blocking EU sanctions on Russia to protect specific LNG shipping interests.</li></ul><p><strong>The mineral race</strong></p><ul><li>China's export controls on rare earths are triggering resource nationalism and distorting global markets.</li><li>India is diversifying uranium and critical mineral sources to mitigate risks from the Iran conflict.</li><li>Security failures in Pakistan are threatening China-backed copper mining operations.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>£5.7bn:</strong> The rejected bid for DCC, which shareholders claim significantly undervalues the group.</li><li><strong>12 months:</strong> The window Thames Water warns it can survive before requiring recapitalization.</li><li><strong>Century high:</strong> The current pace of energy IPOs, driven by investor interest in the AI power boom.</li></ul><p><strong>What's next</strong></p><ul><li>The EU will likely extend free carbon allowances to heavy emitters to prevent industrial collapse.</li><li>The UK government is expected to announce a state-control plan for Thames Water.</li></ul>", "corporate earnings and results": "<p>AI infrastructure spending is decoupling corporate earnings from traditional consumer growth.</p><p><strong>Why it matters:</strong> Massive capital expenditure in AI is fueling bank revenues and tech valuations while traditional sectors hit growth ceilings.</p><p><strong>By the numbers</strong></p><ul><li><strong>$145 billion:</strong> Meta's total infrastructure spend.</li><li><strong>$10 billion:</strong> Potential Meta-Anthropic data center deal.</li><li><strong>£900,000:</strong> Projected annual pay for PwC partners despite a consulting slump.</li><li><strong>3 years:</strong> The period since Netflix saw stronger revenue growth forecasts.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI volatility:</strong> Chip stocks suffered their worst week in over a year as momentum trades backfired.</li><li><strong>Platform erosion:</strong> Delivery apps are stripping market share and margins from large corporate pizza chains.</li><li><strong>Market shifts:</strong> Apple's brief ascent as the world's most valuable company signals a temporary hedge against AI-specific sell-offs.</li></ul><p><strong>What's next</strong></p><ul><li>Investors will monitor if the London IPO market can sustain its recovery through listings like Reformation.</li><li>Wall Street banks will rely on Asia-based semiconductor investments to maintain regional revenue growth.</li></ul>", "middle east war": "<p>The U.S. and Iran are engaged in a direct military conflict over the Strait of Hormuz.</p><p><strong>Why it matters:</strong></p><ul><li>Control of the waterway dictates global oil supplies and energy pricing.</li><li>Tehran believes escalation will force Washington to grant security and economic concessions.</li></ul><p><strong>By the numbers</strong></p><ul><li>$87: Brent crude price following renewed strikes.</li><li>20%: The abandoned U.S. proposed fee on Hormuz cargo.</li><li>$3.3 billion: Annual U.S. aid to Israel facing Democratic opposition.</li></ul><p><strong>Between the lines</strong></p><ul><li>Washington is hitting targets deeper inside Iran to counter cruise missile attacks on tankers.</li><li>Tehran is leveraging cyber attacks and ad tech to track U.S. military personnel.</li><li>Iraq's new leader, Ali al-Zaidi, is attempting to maintain ties with both Washington and Tehran.</li></ul><p><strong>What's next</strong></p><ul><li>The U.S. will pivot from cargo fees to a \"Gulf investment\" strategy to stabilize the region.</li><li>Military analysts warn that air strikes alone cannot change Tehran's strategic behavior.</li></ul>", "shipping": "<p>Geopolitical conflict and regulatory shifts are destabilizing global shipping routes.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the Black Sea disrupts critical energy and food supplies. Trade wars and sanctions are forcing vessels to adopt riskier, longer routes.</p><p><strong>By the numbers</strong></p><ul><li>$4 billion: Revenue Greek firms earned transporting Russian oil over three years.</li><li>7%: Drop in Maersk shares as Suez Canal reopening threatens freight rates.</li><li>4x: Increase in Hormuz transits following a fragile US-Iran ceasefire.</li></ul><p><strong>Between the lines</strong></p><ul><li>The green transition is stalling; shipowners are returning to nuclear and fossil fuels.</li><li>Dubai's new port project signals a long-term lack of trust in the Strait of Hormuz.</li><li>Sanctioned \"shadow tankers\" are avoiding the English Channel to evade naval interceptions.</li></ul><p><strong>What's next</strong></p><ul><li>EU carbon fee hikes will likely increase tensions with global trading partners.</li><li>Ukraine's drone campaign in the Sea of Azov will continue to target Russian fuel logistics.</li></ul>", "artificial intelligence": "<p>The AI boom is entering a volatile phase of market correction and intensifying global rivalry.</p><p><strong>Why it matters:</strong> Investors are questioning the timeline for AI monetization, while China is rapidly closing the technical gap in frontier models.</p><p><strong>By the numbers</strong></p><ul><li>$1 trillion: Market value wiped from SpaceX as shares slip below listing price.</li><li>$2 billion: Capital raised by Mira Murati’s new start-up, Thinking Machines.</li><li>$12 billion: Valuation of Thinking Machines at launch.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical shift:</strong> Chinese models like Kimi K3 are narrowing the gap with U.S. rivals, offering specialized capabilities at a fraction of the cost.</li><li><strong>Corporate warfare:</strong> Apple is using aggressive legal tactics against OpenAI to protect trade secrets.</li><li><strong>Labor evolution:</strong> AI is redefining entry-level professional roles rather than eliminating them, forcing a rewrite of apprenticeship and retention strategies.</li></ul><p><strong>What's next</strong></p><ul><li>Tech valuations will fluctuate as IBM and other firms signal that AI revenue growth may lag behind hyperscaler projections.</li><li>Increased scrutiny over the environmental costs and energy demands of AI data centers.</li></ul>", "us-china relations": "<p>The US and China are engaged in a volatile cycle of military provocation and economic coercion.</p><p><strong>Why it matters:</strong></p><ul><li>Military signaling in the Pacific increases the risk of accidental conflict.</li><li>Trade warfare over critical minerals threatens global industrial stability.</li></ul><p><strong>Between the lines</strong></p><ul><li>Beijing is positioning itself as a stable alternative to a volatile US administration.</li><li>China is utilizing a \"tribute system\" to expand influence without resorting to direct war.</li></ul><p><strong>The friction points</strong></p><ul><li>Ballistic missile launches into Pacific nuclear-free zones.</li><li>Detentions of foreign nationals over rare earth smuggling.</li><li>IMF warnings that \"tit-for-tat\" trade policies are self-defeating.</li></ul><p><strong>What's next</strong></p><ul><li>Further escalation of critical mineral export controls.</li><li>Increased diplomatic outreach from non-aligned nations to Beijing.</li></ul>", "us elections": "<p>Internal fractures and populist volatility are defining the US midterm elections.</p><p><strong>Why it matters:</strong></p><ul><li>Democratic instability and socialist surges weaken the party's unified opposition.</li><li>Trump's foreign and economic policies are alienating core bases, including evangelicals and rural voters.</li></ul><p><strong>Between the lines</strong></p><ul><li>The Democratic party is split between establishment leadership and a rising socialist insurgency in New York, Colorado, and Wisconsin.</li><li>Trump's \"hyper-populist\" economic playbook and the Iran conflict are depressing his approval ratings.</li><li>Silicon Valley billionaires are leveraging AI lobbying to defeat pro-regulation candidates in House races.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California:</strong> Steve Hilton and Xavier Becerra face off for governor.</li><li><strong>Maine:</strong> Democrats must replace candidate Graham Platner following sexual assault allegations.</li><li><strong>Rural Shift:</strong> High tariffs and fuel prices are driving a \"lobster revolt\" against Trump in Maine.</li></ul>", "german politics": "<p>Germany is pivoting to a debt-funded military posture to lead European security.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic aversion to debt to fill the vacuum left by waning U.S. support. This shift creates friction with EU partners and fuels domestic political polarization.</p><p><strong>By the numbers</strong></p><ul><li><strong>€800 billion:</strong> Planned borrowing for rearmament.</li><li><strong>€10 billion:</strong> Proposed tax cuts to stimulate growth.</li><li><strong>40%:</strong> Berlin's new stake in tank maker KNDS.</li><li><strong>€500 billion:</strong> Infrastructure fund currently underutilized by ministries.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Defense friction:</strong> Berlin is distancing itself from France in fighter jet projects to gain control proportional to its financial contributions.</li><li><strong>Political volatility:</strong> Chancellor Friedrich Merz faces a dual threat from the rising AfD and internal conservative rivals like Hendrik Wüst.</li><li><strong>Security risks:</strong> A surge in left-wing terrorism is emerging as a reaction to far-right extremism and Middle East tensions.</li></ul><p><strong>What's next</strong></p><ul><li>The Bundestag must decide on minesweeper deployment for the Strait of Hormuz mission.</li><li>Berlin will oversee the IPO of KNDS following its equity acquisition.</li><li>The government will move to establish a Swedish-style capital markets pension fund.</li></ul>", "central banks": "<p>Global central banks are restructuring their operational frameworks to combat persistent inflation and political interference.</p><p><strong>Why it matters:</strong> Missteps in quantitative tightening (QT) are driving up government borrowing costs. Political pressure on central bank independence threatens long-term price stability and market confidence.</p><p><strong>Between the lines</strong></p><ul><li><strong>The Fed's overhaul:</strong> New chair Kevin Warsh is revamping forward guidance and creating task forces led by business and academic leaders to prioritize productivity-based growth.</li><li><strong>Political friction:</strong> Legal battles over the removal of Fed governors signal an escalating conflict between the White House and the central bank.</li><li><strong>The trust deficit:</strong> A loss of faith in the Fed and Bank of England (BoE) is potentially driving up long-run inflation expectations.</li></ul><p><strong>Global divergence</strong></p><ul><li><strong>Bank of England:</strong> Facing investor pressure to slow long-dated bond sales to lower borrowing costs.</li><li><strong>ECB:</strong> Shifting toward a more moderate inflation-fighting stance, though internal divides persist over interest rate holds.</li><li><strong>Bank of Japan:</strong> Focusing on currency intervention and urging domestic investment to stabilize the yen.</li></ul><p><strong>What's next</strong></p><ul><li>Markets are awaiting the Fed's new communication framework to gauge future rate paths.</li><li>The BoE may be forced to rethink its QT program if the gilt market remains volatile.</li><li>Regulators are exploring \"kill switches\" for AI-powered trading to prevent market herding.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>18 Jul 2026 11:35 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
