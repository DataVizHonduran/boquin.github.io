const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Middle East is fundamentally shifting the global energy map.</p><p><strong>Why it matters:</strong> Conflict in the Strait of Hormuz is driving Brent crude to $110 and forcing a rapid pivot toward Western Hemisphere production.</p><p><strong>The shift in power</strong></p><ul><li><strong>Americas surge:</strong> Investment is flooding into Canada and Argentina as buyers replace lost Middle Eastern supply.</li><li><strong>Windfall gains:</strong> \"Big Oil\" is sitting on a $32 billion surplus generated by soaring prices.</li><li><strong>Strategic pivots:</strong> The EU has abandoned its push for a global Arctic drilling ban to secure energy supplies.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>UK deadlock:</strong> Producers are threatening to halt investment if the $4bn Rosebank field remains blocked.</li><li><strong>US politics:</strong> Rising energy costs are undermining the Trump administration's \"cheap energy\" narrative.</li><li><strong>Russia deal:</strong> The US has exempted Russia from certain energy sanctions in exchange for diesel supplies.</li></ul><p><strong>Between the lines</strong> The \"green transition\" is colliding with security realities. While AI and war strengthen the case for clean power, the immediate crisis is forcing a return to hydrocarbon pragmatism and strategic mineral stockpiling.</p><p><strong>What's next</strong></p><ul><li><strong>Critical minerals:</strong> Expect increased US stockpiling of copper and tungsten to counter Chinese export restrictions.</li><li><strong>Nuclear race:</strong> The West is accelerating fusion commercialization to break long-term dependence on volatile fossil fuel regions.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are under pressure as geopolitical instability, tax hikes, and AI valuation bubbles trigger widespread workforce reductions.</p><p><strong>Why it matters:</strong> Rising operational costs and shifting regulatory landscapes are forcing firms to prioritize lean margins over growth.</p><p><strong>The workforce squeeze</strong></p><ul><li><strong>Flutter:</strong> Cutting 1,000+ jobs (15% of UK/Ireland staff) following a UK gambling tax increase.</li><li><strong>NAB:</strong> Slashing 2,500 jobs (6% of workforce) due to a souring sector outlook.</li><li><strong>NatWest:</strong> Mandating increased office attendance for 30,000 staff to reverse remote-first trends.</li></ul><p><strong>AI and Tech volatility</strong></p><ul><li><strong>Valuations:</strong> South Korea's Elice tumbled 32% on its debut, signaling investor skepticism toward AI pricing.</li><li><strong>Infrastructure:</strong> Microsoft's reversal on the Nscale deal highlights instability in the data center pipeline.</li><li><strong>Risk:</strong> A surge in default insurance trading suggests growing fears over AI-driven debt.</li></ul><p><strong>Macro headwinds</strong></p><ul><li><strong>Housing:</strong> US pending home sales hit a record low after a 7.3% September drop driven by mortgage rates.</li><li><strong>Supply Chain:</strong> Japan faces a critical rare earth shortage as China restricts yttrium exports.</li><li><strong>Insurance:</strong> French riots are now categorized as \"natural catastrophes,\" increasing loss projections for insurers.</li></ul><p><strong>What's next:</strong> Expect activist investors to intensify pressure for cost-cutting, as seen with Starboard's push for $100 million in savings at Honeywell's Solstice.</p>", "middle east war": "<p>The Middle East is entering a phase of acute instability as Houthi aggression forces Saudi Arabia to rely on Western military intervention.</p><p><strong>Why it matters:</strong> Escalating drone and missile strikes are disrupting Saudi economic ambitions and threatening critical AI infrastructure. This volatility is triggering capital flight and destabilizing regional diplomatic hubs.</p><p><strong>The Saudi Crisis</strong></p><ul><li><strong>Military shift:</strong> The UK is deploying jets to defend the Kingdom after Houthi strikes killed Saudi troops and targeted Riyadh.</li><li><strong>Economic fallout:</strong> Saudi Arabia postponed its \"Davos in the desert\" (Future Investment Initiative) due to security threats.</li><li><strong>Capital flight:</strong> Private jet fees from Saudi Arabia have spiked 50% as wealthy residents flee the Kingdom.</li></ul><p><strong>Regional Flashpoints</strong></p><ul><li><strong>Iran:</strong> Hardliners are calling for the development of nuclear weapons following the death of Supreme Leader Ali Khamenei.</li><li><strong>Gaza:</strong> The UN is cutting food aid to 500,000 people as ceasefire negotiations stall.</li><li><strong>West Bank:</strong> Violence is escalating, with Israeli settlers attacking both Palestinians and European diplomats.</li></ul><p><strong>Between the lines</strong> The conflict is evolving from traditional territorial disputes into a war of infrastructure. The need for \"blast-resistant\" data centers suggests that AI and digital hubs are now primary military targets.</p><p><strong>What's next</strong></p><ul><li><strong>Israeli Elections:</strong> Arab Israeli voters are mobilizing to eject Netanyahu, while Donald Trump's endorsement provides a political lifeline.</li><li><strong>Egyptian Transition:</strong> President Sisi is formalizing a military-led succession plan for 2030 to ensure army control of the state.</li></ul>", "shipping": "<p>Geopolitical conflict and climate volatility are fracturing the global shipping order.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and Russian \"shadow fleet\" tactics are driving record freight costs and forcing a structural shift in trade routes.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East and ice melts.</li><li><strong>24:</strong> Vessels targeted by Iran in the Hormuz strait over a two-week period.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Shadow\" Shift:</strong> Russia is expanding its own fleet and using location-spoofing to bypass sanctions, eroding international maritime law.</li><li><strong>Asset Flipping:</strong> Old supertankers now command higher premiums than new builds because immediate availability outweighs vessel age.</li><li><strong>Strategic Pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM, while traders like Trafigura are IPO-ing shipping arms to capitalize on high rates.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route Diversion:</strong> Trade is shifting toward the Arctic and away from the Panama Canal due to drought and war.</li><li><strong>Cyber Risk:</strong> Increased vulnerability of satellite-linked navigation systems creates a new frontier for maritime sabotage.</li><li><strong>Green Transition:</strong> Falling biodiesel prices and the rise of ammonia/methanol may accelerate decarbonization despite geopolitical chaos.</li></ul>", "artificial intelligence": "<p>The AI investment boom is hitting a physical and financial wall.</p><p><strong>Why it matters:</strong> Massive capital expenditures on infrastructure are outpacing immediate returns, triggering investor anxiety and systemic risk.</p><p><strong>The friction points</strong></p><ul><li><strong>Infrastructure limits:</strong> A $10 trillion build-out is colliding with the \"unforgiving economics\" of the physical world.</li><li><strong>Financial hedging:</strong> Trading volumes for credit default swaps linked to Big Tech are surging as investors protect against a bubble burst.</li><li><strong>Regulatory tension:</strong> The Bank of England warns that autonomous AI agents pose a direct threat to global financial stability.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 billion:</strong> Potential sale price of Accenture's Chinese operations amid AI-driven consultancy shifts.</li><li><strong>5%:</strong> The portion of shares Anthropic is committing to a \"public benefit\" fund to quell safety backlash.</li><li><strong>94:</strong> Number of economists surveyed who predict a global AI-driven economic surge despite short-term volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Agent\" Era:</strong> The shift from chatbots to \"agents\" that strike deals and manage finances is forcing a legal and regulatory reckoning.</li><li><strong>Strategic Divergence:</strong> Industrial giants are splitting; some are pivoting to software (Siemens), while others double down on hardware (ABB).</li></ul><p><strong>What's next</strong></p><ul><li><strong>The IPO Litmus Test:</strong> Anthropic’s potential public offering will serve as a primary indicator of whether AI valuations are sustainable.</li><li><strong>Robotics Pivot:</strong> SoftBank is aggressively expanding into physical AI and robotics to diversify beyond pure software bets.</li></ul>", "us-china relations": "<p>The U.S.-China relationship has shifted from strategic competition to a zero-sum struggle for global primacy.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy increases the risk of systemic conflict. Both nations now prioritize relative gain over mutual stability, destabilizing global trade and security.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in Washington and Beijing is viewed as ill-suited for the far-sighted diplomacy required to avoid escalation.</li><li><strong>The \"Great Game\":</strong> Control is shifting toward forces beyond state command, including AI dominance and the influence of smaller, \"David-like\" powers.</li><li><strong>BRICS expansion:</strong> The bloc now exceeds the G7 in economic share, providing China a vehicle to build a parallel international order.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Economic shift:</strong> BRICS now accounts for a larger share of the global economy than the G7.</li><li><strong>AI lead:</strong> U.S. national data center projects are consolidating American dominance in AI hardware, despite global dispersion.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tactical engagement:</strong> Expect continued high-level summits, though these are viewed as risk-management tools rather than a return to détente.</li><li><strong>Sanction warfare:</strong> Beijing is signaling readiness to retaliate with \"all necessary measures\" if U.S. sanctions expand.</li><li><strong>Institutional flight:</strong> U.S. funding cuts are prompting international organizations to migrate from Geneva to Gulf or European capitals.</li></ul>", "us elections": "<p>Economic volatility and internal White House turmoil are eroding Republican confidence ahead of the midterm elections.</p><p><strong>Why it matters:</strong> High inflation and rising grocery prices are alienating swing voters, specifically within the Latino community, mirroring the same economic grievances that fueled Trump's previous victory.</p><p><strong>The economic drag</strong></p><ul><li><strong>Inflation:</strong> Soaring fuel and food costs are shifting independent voters toward Democrats.</li><li><strong>Trade:</strong> GOP candidates in swing districts are distancing themselves from Trump's tariffs to ensure political survival.</li><li><strong>Markets:</strong> Defense stocks are sliding as investors anticipate a Democratic sweep and a reversal of proposed military spending boosts.</li></ul><p><strong>Internal friction</strong></p><ul><li><strong>Personnel:</strong> The firing of press secretary Katie Zacharia after five days signals deepening administration chaos.</li><li><strong>Policy:</strong> Bipartisan opposition is mounting against Trump's diesel deal with Vladimir Putin.</li></ul><p><strong>The money trail</strong></p><ul><li><strong>Elon Musk:</strong> Now the GOP's largest donor, injecting $275 million to help the party retain Congress.</li><li><strong>State Power:</strong> Corporate donations are flooding attorneys-general races to create legal checks on federal policy.</li></ul><p><strong>What's next:</strong> Republicans are shifting ad spending into previously \"safe\" seats to counter polling trends that suggest a potential loss of the House and Senate.</p>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges across eastern Germany.</p><p><strong>Why it matters:</strong> The AfD's rise is paralyzing the German government, stalling critical pension and labor reforms and undermining Germany's leadership within the EU.</p><p><strong>The crisis points</strong></p><ul><li><strong>Coalition instability:</strong> The resignation of the labor minister signals deepening fractures within the governing coalition.</li><li><strong>Investment risk:</strong> Executives are wary of the political volatility ahead of Berlin's investment summit.</li><li><strong>EU leverage:</strong> Merz's poor regional election results have hobbled his authority in Brussels, threatening a €2tn budget deal.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Firsts:</strong> The AfD secured its first regional parliament president via secret support from established parties.</li><li><strong>Zeroes:</strong> The CDU lost all seats in the Mecklenburg-Vorpommern state parliament.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Firewall\" is leaking:</strong> Despite Merz's vow to block the far-right, allegations of CDU lawmakers trading votes with the AfD suggest internal compromise.</li><li><strong>The successor looms:</strong> Hendrik Wüst, the popular premier of North Rhine-Westphalia, is increasingly viewed as the viable alternative to the unpopular Merz.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Military pivot:</strong> Germany continues a historic shift toward rearmament and arms industry expansion.</li><li><strong>Diplomatic balancing:</strong> Berlin is maintaining high-stakes channels with both Russia and Turkey to manage regional instability.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control with systemic financial stability.</p><p><strong>Why it matters:</strong> Persistent energy costs and geopolitical tensions are driving bond yields higher, forcing policymakers to choose between fighting inflation and preventing a debt crisis.</p><p><strong>The current tension</strong></p><ul><li><strong>Rate volatility:</strong> The Fed and ECB are signaling a pause in rate hikes for October, though markets remain volatile.</li><li><strong>Divergent paths:</strong> While Western banks lean dovish, India's RBI has shifted to a \"tightening\" outlook to combat inflation.</li><li><strong>Bond stress:</strong> Rising Treasury issuance and Middle East tensions are pushing yields up, threatening to \"strangle\" high-debt nations like France.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Gold:</strong> Central banks hit their highest monthly gold purchases in nearly two years this September.</li><li><strong>Backstops:</strong> Only four regions (US, UK, Japan, Hong Kong) have credible public sector backstops for bank failures, per the FSB.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Credibility gap:</strong> Repeated US Treasury interventions risk creating moral hazard and eroding market trust.</li><li><strong>The \"Moneyness\" shift:</strong> US Treasuries are losing their status as both a security and a liquid money substitute.</li></ul><p><strong>What's next</strong></p><ul><li><strong>QT Pause:</strong> Pressure is mounting for the ECB to halt Quantitative Tightening to stabilize bond markets.</li><li><strong>Fed Transition:</strong> Public trust in the US central bank remains fragile following political attacks and leadership transitions.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as a trading boom cools and AI threatens deposit stability.</p><p><strong>Why it matters:</strong> Banks face a dual squeeze: regulatory fines are hitting the bottom line while AI agents risk triggering a mass exodus of deposits to higher-yielding competitors.</p><p><strong>The AI threat</strong></p><ul><li><strong>Deposit flight:</strong> Citi and other lenders are restricting AI agents to prevent automated shifts of billions in deposits.</li><li><strong>Cost risk:</strong> Analysts estimate AI agents could cost banks $500 billion by optimizing saver rates.</li><li><strong>Efficiency gains:</strong> Banks are now demanding lower legal fees from law firms, citing AI-driven productivity.</li></ul><p><strong>Financial performance</strong></p><ul><li><strong>Trading volatility:</strong> Goldman Sachs saw a 30% net income rise driven by equities, but analysts warn the record-breaking trading streak is cooling.</li><li><strong>Regulatory hits:</strong> BofA profits dropped 17% following a $1.2bn money laundering fine; Amex was fined $350mn for systemic reporting failures.</li><li><strong>New revenue:</strong> Prime brokerage is booming as hedge funds engage in a trillion-dollar borrowing spree.</li></ul><p><strong>Talent and Leadership</strong></p><ul><li><strong>Retention wars:</strong> Citi is shortening junior banker promotion paths to two years to prevent poaching by private equity.</li><li><strong>Succession:</strong> Evercore appointed its first co-presidents; Goldman Sachs maintains no definitive timeline for CEO David Solomon's departure.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>Market gaps:</strong> New entrants like Erebor are scaling rapidly (surpassing $7bn in deposits) to fill the void left by the SVB collapse.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>20 Oct 2026 15:17 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
