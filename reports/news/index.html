const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Middle East is colliding with a global energy transition, creating extreme volatility in oil markets and critical mineral supply chains.</p><p><strong>Why it matters:</strong></p><ul><li><strong>Supply shocks:</strong> Conflict in Iran is draining U.S. inventories and threatening the Strait of Hormuz, the world's most vital oil chokepoint.</li><li><strong>Strategic decoupling:</strong> The U.S., EU, and India are aggressively diversifying away from Russian nuclear fuel and Chinese battery minerals to ensure national security.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$4.1bn:</strong> Trafigura's net profit for Oct-March, driven by war-induced market volatility.</li><li><strong>2004:</strong> The year of the previous lowest U.S. oil stock levels, now matched due to the Iran crisis.</li><li><strong>87%:</strong> The greenhouse gas emission cut Ed Miliband is proposing for the UK by 2040.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>The Hormuz Hedge:</strong> Gulf states and ADNOC are fast-tracking pipelines to bypass the Strait of Hormuz, signaling a long-term lack of confidence in regional maritime security.</li><li><strong>China's Shield:</strong> Falling Chinese oil imports are currently the only factor preventing crude from surging past $100 a barrel.</li><li><strong>Nuclear Pivot:</strong> While the UK outsources SMR components to South Korea, India is opening its nuclear sector to private giants like Tata and Adani.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Inventory Crisis:</strong> Markets will watch if \"critically low\" U.S. stocks trigger a price spike despite China's cooling demand.</li><li><strong>Mineral War:</strong> Expect increased trade restrictions as China targets U.S. tungsten and the West accelerates lithium drilling in Texas and Europe.</li></ul>", "corporate earnings and results": "<p>SpaceX is preparing a historic $75 billion IPO with an unprecedented focus on retail investors.</p><p><strong>Why it matters:</strong> The move democratizes access to a high-valuation private giant while signaling massive retail appetite for \"prestige\" tech assets.</p><p><strong>By the numbers</strong></p><ul><li><strong>25%:</strong> The portion of the float SpaceX may reserve for individual investors.</li><li><strong>30,000+:</strong> UK retail investors already registered for the offering.</li><li><strong>£189,000:</strong> New starting salary for junior lawyers at Quinn Emanuel London, signaling a legal talent pay war.</li><li><strong>4 million:</strong> Projected first-half unit sales for Raspberry Pi, driven by AI hardware demand.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Divergence:</strong> While hardware (Raspberry Pi) wins, service-based sectors (call centers) face hedge fund bets against them due to automation risk.</li><li><strong>Corporate Governance:</strong> Traditional models are fracturing. Heineken investors are demanding outside CEOs, and the BBC is cutting 2,000 jobs to survive polarization.</li><li><strong>Regulatory Friction:</strong> Investors are aggressively lobbying the SEC to maintain quarterly reporting requirements to ensure transparency.</li></ul><p><strong>What's next</strong></p><ul><li><strong>M&A Shifts:</strong> Private equity remains aggressive but faces hurdles, evidenced by Apollo's failed £1.5bn Bodycote bid and Oxford BioMedica's openness to takeovers.</li><li><strong>Supply Chain Pivot:</strong> Companies are abandoning \"just-in-time\" logistics for \"resilience\" models to hedge against tariffs and geopolitical shocks.</li></ul>", "middle east war": "<p>The Middle East is locked in a volatile cycle of fragile ceasefires and escalating proxy warfare.</p><p><strong>Why it matters:</strong> Unstable truces between Israel and Hizbollah, coupled with Iranian aggression, threaten global shipping lanes and force US political intervention.</p><p><strong>The friction points</strong></p><ul><li><strong>Ceasefire instability:</strong> Israel and Lebanon agreed to a US-brokered truce, but Hizbollah has rejected terms while Israel continues offensive operations.</li><li><strong>Iranian aggression:</strong> Tehran is utilizing minors as agents of mayhem across Europe and Israel and has targeted Kuwaiti infrastructure.</li><li><strong>US constraints:</strong> The Republican-led House has voted to block the president from launching further strikes in the region without congressional approval.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic fallout:</strong> Strategic instability in the Strait of Hormuz is driving shipping tycoons to propose \"tolls\" to avoid total waterway closures.</li><li><strong>Proxy shifts:</strong> Russia and Iran are increasingly outsourcing hostile acts to minors to evade traditional military detection.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic pressure:</strong> The US will attempt to enforce the Lebanon truce to prevent a full-scale regional war.</li><li><strong>Financial ripple effects:</strong> Central banks in the UK and EU are weighing rate hikes to counter inflation spikes driven by regional energy shocks.</li></ul>", "shipping": "<p>The Strait of Hormuz remains a volatile bottleneck, driving global energy volatility and reshaping trade routes.</p><p><strong>Why it matters:</strong> Disruptions in the Gulf trigger immediate spikes in freight costs and force nations to pivot to alternative energy sources to avoid economic collapse.</p><p><strong>The Hormuz crisis</strong></p><ul><li><strong>Limited flow:</strong> Only a few vessels, including LNG tankers and Dynacom ships, are risking transit.</li><li><strong>Market impact:</strong> Brent crude dropped 6% recently after two China-bound supertankers successfully crossed.</li><li><strong>Operational failure:</strong> A $40bn US insurance facility has seen zero uptake because ships lack naval escorts.</li></ul><p><strong>Systemic risks</strong></p><ul><li><strong>The \"Shadow Fleet\":</strong> Over half of sanctioned tankers are aging and pose high environmental disaster risks.</li><li><strong>Logistical shifts:</strong> Maersk reports costs have increased by $500 million per month.</li><li><strong>Alternative fuels:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Permanent shifts:</strong> The Panama Canal reports a 15% revenue increase, suggesting trade routes are being permanently rerouted away from conflict zones.</li><li><strong>Last-mile pivots:</strong> Retailers like Walmart are repurposing empty drugstores as stockrooms to bypass shipping delays and compete with Amazon.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> The Baltic Exchange faces a lawsuit from Mercuria over disputed tanker rates.</li><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to capture freight and offshore wind business as regional competition intensifies.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative hype cycle to a high-stakes infrastructure and integration war.</p><p><strong>Why it matters:</strong> Massive capital expenditures are creating extreme market volatility, while the integration of AI into national security and finance is introducing systemic vulnerabilities.</p><p><strong>The money trail</strong></p><ul><li><strong>SpaceX:</strong> Pitching a $1.78tn valuation for its IPO, driven by Goldman Sachs' projection of a 100-fold increase in AI revenue by 2030.</li><li><strong>Google:</strong> Upsizing equity raising to $85bn to fund AI spending.</li><li><strong>Broadcom:</strong> Suffered a $285bn valuation wipeout following a disappointing revenue outlook.</li><li><strong>Energy:</strong> NextEra and Dominion are merging into a $420bn giant to meet the power demands of AI.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Hardware:</strong> Nvidia is moving beyond data centers to target the laptop market, challenging Apple and Intel.</li><li><strong>Monetization:</strong> Meta is deploying AI agents to unlock new revenue streams within WhatsApp.</li><li><strong>Professional Services:</strong> Palantir and Kirkland & Ellis are building AI tools specifically for private equity fundraising.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Security:</strong> The UK regulator lists AI cybersecurity as a top banking threat; the NSA is utilizing Anthropic’s Mythos for cyber attacks.</li><li><strong>Infrastructure:</strong> US citizens show the lowest support among 15 major economies for data center expansion.</li><li><strong>Labor:</strong> The UK government warns of rising youth unemployment; translation work is becoming fragmented and \"de-skilled.\"</li></ul><p><strong>What's next</strong> Expect a widening gap between \"AI winners\" (Taiwan, South Korea) and laggards (India) as the market rewards hardware capability over general software hype.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony defined by asymmetry and strategic stalemate.</p><p><strong>Why it matters:</strong> Neither power is currently willing or able to assume the costs of global leadership, creating a governance vacuum that increases the risk of miscalculation and conflict.</p><p><strong>Between the lines</strong></p><ul><li><strong>Soft power shift:</strong> Beijing is leveraging U.S. diplomatic volatility to portray itself as a pillar of stability to foreign officials.</li><li><strong>Asymmetric leverage:</strong> Power is shifting from raw economic size to the ability to exploit imbalances in the global order.</li><li><strong>The Russia factor:</strong> Putin’s strategic errors have forced Russia into a one-sided dependency on China, strengthening Beijing's regional position.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Zero:</strong> The number of powers currently filling the leadership vacuum left by Washington's retreat from traditional multilateralism.</li><li><strong>Two:</strong> The primary actors trapped in a \"Thucydides Trap\" where a rising power threatens to displace a ruling power.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Middle power rise:</strong> Smaller nations are adopting \"armadillo\" strategies, seeking resilience over alignment.</li><li><strong>Institutional overhaul:</strong> Pressure is mounting to reinvent multilateral institutions that are currently failing to prevent \"might is right\" geopolitics.</li></ul>", "us elections": "<p>Trump's influence over the GOP is consolidating through primary victories, but his candidate choices are creating vulnerabilities for the general election.</p><p><strong>Why it matters:</strong></p><ul><li>Trump is successfully purging dissenters and installing \"Maga warriors,\" ensuring party loyalty.</li><li>These divisive candidates may alienate moderate and swing voters, handing Democrats an opening in key Senate races.</li></ul><p><strong>The Texas Tension</strong></p><ul><li>Ken Paxton's primary victory proves Trump's grip on the base.</li><li>Democrats view Paxton's controversial profile as a liability that makes the Texas Senate seat competitive.</li></ul><p><strong>Battleground Shifts</strong></p><ul><li><strong>Maine:</strong> Tariff-driven price hikes in the lobster industry are eroding Trump's support among rural voters.</li><li><strong>Pennsylvania:</strong> A populist shift toward working-class messaging is reshaping Democratic nominations in swing districts.</li><li><strong>Kentucky:</strong> The defeat of Thomas Massie signals the end of \"maverick\" Republicanism in favor of total alignment with Trump.</li></ul><p><strong>Internal Friction</strong></p><ul><li><strong>GOP:</strong> Senators are resisting Trump's $1.8bn \"anti-weaponisation\" fund, signaling a rare break over spending.</li><li><strong>Democrats:</strong> A DNC autopsy blames White House disunity for previous losses, while the party struggles to move past internal baggage.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The 2028 Horizon:</strong> JD Vance and Marco Rubio are already emerging as primary contenders for the future White House nomination.</li><li><strong>Judicial Impact:</strong> Supreme Court rulings on redistricting and voting rights are deepening partisan polarization ahead of the midterms.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military leadership while facing severe diplomatic friction with the U.S.</p><p><strong>Why it matters:</strong> Berlin is abandoning its post-WWII pacifist tradition to secure Europe against Russia, but this rapid rearmament is straining its relationship with Donald Trump and alarming EU partners.</p><p><strong>The defense surge</strong></p><ul><li>Germany aims to hit the 3.5% GDP NATO spending target six years ahead of schedule.</li><li>Berlin is overhauling its procurement agency and buying a 40% stake in tank maker KNDS to accelerate production.</li><li>Rheinmetall has bid €12bn to rescue a failing warship project.</li></ul><p><strong>The Trump rift</strong></p><ul><li>Chancellor Friedrich Merz’s criticism of U.S. strategy in Iran has triggered a diplomatic crisis.</li><li>Trump is reviewing U.S. troop presence and may pull 5,000 soldiers from Germany.</li><li>Merz is attempting to salvage ties with a planned trip to Washington to secure Tomahawk missile purchases.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political:</strong> The far-right AfD is topping polls by leveraging voter anger over fuel prices.</li><li><strong>Leadership:</strong> Merz faces internal CDU pressure as Hendrik Wüst emerges as a more popular alternative for the chancellery.</li><li><strong>Fiscal:</strong> The Finance Ministry is threatening to cut funding for ministries failing to spend a €500bn infrastructure fund.</li></ul><p><strong>Between the lines</strong> Germany is attempting a \"double transition\": shifting from a civilian economic power to a military leader while trying to maintain its role as the EU's fiscal disciplinarian.</p><p><strong>What's next</strong> Watch for the KNDS listing this summer and the outcome of the U.S. troop review, which will determine if Germany can actually lead European defense without American backing.</p>", "central banks": "<p>Central banks are navigating a volatile transition marked by geopolitical instability and a shift away from U.S. dollar dominance.</p><p><strong>Why it matters:</strong> Persistent inflation and political pressure are eroding the perceived independence of monetary authorities. This instability is forcing a diversification of global reserves and a rethink of traditional policy signals.</p><p><strong>The shift in reserves</strong></p><ul><li>Gold has surpassed U.S. Treasuries as the top reserve asset, reaching a 27% share.</li><li>Central banks are increasingly diversifying into \"other\" reserve currencies to reduce dollar dependency.</li></ul><p><strong>Policy pressures</strong></p><ul><li><strong>The Fed:</strong> Incoming chair Kevin Warsh faces a \"complicated inheritance\" of rising inflation and pressure to roll back forward guidance.</li><li><strong>The ECB:</strong> Policymakers are preparing for June rate hikes as energy costs spill over into core inflation.</li><li><strong>The BoJ:</strong> Quantitative tightening continues via reduced bond purchases to stabilize volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political risk:</strong> Warnings from the ECB and former Fed chairs suggest that political interference and volatile trade policies threaten global financial stability.</li><li><strong>Fiscal constraints:</strong> Demographics and rising debt costs—exacerbated by conflicts in Iran—are limiting the ability of central banks to act independently.</li><li><strong>The \"Policy Put\":</strong> Investors can no longer assume central banks will automatically lower rates to rescue markets during shocks.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tech integration:</strong> Central banks are moving toward near-instantaneous cross-border settlements via blockchain prototypes.</li><li><strong>AI oversight:</strong> The ECB is aggressively auditing banks to mitigate systemic risks posed by AI models.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand balance sheets and international footprints.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing US giants to outpace European and Swiss rivals in lending and acquisitions.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via regulatory loosening.</li><li><strong>$20 billion:</strong> Potential acquisition budget for JPMorgan following a $50 billion capital surplus.</li><li><strong>$114 billion:</strong> Combined revenues for non-bank trading firms like Jane Street and Citadel, challenging traditional Wall Street dominance.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Banks are shifting risk. JPMorgan is offloading $4 billion in PE-linked loans, while others seek private deals to hedge AI-driven data center debt.</li><li><strong>Geopolitical friction:</strong> Security concerns are manifesting physically, evidenced by Morgan Stanley issuing China-only iPhones to Hong Kong staff.</li><li><strong>Retail aggression:</strong> JPMorgan is scaling its digital \"Chase\" brand into Germany to capture European retail market share.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Crypto integration:</strong> Morgan Stanley will launch spot crypto trading on E*Trade, further blurring the line between traditional finance and digital assets.</li><li><strong>Partnership models:</strong> Citi’s €15 billion deal with BlackRock signals a trend toward joint ventures to fund private equity dealmaking.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>05 Jun 2026 13:34 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
