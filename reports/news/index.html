/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing as geopolitical volatility drives short-term profits while long-term infrastructure shifts accelerate.</p><p><strong>Why it matters:</strong> War in the Middle East is spiking European gas prices and forcing strategic stockpiling. Simultaneously, the transition to renewables is creating a \"doom loop\" for traditional gas utilities and a race for critical mineral security.</p><p><strong>Geopolitical Flashpoints</strong></p><ul><li><strong>Iran/Middle East:</strong> Gas prices surged above €100 due to war fears; Iran is rationing domestic supply to avoid a total energy collapse.</li><li><strong>Russia/Ukraine:</strong> The White House is discussing postwar oil deals for U.S. majors to incentivize peace talks.</li><li><strong>Venezuela:</strong> A critical shortage of skilled engineers is stalling the country's oil revival.</li></ul><p><strong>The UK Energy Crisis</strong></p><ul><li><strong>Fiscal Strain:</strong> The OBR warns living standards will flatline as energy prices and taxes rise.</li><li><strong>Policy Pivot:</strong> The government is weighing waste-to-energy networks and the Rosebank oilfield to balance security with net-zero goals.</li><li><strong>Nuclear Risk:</strong> MPs labeled the £40bn Sizewell plant a \"terrible deal\" for taxpayers.</li></ul><p><strong>Corporate & Market Shifts</strong></p><ul><li><strong>Consolidation:</strong> EQT’s acquisition of Range Resources creates the largest natural gas producer in the U.S.</li><li><strong>Windfalls:</strong> European oil majors are increasing buybacks as war-driven profits peak.</li><li><strong>Strategic Pivot:</strong> CATL is expanding from battery sales into full-scale infrastructure.</li></ul><p><strong>What's next:</strong> Watch for the EU to mirror U.S. strategy by taking direct equity stakes in critical mineral projects to reduce reliance on China.</p>", "corporate earnings and results": "<p>AI spending concerns are triggering a volatility spike across Big Tech.</p><p><strong>Why it matters:</strong> Investors are questioning the immediate ROI of massive AI capital expenditures as traditional revenue streams, specifically Google Search, face disruption.</p><p><strong>The AI Divide</strong></p><ul><li><strong>Alphabet:</strong> Shares tumbled after \"AI mode\" eroded traditional search margins and profits missed expectations.</li><li><strong>Microsoft:</strong> Lower-than-expected capex fueled broader Nasdaq 100 losses (down 1.2%).</li><li><strong>Anthropic:</strong> Upcoming IPO hinges on balancing exponential growth against \"existential\" systemic risks.</li></ul><p><strong>Sector Divergence</strong></p><ul><li><strong>Healthcare:</strong> Eli Lilly hit record highs on surging weight-loss drug demand; conversely, consumer health giants cut guidance as flu rates dropped.</li><li><strong>Automotive:</strong> Volkswagen losses quadrupled due to China's slump, while BYD used exports to offset domestic weakness.</li><li><strong>Logistics:</strong> DoorDash is consolidating the US delivery market with a $17bn acquisition of Instacart.</li></ul><p><strong>Between the lines:</strong> The market is shifting from \"AI hype\" to \"AI accountability.\" Growth is no longer guaranteed by the mere mention of LLMs; it now requires proven monetization and margin protection.</p><p><strong>What's next:</strong> Market focus shifts to the Federal Reserve's rate hold and post-midterm economic resilience to determine if current tech dips are buying opportunities.</p>", "middle east war": "<p>Israel's inconclusive election results have created a power vacuum that increases the risk of regional escalation.</p><p><strong>Why it matters:</strong> A caretaker government lacks a stable mandate but retains military authority. This allows Prime Minister Benjamin Netanyahu to potentially launch preemptive strikes against Iran to secure political leverage during coalition talks.</p><p><strong>The political deadlock</strong></p><ul><li><strong>No majority:</strong> Neither Netanyahu’s far-right bloc nor the opposition secured a clear victory.</li><li><strong>Kingmakers:</strong> A surge in Palestinian-Israeli turnout has given Arab parties significant influence over government formation.</li><li><strong>Contested results:</strong> Netanyahu’s party alleges foreign interference, complicating the transition.</li></ul><p><strong>Regional flashpoints</strong></p><ul><li><strong>Iran:</strong> Tehran is rebuilding infrastructure while hosting Saudi, Pakistani, and Turkish officials to prevent further escalation.</li><li><strong>Shipping:</strong> Iran is threatening South Korean shipping in the Strait of Hormuz, signaling continued maritime volatility.</li><li><strong>Syria:</strong> Jordan recently launched uncoordinated air strikes against ISIS, highlighting fragmented regional security cooperation.</li></ul><p><strong>What's next:</strong> Watch for whether Netanyahu leverages \"security necessity\" to initiate a bombing campaign before a new coalition is finalized.</p>", "shipping": "<p>Global shipping is fracturing under the weight of geopolitical conflict and systemic security failures.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are driving record freight rates and forcing a massive redistribution of global trade routes.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to supertanker shortages.</li><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24.6 million:</strong> Average daily barrels exported from the Gulf, surpassing prewar levels via alternative routes.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as vessels avoid the Middle East.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic deception:</strong> Russia is coordinating \"ghost\" locations for tankers to bypass sanctions and maintain export flows.</li><li><strong>Market volatility:</strong> Old supertankers now command higher premiums than new builds because immediate availability outweighs vessel age.</li><li><strong>Security gaps:</strong> Cyberattacks on satellite links and Iranian strikes are rendering traditional naval protection windows insufficient.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Financial shifts:</strong> Trafigura is IPOing its supertanker arm, Volare Shipping, to capitalize on record rates.</li><li><strong>Energy transition:</strong> Falling biodiesel prices and the rise of ammonia/methanol may accelerate decarbonization despite the current crisis.</li><li><strong>Legal precedents:</strong> The Mercuria vs. Baltic Exchange court case will determine the liability of price indices during active warfare.</li></ul>", "artificial intelligence": "<p>AI is shifting from speculative hype to a high-stakes infrastructure and integration phase.</p><p><strong>Why it matters:</strong> Massive capital expenditure is creating a volatile feedback loop between hardware demand, energy needs, and corporate restructuring.</p><p><strong>By the numbers</strong></p><ul><li><strong>$92.3bn:</strong> Microsoft's quarterly revenue, though data center delays are capping spending.</li><li><strong>$30bn:</strong> Oracle's projected free cash flow by 2029 driven by AI bets.</li><li><strong>10%:</strong> The portion of revenue Indian IT outsourcers now earn from AI integration.</li><li><strong>$400mn:</strong> Valuation for a new AI-driven police tool venture.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure bottlenecks:</strong> Data center delays and copper price volatility are the primary physical constraints on growth.</li><li><strong>Corporate evolution:</strong> \"AI agents\" are automating information reconciliation, rendering traditional middle-management roles obsolete.</li><li><strong>Security risks:</strong> AI's mathematical progress is now a credible threat to global encryption, rivaling the danger posed by quantum computing.</li><li><strong>Market divergence:</strong> A \"K-shaped\" recovery is emerging, widening the gap between high-clout shareholders and minority investors.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The IPO litmus test:</strong> Anthropic’s upcoming IPO will determine if the market can sustain massive valuations for LLM developers.</li><li><strong>Integration pivot:</strong> The focus is moving from building models to integrating them into legacy sectors like law, policing, and museums.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a zero-sum struggle for global primacy that transcends traditional diplomacy.</p><p><strong>Why it matters:</strong></p><ul><li>  The shift from \"win-win\" cooperation to geopolitical rivalry destabilizes global supply chains and increases the risk of systemic conflict.</li><li>  Unpredictable leadership in both Washington and Beijing prevents the establishment of a stable, long-term strategic framework.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The \"Middle Power\" Pivot:</strong> Nations like Australia and the BRICS bloc are diversifying ties to avoid becoming collateral damage in the U.S.-China rivalry.</li><li>  <strong>The BRICS Shift:</strong> The grouping now commands a larger share of the global economy than the G7, signaling a move toward a multipolar financial order.</li><li>  <strong>Tactical Engagement:</strong> Recent summits are viewed as risk-management exercises rather than genuine détente.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>Economic Weight:</strong> BRICS nations now outweigh the G7 in global GDP share.</li><li>  <strong>Risk Profile:</strong> Rising regional conflicts and \"revisionist\" power plays are increasing the probability of a broader global conflagration.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Trade Volatility:</strong> Expect increased tariffs and sanctions as the U.S. prioritizes economic security over open trade.</li><li>  <strong>Strategic Realignment:</strong> Smaller powers will increasingly thwart \"Goliath\" nations to protect their own sovereignty and economic interests.</li></ul>", "us elections": "<p>US midterm elections are centering on a volatile mix of economic anxiety and allegations of government corruption.</p><p><strong>Why it matters:</strong> Voters are increasingly linking \"swamp\" politics and self-dealing to their own financial struggles, turning governance ethics into a primary economic driver.</p><p><strong>The battlegrounds</strong></p><ul><li><strong>Senate Control:</strong> High-stakes races in Texas and Alaska will determine the balance of power for the remainder of Trump's term.</li><li><strong>Key Issues:</strong> Corruption, vaccine skepticism (specifically regarding RFK Jr.), and the affordability crisis are dominating voter sentiment.</li><li><strong>Tactics:</strong> Campaigns are utilizing unlimited donations to flood airwaves with ads, leading to widespread voter fatigue.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Tariff Leverage:</strong> Trump is using import duties as a political tool, easing Canadian tariffs specifically to aid struggling Republican Senate candidates.</li><li><strong>Election Integrity:</strong> Trump's offer of a $1 million reward for fraud convictions and threats to block Alaska's certification signal a strategy of preemptive challenge.</li></ul><p><strong>External pressures</strong></p><ul><li><strong>Energy Costs:</strong> Oil hitting $117 due to Iran hostilities is spiking inflation expectations, potentially hurting incumbents.</li><li><strong>Global Context:</strong> Recent shifts in Brazil and Serbia highlight a global trend of volatility surrounding \"strongman\" leadership.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Certification:</strong> Potential legal battles over the Alaska Senate result if the Republican candidate loses.</li><li><strong>Policy Shift:</strong> Markets are now weighing whether Democratic Senate gains will neutralize Trump's key policy pledges.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz's declining domestic authority weakens Germany's leadership within the EU and stalls critical economic and pension reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Electoral collapse:</strong> The CDU suffered \"disastrous\" regional losses, particularly in the east, leaving the party without seats in Mecklenburg-Vorpommern.</li><li><strong>Coalition strain:</strong> The resignation of the labor minister has frozen legislative momentum on market reforms.</li><li><strong>AfD infiltration:</strong> Allegations that CDU lawmakers traded votes with the far-right have sparked a crisis of legitimacy.</li></ul><p><strong>Security and Geopolitics</strong></p><ul><li><strong>Espionage:</strong> Authorities recently detained a Ukrainian national suspected of spying for the Kremlin on military sites.</li><li><strong>Rearmament:</strong> Berlin is aggressively bolstering its arms industry and using \"guerrilla units\" to fast-track weapons deals for Ukraine.</li><li><strong>Diplomatic pivots:</strong> High-level meetings with Russia and Turkey signal a pragmatic, if tense, attempt to manage regional instability.</li></ul><p><strong>Between the lines</strong> Merz is attempting to position himself as a \"firewall\" against radicalism, but his unpopularity is creating a power vacuum. This has elevated North Rhine-Westphalia Premier Hendrik Wüst as a viable \"chancellor-in-waiting.\"</p><p><strong>What's next</strong></p><ul><li><strong>EU Budget:</strong> Merz's hobbled authority threatens the stability of the EU’s €2tn budget negotiations.</li><li><strong>Investment risk:</strong> Executives are signaling hesitation regarding German investments due to political volatility and the rise of the AfD.</li></ul>", "central banks": "<p>Global central banks are navigating a volatile transition marked by leadership shifts and persistent inflation.</p><p><strong>Why it matters:</strong> Divergent monetary paths and leadership vacuums create market instability, specifically threatening bond market transmission in Europe and currency stability in emerging markets.</p><p><strong>The leadership shakeup</strong></p><ul><li><strong>ECB:</strong> President Christine Lagarde will step down in February.</li><li><strong>Frontrunners:</strong> Pablo Hernández de Cos and Klaas Knot are the leading candidates to succeed her.</li><li><strong>The risk:</strong> A leadership transition coincides with heightened French bond market turbulence.</li></ul><p><strong>Divergent policy paths</strong></p><ul><li><strong>The Fed:</strong> Holding rates steady for now but remains on a tightening path due to strong U.S. growth and PCE inflation.</li><li><strong>BoE:</strong> Preparing a \"short and precautionary\" tightening cycle starting in November.</li><li><strong>BoJ:</strong> Maintaining a quarterly tightening trajectory as inflation accelerates.</li><li><strong>RBI:</strong> India has spent ~$90bn to defend the rupee against depreciation.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>7:</strong> The number of policy meetings the Fed will hold next year, down from the traditional eight.</li><li><strong>2.5%:</strong> The current ECB interest rate, held steady during Lagarde's exit announcement.</li><li><strong>$90bn:</strong> Amount spent by India's central bank to shore up its currency.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hawkish shift:</strong> Analysts have raised 2027 rate forecasts for the BoE and BoJ, with marginal increases for the Fed and ECB.</li><li><strong>New threats:</strong> BoE Governor Andrew Bailey is pivoting focus toward AI agents as a systemic risk to financial stability.</li><li><strong>Strategic pivot:</strong> The EU is leveraging digital money to build a broader geopolitical monetary strategy.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as record trading profits clash with regulatory penalties and AI-driven deposit risks.</p><p><strong>Why it matters:</strong></p><ul><li><strong>Margin pressure:</strong> AI agents threaten to automate \"rate shopping,\" potentially shifting billions in deposits to higher-yield accounts and costing banks $500 billion.</li><li><strong>Regulatory drag:</strong> Systemic failures in anti-money laundering (AML) are triggering massive fines for BofA and Amex, eroding net income.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman Sachs is preparing for top executives.</li><li><strong>$350 million:</strong> Amex fine for failing to flag $13 billion in suspicious transactions.</li><li><strong>17%:</strong> The drop in BofA profits following a $1.2 billion money laundering fine.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>The AI Paradox:</strong> Banks are restricting AI access to accounts to protect deposits while simultaneously demanding lower legal fees from law firms using AI to cut costs.</li><li><strong>Talent War:</strong> Citi is shortening junior banker promotion paths to two years to prevent poaching by private equity firms.</li><li><strong>Strategic Shifts:</strong> Citi's approval for China securities business signals a pivot toward Asian markets ahead of high-level US-China diplomatic meetings.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Trading cooldown:</strong> Analysts expect a sharp slowdown in the record-breaking trading streak as third-quarter results stabilize.</li><li><strong>Leadership churn:</strong> Evercore's appointment of co-presidents and the uncertainty around Goldman's CEO timeline signal a broader reshuffle in Wall Street leadership.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>29 Oct 2026 17:04 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
