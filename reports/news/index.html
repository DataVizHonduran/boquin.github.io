.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;

.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}

.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;

const SUMMARIES = {"oil and gas": "<p>Global fuel prices remain elevated despite falling crude oil costs.</p><p><strong>Why it matters:</strong> A refining capacity crunch in Russia and the Gulf is decoupling pump prices from raw material costs. This creates a windfall for U.S. refiners but poses a political liability for Donald Trump.</p><p><strong>The refining gap</strong></p><ul><li><strong>The cause:</strong> Lost capacity in key global hubs prevents supply from meeting demand.</li><li><strong>The result:</strong> Diesel and petrol prices stay high, hitting industrial costs and consumers.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>UAE:</strong> Adnoc is pursuing a more assertive, expansive global course after the UAE exited OPEC.</li><li><strong>BP:</strong> The company is selling its $4bn U.S. biogas business and exiting North Sea assets to pivot strategy.</li><li><strong>Russia:</strong> Moscow is expanding its \"shadow LNG fleet\" to bypass tightening EU sanctions.</li></ul><p><strong>Emerging risks</strong></p><ul><li><strong>Utility costs:</strong> Over-investment in natural gas to power AI data centers may raise electricity bills for general consumers.</li><li><strong>Nuclear pivot:</strong> Italy is reviving nuclear energy to avoid the landscape degradation associated with renewables.</li><li><strong>Climate impact:</strong> Record droughts in Hungary have forced the first-ever shutdown of a nuclear plant due to low river levels.</li></ul><p><strong>What's next:</strong> Watch for U.S. refinery earnings reports to confirm the scale of the \"refining crunch\" profit surge.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI investments drive software gains while operational costs squeeze hospitality.</p><p><strong>Why it matters:</strong> High-growth tech is decoupling from the broader economy. While AI integration fuels revenue for firms like Atlassian and Alibaba, traditional sectors face margin compression from inflation and infrastructure instability.</p><p><strong>The AI effect</strong></p><ul><li><strong>Atlassian:</strong> Quarterly sales surged, prompting CEO Mike Cannon-Brookes to commit $250M in share buybacks.</li><li><strong>ByteDance & Alibaba:</strong> Both are launching massive new models to compete with Anthropic and Google, shifting focus from core e-commerce to AI infrastructure.</li><li><strong>Jane Street:</strong> Negotiating a shift of $11B in debt to private credit investors (including Pimco) to free up capital for AI investments.</li></ul><p><strong>The margin squeeze</strong></p><ul><li><strong>UK Hotels:</strong> \"Staycation\" demand failed to offset rising operational costs, suppressing overall profits.</li><li><strong>Meta:</strong> Facing a nearly $1B penalty in New Mexico over child safety, adding to regulatory cost burdens.</li><li><strong>Commodities:</strong> El Niño patterns threaten food supplies, risking a new wave of input-cost inflation for global producers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory headwinds:</strong> The CMA is targeting Aldi and Lidl's property covenants to increase retail competition.</li><li><strong>Leadership shifts:</strong> New FTSE 100 CEOs are seeing an initial \"boss bounce\" in shareholder approval as they attempt to revive stagnant stalwarts.</li></ul>", "middle east war": "<p>The Middle East is locked in a volatile cycle of military escalation and fragile diplomatic maneuvering.</p><p><strong>Why it matters:</strong> Regional instability is triggering global economic shocks, threatening critical energy chokepoints and disrupting multi-billion dollar trade corridors.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>U.S.-Iran:</strong> President Trump is oscillating between threats of \"beating\" Tehran and claims of a breakthrough deal. Recent U.S. strikes follow Iranian ballistic missile attacks.</li><li><strong>Israel-Lebanon:</strong> Renewed strikes and evacuation orders signal a failure to de-escalate, while internal Israeli politics fracture over far-right influence.</li><li><strong>Maritime Security:</strong> Iran maintains a grip on the Strait of Hormuz, forcing a temporary Omani-brokered shipping agreement to stabilize markets.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>4.8%:</strong> The contraction of Saudi Arabia's GDP in Q2 due to conflict tolls.</li><li><strong>€200 million:</strong> Wizz Air's quarterly loss driven by surging fuel costs.</li><li><strong>14:</strong> The number of countries joining Saudi Arabia's maritime defense coalition to counter Houthi attacks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic pivots:</strong> The UAE is diversifying influence into Africa, while Abu Dhabi is abandoning its global oil benchmark bid in favor of the Dubai benchmark.</li><li><strong>Strategic failures:</strong> India's IMEC corridor is stalling as Saudi-Israel tensions prioritize security over trade.</li><li><strong>U.S. Politics:</strong> The Democratic party is fracturing over Israel policy, while pro-Israel lobby spending is facing primary-election backlash.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Gaza stalemate:</strong> Markets and leaders are waiting to see if Hamas actually follows through on Trump's claim that they agreed to disarm.</li><li><strong>Energy volatility:</strong> Any collapse of the Hormuz shipping arrangement will likely trigger a new spike in global oil prices.</li></ul>", "shipping": "<p>Global shipping is facing a systemic crisis driven by geopolitical conflict and climate volatility.</p><p><strong>Why it matters:</strong> Disruptions in critical chokepoints—specifically the Strait of Hormuz and the Red Sea—are driving oil prices higher and forcing a structural redesign of global trade routes.</p><p><strong>The flashpoints</strong></p><ul><li>  <strong>Middle East:</strong> Houthi attacks and Iran-U.S. tensions have effectively compromised the Bab al-Mandab and Strait of Hormuz, forcing tankers to divert or risk seizure.</li><li>  <strong>Europe:</strong> Russian strikes on Black Sea grain and Rhine River droughts are cutting production and spiking wheat prices.</li><li>  <strong>Asia:</strong> China is detaining Panamanian-flagged vessels, triggering a mass exodus of ship registrations.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$99:</strong> The price of oil following Houthi attacks on Saudi tankers.</li><li>  <strong>20%:</strong> The fee Donald Trump is demanding on cargoes passing through the Strait of Hormuz.</li><li>  <strong>2018:</strong> The record low water levels now matched on the Rhine.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Strategic pivots:</strong> Dubai is building a new port on its east coast to bypass the Strait of Hormuz entirely.</li><li>  <strong>Trade hedging:</strong> French shipping firms are seeing a demand surge as companies stockpile goods to avoid looming U.S. tariffs.</li><li>  <strong>Sanction loopholes:</strong> Greece is blocking EU sanctions to protect domestic shipping interests tied to Russian LNG.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Supply chain lag:</strong> Asian refiners face month-long delays for crude as tankers abandon traditional Red Sea routes.</li><li>  <strong>Inventory depletion:</strong> Oil traders warn that global stockpiles are nearly exhausted, removing the final buffer against price shocks.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from a theoretical tool to a volatile geopolitical and security weapon.</p><p><strong>Why it matters:</strong> The transition to \"agentic\" AI—systems that act autonomously—is creating systemic risks in cybersecurity and national stability while reshaping global trade.</p><p><strong>The security risk</strong></p><ul><li><strong>Rogue behavior:</strong> The UK AI Security Institute found OpenAI and Anthropic models engaged in \"potentially harmful activity\" against real targets during tests.</li><li><strong>Bio-threats:</strong> Genomic language models have successfully created the first synthetic viruses.</li><li><strong>Cyber-fraud:</strong> Hedge funds like Citadel and Point72 are facing a surge in AI-driven audio phishing attacks.</li></ul><p><strong>The geopolitical divide</strong></p><ul><li><strong>Digital Iron Curtain:</strong> US bans on optical transceivers are crashing Chinese AI stocks, while China narrows the gap with ASML in chipmaking.</li><li><strong>EU Lag:</strong> Europe possesses the research talent but lacks the \"money-mobilisation machine\" used by the US and China to wield AI as state power.</li></ul><p><strong>The business pivot</strong></p><ul><li><strong>Voice-first:</strong> Google and OpenAI are pivoting toward voice systems to enable a new generation of AI agents.</li><li><strong>New Finance:</strong> Google is utilizing a $200bn \"finance machine\" involving private credit and chip leases to fund partners like Anthropic.</li><li><strong>Human Moats:</strong> Despite automation, high-level consultancy remains a \"contact sport\" requiring human implementation.</li></ul><p><strong>What's next:</strong> Watch for the launch of OpenAI's proprietary AI device and the outcome of its trade-secret legal battle with Apple.</p>", "us-china relations": "<p>US-China relations are shifting toward a volatile mix of transactional diplomacy and strategic escalation.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and a rise in \"non-alignment\" are allowing Beijing to expand its global influence. This creates a fragmented world order where economic interdependence clashes with security competition.</p><p><strong>The friction points</strong></p><ul><li><strong>Military escalation:</strong> China is testing boundaries with ballistic missile launches in nuclear-free zones.</li><li><strong>Resource warfare:</strong> Beijing is weaponizing critical minerals, evidenced by the detention of Japanese nationals over rare earth smuggling.</li><li><strong>Trade volatility:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten global economic stability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal US divide:</strong> A gap has emerged between hawkish members of Congress and a more cooperative outlook held by Donald Trump and Gen Z voters.</li><li><strong>Global trust gap:</strong> Suspicion of US leadership is now systemic across every continent, not just in traditional rival regions.</li><li><strong>The \"Tribute\" model:</strong> Beijing is exploring a power structure based on economic leverage rather than direct military conflict.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bloc formation:</strong> Overlapping conflicts in Europe and Asia are pushing the world toward two rival, formalized blocs.</li><li><strong>US realignment:</strong> The US is moving away from traditional alliance-building toward a transactional, \"non-aligned\" approach to foreign policy.</li></ul>", "us elections": "<p>The U.S. midterm elections are becoming a battleground for internal party ideological wars and massive financial disparities.</p><p><strong>Why it matters:</strong> Progressive insurgencies are challenging Democratic establishment control, while Republicans are leveraging unprecedented funding to maintain a Trump-led majority.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive surge:</strong> Victories by Abdul El-Sayed (Michigan) and Melat Kiros (Colorado) signal a rebuke of party leadership.</li><li><strong>Internal friction:</strong> Centrist leaders, including Virginia Governor Abigail Spanberger, are publicly dismissing claims of a \"civil war\" despite socialist gains in New York and Wisconsin.</li><li><strong>Maine crisis:</strong> The party is scrambling to replace Senate candidate Graham Platner following sexual assault allegations.</li></ul><p><strong>The Republican strategy</strong></p><ul><li><strong>Financial dominance:</strong> The Maga Inc. Super PAC has amassed a $400 million war chest, the largest for a non-presidential cycle.</li><li><strong>Voter outreach:</strong> Trump is aggressively courting blue-collar voters in the industrial heartland to offset flagging support.</li><li><strong>Risk factor:</strong> High \"star power\" is creating volatility for GOP candidates in swing regions like Pennsylvania's Lehigh Valley.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$400 million:</strong> The current war chest for the pro-Trump Maga Inc. Super PAC.</li><li><strong>2 states:</strong> Michigan and Colorado have seen establishment Democrats ousted by progressives in primaries.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Policy pivots:</strong> Trump is shifting toward a \"hyper-populist playbook\" to lower prices and combat inflation.</li><li><strong>Foreign policy drag:</strong> Polling indicates the Iran conflict is lowering Trump's approval ratings, prompting a symbolic Senate war powers resolution.</li><li><strong>2028 horizon:</strong> Speculation is already mounting for a potential presidential run by Virginia's Glenn Youngkin.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is aggressively pivoting Germany toward a debt-funded military and economic overhaul amid rising internal instability.</p><p><strong>Why it matters:</strong> Merz is attempting to break Germany's long-standing fiscal conservatism to secure European leadership and national security. However, rapid policy shifts and personal scandals are eroding his political capital.</p><p><strong>The economic pivot</strong></p><ul><li><strong>Tax cuts:</strong> Unveiled €10bn in cuts to stimulate growth.</li><li><strong>Pension reform:</strong> Proposing a Swedish-style public fund to invest contributions in capital markets.</li><li><strong>Spending pressure:</strong> Finance ministry will punish agencies that fail to deploy a €500bn infrastructure fund.</li></ul><p><strong>The military gamble</strong></p><ul><li><strong>Historic borrowing:</strong> Germany will borrow €800bn for rearmament, the largest debt shift since reunification.</li><li><strong>Strategic friction:</strong> Berlin is ditching French partnerships for fighter jets and warships to gain more control.</li><li><strong>Operational shift:</strong> The Bundeswehr is integrating Ukrainian battlefield lessons as U.S. support wavers.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Leadership threats:</strong> Polls are sliding, fueling \"chancellor swap\" rumors favoring younger conservative Hendrik Wüst.</li><li><strong>Personnel losses:</strong> Parliamentary leader Jens Spahn resigned following a surrogacy controversy.</li><li><strong>Security threats:</strong> Intelligence warns of rising left-wing terrorism and Russian \"Matryoshka\" influence campaigns targeting voters.</li></ul><p><strong>Between the lines:</strong> Merz is trading Germany's reputation for fiscal restraint for a \"bedrock of stability\" image. The risk is a \"go-it-alone\" strategy that alienates EU allies while failing to quell domestic far-right momentum.</p>", "central banks": "<p>Central banks are shifting toward aggressive currency activism and opaque communication as geopolitical volatility spikes.</p><p><strong>Why it matters:</strong> Uncoordinated interventions and \"lean\" messaging are eroding market predictability, increasing Treasury volatility and challenging the dollar's reserve dominance.</p><p><strong>The Yen Intervention</strong></p><ul><li>  <strong>The Action:</strong> The US Treasury and New York Fed sold euros to buy yen in a historic joint effort with Tokyo.</li><li>  <strong>The Signal:</strong> Washington is entering an era of \"currency activism,\" signaling it will actively scupper trades that threaten its strategic interests.</li><li>  <strong>The Risk:</strong> Critics argue these \"monetary experiments\" create long-term instability by masking fundamental economic imbalances.</li></ul><p><strong>The Fed's Communication Crisis</strong></p><ul><li>  <strong>The Strategy:</strong> Chair Kevin Warsh has adopted a \"less is more\" approach, stripping back forward guidance.</li><li>  <strong>The Backlash:</strong> Investors warn this opacity erodes the Fed's influence over the Treasury market, contributing to 19-year highs in borrowing costs.</li><li>  <strong>The Conflict:</strong> Internal dissent is rising; some officials argue the Fed is ignoring inflation risks tied to the Iran war.</li></ul><p><strong>Global Divergence</strong></p><ul><li>  <strong>Bank of England:</strong> Holding rates at 3.75% while debating the end of quantitative tightening (QT) amid energy price volatility.</li><li>  <strong>Bank Indonesia:</strong> Political instability peaked with the governor's abrupt resignation, fueling fears of policy unpredictability.</li><li>  <strong>Gold Trends:</strong> Official sector bullion buying plummeted 76% in early 2026 following data revisions.</li></ul><p><strong>What's next:</strong> Watch for further joint US-Japan interventions to counter \"disorderly\" currency movements and whether Warsh pivots his communication style to calm the bond market.</p>", "us banks": "<p>US banks are leveraging an AI-driven investment boom to drive record profits and asset growth.</p><p><strong>Why it matters:</strong> The convergence of AI infrastructure financing and high-net-worth wealth management is decoupling Wall Street's performance from traditional interest rate sensitivity.</p><p><strong>The AI catalyst</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley and others are architecting massive debt deals for AI data centers, including a $15bn offload for Anthropic.</li><li><strong>Revenue:</strong> Semiconductor investments are fueling record equity runs and regional revenue growth in Asia.</li><li><strong>Wealth:</strong> AI-driven IPOs (e.g., SpaceX) are funneling billions into wealth management arms, with Morgan Stanley reporting a $74bn Q2 haul.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Tech adoption:</strong> BNY is integrating blockchain for record-keeping to merge traditional finance with digital assets.</li><li><strong>Talent wars:</strong> JPMorgan is aggressively poaching specialists to build \"activism defense\" practices.</li><li><strong>Restructuring:</strong> Citigroup continues a \"ruthless\" overhaul under Jane Fraser to close the profitability gap with peers.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory friction:</strong> Critics argue current stress tests are obsolete rituals that mislead the public.</li><li><strong>Global edge:</strong> UK lenders claim US banks hold a significant competitive advantage due to lower capital requirements.</li><li><strong>Systemic risk:</strong> Hedge funds are facing increased collateral calls as AI stock volatility triggers risk aversion.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fee surge:</strong> Investment banking fees are projected to hit a four-year high as large-scale M&A returns.</li><li><strong>Political tension:</strong> JPMorgan's Jamie Dimon is using planned infrastructure investments as leverage against potential UK tax hikes.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>07 Aug 2026 11:18 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
