const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Middle East is triggering a global energy shock that is destabilizing retail markets and accelerating a shift toward alternative power.</p><p><strong>Why it matters:</strong> Rising fuel costs are creating a causal chain from geopolitical conflict to consumer inflation, forcing governments to choose between unpopular subsidies and economic instability.</p><p><strong>The ripple effect</strong></p><ul><li><strong>Retail:</strong> Walmart shares plunged after the company absorbed fuel costs to prevent consumer price hikes.</li><li><strong>Social:</strong> Fuel price surges have sparked violent protests and strikes across Kenya, Comoros, and Mozambique.</li><li><strong>Policy:</strong> The UK government postponed fuel duty increases and eased Russian oil sanctions to mitigate domestic price spikes.</li></ul><p><strong>The energy pivot</strong></p><ul><li><strong>AI Demand:</strong> Surging data center power needs are driving a return to fossil fuels on the US grid and fueling investment in vanadium flow batteries.</li><li><strong>EV Adoption:</strong> The IEA forecasts EV and hybrid sales will hit 30% of the car market this year, driven by high fuel costs.</li><li><strong>Infrastructure:</strong> China and Russia are prioritizing the Power of Siberia 2 pipeline to secure long-term gas flows.</li></ul><p><strong>Between the lines</strong> Governments are running out of tools to suppress prices. Previous crisis-management levers have been exhausted, leaving policymakers reliant on temporary sanctions waivers and tax loopholes to avoid systemic inflation.</p><p><strong>What's next</strong></p><ul><li><strong>Market Volatility:</strong> Oil futures remain optimistic, but historical patterns suggest a deeper shock is likely.</li><li><strong>Fiscal Shifts:</strong> The UK Chancellor plans to close oil industry tax loopholes to fund cost-of-living packages.</li><li><strong>Strategic Storage:</strong> Iran is increasingly utilizing floating storage on aging tankers to maintain production levels.</li></ul>", "corporate earnings and results": "<p>Corporate earnings and strategic pivots are shifting toward AI integration and aggressive market expansion.</p><p><strong>Why it matters:</strong> High-growth tech firms are facing valuation ceilings while traditional sectors struggle with legacy costs and political instability.</p><p><strong>The AI & Tech Pulse</strong></p><ul><li><strong>Nvidia:</strong> Shares remained flat despite beating revenue forecasts and raising dividends, signaling that investor expectations have outpaced actual growth.</li><li><strong>SpaceX:</strong> Preparing for a historic IPO, creating a valuation challenge for markets due to the company's speculative scale.</li><li><strong>Public Sector:</strong> AI adoption promises efficiency, but gains may be offset by increased user demand and complexity.</li></ul><p><strong>Industrial Shifts</strong></p><ul><li><strong>Stellantis:</strong> Investing €60bn in 60 new models and Chinese partnerships to prevent collapse.</li><li><strong>BYD:</strong> Exploring F1 entry to elevate brand prestige and compete with legacy automakers.</li><li><strong>KNDS:</strong> Berlin is acquiring a 40% stake to stabilize the Franco-German tank maker ahead of a summer listing.</li></ul><p><strong>UK Market Friction</strong></p><ul><li><strong>Economic Activity:</strong> Business activity fell in May for the first time in a year, driven by political uncertainty and geopolitical conflict.</li><li><strong>Banking:</strong> Starling Bank reports profit erosion as interest rate cuts hit its non-diversified revenue stream.</li><li><strong>Infrastructure:</strong> Aging housing stock is driving service charges to £7,300 annually for high-rise leaseholders.</li></ul><p><strong>What's next:</strong> Watch for the SpaceX IPO pricing and the execution of Stellantis's turnaround plan to gauge risk appetite in high-cap speculative assets.</p>", "middle east war": "<p>The Middle East conflict is triggering a global economic shockwave while destabilizing regional governance.</p><p><strong>Why it matters:</strong> The closure of the Strait of Hormuz is disrupting global energy flows, fueling inflation, and forcing a realignment of international trade currencies.</p><p><strong>The economic fallout</strong></p><ul><li><strong>Energy:</strong> Brent crude dropped 6% to $105/barrel after two supertankers successfully crossed the Strait of Hormuz.</li><li><strong>Inflation:</strong> Fed officials are reconsidering April rate cuts due to Iran-driven inflation risks; UK inflation fell to 2.8% despite the energy shock.</li><li><strong>Trade:</strong> China is leveraging the crisis to increase renminbi usage in global oil trades.</li><li><strong>Infrastructure:</strong> Saudi Arabia has halted new consultancy work to protect Vision 2030 finances amid war costs.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>U.S. Strategy:</strong> President Trump paused a planned Tuesday strike on Iran following requests from the UAE, Saudi Arabia, and Qatar.</li><li><strong>Israel Internal:</strong> Lawmakers are advancing a bill for early elections, framing the vote as a referendum on Benjamin Netanyahu.</li><li><strong>Diplomatic Strain:</strong> Far-right ministers Ben-Gvir and Smotrich are drawing condemnation from Western allies and the ICC.</li></ul><p><strong>The ground reality</strong></p><ul><li><strong>Territory:</strong> Israel now controls 1,000 sq km across Gaza, Lebanon, and Syria—roughly 5% of its 1949 borders.</li><li><strong>Logistics:</strong> Marine growth (barnacles and jellyfish) is infesting trapped ships in the Gulf, threatening future vessel mobility.</li></ul><p><strong>What's next:</strong> A critical 48-to-72-hour window for Tehran to reach a deal and reopen the Strait of Hormuz to avoid U.S. military action.</p>", "shipping": "<p>Global shipping is fracturing under the weight of Middle East conflict and geopolitical gridlock.</p><p><strong>Why it matters:</strong> War in the Strait of Hormuz is forcing a permanent reshaping of trade routes, spiking operational costs and driving a shift toward riskier \"ghost\" fleets.</p><p><strong>The conflict toll</strong></p><ul><li><strong>Cost spikes:</strong> Maersk reports monthly cost increases of $500 million.</li><li><strong>Route shifts:</strong> Ships are abandoning the Suez Canal for the longer Cape of Good Hope route to avoid danger.</li><li><strong>Logistics pivots:</strong> Gulf freight rates are jumping as companies switch to trucks to bypass blocked waterways.</li><li><strong>Supply shocks:</strong> Shortages of paint and lubricants are stalling global shipbuilding.</li></ul><p><strong>Strategic winners and losers</strong></p><ul><li><strong>Winners:</strong> The Panama Canal reports a 15% revenue boost as traffic diverts. Ship-tracking apps like Kpler are seeing surging demand.</li><li><strong>Losers:</strong> Kenyan exports (roses and tea) are withering due to crushed Gulf markets and higher freight costs.</li><li><strong>Failed bets:</strong> A $40bn US insurance scheme for Hormuz ships has seen zero uptake due to a lack of naval escorts.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Climate deadlock:</strong> The US is blocking a UN-backed global carbon levy, stalling the industry's transition to net-zero.</li><li><strong>Last-mile war:</strong> Walmart is repurposing empty drugstores as micro-warehouses to compete with Amazon's delivery speed.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Energy shifts:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li><li><strong>Security risks:</strong> A resurgence of Somali piracy and Iranian vessel seizures are increasing the risk profile for seafarers.</li></ul>", "artificial intelligence": "<p>AI is shifting from a software experiment to a hardware-driven industrial overhaul.</p><p><strong>Why it matters:</strong> The \"AI war\" is concentrating wealth in physical infrastructure and chip supply chains while threatening traditional labor-based tax models and professional service fees.</p><p><strong>The hardware pivot</strong></p><ul><li><strong>Infrastructure dominance:</strong> Investors are pivoting from software to hardware suppliers as the primary beneficiaries of the AI boom.</li><li><strong>Nvidia's grip:</strong> CEO Jensen Huang is using a $90bn deal spree to lock startups and customers into the Nvidia ecosystem.</li><li><strong>Energy scale:</strong> A $420bn mega-merger between NextEra and Dominion highlights the massive power requirements of \"data center alley.\"</li></ul><p><strong>The IPO wave</strong></p><ul><li><strong>Trillion-dollar targets:</strong> OpenAI is preparing a potential $1tn listing; SpaceX is planning the largest IPO in history.</li><li><strong>Market appetite:</strong> Cerebras’ $6.4bn raise signals strong Wall Street demand for AI chip designers.</li><li><strong>Risk shift:</strong> Analysts warn these IPOs may simply transfer investment risk from venture capitalists to retail investors.</li></ul><p><strong>Labor and economic disruption</strong></p><ul><li><strong>Job replacement:</strong> Standard Chartered plans to replace \"lower-value human capital\" with AI, cutting nearly 8,000 roles.</li><li><strong>Revenue crisis:</strong> Governments face potential tax shortfalls as AI erodes labor income tax receipts.</li><li><strong>Business model collapse:</strong> AI is forcing a shift in professional services, specifically threatening the hourly billing structures of law firms.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>China's pushback:</strong> Beijing banned Nvidia gaming chips to accelerate domestic rivals like Huawei and Cambricon.</li><li><strong>Political weaponization:</strong> AI-generated \"slopaganda\" is actively reshaping political communication and misinformation boundaries.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global leadership defined by asymmetry and credibility gaps.</p><p><strong>Why it matters:</strong> Washington's perceived retreat from traditional alliances and democratic norms creates a power vacuum. Beijing is leveraging this instability to build soft power and position itself as a stable alternative for global governance.</p><p><strong>Between the lines</strong></p><ul><li><strong>Credibility crisis:</strong> U.S. inconsistency in Europe and the Middle East signals a shift toward isolationism, eroding the \"security umbrella\" for allies.</li><li><strong>Asymmetric leverage:</strong> Power no longer stems from raw wealth but from the ability to exploit imbalances in trade, tech, and diplomacy.</li><li><strong>The \"Middleman\" era:</strong> Traditional diplomacy is failing; special envoys and middle powers are increasingly managing the friction between the two superpowers.</li></ul><p><strong>The China Pivot</strong></p><ul><li><strong>Soft power gain:</strong> Beijing is improving its global image as the U.S. burns diplomatic bridges.</li><li><strong>Leadership vacuum:</strong> China is drafting a blueprint for global leadership, though it has yet to fully assume the responsibilities of a hegemon.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional decay:</strong> Multilateral bodies like the UN face irrelevance unless they adapt to a fractured, bipolar world.</li><li><strong>Risk evolution:</strong> Global businesses and governments are shifting from growth-centric models to resilience and contingency planning.</li></ul>", "us elections": "<p>The U.S. political landscape is fracturing as Donald Trump tightens his grip on the GOP while facing mounting economic and foreign policy headwinds.</p><p><strong>Why it matters:</strong> Internal GOP volatility and a shift toward working-class populism in the Democratic party are redefining the battlegrounds for the upcoming midterms.</p><p><strong>The GOP Power Struggle</strong></p><ul><li><strong>Purge of dissent:</strong> Trump is successfully replacing \"maverick\" Republicans with loyalists, evidenced by Thomas Massie's defeat and Julia Letlow's victory.</li><li><strong>Internal rift:</strong> The Iran war is creating a \"MAGA divorce,\" pitting \"America First\" nationalists against the administration.</li><li><strong>Succession battle:</strong> JD Vance and Marco Rubio are already positioning themselves for a 2028 White House clash.</li></ul><p><strong>The Democratic Pivot</strong></p><ul><li><strong>Class shift:</strong> Democrats are nominating populist, working-class candidates—such as a former firefighter in Pennsylvania—to reclaim blue-collar voters.</li><li><strong>Legal setbacks:</strong> Court rulings in Virginia and Louisiana are undermining Democratic efforts to redraw maps and protect voting rights.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$350 million:</strong> The record war chest built by MAGA Inc. Super PAC.</li><li><strong>$300 million:</strong> The amount Big Tech groups are deploying to influence elections.</li><li><strong>$100 million:</strong> Planned spending by pro-AI groups to fight regulation.</li><li><strong>>50%:</strong> US voters who disapprove of Trump’s economic handling per FT polling.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI as a wedge:</strong> Artificial intelligence is emerging as a primary campaign issue, driving calls for income tax overhauls and tighter regulation.</li><li><strong>Ideological overlap:</strong> The extreme edges of both parties are beginning to converge on specific populist issues, despite deepening partisan polarization.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Midterm vulnerability:</strong> High inflation and the Iran war may alienate swing voters, giving Democrats an opening despite GOP financial advantages.</li><li><strong>Judicial impact:</strong> Further Supreme Court rulings on gerrymandering and enfranchisement will likely dictate the final electoral map.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy as relations with the U.S. collapse.</p><p><strong>Why it matters:</strong> A diplomatic rift between Chancellor Friedrich Merz and Donald Trump over the Iran war is triggering a U.S. troop withdrawal, forcing Berlin to accelerate its own defense capabilities to secure Europe.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin plans to hit the 3.5% GDP NATO target six years ahead of schedule.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to speed up spending and pursuing Tomahawk missiles.</li><li><strong>Industry:</strong> Rheinmetall has bid €12bn to rescue a failing warship project.</li></ul><p><strong>The Trump friction</strong></p><ul><li><strong>The Spark:</strong> Merz claimed the U.S. is being \"humiliated\" by Iran and criticized the war effort.</li><li><strong>The Fallout:</strong> Trump has launched a review of U.S. troop presence and is pulling 5,000 soldiers from Germany.</li><li><strong>The Sentiment:</strong> Merz cited a deteriorating \"social climate\" in the U.S. as a reason he would not want his children to move there.</li></ul><p><strong>Domestic instability</strong></p><ul><li><strong>AfD Surge:</strong> The far-right party is topping polls by tapping into voter anger over fuel prices and opposing the Iran war.</li><li><strong>Internal Rift:</strong> The AfD is split over conscription, with the anti-NATO wing currently dominant.</li><li><strong>Legal Blow:</strong> A Berlin court ordered the AfD to return a record €2.35mn illegal donation.</li></ul><p><strong>EU tensions</strong></p><ul><li><strong>Debt:</strong> Merz opposes new EU debt, urging member states to make \"painful\" budget cuts.</li><li><strong>Banking:</strong> The ECB criticized Berlin for blocking UniCredit’s bid for Commerzbank, calling it a violation of the single market.</li><li><strong>Sovereignty:</strong> France views Germany's rapid re-armament as a risk to European industrial sovereignty.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation shocks against political pressure and bond market volatility.</p><p><strong>Why it matters:</strong> Monetary policy independence is under threat from political nominees and geopolitical crises, risking long-term price stability and market confidence.</p><p><strong>The global landscape</strong></p><ul><li><strong>US Fed:</strong> Transitioning leadership to Kevin Warsh; focus is shifting toward reduced public communication and protecting institutional independence from political interference.</li><li><strong>ECB:</strong> Facing upward pressure on rates due to energy shocks and the closure of the Strait of Hormuz.</li><li><strong>Bank of Japan:</strong> Moving toward a rate increase in June to normalize policy.</li><li><strong>Bank of England:</strong> Facing communication failures, as markets react more violently to BoE decisions than to other central banks.</li></ul><p><strong>Market vulnerabilities</strong></p><ul><li><strong>Gilt fragility:</strong> Rising public debt and hedge fund trading have increased vulnerability in UK bonds.</li><li><strong>Inflation spikes:</strong> Turkey has scrapped its inflation target, raising it to 24% amid regional war.</li><li><strong>Balance sheets:</strong> The US Treasury is exploring repo investments to help shrink the Fed's balance sheet.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Digital shift:</strong> The ECB is pivoting its digital euro focus toward wholesale markets rather than retail.</li><li><strong>Regulatory pivots:</strong> The BoE is expected to relax stablecoin rules following industry pushback.</li><li><strong>Geopolitical risk:</strong> Central bankers are debating how to handle the \"Iran war dilemma,\" noting that pandemic-era playbooks may not apply to current supply shocks.</li></ul>", "us banks": "<p>Wall Street is aggressively pivoting toward AI-driven risk management and geopolitical hedging.</p><p><strong>Why it matters:</strong> Banks are balancing record profits and deregulation against escalating cybersecurity threats and volatile relations with China.</p><p><strong>The China Pivot</strong></p><ul><li><strong>Security first:</strong> Morgan Stanley is issuing China-only iPhones to Hong Kong staff to prevent data leaks.</li><li><strong>AI restrictions:</strong> Goldman Sachs has blocked access to Anthropic’s Claude for employees in Hong Kong.</li><li><strong>Strategic tension:</strong> Jamie Dimon praises China's consistency while maintaining the U.S. is the primary \"safe haven.\"</li></ul><p><strong>The AI Paradox</strong></p><ul><li><strong>Opportunity:</strong> Lenders are financing the AI boom but now seek to offload data center debt to avoid overexposure.</li><li><strong>Risk:</strong> Financial officials warn that new AI models, like Claude Mythos, could expose critical cyber vulnerabilities.</li><li><strong>Inequity:</strong> Disparate fees for Anthropic investments suggest unequal returns based on banking relationships.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$33B:</strong> Record amount spent by largest U.S. banks on share buybacks.</li><li><strong>$40B:</strong> Record revenue for Jane Street, resulting in $9.4B in employee pay.</li><li><strong>€15B:</strong> Value of the Citi-BlackRock partnership for European private lending.</li><li><strong>2007:</strong> The last time U.S. bank Treasury holdings were this high.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Deregulation wins:</strong> Trump-era regulatory easing is directly fueling increased Treasury holdings and share buybacks.</li><li><strong>Cultural friction:</strong> High-profile hires and harassment claims at JPMorgan and Citi highlight a volatile internal leadership climate.</li><li><strong>Revenue gaps:</strong> U.S. traders are outperforming European rivals by 3x, largely due to better commodity positioning.</li></ul><p><strong>What's next</strong></p><ul><li><strong>European expansion:</strong> JPMorgan is scaling its Chase digital bank into Germany.</li><li><strong>Crypto integration:</strong> Morgan Stanley will launch spot crypto trading via E*Trade.</li><li><strong>Structural shifts:</strong> Goldman Sachs continues to expand its management committee to centralize control.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>21 May 2026 15:28 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
