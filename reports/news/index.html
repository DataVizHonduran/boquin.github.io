.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Global oil markets have shifted to a surplus as Gulf shipments rebound.</p><p><strong>Why it matters:</strong> Rebounding production from Saudi Arabia and the Gulf is offsetting previous shortages, though the IEA warns it will take months to replenish stockpiles depleted by the US-Iran conflict.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>US Policy:</strong> The Trump administration is pushing for permitting overhauls to accelerate domestic fossil fuel infrastructure.</li><li><strong>EU Conflict:</strong> ExxonMobil is legally challenging EU carbon capture rules, citing investment treaty violations.</li><li><strong>Russian Exports:</strong> Diesel exports doubled following lifted US sanctions, though Ukrainian refinery attacks threaten to shorten this window.</li></ul><p><strong>The AI energy crunch</strong></p><ul><li><strong>Infrastructure Gap:</strong> Oracle’s \"Project Jupiter\" underscores the extreme difficulty of securing stable electricity for massive AI data centers.</li><li><strong>Failed Bets:</strong> SoftBank took a $3.7bn charge after overordering inefficient gas turbines for US data centers.</li><li><strong>Hidden Costs:</strong> Beyond electricity, the \"data center boom\" is facing new scrutiny over the carbon emissions of green cement used in construction.</li></ul><p><strong>What's next</strong></p><ul><li><strong>COP31 Focus:</strong> Grid and renewable executives are taking center stage, though critics argue electrification goals lack necessary targets to shift away from fossil-fired generation.</li><li><strong>Legal Precedents:</strong> Norway's Supreme Court ruling on \"exported emissions\" creates a new legal risk for future oilfield projects.</li></ul>", "corporate earnings and results": "<p>Geopolitical friction and leadership instability are triggering a massive valuation correction in the AI sector.</p><p><strong>Why it matters:</strong> The intersection of U.S. export restrictions and executive scandals at Nvidia is eroding investor confidence in the \"AI trade,\" leading to systemic sell-offs in supporting infrastructure.</p><p><strong>By the numbers</strong></p><ul><li><strong>$4.2 trillion:</strong> Market value lost by data center construction stocks as the AI boom unravels.</li><li><strong>82%:</strong> The discount New World Development applied to its $3.2bn rights issue to slash debt.</li><li><strong>$700 million:</strong> The contested valuation of Gulf retailer Eyewa as KKR and Brookfield compete for the asset.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Nvidia's vulnerability:</strong> The company faces a \"perfect storm\" of potential lawsuits, lack of executive insurance, and pressure from the U.S. Treasury for a leadership shake-up.</li><li><strong>AI's public test:</strong> Anthropic’s upcoming IPO will determine if frontier AI labs can maintain growth under the scrutiny of public equity markets.</li><li><strong>China's biotech wall:</strong> The FDA's rejection of Summit’s Ivonescimab signals a hardening U.S. stance against Chinese pharmaceutical integration.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory crackdown:</strong> Congress is accelerating tighter AI chip export rules following allegations of security breaches.</li><li><strong>Infrastructure pivot:</strong> Samsung is attempting to diversify its AI success by expanding into data center construction.</li><li><strong>Financial stability:</strong> COP31 will focus on whether climate-driven systemic risks are now an immediate threat to global pension funds.</li></ul>", "middle east war": "<p>The Middle East is entering a volatile phase of strategic realignment as U.S. policy shifts and regional proxy conflicts intensify.</p><p><strong>Why it matters:</strong> A pivot toward U.S. isolationism is creating a power vacuum, emboldening Iran-backed militants while forcing Gulf states to balance economic stability against escalating security threats.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>U.S. Retreat:</strong> President Trump has signaled an end to peace deal pushes with Tehran and reduced military footprints at UK bases.</li><li><strong>Israel-U.S. Strain:</strong> The alliance has reached a \"crisis point,\" complicating coordinated responses to Gaza and Iran.</li><li><strong>Iranian Aggression:</strong> Tehran has escalated hostilities via barrages against Bahrain and cyber attacks on French infrastructure.</li></ul><p><strong>The security landscape</strong></p><ul><li><strong>Yemen:</strong> Saudi-backed forces are retreating from the Bab al-Mandeb Strait, granting Houthis greater control over a critical maritime chokepoint.</li><li><strong>Infrastructure:</strong> Attacks on Saudi Arabia's East-West pipeline threaten the Kingdom's primary crude export route.</li><li><strong>Gaza:</strong> Humanitarian conditions are critical due to flooding and restricted aid, despite ceasefire attempts.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$90:</strong> The price ceiling for oil as markets react to Trump's reduced threat of striking Iran.</li><li><strong>$20B:</strong> The scale of the fraud scandal prompting the resignation of Turkey's chief banking regulator.</li><li><strong>10 weeks:</strong> The current low for Brent crude prices following U.S. political shifts.</li></ul><p><strong>Between the lines</strong> The \"culture boom\" in Abu Dhabi and continued art fairs suggest Gulf elites are attempting to project stability to investors, even as \"war inflation\" forces local consumers to cut luxury spending.</p><p><strong>What's next</strong> Watch for the outcome of the internal U.S. battle over Defense Secretary Pete Hegseth, which serves as a proxy for the broader debate over how the U.S. should conduct the Iran war.</p>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict transforms the world's most vital maritime chokepoints into war zones.</p><p><strong>Why it matters:</strong> Attacks in the Strait of Hormuz and the Black Sea are driving up operational costs, forcing a massive redirection of global trade flows toward the Arctic.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has targeted 24 vessels in two weeks using limpet mines and speedboats.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route; commercial sailor fatalities have surpassed those in the Gulf.</li><li><strong>The Cost:</strong> Captains are receiving $100,000 monthly salaries to transit the Hormuz strait.</li></ul><p><strong>The strategic pivot</strong></p><ul><li><strong>Arctic Boom:</strong> Transits via the Northern Sea Route have quadrupled as ships avoid the Middle East and melting ice opens new paths.</li><li><strong>Russian Shift:</strong> Moscow is forced to ship grain via the Arctic to bypass Black Sea battles, increasing costs for buyers.</li><li><strong>UK Infrastructure:</strong> DP World’s London Gateway is poised to overtake Felixstowe due to a surge in Chinese EV imports.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel of oil warned by Vitol if tanker shortages create a critical bottleneck.</li><li><strong>$2B:</strong> The gamble taken by a US oil trader on tankers to spur Asian refining amid diesel shortages.</li><li><strong>10%:</strong> The drop in Maersk shares following disappointing Q3 results, despite data center demand.</li></ul><p><strong>Between the lines</strong> Russia is employing sophisticated deception, with ships faking GPS locations to appear in two places simultaneously to evade sanctions and monitoring.</p><p><strong>What's next</strong> Expect increased volatility in fuel prices as US domestic diesel supplies hit 20-year lows and political battles threaten the delivery of Russian cargoes to the US East Coast.</p>", "artificial intelligence": "<p>Jensen Huang’s sudden resignation as Nvidia CEO over personal scandals has triggered a leadership crisis at the center of the AI boom.</p><p><strong>Why it matters:</strong> Nvidia is the primary infrastructure provider for global AI. Huang's exit creates a power vacuum that threatens chip supply chains and complicates U.S.-China trade relations.</p><p><strong>The fallout</strong></p><ul><li><strong>Leadership shift:</strong> Silicon Valley veterans Harvey Jones (Chair) and Colette Kress (CEO) are tasked with stabilizing the company.</li><li><strong>Market volatility:</strong> Shares dipped on the news but recovered as investors bet on the underlying technology over the founder.</li><li><strong>Geopolitical risk:</strong> Huang previously advocated for maintaining sales to China; his absence may accelerate chip restrictions.</li></ul><p><strong>Global AI landscape</strong></p><ul><li><strong>India:</strong> The government is backing startup Sarvam to build native models and avoid \"digital colonialism.\"</li><li><strong>China:</strong> Investors are eyeing \"picks and shovels\" supply chain stocks despite deepening sell-offs.</li><li><strong>Europe:</strong> AI is beginning to reshape the economy, though the \"boom\" remains less visible than in the U.S.</li></ul><p><strong>Between the lines</strong> The crisis is a referendum on \"founder mode.\" Giving leaders unchecked power in companies critical to national security and the global economy creates a single point of failure.</p><p><strong>What's next</strong></p><ul><li><strong>Nvidia's stock:</strong> Markets are watching for any sign of Huang selling his $135bn stake.</li><li><strong>Anthropic IPO:</strong> The AI lab is moving toward a listing, largely ignoring current tech stock turbulence.</li><li><strong>Regulation:</strong> Pressure is mounting for AI agents to operate via standardized channels rather than mimicking humans.</li></ul>", "us-china relations": "<p>The U.S. is entering a period of strategic retrenchment, creating a power vacuum that China is actively seeking to fill.</p><p><strong>Why it matters:</strong> A perceived American retreat from global leadership weakens traditional alliances and encourages revisionist powers to reshape the international order on their own terms.</p><p><strong>Between the lines</strong></p><ul><li><strong>The \"Trump Effect\":</strong> Political volatility in Washington signals to Beijing that the U.S. is an unreliable security guarantor.</li><li><strong>Strategic Opportunity:</strong> China is leveraging events like the APEC summit to position itself as the primary architect of a new global system.</li><li><strong>The Middle Power Shift:</strong> Countries like Australia are pivoting toward \"economic security\" and diversified supply chains to avoid becoming collateral damage in the U.S.-China rivalry.</li></ul><p><strong>The Global Ripple Effect</strong></p><ul><li><strong>Europe:</strong> EU leaders can no longer assume a return to an outward-looking U.S. superpower willing to underwrite continental defense.</li><li><strong>Ukraine:</strong> The conflict serves as a proxy for the broader struggle between democratic stability and autocratic expansion.</li><li><strong>The Middle East:</strong> U.S. instability alters the regional balance of power, increasing the influence of non-Western actors.</li></ul><p><strong>What's next</strong> Expect increased \"Great Game\" competition where the outcome depends less on direct confrontation and more on the ability to secure alliances with smaller, pivotal states.</p>", "us elections": "<p>Democrats secured a sweeping midterm victory, triggering a strategic pivot within the party and an identity crisis for Republicans.</p><p><strong>Why it matters:</strong> The results signal a voter rejection of \"woke\" culture wars and MAGA-led redistricting, shifting the political center toward economic affordability and labor interests.</p><p><strong>The Democratic shift</strong></p><ul><li><strong>Policy pivot:</strong> The party is ditching \"woke\" politics to focus on class-based issues and labor union priorities.</li><li><strong>Historic wins:</strong> Scott Colom became the first Black senator from Mississippi since the Reconstruction era.</li><li><strong>Leadership churn:</strong> Majority Leader Chuck Schumer faces a primary challenge from Chris Van Hollen.</li></ul><p><strong>The GOP postmortem</strong></p><ul><li><strong>Denial vs. Reality:</strong> Party leadership is blaming Big Tech and AI data centers, while Donald Trump admits his stance on immigration and the Iran war alienated voters.</li><li><strong>Failed strategy:</strong> Unprecedented gerrymandering efforts failed to stop the Democratic wave.</li><li><strong>Leadership choice:</strong> The party appointed Jim Jordan as House minority leader, signaling a commitment to an uncompromising stance.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1tn+:</strong> China's trade surplus for the first 10 months, increasing pressure on US trade policy.</li><li><strong>1881:</strong> The last time a Black senator represented Mississippi until Scott Colom's victory.</li></ul><p><strong>What's next</strong></p><ul><li><strong>2028 positioning:</strong> New York socialists are already backing Alexandria Ocasio-Cortez for the presidency.</li><li><strong>Economic focus:</strong> Cost-of-living data will now dictate the trajectory of the remaining presidency and future campaigns.</li><li><strong>GOP identity:</strong> The party must decide between \"America First\" without Trump or a return to pragmatism.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is struggling to maintain domestic stability while attempting to lead Europe through a security crisis.</p><p><strong>Why it matters:</strong> Internal coalition fractures and the rise of the far-right AfD are paralyzing German governance, weakening Berlin's leverage within the EU and NATO.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of the labor minister and disputes over ECB appointments signal a breakdown in executive cooperation.</li><li><strong>AfD surge:</strong> The far-right is infiltrating regional parliaments and securing leadership roles, fueling investor anxiety and threatening the market economy.</li><li><strong>Legal turmoil:</strong> Allegations that CDU lawmakers supported the AfD create a crisis of legitimacy for Merz’s conservative base.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Military pivot:</strong> Germany is aggressively expanding surveillance powers and appointing Ukraine-aligned leadership to the Bundeswehr.</li><li><strong>Fiscal tension:</strong> The Council of Economic Experts warns that defense borrowing could push GDP debt to 98% by 2040.</li><li><strong>Espionage threat:</strong> Recent arrests and Apple security warnings highlight \"intense\" Russian hacking and intelligence operations targeting German officials.</li></ul><p><strong>The EU power struggle</strong></p><ul><li><strong>Budget leverage:</strong> Merz is using the EU's €2tn budget as a bargaining chip to force unanimous funding for Ukraine.</li><li><strong>Diplomatic friction:</strong> France is pressuring Berlin over the nuclear risks associated with Germany's new long-range missile capabilities.</li></ul><p><strong>What's next:</strong> Watch for the March presidential transition to Ilse Aigner and whether Hendrik Wüst emerges as a viable alternative to Merz as the chancellor's popularity wanes.</p>", "central banks": "<p>Central banks are pivoting back to aggressive tightening as inflation proves stubborn.</p><p><strong>Why it matters:</strong> Strong growth and labor data are neutralizing previous rate hikes, forcing policymakers to consider larger increases to prevent inflation from becoming entrenched.</p><p><strong>The current landscape</strong></p><ul><li><strong>U.S. Fed:</strong> Officials are weighing 50bp moves if inflation fails to slow, driven by a \"running hot\" economy.</li><li><strong>Bank of England:</strong> Rates hit 4%, but leadership warns there is \"further to go\" to regain international credibility.</li><li><strong>ECB:</strong> Headline price pressures are accelerating, keeping the bank on a tightening trajectory.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Leadership Vacuum:</strong> The ECB is entering a critical transition as Christine Lagarde departs early.</li><li><strong>Tool Expansion:</strong> Frontrunners for the ECB presidency, including Klaas Knot, signal a willingness to \"invent new tools\" to fight potential debt crises.</li><li><strong>Transmission Risk:</strong> Shifts in the UK mortgage market may force future rates to fall faster than historical norms.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed Schedule:</strong> The Federal Reserve is shifting to seven policy meetings next year, breaking a decades-old custom of eight.</li><li><strong>ECB Succession:</strong> Brussels is enforcing tight deadlines for nominations to ensure stability amid French bond market turbulence.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit flight to higher-yielding accounts, while regulatory failures and money laundering fines are eroding bottom lines.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman Sachs is preparing for top executives.</li><li><strong>$350 million:</strong> Fine levied against Amex for systemic money laundering failures.</li><li><strong>17%:</strong> Drop in Bank of America profits following a $1.2 billion fine.</li><li><strong>30%:</strong> Increase in Goldman Sachs' Q3 net income, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Talent War:</strong> Citi is shortening junior analyst programs to two years to prevent poaching by private equity firms.</li><li><strong>The AI Paradox:</strong> While banks use AI to boost trading profits, they are restricting AI agents from account access to prevent automated deposit shifts.</li><li><strong>Regulatory Scrutiny:</strong> Post-SVB reviews highlight a \"culture of risk aversion\" at the Fed that delayed critical interventions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>China Expansion:</strong> Citi will scale its securities business following long-awaited approval.</li><li><strong>Leadership Shifts:</strong> Evercore has introduced a co-president structure to manage its leadership transition.</li><li><strong>Market Cooling:</strong> Analysts expect a sharp slowdown in trading revenue following a bumper start to the year.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>15 Nov 2026 17:21 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
