/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing under the pressure of geopolitical instability and shifting trade protections.</p><p><strong>Why it matters:</strong> Supply chain disruptions in the Middle East and Russia are driving immediate price spikes for consumers. Simultaneously, the race for critical minerals is fueling a strategic \"tug of war\" between the U.S. and China.</p><p><strong>The energy crunch</strong></p><ul><li><strong>UK Fuel:</strong> Diesel prices are expected to hit £2 per litre due to Middle East disruptions and potential U.S. export bans.</li><li><strong>EU Gas:</strong> Europe faces intense competition with Asia for LNG cargoes as storage levels hit record lows.</li><li><strong>Infrastructure:</strong> The UN warns that global power grids require massive investment to meet climate and access goals.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>LNG Expansion:</strong> A Shell-led consortium is doubling production capacity at the $23bn LNG Canada project.</li><li><strong>Critical Metals:</strong> The West is aggressively diversifying supply chains for tungsten and chrome to reduce reliance on China.</li><li><strong>Geopolitical Influence:</strong> Nicaragua has granted Chinese miners rights to 10% of its land, expanding Beijing's footprint in Central America.</li></ul><p><strong>Corporate & Political friction</strong></p><ul><li><strong>Trade Wars:</strong> The UK biodiesel industry is protesting the lack of duties on cheap U.S. imports.</li><li><strong>Legal Hurdles:</strong> A Kenyan court blocked Dangote’s $16bn refinery, stalling efforts to cut fuel import dependence.</li><li><strong>Internal Strife:</strong> Former Pioneer founder Scott Sheffield claims Exxon launched a \"smear campaign\" following its $60bn acquisition.</li></ul><p><strong>What's next:</strong> Watch for the Trump administration's stance on diesel exports, which will determine if European pump prices stabilize or surge further this winter.</p>", "corporate earnings and results": "<p>Corporate earnings are shifting as AI infrastructure costs soar and traditional retail pivots toward luxury partnerships.</p><p><strong>Why it matters:</strong> High capital expenditures in AI are forcing tech giants to seek new financing models, while consumer-facing brands are restructuring to protect margins against volatile demand.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Nvidia</strong> is engaging insurers to distribute the financial risk of AI build-outs, signaling a move to deepen Wall Street's involvement in infrastructure funding.</li><li><strong>Anthropic</strong> is preparing for an IPO while explicitly warning investors of \"existential risks\" associated with its technology.</li></ul><p><strong>Retail & Consumer Shifts</strong></p><ul><li><strong>M&S</strong> is integrating Sephora concessions into 100 stores to capture high-end beauty spend.</li><li><strong>Toyota</strong> is seeing a sales collapse in China, driven by high fuel prices and local competition.</li><li><strong>Starbucks</strong> is cutting sustainability staff and scaling back ESG targets to prioritize core operational efficiency.</li></ul><p><strong>Financial Sector Volatility</strong></p><ul><li><strong>UniCredit</strong> is aggressively pursuing control of Commerzbank, aiming for a board overhaul by January.</li><li><strong>Grant Thornton</strong> is hiking graduate pay to £40,000 to disrupt the Big Four's talent monopoly.</li><li><strong>Julius Baer</strong> shares hit record highs following the closure of a Swiss regulatory probe into Signa exposure.</li></ul><p><strong>What's next:</strong> Watch for a trend of \"risk-sharing\" in tech as companies move away from balance-sheet-heavy AI investments toward insurance and third-party financing.</p>", "middle east war": "<p>The Middle East is entering a phase of high-intensity volatility as the Iran-Israel conflict spills into global trade and regional diplomacy.</p><p><strong>Why it matters:</strong> Escalating hostilities are driving up government borrowing costs and freight rates, while shifting alliances threaten the stability of key maritime chokepoints.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>Iran vs. West:</strong> Trump has rejected a seven-day ceasefire proposal from Tehran aimed at reopening the Strait of Hormuz.</li><li><strong>Regional Rifts:</strong> The UAE and Saudi Arabia are attempting to mend ties following disputes over Yemen.</li><li><strong>Internal Pressure:</strong> Israeli PM Netanyahu faces mounting criticism over reports that he ignored pre-October 7 warnings from Egypt and the UAE.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Shipping:</strong> Freight costs are surging, hurting retailers like Shein and driving the value of old supertankers above new builds.</li><li><strong>Finance:</strong> Bond investors are pivoting to oil trading as conflict-driven crude prices push government yields higher.</li><li><strong>Sanctions:</strong> US curbs on Iranian airlines have forced the UAE to halt flights to Iran, while pharmaceutical shortages mount in Tehran.</li></ul><p><strong>Security risks</strong></p><ul><li><strong>Maritime Trade:</strong> The US warns that a Houthi-al-Shabaab partnership threatens both sides of the Gulf of Aden.</li><li><strong>Global Spillover:</strong> Recent terror arrests in the UK near RAF Fairford highlight the vulnerability of US air bases used for strikes on Iran.</li><li><strong>Power Vacuums:</strong> Kurdish leaders warn that US withdrawals from Iraq leave the region exposed to Iranian aggression.</li></ul>", "shipping": "<p>Global shipping is fracturing under the weight of geopolitical conflict and climate instability.</p><p><strong>Why it matters:</strong> The convergence of Middle East warfare and environmental crises is dismantling established trade rules, driving costs to record highs and forcing a structural shift in how goods move.</p><p><strong>The crisis points</strong></p><ul><li><strong>The Hormuz Chokepoint:</strong> Iranian attacks and U.S. military restrictions have crippled the Strait of Hormuz, pushing supertanker rates to a record $1.2 million per day.</li><li><strong>The Shadow Fleet:</strong> Russia has expanded its fleet by 33% to bypass sanctions, contributing to a collapse in global maritime regulatory standards.</li><li><strong>Climate Constraints:</strong> Severe droughts are forcing the Panama Canal to cut daily transits, further straining global capacity.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.2M:</strong> Daily cost for the largest oil tankers on Middle East-China routes.</li><li><strong>33%:</strong> Increase in ships sailing under the Russian flag.</li><li><strong>2028:</strong> Target date for the first U.S.-backed nuclear-powered merchant vessel.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Security gaps:</strong> Digital vulnerability is rising as hackers target satellite links connected to critical engine and navigation systems.</li><li><strong>Strategic pivots:</strong> South Korea is accelerating Arctic trade routes to bypass traditional chokepoints like Hormuz.</li><li><strong>Investment shift:</strong> Institutional investors are pivoting to shipping as a \"hard asset\" hedge against Middle East volatility.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Decarbonization:</strong> The industry is testing wind sails and ammonia/methanol fuels as biodiesel prices drop.</li><li><strong>Fleet evolution:</strong> The U.S. plans to challenge Chinese shipbuilding dominance via nuclear-powered merchant ships.</li><li><strong>Regulatory battles:</strong> Shipping lines are lobbying for stricter battery declarations to mitigate increasing onboard fire risks.</li></ul>", "artificial intelligence": "<p>The AI industry is shifting from raw hype to a volatile era of massive capital expenditure, safety crises, and a search for sustainable revenue.</p><p><strong>Why it matters:</strong> The gap between astronomical valuations and actual income is widening, forcing a pivot toward enterprise monetization and strategic acquisitions.</p><p><strong>The financial friction</strong></p><ul><li><strong>The Burn:</strong> Anthropic reported an $8B loss on $4.6B in revenue.</li><li><strong>The Bet:</strong> AMD is spending $8B to acquire World Labs to master 3D environment modeling.</li><li><strong>The Hedge:</strong> Nvidia is initiating a record $150B share buyback as stock growth slows.</li><li><strong>The Shift:</strong> Corporate America is migrating toward cheaper \"open\" models, including Chinese alternatives, to lower costs.</li></ul><p><strong>Safety and security risks</strong></p><ul><li><strong>Agent Failure:</strong> OpenAI paused GPT-6.1 Astra and admitted its agents leaked data from dozens of organizations, including governments.</li><li><strong>New Threats:</strong> \"LLM-jacking\" is surging as hackers hijack costly AI servers for cybercrime.</li><li><strong>Institutional Pushback:</strong> The Pope and various regulators are intensifying pressure on executives over existential risks.</li></ul><p><strong>The human element</strong></p><ul><li><strong>Soft Skills:</strong> Employers report that AI cannot replace the cultural nuance and relationship-building of local language skills.</li><li><strong>Career Pivot:</strong> Personal branding is becoming a primary strategy for white-collar workers to future-proof against automation.</li><li><strong>Ethics:</strong> Retailers like Walmart are preemptively rejecting AI-driven personalized pricing to maintain consumer trust.</li></ul><p><strong>What's next:</strong> Watch for a \"breakeven\" reckoning. Hyperscalers are restructuring global debt to fund infrastructure, but investment will stall if \"openness\" regulations in Europe and the US stifle deployment.</p>", "us-china relations": "<p>US-China relations have shifted from strategic cooperation to a zero-sum competition.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy increases the risk of systemic conflict. Both nations now view the other's gain as an automatic loss, eroding global stability.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in Washington and Beijing is viewed as ill-equipped for the far-sighted diplomacy required to avoid escalation.</li><li><strong>BRICS pivot:</strong> US tariffs and sanctions are driving a rare consensus among BRICS nations, shifting economic gravity away from the G7.</li><li><strong>AI hegemony:</strong> US dominance in AI data centers creates a power imbalance that Beijing views as a strategic threat.</li></ul><p><strong>The ripple effect</strong></p><ul><li><strong>Asia-Pacific instability:</strong> US unpredictability regarding defense guarantees is forcing allies like Japan and South Korea to question American reliability.</li><li><strong>Transactional diplomacy:</strong> A retreat from liberal democratic values by the US is emboldening authoritarians globally.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Managed friction:</strong> Future summits will focus on crisis management rather than true détente.</li><li><strong>Economic decoupling:</strong> Expect increased use of sanctions and retaliatory measures as both powers prioritize security over trade.</li></ul>", "us elections": "<p>Republicans face a precarious midterm landscape defined by Trump's declining popularity and economic volatility.</p><p><strong>Why it matters:</strong> High inflation and housing costs are eroding the GOP's rural and Hispanic bases, threatening their hold on the Senate.</p><p><strong>The friction points</strong></p><ul><li><strong>Economic pain:</strong> Mortgage rates exceeding 7% and fuel price spikes from the Iran war are driving voter dissatisfaction.</li><li><strong>Base alienation:</strong> Trump's pro-AI stance and heavy-handed immigration policies are distancing loyalists and Hispanic voters.</li><li><strong>Legal battles:</strong> The Supreme Court has blocked mail-in ballot restrictions but allowed the vetting of voters' immigration status.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1 billion:</strong> The scale of the Republican ad blitz intended to counter Trump's sinking approval ratings.</li><li><strong>$5,000:</strong> The \"dividend\" Trump promised to pay all American adults if Republicans win.</li><li><strong>7%:</strong> The threshold breached by mortgage rates, intensifying the housing affordability crisis.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Money vs. Message:</strong> Billionaire funding remains heavily skewed toward Republicans, but financial backing is struggling to offset a toxic campaign message.</li><li><strong>Strategic pivots:</strong> The GOP is shifting from policy discussions to fear-based campaigning, framing Democrats as \"lunatics.\"</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate volatility:</strong> Control of the Senate is now considered \"on a knife edge,\" with Georgia emerging as a critical audition for 2028.</li><li><strong>Post-election risk:</strong> Democrats are signaling a pivot toward investigating the \"Trump crime family\" and Elon Musk if they seize the House.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's eastern strongholds.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Erosion of the Center:</strong> Regional election disasters signal a collapse of trust in mainstream governance, leaving Merz with diminished authority in Berlin and Brussels.</li><li>  <strong>Geopolitical Risk:</strong> A surging AfD creates a strategic opening for Russia and the U.S. right, potentially destabilizing EU budget deals and Ukraine support.</li></ul><p><strong>By the numbers:</strong></p><ul><li>  <strong>40%:</strong> The AfD's target vote share for the next federal elections.</li><li>  <strong>€2tn:</strong> The EU budget deal currently jeopardized by Merz's weakened domestic standing.</li><li>  <strong>3 seats:</strong> The narrow margin preventing the AfD from leading a regional government in Saxony-Anhalt.</li></ul><p><strong>Between the lines:</strong></p><ul><li>  <strong>The Succession Race:</strong> Hendrik Wüst is positioning himself as the \"chancellor-in-waiting,\" leveraging his popularity in North Rhine-Westphalia to signal a viable alternative to Merz.</li><li>  <strong>The \"Nostalgia\" Gap:</strong> Younger voters are decoupling from post-war historical warnings, making them more susceptible to AfD and BSW populism.</li><li>  <strong>The Kingmaker:</strong> The hard-left BSW is emerging as a critical power broker, complicating the path to stable coalitions.</li></ul><p><strong>What's next:</strong></p><ul><li>  <strong>Diplomatic Pivot:</strong> Germany is maintaining high-stakes channels with Russia and Turkey to manage regional instability.</li><li>  <strong>Defense Acceleration:</strong> A secretive \"guerrilla unit\" within the defense ministry is bypassing bureaucracy to fast-track arms deals for Ukraine.</li></ul>", "central banks": "<p>Central banks are facing a simultaneous crisis of security, legitimacy, and tool effectiveness.</p><p><strong>Why it matters:</strong> Traditional monetary policy is failing to address supply-side shocks, while geopolitical rivalry and security breaches threaten the operational stability of the world's most powerful financial institutions.</p><p><strong>The security gap</strong></p><ul><li>  <strong>Fed vulnerability:</strong> Watchdogs warn of \"breakdowns and deficiencies\" in U.S. central bank security, leaving it exposed to foreign adversaries.</li><li>  <strong>Geopolitical shifts:</strong> Saudi Arabia's exit from China's cross-border currency platform signals a fracture in Beijing's attempt to challenge dollar hegemony.</li></ul><p><strong>Policy limitations</strong></p><ul><li>  <strong>Tool fatigue:</strong> Experts argue rate hikes are \"not the only game in town\" and are ineffective against climate or geopolitical supply shocks.</li><li>  <strong>The supply realization:</strong> Policymakers are acknowledging a taboo: monetary policy impacts supply, not just demand.</li><li>  <strong>Credibility tests:</strong> Rising bond yields are forcing a choice between tightening further or losing inflation-fighting credibility.</li></ul><p><strong>Institutional instability</strong></p><ul><li>  <strong>Remit reviews:</strong> The Bank of England faces inquiries into whether its mandate is \"fit for purpose\" amid rising populist pressure.</li><li>  <strong>Leadership churn:</strong> Isabel Schnabel's early departure from the ECB to the IMF triggers a top-level reshuffle.</li><li>  <strong>The \"State\" threat:</strong> A shift toward state-directed finance threatens the long-term independence of central bankers.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>QT Endgames:</strong> The BoE is finalizing a multiyear plan to unwind gilt purchases by 2034.</li><li>  <strong>Fed Evolution:</strong> Under Kevin Warsh, the Fed is grappling with the coherence of its \"dot plot\" projections and the need for a clearer economic narrative.</li></ul>", "us banks": "<p>US banks are aggressively pivoting toward AI-driven revenue and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is shifting its risk appetite toward AI infrastructure and wealth management to offset slowing trading revenues and regulatory volatility.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Revenue streams:</strong> Goldman Sachs earned $200M+ in fees from AI-focused hedge fund Situational Awareness.</li><li><strong>Financing limits:</strong> Banks are offloading $15B in debt for Anthropic data centers to free up lending capacity for other mega-AI deals.</li><li><strong>Cost pressure:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the time required for routine law work.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulatory push:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB fallout:</strong> A White House review blamed a \"culture of risk aversion\" among regulators for mishandling the Silicon Valley Bank collapse.</li><li><strong>Crypto integration:</strong> Regulators granted a banking license to the Trump family's crypto venture, signaling a shift in digital asset oversight.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Asset expansion:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3B to grow its asset management footprint.</li><li><strong>Wealth management:</strong> Morgan Stanley captured $74B in Q2 assets following high-profile IPOs like SpaceX.</li><li><strong>Infrastructure:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with tokenized systems.</li></ul><p><strong>Between the lines</strong> The tension between \"America First\" politics and banking operations is peaking. Bank of America pledged $250B to US projects after the president snubbed its CEO, while JPMorgan is balancing regulatory caution (debanking Polymarket) with strategic ties to high-valuation platforms.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>29 Sep 2026 16:44 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
