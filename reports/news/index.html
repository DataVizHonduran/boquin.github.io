.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

ong> The benchmark for the Bank of Japan's recent rate hike, the highest level seen since that year.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Currency volatility:</strong> The Yen continues to sink despite BoJ hikes, proving that interest rate differentials with the US outweigh local tightening.</li><li><strong>Systemic fragility:</strong> Regulators are intensifying scrutiny of prime brokers following losses at AI-focused hedge funds.</li><li><strong>Data noise:</strong> Social media echo chambers are distorting consumer inflation expectations, making traditional surveys unreliable for policymakers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership shifts:</strong> Eurozone governments are currently bartering over Christine Lagarde’s successor at the ECB.</li><li><strong>Commodity shocks:</strong> Surging oil prices may force the BoE and ECB to pivot back toward rate hikes to prevent inflation resurgence.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven financing and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is aggressively funding the AI infrastructure build-out to offset slowing trading revenues and regulatory volatility.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley is leading debt structures for data centers; banks are offloading $15bn in Anthropic debt to maintain lending capacity.</li><li><strong>Efficiency:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the time required for routine legal work.</li><li><strong>Growth:</strong> Asia-based semiconductor investments are driving record equities revenue for US firms.</li></ul><p><strong>Regulatory Friction</strong></p><ul><li><strong>Deregulatory Shift:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><stro /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>22 Sep 2026 15:12 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
