const SUMMARIES = {"oil and gas": "<p>Global oil and gas majors are aggressively expanding production capacity to hedge against geopolitical instability.</p><p><strong>Why it matters:</strong> Middle East volatility and \"hybrid warfare\" are forcing a strategic pivot toward secure, deepwater, and domestic assets to ensure energy security.</p><p><strong>The consolidation play</strong></p><ul><li><strong>Chevron</strong> is nearing a $5bn acquisition of Beacon Offshore Energy to scale US Gulf deepwater production.</li><li><strong>Diamondback</strong> closed a $5bn deal to expand its footprint in the Permian Basin.</li><li><strong>Exxon</strong> is driving a return to frontier drilling in Guyana as rivals follow suit.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>Japan</strong> is proposing an \"Asian IEA\" to create joint oil stockpiles and insulate the region from supply shocks.</li><li><strong>Russia</strong> saw diesel exports double following lifted US sanctions, though Ukraine's refinery attacks threaten longevity.</li><li><strong>The US</strong> is facing pressure to overhaul permitting laws to accelerate fossil fuel infrastructure.</li></ul><p><strong>The energy transition clash</strong></p><ul><li><strong>Legal precedents:</strong> Norway's Supreme Court ruled the government must consider downstream emissions, potentially stalling future projects.</li><li><strong>Political tension:</strong> UK Foreign Secretary David Miliband maintains his position despite the approval of the Rosebank oilfield.</li><li><strong>COP31 deadlock:</strong> Fossil fuel-reliant nations are opposing a final agreement as climate ministers remain deeply divided.</li></ul><p><strong>The AI power crunch</strong></p><ul><li><strong>Infrastructure shift:</strong> Uniper is repurposing disused power plants for data centers to monetize grid-linked sites.</li><li><strong>Capital risk:</strong> SoftBank took a $3.7bn charge after overordering inefficient gas turbines for AI data centers.</li><li><strong>Grid strain:</strong> Oracle’s \"Project Jupiter\" underscores the growing difficulty of securing reliable electricity for massive AI builds.</li></ul>", "corporate earnings and results": "<p>Nvidia is facing a leadership and regulatory crisis that is rattling tech markets.</p><p><strong>Why it matters:</strong> Governance scandals and shifting reporting methods at the world's most influential chipmaker create volatility for the Nasdaq 100 and open doors for European competitors.</p><p><strong>The Nvidia turmoil</strong></p><ul><li><strong>Leadership:</strong> Co-founder Jensen Huang is seeking a return as CEO following a resignation triggered by extramarital affairs.</li><li><strong>Governance:</strong> The board is probing links between Huang’s family and Megaspeed.</li><li><strong>Compliance:</strong> A new committee will oversee U.S. chip export controls to mitigate Washington's criticism over China revenues.</li><li><strong>Accounting:</strong> The company stopped disclosing Singapore sales after revenues through the city-state surged 70% to $104bn.</li></ul><p><strong>Corporate cost-cutting</strong></p><ul><li><strong>Disney:</strong> Implementing a new job-cut blitz to reduce annual spending by $3bn.</li><li><strong>Imperial Brands:</strong> Axing up to 4,600 jobs amid declining cigarette demand.</li></ul><p><strong>M&A and Finance</strong></p><ul><li><strong>Bill Holdings:</strong> TPG is nearing a take-private deal after the firm's market value crashed 80%.</li><li><strong>Iceye:</strong> The satellite group launched a €2bn bid for Avio to build a European space and defense powerhouse.</li><li><strong>Deutsche Bank:</strong> A leak of 15 million files exposes systemic failures and reveals larger-than-reported dealings with Jeffrey Epstein.</li></ul><p><strong>What's next:</strong> Investors are bracing for Nvidia's official earnings results to see if financial growth can offset the current leadership instability.</p>", "middle east war": "<p>The Middle East is entering a phase of systemic instability as Iran expands direct kinetic attacks and Israel's domestic political structure collapses.</p><p><strong>Why it matters:</strong> Escalating regional conflict is decoupling traditional alliances and disrupting global energy and trade corridors.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Iran vs. Gulf States:</strong> Tehran has launched direct attacks on U.S. bases in Bahrain and tankers in the Strait of Hormuz.</li><li><strong>Yemen:</strong> Saudi-backed forces are retreating from the Red Sea, granting Houthi militants greater control over the Bab al-Mandeb Strait.</li><li><strong>Gaza:</strong> Humanitarian conditions are deteriorating amid winter rains and continued Israeli strikes on medical infrastructure.</li></ul><p><strong>Inside Israel</strong></p><ul><li><strong>Political Chaos:</strong> Netanyahu faces a parliamentary coup as opposition parties and Haredi rabbis move to seize control of the government.</li><li><strong>Diplomatic Decay:</strong> The U.S.-Israel alliance has reached a \"crisis point,\" compounded by UK sanctions on West Bank settlement firms.</li></ul><p><strong>The economic ripple</strong></p><ul><li><strong>Supply Chains:</strong> The U.S.-Iran conflict is forcing Emirati retailers to find circuitous routes for basic food imports.</li><li><strong>Energy:</strong> Saudi Arabia is maintaining pre-war oil production levels despite targeted attacks on shipping and energy infrastructure.</li></ul><p><strong>What's next</strong></p><ul><li><strong>U.S. Pivot:</strong> President Trump has signaled an end to peace deal efforts with Tehran, shifting focus toward domestic priorities.</li><li><strong>Regional Realignment:</strong> Turkey is leveraging Gaza \"ecocide\" rhetoric at COP31 to gain diplomatic leverage while easing tensions with Greece.</li></ul>", "shipping": "<p>Global shipping is facing a volatility crisis as geopolitical conflict disrupts primary trade arteries.</p><p><strong>Why it matters:</strong> Attacks in the Hormuz Strait and Black Sea are forcing ships into longer, costlier routes. This shift drives up operational expenses and threatens global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has intensified attacks, targeting 24 vessels in two weeks using limpet mines and speedboats.</li><li><strong>Black Sea:</strong> Now the world's deadliest route for commercial sailors due to the Russia-Ukraine war.</li><li><strong>Arctic:</strong> Transits via the Northern Sea Route have quadrupled as ships avoid Middle Eastern conflict zones.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>$2 billion:</strong> The scale of a US oil trader's gamble on tankers to bypass Hormuz.</li><li><strong>24.6 million:</strong> Daily barrels of Gulf oil exports, recovering to pre-war levels via alternative routes.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic shifts:</strong> Russia is using \"spoofing\" to fake vessel locations and diverting grain to Arctic ports to bypass Black Sea battles.</li><li><strong>Corporate pivots:</strong> Maersk is aggressively buying ships to counter CMA CGM, despite a 10% stock dip following weak Q3 results.</li><li><strong>Political friction:</strong> US domestic politics are interfering with fuel supplies, with New Jersey officials threatening to block Russian diesel shipments.</li></ul><p><strong>What's next</strong> Watch for a potential \"shipping squeeze.\" Vitol warns that a shortage of available tankers could push oil toward $200 a barrel if bottlenecks persist.</p>", "artificial intelligence": "<p>The AI investment boom is hitting a wall of physical, political, and financial reality.</p><p><strong>Why it matters:</strong> Massive capital expenditures in data centers are colliding with local voter backlash and soaring debt, threatening the scalability of frontier models.</p><p><strong>By the numbers</strong></p><ul><li><strong>$4.2 trillion:</strong> Market value lost by data center construction stocks as the trade unravels.</li><li><strong>20%:</strong> Average decline of the year's ten biggest IPOs following an AI-driven frenzy.</li><li><strong>$17 billion:</strong> Amazon's Ohio investment currently threatened by community opposition.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Physical limits:</strong> The \"picks and shovels\" phase is stalling. Local moratoriums and power constraints are turning data centers into political liabilities.</li><li><strong>Content moat:</strong> As AI-generated \"fluff\" saturates the web, high-quality, human-authored data has become a premium asset, giving publishers more leverage.</li><li><strong>Geopolitical shift:</strong> The U.S. and allies are formalizing supply chain protections to decouple AI hardware from China.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The IPO litmus test:</strong> Anthropic’s public debut will determine if frontier labs can sustain massive computing costs under the scrutiny of public equity markets.</li><li><strong>Sovereign AI:</strong> Nations like India are funding native models to avoid \"digital colonialism\" and dependence on U.S. tech.</li><li><strong>Regulatory push:</strong> The EU is accelerating efforts for global AI rules, sensing a window of opportunity following U.S. political volatility.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global primacy as the U.S. faces internal political volatility.</p><p><strong>Why it matters:</strong></p><ul><li>U.S. political instability and potential retrenchment create power vacuums in the Middle East and Asia.</li><li>China is leveraging this instability to reshape the global order and trade architecture on its own terms.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Big Three\" Illusion:</strong> While summits between Trump, Xi, and Putin suggest a return to \"Great Power\" spheres of influence, smaller \"middle powers\" are increasingly thwarting the agendas of superpowers.</li><li><strong>European Anxiety:</strong> EU leaders fear that regardless of U.S. election outcomes, the era of an outward-looking superpower underwriting European defense is over.</li><li><strong>The Ukraine Variable:</strong> The conflict serves as a proxy for the broader struggle between democratic and autocratic governance, with U.S. consistency on aid remaining a critical vulnerability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Strategic Competition:</strong> Expect China to accelerate its efforts to build alternative supply chains and diplomatic blocs to reduce reliance on the U.S.</li><li><strong>Global Realignment:</strong> Middle powers, led by nations like Australia, will likely prioritize economic security and diversified partnerships over binary alliances.</li></ul>", "us elections": "<p>Democrats secured a sweeping midterm victory, signaling a significant shift in voter priorities and party strategy.</p><p><strong>Why it matters:</strong> The results suggest a rejection of right-wing populism and \"woke\" politics in favor of class-based economic appeals and centrist pragmatism.</p><p><strong>By the numbers</strong></p><ul><li><strong>Historic wins:</strong> Scott Colom became the first Black senator from Mississippi since the Reconstruction era.</li><li><strong>Failed strategy:</strong> Republican gerrymandering efforts failed to offset the Democratic surge.</li><li><strong>Trade tension:</strong> China's trade surplus exceeded $1tn, adding economic volatility to the 2028 outlook.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Voter volatility:</strong> Older voters abandoned lifelong political identities to support Democrats.</li><li><strong>Strategic pivot:</strong> Democrats are ditching culture-war rhetoric to focus on labor and affordability.</li><li><strong>GOP denial:</strong> Republican leadership is blaming Big Tech and AI rather than Donald Trump for the losses.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership battles:</strong> Chris Van Hollen is challenging Chuck Schumer for Senate majority leader.</li><li><strong>2028 positioning:</strong> New York socialists are already backing Alexandria Ocasio-Cortez for the presidency.</li><li><strong>GOP identity crisis:</strong> The Republican party must decide between \"America First\" without Trump or a return to pragmatism.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is struggling to project stability as internal coalition strife and the rise of the far-right AfD erode Germany's domestic and international influence.</p><p><strong>Why it matters:</strong></p><ul><li>Political instability in Berlin weakens the EU's collective ability to fund Ukraine and finalize its €2tn budget.</li><li>Domestic friction over debt and defense spending hampers Germany's transition into a primary European military power.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of Labour Minister Bärbel Bas stalls critical pension and market reforms.</li><li><strong>Governance gaps:</strong> Disagreements between the Chancellor and Finance Minister have blocked appointments to the ECB executive board.</li><li><strong>AfD surge:</strong> The far-right is infiltrating regional governments, securing its first regional parliament president through secret deals with established parties.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Strategic setbacks:</strong> Italy rejected Germany's bid to join the UK-Japan-Italy fighter jet project as an equal partner.</li><li><strong>Espionage threats:</strong> The government warned MPs of iPhone hacks while arresting a Ukrainian national suspected of spying for the Kremlin.</li><li><strong>Nuclear friction:</strong> France is demanding clarity on Germany's \"deep precision strike\" doctrine to avoid accidental nuclear escalation with Russia.</li></ul><p><strong>The bottom line</strong></p><ul><li><strong>Debt vs. Defense:</strong> The Council of Economic Experts warns that military spending must move to the regular budget to prevent debt from hitting 98% of GDP by 2040.</li><li><strong>Leadership vacuum:</strong> Low popularity for Merz and the rise of \"chancellor-in-waiting\" Hendrik Wüst suggest a volatile leadership transition.</li></ul>", "central banks": "<p>Global central banks are pivoting back to hawkish stances as inflation remains entrenched and growth falters.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing policymakers to prioritize inflation control over economic growth, risking deeper recessions in the US, UK, and Eurozone.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> Officials are weighing a 50bp rate hike in December due to strong jobs and growth data.</li><li><strong>Bank of England:</strong> Rates rose to 4% recently, with Chief Economist Huw Pill signaling further increases are necessary.</li><li><strong>ECB:</strong> Headline inflation continues to accelerate, keeping the bank on a tightening trajectory.</li><li><strong>Bank of Japan:</strong> A potential December rate rise is under threat due to contracting quarterly GDP.</li></ul><p><strong>Between the lines</strong> Central bank communication is becoming fragmented. Divergent signals from officials—such as the Fed's Christopher Waller—create market volatility and uncertainty regarding the \"terminal rate.\"</p><p><strong>What's next</strong></p><ul><li><strong>ECB Leadership:</strong> A race is underway to succeed Christine Lagarde, with frontrunners Klaas Knot and Pablo Hernández de Cos emphasizing crisis-fighting tools and pragmatism.</li><li><strong>Policy Shift:</strong> Expect a transition from \"holding\" patterns to active tightening if core inflation fails to hit 2% targets.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention while battling regulatory fines and shifting deposit patterns.</p><p><strong>Why it matters:</strong> The industry is facing a dual transition. Banks must modernize technical infrastructure to maintain trading dominance while managing the risk that AI agents will automate the flight of deposits to higher-yield competitors.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks as AI agents move savers to better rates.</li><li><strong>$350 million:</strong> Amex fine for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> BofA money laundering fine contributing to a 17% profit drop.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Talent war:</strong> Goldman is elevating record numbers of engineers to partner; Citi is shortening junior promotion paths to prevent poaching by private equity.</li><li><strong>Regulatory friction:</strong> The White House and courts continue to clash over the Fed's \"culture of risk aversion\" regarding the SVB collapse.</li><li><strong>Strategic shifts:</strong> Citi's approval for China securities business signals a push for growth ahead of key US-China diplomatic meetings.</li></ul><p><strong>What's next</strong></p><ul><li><strong>AI Supervision:</strong> Regulators are exploring AI to monitor bank culture and prevent systemic failures similar to SVB.</li><li><strong>Trading cooldown:</strong> Analysts expect the record-breaking trading streak to slow following a bumper start to the year.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>17 Nov 2026 19:18 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
