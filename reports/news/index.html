const SUMMARIES = {"oil and gas": "<p>AI demand is forcing a global pivot back to fossil fuels and nuclear power.</p><p><strong>Why it matters:</strong> The massive energy requirements of data centers are outpacing the rollout of renewables, creating a \"power gap\" that threatens climate goals and spikes electricity prices.</p><p><strong>The AI energy crunch</strong></p><ul><li><strong>Fossil fuel resurgence:</strong> U.S. spending on fossil fuel power is set to exceed China's for the first time in decades, driven by gas turbine demand for AI.</li><li><strong>Nuclear bets:</strong> Proxima Fusion reached a €2.4bn valuation; Holtec is pursuing an IPO to meet AI-driven energy needs.</li><li><strong>Grid instability:</strong> FERC has issued an ultimatum to grid operators to justify how \"large loads\" (data centers) connect to the system.</li><li><strong>Storage surge:</strong> Battery start-ups report \"crazy\" demand to manage power surges from AI processor clusters.</li></ul><p><strong>Geopolitical shifts</strong></p><ul><li><strong>China's strategy:</strong> Beijing is increasing Middle East oil imports as Saudi Arabia drops export prices to 6-year lows.</li><li><strong>Canadian independence:</strong> Canada is planning a new pipeline to Asia to bypass U.S. dependence.</li><li><strong>UAE expansion:</strong> Adnoc acquired Shell’s South African fuels business in a $1bn deal.</li></ul><p><strong>Between the lines</strong> The \"energy transition\" is shifting toward \"energy addition.\" Companies are not replacing carbon with green energy; they are adding carbon and nuclear capacity to sustain the AI boom.</p><p><strong>What's next</strong></p><ul><li><strong>Price volatility:</strong> Clean power prices are expected to soar as AI demand peaks and Biden-era subsidies expire.</li><li><strong>Regulatory battles:</strong> The EU is weighing weaker climate rules for data centers following Big Tech lobbying.</li></ul>", "corporate earnings and results": "<p>AI investment is decoupling stock prices from current earnings.</p><p><strong>Why it matters:</strong> Investors are prioritizing future AI scalability over immediate margins, leading to volatility even when companies report record profits.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>Samsung:</strong> Shares dropped 10% despite record quarterly profits. Investors fear the massive capital expenditure required to sustain the AI boom outweighs current memory chip gains.</li><li><strong>SpaceX:</strong> Morgan Stanley set a $300 price target, valuing the company's AI and rocket capabilities far beyond traditional aerospace metrics.</li><li><strong>SoftBank:</strong> Founder Masa Son has pivoted the entire firm's strategy to a high-stakes bet on AI integration.</li></ul><p><strong>Corporate Retrenchment</strong></p><ul><li><strong>Microsoft:</strong> Cutting 4,800 Xbox jobs to offset weak margins and a hardware downturn.</li><li><strong>HSBC:</strong> Reducing exposure to riskier private credit lending by refusing to renew certain facilities.</li></ul><p><strong>What's next:</strong> Watch for a \"margin squeeze\" where companies with high AI spending but slow monetization face valuation corrections, regardless of top-line growth.</p>", "middle east war": "<p>The Middle East is entering a volatile transition period following the collapse of the Assad regime and the death of Iran's supreme leader.</p><p><strong>Why it matters:</strong> Power vacuums in Syria and Iran are destabilizing regional security and shifting global diplomatic priorities. This instability threatens energy markets and risks escalating into a broader systemic conflict.</p><p><strong>The Iran Transition</strong></p><ul><li><strong>Leadership Gap:</strong> The absence of Mojtaba Khamenei at his father's funeral suggests internal friction over succession.</li><li><strong>Public Pressure:</strong> Massive funeral crowds are demanding revenge, increasing pressure on the new leadership to act aggressively.</li><li><strong>Global Reach:</strong> Iran continues to project power via proxy attacks, evidenced by the conviction of operatives for a stabbing in London.</li></ul><p><strong>Syrian Power Vacuum</strong></p><ul><li><strong>EU Pivot:</strong> President Macron's visit to Damascus marks the first EU leadership engagement since the fall of the Assad regime.</li><li><strong>Instability:</strong> Continued explosions in Damascus signal that the transition of power remains violent and unresolved.</li></ul><p><strong>Israeli Internal Friction</strong></p><ul><li><strong>Constitutional Crisis:</strong> The Netanyahu government is openly defying Supreme Court rulings on TV regulation.</li><li><strong>Political Tension:</strong> Domestic legal battles are coinciding with international pressure over the Gaza conflict.</li></ul><p><strong>Economic Fallout</strong></p><ul><li><strong>Oil Slump:</strong> Citi forecasts Brent crude could drop to $60 a barrel by Christmas due to an expected market surplus.</li><li><strong>Trade Stalls:</strong> Geopolitical instability is hindering large-scale investments, such as the C$70bn UAE-Canada trade plan.</li></ul><p><strong>What's next:</strong> Watch for the official naming of Iran's successor and whether the EU can establish a stable governing framework in Syria to prevent further state collapse.</p>", "shipping": "<p>Global shipping is oscillating between geopolitical volatility in the Middle East and a surge in demand driven by U.S. trade policy.</p><p><strong>Why it matters:</strong> Conflict in the Strait of Hormuz and the Suez Canal disrupts the flow of energy and goods, while looming U.S. tariffs are triggering a \"front-loading\" rush that spikes freight costs.</p><p><strong>The Hormuz deadlock</strong></p><ul><li><strong>The Crisis:</strong> A blockade stranded ~1,200 ships carrying $125B in goods.</li><li><strong>The Recovery:</strong> Transits quadrupled following a US-Iran ceasefire, leading insurers to slash war premiums by over 50%.</li><li><strong>The Friction:</strong> Iran now seeks to impose \"insurance fees\" for passage, creating new financial hurdles for operators.</li></ul><p><strong>Trade war ripples</strong></p><ul><li><strong>Tariff Rush:</strong> Freight rates have hit their highest levels since the 2024 Red Sea crisis as companies stockpile goods to beat new U.S. levies.</li><li><strong>Profit Shift:</strong> Maersk raised profit guidance due to this demand surge, though shares dipped 7% as Suez Canal reopenings threaten to lower freight rates.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Consolidation:</strong> CMA CGM is spending $1.4B to buy FedEx's logistics unit to expand its U.S. supply chain footprint.</li><li><strong>Shadow Fleet:</strong> Russian sanctioned tankers are avoiding the English Channel due to naval interceptions, opting for longer North Atlantic routes.</li></ul><p><strong>What's next:</strong> Market stability depends on whether the US-Iran accord remains \"material\" enough to prevent further projectiles in the Strait of Hormuz.</p>", "artificial intelligence": "<p>The AI industry is shifting from theoretical hype to a high-stakes battle over physical infrastructure, sovereign control, and unsustainable capital costs.</p><p><strong>Why it matters:</strong> The \"frontier\" of AI requires punishing levels of investment, creating a precarious dependency on government subsidies and massive energy infrastructure.</p><p><strong>The capital crunch</strong></p><ul><li><strong>Burn rate:</strong> OpenAI and Anthropic face extreme costs to maintain leadership; falling behind is viewed as a terminal risk.</li><li><strong>Political hedging:</strong> OpenAI is exploring a 5% equity stake for the Trump administration to mitigate regulatory pressure.</li><li><strong>Supply chain:</strong> Honeywell is spinning off a $29bn advanced materials entity to feed the AI hardware pipeline.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>Sovereignty:</strong> The UK and Europe are struggling to move beyond \"US outposts\" due to regulatory red tape and a lack of domestic infrastructure.</li><li><strong>Security:</strong> Anthropic is tightening loopholes to block Chinese access to Claude models.</li><li><strong>Local backlash:</strong> Blackstone halted a Virginia data center project following community protests, signaling a growing \"NIMBY\" threat to AI scaling.</li></ul><p><strong>Regulatory outlook</strong></p><ul><li><strong>US Deregulation:</strong> The incoming Trump administration signals opposition to a centralized AI regulator.</li><li><strong>Financial risk:</strong> The UK's FCA warns of an \"arms race\" as millions use AI for personal finance without adequate oversight.</li></ul><p><strong>What's next:</strong> Watch for a pivot toward \"sovereign AI\" as nations attempt to decouple from US-based oligopolies to protect local economies and security.</p>", "us-china relations": "<p>US-China relations are shifting toward a \"might is right\" world order defined by military brinkmanship and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and China's aggressive posture create a leadership vacuum. This instability increases the risk of systemic global conflict and economic fragmentation.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China is testing boundaries with ballistic missile launches in nuclear-free zones.</li><li>  <strong>Resource warfare:</strong> Beijing is weaponizing critical minerals, evidenced by the detention of Japanese nationals over rare earth smuggling.</li><li>  <strong>Economic volatility:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten global stability.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Asymmetric alliance:</strong> Russia's geopolitical missteps have forced it into a one-sided dependency on Beijing.</li><li>  <strong>Diplomatic pivot:</strong> Xi Jinping is positioning China as a \"pillar of stability\" to attract foreign officials as US leadership wavers.</li><li>  <strong>Hegemony gap:</strong> Both powers seek dominance but avoid the responsibilities and costs of maintaining a global order.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Strategic resilience:</strong> Middle powers like Japan are prioritizing \"new capabilities\" to survive great power competition.</li><li>  <strong>Alliance stress:</strong> US domestic volatility is forcing NATO and G7 allies to hedge against potential American withdrawal.</li></ul>", "us elections": "<p>Internal party fractures and economic discontent are reshaping the US midterm landscape.</p><p><strong>Why it matters:</strong> Progressive insurgencies and controversial Trump-backed nominees are creating volatility in key swing states, potentially alienating moderate voters.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Socialist surge:</strong> Progressive victories in Colorado and New York signal a growing rift between party establishment and the left wing.</li><li><strong>Candidate volatility:</strong> Sexual assault allegations against Maine Senate candidate Graham Platner create immediate ballot instability.</li><li><strong>Policy friction:</strong> The party is struggling to balance progressive demands with the need for broad appeal in general elections.</li></ul><p><strong>The Republican gamble</strong></p><ul><li><strong>MAGA purity:</strong> Trump’s endorsement of Ken Paxton in Texas secures the base but risks alienating moderates in a general election.</li><li><strong>Base erosion:</strong> Evangelicals are questioning Trump's alignment with Christian values.</li><li><strong>Legislative pushback:</strong> The House passed a war powers resolution to limit Trump's autonomy regarding Iran.</li></ul><p><strong>Economic headwinds</strong></p><ul><li><strong>Inflation:</strong> FT polling shows voters increasingly blame Trump for high grocery prices and the cost of living.</li><li><strong>Industry revolt:</strong> Maine lobster fishermen are rethinking support due to tariffs and fuel costs.</li><li><strong>Financial stress:</strong> Low tax refunds are increasing pressure on consumers ahead of November.</li></ul><p><strong>What's next:</strong> Watch the California governor's race between Steve Hilton and Xavier Becerra as a primary gauge of the national appetite for MAGA-aligned politics.</p>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to address security gaps and stagnant growth, risking internal political instability and friction with EU partners.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Germany will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> Berlin is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> France fears Germany is \"going it alone\" after Berlin ditched French partnership for a new fighter jet project.</li><li><strong>Failures:</strong> Cost overruns forced the cancellation of the F126 frigate, the largest warship since WWII.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts and is pushing for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Deregulation:</strong> The coalition agreed to longer Sunday opening hours and stricter sick-leave rules.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD leads opinion polls, fueled by anger over fuel prices and ties to Kremlin associates.</li><li><strong>Internal rivalry:</strong> Merz faces \"chancellor swap\" rumors as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism linked to Middle East tensions.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission and the outcome of the KNDS IPO.</p>", "central banks": "<p>Central banks are shifting toward opaque communication and divergent policy paths.</p><p><strong>Why it matters:</strong> Unpredictable signaling from the Fed and Bank of England increases market volatility and complicates global inflation management.</p><p><strong>The Warsh Effect</strong> New Fed Chair Kevin Warsh is dismantling traditional \"forward guidance\" in favor of a more ambiguous style.</p><ul><li><strong>The goal:</strong> Reduce market reliance on specific forecasts.</li><li><strong>The risk:</strong> Increased \"surprises\" and rate volatility as traders struggle to decode \"Fedspeak.\"</li><li><strong>The stance:</strong> Warsh remains committed to Fed independence and price stability despite White House pressure.</li></ul><p><strong>Global Divergence</strong> Central banks are no longer moving in lockstep, creating fragmentation risks.</p><ul><li><strong>ECB:</strong> President Lagarde signals a shift away from the aggressive force used in 2022-23.</li><li><strong>BoE:</strong> Pushing to limit hedge fund leverage to stabilize the gilt market, despite higher funding cost risks.</li><li><strong>BoJ:</strong> Maintaining a \"guessing game\" strategy on currency intervention to support the yen.</li></ul><p><strong>New Systemic Risks</strong> Technological and geopolitical shifts are forcing a rethink of monetary tools.</p><ul><li><strong>AI Trading:</strong> BoE officials are calling for \"kill switches\" to prevent AI-driven herding and flash crashes.</li><li><strong>QT Failures:</strong> Geopolitical crises (e.g., Iran) are undermining Quantitative Tightening programs.</li><li><strong>Private Shift:</strong> Sovereign wealth funds are exiting public markets for private credit to capture AI growth.</li></ul><p><strong>What's next:</strong> Markets will watch for whether Warsh's \"Delphic\" communication style stabilizes the economy or triggers deeper instability through uncertainty.</p>", "us banks": "<p>US banks are leveraging deregulation and international expansion to drive growth while facing internal leadership volatility.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing lenders to aggressively pursue acquisitions and global market share.</p><p><strong>The JPMorgan Shuffle</strong> CEO Jamie Dimon is radically restructuring his succession pipeline:</p><ul><li><strong>Leadership purge:</strong> Longtime contender Marianne Lake was abruptly removed from the CEO race.</li><li><strong>New guard:</strong> Doug Petno and Troy Rohrbaugh now lead two of the bank's largest divisions.</li><li><strong>Expansion:</strong> The bank is scaling its digital retail presence in France, Spain, and Italy.</li></ul><p><strong>The Regulatory Tug-of-War</strong> Wall Street is pushing for a lighter touch on capital rules:</p><ul><li><strong>Capital gains:</strong> Deregulation has handed top US and UK banks $1.3 trillion in balance sheet capacity.</li><li><strong>The risk:</strong> Critics warn that \"checklist\" deregulation weakens systemic resilience.</li><li><strong>Stress tests:</strong> Fed tests show US banks could lose $700 billion in a severe economic crash.</li></ul><p><strong>Global Dynamics</strong> Geopolitical tensions are forcing a bifurcated operational strategy:</p><ul><li><strong>China boom:</strong> Goldman Sachs, Morgan Stanley, and JPMorgan reported record profits from China securities units.</li><li><strong>Security risks:</strong> Morgan Stanley now issues China-only iPhones to Hong Kong staff to protect data.</li><li><strong>Competition:</strong> Non-bank trading firms (Citadel, Jane Street) hit $114 billion in revenue, eating into traditional bank margins.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$20 billion:</strong> Potential acquisition budget for JPMorgan.</li><li><strong>$50 billion:</strong> Excess capital Dimon claims was freed by lighter regulation.</li><li><strong>$4 billion:</strong> Amount of private equity-linked loans JPMorgan seeks to offload.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>07 Jul 2026 12:43 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
