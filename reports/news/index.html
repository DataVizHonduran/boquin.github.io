const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Middle East is decoupling oil prices from traditional market fundamentals.</p><p><strong>Why it matters:</strong> Conflict-driven disruptions in the Strait of Hormuz are creating artificial supply bottlenecks. This volatility triggers inflationary pressure on diesel and prompts aggressive government interventions, including windfall taxes and strategic stockpile disputes.</p><p><strong>The volatility loop</strong></p><ul><li><strong>Supply shocks:</strong> Tanker attacks and reduced Hormuz transit are driving prices higher.</li><li><strong>Inventory crisis:</strong> Saudi Aramco warns global stockpiles are \"scarily thin\" and could take two years to recover.</li><li><strong>Shipping squeeze:</strong> Vitol warns a tanker shortage could push crude toward $200 a barrel.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Diversification:</strong> ExxonMobil is scaling Caribbean offshore projects to replicate Guyana's success.</li><li><strong>Resource security:</strong> US startups are targeting China's monopoly on critical metals for rare earth magnets.</li><li><strong>Risk appetite:</strong> TotalEnergies and other majors are increasing Middle East investments despite active conflict.</li></ul><p><strong>The legal & political front</strong></p><ul><li><strong>Climate liability:</strong> The US Supreme Court is weighing whether oil majors are liable for climate change costs.</li><li><strong>Regulatory friction:</strong> The EU is exploring windfall taxes to offset energy costs for citizens.</li><li><strong>Investment threats:</strong> Equinor warns the UK risks becoming \"uninvestable\" if North Sea projects are blocked.</li></ul><p><strong>What's next:</strong> Watch for a shift in \"energy security\" alliances as governments move away from reliance on the Strait of Hormuz and accelerate the build-out of critical mineral supply chains.</p>", "corporate earnings and results": "<p>Geopolitical instability and disruptive tech are squeezing corporate margins.</p><p><strong>Why it matters:</strong> Rising fuel costs and market volatility are forcing companies to slash profit forecasts and pivot financing strategies.</p><p><strong>The bottom line</strong></p><ul><li><strong>Delta Air Lines:</strong> Slashed profit outlook due to higher fuel prices driven by the Iran conflict.</li><li><strong>US Telcos:</strong> Lost $45 billion in market value following SpaceX's move into the mobile spectrum.</li><li><strong>Bank Stocks:</strong> Prices are falling as rising funding costs threaten to reverse profit margin expansion.</li></ul><p><strong>The AI pivot</strong></p><ul><li><strong>SoftBank:</strong> Seeking $100 billion from Gulf investors to fund AI expansion.</li><li><strong>Credit Risk:</strong> Cost of credit default swaps is rising for AI companies seeking new loans.</li></ul><p><strong>Between the lines</strong> Traditional corporate models are under pressure. Institutional investors are bypassing private equity funds for direct deals, which hit a record $198 billion in H1.</p>", "middle east war": "<p>The Middle East is entering a phase of fragmented, high-cost instability that is spilling into global finance and diplomacy.</p><p><strong>Why it matters:</strong> Persistent conflict is driving up operational costs for global trade and straining Western diplomatic ties, while regional powers shift toward mutual defense pacts to offset instability.</p><p><strong>The economic toll</strong></p><ul><li><strong>Shipping:</strong> Captains are earning $100,000 monthly to transit the Strait of Hormuz due to Iranian threats.</li><li><strong>UK Finance:</strong> War-driven inflation and borrowing costs have created a £12bn hole in British public finances.</li><li><strong>Energy:</strong> Surging fuel prices are forcing the U.S. president to consider suspending federal petrol taxes ahead of midterms.</li></ul><p><strong>Geopolitical shifts</strong></p><ul><li><strong>New Alliances:</strong> Saudi Arabia, Pakistan, and Turkey have triggered a mutual defense pact following Houthi missile attacks on Riyadh.</li><li><strong>Diplomatic Friction:</strong> The UK downgraded its Jerusalem consulate to a \"Mission\" to avoid a full diplomatic break with Israel.</li><li><strong>Syrian Strategy:</strong> Damascus is consolidating assets into a secretive $50bn sovereign fund to attract Gulf investment.</li></ul><p><strong>What's next</strong></p><ul><li><strong>U.S. Strategy:</strong> Washington is pursuing \"productive discussions\" with Tehran to avoid military escalation before the midterm elections.</li><li><strong>Maritime Conflict:</strong> Expect intensified fighting around the Bab al-Mandab waterway as government forces launch offensives to reclaim the route.</li></ul>", "shipping": "<p>Global shipping is fracturing into a high-cost, high-risk environment driven by geopolitical conflict and climate volatility.</p><p><strong>Why it matters:</strong> Geopolitical instability in the Middle East and the Arctic is forcing a structural shift in trade routes, driving vessel prices to record highs while eroding international maritime law.</p><p><strong>The cost of conflict</strong></p><ul><li><strong>Rate spikes:</strong> Oil tanker costs hit a record $1.2 million per day due to supertanker shortages on Middle East-China routes.</li><li><strong>Asset flip:</strong> Old supertankers now command higher prices than new builds because immediate availability outweighs vessel age.</li><li><strong>Strategic pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM amid market volatility.</li></ul><p><strong>Route disruptions</strong></p><ul><li><strong>The Arctic shift:</strong> Northern Sea Route transits have quadrupled as melting ice and Middle East instability divert traffic.</li><li><strong>Choke points:</strong> The Panama Canal faces new cuts due to drought, while the Strait of Hormuz remains a high-risk zone requiring US military time slots for tankers.</li><li><strong>Shadow fleets:</strong> Russia expanded its fleet by one-third to bypass Western sanctions on fossil fuel exports.</li></ul><p><strong>The green transition</strong></p><ul><li><strong>Fuel shift:</strong> Biodiesel is now cheaper than conventional fuels, accelerating the move toward emissions targets.</li><li><strong>Tech bets:</strong> Maersk is testing wind sails; ammonia and methanol are emerging as primary long-term decarbonization tools.</li></ul><p><strong>Between the lines</strong> The rise of \"shadow fleets\" and the failure of sanctions loopholes are causing a collapse in global shipping rules. Maritime authorities warn this is not a temporary dip, but a permanent structural shift in how global trade is governed.</p><p><strong>What's next</strong></p><ul><li><strong>IPO activity:</strong> Trafigura will float Volare Shipping in Oslo to capitalize on record tanker rates.</li><li><strong>Cyber risk:</strong> Increased vulnerability of satellite-linked \"edge devices\" makes navigation and engine systems prime targets for hackers.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative bubble to a high-stakes infrastructure race.</p><p><strong>Why it matters:</strong> Massive capital expenditure is colliding with volatile markets, creating a gap between AI's theoretical potential and its immediate financial and social costs.</p><p><strong>By the numbers</strong></p><ul><li><strong>$40 billion:</strong> Amount SpaceX is reportedly seeking to raise specifically for Nvidia chips.</li><li><strong>$20 billion:</strong> The revenue shortfall for OpenAI compared to widely reported $70 billion projections.</li><li><strong>25%:</strong> Forecasted Q3 growth for S&P 500 earnings, driven largely by the AI boom.</li><li><strong>$5 billion:</strong> Value of the Nvidia-backed Firmus IPO pulled due to market volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure war:</strong> China is aggressively building data centers in Inner Mongolia to secure AI supremacy.</li><li><strong>Labor shift:</strong> Call center employment is dropping as companies reduce hiring, signaling the first tangible wave of AI-driven job displacement.</li><li><strong>New risks:</strong> \"Rogue\" AI agents are creating new liabilities for insurers, while deepfakes are actively infiltrating U.S. political advertising.</li><li><strong>Cognitive decay:</strong> Experts warn that the primary risk is not blind trust in AI, but a decline in human critical thinking and \"checking.\"</li></ul><p><strong>What's next</strong></p><ul><li><strong>Agentic AI:</strong> Big Tech is pivoting from chatbots to \"AI agents\" capable of executing complex tasks autonomously.</li><li><strong>Cyber evolution:</strong> Traditional warfare doctrines are becoming obsolete as non-human agents introduce unpredictable uncertainty for both attackers and defenders.</li><li><strong>Financial scrutiny:</strong> Markets are questioning if every global trade has become a singular bet on AI growth.</li></ul>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The shift from \"win-win\" cooperation to strategic rivalry destabilizes global trade and security. This friction forces third-party nations to hedge between two competing superpowers.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in both Washington and Beijing is viewed as transactional rather than far-sighted.</li><li><strong>Reliability crisis:</strong> U.S. volatility regarding defense guarantees is eroding trust with key allies in South Korea and Japan.</li><li><strong>Alternative blocs:</strong> The BRICS grouping is leveraging U.S. instability to build a counter-weight, now surpassing the G7 in economic share.</li></ul><p><strong>The AI frontier</strong></p><ul><li><strong>Hardware dominance:</strong> U.S. national data center projects are consolidating an American lead in AI.</li><li><strong>Power asymmetry:</strong> Hardware dispersion does not equal decentralized power; the U.S. maintains the primary infrastructure edge.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tactical engagement:</strong> Expect continued high-level summits, though these are tools for crisis management rather than true détente.</li><li><strong>Economic warfare:</strong> Increased use of sanctions and tariffs will likely drive BRICS nations toward deeper integration.</li></ul>", "us elections": "<p>Economic anxiety and demographic shifts are threatening Republican hold on the U.S. midterms.</p><p><strong>Why it matters:</strong> Rising mortgage rates and cost-of-living pressures are eroding Trump's populist appeal among blue-collar and Rust Belt voters.</p><p><strong>The volatility drivers</strong></p><ul><li><strong>Affordability:</strong> Surging Treasury yields and energy prices are fueling voter anger over housing and fuel costs.</li><li><strong>Demographics:</strong> Latino voters remain the \"moveable middle,\" while Black voters are mobilizing against redistricting and gerrymandering.</li><li><strong>AI Anxiety:</strong> Despite a booming economy, fear of AI-driven job displacement is neutralizing traditional GOP economic talking points.</li></ul><p><strong>Between the lines</strong> Trump is facing internal friction and strategic pivots:</p><ul><li><strong>Campaign Chaos:</strong> Potential termination of key advisers over foreign policy conflicts.</li><li><strong>Funding Shifts:</strong> Moving ad spending from taxpayer funds to MAGA Inc. following public backlash.</li><li><strong>Corporate Ties:</strong> Attempting to balance \"Big Oil\" lobbying with voter anger over diesel exports and fuel prices.</li></ul><p><strong>What's next</strong> Democrats are prioritizing economic messaging to flip Senate seats, while Republicans are bracing for a potential loss of the industrial heartland.</p><p>A GOP defeat is expected to result in a divided government, though analysts suggest it may not fully derail the Trump agenda.</p>", "german politics": "<p>Germany is facing a systemic political crisis as the far-right AfD erodes the traditional conservative base.</p><p><strong>Why it matters:</strong> The surge of the AfD in eastern states destabilizes Chancellor Friedrich Merz’s leadership and weakens Germany's leverage within the EU. This volatility creates a power vacuum that threatens the stability of the Eurozone's largest economy.</p><p><strong>The political breakdown</strong></p><ul><li><strong>CDU in crisis:</strong> Chancellor Merz is fighting for survival after disastrous regional election results and allegations that CDU lawmakers traded votes with the AfD.</li><li><strong>AfD ascent:</strong> The far-right has secured its first regional parliament president and is leveraging \"nostalgia\" and Ukraine fatigue to target 40% of the federal vote.</li><li><strong>New kingmakers:</strong> The hard-left BSW party has emerged as a pivotal power broker in eastern coalitions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Leadership vacuum:</strong> Merz's plummeting popularity has shifted focus to Hendrik Wüst, the premier of North Rhine-Westphalia, as a potential successor.</li><li><strong>Ideological shift:</strong> Younger voters are decoupling from historical warnings about fascism, viewing radicalism as a viable alternative to the status quo.</li></ul><p><strong>The security pivot</strong></p><ul><li><strong>Rearmament:</strong> Berlin is aggressively bolstering its arms industry and using \"guerrilla units\" to fast-track weapons deliveries to Ukraine.</li><li><strong>Diplomatic tension:</strong> Germany is balancing a historic military buildup with high-stakes, \"intense\" diplomacy with Russia to prevent further escalation.</li></ul><p><strong>What's next</strong></p><ul><li><strong>EU Budget:</strong> Merz's diminished domestic authority may jeopardize the EU's €2tn budget deal.</li><li><strong>Federal trajectory:</strong> The AfD is using regional victories as a blueprint for a national takeover in the next federal election.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control against rising geopolitical instability and eroding institutional trust.</p><p><strong>Why it matters:</strong> Persistent bond yield volatility and supply-side shocks are limiting the effectiveness of traditional monetary tools, forcing banks to choose between market stability and inflation targets.</p><p><strong>The global landscape</strong></p><ul><li><strong>United States:</strong> The Fed faces a credibility crisis amid political attacks and security vulnerabilities, while officials signal a pause in rate hikes for October.</li><li><strong>Europe:</strong> The ECB is under pressure to halt Quantitative Tightening (QT) as French bonds face a \"rout\" and political instability threatens sovereign debt.</li><li><strong>Emerging Markets:</strong> India has shifted to a \"tightening\" outlook to combat energy costs; the Philippines is bracing for El Niño-driven inflation.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Moneyness\" Shift:</strong> US Treasuries are losing their status as the ultimate liquid asset, increasing overall market volatility.</li><li><strong>AI Risk:</strong> The Bank of England warns that an AI-driven debt surge could trigger a sharp market correction, requiring active regulatory intervention.</li><li><strong>Supply vs. Demand:</strong> There is a growing recognition that monetary policy impacts supply chains, not just consumer demand.</li></ul><p><strong>What's next</strong></p><ul><li><strong>2026 Outlook:</strong> Forecasters expect \"insurance increases\" in rates to counter higher real yields.</li><li><strong>Institutional Shifts:</strong> Isabel Schnabel’s move to the IMF will trigger a leadership reshuffle at the ECB.</li><li><strong>Remit Reviews:</strong> The UK Parliament is questioning if the Bank of England's current mandate is \"fit for purpose\" amid populist pressure.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven efficiency and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Banks are shifting from risk-taking to fee-generation. They are leveraging prime brokerage and asset management to offset slowing trading revenues and potential AI-driven deposit flight.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>The Risk:</strong> AI agents could cost banks $500bn by automating the search for higher savings rates, triggering deposit outflows.</li><li><strong>The Opportunity:</strong> Banks are demanding lower fees from law firms, arguing AI has reduced the billable hours required for routine work.</li><li><strong>The Exposure:</strong> Wall Street is financing the AI boom, including a $15bn debt offload for Anthropic data centers.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulatory Trend:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>Compliance Failures:</strong> Amex was fined $350mn for \"systemic\" failures that left $13bn in suspicious transactions unreported.</li><li><strong>Political Ties:</strong> Regulators granted a banking license to the Trump family's crypto venture.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is expanding its footprint with a $2.3bn acquisition of ETF provider Neos.</li><li><strong>Talent War:</strong> Citi is shortening its analyst program to two years to prevent junior bankers from defecting to private equity.</li><li><strong>Market Gaps:</strong> Erebor has surged to $7bn in deposits, filling the void left by the Silicon Valley Bank collapse.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500mn:</strong> Special bonuses Goldman is preparing for top executives.</li><li><strong>$250bn:</strong> Bank of America's commitment to \"America First\" US projects.</li><li><strong>38%:</strong> The drop in Shein shares since its Hong Kong listing, despite a $220mn investment by Goldman.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>09 Oct 2026 17:09 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
