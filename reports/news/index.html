*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;line-height:1.6;color:#475569;background:#f6f7f9;min-height:100vh}

/* ── navbar ── */
.navbar{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);position:fixed;top:0;width:100%;z-index:1000;box-shadow:0 1px 0 #e4e8ef}

.nav-back{font-size:.9rem;color:#64748b;text-decoration:none;font-weight:500;transition:color .2s}

/* ── hero ── */
.hero{padding:6rem 2rem 2.5rem;text-align:center;background:#f6f7f9}
.hero h1{font-size:2.4rem;font-weight:800;color:#0f172a;margin-bottom:.5rem}
.hero p{color:#64748b;font-size:1rem}

/* ── controls ── */
.controls{max-width:1200px;margin:0 auto;padding:1.5rem 2rem 0}
.tag-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}
.tag-btn{padding:.35rem .9rem;border-radius:9999px;border:1.5px solid transparent;

.tag-btn.all{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.tag-btn.all.active{background:#0f172a;color:#fff;border-color:#0f172a}
.tag-btn.active{color:#fff!important;border-color:transparent!important}
.tag-btn:not(.active){background:#fff;border-color:#e2e8f0}

.slider-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0 1rem}
.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}
#days-slider{flex:1;max-width:320px;accent-color:#4f46e5;height:4px;cursor:pointer}
.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}
.meta-row strong{color:#475569}

/* ── summary banner ── */
.summary-banner{max-width:1200px;margin:0 auto 1.5rem;padding:0 2rem}
.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;
  border-left:4px solid #4f46e5;box-shadow:0 1px 3px rgba(0,0,0,.06);
  font-size:.88rem;color:#475569;line-height:1.6}
.summary-banner-inner strong{color:#0f172a}
.summary-banner-inner p{margin:.4rem 0}
.summary-banner-inner ul{margin:.5rem 0 0 1.2rem;padding:0}
.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8ecf2;
  display:flex;flex-direction:column;gap:.6rem;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;
  white-space:nowrap;flex-shrink:0}
.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}
.card-title{font-size:.97rem;font-weight:700;color:#0f172a;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#4f46e5;
  text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.card-link:hover{text-decoration:underline}

/* ── empty state ── */
.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

/* ── footer ── */
.footer{text-align:center;padding:2rem;font-size:.8rem;color:#94a3b8;border-top:1px solid #e4e8ef}

@media(max-width:600px){
  .hero h1{font-size:1.8rem}
  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}
  .controls{padding:1rem 1rem 0}
}

const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing as geopolitical volatility drives prices higher and forces a strategic pivot toward resource security.</p><p><strong>Why it matters:</strong> Middle East escalation and supply shortages are spiking costs, while Western nations are abandoning environmental pledges to secure immediate energy stability.</p><p><strong>The energy crunch</strong></p><ul><li><strong>Price spikes:</strong> Brent crude hit a five-month high of $110 following missile attacks on Saudi energy hubs.</li><li><strong>Diesel shortage:</strong> The IEA warns global diesel shortages will persist until mid-2027.</li><li><strong>Refinery crisis:</strong> European refinery margins are collapsing due to soaring input costs, risking further output cuts.</li></ul><p><strong>The policy pivot</strong></p><ul><li><strong>EU retreat:</strong> Brussels dropped its push for a global ban on Arctic drilling to prioritize energy security.</li><li><strong>UK tension:</strong> Producers are threatening to halt investment if the Rosebank oilfield remains blocked.</li><li><strong>US diplomacy:</strong> President Trump exempted Russia from energy sanctions in exchange for diesel supplies.</li></ul><p><strong>The critical minerals race</strong></p><ul><li><strong>Strategic stockpiles:</strong> Mercuria added copper to the U.S. \"Project Vault\" as Washington builds a $12bn strategic reserve.</li><li><strong>Tech integration:</strong> Big Tech firms are seeking direct mining stakes to secure long-term metal supplies for AI and hardware.</li><li><strong>China risk:</strong> Reliance on Chinese power inverters and tungsten is triggering security alarms in the West.</li></ul><p><strong>What's next:</strong> Watch how \"Big Oil\" deploys a $32bn windfall from the Iran war; investors are weighing dividends against long-term energy transition investments.</p>", "corporate earnings and results": "<p>Corporate earnings are facing new volatility as geopolitical tensions and regulatory scrutiny hit key sectors.</p><p><strong>Why it matters:</strong> Political instability and legal battles are directly impacting revenue growth and asset valuations. Market sentiment is shifting from growth-at-all-costs to risk mitigation.</p><p><strong>The pressure points</strong></p><ul><li><strong>Professional Services:</strong> PwC's EMEA revenue growth (0.7%) trails Deloitte and EY, hampered by regional conflicts and a slowdown in Saudi government contracts.</li><li><strong>Defense:</strong> US defense stocks are sliding as investors anticipate a Democratic sweep, threatening proposed $500bn spending increases.</li><li><strong>Consumer Goods:</strong> Lindt is reinstating a former CEO after aggressive price hikes suppressed chocolate demand.</li><li><strong>Tech Infrastructure:</strong> AI data centers now face unplanned capital expenditures for blast-resistant concrete and missile defense systems.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory Risk:</strong> KKR and Barclays are under fire from EU and UK regulators over transparency in telecoms deals and private credit exposure.</li><li><strong>M&A Friction:</strong> The $9bn Kroger-Albertsons merger collapse is moving to court, signaling higher hurdles for grocery consolidation.</li></ul><p><strong>What's next</strong></p><ul><li><strong>AI Monetization:</strong> Markets are eyeing Anthropic’s potential IPO as a litmus test for AI's long-term financial viability.</li><li><strong>Strategic Pivots:</strong> European telecoms (Deutsche Telekom, Orange, Telefónica, Vodafone) are forming a bloc to counter Starlink's satellite dominance.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>19 Oct 2026 17:07 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
