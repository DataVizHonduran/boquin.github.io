const SUMMARIES = {"corporate earnings and results": "<p>Record-breaking IPOs and aggressive AI spending are redefining corporate valuations.</p><p><strong>Why it matters:</strong> Massive capital injections are decoupling stock prices from current profitability. High-stakes acquisitions signal a consolidation phase to survive market shifts.</p><p><strong>By the numbers</strong></p><ul><li>$75 billion: Amount raised in SpaceX's record IPO.</li><li>$111 billion: Value of the Paramount-Warner Bros takeover.</li><li>$10.6 billion: GSK's investment in cancer biotech.</li><li>20%: Jump in SpaceX shares upon debut.</li></ul><p><strong>Between the lines</strong></p><ul><li>Big Tech is shifting from high margins to heavy capital expenditure.</li><li>Traditional sectors are pivoting to cash preservation amid market slowdowns.</li><li>European defense stocks are retreating as government funding becomes uncertain.</li></ul><p><strong>What's next</strong></p><ul><li>Investors will scrutinize if AI spending converts to sustainable revenue.</li><li>US national security restrictions may limit AI model accessibility and growth.</li></ul>", "shipping": "<p>Geopolitical conflict in the Strait of Hormuz is destabilizing global energy flows and reshaping naval industry investments.</p><p><strong>Why it matters:</strong> Disruptions in key waterways force a shift toward expensive alternative logistics and higher-risk \"shadow fleets.\" Increased defense spending is driving a revival in strategic shipyard acquisitions.</p><p><strong>By the numbers</strong></p><ul><li>$40 billion: The size of the Trump insurance facility that has seen zero uptake due to lack of naval escorts.</li><li>$1.3 billion: Belfast Harbour's growth plan to compete with Dublin.</li><li>6%: The drop in Brent crude prices after two supertankers crossed the Strait of Hormuz.</li></ul><p><strong>Between the lines</strong></p><ul><li>The \"shadow fleet\" of aging, sanctioned tankers increases the risk of environmental disasters.</li><li>South Korea is leveraging global instability to grow its AI and defense exports.</li><li>Energy insecurity is driving a temporary return to coal in Asia as gas supplies remain disrupted.</li></ul><p><strong>What's next</strong></p><ul><li>Market volatility will persist until the Strait of Hormuz fully reopens.</li><li>Tanker owners face a potential crash in rates after windfall profits from the Iran conflict.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is forcing a fundamental restructuring of global capital markets and corporate governance.</p><p><strong>Why it matters:</strong> Massive infrastructure spending is creating new systemic risks for insurers and lenders. Rapid adoption is outpacing legal frameworks and board-level oversight.</p><p><strong>By the numbers</strong></p><ul><li><strong>$70 billion:</strong> Oracle's planned data center investment over the next year.</li><li><strong>$35 billion:</strong> Apollo and Blackstone's chip financing deal for Anthropic.</li><li><strong>$1.4 billion:</strong> Neura's funding round for humanoid robots.</li><li><strong>80%:</strong> UK boards currently discussing AI-led decision making.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The productivity paradox:</strong> Routine time savings are being offset by \"slop\" that requires manual human cleanup.</li><li><strong>Financial engineering:</strong> Complex private credit structures are allowing risk-averse investors to fund high-growth AI labs.</li><li><strong>Reliability gap:</strong> Hallucinations in professional reports, such as those from KPMG, highlight a persistent trust deficit.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Policy shifts:</strong> Governments are debating AI sovereign wealth funds and new tax codes to address potential mass underemployment.</li><li><strong>Geopolitical stability:</strong> Pressure is mounting for a US-China technological disarmament pact to regulate AI development.</li></ul>", "us-china relations": "<p>The U.S. and China are competing for global leadership amid a breakdown of multilateral order.</p><p><strong>Why it matters:</strong></p><ul><li>Beijing is exploiting U.S. volatility to frame itself as the primary pillar of global stability.</li><li>The shift toward \"asymmetric power\" allows China to convert diplomatic imbalances into strategic leverage.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Russia Pivot:</strong> Putin’s strategic errors have locked Russia into a subordinate, one-sided relationship with China.</li><li><strong>Soft Power Shift:</strong> Beijing is gaining international favor as the U.S. disrupts traditional alliances and burns diplomatic bridges.</li><li><strong>The Hegemony Gap:</strong> Both nations seek dominance but avoid the costs and responsibilities of maintaining global leadership.</li></ul><p><strong>What's next</strong></p><ul><li>China will accelerate efforts to attract foreign officials to project an image of reliability.</li><li>Middle powers will prioritize flexible, multi-polar alliances to avoid superpower volatility.</li><li>Tactical summits will replace long-term strategic agreements as the primary tool for risk management.</li></ul>", "us elections": "<p>Trump is consolidating power within the GOP while creating vulnerabilities for the general election.</p><p><strong>Why it matters:</strong></p><ul><li>Controversial \"MAGA warrior\" candidates are winning primaries but may struggle with moderate swing voters.</li><li>Economic discontent over inflation and tariffs is eroding Trump's support among key working-class demographics.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>GOP Purge:</strong> The defeat of Thomas Massie in Kentucky signals the end of the \"maverick\" Republican.</li><li><strong>Democratic Pivot:</strong> A populist victory in Pennsylvania indicates a strategic shift toward working-class messaging.</li><li><strong>Internal Friction:</strong> The DNC's autopsy of the Harris loss points to a lack of unity within the Biden White House.</li></ul><p><strong>By the numbers</strong></p><ul><li>$1.8 billion: Trump's requested fund for \"lawfare\" victims.</li><li>60 years: The duration of Black enfranchisement precedent overturned by the Supreme Court.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Texas:</strong> Democrats are optimistic that Ken Paxton’s limited appeal puts the Senate seat in play.</li><li><strong>California:</strong> Former UK adviser Steve Hilton faces Democrat Xavier Becerra for governor.</li><li><strong>Maine:</strong> Graham Platner challenges Susan Collins despite misconduct allegations.</li></ul>", "german politics": "<p>Germany is accelerating its military buildup amid deepening diplomatic rifts with Washington and Paris.</p><p><strong>Why it matters:</strong> Berlin's shift toward military autonomy threatens EU cohesion and risks U.S. security guarantees. Internal instability and the rise of the far-right AfD further weaken Germany's leadership role in Europe.</p><p><strong>By the numbers</strong></p><ul><li>3.5%: New GDP target for core military spending, aimed for completion six years early.</li><li>5,000: U.S. soldiers the Pentagon may withdraw following disputes over the Iran war.</li><li>€500bn: Infrastructure fund currently plagued by ministry spending delays.</li><li>€12bn: Rheinmetall’s bid to take over a troubled naval frigate project.</li></ul><p><strong>Between the lines</strong></p><ul><li>The friction between Chancellor Friedrich Merz and Donald Trump over the Iran war has neutralized years of rapport-building.</li><li>Berlin is prioritizing financial leverage over partnership, signaling a move away from Franco-German industrial synergy in fighter jet and tank production.</li><li>The AfD's surge in polls reflects voter anger over fuel prices and a strategic pivot toward Kremlin interests.</li></ul><p><strong>What's next</strong></p><ul><li>A high-stakes Washington trip to secure Tomahawk missiles despite the Trump row.</li><li>The privatization of Uniper, reducing the state's stake from 99% to 25%.</li><li>Potential leadership volatility within the CDU as Hendrik Wüst emerges as a rival to Merz.</li></ul>", "us banks": "<p>US banks are aggressively expanding balance sheets and international footprints as deregulation unlocks massive capital.</p><p><strong>Why it matters:</strong> Lighter regulatory oversight allows US lenders to outpace EU and Swiss rivals. This capital surge enables larger acquisitions and a push into retail banking abroad.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital freed for top US and UK banks via deregulation.</li><li><strong>$114 billion:</strong> Revenues for non-bank trading firms like Jane Street and Citadel.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan claims is available due to regulatory shifts.</li><li><strong>€15 billion:</strong> Citi's partnership with BlackRock for private European lending.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Risk:</strong> Banks are offloading data center debt to private deals to avoid overexposure to the AI boom.</li><li><strong>Geopolitical Friction:</strong> Morgan Stanley is issuing China-only iPhones to staff to mitigate data security risks.</li><li><strong>Competitive Shift:</strong> Non-bank trading firms are successfully capturing market share once dominated by traditional institutions.</li></ul><p><strong>What's next</strong></p><ul><li>JPMorgan is preparing to launch its Chase retail bank in Germany.</li><li>Jamie Dimon may deploy up to $20 billion for a new acquisition.</li><li>Morgan Stanley will integrate spot crypto trading into its E*Trade platform.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>13 Jun 2026 12:21 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
