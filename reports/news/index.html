.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and shifting corporate strategies are driving a volatile divergence between fossil fuel reliance and renewable scaling.</p><p><strong>Why it matters:</strong></p><ul><li>Conflict in the Middle East and Russia is tightening refined product supplies and spiking crude prices.</li><li>Energy majors are pivoting back to core oil and gas assets to maximize short-term financial discipline.</li></ul><p><strong>The volatility loop</strong></p><ul><li><strong>Supply shocks:</strong> Drone strikes on Russian refineries and US-Iran hostilities are creating a global diesel and petrol crunch.</li><li><strong>Price surges:</strong> Higher crude prices are allowing majors like BP to aggressively reduce net debt.</li><li><strong>Strategic retreats:</strong> Shell is exiting Indian renewables ($1.8bn sale) to refocus on hydrocarbon profitability.</li></ul><p><strong>The transition friction</strong></p><ul><li><strong>Resource nationalism:</strong> Beijing’s export controls on rare earths are distorting global mineral markets.</li><li><strong>Infrastructure gaps:</strong> The IEA warns Europe’s slow electrification is a \"major mistake\" hindering energy independence.</li><li><strong>Funding shifts:</strong> Capital is moving toward \"last mile\" household adoption and AI-driven data center power.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fusion commercialization:</strong> The sector is moving from labs to supply chains, with General Fusion preparing for a Nasdaq debut.</li><li><strong>Regulatory battles:</strong> Brussels faces internal conflict over whether to direct carbon levy revenues toward green industry.</li><li><strong>Asset repurposing:</strong> US states are increasingly converting abandoned oil wells into new economic opportunities.</li></ul>", "corporate earnings and results": "<p>Wall Street investment banks and asset managers are reporting record profits driven by a surge in capital markets activity.</p><p><strong>Why it matters:</strong> High trading volumes in equities and AI-driven demand are offsetting broader economic volatility and shifting corporate spending patterns.</p><p><strong>By the numbers</strong></p><ul><li><strong>Morgan Stanley:</strong> Profits jumped 58% on strong equities trading.</li><li><strong>BlackRock:</strong> Assets hit a record $15.3 trillion; net income rose 20% to $1.9 billion.</li><li><strong>Stripe/Advent:</strong> Launched a $53 billion bid for PayPal.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Divergence:</strong> While ASML and CXMT see massive growth in chip demand, IBM's share plunge suggests AI spending is cannibalizing traditional IT budgets.</li><li><strong>Luxury Resilience:</strong> Richemont's double-digit growth indicates high-end jewelry demand remains decoupled from general consumer weakness.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Pressure:</strong> The EU is ramping up Big Tech enforcement with new Google fines.</li><li><strong>Market Volatility:</strong> Despite record banking profits, analysts warn of looming systemic risks.</li></ul>", "middle east war": "<p>The U.S. and Iran are locked in a high-stakes military confrontation over control of the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The Strait is a global energy chokepoint. Any prolonged closure or instability triggers immediate spikes in oil prices and destabilizes global equity markets.</p><p><strong>The conflict drivers</strong></p><ul><li><strong>Maritime Tolls:</strong> President Trump initially proposed a 20% cargo fee for vessels using the Strait, later replacing it with a \"Gulf investment\" plan.</li><li><strong>Military Escalation:</strong> The U.S. has launched seven waves of airstrikes following Iranian cruise missile attacks on tankers.</li><li><strong>Cyber Warfare:</strong> Tehran is utilizing roaming and ad tech to track U.S. military personnel via smartphones.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$87:</strong> The peak price of Brent crude during the recent escalation.</li><li><strong>20%:</strong> The initial fee Trump demanded for security reimbursement in the Strait.</li><li><strong>7:</strong> The number of U.S. strike waves launched against Iranian targets.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic Pivots:</strong> Dubai is building a new port on the UAE's east coast to bypass the Strait entirely, signaling a long-term loss of confidence in the waterway's security.</li><li><strong>Political Instability:</strong> In Israel, Prime Minister Netanyahu is trailing former military chief Gadi Eisenkot in polls ahead of October elections.</li><li><strong>Proxy Risks:</strong> Houthi missile strikes on Saudi Arabia threaten to collapse a four-year truce.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic gambles:</strong> The U.S. has agreed to continue talks, but Tehran is betting the U.S. will \"blink first\" to avoid a full-scale war.</li><li><strong>Tech shifts:</strong> The U.S. is easing export controls on chips and drones for the UAE to strengthen regional alliances.</li></ul>", "shipping": "<p>Geopolitical conflict and trade policy are driving a volatile surge in global shipping costs and risks.</p><p><strong>Why it matters:</strong> Military strikes in the Sea of Azov and the Strait of Hormuz disrupt critical energy corridors, while looming U.S. tariffs trigger \"front-loading\" demand that spikes freight rates.</p><p><strong>The conflict zone</strong></p><ul><li><strong>Ukraine:</strong> Kyiv is conducting an \"unprecedented\" drone campaign against Russian fuel tankers in the Sea of Azov to sever Crimean supply lines.</li><li><strong>Iran:</strong> Tit-for-tat strikes in the Strait of Hormuz have caused extreme volatility in tanker transits, though recent ceasefires have seen traffic quadruple.</li><li><strong>Sanctions:</strong> Russian \"shadow tankers\" are rerouting around the English Channel to avoid European naval interceptions.</li></ul><p><strong>Market drivers</strong></p><ul><li><strong>Tariff Panic:</strong> Freight rates have hit their highest levels since the 2024 Red Sea crisis as companies rush to import goods before new U.S. levies take effect.</li><li><strong>Consolidation:</strong> CMA CGM is expanding its U.S. logistics footprint via a $1.4 billion acquisition of a FedEx unit.</li><li><strong>Profitability:</strong> Maersk raised profit guidance due to the tariff-driven demand surge, despite share drops linked to Suez Canal reopenings.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Green Transition:</strong> The industry is fracturing. Shipowners are abandoning unified green goals in favor of a mix of nuclear power and \"dirty\" fossil fuels.</li><li><strong>Regulatory Pressure:</strong> The EU is closing carbon fee loopholes, increasing costs for carriers and risking trade friction.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$4 billion:</strong> Revenue earned by Greek shipping firms transporting Russian oil over three years.</li><li><strong>$1.4 billion:</strong> Value of the FedEx logistics unit sale to CMA CGM.</li><li><strong>7%:</strong> Drop in Maersk shares following the decision to resume Suez Canal transits.</li></ul>", "artificial intelligence": "<p>The AI industry is shifting from speculative hype to a volatile phase of infrastructure bottlenecks and legal instability.</p><p><strong>Why it matters:</strong> Massive capital expenditures are colliding with regulatory crackdowns and hardware shortages, forcing a market correction where only tangible utility survives.</p><p><strong>The infrastructure crunch</strong></p><ul><li><strong>Hardware gaps:</strong> US export controls have fueled a thriving black market for semiconductors in China.</li><li><strong>Energy limits:</strong> New York has implemented a one-year moratorium on data center construction due to infrastructure strain.</li><li><strong>Concentration risk:</strong> TSMC, SK Hynix, and Samsung now command 29% of the MSCI Emerging Markets index.</li></ul><p><strong>Market volatility</strong></p><ul><li><strong>The \"AI Pivot\" failure:</strong> Companies rebranding as AI-first have failed to sustain long-term valuation gains.</li><li><strong>IBM's slump:</strong> Shares plunged 25% as the company faltered during the client shift toward AI servers.</li><li><strong>Debt skepticism:</strong> Investors are selling longer-dated AI debt, questioning the sector's long-term profitability.</li></ul><p><strong>Emerging risks</strong></p><ul><li><strong>Legal gaps:</strong> The shift toward autonomous \"agents\" has created insurance voids for business liability.</li><li><strong>Corporate warfare:</strong> Apple is suing OpenAI over alleged theft of secret information.</li><li><strong>Cost cutting:</strong> Major firms like DoorDash and Airbnb are switching to Chinese models to reduce ballooning US tech bills.</li></ul><p><strong>What's next:</strong> Expect a push for centralized oversight, as DeepMind's Demis Hassabis calls for a US-led body to test \"frontier\" models before they scale beyond control.</p>", "us-china relations": "<p>US-China relations are shifting toward a \"might is right\" world order defined by military provocation and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and the rise of Chinese assertiveness are destabilizing global trade and security frameworks. This creates a volatile environment where small tactical gains trigger systemic risks.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China recently fired a submarine-launched ballistic missile into a Pacific nuclear-free zone, alarming Japan, Australia, and New Zealand.</li><li>  <strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, recently detaining Japanese nationals for rare earth smuggling.</li><li>  <strong>Trade volatility:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten the broader global economy.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Diplomatic pivot:</strong> While the US struggles with internal political instability and a perceived retreat from global leadership, foreign officials are increasingly flocking to Xi Jinping.</li><li>  <strong>Strategic goal:</strong> Beijing is attempting to position itself as a \"pillar of stability\" and a viable alternative to the US-led order.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance hardening:</strong> Expect Japan and other Pacific allies to accelerate \"resilience\" efforts and acquire new military capabilities to counter Chinese expansion.</li><li>  <strong>Systemic risk:</strong> The competition between the US and China is increasingly viewed as a return to \"Great Power\" politics, significantly raising the risk of direct conflict.</li></ul>", "us elections": "<p>The U.S. electoral landscape is fracturing as internal party volatility and foreign policy failures erode candidate stability.</p><p><strong>Why it matters:</strong> Internal ideological warfare and personal scandals are handicapping Democratic momentum, while Trump's populist economic and military gambles are alienating key swing demographics.</p><p><strong>The Democratic Divide</strong></p><ul><li><strong>Socialist surge:</strong> Progressive victories in New York and Colorado, and a radical pitch in Wisconsin, signal a growing rift between party establishment and the left wing.</li><li><strong>Candidate instability:</strong> The Graham Platner scandal in Maine forces Democrats into a last-minute scramble to salvage a critical Senate bid.</li><li><strong>Corporate friction:</strong> The loss of pro-regulation candidates to AI lobby funding shows Big Tech's growing power to veto progressive agendas.</li></ul><p><strong>The Trump Gamble</strong></p><ul><li><strong>Economic backlash:</strong> Voters are blaming the president for inflation and grocery prices, prompting a shift toward a \"hyper-populist\" playbook.</li><li><strong>Foreign policy drag:</strong> An FT poll shows the Iran war is actively depressing approval ratings and triggering bipartisan congressional pushback.</li><li><strong>Base erosion:</strong> Tariffs are alienating Maine's lobster industry, while some evangelicals are questioning the alignment of Trump's rhetoric with Christian values.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California's bellwether:</strong> The governor's race between Steve Hilton and Xavier Becerra will serve as a primary gauge for the national appetite for MAGA politics.</li><li><strong>Midterm volatility:</strong> The combination of Democratic infighting and Republican vulnerability in the Lehigh Valley suggests a highly unpredictable Senate outcome.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its traditional fiscal restraint to address security gaps and stagnant growth, signaling a fundamental shift in Germany's role within Europe and the global order.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Berlin will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to accelerate spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> Germany is ditching France for a new fighter jet project to ensure leadership commensurate with its financial input.</li><li><strong>Failures:</strong> Cost overruns led Berlin to scrap the F126 frigate, its largest planned warship since WWII.</li></ul><p><strong>Economic restructuring</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts, tighter sick-leave rules, and expanded Sunday trading hours.</li><li><strong>Pensions:</strong> Berlin is pursuing a Swedish-style public pension fund to invest contributions in capital markets.</li><li><strong>Privatization:</strong> The state is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD leads opinion polls, fueled by fuel price anger and ties to Kremlin associates.</li><li><strong>Internal threats:</strong> Merz faces \"chancellor swap\" rumors as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Merz must balance massive domestic borrowing with his public opposition to new EU-wide debt, while managing a deteriorating relationship with the U.S. administration.</p>", "central banks": "<p>Central banks are entering a period of strategic divergence and structural reform.</p><p><strong>Why it matters:</strong> Conflicting inflation pressures and new leadership are breaking the synchronized policy era, increasing market volatility and risking institutional trust.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is aggressively restructuring the U.S. central bank:</p><ul><li><strong>Reform:</strong> Establishing five task forces led by business and academic leaders to overhaul operations.</li><li><strong>Communication:</strong> Moving away from traditional \"Fedspeak\" and forward guidance to reduce market dependency.</li><li><strong>Outlook:</strong> Betting on AI to drive productivity-based growth while defending institutional independence from the White House.</li></ul><p><strong>Global divergence</strong> Policymakers are no longer moving in lockstep:</p><ul><li><strong>ECB:</strong> Signaling a less aggressive approach to inflation than in 2022-23, though some officials urge holding rates despite oil surges.</li><li><strong>RBNZ:</strong> Raising rates for the first time in three years to combat persistent inflation.</li><li><strong>BoJ:</strong> Navigating currency instability as the government pushes for domestic investment to support the yen.</li></ul><p><strong>Systemic risks</strong> Structural vulnerabilities are emerging from previous policy eras:</p><ul><li><strong>The QT Trap:</strong> Quantitative Tightening (QT) is facing headwinds from geopolitical crises and bank balance sheet fragility.</li><li><strong>Trust Deficit:</strong> A loss of faith in the Fed and BoE is driving up long-run inflation expectations.</li><li><strong>AI Volatility:</strong> The Bank of England is weighing \"kill switches\" for AI-powered trading to prevent market herding.</li></ul><p><strong>What's next:</strong> Markets will watch for the ECB's next meeting and the implementation of Warsh's Fed task forces to determine if the new era of \"fundamental\" communication stabilizes or destabilizes rates.</p>", "us banks": "<p>US banks are posting blockbuster profits driven by a surge in equities trading and AI-fueled market optimism.</p><p><strong>Why it matters:</strong> A revival in large-scale deals and investment banking fees is ending a multi-year slump, while AI integration is creating a symbiotic profit loop between Wall Street and Big Tech.</p><p><strong>By the numbers</strong></p><ul><li><strong>$700 billion:</strong> Potential losses US banks would face in a severe economic crash, per Fed stress tests.</li><li><strong>4 years:</strong> The longest stretch since investment banking fees reached current projected highs.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal turmoil:</strong> JPMorgan is resetting its succession plan, abruptly removing longtime contender Marianne Lake from the CEO race.</li><li><strong>Strategic pivots:</strong> Citigroup continues a \"ruthless\" restructuring under Jane Fraser, cutting jobs and selling assets to close the profitability gap with rivals.</li><li><strong>Regulatory friction:</strong> Banks are lobbying to further ease Basel capital rules, even as critics warn that deregulation is weakening systemic resilience.</li></ul><p><strong>What's next</strong></p><ul><li><strong>European expansion:</strong> JPMorgan plans to push Chase's digital banking into France, Spain, and Italy.</li><li><strong>Compliance clashes:</strong> Goldman Sachs is tightening restrictions on employee use of prediction markets (e.g., Polymarket) to avoid regulatory breaches.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>15 Jul 2026 11:57 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
