const SUMMARIES = {"oil and gas": "<p>Oil prices are sliding as geopolitical tensions ease and energy markets pivot toward long-term diversification.</p><p><strong>Why it matters:</strong> A US-Iran ceasefire reduces the risk of supply shocks in the Strait of Hormuz, lowering immediate price floors. Simultaneously, a global shift toward nuclear and electrification is decoupling industrial growth from fossil fuel volatility.</p><p><strong>Market shifts</strong></p><ul><li><strong>Brent crude:</strong> Dropped below $80/barrel on bets that Hormuz flows will stabilize.</li><li><strong>Nuclear surge:</strong> Rolls-Royce secured a Swedish SMR contract; fusion suppliers project a $73bn market.</li><li><strong>Strategic plays:</strong> ConocoPhillips is reviving Syrian gas production; investment firms are targeting $100bn in Venezuelan oil.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Regulatory risk:</strong> China warns Indonesia that nickel curbs threaten $50bn in investment.</li><li><strong>Policy reversals:</strong> EU companies that decarbonized early face uncertainty as Brussels softens climate targets.</li><li><strong>Energy costs:</strong> AI efficiency gains are offset by massive power demands, accelerating the push for battery breakthroughs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Infrastructure battles:</strong> Canada is seeking funding for a west coast pipeline to bypass US reliance.</li><li><strong>Security pivots:</strong> Norway is lobbying the EU to prioritize energy security over Arctic drilling bans.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are shifting as AI windfalls and strategic divestments reshape balance sheets.</p><p><strong>Why it matters:</strong> High-growth tech and AI integration are creating unprecedented capital gains, while legacy brands shed underperforming assets to protect margins.</p><p><strong>The big moves</strong></p><ul><li><strong>Bain Capital:</strong> Poised for a $15bn gain on chipmaker Kioxia, driven by the AI boom.</li><li><strong>Yum Brands:</strong> Selling Pizza Hut for $2.7bn to focus on KFC and Taco Bell.</li><li><strong>SpaceX:</strong> Now the world's fifth-most valuable company; recently inked a $60bn deal for AI app Cursor.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Companies are prioritizing high-margin AI infrastructure over traditional retail or legacy fast food.</li><li><strong>Risk management:</strong> Rathbones shares dropped 18% after halting high-risk client investments to avoid potential inflows hits.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market expansion:</strong> JPMorgan is targeting France, Spain, and Italy to scale its digital banking footprint.</li><li><strong>Geopolitical shifts:</strong> Jardine Matheson is pivoting away from Southeast Asia toward developed markets to balance its portfolio.</li></ul>", "middle east war": "<p>The U.S. and Iran have agreed to a ceasefire and the reopening of the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The deal ends a costly military stalemate and stabilizes global energy markets, but it creates a deep diplomatic rift between President Trump and Prime Minister Netanyahu.</p><p><strong>The deal's core:</strong></p><ul><li><strong>Immediate actions:</strong> 60-day ceasefire extension and the lifting of the U.S. naval blockade on Iranian ports.</li><li><strong>Economic carrot:</strong> A proposed $300 billion fund for Iran, contingent on \"performance\" regarding nuclear talks and waterway access.</li><li><strong>Strategic goal:</strong> Restoring flow through the Strait of Hormuz to lower global oil prices.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Trump's pivot:</strong> After promising \"unconditional surrender,\" Trump has settled for a truce of convenience to lower domestic petrol prices and exit a \"war of choice.\"</li><li><strong>Netanyahu's isolation:</strong> The Israeli PM faces a dual crisis—domestic backlash over the U.S.-Iran pact and a collapsing relationship with the White House.</li><li><strong>Iran's win:</strong> Despite heavy losses, Tehran emerges with enhanced leverage and a path toward financial reintegration.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$4:</strong> The threshold U.S. petrol prices have fallen below following the announcement.</li><li><strong>$300 billion:</strong> The potential incentive fund for Iran if the deal is upheld.</li><li><strong>60 days:</strong> The length of the ceasefire extension.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Friday:</strong> Official signing of the agreement.</li><li><strong>G7 Summit:</strong> President Trump will tout the peace deal as a primary diplomatic victory.</li><li><strong>Risk factor:</strong> Continued Israeli strikes in Beirut could derail the fragile truce.</li></ul>", "shipping": "<p>Global shipping is currently defined by a volatile struggle for control over strategic chokepoints and the rise of a high-risk \"shadow fleet.\"</p><p><strong>Why it matters:</strong> Disruptions in the Strait of Hormuz directly trigger oil price volatility and force costly logistical pivots. Simultaneously, the use of aging, sanctioned tankers increases the probability of catastrophic environmental disasters.</p><p><strong>The Hormuz Crisis</strong></p><ul><li><strong>Market volatility:</strong> Brent crude dropped nearly 6% after two China-bound supertankers successfully crossed the strait.</li><li><strong>Failed interventions:</strong> A $40bn US insurance facility has seen zero uptake because it lacks naval escorts.</li><li><strong>Logistical shifts:</strong> Freight rates are spiking as companies switch to trucks to move cargo around blocked waterways.</li><li><strong>Operational decay:</strong> Stranded vessels are suffering from biological infestation (barnacles and jellyfish), threatening future seaworthiness.</li></ul><p><strong>The Shadow Fleet</strong></p><ul><li><strong>Environmental risk:</strong> Over 50% of sanctioned \"shadow\" tankers are deemed high-risk for spills due to age.</li><li><strong>Geopolitical friction:</strong> The UK is actively intercepting Russian tankers to disrupt war funding.</li><li><strong>Sanction leaks:</strong> Danish shipyard Fayard remains the only EU yard servicing Russian LNG tankers.</li></ul><p><strong>Industrial pivots</strong></p><ul><li><strong>Defense boom:</strong> South Korea is seeing massive growth by capitalizing on the global AI and arms race.</li><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to compete with Dublin in freight and offshore wind.</li><li><strong>Capacity risks:</strong> Tanker owners who invested windfall profits into new ships now face a market crash if Hormuz fully reopens.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the Mercuria lawsuit against the Baltic Exchange, which will determine how shipping rates are set during geopolitical conflicts.</p>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative tech trend to a systemic disruptor of global finance, security, and labor.</p><p><strong>Why it matters:</strong> Massive capital expenditures are colliding with geopolitical export controls and labor market volatility, forcing a rethink of corporate leadership and national security.</p><p><strong>By the numbers</strong></p><ul><li><strong>$34 billion:</strong> OpenAI's spending last year on infrastructure and development.</li><li><strong>19.6%:</strong> The second-day share gain for SpaceX following its IPO.</li><li><strong>900%:</strong> Increase in website traffic for legal AI start-up Legora.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical friction:</strong> U.S. export controls on Anthropic's models create a vacuum that China is positioned to fill.</li><li><strong>Economic vulnerability:</strong> Private equity firms face significant risk in law and accountancy bets as AI automates professional services.</li><li><strong>Security gaps:</strong> Open-source models, including Europe's Mistral, show higher vulnerability to disinformation than closed systems.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Labor evolution:</strong> Job interviews are pivoting toward \"AI tests,\" requiring non-tech candidates to demonstrate tool proficiency.</li><li><strong>Regulatory pressure:</strong> Rising financial fraud is forcing a confrontation between governments and tech providers over liability.</li><li><strong>Leadership shift:</strong> Executives must transition from managing human teams to overseeing hybrid human-bot workforces.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony characterized by strategic asymmetry.</p><p><strong>Why it matters:</strong></p><ul><li>Both powers seek dominance but avoid the costs of global leadership, creating a governance vacuum.</li><li>Beijing is leveraging U.S. diplomatic volatility to position itself as a stable alternative for global partners.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Russia Factor:</strong> Putin’s isolation has forced a one-sided dependency on Beijing, granting Xi significant leverage.</li><li><strong>Soft Power Shift:</strong> While the U.S. burns diplomatic bridges, China is successfully rebranding as a pillar of stability.</li><li><strong>The Leverage Game:</strong> Power now derives from the ability to exploit imbalances rather than raw economic size.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Two:</strong> The number of F1 races cancelled in the Gulf, signaling how great power friction disrupts global commerce.</li><li><strong>Zero:</strong> The amount of leadership responsibility Beijing has assumed despite its growing influence.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Decay:</strong> Multilateral bodies like the UN face irrelevance unless they reinvent governance for a fractured world.</li><li><strong>Strategic Realignment:</strong> Middle powers will increasingly forge independent alliances to survive the \"might is right\" order.</li></ul>", "us elections": "<p>The U.S. political landscape is fracturing as MAGA-backed candidates secure primaries but face viability gaps in general elections.</p><p><strong>Why it matters:</strong> Trump’s influence remains absolute within the GOP base, yet his endorsements are creating strategic vulnerabilities in swing states and among key demographics.</p><p><strong>The MAGA paradox</strong></p><ul><li><strong>Texas:</strong> Ken Paxton’s primary victory cements Trump's grip on the GOP but provides Democrats a perceived opening due to Paxton's limited appeal to moderates.</li><li><strong>Kentucky:</strong> The defeat of Thomas Massie in the most expensive House primary ever signals the final purge of \"maverick\" Republicans.</li><li><strong>California:</strong> Steve Hilton’s advance to the governor's race tests the appetite for MAGA-aligned leadership in deep-blue territory.</li></ul><p><strong>Voter volatility</strong></p><ul><li><strong>Economic pain:</strong> FT polling shows voters increasingly blame Trump for inflation and grocery costs.</li><li><strong>The \"Lobster Revolt\":</strong> In Maine, tariffs and fuel prices are pushing traditional Republican fishermen toward the Democratic column.</li><li><strong>Faith gap:</strong> Evangelicals are questioning if Trump’s rhetoric aligns with Christian values, threatening a core pillar of his coalition.</li></ul><p><strong>Democratic realignment</strong></p><ul><li><strong>Populist shift:</strong> A former firefighter’s win in Pennsylvania suggests Democrats are pivoting toward working-class, populist messaging.</li><li><strong>Internal autopsy:</strong> A DNC report blames the Biden administration's lack of unity for Kamala Harris's loss.</li><li><strong>Maine turmoil:</strong> Graham Platner’s primary win brings misconduct allegations into a high-stakes Senate challenge against Susan Collins.</li></ul><p><strong>What's next</strong></p><ul><li><strong>2028 positioning:</strong> JD Vance and Marco Rubio are already emerging as primary contenders for the next presidential cycle.</li><li><strong>Legislative friction:</strong> A Republican-led House has blocked Trump from further Middle East strikes without congressional approval.</li><li><strong>Legal battles:</strong> A DOJ probe into Gavin Newsom could reshape his viability for a 2028 presidential run.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy and fiscal discipline amid collapsing relations with the U.S. and France.</p><p><strong>Why it matters:</strong> Berlin is accelerating rearmament to hedge against U.S. volatility while purging bureaucratic inefficiency to fund a massive defense build-up.</p><p><strong>The defense pivot</strong></p><ul><li><strong>U.S. Friction:</strong> Relations with Donald Trump have hit a low after Chancellor Friedrich Merz criticized U.S. strategy in Iran, prompting a review of U.S. troop levels in Germany.</li><li><strong>European Rift:</strong> Berlin is ditching France for new fighter jet partners and buying a 40% stake in KNDS to secure industrial control.</li><li><strong>Spending Surge:</strong> Germany aims to hit the 3.5% GDP NATO target six years ahead of schedule.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Far-right Rise:</strong> The AfD leads opinion polls by leveraging voter anger over fuel prices and maintaining ties with the Kremlin.</li><li><strong>Leadership Struggle:</strong> Conservative leader Friedrich Merz faces internal challenges from younger rivals like Hendrik Wüst as polls slide.</li><li><strong>Bureaucratic Purge:</strong> The government is overhauling its arms procurement agency and threatening to cut funding for ministries that fail to spend infrastructure budgets.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>EU Integration:</strong> The Finance Minister is prioritizing a Capital Markets Union over national interests, despite clashes with the ECB over the Commerzbank bid.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>€500bn:</strong> The infrastructure fund currently plagued by slow spending.</li><li><strong>€25mn:</strong> The threshold at which two lawmakers can block arms contracts.</li><li><strong>€12bn:</strong> Rheinmetall's bid to take over a troubled warship project.</li><li><strong>€2.35mn:</strong> The illegal donation the AfD was ordered to return.</li></ul>", "central banks": "<p>Central banks are shifting toward aggressive tightening and risk mitigation to combat persistent inflation and geopolitical instability.</p><p><strong>Why it matters:</strong> Rising energy costs and labor market strength are forcing a reversal of \"easy money\" policies. This shift increases borrowing costs globally and destabilizes emerging market currencies.</p><p><strong>The policy pivot</strong></p><ul><li><strong>ECB:</strong> First G7 bank to raise rates since 2023, citing a Middle East energy crisis and broadening price rises.</li><li><strong>Bank of Japan:</strong> Raised rates to 1% for the first time since 1995; plans to halt reductions in monthly bond purchases.</li><li><strong>The Fed:</strong> Rate cuts are effectively off the table following non-farm payrolls that doubled expectations.</li><li><strong>Bank of England:</strong> Facing internal pressure to hike rates despite a likely hold at 3.75%.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical hedging:</strong> Central banks are repatriating gold reserves to avoid sanctions and foreign seizure.</li><li><strong>Currency volatility:</strong> Indonesia enacted an off-cycle rate hike to defend the rupiah against foreign sell-offs.</li><li><strong>Systemic risk:</strong> US Treasuries are transitioning from a safe haven to a potential financial chokepoint.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed Leadership:</strong> Markets are watching Kevin Warsh’s inaugural meeting to determine if the Fed will pivot toward immediate rate hikes.</li><li><strong>Quantitative Tightening:</strong> The BoJ may tweak balance sheet plans to manage bond market volatility.</li></ul>", "us banks": "<p>US banks are aggressively expanding balance sheets and diversifying revenue streams as deregulation lowers capital barriers.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing giants like JPMorgan to pursue massive acquisitions and international retail expansion.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for US and UK banks via deregulation.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan claims is available due to lighter regulation.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering.</li><li><strong>$114 billion:</strong> Combined revenue of trading firms (Jane Street, Citadel) challenging traditional banks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk shifting:</strong> Banks are offloading private equity-linked loans and data center debt to avoid overexposure to AI and PE volatility.</li><li><strong>Geopolitical friction:</strong> Morgan Stanley is issuing China-specific iPhones to staff, signaling heightened data security fears in mainland China.</li><li><strong>Internal strife:</strong> Goldman Sachs is expanding its management committee and facing executive departures over leadership disputes.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail push:</strong> JPMorgan is scaling its \"Chase\" digital bank into Germany.</li><li><strong>Crypto integration:</strong> Morgan Stanley will launch spot crypto trading via E*Trade.</li><li><strong>Strategic pivots:</strong> Citi is partnering with BlackRock to scale private lending in Europe and the Middle East.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>16 Jun 2026 15:30 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
