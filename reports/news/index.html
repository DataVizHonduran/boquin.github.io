-05-04T11:00:04+00:00", "date_label": "04 May 2026", "tag": "us-china relations"}, {"title": "Pentagon to pull 5,000 soldiers out of Germany in dispute over Iran war", "url": "https://www.ft.com/content/4cabedc3-0119-4c3f-9867-094b7e1398f6", "summary": "Donald Trump retaliates against Friedrich Merz over chancellor’s criticism of US-Israeli war effort", "date_iso": "2026-05-02T23:36:15+00:00", "date_label": "02 May 2026", "tag": "german politics"}, {"title": "The physical world strikes back", "url": "https://www.ft.com/content/ee833531-4554-40d1-834f-659aeadb0ba6", "summary": "The Iran war is a reminder that geographic facts rather than digital tech shape our lives", "date_iso": "2026-05-02T04:03:06+00:00", "date_label": "02 May 2026", "tag": "us-china relations"}, {"title": "Trump launches review of US troops in Germany", "url": "https://www.ft.com/content/0fc1e2ef-f494-478a-b20f-4cd9b533ed86", "summary": "Threat comes days after German Chancellor Friedrich Merz criticised US strategy in Iran", "date_iso": "2026-04-30T15:48:17+00:00", "date_label": "30 Apr 2026", "tag": "german politics"}, {"title": "Germany re-arms: what does it mean for Europe?", "url": "https://www.ft.com/content/4b7c00f6-7b32-416b-a06d-485473068058", "summary": "Paris sees risks for its industry and the continent’s sovereignty in Berlin’s rapid defence build-up", "date_iso": "2026-04-29T04:00:06+00:00", "date_label": "29 Apr 2026", "tag": "german politics"}, {"title": "Germany to accelerate defence spending well ahead of Nato deadline", "url": "https://www.ft.com/content/ea83015e-d26c-428f-bbbb-00a745a443a5", "summary": "Berlin plans to meet alliance’s new 3.5% of GDP target for core military outlay at least six years ahead of schedule", "date_iso": "2026-04-28T16:39:44+00:00", "date_label": "28 Apr 2026", "tag": "german politics"}, {"title": "Risk management must evolve to remain fit for purpose", "url": "https://www.ft.com/content/72fd7de4-85ce-454b-a17c-4c93790b3da9", "summary": "Resilience, const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>17 Jun 2026 14:32 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
