const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and corporate turmoil are destabilizing the global energy landscape.</p><p><strong>Why it matters:</strong> Supply shocks in the Middle East are driving immediate price spikes and exposing critical infrastructure dependencies. Simultaneously, leadership crises at \"Supermajors\" threaten the execution of long-term energy transition strategies.</p><p><strong>The supply shock</strong></p><ul><li><strong>Price surge:</strong> Chevron warns of summer price jumps as a Strait of Hormuz blockade removes 13 million barrels per day from global markets.</li><li><strong>Energy insecurity:</strong> Iraq faces summer blackouts due to its reliance on Iranian gas; India’s glass industry is stalling as Gulf crises choke energy flows.</li><li><strong>Cost pass-through:</strong> UK household energy bills will rise 13% in July, reaching a two-year high of £1,862.</li></ul><p><strong>Corporate instability</strong></p><ul><li><strong>BP turmoil:</strong> The removal of Chair Albert Manifold over bullying allegations marks the company's second CEO and second Chair change in three years.</li><li><strong>Succession plays:</strong> TotalEnergies shareholders approved higher age limits to keep CEO Patrick Pouyanné beyond 2030.</li><li><strong>M&A friction:</strong> China’s Zijin faces delays in its $4bn Allied Gold acquisition due to political instability and arrests of foreign executives in Mali.</li></ul><p><strong>The transition tension</strong></p><ul><li><strong>Critical minerals:</strong> Western efforts to break China's rare earth monopoly are hampered by legal battles over tech theft and local environmental opposition.</li><li><strong>Policy gaps:</strong> Middle East volatility is highlighting the urgent need for clear government policy to incentivize the shift from fossil fuels.</li><li><strong>Industrial pushback:</strong> Six EU nations are demanding more carbon emissions permits to shield heavy industry from rising energy costs.</li></ul><p><strong>What's next:</strong> Watch for increased volatility in Brent crude prices as \"shock absorbers\" dwindle and the ECB monitors how U.S. trade policy impacts global financial stability.</p>", "corporate earnings and results": "<p>Global markets are shifting as AI infrastructure, geopolitical instability, and supply chain vulnerabilities redefine corporate valuations.</p><p><strong>Why it matters:</strong> Capital is migrating toward high-security defense tech and AI hubs while traditional sectors face systemic risks from sanctions and cheap imports.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>SoftBank</strong> is pledging €75bn for a massive AI facility in France, signaling a strategic shift toward European infrastructure.</li><li><strong>Tehran</strong> is leveraging Western AI models to accelerate malware development and cyber operations.</li></ul><p><strong>Sector Volatility</strong></p><ul><li><strong>Defense:</strong> Jamming-resistant radio makers are seeking $3bn+ sales as the Ukraine war increases demand for secure data links.</li><li><strong>Healthcare:</strong> Sandoz warns that cheap Chinese imports are eroding Europe's antibiotic production capacity.</li><li><strong>Agriculture:</strong> US beef prices hit record highs due to the lowest cattle herds in 60 years.</li></ul><p><strong>Financial Risk</strong></p><ul><li><strong>Shipping:</strong> Over 50% of the \"shadow fleet\" of sanctioned oil tankers are now flagged as environmental disaster risks.</li><li><strong>Crypto:</strong> Treasuries are shifting toward risky equity and \"digital credit\" to maintain liquidity.</li></ul><p><strong>What's next:</strong> Watch for increased protectionist policies in European pharma and a surge in M&A activity for defense firms specializing in electronic warfare.</p>", "middle east war": "<p>The Middle East is entering a volatile phase of simultaneous escalation in Lebanon and Gaza alongside high-stakes diplomacy between the U.S. and Iran.</p><p><strong>Why it matters:</strong> Israel is expanding its territorial footprint to dismantle Hezbollah and Hamas, while the U.S. attempts to prevent a direct regional war with Iran to stabilize global markets.</p><p><strong>The military front</strong></p><ul><li><strong>Lebanon:</strong> Israel has captured the Crusader castle and intensified strikes in Beirut to degrade Hezbollah's capabilities.</li><li><strong>Gaza:</strong> Prime Minister Netanyahu ordered forces to seize 70% of the enclave to \"squeeze\" Hamas.</li><li><strong>Human Rights:</strong> The UN has formally accused the IDF of committing sexual violence against Palestinians.</li></ul><p><strong>The U.S.-Iran gamble</strong></p><ul><li><strong>The Deal:</strong> Washington is nearing a ceasefire extension, though Tehran fears concessions are a \"trap\" leading to future conflict.</li><li><strong>The Friction:</strong> Hardliners in Tehran are resisting compromise, while U.S. and Iranian forces continue exchanging drone and missile fire.</li><li><strong>The Leverage:</strong> President Trump maintains that economic pressure will not force a premature deal, despite market volatility.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Oil:</strong> Brent crude saw its biggest monthly decline since 2020 on hopes of a Strait of Hormuz reopening.</li><li><strong>Finance:</strong> The \"Board of Peace\" fund remains empty despite $17 billion in pledges for Gaza projects.</li><li><strong>Media:</strong> UK-based Iran International received £650 million in debt relief to sustain opposition broadcasting.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Security Talks:</strong> Israel and Lebanon are scheduled for security discussions in Washington.</li><li><strong>Market Reaction:</strong> Investors are currently prioritizing AI growth over Middle East instability, fueling a stock market winning streak.</li></ul>", "shipping": "<p>The conflict in the Strait of Hormuz is destabilizing global energy flows and forcing a permanent reconfiguration of trade routes.</p><p><strong>Why it matters:</strong> Disruptions in the Gulf trigger immediate spikes in freight costs and fuel volatility, pushing nations toward alternative energy sources and longer, costlier shipping lanes.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk due to the conflict.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert from the Suez.</li><li><strong>$0:</strong> Total uptake of Trump’s $40bn insurance facility due to lack of naval escorts.</li><li><strong>6%:</strong> Drop in Brent crude prices following the successful passage of two China-bound supertankers.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Energy pivots:</strong> Asian nations are surging coal shipments to replace disrupted gas supplies.</li><li><strong>Logistical failures:</strong> Cargo is shifting from ships to trucks in the Gulf, drastically increasing costs and reducing volume.</li><li><strong>Operational decay:</strong> Stranded vessels face biological degradation (barnacles/jellyfish), threatening their ability to sail once the conflict ends.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route shifts:</strong> Shipping companies will continue favoring the Cape of Good Hope over the Suez to avoid risk.</li><li><strong>Infrastructure wars:</strong> Ports like Belfast are investing billions (£1.3bn) to capture freight diverted by regional instability.</li><li><strong>Regulatory deadlock:</strong> US blocking tactics are stalling global agreements on shipping carbon levies and emissions.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative software tool to a high-stakes infrastructure race involving lethal weaponry, sovereign policy, and massive capital expenditure.</p><p><strong>Why it matters:</strong> The transition to \"frontier models\" is creating a decoupling between soaring hardware valuations and uncertain business models, while pushing ethical boundaries in warfare and labor.</p><p><strong>By the numbers</strong></p><ul><li><strong>$965B:</strong> Anthropic's new valuation following a $65B funding deal.</li><li><strong>$500M:</strong> Kirkland & Ellis' investment to build a proprietary legal AI platform.</li><li><strong>75%:</strong> Projected gains for the Philadelphia Semiconductor Index by 2026.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hardware leads software:</strong> Investors are betting on the \"picks and shovels\" (chips and memory) because the direct ROI on AI software remains unproven.</li><li><strong>The \"Usage Trap\":</strong> Amazon's removal of AI leaderboards suggests companies are fighting \"performative AI\"—employees using tools to meet quotas rather than drive efficiency.</li><li><strong>Sovereignty shift:</strong> The EU is moving from purely regulating US Big Tech to actively funding European alternatives to ensure \"tech sovereignty.\"</li></ul><p><strong>What's next</strong></p><ul><li><strong>Lethal Autonomy:</strong> The UK military is weighing the removal of human approval for strikes, signaling a pivot toward autonomous warfare.</li><li><strong>Regulatory Clash:</strong> A battle is forming between \"fast-mover\" corporate governance and calls for elected officials to close accountability loopholes.</li><li><strong>Labor Redefinition:</strong> As CEOs frame employees as \"human capital,\" the debate is shifting from *can* AI do the job to *should* it.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global influence as Washington pivots toward unilateralism and Beijing fills the leadership vacuum.</p><p><strong>Why it matters:</strong></p><ul><li>U.S. volatility and \"bridge-burning\" diplomacy are eroding traditional alliances, creating an opening for China to position itself as a stable global pillar.</li><li>The shift toward \"asymmetric power\" means leverage now stems from exploiting imbalances rather than raw economic or military size.</li></ul><p><strong>The strategic shift</strong></p><ul><li><strong>Beijing's gain:</strong> China is successfully converting U.S. instability into soft power, attracting foreign officials seeking predictability.</li><li><strong>Russia's role:</strong> Putin’s strategic errors have forced Russia into a subordinate, one-sided dependency on China.</li><li><strong>U.S. friction:</strong> Internal shifts toward pre-emptive strikes and troop cut threats are creating \"deterrence gaps\" within NATO.</li></ul><p><strong>Between the lines</strong></p><ul><li>Neither power is fully embracing the responsibilities of hegemony.</li><li>Washington seeks influence without the burden of global policing.</li><li>Beijing seeks leadership without the transparency or institutional commitments of a global hegemon.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Middleman diplomacy:</strong> Expect an increase in special envoys and non-traditional negotiators to bypass diplomatic stalemates.</li><li><strong>Institutional decay:</strong> Multilateral bodies like the UN face irrelevance unless they pivot to manage a \"fractured world\" rather than a globalized one.</li><li><strong>Risk evolution:</strong> Global business and governance will shift from growth-optimization to resilience and contingency planning.</li></ul>", "us elections": "<p>Trump's influence over the GOP is creating strategic vulnerabilities ahead of the midterm elections.</p><p><strong>Why it matters:</strong> High-profile endorsements of divisive candidates may secure the MAGA base but alienate moderate swing voters. This creates openings for Democrats in critical battleground states.</p><p><strong>The Texas Tension</strong></p><ul><li>Trump-backed Ken Paxton won the primary, signaling the president's grip on the party.</li><li>Democrats view Paxton's limited appeal outside the base as a path to victory in the Senate race.</li></ul><p><strong>Economic Headwinds</strong></p><ul><li>Over 50% of voters disapprove of Trump's economic handling.</li><li>Tariffs and fuel costs are eroding support among key demographics, including Maine lobster fishermen.</li></ul><p><strong>Internal Fractures</strong></p><ul><li><strong>GOP:</strong> \"MAGA divorce\" is emerging as nationalists claim the Iran war betrays \"America First\" pledges.</li><li><strong>Democrats:</strong> A DNC autopsy blames the White House for previous losses, citing a lack of party unity.</li></ul><p><strong>Between the lines</strong> The GOP is shifting further right, prioritizing loyalty to Trump over general electability. Meanwhile, Democrats are pivoting toward populist, working-class candidates to reclaim lost ground in swing districts like Pennsylvania.</p><p><strong>What's next</strong> Watch for the fallout from the $1.8bn \"anti-weaponisation\" fund, which is currently pitting Trump against his own senators.</p>", "german politics": "<p>Germany is undergoing a volatile strategic pivot toward military expansion and political instability.</p><p><strong>Why it matters:</strong> Internal leadership struggles and a deteriorating relationship with the U.S. threaten Berlin's ability to lead the EU during a security crisis.</p><p><strong>The defense surge</strong></p><ul><li>Berlin is accelerating spending to hit 3.5% of GDP, years ahead of NATO deadlines.</li><li>The government is overhauling its procurement agency to speed up spending.</li><li>State intervention is rising: Berlin is buying a 40% stake in tank maker KNDS.</li></ul><p><strong>Diplomatic friction</strong></p><ul><li>Relations with Donald Trump have collapsed following Chancellor Friedrich Merz's criticism of U.S. strategy in Iran.</li><li>The U.S. is reviewing troop presence and may pull 5,000 soldiers from Germany.</li><li>Berlin is attempting to mitigate the fallout by pursuing Tomahawk missile purchases.</li></ul><p><strong>Political instability</strong></p><ul><li>The far-right AfD is topping polls by leveraging voter anger over fuel prices.</li><li>Chancellor Merz faces an internal challenge from Hendrik Wüst as conservative polls slide.</li><li>The AfD remains fractured internally over conscription and NATO.</li></ul><p><strong>Economic tensions</strong></p><ul><li>Berlin is privatizing Uniper, reducing its stake from 99% to 25%.</li><li>EU friction is growing over protectionist content requirements for streamers like Netflix.</li><li>The ECB is criticizing German opposition to UniCredit’s bid for Commerzbank as anti-market.</li></ul><p><strong>What's next:</strong> Watch for the September regional elections in eastern states to determine if the AfD's surge translates into governing power.</p>", "central banks": "<p>Central banks are facing a volatile convergence of geopolitical conflict, stubborn inflation, and eroding policy autonomy.</p><p><strong>Why it matters:</strong> Persistent inflationary pressures from the Iran war are forcing a pivot away from expected rate cuts, limiting the ability of central banks to stabilize markets during shocks.</p><p><strong>The policy pivot</strong></p><ul><li><strong>Federal Reserve:</strong> Incoming chair Kevin Warsh faces immediate pressure to raise rates by 2026 as inflation trends upward.</li><li><strong>ECB & BoJ:</strong> Both the European Central Bank and Bank of Japan are laying groundwork for June rate hikes due to energy price spillovers.</li><li><strong>The \"Policy Put\":</strong> Investors can no longer assume central banks will lower rates to rescue markets during downturns.</li></ul><p><strong>Systemic risks</strong></p><ul><li><strong>Fiscal Dominance:</strong> Rising public debt and demographic shifts are constraining the independence of monetary policy.</li><li><strong>AI Vulnerability:</strong> The ECB is urgently summoning banks to address financial system flaws exposed by new AI models.</li><li><strong>Debt Costs:</strong> Conflict in Iran is driving US borrowing costs to their highest levels since 2007.</li></ul><p><strong>Technological shifts</strong></p><ul><li><strong>Blockchain:</strong> The Fed and Bank of England successfully tested a prototype for near-instantaneous cross-border payments.</li></ul><p><strong>What's next:</strong> Watch for the Fed's first meeting under Kevin Warsh to see if the bank officially drops its rate-cut signals in favor of a hawkish stance.</p>", "us banks": "<p>US banks are aggressively expanding balance sheets and pursuing acquisitions as deregulation unlocks massive capital reserves.</p><p><strong>Why it matters:</strong> A lighter regulatory environment under the Trump administration is freeing billions in excess capital, giving US lenders a competitive edge over constrained EU and Swiss rivals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital freed at JPMorgan alone.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering.</li><li><strong>$9.4 billion:</strong> Total employee compensation at Jane Street for 2025.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk Management:</strong> Banks are actively offloading \"choke points,\" specifically $4bn in PE-linked loans and high-exposure AI data center debt.</li><li><strong>Geopolitical Friction:</strong> Security concerns are driving operational splits, evidenced by Morgan Stanley issuing China-only iPhones and Goldman restricting AI tool access in Hong Kong.</li><li><strong>Strategic Pivots:</strong> Citi is shifting toward private lending via a €15bn BlackRock partnership and restructuring internal incentives to reward direct business generation.</li></ul><p><strong>What's next</strong></p><ul><li><strong>European Expansion:</strong> JPMorgan is scaling its digital consumer bank (Chase) into Germany.</li><li><strong>Crypto Integration:</strong> Morgan Stanley will launch spot crypto trading on E*Trade, further mainstreaming digital assets.</li><li><strong>Treasury Surge:</strong> Primary dealers are boosting Treasury holdings to 2007 levels to facilitate increased government debt trading.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>31 May 2026 11:59 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
