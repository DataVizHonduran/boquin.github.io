/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Energy markets are fracturing as AI power demands and geopolitical volatility clash with slowing climate ambitions.</p><p><strong>Why it matters:</strong> The surge in AI data centers is forcing tech firms to bypass traditional grids and return to fossil fuels, undermining global electrification goals. Simultaneously, infrastructure attacks in Russia and the Middle East are creating localized supply shocks despite stable global output.</p><p><strong>The AI energy pivot</strong></p><ul><li><strong>Direct investment:</strong> Anthropic signed a $3.4bn deal for gas-fired power to secure energy for data centers.</li><li><strong>New hubs:</strong> Argentina is leveraging Patagonian energy resources to attract unregulated AI infrastructure.</li><li><strong>Market fear:</strong> Heavy spending on power infrastructure is weighing on AI company valuations.</li></ul><p><strong>Geopolitical volatility</strong></p><ul><li><strong>Russia:</strong> Ukrainian strikes on refineries have forced the state to ration petrol.</li><li><strong>Saudi Arabia:</strong> Production remains near pre-war levels, but Houthi/militia attacks on the East-West pipeline threaten export stability.</li><li><strong>Venezuela:</strong> ExxonMobil is exploring a return to the country after previously labeling it \"uninvestable.\"</li></ul><p><strong>The COP31 deadlock</strong></p><ul><li><strong>Watered-down goals:</strong> The EU is lowering its ambitions for the upcoming summit, focusing on electrification while avoiding hard targets on fossil-fuel phase-outs.</li><li><strong>Policy friction:</strong> The UK government rejected its largest proposed solar farm to protect \"greenbelt\" land.</li><li><strong>Industry pushback:</strong> IAG warns that aggressive green charges could cripple the European aviation sector.</li></ul><p><strong>What's next:</strong> Watch for a \"fossil fuel capture\" of the COP31 electricity pledge, where nations may count gas-fired generation toward clean energy targets to meet 2035 goals.</p>", "corporate earnings and results": "<p>AI optimism is driving a massive valuation surge across the tech sector.</p><p><strong>Why it matters:</strong> Better-than-expected results from infrastructure players and soaring IPO targets are erasing recent losses and signaling a renewed appetite for high-growth AI assets.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 trillion:</strong> The projected IPO valuation bankers are preparing for Anthropic.</li><li><strong>$7 billion:</strong> The current valuation of UK chip start-up Fractile.</li><li><strong>£30 million:</strong> The amount ITV is cutting from its content budget to offset sliding ad revenue.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Concentration risk:</strong> The \"AI trade\" is becoming a primary engine for market sentiment, though analysts warn of \"after-market indigestion\" due to circular supply-chain backing.</li><li><strong>Sovereign AI:</strong> European nations are aggressively pursuing \"homegrown\" alternatives to US tech, specifically in military targeting (Helsing) and healthcare data (NHS).</li><li><strong>Operational shifts:</strong> AI agents are now capable of running lean start-ups with zero employees, fundamentally altering the cost structure of new ventures.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory friction:</strong> Brussels is preparing new Big Tech rules despite promises to reduce bureaucracy.</li><li><strong>Industrial integration:</strong> Germany is leveraging \"Mittelstand\" manufacturing data to create a competitive edge in industrial AI.</li></ul>", "middle east war": "<p>President Trump is pivoting away from military escalation in Iran to prioritize a diplomatic resolution.</p><p><strong>Why it matters:</strong> A shift toward de-escalation lowers the immediate risk of a regional oil shock and stabilizes global equity markets.</p><p><strong>By the numbers</strong></p><ul><li><strong>Below $90:</strong> Brent crude price after Trump signaled strikes on Iran are \"highly unlikely.\"</li><li><strong>10 weeks:</strong> The new low for oil prices following the shift in U.S. rhetoric.</li><li><strong>$20 billion:</strong> The scale of the fraud scandal prompting Turkey's chief banking regulator to resign.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>U.S. Retrenchment:</strong> Trump's retreat from aggressive military postures suggests a broader American withdrawal, potentially creating a power vacuum for China.</li><li><strong>Economic Friction:</strong> Despite the diplomatic thaw, \"war inflation\" is curbing luxury spending in the Gulf as import costs rise.</li><li><strong>Asymmetric Warfare:</strong> While conventional strikes are unlikely, Iran continues to engage in gray-zone conflict, including cyber attacks on French infrastructure.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Israel's Governance:</strong> Gadi Eisenkot has 28 days to form a ruling coalition.</li><li><strong>Humanitarian Crisis:</strong> The \"Board of Peace\" warns of an immediate emergency in Gaza due to flooding and aid restrictions.</li><li><strong>Regional Security:</strong> European powers are coordinating with Abu Dhabi to counter Russian security demands in the region.</li></ul>", "shipping": "<p>Global shipping is facing a volatility crisis as geopolitical conflict transforms the world's primary maritime arteries.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are forcing a massive redirection of global trade. This shift spikes operational costs, inflates insurance premiums, and threatens global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has targeted 24 vessels in two weeks using limpet mines and speedboats.</li><li><strong>Black Sea:</strong> Now the world's deadliest route for commercial sailors due to the Russia-Ukraine war.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades of Iranian ports have led to direct kinetic engagements with tankers.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>$200:</strong> Potential oil price per barrel warned by Vitol if tanker shortages persist.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East and ice melts.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Russia is shifting grain exports to the Arctic to bypass Black Sea combat.</li><li><strong>Market distortion:</strong> Old supertankers now command higher prices than new builds because they are available for immediate delivery.</li><li><strong>Deception tactics:</strong> Russian tankers are spoofing GPS locations to evade sanctions and monitoring.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Infrastructure shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe as the UK's top port, driven by Chinese EV imports.</li><li><strong>Legal battles:</strong> A court case between Mercuria and the Baltic Exchange will determine the validity of shipping price estimates during wartime.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative gold rush to a period of intense regulatory scrutiny and financial volatility.</p><p><strong>Why it matters:</strong> Market exuberance is colliding with geopolitical risks and governance failures, forcing a transition from hype to operational viability.</p><p><strong>The financial landscape</strong></p><ul><li><strong>Anthropic's IPO:</strong> The Claude maker is targeting a valuation between $1.4T and $1.5T, with Goldman Sachs projecting revenues to exceed $600B by 2030.</li><li><strong>Infrastructure debt:</strong> CoreWeave is leveraging chip-backed debt and pre-payments to fund massive hardware expansions.</li><li><strong>Market correction:</strong> SoftBank reported a $7B loss due to US data center writedowns, signaling \"evolving requirements\" in AI infrastructure.</li></ul><p><strong>The Nvidia crisis</strong></p><ul><li><strong>Legal turmoil:</strong> CEO Jensen Huang is under investigation by the FBI and internal probes regarding an alleged affair with a Chinese spy.</li><li><strong>Key man risk:</strong> Analysts warn the AI sector is dangerously dependent on single executives, creating systemic vulnerability.</li><li><strong>Geopolitical leaks:</strong> Singapore has emerged as a critical transit route for Nvidia chips bypassing US sanctions on China.</li></ul><p><strong>Societal friction</strong></p><ul><li><strong>Labor freeze:</strong> Employers are pausing new hires to assess AI's long-term impact on job roles.</li><li><strong>Academic crisis:</strong> UK universities are returning to \"analogue\" methods to combat AI-driven cheating and protect institutional integrity.</li><li><strong>Creative pivot:</strong> Art schools are redesigning photography curricula to integrate AI without erasing fundamental skills.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory pushback:</strong> The CFTC is delaying AI computing futures to prevent price manipulation in the new asset class.</li><li><strong>Strategic autonomy:</strong> Europe faces increased reliance on US-dominated OS and search engines as it struggles to build domestic AI distribution.</li></ul>", "us-china relations": "<p>US-China relations are entering a volatile era of transactional diplomacy and systemic rivalry.</p><p><strong>Why it matters:</strong> Unpredictable leadership in both Washington and Beijing increases the risk of miscalculation. A shift toward \"Trumpism\" prioritizes short-term wins over long-term strategic stability.</p><p><strong>Between the lines</strong></p><ul><li><strong>The \"Wrong Men\" Problem:</strong> Current leadership lacks the far-sightedness required to manage a \"Great Game\" where outcomes depend on forces beyond state control.</li><li><strong>The Détente Trap:</strong> High-level summits are often mistaken for stability; in reality, they are cost-free tactical pauses, not strategic pivots.</li><li><strong>The Brics Effect:</strong> US tariffs and sanctions are driving an unlikely consensus among Brics nations, accelerating the move toward a multipolar economic order.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>19th Century:</strong> The current struggle mirrors the UK-Russia rivalry, where external variables decided the victor.</li><li><strong>Zero-Sum:</strong> Economic security is now viewed as a weapon, forcing \"middle powers\" like Australia to diversify supply chains to avoid geopolitical hostage-taking.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Decay:</strong> The UN and other multilateral bodies face deadlock, leaving a vacuum that \"Davids\" (smaller powers) are increasingly filling.</li><li><strong>Strategic Drift:</strong> Europe must prepare for a permanently inward-looking US, regardless of who holds the presidency.</li></ul>", "us elections": "<p>Democrats secured a decisive victory in the U.S. midterms, shifting the balance of power in Congress.</p><p><strong>Why it matters:</strong> High living costs and unpopular administration policies drove voters away from the GOP, signaling that economic affordability outweighs ideological rhetoric.</p><p><strong>The fallout</strong></p><ul><li><strong>GOP Crisis:</strong> Republicans are split between \"America First\" loyalists and pragmatists seeking a broader appeal.</li><li><strong>Leadership:</strong> Jim Jordan’s appointment as House minority leader signals a continued uncompromising stance despite losses.</li><li><strong>Democratic Profile:</strong> Despite \"radical left\" headlines, the new Democratic majority is dominated by moderates.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1tn+:</strong> China's trade surplus for the first 10 months, intensifying trade tensions.</li><li><strong>150 years:</strong> The gap since a Black man last held a U.S. Senate seat from Mississippi, a milestone now within reach for Scott Colom.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic primacy:</strong> Voters forgave political scandals and election subversion but punished the administration for high prices.</li><li><strong>Labor resurgence:</strong> Union-backed candidates were critical in reclaiming former Democratic heartlands.</li><li><strong>Trump's pivot:</strong> The President is floating amnesty deals, admitting his stance on immigrants and the Iran war alienated voters.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investigations:</strong> Democrats have vowed to probe the Trump family's ties to the crypto industry.</li><li><strong>Policy shift:</strong> Democrats must now decide whether to pursue aggressive change or maintain a centrist approach to sustain their mandate.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting a multi-front war to maintain his grip on power amid electoral collapse and internal coalition instability.</p><p><strong>Why it matters:</strong> Merz's weakened domestic standing hobbles Germany's leadership within the EU and complicates critical security pivots toward Ukraine and Russia.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition strain:</strong> Labour Minister Bärbel Bas resigned, stalling essential pension and market reforms.</li><li><strong>Far-right surge:</strong> The AfD is securing regional legislative leadership and allegedly poaching votes from Merz’s CDU.</li><li><strong>Succession pressure:</strong> Popular North Rhine-Westphalia Premier Hendrik Wüst is emerging as a viable alternative to Merz.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Fiscal tension:</strong> Economic experts warn that military spending must shift to the regular budget to prevent debt from hitting 98% of GDP by 2040.</li><li><strong>Strategic friction:</strong> France is demanding clarity on Germany's \"deep precision strike\" capabilities to avoid triggering Russian nuclear retaliation.</li><li><strong>Espionage:</strong> The government has warned officials of iPhone hacks and arrested a Ukrainian national suspected of spying for the Kremlin.</li></ul><p><strong>The EU leverage</strong></p><ul><li><strong>Budget ultimatum:</strong> Merz is threatening to block the EU's next budget unless the bloc unanimously agrees on more funding for Kyiv.</li><li><strong>Diminished authority:</strong> Poor regional election results have eroded Merz's bargaining power in Brussels regarding the €2tn budget deal.</li></ul><p><strong>What's next:</strong> Watch for the March presidential transition as Ilse Aigner takes office, and whether Merz can pass unpopular reforms before the AfD's momentum forces a leadership change.</p>", "central banks": "<p>Central banks are pivoting toward aggressive tightening and leadership transitions to combat entrenched inflation.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing policymakers to abandon cautious scripts. Failure to stabilize inflation risks losing international credibility and destabilizing bond markets.</p><p><strong>The global landscape</strong></p><ul><li><strong>U.S. Fed:</strong> Considering 50bp hikes if inflation persists; shifting to fewer annual policy meetings starting in 2027.</li><li><strong>Bank of England:</strong> Raising rates to 4% to tame inflation, though mortgage market shifts may necessitate faster future cuts.</li><li><strong>ECB:</strong> Maintaining a tightening course as core inflation remains well above the 2% target.</li></ul><p><strong>Leadership shakeup</strong> Christine Lagarde will step down as ECB president in February. Frontrunners Pablo Hernández de Cos and Klaas Knot are positioned as pragmatists.</p><p><strong>Between the lines</strong></p><ul><li><strong>Tool expansion:</strong> New ECB leadership may need to \"invent\" new tools to manage potential debt crises and French bond volatility.</li><li><strong>Policy shift:</strong> The BoE is moving toward a \"short and precautionary\" tightening cycle.</li><li><strong>Ideological drift:</strong> There is renewed interest in monetarism (Milton Friedman) as traditional signals prove noisy.</li></ul><p><strong>What's next</strong> Watch for the ECB president nomination deadline this Friday and the Fed's response to Q3 growth data.</p>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit flight to higher-yield accounts, while regulatory fines for money laundering are eating into net profits.</p><p><strong>The profit picture</strong></p><ul><li><strong>Goldman Sachs:</strong> Net income rose 30% in Q3, driven by equities and prime brokerage fees from AI-focused hedge funds.</li><li><strong>Bank of America:</strong> Profits dropped 17% following a $1.2 billion money laundering fine.</li><li><strong>American Express:</strong> Fined $350 million for systemic failures in reporting $13 billion in suspicious transactions.</li></ul><p><strong>The talent war</strong></p><ul><li><strong>Goldman Sachs</strong> is elevating a record number of engineers to partner to secure technical expertise.</li><li><strong>Citi</strong> is shortening its analyst program to two years to prevent junior bankers from defecting to private equity.</li><li><strong>Evercore</strong> reshuffled leadership, appointing its first-ever co-presidents.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Paradox:</strong> Banks are restricting AI agents to protect deposits while simultaneously using the tech to automate supervision and avoid another SVB-style collapse.</li><li><strong>Geopolitical plays:</strong> Citi's approval for a China securities business signals a strategic push ahead of high-level US-China diplomatic meetings.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Trading slowdown:</strong> Analysts forecast a sharp decline in trading revenue after a bumper start to the year.</li><li><strong>Regulatory scrutiny:</strong> The White House and courts continue to probe the \"culture of risk aversion\" that led to the SVB implosion.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>11 Nov 2026 18:02 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
