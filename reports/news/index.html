const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Global oil markets have shifted to a surplus as Gulf shipments recover from conflict-driven disruptions.</p><p><strong>Why it matters:</strong> Rebounding Saudi production is stabilizing supply, but depleted global stockpiles and geopolitical volatility leave the system fragile.</p><p><strong>The energy-AI collision</strong> Data center expansion is creating a critical power deficit, leading to costly strategic missteps:</p><ul><li><strong>Failed bets:</strong> SoftBank took a $3.7bn charge after overordering inefficient gas turbines for AI hubs.</li><li><strong>Infrastructure gaps:</strong> Oracle’s \"Project Jupiter\" underscores the extreme difficulty of securing reliable electricity for massive AI builds.</li><li><strong>Hidden costs:</strong> Focus is shifting toward the \"embodied carbon\" of data center construction, specifically cement emissions.</li></ul><p><strong>Geopolitical pivots</strong> Energy security is overriding climate commitments in several key regions:</p><ul><li><strong>U.S. Strategy:</strong> The Trump administration is pushing to overhaul permitting systems to accelerate fossil fuel infrastructure.</li><li><strong>Russia/Ukraine:</strong> Russian diesel exports doubled following sanction lifts, though Ukrainian refinery attacks threaten this surge.</li><li><strong>Venezuela:</strong> ExxonMobil is exploring a return to the country after previously labeling it \"uninvestable.\"</li></ul><p><strong>The \"Green\" friction</strong> Climate goals are clashing with legal and economic realities:</p><ul><li><strong>Legal setbacks:</strong> Norway's Supreme Court ruled the government must consider downstream emissions from exported oil.</li><li><strong>Regulatory war:</strong> ExxonMobil is legally challenging EU carbon capture rules via an investment treaty.</li><li><strong>COP31 tension:</strong> Negotiators are fighting to ensure electrification pledges don't become a loophole for more fossil-fired generation.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$3.7bn:</strong> SoftBank's loss on AI-related gas turbine bets.</li><li><strong>$2bn:</strong> Cost of the project to link Cyprus to the EU electricity grid.</li><li><strong>35%:</strong> The target share of global electricity consumption by 2035 being debated at COP31.</li></ul>", "corporate earnings and results": "<p>Nvidia faces a leadership crisis and regulatory scrutiny following the resignation of CEO Jensen Huang.</p><p><strong>Why it matters:</strong> Huang's departure creates a power vacuum at the world's most critical AI chipmaker while intensifying U.S.-China trade tensions.</p><p><strong>The Nvidia fallout</strong></p><ul><li><strong>Leadership search:</strong> Arm CEO Rene Haas is a top candidate to replace Huang.</li><li><strong>Market risk:</strong> Investors fear a massive sell-off if Huang offloads his $135bn stock holding.</li><li><strong>China exposure:</strong> Huang's previous efforts to maintain Beijing ties are now under intense scrutiny.</li><li><strong>Political friction:</strong> Treasury Secretary Bessent and Commerce Secretary Lutnick are clashing over chip blacklists.</li></ul><p><strong>Corporate winners and losers</strong></p><ul><li><strong>Richemont:</strong> Net profit rose 39% in H1, driven by high jewelry demand.</li><li><strong>Burberry:</strong> Outperforming the luxury slump by pivoting away from high-end exclusivity.</li><li><strong>Asics:</strong> Shares slid as sales growth for Onitsuka Tiger slows.</li><li><strong>Microsoft:</strong> Racing to restore services after a global outage with significant economic impact in Germany.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory pressure:</strong> Expect tighter U.S. restrictions on AI chip exports to China.</li><li><strong>Market volatility:</strong> AI trading bots and tokenization risks are increasing systemic vulnerability to high-speed shocks.</li></ul>", "middle east war": "<p>The U.S.-Israel alliance is reaching a crisis point as President Trump pivots toward a diplomatic resolution with Iran.</p><p><strong>Why it matters:</strong> A shift in U.S. strategy reduces the likelihood of direct military escalation, lowering global energy risks but straining traditional security ties with Israel.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>Iran pivot:</strong> Trump signaled an end to peace deal pushes, stating the U.S. does not need a formal agreement with Tehran.</li><li><strong>De-escalation:</strong> Oil prices hit a 10-week low (dropping below $90) after Trump labeled strikes on Iran \"highly unlikely.\"</li><li><strong>Military retreat:</strong> The U.S. removed aircraft from a second UK military base, signaling a reduced forward posture.</li></ul><p><strong>Regional instability</strong></p><ul><li><strong>Gaza crisis:</strong> Despite ceasefire efforts, Israel struck a Gaza hospital; the \"Board of Peace\" warns of an immediate humanitarian emergency due to flooding and aid shortages.</li><li><strong>Infrastructure targets:</strong> Houthi and Iraqi militia attacks struck Saudi Arabia's critical East-West pipeline.</li><li><strong>Cyber warfare:</strong> France formally accused Iran's IRGC of cyber attacks targeting supermarket refrigeration systems.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Gulf markets:</strong> War-driven inflation is forcing Gulf consumers to cut luxury spending, hitting retail profits.</li><li><strong>Abu Dhabi hedge:</strong> The UAE continues aggressive investment in culture and real estate (e.g., Frieze art fair) to insulate its economy from regional jitters.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the internal GOP battle over Defense Secretary Pete Hegseth, whose conduct during the Iran war has triggered impeachment attempts.</p>", "shipping": "<p>Global shipping is facing a volatility crisis as geopolitical conflict transforms the world's most vital maritime chokepoints into war zones.</p><p><strong>Why it matters:</strong> Attacks in the Strait of Hormuz and the Black Sea are forcing a massive redirection of global trade. This shift increases operational costs, spikes insurance premiums, and threatens global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has targeted 24 vessels in two weeks using limpet mines and speedboats.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route; Russia is diverting grain to the Arctic to bypass combat.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades of Iranian ports have led to direct kinetic engagements with commercial tankers.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East.</li><li><strong>$200:</strong> Potential price per barrel of oil if tanker shortages create a critical bottleneck.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM, signaling a shift toward capacity dominance.</li><li><strong>Shadow fleets:</strong> Russia is using coordinated GPS spoofing to hide tanker locations and evade sanctions.</li><li><strong>Infrastructure shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe, driven by a surge in Chinese EV imports.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> The Baltic Exchange faces a court challenge from Mercuria over the validity of price estimates in war zones.</li><li><strong>Political friction:</strong> U.S. state governors may block Russian diesel shipments, pitting local policy against federal energy gambits.</li></ul>", "artificial intelligence": "<p>The AI industry is facing a leadership crisis at its epicenter following the sudden ousting of Nvidia CEO Jensen Huang.</p><p><strong>Why it matters:</strong> Nvidia is the primary engine of the AI boom. Huang's departure—triggered by scandals involving an affair and alleged ties to a Chinese spy—threatens the stability of the global chip supply chain and US-China diplomatic relations.</p><p><strong>The fallout</strong></p><ul><li><strong>Market Volatility:</strong> Shares dipped initially but recovered as investors bet on the underlying AI demand rather than a single leader.</li><li><strong>Governance Shift:</strong> The exit marks a failure of \"founder mode,\" signaling a move toward stricter corporate oversight for Big Tech leaders.</li><li><strong>Geopolitical Risk:</strong> Washington officials view the scandal as a security breach, potentially deepening the technological rift with Beijing.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>1:</strong> The number of companies (Nvidia) whose leadership vacuum could disrupt the entire AI financial ecosystem.</li><li><strong>8:</strong> The number of legal-tech startups currently fighting for market share as buyers hit \"tool fatigue.\"</li></ul><p><strong>Between the lines</strong> The AI boom is shifting from a phase of pure hype to one of structural strain. Debt markets are struggling to absorb the massive capital requirements for data centers, while European economies are only beginning to show measurable AI integration.</p><p><strong>What's next</strong></p><ul><li><strong>Nvidia Transition:</strong> New leadership under Harvey Jones and Colette Kress must stabilize internal operations and restore trust with US regulators.</li><li><strong>Funding Crunch:</strong> The industry must find new financing avenues as traditional bond markets \"choke\" on AI-related debt.</li></ul>", "us-china relations": "<p>US-China relations are shifting from strategic competition to a volatile era of unpredictability.</p><p><strong>Why it matters:</strong> Political instability in Washington and aggressive posturing in Beijing are eroding the global security architecture. This vacuum encourages \"middle powers\" to hedge their bets and revisionist states to challenge the established order.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership deficit:</strong> Both Trump and Xi are viewed as transactional leaders lacking the far-sightedness required to prevent systemic conflict.</li><li><strong>US Retrenchment:</strong> Perceived American withdrawal from global leadership creates power vacuums in the Middle East and Europe, offering China opportunities to expand its influence.</li><li><strong>The \"Middle Power\" pivot:</strong> Countries like Australia are urging other mid-sized economies to diversify supply chains to avoid becoming hostages to the US-China geopolitical struggle.</li></ul><p><strong>The ripple effects</strong></p><ul><li><strong>BRICS Unity:</strong> Shared grievances over US sanctions and tariffs are driving rare consensus among historically fractious BRICS nations.</li><li><strong>Global Instability:</strong> The intersection of the Ukraine conflict and US-China tensions increases the risk of a broader global conflagration.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tactical engagement:</strong> Expect more high-level summits that prioritize short-term stability over long-term détente.</li><li><strong>Economic decoupling:</strong> Continued pressure on supply chains as nations prioritize \"economic security\" over efficiency.</li></ul>", "us elections": "<p>Democrats secured a sweeping victory in the U.S. midterm elections, shifting the balance of power in Washington.</p><p><strong>Why it matters:</strong> High inflation and cost-of-living pressures alienated voters, while a surge in union-backed candidates and historic turnout in conservative strongholds broke Republican holds.</p><p><strong>The big wins</strong></p><ul><li><strong>Historic shift:</strong> Democrat Scott Colom became the first Black senator from Mississippi since 1881.</li><li><strong>Labor resurgence:</strong> Union-backed candidates reclaimed key Democratic heartlands.</li><li><strong>Centrist surge:</strong> Despite \"radical left\" narratives, moderate Democrats dominate the new congressional majority.</li></ul><p><strong>Inside the GOP</strong></p><ul><li><strong>Leadership:</strong> Jim Jordan was named House minority leader, signaling a commitment to an uncompromising party line.</li><li><strong>Internal rift:</strong> The party faces a struggle between \"America First\" loyalists and pragmatists.</li><li><strong>Trump's pivot:</strong> President Trump conceded that harsh immigration policies and poor economic messaging deterred voters.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Pocketbook politics:</strong> Voters prioritized affordability over ideological battles or concerns regarding election subversion.</li><li><strong>Judicial stability:</strong> Strong court rulings on electoral integrity ensured a peaceful transition of power.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Democratic infighting:</strong> Chris Van Hollen is challenging Chuck Schumer for Senate leadership.</li><li><strong>Legal scrutiny:</strong> Democrats plan investigations into the Trump family's ties to the crypto industry.</li><li><strong>Policy shift:</strong> The new majority must now pivot from campaigning to addressing the cost-of-living crisis to maintain momentum for 2028.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting a multi-front war to stabilize Germany's domestic authority and international standing.</p><p><strong>Why it matters:</strong> Internal coalition fractures and the rise of the far-right AfD are paralyzing critical economic reforms and weakening Germany's leverage within the EU.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Political instability:</strong> The resignation of Labour Minister Bärbel Bas stalls pension and market reforms.</li><li><strong>Far-right surge:</strong> The AfD is infiltrating regional governments, securing its first regional parliament president via secret cross-party support.</li><li><strong>Economic friction:</strong> Merz is clashing with regional governments over property seizures and facing warnings from economic experts to curb defense borrowing to avoid a debt-to-GDP ratio of 98% by 2040.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Intelligence overhaul:</strong> Spy agencies are gaining sweeping new powers for \"disruptive operations\" amid warnings of intense Russian espionage and iPhone hacks targeting officials.</li><li><strong>Military pivot:</strong> The appointment of Christian Freuding as armed forces chief signals a transformation toward active readiness.</li><li><strong>Diplomatic tension:</strong> France is demanding clarity on Germany's \"deep precision strike\" capabilities to mitigate Russian nuclear retaliation risks.</li></ul><p><strong>The EU leverage play</strong></p><ul><li><strong>Ukraine ultimatum:</strong> Merz is threatening to block the EU's next budget unless the bloc unanimously agrees on more funding for Kyiv.</li><li><strong>Diminishing power:</strong> Poor regional election results have hobbled Merz's authority in Brussels, casting doubt on a €2tn budget deal.</li></ul><p><strong>What's next:</strong> Watch for the March presidential transition as Ilse Aigner takes office, and monitor whether Hendrik Wüst emerges as a viable alternative to the struggling Merz.</p>", "central banks": "<p>Central banks are struggling to balance stubborn inflation against growing financial instability.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing policymakers to maintain high rates, but shifting mortgage markets and bond volatility are making monetary policy less predictable.</p><p><strong>The state of play</strong></p><ul><li><strong>The Fed:</strong> Holding rates steady but signaling a \"tightening path\" as US growth and PCE inflation remain hot.</li><li><strong>Bank of England:</strong> Raising rates to 4% to combat slipping inflation control and entrenched price pressures.</li><li><strong>ECB:</strong> Maintaining a tightening course as core inflation stays well above the 2% target.</li></ul><p><strong>Leadership transition</strong> Christine Lagarde is stepping down early as ECB president. The race for her successor focuses on two \"pragmatists\":</p><ul><li><strong>Klaas Knot:</strong> Open to inventing new tools to fight future debt crises.</li><li><strong>Pablo Hernández de Cos:</strong> A frontrunner focused on stability during bond market turbulence.</li></ul><p><strong>Between the lines</strong> The traditional \"script\" for rate cuts is failing. Central banks are facing a \"tectonic shift\" where old tools—like interest rate hikes—may have different effects on modern mortgage markets, potentially requiring faster, deeper cuts in the future to avoid crashes.</p><p><strong>What's next</strong></p><ul><li><strong>Fed Schedule:</strong> A shift to seven policy meetings per year starting in 2027.</li><li><strong>ECB Succession:</strong> Brussels is enforcing a tight deadline for nominations to ensure a smooth leadership transition.</li><li><strong>Policy Pivot:</strong> Watch for 50bp moves from the Fed if US inflation fails to decelerate.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit flight to higher-yielding accounts, while regulatory fines for money laundering are eating into net profits.</p><p><strong>The AI paradox</strong></p><ul><li><strong>The Risk:</strong> Lenders are restricting AI agents from account access to prevent automated shifts of billions in deposits.</li><li><strong>The Reward:</strong> Goldman Sachs is already profiting from AI-focused clients, earning $200 million in fees from one AI-driven hedge fund.</li><li><strong>The Oversight:</strong> Regulators are exploring AI to identify the cultural risks that led to the SVB collapse.</li></ul><p><strong>Talent and Leadership</strong></p><ul><li><strong>Goldman Sachs:</strong> Elevating a record number of engineers to partner and issuing $500 million in executive bonuses to lock in top talent.</li><li><strong>Citi:</strong> Shortening the junior analyst program to two years to prevent poaching by private equity firms.</li><li><strong>Evercore:</strong> Implementing a new co-president structure to manage leadership succession.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li><li><strong>17%:</strong> The drop in Bank of America's profits following a $1.2 billion money laundering fine.</li><li><strong>$350 million:</strong> The fine levied against Amex for systemic failures in reporting $13 billion in suspicious transactions.</li><li><strong>$7 billion:</strong> Deposits surged into Erebor, a tech-focused startup filling the SVB void.</li></ul><p><strong>Between the lines</strong> The \"cash cow\" of current trading profits is not based on bank bets, but on a trillion-dollar borrowing spree by hedge funds. This makes bank earnings highly sensitive to external market volatility rather than internal strategy.</p><p><strong>What's next</strong></p><ul><li><strong>China Expansion:</strong> Citi will scale its securities business following long-awaited approval.</li><li><strong>Earnings Shift:</strong> Analysts expect a sharp slowdown in trading revenue growth following a record-breaking start to the year.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>13 Nov 2026 17:59 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
