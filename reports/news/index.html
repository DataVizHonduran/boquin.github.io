const SUMMARIES = {"oil and gas": "<p>Global oil markets are hitting a critical inflection point as geopolitical conflict in Iran clashes with weakening demand.</p><p><strong>Why it matters:</strong> Supply chain disruptions in the Strait of Hormuz are draining US inventories to 20-year lows, while simultaneous demand drops in Europe and China prevent a total price spike.</p><p><strong>The supply squeeze</strong></p><ul><li><strong>Critical lows:</strong> US oil stocks have fallen to their lowest levels since 2004.</li><li><strong>Infrastructure pivots:</strong> Gulf states and Adnoc are planning pipelines to bypass the Strait of Hormuz to secure exports.</li><li><strong>OPEC+ limits:</strong> Production quota increases are being neutralized by shipping restrictions.</li></ul><p><strong>The demand drag</strong></p><ul><li><strong>Eurozone slump:</strong> Fuel sales have seen their largest year-on-year decline since October 2023.</li><li><strong>China's role:</strong> Near-decade-low oil imports from China are shielding the global market from prices exceeding $100 a barrel.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic volatility:</strong> Trafigura reports record profits ($4.1bn) amid the crisis, signaling high volatility favors traders over consumers.</li><li><strong>Corporate instability:</strong> BP continues to struggle with strategic clarity, exploring the sale of £2bn in North Sea assets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Price jumps:</strong> Industry warns prices will spike if US inventories hit \"critically low\" thresholds.</li><li><strong>Energy transition friction:</strong> Legal battles are intensifying over fossil fuel reinvestment, highlighted by seven US states suing over a $1bn payment to Total.</li></ul>", "corporate earnings and results": "<p>Global markets are oscillating between AI-driven volatility and a surge in strategic corporate consolidation.</p><p><strong>Why it matters:</strong> High valuations in AI are triggering sharp corrections, forcing private equity to pivot toward liquidity and mid-sized firms to acquire growth via M&A.</p><p><strong>The M&A landscape</strong></p><ul><li><strong>Banking:</strong> Intesa Sanpaolo launched a €30.6bn bid for the world's oldest bank to capture cost synergies.</li><li><strong>Biotech:</strong> Incyte signed a $2bn deal for a blood disorder biotech to scale against Big Pharma.</li><li><strong>Consumer Goods:</strong> Ingredion agreed to a £2.7bn takeover of Tate & Lyle, further depleting the FTSE.</li><li><strong>Tech:</strong> Hg-backed Gen II is targeting a $6bn sale in the second half of the year.</li></ul><p><strong>The AI paradox</strong></p><ul><li><strong>Market Volatility:</strong> An AI-led rout rattled global markets, though Wall Street stocks have since rebounded.</li><li><strong>Private Equity Slump:</strong> Software buyout deals dropped to $50bn in the first five months, the lowest level since the pandemic.</li><li><strong>Growth Pockets:</strong> UK start-up PhysicsX reached a $2.4bn valuation following a Temasek-led investment.</li></ul><p><strong>Between the lines</strong> Liquidity is tightening for \"ageing\" private equity vehicles. Blackstone's move to sell $2bn in stakes signals a test of investor appetite for older funds as newer, AI-centric assets dominate the narrative.</p><p><strong>What's next</strong></p><ul><li><strong>SpaceX IPO:</strong> A potential public offering is expected to widen the valuation gap between index constituents and private firms.</li><li><strong>Trade Shifts:</strong> Canada is pitching \"Fortress North America\" to regain leverage in US trade negotiations.</li></ul>", "middle east war": "<p>Israel and Iran have called a halt to military operations following a series of retaliatory strikes that threatened a fragile two-month truce.</p><p><strong>Why it matters:</strong> The volatility underscores the failure of Israel's military-first strategy and creates massive economic instability via energy markets.</p><p><strong>By the numbers</strong></p><ul><li><strong>$100 billion:</strong> Estimated hit to airlines from surging jet fuel costs.</li><li><strong>$140:</strong> Potential price ceiling for Brent crude per barrel.</li><li><strong>172,000:</strong> US jobs added in May, increasing pressure on the Fed to raise rates to combat war-driven inflation.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>US Leverage:</strong> President Trump is asserting direct control over Israeli policy, signaling that Netanyahu has \"no choice\" but to accept a deal with Tehran.</li><li><strong>Economic Fallout:</strong> The conflict has shifted global markets, boosting Italian defense exports while forcing the UK and US to weigh interest rate hikes to counter energy shocks.</li><li><strong>Fragile Peace:</strong> Despite the ceasefire, Hizbollah's initial rejection and ongoing drone activity in the Strait of Hormuz suggest the truce is unstable.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Asset Seizure:</strong> The US is considering using frozen Iranian assets to compensate Gulf allies for war damages.</li><li><strong>Diplomatic Pressure:</strong> Washington will push for a wider regional peace deal to stabilize oil prices and secure transit through the Strait of Hormuz.</li></ul>", "shipping": "<p>The Strait of Hormuz has become a global economic choke point, forcing a massive reconfiguration of energy trade and logistics.</p><p><strong>Why it matters:</strong> Blockages in this strategic waterway spike global oil prices and force nations to pivot to riskier \"shadow fleets\" or alternative fuels like coal.</p><p><strong>The Hormuz Crisis</strong></p><ul><li><strong>Operational deadlock:</strong> US insurance schemes have seen zero uptake because ships lack naval escorts.</li><li><strong>Market volatility:</strong> Brent crude dropped 6% recently after just two supertankers successfully crossed the strait. lines.</li><li><strong>Productivity gap:</strong> Increased work volume is not yet translating into genuine corporate productivity.</li></ul><p><strong>The social backlash</strong></p><ul><li><strong>Labor anxiety:</strong> Hedge funds are betting against call centers; humanoids are entering the shop floor.</li><li><strong>Political response:</strong> Trump and OpenAI are proposing equity stakes for the public to mitigate \"anti-AI populism.\"</li><li><strong>De-skilling:</strong> High-value roles, such as translation, are becoming fragmented and routine.</li></ul><p><strong>Governance risks</strong></p><ul><li><strong>Legal boundaries:</strong> Courts in England and Wales are halting AI use in statements due to a lack of safeguards.</li><li><strong>Personhood debate:</strong> Experts warn against granting AI legal personhood to avoid accountability gaps.</li><li><strong>Security:</strong> The NSA is already integrating AI for cyber attacks, escalating the digital arms race.</li></ul><p><strong>What's next</strong> OpenAI is overhauling ChatGPT to pivot toward higher-margin products ahead of a potential IPO. This shift will determine if AI can move from a costly experiment to a sustainable profit engine.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony characterized by strategic stalemate.</p><p><strong>Why it matters:</strong> Neither power can achieve total dominance, creating a volatile \"might is right\" order that destabilizes global trade and security.</p><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric leverage:</strong> Power now derives from the ability to exploit imbalances rather than raw wealth or military size.</li><li><strong>The leadership vacuum:</strong> Washington is retreating from global responsibilities; Beijing is hesitant to fill the void despite efforts to project stability.</li><li><strong>Strategic alignment:</strong> Russia’s geopolitical missteps have forced a one-sided dependency on China.</li></ul><p><strong>The soft power shift</strong></p><ul><li>Beijing is actively courting foreign officials to portray itself as a pillar of stability.</li><li>China is gaining diplomatic ground as the U.S. burns bridges with traditional allies.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional rethink:</strong> Multilateral governance requires reinvention to prevent a permanent state of global conflict.</li><li><strong>Risk evolution:</strong> Corporations and governments are shifting focus toward resilience and contingency planning over efficiency.</li></ul>", "us elections": "<p>The U.S. electoral landscape is shifting as economic discontent and candidate volatility create openings for Democrats in key swing regions.</p><p><strong>Why it matters:</strong> High inflation and tariff-driven costs are eroding Trump's support among working-class voters and rural industries. Internal GOP friction over \"lawfare\" funding and candidate quality risks flipping Senate seats.</p><p><strong>The Texas Factor</strong></p><ul><li>Trump-backed Ken Paxton won the primary, cementing the president's grip on the MAGA base.</li><li>Democrats view Paxton's polarizing profile as a liability that could alienate moderate voters in November.</li></ul><p><strong>Economic Headwinds</strong></p><ul><li>FT polling shows voters blame the president for high grocery prices and the cost of living.</li><li>In Maine, \"lobster revolts\" over fuel and tariffs are pushing traditional supporters away from the GOP.</li></ul><p><strong>Party Dynamics</strong></p><ul><li><strong>Democrats:</strong> A DNC autopsy blames White House disunity for previous losses, while Pennsylvania primaries signal a shift toward populist, working-class messaging.</li><li><strong>Republicans:</strong> The House blocked further Middle East strikes, signaling a rare legislative check on Trump's foreign policy.</li></ul><p><strong>What's next</strong></p><ul><li>California's primary will serve as a bellwether for the national appetite for MAGA-style politics.</li><li>The 2028 succession battle is already forming, with JD Vance and Marco Rubio emerging as primary contenders.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military leadership while facing severe diplomatic friction with the U.S.</p><p><strong>Why it matters:</strong> Berlin is abandoning its post-WWII pacifist tradition to counter Russian threats, but this rapid rearmament is straining its relationship with Donald Trump and alarming EU partners.</p><p><strong>The defense surge</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit NATO's 3.5% GDP target six years ahead of schedule.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Strategic shift:</strong> Germany published its first formal military strategy since WWII, signaling a move to lead European defense.</li></ul><p><strong>The Trump rift</strong></p><ul><li><strong>The spark:</strong> Chancellor Friedrich Merz criticized U.S. strategy in Iran, calling the U.S. \"humiliated.\"</li><li><strong>The retaliation:</strong> Trump launched a review of U.S. troops in Germany and may pull 5,000 soldiers.</li><li><strong>The fallout:</strong> Merz's attempt to build rapport with Trump has collapsed, forcing a desperate push to secure Tomahawk missile deals.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political volatility:</strong> The far-right AfD is topping polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>Leadership struggle:</strong> Merz faces internal pressure as younger conservative Hendrik Wüst emerges as a potential chancellery alternative.</li><li><strong>Fiscal tension:</strong> The Finance Ministry is threatening to cut funding for ministries that fail to spend a €500bn infrastructure fund.</li></ul><p><strong>What's next:</strong> Watch for the KNDS listing this summer and whether the U.S. troop withdrawal becomes a permanent reality, which would force Germany to accelerate its \"responsibility\" for European security.</p>", "central banks": "<p>Central banks are struggling to balance stubborn inflation against growing systemic risks.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing a shift away from rate cuts, while political volatility and AI-driven instability threaten the traditional \"policy put\" used to stabilize markets.</p><p><strong>The policy pivot</strong></p><ul><li><strong>Fed & BoE:</strong> Strong US payrolls and corporate pricing uncertainty are keeping rate cuts off the table.</li><li><strong>ECB:</strong> Core inflation and energy spillover are driving a push for June rate hikes.</li><li><strong>BoJ:</strong> Bond volatility is forcing tweaks to quantitative tightening and balance sheet reductions.</li></ul><p><strong>The reserve shift</strong></p><ul><li><strong>Diversification:</strong> Gold has replaced US Treasuries as the top reserve asset, now making up 27% of reserves.</li><li><strong>Risk:</strong> US Treasuries are transitioning from a \"haven asset\" to a potential financial chokepoint.</li><li><strong>Innovation:</strong> The Fed and BoE successfully tested blockchain prototypes for near-instant cross-border payments.</li></ul><p><strong>Systemic threats</strong></p><ul><li><strong>Political risk:</strong> Trump’s challenges to central bank independence and volatile trade policies threaten global stability.</li><li><strong>AI risk:</strong> The ECB is summoning banks to address financial system flaws exposed by new AI models.</li><li><strong>Fiscal pressure:</strong> Demographic shifts are increasing fiscal burdens, potentially constraining independent monetary policy.</li></ul><p><strong>What's next:</strong> Markets face a widening disconnect between professional forecasters and money market expectations as new leadership at the Fed considers rolling back forward guidance.</p>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and aggressively pursue global market share.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing US giants to outpace European and Swiss rivals. This shift accelerates a pivot toward retail expansion and high-risk AI infrastructure lending.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan claims is available due to a lighter regulatory approach.</li><li><strong>$114 billion:</strong> Combined revenues of non-bank trading firms (e.g., Jane Street, Citadel) challenging Wall Street.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Shadow\" Threat:</strong> Traditional banks are losing ground to high-frequency trading firms that capitalize on market volatility.</li><li><strong>Risk Migration:</strong> Banks are actively offloading private equity-linked loans and data center debt to avoid overexposure to the AI boom.</li><li><strong>Geopolitical Friction:</strong> Security concerns in China are forcing operational changes, such as Morgan Stanley issuing China-only iPhones to staff.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail Push:</strong> JPMorgan is scaling its digital \"Chase\" brand into Germany and other European markets.</li><li><strong>Strategic Partnerships:</strong> Citi is partnering with BlackRock to scale private lending in Europe and the Middle East.</li><li><strong>Product Evolution:</strong> Morgan Stanley is integrating spot crypto trading into E*Trade to capture retail digital asset flows.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>08 Jun 2026 14:37 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
