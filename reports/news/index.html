.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

rvices.</li></ul>", "middle east war": "<p>Regional instability is driving a high-stakes diplomatic and economic standoff between Iran, Israel, and the U.S.</p><p><strong>Why it matters:</strong> Escalation risks are triggering immediate global shocks, from spiking energy costs to disrupted shipping lanes, while internal Israeli political volatility threatens to accelerate military aggression.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>Iran's strategy:</strong> Tehran is hosting regional powers (Saudi Arabia, Pakistan, Turkey) to prevent escalation, even as U.S. intelligence warns of advanced plots to kill Americans.</li><li><strong>U.S. posture:</strong> The U.S. is preparing for a \"protracted stalemate,\" demanding a meaningful nuclear agreement from Tehran.</li><li><strong>Saudi instability:</strong> Riyadh is mending ties with the UAE to counter Houthi rebel attacks, which have already forced the U.S. to evacuate some personnel from the kingdom.</li></ul><p><strong>The Israeli pivot</strong></p><ul><li><strong>Election stakes:</strong> A knife-edge race between Benjamin Netanyahu and centrist challenger Gadi Eisenkot will determine if Israel pursues a \"destructive path\" of escalation or a diplomatic shift.</li><li><strong>Internal rift:</strong> While Sderot residents remain loyal to Netanyahu, tens of thousands of Israelis are returning from abroad specifically to vote him out.</li><li><strong>Economic risk:</strong> The Israeli central bank has blocked Netanyahu's proposal to use cryptocurrency to evade potential sanctions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$117:</strong> The price of oil, hitting a peak since April due to Iran hostilities.</li><li><strong>36%:</strong> Turkey's new benchmark interest rate following a cut despite investment scandals.</li><li><strong>0.1 percentage points:</strong> The drop in French 10-year bond yields after avoiding a credit downgrade.</li></ul><p><strong>What's next:</ i></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative tool to a systemic force, triggering a collision between rapid commercialization and institutional instability.</p><p><strong>Why it matters:</strong> The shift toward autonomous \"agents\" is disrupting labor markets and regulatory frameworks faster than governments can adapt. This creates a widening gap in access and a surge in security risks.</p><p><strong>The economic friction</strong></p><ul><li><strong>Valuation shifts:</strong> OpenAI trimmed its valuation target to $1.25tn, signaling a potential cooling in peak hype.</li><li><strong>Labor disruption:</strong> Anthropic is hiring fewer junior staff as AI agents automate entry-level tasks.</li><li><strong>Investment barriers:</strong> In Argentina, economic instability is stalling AI projects despite strong energy and software foundations.</li></ul><p><strong>The security paradox</strong></p><ul><li><strong>Biosecurity:</strong> The UK launched a dedicated AI lab to prevent the creation of synthetic viruses and bioweapons.</li><li><strong>Sovereignty:</strong> Former NSO Group leadership is pushing \"sovereign AI\" to reduce national reliance on U.S. tech.</li><li><strong>Accountability:</strong> Experts are calling for \"Know Your Agent\" rules to establish legal liability for autonomous software.</li></ul><p><strong>The social divide</strong></p><ul><li><strong>Education:</strong> Students in key political battlegrounds report rising anxiety over job displacement.</li><li><strong>Agriculture:</strong> Lack of safeguards threatens to widen the wealth gap between tech-enabled and traditional farmers.</li><li><strong>Financial literacy:</strong> 40% of UK youth are bypassing traditional advisors to seek financial guidance from chatbots.</li></ul><p><strong>What's next:</strong> Regulators will move away from banking-style oversight toward a bespoke AI model focused on real-time behavioral control and biosecurity monitoring.</p>", "us-china relations": "<p>US-China relations have shifted from mutual economic gain to a zero-sum geopolitical struggle.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" cooperation increases the risk of global instability. Competition now drives trade barriers, security alliances, and a race for systemic dominance.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in both Washington and Beijing is viewed as short-sighted, prioritizing domestic optics over long-term global stability.</li><li><strong>The BRICS factor:</strong> US tariffs and sanctions are pushing the BRICS bloc toward rare unity, creating an alternative economic center of gravity.</li><li><strong>Strategic fragility:</strong> Diplomatic summits are now tactical tools to manage crisis rather than paths toward genuine détente.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>GDP Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li><strong>Risk Profile:</strong> Rising regional conflicts and \"revisionist\" power plays are increasing the probability of a direct great-power confrontation.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Economic decoupling:</strong> Expect further fragmentation of supply chains as both nations prioritize security over efficiency.</li><li><strong>Third-party leverage:</strong> Smaller powers are increasingly thwarting the agendas of the two superpowers to protect their own sovereignty.</li></ul>", "us elections": "<p>Democrats hold a polling advantage as the U.S. midterms approach, despite a massive Republican spending lead.</p><p><strong>Why it matters:</strong> Control of the Senate will determine the legislative viability of Donald Trump’s second-term agenda. A Democratic sweep would block key policy pledges and military spending boosts.</p><p><strong>By the numbers</strong></p><ul><li><strong>$400 million:</strong> Trump's pledged contribution to GOP midterm campaigns.</li><li><strong>$80 million:</strong> Mike Bloomberg's donation to Democratic candidates.</li><li><strong>$500 billion:</strong> The proposed military spending boost currently at risk due to market bets on a Democratic win.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Vulnerability:</strong> Public skepticism of RFK Jr.’s vaccine stances and concerns over government corruption are creating openings for Democrats.</li><li><strong>Legal warfare:</strong> Both parties are mobilizing armies of lawyers to challenge certifications, specifically in tight races like Alaska.</li><li><strong>Economic anxiety:</strong> Voters in battlegrounds like Pennsylvania link government graft to the affordability crisis.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Certification battles:</strong> Expect legal challenges to Alaska's Senate results based on candidate name similarities.</li><li><strong>Diplomatic shifts:</strong> Trump envoys will meet with Volodymyr Zelenskyy in Norway to reshape Ukraine strategy.</li><li><strong>Wildcards:</strong> The performance of historic candidates, such as Abdul El-Sayed in Michigan, could shift the Senate balance.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz’s diminished domestic authority weakens Germany's leverage in EU budget negotiations and stalls critical pension and labor reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Electoral collapse:</strong> The CDU suffered disastrous losses in eastern regional elections, specifically in Mecklenburg-Vorpommern.</li><li><strong>Coalition instability:</strong> The resignation of the labor minister signals deepening strains within the governing alliance.</li><li><strong>Right-wing infiltration:</strong> Allegations that CDU lawmakers traded votes rong> Banks are now demanding lower legal fees from law firms, arguing AI has reduced the man-hours required for routine work.</li></ul><p><strong>Regulatory & Structural Headwinds</strong></p><ul><li><strong>Fines:</strong> BofA profits dropped 17% following a $1.2B money laundering fine; Amex was fined $350M for systemic reporting failures.</li><li><strong>Talent War:</strong> Citi is shortening junior analyst programs to two years to prevent poaching by private equity firms.</li><li><strong>Geopolitics:</strong> Citi secured long-awaited approval for its China securities business ahead of a Trump-Xi meeting.</li></ul><p><strong>Between the lines:</strong> The SVB collapse continues to reshape the landscape, creating a vacuum for tech-focused challengers like Erebor, which has already surged to $7B in deposits.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>26 Oct 2026 16:56 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
