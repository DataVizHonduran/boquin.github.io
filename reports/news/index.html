const SUMMARIES = {"oil and gas": "<p>Global fuel supplies are tightening as geopolitical conflict disrupts refining capacity.</p><p><strong>Why it matters:</strong> Ukrainian drone strikes on Russian refineries and instability in the Gulf are creating a diesel and petrol crunch. High global consumption is exacerbating the shortage, driving up consumer costs while boosting profits for U.S. oil majors.</p><p><strong>The supply squeeze</strong></p><ul><li><strong>Russia:</strong> Export bans on diesel follow successful Ukrainian attacks on energy infrastructure.</li><li><strong>Gulf:</strong> War-related disruptions are limiting refinery output.</li><li><strong>China:</strong> Increasing oil purchases from the Middle East to hedge against volatility.</li></ul><p><strong>The AI energy pivot</strong></p><ul><li><strong>Infrastructure:</strong> Surging AI data center demand is straining transformer supply chains and power grids.</li><li><strong>Investment:</strong> Private equity is seeing massive returns on power units (e.g., Carlyle's $2.6bn sale to EQT) to support AI hubs.</li><li><strong>Innovation:</strong> Increased funding for fusion (Proxima Fusion) and off-grid renewables to bypass grid constraints.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Arctic Exploration:</strong> The IEA is urging the EU to reconsider its ban on Arctic oil and gas to ensure energy security.</li><li><strong>Diversification:</strong> Adnoc is expanding its global footprint, recently acquiring Shell’s South African fuels business for $1bn.</li><li><strong>Transition:</strong> Data suggests a trend of \"energy addition\" rather than \"transition,\" as renewables grow alongside traditional fossil fuel use.</li></ul>", "corporate earnings and results": "<p>Rising fuel costs are eroding corporate profit margins despite record consumer demand.</p><p><strong>Why it matters:</strong> Delta's earnings serve as a bellwether for U.S. corporations. Geopolitical instability in Iran is driving direct input costs higher, offsetting volume gains.</p><p><strong>By the numbers:</strong></p><ul><li><strong>77%:</strong> Increase in jet fuel costs compared to last year.</li><li><strong>$26.5B:</strong> Amount raised by SK Hynix in the largest-ever U.S. IPO by a foreign firm.</li><li><strong>£5.7B:</strong> Apollo's winning bid to take EasyJet private.</li><li><strong>€3B:</strong> Value of Bayer's stake sale in its contraceptives business to Apollo.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Capital reallocation:</strong> Apollo is aggressively deploying capital across sectors, from aviation to pharmaceuticals.</li><li><strong>Balance sheet repair:</strong> Bayer is liquidating assets to cover litigation costs related to Roundup.</li><li><strong>Market volatility:</strong> The SK Hynix IPO signals high appetite for AI-linked memory chips, though some analysts warn of an overheated market.</li></ul><p><strong>What's next:</strong> Investors will monitor if fuel price spikes trigger broader inflationary pressure across the U.S. transport and logistics sectors.</p>", "middle east war": "<p>The U.S. and Iran have entered a volatile cycle of tit-for-tat strikes following attacks on tankers in the Strait of Hormuz.</p><p><strong>Why it matters:</strong> Escalation threatens the primary artery of global oil transit, risking a systemic shock to the global economy and energy prices.</p><p><strong>The current flashpoints</strong></p><ul><li><strong>Military:</strong> The U.S. targeted Iranian railway bridges; Trump warned attacks will \"get much worse\" if shipping disruptions continue.</li><li><strong>Economic:</strong> Washington revoked waivers for Iranian oil sales, while oil prices rose in response to heightened conflict.</li><li><strong>Political:</strong> Iran is navigating a leadership transition following the burial of Supreme Leader Khamenei, with son Mojtaba assuming power.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>C$70 billion:</strong> The UAE investment Canada is currently unable to absorb due to a lack of \"shovel-ready\" projects.</li><li><strong>Zero:</strong> The number of viable land-based alternatives to the Strait of Hormuz for large-scale shipping, according to Kuehne+Nagel.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic confusion:</strong> Tehran views U.S. moves as inconsistent, while Washington is struggling to force Iranian concessions on maritime security.</li><li><strong>Regional fractures:</strong> Economic tension is surfacing between Gulf allies, evidenced by Saudi Arabia blocking payments to UAE accounts.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic collapse:</strong> Trump has signaled that previous ceasefire negotiations are likely \"over.\"</li><li><strong>Power projection:</strong> Iran will use the late leader's funeral procession through Iraq to signal the resilience of its \"axis of influence.\"</li></ul>", "shipping": "<p>Global shipping is currently defined by geopolitical volatility and a race to hedge against new U.S. trade tariffs.</p><p><strong>Why it matters:</strong> Conflict in the Strait of Hormuz and the Red Sea is destabilizing primary trade arteries, while looming tariffs are triggering artificial demand spikes and surging freight costs.</p><p><strong>The Geopolitical Friction</strong></p><ul><li><strong>Strait of Hormuz:</strong> A fragile ceasefire has quadrupled transits, but \"unknown projectiles\" and Iranian demands for state-approved insurance keep risk high.</li><li><strong>Shadow Fleets:</strong> Russia is utilizing \"shadow tankers\" to bypass G7 price caps, forcing vessels to avoid the English Channel to evade European naval interceptions.</li><li><strong>Ukraine Strategy:</strong> Kyiv is intensifying attacks on Russian fuel tankers in the Azov Sea, arguing these strikes are legal under international law.</li></ul><p><strong>The Economic Shift</strong></p><ul><li><strong>Tariff Rush:</strong> Freight rates have hit their highest levels since the 2024 Red Sea crisis as U.S. companies stockpile goods to beat upcoming tariffs.</li><li><strong>Consolidation:</strong> CMA CGM is spending $1.4B to acquire FedEx's logistics unit to deepen its U.S. supply chain footprint.</li><li><strong>EU Regulation:</strong> Brussels is closing loopholes on carbon fees, increasing costs for shipowners and risking trade partner tensions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$125B:</strong> Value of goods stranded during the Hormuz blockade.</li><li><strong>$4B:</strong> Revenue Greek shipping firms earned transporting Russian oil over three years.</li><li><strong>1,200:</strong> Number of cargo ships stranded during the peak Hormuz closure.</li><li><strong>7%:</strong> Drop in Maersk shares after resuming Suez Canal transits, signaling a potential dip in freight rates.</li></ul><p><strong>Between the lines</strong> The industry is fracturing over sustainability. As \"green\" hopes fade, shipowners are splitting into camps backing nuclear power versus \"dirty\" fossil fuels.</p>", "artificial intelligence": "<p>AI is transitioning from a speculative gold rush to a high-stakes operational test.</p><p><strong>Why it matters:</strong> Massive capital expenditures are outpacing immediate returns, forcing a shift from hype to tangible utility in regulation, retail, and hardware.</p><p><strong>The financial friction</strong></p><ul><li><strong>Capex pressure:</strong> Microsoft and Samsung face investor skepticism as spending skyrockets despite record profits or early leads.</li><li><strong>Market limits:</strong> AI \"superforecasters\" currently fail to outperform human traders in predicting Federal Reserve decisions.</li><li><strong>High stakes:</strong> SoftBank is pivoting its entire portfolio toward an \"all-in\" AI bet.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Regulatory utility:</strong> Agencies are deploying AI to eliminate \"sludge\" (administrative red tape).</li><li><strong>Hardware expansion:</strong> Meta is integrating AI into \"super sensing\" glasses, triggering new privacy conflicts.</li><li><strong>Geopolitical shifts:</strong> Beijing is forcing the reversal of U.S. acquisitions, as seen in the Tencent-Manus deal.</li></ul><p><strong>Critical risks</strong></p><ul><li><strong>Cybersecurity:</strong> The ECB warns that frontier models could exploit banking IT weaknesses in minutes.</li><li><strong>Social engineering:</strong> Biased LLMs and deepfakes are moving beyond misinformation toward active emotional manipulation.</li><li><strong>Political blowback:</strong> Palantir faces business risks as its political alignment draws increased pushback.</li></ul><p><strong>What's next:</strong> Expect a \"reset\" phase where companies cut legacy costs—such as Microsoft's Xbox layoffs—to fund the expensive infrastructure required for the next generation of AI agents.</p>", "us-china relations": "<p>The U.S. and China are accelerating a shift toward a \"might is right\" global order defined by military brinkmanship and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of multilateral norms increases the risk of direct conflict. As the U.S. faces internal instability and a pivot toward non-alignment, China is positioning itself as a stable alternative for global leadership.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China recently fired a submarine-launched ballistic missile into a Pacific nuclear-free zone, signaling increased naval aggression.</li><li>  <strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, evidenced by the detention of Japanese nationals for rare earth smuggling.</li><li>  <strong>Trade volatility:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten global economic stability.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>U.S. instability:</strong> Internal political volatility and a move toward isolationism are weakening U.S. hegemony and straining NATO alliances.</li><li>  <strong>China's strategy:</strong> Beijing is utilizing a \"tribute system\" approach—attracting foreign officials to portray itself as a pillar of stability without resorting to open war.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance reshuffling:</strong> Middle powers (like Japan and Germany) are aggressively seeking new capabilities and security deals to hedge against great power volatility.</li><li>  <strong>Maritime tension:</strong> Competition will intensify over \"narrow seas\" and vulnerable waterways as nations prioritize secure supply chains over open trade.</li></ul>", "us elections": "<p>The Democratic and Republican parties are facing internal volatility and external economic pressure ahead of the US midterms.</p><p><strong>Why it matters:</strong> Internal fractures and candidate scandals are creating vulnerabilities in key swing states, while voter dissatisfaction with inflation and foreign policy threatens incumbent stability.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive surge:</strong> Democratic socialists won key primaries in Colorado and New York, signaling a shift away from party establishment leadership.</li><li><strong>Candidate crisis:</strong> The Maine Senate bid is in turmoil after populist candidate Graham Platner quit following rape allegations.</li><li><strong>Corporate influence:</strong> Big Tech lobbyists successfully targeted and defeated pro-regulation candidate Alex Bores in a tight House primary.</li></ul><p><strong>The Trump vulnerability</strong></p><ul><li><strong>Economic drag:</strong> FT polling shows voters blame Trump for soaring grocery prices and inflation.</li><li><strong>Foreign policy:</strong> Public disapproval of the Iran war is dragging down approval ratings; the House recently voted to limit the president's war powers.</li><li><strong>Base erosion:</strong> Evangelical voters are questioning if Trump's rhetoric aligns with Christian values, while Maine fishermen are revolting over tariffs.</li></ul><p><strong>Key battlegrounds</strong></p><ul><li><strong>Texas:</strong> The victory of Trump-backed Ken Paxton secures the MAGA base but may alienate moderate voters, giving Democrats a perceived opening in the Senate race.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor, serving as a litmus test for MAGA's appeal in the West.</li></ul><p><strong>What's next:</strong> Watch for the DoJ probe into Gavin Newsom, which could reshape the 2028 presidential field.</p>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to address security gaps and stagnant growth, risking internal political instability and friction with EU allies.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Germany will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> Berlin is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> France fears Germany is \"going it alone\" after Berlin ditched French cooperation on a fighter jet project.</li><li><strong>Failures:</strong> Cost overruns led to the cancellation of the F126 frigate, the largest warship since WWII.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts and pushed for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Labor:</strong> The coalition agreed to tighter sick-leave rules and expanded Sunday opening hours.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political volatility</strong></p><ul><li><strong>The Far-Right:</strong> The AfD leads opinion polls, fueled by fuel price anger and ties to Kremlin associates.</li><li><strong>Internal Rivalry:</strong> Merz faces a \"chancellor swap\" threat from younger conservative Hendrik Wüst as polls slide.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's decision on the Strait of Hormuz mission and the outcome of the KNDS IPO.</p>", "central banks": "<p>Central banks are shifting toward structural reform and divergent monetary paths to combat persistent inflation and AI-driven volatility.</p><p><strong>Why it matters:</strong> Divergent policies across the G7 increase fragmentation risks, while new leadership at the Fed is prioritizing communication overhauls to reduce market surprises.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is aggressively restructuring the U.S. central bank:</p><ul><li><strong>Reform:</strong> Established five task forces led by business and academic leaders to modernize operations.</li><li><strong>Communication:</strong> Moving away from traditional \"forward guidance\" to a more fundamental, though currently more volatile, style of \"Fedspeak.\"</li><li><strong>Independence:</strong> Vowed to maintain price stability despite political pressure from the White House.</li></ul><p><strong>Global divergence</strong> Central banks are no longer moving in lockstep:</p><ul><li><strong>New Zealand:</strong> Raising rates for the first time in three years to fight stubborn inflation.</li><li><strong>Japan:</strong> Pushing domestic pension funds to shift assets from foreign to domestic markets to support the Yen.</li><li><strong>Eurozone:</strong> ECB President Lagarde signals a shift toward \"modest\" rate increases rather than the aggressive force used in 2022.</li></ul><p><strong>New systemic risks</strong> Regulators are pivoting toward technology and leverage:</p><ul><li><strong>AI Volatility:</strong> The Bank of England is considering \"kill switches\" for AI-powered trading to prevent herding behavior.</li><li><strong>Leverage:</strong> The BoE is limiting hedge fund leverage to stabilize the gilt market.</li><li><strong>Private Shift:</strong> Sovereign wealth funds are exiting public markets for private credit to capture AI growth.</li></ul><p><strong>What's next:</strong> Markets will watch for whether Warsh's \"hawkish\" leanings actually trigger U.S. rate hikes or if the Fed remains on hold while the ECB and BoJ move upward.</p>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and pursue aggressive growth.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing lenders to pivot toward international retail expansion and high-stakes acquisitions.</p><p><strong>The bottom line</strong></p><ul><li><strong>Capital windfall:</strong> Deregulation has handed top US and UK banks $1.3 trillion in capacity.</li><li><strong>JPMorgan's play:</strong> CEO Jamie Dimon indicates the bank could spend $20 billion on new acquisitions, citing $50 billion in excess capital.</li><li><strong>Global pivot:</strong> JPMorgan is expanding its digital retail presence into France, Spain, and Italy.</li></ul><p><strong>Internal turbulence</strong></p><ul><li><strong>Succession chaos:</strong> Jamie Dimon has upended the JPMorgan CEO race, removing longtime contender Marianne Lake.</li><li><strong>Talent wars:</strong> Boutique firms (Evercore, Lazard, Moelis) are struggling with high overhead after hiring \"star\" bankers during a dealmaking lull.</li><li><strong>Compliance friction:</strong> Goldman Sachs is restricting employee use of prediction markets like Polymarket to avoid regulatory breaches.</li></ul><p><strong>Risk factors</strong></p><ul><li><strong>Market competition:</strong> Non-bank trading firms (Citadel, Jane Street) hit $114 billion in revenue, eating into traditional Wall Street margins.</li><li><strong>Systemic fragility:</strong> Fed stress tests show US banks would lose $700 billion in a severe economic crash.</li><li><strong>Credit exposure:</strong> JPMorgan is seeking to offload $4 billion in private equity-linked loans as the sector slows.</li></ul><p><strong>What's next:</strong> Watch for a surge in M&A activity as US banks use their regulatory advantage to outpace constrained EU and Swiss rivals.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>10 Jul 2026 12:41 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
