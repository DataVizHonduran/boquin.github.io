const SUMMARIES = {"oil and gas": "<p>Brent crude has fallen below pre-war levels as Gulf oil flows resume.</p><p><strong>Why it matters:</strong> Lower prices reduce immediate inflationary pressure but signal a shift in geopolitical risk premiums. Simultaneously, the surge in AI data center demand is forcing a pragmatic return to fossil fuels in the U.S. and U.K.</p><p><strong>By the numbers</strong></p><ul><li><strong>$72.48:</strong> The Brent crude price threshold breached as markets stabilize.</li><li><strong>400+:</strong> Ships waiting near the Strait of Hormuz for full reopening.</li><li><strong>20 years:</strong> The duration of Chevron’s deal with Microsoft to power AI data centers.</li><li><strong>$1.9B:</strong> US Energy Fuels' acquisition of a German magnet group to cut China dependency.</li></ul><p><strong>Between the lines</strong></p><ul><li>AI power requirements are overriding climate goals. New York is weakening its opposition to fossil fuels to prevent electricity shortages.</li><li>China is leveraging green tech spending to supplant the EU's carbon pricing model as the primary global climate driver.</li></ul><p><strong>What's next</strong></p><ul><li>EU energy ministers will debate methane rules that the U.S. and Qatar warn could trigger a gas supply crunch.</li><li>The U.K. faces a policy pivot toward oil and gas exploration following Conservative gains in Scotland.</li></ul>", "corporate earnings and results": "<p>Micron’s profit surge is driving a rebound in global AI stocks.</p><p><strong>Why it matters:</strong> Strong chip earnings validate sustained demand for AI hardware, calming investor fears following a recent market sell-off.</p><p><strong>By the numbers</strong></p><ul><li><strong>15x:</strong> The increase in Micron's quarterly profit.</li><li><strong>$11.3 billion:</strong> Merck’s acquisition of Bio-Techne, its largest deal in a decade.</li><li><strong>14%:</strong> Withdrawal requests hitting Ares' flagship private credit fund.</li><li><strong>£4.9 billion:</strong> The rejected takeover bid for EasyJet.</li></ul><p><strong>Between the lines</strong></p><ul><li>Hardware is leading the AI rally, but corporate adoption of AI software remains stalled by organizational barriers and accuracy issues.</li><li>Retail investor exits are accelerating across the private credit industry.</li></ul><p><strong>What's next</strong></p><ul><li>Debt investors will scrutinize SpaceX's upcoming bond sale to determine if tech valuations have entered bubble territory.</li><li>Biotech M&A will shift toward early-stage assets as firms look beyond patent cliffs.</li></ul>", "middle east war": "<p>The U.S. and Iran are negotiating in Switzerland to end a four-month conflict and reopen the Strait of Hormuz.</p><p><strong>Why it matters:</strong> A resolution is critical to stabilizing global maritime trade and preventing a permanent cycle of regional war.</p><p><strong>By the numbers</strong></p><ul><li><strong>$125 billion:</strong> Value of goods stranded by the Hormuz blockade.</li><li><strong>1,200:</strong> Cargo ships caught in the closure.</li><li><strong>$6 billion:</strong> Frozen funds Trump may release for U.S. medical and agricultural goods.</li><li><strong>500:</strong> U.S. aircraft deployed from Italian bases during Operation Epic Fury.</li></ul><p><strong>Between the lines</strong></p><ul><li>Netanyahu’s military objectives have translated into a domestic political liability.</li><li>The Senate's war powers resolution signals deep legislative anxiety over executive war-making.</li><li>Stalled subsea cable projects are deterring long-term AI and cloud investment in the region.</li></ul><p><strong>What's next</strong></p><ul><li>Negotiators will attempt to finalize a deal to fully restore trade normality in the Strait.</li><li>The U.S. will monitor Hezbollah's activity in Lebanon to determine if further strikes are required.</li></ul>", "shipping": "<p>A US-Iran accord is reopening the Strait of Hormuz while introducing new financial hurdles.</p><p><strong>Why it matters:</strong></p><ul><li>The strait is a critical energy chokepoint; instability directly impacts global oil prices.</li><li>Tehran's demand for \"insurance fees\" could transform a strategic waterway into a revenue stream.</li></ul><p><strong>The friction</strong></p><ul><li>Tanker owners fear a market crash as war-driven record profits evaporate.</li><li>Shipping crews face severe mental and physical strain after months of stranding.</li><li>Industry leaders warn that the backlog of vessels may take weeks to clear.</li></ul><p><strong>The shadow fleet</strong></p><ul><li>The UK is actively seizing Russian-linked tankers to disrupt war funding.</li><li>Over 50% of shadow fleet vessels are flagged as high environmental risks due to age.</li><li>Danish yards continue to service Russian LNG tankers despite EU sanctions.</li></ul><p><strong>Global shifts</strong></p><ul><li>South Korea is seeing economic growth driven by AI and global defense demand.</li><li>UK shipyards are repositioning for planned Royal Navy refreshes.</li></ul><p><strong>What's next</strong></p><ul><li>Markets are monitoring a 60-day window for Iran to implement formal transit fees.</li><li>Fleet owners must rebuild confidence in \"material\" security before resuming full operations.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is aggressively replacing human labor and reshaping global power dynamics.</p><p><strong>Why it matters:</strong></p><ul><li>Corporations are swapping human moderators and factory workers for LLMs and robots to slash operational costs.</li><li>Access to high-end hardware has become a primary instrument of geopolitical leverage and national security.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>2x:</strong> The price increase for banned Nvidia chips on China’s black market.</li><li><strong>15%:</strong> The jump in Qualcomm shares following a data center chip deal with Meta.</li><li><strong>300 million:</strong> The projected size of China's workforce by 2100, driving the push for humanoid robots.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Labor friction:</strong> Automation is triggering direct industrial conflict, evidenced by Hyundai worker strikes in South Korea.</li><li><strong>Political clout:</strong> The AI lobby is now a potent electoral force, capable of influencing US primary outcomes.</li><li><strong>Monetization pressure:</strong> OpenAI’s pivot to advertising at Cannes signals an urgent need for revenue ahead of a potential IPO.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Industry integration:</strong> AI is moving into the \"real economy,\" specifically improving risk calculation for catastrophe insurers.</li><li><strong>Hardware wars:</strong> US export controls will continue to drive a high-premium illicit market for processors in Asia.</li></ul>", "us-china relations": "<p>The U.S. and China are competing to define a new global order as American hegemony declines.</p><p><strong>Why it matters:</strong></p><ul><li>The transition creates a power vacuum that increases the risk of great-power conflict.</li><li>Economic interdependence is shifting toward \"asymmetric leverage,\" where critical resources are used as political weapons.</li></ul><p><strong>Between the lines</strong></p><ul><li>Beijing is branding itself as a \"pillar of stability\" to attract global leadership.</li><li>The Russia-China partnership has become one-sided, leaving Moscow as a junior partner.</li><li>Both superpowers seek dominance but resist the financial and political burdens of global leadership.</li></ul><p><strong>The strategy</strong></p><ul><li>China is weaponizing rare earth exports to pressure geopolitical rivals.</li><li>Beijing is testing a \"tribute system\" model to project power without resorting to war.</li></ul><p><strong>What's next</strong></p><ul><li>Increased reliance on special envoys to manage high-tension summits and prevent total diplomatic breakdown.</li><li>Continued fragmentation of the transatlantic alliance as the U.S. struggles to coordinate troop levels and security guarantees.</li></ul>", "us elections": "<p>Trump's grip on the Republican Party is testing its general election viability as economic pressure and internal divides mount.</p><p><strong>Why it matters:</strong> MAGA-backed candidates are winning primaries but risk alienating moderate swing voters in key states. Inflation and tariff-driven price hikes are eroding support among rural and working-class bases.</p><p><strong>Between the lines</strong></p><ul><li>Democrats are pivoting toward populism in Pennsylvania to recapture working-class voters.</li><li>The DNC is formally attributing previous losses to a lack of unity within the Biden White House.</li><li>The GOP is split between Trump's loyalty demands and legislative pragmatism regarding foreign policy and spending.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.8 billion:</strong> The proposed \"anti-weaponization\" fund causing friction among Republican senators.</li><li><strong>$300 billion:</strong> The potential fund for Iran if a peace deal is upheld.</li></ul><p><strong>What's next</strong></p><ul><li>November midterms will determine if MAGA primary winners can translate base enthusiasm into general election victories.</li><li>The DoJ probe into Gavin Newsom will likely shape the 2028 presidential field.</li></ul>", "german politics": "<p>Germany is restructuring its military and financial systems as the far-right AfD gains unprecedented momentum.</p><p><strong>Why it matters:</strong> Inefficient procurement and diplomatic friction are forcing Berlin to pivot toward unilateral defense and capital market reforms.</p><p><strong>The defense pivot</strong></p><ul><li>Berlin scrapped the F126 frigate program following cost overruns and delays.</li><li>The state is acquiring a 40% stake in tank maker KNDS to pave the way for an IPO.</li><li>Germany is seeking new fighter jet partners after breaking with France.</li><li>A procurement agency overhaul aims to accelerate spending of the expanded defense budget.</li></ul><p><strong>Political volatility</strong></p><ul><li>The AfD leads opinion polls by leveraging voter anger over fuel prices.</li><li>AfD executives are maintaining direct ties with Kremlin associates.</li><li>Chancellor Friedrich Merz faces internal pressure from conservative rival Hendrik Wüst.</li></ul><p><strong>Economic realignment</strong></p><ul><li>Berlin is proposing a Swedish-style public pension fund invested in capital markets.</li><li>The government is privatizing Uniper, reducing its stake from 99% to 25%.</li><li>Finance officials are threatening budget cuts for ministries failing to spend infrastructure funds.</li></ul><p><strong>Between the lines</strong></p><ul><li>Berlin's \"go it alone\" military strategy is alarming France and other EU partners.</li><li>Tensions with the U.S. are driving a renewed push for Tomahawk missiles.</li><li>EU officials warn that Berlin's intervention in the Commerzbank bid violates single-market principles.</li></ul>", "central banks": "<p>Kevin Warsh is stripping the Federal Reserve of its forward guidance to prioritize agility over predictability.</p><p><strong>Why it matters:</strong> Removing the \"dot plot\" and policy signals increases market volatility. It forces investors to react to real-time data rather than central bank forecasts.</p><p><strong>By the numbers</strong></p><ul><li><strong>1%:</strong> The Bank of Japan's new rate, the first increase since 1995.</li><li><strong>3.75%:</strong> The Bank of England's current hold, aided by falling oil prices.</li><li><strong>2x:</strong> The current U.S. inflation rate relative to the Fed's target, driven by conflict in Iran.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Framework shift:</strong> Warsh is moving the Fed toward a \"Delphic\" model, abandoning the reaction-function approach to gain tactical flexibility.</li><li><strong>Global divergence:</strong> While the BoE holds, Southeast Asian banks (Indonesia, Philippines) are hiking to defend currencies against energy shocks.</li><li><strong>Systemic distrust:</strong> Central banks are repatriating gold reserves to avoid the risks of foreign sanctions and geopolitical instability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market pricing:</strong> Traders will now price in the \"Warsh effect,\" expecting higher borrowing costs and less transparency.</li><li><strong>Policy reform:</strong> Expect sweeping changes to the Fed's inflation and balance-sheet frameworks.</li></ul>", "us banks": "<p>US banks are using deregulation to aggressively expand their balance sheets and global footprints.</p><p><strong>Why it matters:</strong> Lower capital requirements allow lenders to pivot from risk mitigation to growth and shareholder returns. This creates a competitive imbalance between US banks and more constrained EU and Swiss rivals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Capital freed for US and UK banks via regulatory loosening.</li><li><strong>$700 billion:</strong> Potential losses for US banks in a severe economic crash, per Fed stress tests.</li><li><strong>$114 billion:</strong> Revenues for non-bank trading firms like Citadel and Jane Street, eating into traditional bank territory.</li><li><strong>€15 billion:</strong> Citi’s partnership with BlackRock for European private lending.</li></ul><p><strong>Between the lines</strong></p><ul><li>JPMorgan is transitioning from a US-centric retail model to a European digital powerhouse via Chase.</li><li>Security concerns in China are forcing operational shifts, including Morgan Stanley issuing China-only iPhones to staff.</li><li>Internal governance is fracturing at top firms, evidenced by leadership exits at Goldman Sachs and risk-management lawsuits at Citi.</li></ul><p><strong>What's next</strong></p><ul><li>JPMorgan may spend up to $20 billion on new acquisitions.</li><li>Wall Street will continue lobbying to further dilute Basel capital rules.</li><li>Morgan Stanley will integrate spot crypto trading into its E*Trade platform.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>25 Jun 2026 12:41 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
