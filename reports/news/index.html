const SUMMARIES = {"oil and gas": "<p>Brent crude has returned to pre-war levels as Gulf oil flows recover.</p><p><strong>Why it matters:</strong> Supply stability now hinges on the US-Iran diplomatic channel to keep the Strait of Hormuz open.</p><p><strong>By the numbers</strong></p><ul><li>$72.48: The Brent crude price point marking a return to February levels.</li><li>2019: The last time global gas flaring hit current peak levels.</li></ul><p><strong>Between the lines</strong></p><ul><li>AI is forcing a fossil fuel pivot. New York is weakening its opposition to oil and gas to power energy-hungry data centers.</li><li>Legal precedents are shifting. A court ruling now forces TotalEnergies to account for its specific contribution to greenhouse gas emissions.</li></ul><p><strong>What's next</strong></p><ul><li>Iraq will lobby OPEC for increased production quotas.</li><li>EU ministers will debate methane rules that the US and Qatar warn could trigger a gas supply crunch.</li></ul>", "corporate earnings and results": "<p>Major corporations are aggressively slashing costs and pivoting portfolios to survive regulatory shifts and AI market volatility.</p><p><strong>Why it matters:</strong> Massive layoffs and failed industrial projects signal a correction in global spending. Strategic acquisitions and AI talent wars highlight a desperate race for new growth engines.</p><p><strong>By the numbers</strong></p><ul><li>100,000: Potential job cuts at Volkswagen in a sweeping cost-cutting drive.</li><li>€15 billion: Rheinmetall's loss on a failed German warship project.</li><li>$4 billion: Unilever's potential bid for supplement maker Thorne.</li><li>$170 million: Swatch's claim against Samsung for design appropriation.</li></ul><p><strong>Between the lines</strong></p><ul><li>The AI boom is hitting a valuation wall, triggering stock declines and a shift toward commercialization.</li><li>Regulatory crackdowns in the EU are forcing market exits for firms like Binance and triggering probes into Sanofi and Zalando.</li></ul><p><strong>What's next</strong></p><ul><li>Watch for more \"wellness\" pivots as consumer goods companies spin off food divisions to boost margins.</li><li>Expect increased trade friction as Chinese EV makers enter North America via Mexico and Canada.</li></ul>", "middle east war": "<p>The U.S. and Iran are negotiating a settlement in Switzerland to end a four-month conflict and reopen the Strait of Hormuz.</p><p><strong>Why it matters:</strong> A prolonged blockade of the world's most critical oil chokepoint threatens global trade stability and energy security.</p><p><strong>By the numbers</strong></p><ul><li><strong>$125 billion:</strong> Value of goods stranded on 1,200 cargo ships.</li><li><strong>$6 billion:</strong> Frozen funds Trump agreed to release for U.S. medical supplies and crops.</li><li><strong>500:</strong> U.S. aircraft that operated from Italian bases during Operation Epic Fury.</li></ul><p><strong>Between the lines</strong></p><ul><li>The U.S. Senate's war powers resolution signals deep internal anxiety over Trump's unilateral handling of the conflict.</li><li>Stalled subsea cable projects suggest geopolitical instability is deterring long-term AI and cloud investment in the region.</li><li>Pakistan is leveraging the peace push to unlock critical financial support.</li></ul><p><strong>What's next</strong></p><ul><li>Negotiators will attempt to finalize a ceasefire to fully reopen the Strait of Hormuz.</li><li>Shipowners await consistent routing instructions from Washington and Tehran to resume transit.</li></ul>", "shipping": "<p>A US-Iran accord is reopening the Strait of Hormuz while introducing new transit costs.</p><p><strong>Why it matters:</strong></p><ul><li>The waterway is a critical energy chokepoint; new fees or disruptions immediately impact global oil prices.</li><li>Tanker owners face a potential market crash after record conflict-driven profits.</li></ul><p><strong>By the numbers:</strong></p><ul><li>$200,000: The toll some operators prefer over continued closures.</li><li>60 days: The timeframe before Tehran may implement formal transit fees.</li><li>50%+: The share of the \"shadow fleet\" deemed an environmental risk.</li></ul><p><strong>Between the lines:</strong></p><ul><li>Iran is pivoting from military disruption to financial leverage via mandatory insurance policies.</li><li>The UK is using tanker seizures to dismantle the Russian shadow fleet's logistics.</li><li>Global conflict is shifting shipbuilding demand toward South Korea and UK defense yards.</li></ul><p><strong>What's next:</strong></p><ul><li>Cargo flows will recover slowly due to significant vessel backlogs.</li><li>Increased scrutiny of EU shipyards servicing Russian LNG tankers.</li></ul>", "artificial intelligence": "<p>AI is fundamentally restructuring global supply chains, legal professions, and national security strategies.</p><p><strong>Why it matters:</strong> Hardware bottlenecks are driving consumer price hikes and massive chip profits. National competitiveness now depends on specialized research and hardware self-reliance rather than general adoption.</p><p><strong>By the numbers</strong></p><ul><li><strong>$263 billion:</strong> Market cap loss for Apple amid AI-driven memory shortages.</li><li><strong>15x:</strong> Profit surge for Micron due to sustained memory demand.</li><li><strong>300 million:</strong> Projected Chinese workforce by 2100, driving humanoid robot investment.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Legal Pivot:</strong> Law firms are decoupling casework from operations to eliminate \"drudge work,\" though psychological resistance remains.</li><li><strong>The Sovereignty Race:</strong> India and the UK are pivoting toward specialization to avoid being sidelined by US and Chinese dominance.</li><li><strong>The Safety Friction:</strong> The US government is intervening in model releases (GPT 5.6) to vet users, signaling a shift toward regulated distribution.</li></ul><p><strong>What's next</strong></p><ul><li><strong>IPO Pressure:</strong> OpenAI and Anthropic must prove their value proposition against rising open-source alternatives.</li><li><strong>Labor Replacement:</strong> Meta's move to replace human moderators with LLMs signals a broader corporate trend toward AI-driven cost-cutting.</li></ul>", "us-china relations": "<p>The U.S. and China are competing for global hegemony while both struggle to maintain the responsibilities of international leadership.</p><p><strong>Why it matters:</strong></p><ul><li>Economic competition is shifting toward the weaponization of critical minerals, creating new vulnerabilities for tech-dependent allies.</li><li>A decline in multilateral governance increases the risk of \"might is right\" geopolitics and accidental conflict.</li></ul><p><strong>Between the lines</strong></p><ul><li>Beijing is leveraging Russia's isolation to secure a one-sided strategic partnership.</li><li>China is positioning itself as a \"pillar of stability\" to attract neutral nations as U.S. influence wavers.</li><li>The U.S. is moving toward pre-emptive action, breaking from traditional globalist norms.</li></ul><p><strong>By the numbers</strong></p><ul><li>2: Japanese nationals detained by China over rare earth smuggling.</li><li>1: New whistleblower hotline opened by Beijing to police critical mineral exports.</li><li>250: The upcoming anniversary of the U.S., coinciding with a crisis in the world order it created.</li></ul><p><strong>What's next</strong></p><ul><li>Increased volatility in narrow seas and critical waterways as nations vie for security.</li><li>A shift toward \"asymmetric leverage,\" where power flows from the ability to exploit imbalances rather than total wealth.</li><li>Continued instability in NATO as European allies press Washington for clarity on troop levels.</li></ul>", "us elections": "<p>Trump's dominance in GOP primaries is creating a tension between party loyalty and general election viability.</p><p><strong>Why it matters:</strong></p><ul><li>Installing divisive loyalists in swing states like Texas may hand Senate control to Democrats.</li><li>Economic instability and Middle East conflict are fracturing Trump's base of evangelicals and rural voters.</li></ul><p><strong>Between the lines</strong></p><ul><li>Silicon Valley's AI lobby is now actively purging pro-regulation candidates from Congress.</li><li>Democrats are shifting toward populist messaging in Pennsylvania to reclaim working-class support.</li><li>The DNC is formally attributing the Harris loss to a lack of unity within the Biden White House.</li></ul><p><strong>By the numbers</strong></p><ul><li>$1.8 billion: The cost of Trump's proposed \"anti-weaponization\" fund facing GOP pushback.</li><li>$300 billion: Potential U.S. funding for Iran contingent on a peace deal.</li></ul><p><strong>What's next</strong></p><ul><li>General elections in California and Maine will gauge the appetite for MAGA-aligned candidates.</li><li>The GOP must resolve internal disputes over Middle East military authority and spending.</li></ul>", "german politics": "<p>Germany is aggressively restructuring its defense and financial systems while battling a surge in far-right populism.</p><p><strong>Why it matters:</strong> Berlin is attempting to lead European security through industrial ownership and procurement reform. Simultaneously, the AfD's rise threatens Germany's geopolitical stability and EU cohesion.</p><p><strong>By the numbers</strong></p><ul><li>40%: Berlin's planned stake in tank maker KNDS.</li><li>€500bn: Infrastructure fund facing spending cuts for lagging ministries.</li><li>€2.35mn: Illegal donation the AfD must return per court order.</li></ul><p><strong>Between the lines</strong></p><ul><li>Defense friction: Berlin is distancing itself from France on fighter jets and warships to prioritize financial control and speed.</li><li>Political fragility: Chancellor Friedrich Merz faces a \"dark horse\" challenge from Hendrik Wüst as polls slide.</li><li>Ideological shift: The AfD is leveraging fuel prices and anti-Iran war sentiment to dominate opinion polls.</li></ul><p><strong>What's next</strong></p><ul><li>Uniper privatization to reduce government stake from 99% to 25%.</li><li>Implementation of a Swedish-style public pension fund investing in capital markets.</li><li>A high-stakes diplomatic push for Tomahawk missiles following tensions with the U.S.</li></ul>", "central banks": "<p>Central banks are shifting toward higher interest rates to combat surging inflation and geopolitical volatility.</p><p><strong>Why it matters:</strong> The Fed's move away from forward guidance increases market volatility and borrowing costs. Global rate hikes are now necessary to stabilize currencies against energy shocks.</p><p><strong>By the numbers</strong></p><ul><li><strong>1%:</strong> Bank of Japan's new rate, the highest since 1995.</li><li><strong>3.75%:</strong> Bank of England's current hold.</li><li><strong>~2x:</strong> Current US inflation relative to the Fed's target.</li></ul><p><strong>Between the lines</strong> New Fed Chair Kevin Warsh is dismantling the \"dot plot\" and forward guidance.</p><p>This shift makes the Fed less predictable, forcing investors to price risk without official roadmaps.</p><p><strong>Global trends</strong></p><ul><li><strong>Southeast Asia:</strong> Indonesia and the Philippines are raising rates to shore up crashing currencies.</li><li><strong>Eurozone:</strong> The ECB remains ready to hike if ceasefire agreements fail.</li><li><strong>Gold:</strong> Central banks are repatriating bullion to hedge against sanctions and global insecurity.</li></ul><p><strong>What's next</strong> Markets are pricing in a \"Warsh effect\" characterized by higher borrowing costs and a more aggressive stance on inflation.</p>", "us banks": "<p>US banks are aggressively expanding their global footprints and balance sheets as regulatory pressures ease.</p><p><strong>Why it matters:</strong> Deregulation is freeing massive capital for acquisitions and investor payouts. Simultaneously, traditional lenders are losing market share to non-bank trading firms.</p><p><strong>By the numbers</strong></p><ul><li>$1.3 trillion: Capital unlocked for US and UK banks through regulatory loosening.</li><li>$114 billion: Combined revenue of trading firms like Citadel and Jane Street.</li><li>$20 billion: Potential acquisition budget for JPMorgan.</li><li>$700 billion: Projected losses in a severe economic crash per Fed stress tests.</li></ul><p><strong>Between the lines</strong></p><ul><li>JPMorgan is in a state of leadership flux as Jamie Dimon repeatedly reshuffles his succession pipeline.</li><li>The \"digital-first\" retail strategy is scaling from the UK into Germany, France, Spain, and Italy.</li><li>Geopolitical tension is forcing operational shifts, such as Morgan Stanley issuing China-only iPhones for data security.</li></ul><p><strong>What's next</strong></p><ul><li>Wall Street will continue lobbying regulators for further reductions in Basel capital rules.</li><li>Citi will deploy a €15bn BlackRock partnership to scale private European lending.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>26 Jun 2026 12:33 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
