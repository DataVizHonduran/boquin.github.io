const SUMMARIES = {"oil and gas": "<p>Global oil markets are balancing geopolitical volatility against weakening Chinese demand.</p><p><strong>Why it matters:</strong> Supply shocks from the Iran war are colliding with structural shifts in consumption, creating extreme volatility for traders and national inventories.</p><p><strong>The supply-demand tug-of-war</strong></p><ul><li><strong>Bearish:</strong> China's import cuts are shielding the market, keeping crude prices below $100 a barrel.</li><li><strong>Bullish:</strong> U.S. oil stocks have hit their lowest level since 2004 due to war-related drains.</li><li><strong>Mitigation:</strong> Gulf states are planning pipelines to bypass the Strait of Hormuz to ensure export continuity.</li></ul><p><strong>Corporate instability</strong></p><ul><li><strong>BP:</strong> Internal turmoil persists following the firing of Albert Manifold; the company is weighing a £2bn sale of North Sea assets to Ithaca.</li><li><strong>Finance:</strong> U.S. and Japanese banks are increasing fossil fuel funding, with JPMorgan leading a 12% increase in deals.</li><li><strong>Trading:</strong> Trafigura's net profit more than doubled to $4.1bn, capitalizing on war-driven price swings.</li></ul><p><strong>The energy transition friction</strong></p><ul><li><strong>Europe:</strong> High energy prices are driving the largest year-on-year decline in fuel sales since 2023 and threatening industrial competitiveness.</li><li><strong>Infrastructure:</strong> The UK is outsourcing key SMR nuclear projects to South Korea, signaling a decline in domestic build capacity.</li><li><strong>Conflict:</strong> Seven U.S. states are suing the government over a $1bn payment to Total to pivot from wind back to fossil fuels.</li></ul><p><strong>What's next:</strong> Watch for the \"critically low\" threshold of U.S. inventories. If stockpiles bottom out before China's demand stabilizes, a price spike above $100 is likely.</p>", "corporate earnings and results": " s pushing for an immediate end to hostilities; Netanyahu continues to pursue military solutions.</li><li><strong>Narrative control:</strong> Critics argue Trump has ceded the diplomatic narrative to Tehran.</li><li><strong>Leverage:</strong> The US is weighing the seizure of Iranian assets to compensate Gulf allies for war damage.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100 billion:</strong> Estimated hit to airlines due to jet fuel price surges.</li><li><strong>2x:</strong> Increase in jet fuel costs since the conflict began in February.</li><li><strong>101 days:</strong> Duration of the current conflict cycle.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic contagion:</strong> Energy shocks are driving global inflation and forcing airfare hikes.</li><li><strong>Geopolitical shifts:</strong> Italy is gaining ground as a \"reliable partner\" in the Gulf while US unpredictability rattles traditional allies.</li><li><strong>Hybrid warfare:</strong> Russia and Iran are increasingly recruiting minors to conduct hostile acts across Europe and Israel.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Deal:</strong> Trump has signaled that Netanyahu will have \"no choice\" but to accept a deal with Iran.</li><li><strong>Market Watch:</strong> Investors are monitoring whether retaliatory strikes trigger a return to all-out war, further spiking oil prices.</li></ul>", "shipping": "<p>Geopolitical volatility in the Strait of Hormuz is destabilizing global energy flows and reshaping maritime trade routes.</p><p><strong>Why it matters:</strong> Disruptions in the Gulf trigger immediate spikes in freight costs and force nations to pivot to riskier \"shadow fleets\" or alternative fuels.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk due to the Iran conflict.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert from Middle East routes.</li><li><strong>$0:</strong> Total uptake of Trump’s $40bn insurance facility due to lack of naval escorts.</li><li><strong>50%+:</strong> Proportion of \"shadow fleet\" tankers deemed environmental risks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market fragility:</strong> Tanker owners are bracing for a crash; record profits driven by war-time premiums are unsustainable if the Strait reopens.</li><li><strong>Strategic pivots:</strong> Asian nations are increasing coal shipments to offset disrupted gas supplies.</li><li><strong>Operational decay:</strong> Ships trapped in the Gulf face biological infestation (barnacles/jellyfish), threatening their seaworthiness.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> Lawsuits between shipping exchanges and traders over disrupted route rates will determine how \"closure\" is defined financially.</li><li><strong>Infrastructure shifts:</strong> Ports like Belfast are investing billions to capture freight diverted by global instability.</li><li><strong>Last-mile evolution:</strong> Retailers like Walmart are repurposing physical spaces to bypass traditional shipping bottlenecks.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative tech trend to a systemic driver of global finance, governance, and crime.</p><p><strong>Why it matters:</strong> Massive capital inflows are fueling a physical infrastructure boom, while the rapid deployment of AI in law enforcement and corporate operations is outpacing legal and ethical safeguards.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1tn+:</strong> Expected valuation of OpenAI following its IPO filing.</li><li><strong>$35bn:</strong> Private credit raised by Apollo and Blackstone for Anthropic.</li><li><strong>$30bn:</strong> SpaceX deal to lease computing capacity to Google.</li><li><strong>$50bn:</strong> Current value of PE software acquisitions, a post-pandemic low.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure pivot:</strong> \"Picks and shovels\" companies like Caterpillar are winning as AI demands massive data center expansion.</li><li><strong>Governance gap:</strong> Police in England and Wales are halting AI court statements due to a lack of safeguards, while drug gangs are already leveraging the tech for trafficking.</li><li><strong>Political hedging:</strong> Both Trump and OpenAI are proposing equity-stake models to mitigate public anxiety and populist backlash.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Product evolution:</strong> OpenAI is overhauling ChatGPT to pivot toward higher-margin products ahead of its public listing.</li><li><strong>Legal battles:</strong> Debate intensifies over \"legal personhood\" for AI agents and the risk of humans \"rubber-stamping\" AI-generated errors.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony defined by asymmetry and instability.</p><p><strong>Why it matters:</strong> The shift toward a \"might is right\" world order increases the risk of direct conflict while eroding the multilateral institutions that previously managed great-power friction.</p><p><strong>Between the lines</strong></p><ul><li><strong>The Leadership Vacuum:</strong> Washington is retreating from global responsibilities, but Beijing is hesitant to assume the costs of leadership.</li><li><strong>Asymmetric Leverage:</strong> Power now derives from the ability to exploit imbalances rather than raw economic or military size.</li><li><strong>The Russia Factor:</strong> Putin’s strategic missteps have created a one-sided dependency, granting China significant leverage over Moscow.</li></ul><p><strong>The Soft Power Shift</strong></p><ul><li>Beijing is actively courting foreign officials to project an image of stability.</li><li>China is capitalizing on U.S. diplomatic volatility to improve its global standing.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Reform:</strong> Existing multilateral bodies must be reinvented to avoid total irrelevance in a fractured geopolitical landscape.</li><li><strong>Risk Evolution:</strong> Corporations and governments are shifting from efficiency-based models to resilience and contingency planning.</li><li><strong>Middle Power Rise:</strong> Smaller nations are adopting \"armadillo\" strategies—defensive, opportunistic postures—to navigate the U.S.-China stalemate.</li></ul>", "us elections": "<p>Trump's grip on the Republican Party remains firm but creates strategic vulnerabilities for the general election.</p><p><strong>Why it matters:</strong> Trump's ability to purge critics in primaries ensures party loyalty but risks alienating moderate and swing voters. This tension creates a \"Pyrrhic victory\" scenario where MAGA purity may cost the GOP winnable seats.</p><p><strong>The friction points</strong></p><ul><li><strong>Economic discontent:</strong> Voters increasingly blame the president for inflation and high grocery prices.</li><li><strong>Base erosion:</strong> Evangelicals are questioning if Trump's rhetoric aligns with Christian values.</li><li><strong>Policy clashes:</strong> The House blocked Trump's ability to strike in the Middle East without approval, signaling a rift on war powers.</li></ul><p><strong>Battleground risks</strong></p><ul><li><strong>Texas:</strong> The nomination of Ken Paxton secures the MAGA base but provides Democrats an opening with moderates.</li><li><strong>Maine:</strong> Tariff-driven price hikes in the lobster industry are pushing rural voters away from the GOP.</li><li><strong>Pennsylvania:</strong> A shift toward populist, working-class messaging is strengthening Democratic nominations in swing districts.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal GOP war:</strong> Trump is using \"anti-weaponization\" funds to pressure senators, framing opposition as betrayal.</li><li><strong>Democratic instability:</strong> The party is struggling with internal unity and candidate scandals in Maine.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California Primaries:</strong> Results will serve as a bellwether for national appetite for MAGA-style politics.</li><li><strong>2028 Positioning:</strong> JD Vance and Marco Rubio are already emerging as primary contenders for the next cycle.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military leadership while facing severe diplomatic friction with the U.S.</p><p><strong>Why it matters:</strong> Berlin is abandoning its post-WWII pacifist tradition to counter Russian threats, but this rapid rearmament is straining its relationship with Donald Trump and unsettling EU partners.</p><p><strong>The defense surge</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit NATO's 3.5% GDP target six years ahead of schedule.</li><li><strong>Industry:</strong> The government is buying a 40% stake in tank maker KNDS and overhauling procurement agencies to accelerate spending.</li><li><strong>Strategy:</strong> Germany published its first formal military strategy since WWII, signaling a permanent shift toward \"more responsibility\" for European security.</li></ul><p><strong>The Trump rift</strong></p><ul><li><strong>The spark:</strong> Chancellor Friedrich Merz criticized U.S. strategy in Iran, calling the U.S. \"humiliated.\"</li><li><strong>The fallout:</strong> Trump launched a review of U.S. troops in Germany and is pulling 5,000 soldiers out in retaliation.</li><li><strong>The irony:</strong> Despite the row, Germany is pushing to buy U.S. Tomahawk missiles to fill capability gaps.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political shifts:</strong> The far-right AfD is topping polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>Leadership:</strong> Merz faces internal challenges from younger conservative Hendrik Wüst as polls slide.</li><li><strong>Fiscal tension:</strong> The Finance Ministry is threatening to cut funding for ministries that fail to spend a €500bn infrastructure fund.</li></ul><p><strong>Between the lines</strong> Germany is attempting a \"double transition\"—becoming Europe's primary security guarantor while trying to maintain its role as the EU's fiscal disciplinarian. The friction with the U.S. suggests Berlin is struggling to balance strategic autonomy with its reliance on the American security umbrella.</p>", "central banks": "<p>Central banks are pivoting toward tighter monetary policy and reserve diversification amid persistent inflation and geopolitical volatility.</p><p><strong>Why it matters:</strong> Sticky inflation and strong labor markets are forcing banks to delay rate cuts, while political instability is eroding trust in traditional reserve assets.</p><p><strong>The policy shift</strong></p><ul><li><strong>US Fed:</strong> Strong May payrolls (double expectations) have effectively removed immediate rate cuts from the table.</li><li><strong>ECB:</strong> Rising core inflation and energy spillover are driving policymakers toward a June rate hike.</li><li><strong>Bank of Japan:</strong> Increasing bond volatility is forcing tweaks to quantitative tightening and balance sheet reductions.</li><li><strong>Indonesia:</strong> Executed an unexpected off-cycle rate hike to stabilize the rupiah following market routs.</li></ul><p><strong>The reserve pivot</strong></p><ul><li><strong>Gold vs. Treasuries:</strong> Gold now represents 27% of global reserves, surpassing US Treasuries as central banks diversify away from the dollar.</li><li><strong>Systemic Risk:</strong> US Treasuries are increasingly viewed as a potential financial chokepoint rather than a pure haven asset.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political Pressure:</strong> Former Fed Chair Powell and ECB officials warn that political interference and volatile trade policies threaten central bank independence and global stability.</li><li><strong>Technological Hedge:</strong> The Fed and BoE are successfully testing blockchain prototypes to enable near-instantaneous cross-border settlements.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed Leadership:</strong> Incoming Chair Warsh faces a \"narrow path,\" likely rolling back forward guidance to regain flexibility.</li><li><strong>Fiscal Constraints:</strong> Long-term demographic shifts are expected to increase fiscal pressure, potentially limiting the autonomy of monetary policy.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and aggressively pursue global market share.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing US giants to outpace European and Swiss rivals. This shift enables massive acquisitions and expansion into retail banking.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via deregulation.</li><li><strong>$20 billion:</strong> Potential acquisition budget for JPMorgan.</li><li><strong>$114 billion:</strong> Combined revenues for non-bank trading firms like Jane Street and Citadel, challenging traditional Wall Street dominance.</li><li><strong>$4 billion:</strong> Amount of private equity-linked loan exposure JPMorgan is seeking to offload.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Risk:</strong> Banks are actively transferring risk to avoid overexposure to data center debt fueled by the AI boom.</li><li><strong>Geopolitical Friction:</strong> Morgan Stanley's use of China-only iPhones for HK staff signals deepening data security fears.</li><li><strong>Internal Shifts:</strong> Citigroup is pivoting to direct employee incentives for referrals to accelerate its turnaround.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail Push:</strong> JPMorgan is scaling its digital \"Chase\" bank into Germany.</li><li><strong>Crypto Integration:</strong> Morgan Stanley will launch spot crypto trading on E*Trade.</li><li><strong>Strategic Partnerships:</strong> Citi and BlackRock will deploy €15 billion for private European lending.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>09 Jun 2026 13:25 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
