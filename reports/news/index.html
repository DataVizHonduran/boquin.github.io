.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Global oil markets are defying predicted supply crunches despite Middle East volatility.</p><p><strong>Why it matters:</strong> Ample global stockpiles and reduced Chinese demand are neutralizing geopolitical shocks, preventing crude from breaching the $100 per barrel threshold.</p><p><strong>By the numbers</strong></p><ul><li><strong>$4.1B:</strong> Trafigura's net profit for Oct-March, driven by Iran-related volatility.</li><li><strong>< $100:</strong> Current crude price ceiling, supported by near-decade-low Chinese imports.</li><li><strong>12%:</strong> Increase in fossil fuel deals by JPMorgan, signaling a US banking pivot back to hydrocarbons.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>China's role:</strong> Beijing's import cuts are acting as a global price shield, offsetting OPEC+ production shifts.</li><li><strong>Strategic divergence:</strong> While European banks are reducing fossil fuel exposure, US and Japanese lenders are aggressively increasing finance.</li><li><strong>Corporate instability:</strong> BP faces investor skepticism and leadership turmoil, complicating its strategic pivot.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Supply chain shifts:</strong> US firms (GM, EnergyX) are aggressively pursuing sodium and lithium alternatives to break Chinese dominance in battery minerals.</li><li><strong>Regulatory pressure:</strong> European industry leaders are calling for urgent deregulation to counter energy shocks and maintain global competitiveness.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are facing a volatile convergence of geopolitical instability and regulatory crackdowns.</p><p><strong>Why it matters:</strong> Supply chain disruptions in the Gulf and climate-driven food inflation are squeezing margins. Simultaneously, aggressive regulatory interventions in China and the UK are creating unpredictable liability costs.</p><p><strong>The risk factors</strong></p><ul><li><strong>Geopolitical:</strong> Tanker attacks in the Gulf and Iran's threats to the Hormuz Strait threaten global shipping costs.</li><li><strong>Climate:</strong> El Niño is projected to spike global food prices, compounding existing fertilizer cost inflation.</li><li><strong>Regulatory:</strong> Beijing's warnings to Alibaba and JD.com over sales tactics are directly hitting tech valuations.</li></ul><p><strong>Sector spotlights</strong></p><ul><li><strong>Retail:</strong> Frasers' €2.7bn bid for Hugo Boss signals a consolidation trend in luxury fashion.</li><li><strong>Tech/AI:</strong> SpaceX's pending IPO serves as a critical litmus test for Wall Street's appetite for high-valuation AI plays.</li><li><strong>Automotive:</strong> Toyota and JLR warn that \"Made in Europe\" mandates will stifle investment and kill jobs.</li></ul><p><strong>What's next</strong> Markets will monitor if synthetic commodities, like lab-grown cocoa, can stabilize trade volatility caused by natural crop failures.</p>", "middle east war": "<p>The U.S. and Iran have entered a cycle of direct military strikes following the downing of an American helicopter.</p><p><strong>Why it matters:</strong> Escalation threatens global energy stability and signals a shift toward \"total control\" of Iranian oil infrastructure by the U.S.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Direct combat:</strong> U.S. jets targeted Iranian air defense and radar; Iran struck U.S. facilities in Jordan and Bahrain.</li><li><strong>Resource warfare:</strong> U.S. strikes on reservoir tanks left 20,000 Iranians without water.</li><li><strong>Economic leverage:</strong> Trump vowed to seize Kharg Island to control Iran's oil and gas exports.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Oil flows:</strong> \"Dark\" tanker transits in the Strait of Hormuz are increasing via secret U.S. missions.</li><li><strong>Humanitarian crisis:</strong> Displaced Palestinians in Gaza are facing severe rodent infestations amid rubble.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political friction:</strong> Netanyahu faces domestic backlash for curbing Israeli attacks at Trump's request.</li><li><strong>Diplomatic shifts:</strong> Saudi Arabia ended its five-year ban on Lebanese imports to weaken Hizbollah's political grip.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market volatility:</strong> Oil prices are sliding as Hormuz transits climb, though full recovery will take months.</li><li><strong>Pressure campaign:</strong> Washington will continue \"hard\" strikes to force Tehran into a deal.</li></ul>", "shipping": "<p>Geopolitical instability in the Strait of Hormuz is destabilizing global energy flows and distorting shipping markets.</p><p><strong>Why it matters:</strong> The closure of critical waterways forces a shift to expensive land-based freight and \"shadow fleets,\" increasing the risk of environmental disasters and price volatility.</p><p><strong>The Hormuz deadlock</strong></p><ul><li><strong>Market volatility:</strong> Brent crude dropped 6% after two supertankers successfully crossed the strait.</li><li><strong>Operational failure:</strong> A $40bn U.S. insurance facility has seen zero uptake because it lacks naval escorts.</li><li><strong>Logistical pivots:</strong> Gulf freight rates are spiking as companies switch to trucks to move cargo.</li><li><strong>Physical decay:</strong> Trapped vessels are suffering from biological infestation (barnacles/jellyfish), hindering future mobility.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Defense boom:</strong> South Korea is capitalizing on global conflict; the UK's Cammell Laird shipyard is positioning for increased naval spending.</li><li><strong>Energy pivots:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to compete with Dublin via offshore wind and freight.</li></ul><p><strong>The risk profile</strong></p><ul><li><strong>Environmental:</strong> Over 50% of the \"shadow fleet\" of sanctioned tankers are deemed high-risk for disasters.</li><li><strong>Legal:</strong> The Baltic Exchange is facing lawsuits over rate-setting during the disruption.</li><li><strong>Sanctions:</strong> Danish shipyard Fayard remains the sole EU facility servicing Russian LNG tankers.</li></ul><p><strong>What's next:</strong> Market stability depends on the reopening of the Strait of Hormuz. Tanker owners who invested windfall profits into new vessels now face a potential crash in rates if the waterway stabilizes.</p>", "artificial intelligence": "<p>AI is shifting from a speculative tool to a massive infrastructure and capital expenditure engine.</p><p><strong>Why it matters:</strong> The scale of investment is decoupling from immediate revenue, creating a high-stakes gamble on future productivity and new economic models.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1 trillion+:</strong> Expected valuation for OpenAI following its IPO filing.</li><li><strong>$35 billion:</strong> Private credit deal from Apollo and Blackstone to fund Anthropic.</li><li><strong>$70 billion:</strong> Oracle's planned spend on data center expansion this year.</li><li><strong>$7 billion:</strong> Valuation of humanoid robot start-up Neura after a $1.4 billion raise.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Slop\" Factor:</strong> Routine time savings are not translating to organizational efficiency; employees are spending more time correcting AI errors.</li><li><strong>Infrastructure Winners:</strong> \"Picks and shovels\" companies like Caterpillar are benefiting from the physical build-out of data centers.</li><li><strong>Governance Gap:</strong> 80% of UK boards are discussing AI decision-making, but governance frameworks are lagging behind adoption.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fiscal Pivot:</strong> Policymakers are debating new tax codes to address AI-driven wealth concentration and potential mass underemployment.</li><li><strong>Geopolitical Risk:</strong> Calls for a US-China \"technological disarmament pact\" to regulate AI and increase global security.</li><li><strong>Market Volatility:</strong> Tech stocks are fluctuating as investors struggle to price \"moonshot\" promises against flat current revenues.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony characterized by strategic asymmetry and a vacuum of multilateral leadership.</p><p><strong>Why it matters:</strong> The shift toward a \"might is right\" world order increases the risk of direct conflict while forcing middle powers to forge new, defensive alliances to survive.</p><p><strong>Between the lines</strong></p><ul><li><strong>Beijing's Pivot:</strong> China is leveraging U.S. diplomatic volatility to position itself as a \"pillar of stability,\" gaining soft power as Washington burns bridges.</li><li><strong>The Russia Factor:</strong> Putin’s strategic missteps have created a one-sided dependency, granting Beijing significant leverage over Moscow.</li><li><strong>The Responsibility Gap:</strong> Both superpowers seek dominance but avoid the costs of global leadership, leaving international institutions like the UN fractured and irrelevant.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Zero-sum gains:</strong> Power now flows from the ability to convert imbalances into leverage rather than raw wealth or size.</li><li><strong>High stakes:</strong> The \"Thucydides Trap\" remains the primary driver of instability, where a rising power threatens to displace a ruling one.</li></ul><p><strong>What's next</strong></p><ul><li><strong>New Diplomacy:</strong> Expect a rise in \"middleman\" diplomacy, using special envoys to bypass traditional diplomatic deadlocks.</li><li><strong>Corporate Shift:</strong> Business schools and global firms are integrating geopolitical risk management into core curricula to survive \"simultaneity nightmares.\"</li></ul>", "us elections": "<p>US midterm elections are shifting into a high-stakes general election phase defined by candidate volatility and economic discontent.</p><p><strong>Why it matters:</strong> Trump's influence over GOP primaries is creating a \"MAGA\" slate that may alienate moderate swing voters. Simultaneously, inflation and foreign policy failures are eroding the president's base.</p><p><strong>The battlegrounds</strong></p><ul><li><strong>Texas:</strong> Trump-backed Ken Paxton won the primary, but Democrats believe his divisiveness makes the Senate seat winnable.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li><li><strong>Maine:</strong> Controversial Democrat Graham Platner will challenge incumbent Susan Collins despite misconduct allegations.</li><li><strong>Pennsylvania:</strong> A populist former firefighter's win signals a working-class shift within the Democratic party.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic drag:</strong> FT polling shows voters blame Trump for high grocery prices and inflation.</li><li><strong>Base erosion:</strong> Evangelicals are questioning if Trump's rhetoric aligns with Christian values.</li><li><strong>Internal GOP rift:</strong> House Republicans blocked Trump's Middle East strike authority, and senators are stalling his $1.8bn \"anti-weaponisation\" fund.</li></ul><p><strong>What's next</strong></p><ul><li><strong>November Midterms:</strong> The general election will test whether MAGA loyalty outweighs voter fatigue over the cost of living.</li><li><strong>2028 Positioning:</strong> JD Vance is already emerging as a primary contender for the future White House ticket.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy as relations with the U.S. collapse and internal political instability grows.</p><p><strong>Why it matters:</strong> Berlin is attempting to reconcile a massive defense buildup with a volatile domestic political landscape and a deteriorating alliance with Donald Trump.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Strategic shift:</strong> Germany is ditching France for new fighter jet partners and buying Tomahawk missiles to hedge against U.S. instability.</li><li><strong>Spending surge:</strong> Berlin aims to hit the 3.5% GDP NATO target six years early, overhauling procurement agencies to accelerate fund deployment.</li><li><strong>Industrial consolidation:</strong> The government is buying a 40% stake in KNDS and eyeing Rheinmetall’s €12bn bid for naval frigates.</li></ul><p><strong>The Trump friction</strong></p><ul><li><strong>Diplomatic fallout:</strong> Chancellor Friedrich Merz’s criticism of U.S. strategy in Iran has triggered a U.S. troop review and the potential withdrawal of 5,000 soldiers.</li><li><strong>Economic risk:</strong> Tensions are peaking as Merz expresses concern over the U.S. \"social climate\" and warns that an ill-prepared war hurts the German economy.</li></ul><p><strong>Domestic instability</strong></p><ul><li><strong>The AfD surge:</strong> The far-right party leads polls by leveraging voter anger over fuel prices and maintaining ties with the Kremlin.</li><li><strong>CDU infighting:</strong> Merz faces a \"chancellor swap\" threat as younger conservative Hendrik Wüst gains popularity.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>€500bn:</strong> The infrastructure fund Berlin is threatening to cut if ministries fail to spend quickly.</li><li><strong>€25mn:</strong> The threshold at which two lawmakers can unilaterally block arms contracts.</li><li><strong>25%:</strong> The target stake Berlin wants to retain in Uniper following its privatization.</li></ul><p><strong>Between the lines</strong> Germany is attempting to lead Europe's defense architecture, but its \"financial contribution\" approach is alienating France and creating friction within the EU single market.</p>", "central banks": "<p>Central banks are pivoting toward aggressive tightening and strategic diversification amid geopolitical instability.</p><p><strong>Why it matters:</strong> Persistent inflation and currency volatility are forcing policymakers to prioritize price stability over growth, while political pressure threatens the independence of these institutions.</p><p><strong>The policy shift</strong></p><ul><li><strong>ECB:</strong> Raising rates and inflation forecasts due to \"broadening\" price rises and conflict in Iran.</li><li><strong>Fed:</strong> Rate cuts are effectively off the table following stronger-than-expected May payroll data.</li><li><strong>Indonesia:</strong> Executed an off-cycle rate hike to stop a rout in the rupiah and stock market.</li><li><strong>BoJ:</strong> Reducing bond purchases to accelerate quantitative tightening.</li></ul><p><strong>The reserve pivot</strong></p><ul><li><strong>Gold vs. Dollar:</strong> Gold has replaced US Treasuries as the top reserve asset, now making up 27% of reserves.</li><li><strong>Risk shift:</strong> US Treasuries are transitioning from a \"haven asset\" to a potential financial chokepoint.</li><li><strong>Diversification:</strong> Central banks are increasingly adopting \"other\" reserve currencies to reduce dollar dependency.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political risk:</strong> Former Fed Chair Powell and ECB officials warn that political interference and volatile trade policies undermine the rule of law and global stability.</li><li><strong>Institutional friction:</strong> The Bank of England is debating corporate pricing strategies despite a lack of hard evidence.</li><li><strong>Tech evolution:</strong> The Fed and BoE successfully tested blockchain prototypes for near-instant cross-border settlements.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed Leadership:</strong> Incoming Chair Warsh is expected to roll back \"forward guidance\" to reduce Wall Street's reliance on explicit signals.</li><li><strong>Fiscal pressure:</strong> Long-term demographic shifts are projected to constrain the independence of monetary policy.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and aggressively pursue global market share.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing giants like JPMorgan to pursue massive acquisitions and retail expansion while fighting off encroachment from non-bank trading firms.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for US and UK banks via deregulation.</li><li><strong>$114 billion:</strong> Combined revenue for trading firms like Jane Street and Citadel as they challenge traditional banks.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon says JPMorgan could deploy.</li><li><strong>$9.4 billion:</strong> Total 2025 employee compensation at Jane Street.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Shadow\" Threat:</strong> High-frequency trading firms are successfully poaching territory once exclusive to Wall Street.</li><li><strong>Risk Management:</strong> Banks are actively offloading private equity-linked loans and AI-driven data center debt to avoid overexposure.</li><li><strong>Geopolitical Friction:</strong> Morgan Stanley's use of China-only iPhones highlights the growing tension between global operations and data security.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail Push:</strong> JPMorgan is scaling its Chase digital bank into Germany.</li><li><strong>Crypto Integration:</strong> Morgan Stanley will launch spot crypto trading on E*Trade.</li><li><strong>Strategic Pivots:</strong> Citi is partnering with BlackRock to scale private lending in Europe and the Middle East.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>11 Jun 2026 14:21 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
