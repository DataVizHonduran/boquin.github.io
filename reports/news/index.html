><strong>Career hedging:</strong> Personal branding is emerging as a primary strategy for white-collar workers to future-proof against automation.</li></ul>", "us-china relations": "<p>US-China relations have shifted from mutual cooperation to a zero-sum geopolitical struggle.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy increases the risk of systemic conflict and pushes neutral nations toward alternative power blocs.</p><p><strong>Between the lines</strong></p><ul><li><strong>Transactionalism:</strong> US foreign policy under Trump prioritizes immediate gains over long-term alliances, undermining reliability in the Asia-Pacific.</li><li><strong>Brics Expansion:</strong> China is leveraging US isolationism to unify the Brics bloc, which now outweighs the G7 in global economic share.</li><li><strong>AI Hegemony:</strong> US dominance in data centers secures a technological lead, but creates a power imbalance that fuels Chinese resentment.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>G7 vs. Brics:</strong> Brics now accounts for a larger share of the world economy than the G7.</li><li><strong>Security gaps:</strong> Reduced US military exercises in South Korea have triggered \"Plan B\" anxieties in Tokyo.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Managed Friction:</strong> Future summits will focus on preventing total collapse rather than achieving true détente.</li><li><strong>Strategic Hedging:</strong> Middle powers will increasingly use \"transactional diplomacy\" to play Washington and Beijing against each other.</li></ul>", "us elections": "<p>Republicans face a volatile midterm landscape defined by economic instability and internal base fractures.</p><p><strong>Why it matters:</strong> High inflation and housing costs are eroding Trump's popularity, threatening GOP control of the Senate and House.</p><p><strong>The friction points</strong></p><ul><li><strong>Economic pain:</strong> Mortgage rates exceeding 7% and fuel price spikes from the Iran war are alienating rural and middle-class voters.</li><li><strong>Base alienation:</strong> Trump's pro-AI stance and heavy-handed immigration policies are distancing MAGA loyalists and Hispanic voters.</li><li><strong>Legal threats:</strong> Democrats are campaigning on promises to investigate the \"Trump crime family\" and Elon Musk if they seize the House.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1 billion:</strong> The scale of the GOP ad blitz intended to counter Trump's sinking approval ratings.</li><li><strong>$5,000:</strong> The cash payout Trump promised all American adults if Republicans win.</li><li><strong>7%:</strong> The threshold breached by US mortgage rates, intensifying the housing crunch.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Fear over policy:</strong> The Trump-Vance strategy relies on framing Democrats as \"lunatics\" rather than defending specific policy outcomes.</li><li><strong>The money gap:</strong> While billionaires overwhelmingly fund the GOP, the \"message\" is failing to resonate with the electorate.</li><li><strong>Judicial mixed bag:</strong> The Supreme Court enabled voter immigration vetting but blocked Trump's mail-in ballot restrictions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate focus:</strong> The Georgia race is emerging as a national bellwether and a potential 2028 presidential audition for Jon Ossoff.</li><li><strong>Private equity backlash:</strong> Institutional investors in the housing market are becoming primary targets for campaign attacks.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's stronghold in eastern Germany.</p><p><strong>Why it matters:</strong></p><ul><li><strong>Power vacuum:</strong> Regional election disasters have hobbled Merz's authority in Brussels, jeopardizing the EU's €2tn budget deal.</li><li><strong>Rightward shift:</strong> The AfD's surge reflects a deep emotional faultline in reunified Germany, fueled by nostalgia and disillusionment among young voters.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share in the next federal polls.</li><li><strong>Three seats:</strong> The margin preventing the AfD from leading a regional government in Saxony-Anhalt.</li><li><strong>40,000:</strong> Employees the Finance Ministry is fighting to protect at Commerzbank's Frankfurt HQ.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Succession planning:</strong> Hendrik Wüst, premier of North Rhine-Westphalia, is positioning himself as the \"chancellor-in-waiting\" through high-profile diplomatic moves.</li><li><strong>Geopolitical leverage:</strong> The Kremlin and Trump administration are actively cheering the AfD's rise to weaken Western cohesion on Ukraine.</li><li><strong>Unlikely alliances:</strong> The hard-left BSW party has emerged as a potential kingmaker, complicating the path to stable regional coalitions.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Internal CDU struggle:</strong> Merz must decide whether to pivot policy or risk a leadership challenge from within his own party.</li><li><strong>Security pivots:</strong> Berlin will likely accelerate \"guerrilla\" arms procurement for Ukraine to signal resolve despite domestic instability.</li></ul>", "central banks": "<p>Central banks are shifting from traditional inflation-fighting to managing systemic security and geopolitical instability.</p><p><strong>Why it matters:</strong> Reliance on interest rates alone is proving insufficient against supply-side shocks and foreign cyber threats, forcing a rethink of central bank mandates.</p><p><strong>The security gap</strong></p><ul><li>  <strong>Fed vulnerabilities:</strong> Watchdogs warn of \"breakdowns and deficiencies\" in U.S. central bank security, leaving it exposed to foreign adversaries.</li><li>  <strong>Financial contagion:</strong> The Fed and BoE are intensifying scrutiny of prime brokers following significant losses at AI-focused hedge funds.</li></ul><p><strong>Policy pivots</strong></p><ul><li>  <strong>Beyond demand:</strong> New consensus suggests monetary policy impacts supply, not just demand.</li><li>  <strong>Tool exhaustion:</strong> Critics argue rate hikes are \"the only game in town\" but are ineffective against climate and geopolitical shocks.</li><li>  <strong>QT endgame:</strong> The Bank of England has set a multiyear plan to unwind gilt purchases by 2034.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li>  <strong>Dollar dominance:</strong> Saudi Arabia's exit from China's cross-border currency platform signals a setback for Beijing's efforts to bypass the dollar.</li><li>  <strong>Currency volatility:</strong> The Yen continues to sink despite BoJ rate hikes, forcing threats of direct market intervention.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Leadership shifts:</strong> Isabel Schnabel's move to the IMF will trigger a reshuffle at the ECB.</li><li>  <strong>Mandate reviews:</strong> UK MPs are questioning if the BoE's remit is \"fit for purpose\" amid rising populist pressure.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven revenue and deregulation while managing the fallout from the Silicon Valley Bank collapse.</p><p><strong>Why it matters:</strong> Wall Street is aggressively shifting capital toward AI infrastructure and asset management to offset slowing trading revenues and regulatory volatility.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Revenue streams:</strong> Goldman Sachs earned $200M+ in fees from AI-focused hedge fund Situational Awareness.</li><li><strong>Infrastructure:</strong> Banks are offloading $15B in debt for Anthropic data centers to free up lending capacity.</li><li><strong>Cost cutting:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven efficiency.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB Aftermath:</strong> A White House review blamed a \"culture of risk aversion\" among regulators for mishandling the SVB collapse.</li><li><strong>Crypto:</strong> Regulators granted a banking license to the Trump family's crypto venture.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Expansion:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3B to grow its asset management arm.</li><li><strong>Political alignment:</strong> Bank of America pledged $250B to US projects to align with the \"America First\" agenda.</li><li><strong>Tech adoption:</strong> BNY is implementing blockchain for record-keeping to integrate traditional and digital assets.</li></ul><p><strong>Between the lines</strong> The \"trading bonanza\" is cooling. Banks are diversifying into wealth management and private credit to sustain growth as record-breaking Q2 revenues fade.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>30 Sep 2026 16:36 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
