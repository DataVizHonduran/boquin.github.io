.tag-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}

.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}

.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}

.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;

.summary-banner-inner strong{color:#0f172a}
.summary-banner-inner p{margin:.4rem 0}

.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8ecf2;
  display:flex;flex-direction:column;gap:.6rem;transition:box-shadow .18s}

.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}

.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;

.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}

rong> Intelligence reports indicate \"advanced stage\" plots to target U.S. citizens in the region.</li><li><strong>U.S. Strategy:</strong> Washington is preparing for a long-term standoff, demanding a \"meaningful agreement\" on Tehran's nuclear program.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$117:</strong> The price of oil, hitting a peak not seen since April due to Iran hostilities.</li><li><strong>36%:</strong> Turkey's new benchmark interest rate following a cut despite investment scandals.</li><li><strong>$10,000:</strong> The cost of Turkey's Aselsan drone defense system, now deployed in nine countries.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Energy:</strong> Rising fuel costs are driving U.S. inflation expectations higher.</li><li><strong>Travel:</strong> American Airlines warns airfares will not return to pre-war levels.</li><li><strong>Food:</strong> A crisis in the Strait of Hormuz, combined with El Niño, could trigger a global \"food shock.\"</li></ul><p><strong>Between the lines</strong> Netanyahu is fighting a two-front war: a military struggle with Iran and a political battle for survival. He faces a \"knife-edge\" election race against former military chief Gadi Eisenkot and internal friction from far-right allies.</p><p><strong>What's next</strong> Watch the Israeli election results next week. The outcome will determine if Israel pursues a more aggressive military posture or shifts toward a diplomatic stalemate.</p>", "shipping": "<p>Global shipping is entering a period of extreme volatility driven by Middle East conflict and Russian sanctions evasion.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz are choking oil flows and spiking operational costs, forcing a systemic rerouting of global trade.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers.</li><li><strong>$100,000:</strong> Monthly salary for captains transiting the Strait of Hormuz.</li><li><strong>24 vessels:</strong> Number of ships targeted by Iran in a two-week window.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM, while Trafigura is IPOing its shipping arm to capitalize on record rates.</li><li><strong>Deception tactics:</strong> Russia is using coordinated \"spoofing\" to fake ship locations and expanding its own fleet to bypass Western sanctions.</li><li><strong>Market distortion:</strong> Old supertankers now command higher premiums than new builds because immediate availability outweighs vessel age.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Price shocks:</strong> Vitol warns of a tanker shortage that could push oil toward $200 a barrel.</li><li><strong>Security shifts:</strong> The U.S. is moving to \"time slot\" air defense for tankers to manage increased Iranian aggression.</li><li><strong>Green transition:</strong> Falling biodiesel prices and the rise of ammonia/methanol may accelerate decarbonization despite geopolitical chaos.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative tool to a disruptive economic force, triggering simultaneous workforce anxiety and regulatory urgency.</p><p><strong>Why it matters:</strong> Rapid deployment is creating a \"productivity paradox\" where corporate efficiency gains—such as Barclays' 5,000 job cuts—directly fuel youth unemployment fears and systemic instability.</p><p><strong>The economic shift</strong></p><ul><li><strong>Valuation volatility:</strong> OpenAI lowered its valuation target to $1.25tn, signaling a potential cooling of peak hype.</li><li><strong>Infrastructure costs:</strong> Massive capital flows into data centers are being funded by broad global investment pools, though some firms (e.g., NextDC) are seeing sharp profit warnings.</li><li><strong>Labor restructuring:</strong> Anthropic is shifting hiring away from junior staff toward managers as AI agents automate entry-level tasks.</li></ul><p><strong>The risk landscape</strong></p><ul><li><strong>Biosecurity:</strong> The UK established a dedicated AI lab to prevent the creation of synthetic viruses and bioweapons.</li><li><strong>Cybersecurity:</strong> Amazon warns that AI models from OpenAI and Google are being used to exploit severe software flaws globally.</li><li><strong>Accountability:</strong> Experts are calling for \"Know Your Agent\" rules to establish legal liability for autonomous software.</li></ul><p><strong>Between the lines</strong> Current regulatory frameworks are insufficient. Because AI evolves faster than traditional banking or financial models, governments are struggling to balance innovation with safety.</p><p><strong>What's next</strong></p><ul><li><strong>IPO Watch:</strong> A potential Anthropic IPO could serve as a bellwether for the sector's long-term viability.</li><li><strong>Agentic AI:</strong> The focus is shifting from chatbots to \"agents\" that can execute complex tasks, necessitating new trust and control mechanisms.</li></ul>", "us-china relations": "<p>US-China relations have shifted from mutual economic gain to a zero-sum geopolitical struggle.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" cooperation increases the risk of global instability. Competition now dictates trade, security, and diplomatic alliances.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in Washington and Beijing is viewed as lacking the far-sightedness required to prevent escalation.</li><li><strong>Strategic distrust:</strong> High-level summits are seen as tactical necessities rather than a path toward genuine détente.</li><li><strong>The \"Great Game\":</strong> Outcome depends on external forces—economic resilience and third-party alliances—rather than direct confrontation alone.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Economic shift:</strong> The BRICS bloc now commands a larger share of the global economy than the G7.</li><li><strong>Alignment:</strong> US tariffs and sanctions are driving rare consensus among BRICS nations, accelerating a pivot away from US-led systems.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Multilateral pressure:</strong> Smaller powers are increasingly thwarting the agendas of the two superpowers.</li><li><strong>Risk of contagion:</strong> Regional conflicts in Ukraine and the Middle East are compounding the friction between the US and China, raising the specter of a broader global conflagration.</li></ul>", "us elections": "<p>The U.S. midterms are evolving into a high-stakes clash between Republican financial dominance and Democratic polling momentum.</p><p><strong>Why it matters:</strong> Voter anxiety over inflation and government corruption is eroding Trump's \"Make America Cheap Again\" narrative, potentially shifting control of the Senate.</p><p><strong>By the numbers</strong></p><ul><li><strong>$400 million:</strong> Trump's pledged spending for GOP midterm campaigns.</li><li><strong>$80 million:</strong> Mike Bloomberg's donation to Democratic candidates.</li><li><strong>$500 billion:</strong> The proposed military spending boost currently at risk if Democrats sweep.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic disconnect:</strong> Voters are increasingly linking the affordability crisis and rising energy prices to administration policies.</li><li><strong>Legal warfare:</strong> Hundreds of lawyers are mobilizing to prevent election interference, while Trump threatens to block certification in Alaska.</li><li><strong>Strategic pivots:</strong> Trump is easing Canadian tariffs specifically to protect vulnerable Republican Senate candidates.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate volatility:</strong> Markets are betting on a Democratic advantage, though GOP insiders argue pollsters are overstating the \"blue wave.\"</li><li><strong>Wildcards:</strong> The candidacy of Abdul El-Sayed in Michigan could either make history or jeopardize Democratic Senate control.</li><li><strong>Foreign policy:</strong> Trump envoys are meeting with Zelenskyy in Norway to reshape Ukraine strategy ahead of the vote.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz’s dwindling domestic authority weakens Germany's leadership within the EU and stalls critical economic and pension reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Electoral collapse:</strong> Poor regional results in the east and Berlin have left the CDU marginalized in key states.</li><li><strong>Coalition strain:</strong> The resignation of the labor minister signals deepening instability within the government.</li><li><strong>The AfD threat:</strong> The far-right is securing institutional power, including its first regional parliament president.</li></ul><p><strong>Security and Geopolitics</strong></p><ul><li><strong>Russian influence:</strong> Arrests of suspected spies and allegations against a former spymaster highlight Kremlin infiltration.</li><li><strong>Military pivot:</strong> Germany is aggressively rearming and utilizing \"guerrilla units\" to fast-track weapons for Ukraine.</li><li><strong>Diplomatic tension:</strong> High-level meetings with Russia and Turkey reflect a balancing act between deterrence and pragmatism.</li></ul><p><strong>Economic headwinds</strong></p><ul><li><strong>Investment risk:</strong> Executives are wary of the AfD's rise and proposed property seizures by regional governments.</li><li><strong>EU impact:</strong> Merz's instability casts doubt on the EU’s €2tn budget deal.</li></ul><p><strong>What's next:</strong> Watch Hendrik Wüst, the premier of North Rhine-Westphalia. As Merz's popularity plummets, Wüst is emerging as the primary \"chancellor-in-waiting.\"</p>", "central banks": "<p>Central banks are pivoting from inflation fighting to a complex balancing act of financial stability and geopolitical strategy.</p><p><strong>Why it matters:</strong> Persistent inflation and volatile bond markets are forcing policymakers to manage contradictory goals: suppressing prices without triggering systemic bank failures or stifling economic restructuring.</p><p><strong>The current friction</strong></p><ul><li><strong>Rate Volatility:</strong> Markets are pricing in aggressive moves, while the Fed and ECB are actively pushing back against tightening bets to avoid over-correcting.</li><li><strong>Currency Defense:</strong> India has spent ~$90bn in reserves to stabilize the rupee against global headwinds.</li><li><strong>Systemic Risk:</strong> The Financial Stability Board warns most nations lack \"credible backstops\" to handle major bank failures.</li></ul><p><strong>New frontiers</strong></p><ul><li><strong>AI Stability:</strong> The Bank of England is flagging AI agents as a primary threat to financial stability.</li><li><strong>Digital Sovereignty:</strong> The EU is accelerating public digital money to build a geopolitical monetary strategy.</li><li><strong>Gold Hedging:</strong> Central banks hit a two-year high in monthly gold purchases in September, signaling a hedge against fiat volatility.</li></ul><p><strong>Between the lines</strong> The \"credibility gap\" is widening. Between political attacks on the Fed and the erosion of trust in Treasury interventions, central banks are losing their primary tool: the ability to move markets through communication alone.</p><p><strong>What's next</strong></p><ul><li><strong>Fed October:</strong> Market volatility will spike as investors hunt for hints on the next rate decision.</li><li><strong>Energy Lag:</strong> The BoE warns that the full impact of energy prices on corporate margins—and subsequent price hikes—has yet to materialize.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as record trading profits clash with regulatory penalties and AI-driven deposit flight.</p><p><strong>Why it matters:</strong> High-yield competition and AI automation are threatening the traditional low-cost deposit model, while regulatory failures are triggering billion-dollar hits to the bottom line.</p><p><strong>The profit paradox</strong></p><ul><li><strong>Trading wins:</strong> Goldman Sachs saw a 30% rise in Q3 net income, driven by equities and hedge fund borrowing.</li><li><strong>Regulatory costs:</strong> BofA profits dropped 17% following a $1.2bn money laundering fine; Amex was fined $350mn for similar systemic failures.</li><li><strong>The cooldown:</strong> Analysts forecast a sharp slowdown in trading revenue following a record-breaking start to the year.</li></ul><p><strong>The AI threat</strong></p><ul><li><strong>Deposit flight:</strong> Banks are restricting AI agents to prevent chatbots from automatically shifting billions in deposits to higher-yielding competitors.</li><li><strong>Cost pressure:</strong> Lenders estimate AI agents could cost the industry $500bn in lost interest margins.</li><li><strong>Vendor leverage:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the hours required for routine law work.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>China expansion:</strong> Citi received long-awaited approval for its China securities business ahead of US-China diplomatic meetings.</li><li><strong>Talent war:</strong> Citi is shortening its analyst program to two years to prevent private equity firms from poaching junior talent.</li><li><strong>New competition:</strong> Tech-focused startup Erebor has surged to $7bn in deposits, targeting the /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>25 Oct 2026 14:31 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
