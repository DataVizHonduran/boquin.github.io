const SUMMARIES = {"oil and gas": "<p>AI-driven data center demand is forcing a massive pivot back to fossil fuel power generation.</p><p><strong>Why it matters:</strong> The energy intensity of AI training is outpacing renewable deployment. This creates a paradox where Big Tech's climate goals are sidelined by the immediate need for grid stability and \"large load\" power.</p><p><strong>The AI energy surge</strong></p><ul><li><strong>Infrastructure boom:</strong> US power sector M&A has hit a record $200B as firms race to build data center energy grids.</li><li><strong>Fossil fuel return:</strong> US spending on fossil fuel power is set to surpass China's for the first time in decades, driven by a surge in gas turbines.</li><li><strong>Grid strain:</strong> FERC has issued a 60-day ultimatum to grid operators to justify how they connect these massive energy loads.</li></ul><p><strong>Global energy shifts</strong></p><ul><li><strong>Canada:</strong> Planning a new pipeline to Asia (1mn barrels/day) to reduce reliance on the US.</li><li><strong>EU:</strong> Gas stocks risk hitting a 15-year low heading into winter due to slow refills.</li><li><strong>Falklands:</strong> Commercial oil production slated for 2028, sparking diplomatic tension with Argentina.</li></ul><p><strong>Between the lines:</strong> The \"green transition\" is hitting a physical wall. While battery start-ups see \"crazy\" demand to smooth power surges, the baseline power is returning to gas and coal to prevent the kind of blackouts seen during recent US heat domes.</p><p><strong>What's next:</strong> Watch for further EU regulatory retreats. The EU is already weighing weaker climate rules for data centers following heavy Big Tech lobbying.</p>", "corporate earnings and results": "<p>Wall Street analysts are aggressively raising S&P 500 profit forecasts.</p><p><strong>Why it matters:</strong> Expectations are growing at the fastest rate since the post-pandemic rebound, sparking fears of an \"earnings bubble\" where stock prices decouple from actual performance.</p><p><strong>By the numbers:</strong></p><ul><li><strong>$50 million:</strong> Estimated loss for DraftKings due to high-scoring star players in the World Cup.</li><li><strong>$200 million:</strong> Value of Renk's acquisition of David Brown Defence.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Corporate instability:</strong> Leadership turmoil is hitting major firms, evidenced by the boardroom battle at Ocado and the abrupt exit of a top CEO contender at JPMorgan.</li><li><strong>Operational pivots:</strong> Neobanks like Starling are cutting \"duplicate\" roles to protect margins as profits dip.</li></ul><p><strong>What's next:</strong> Investors will scrutinize upcoming quarterly reports to see if corporate earnings can justify the surging analyst projections.</p>", "middle east war": "<p>The death of Supreme Leader Ali Khamenei has triggered a volatile transition in Iran, destabilizing a fragile ceasefire with the U.S.</p><p><strong>Why it matters:</strong> A power vacuum in Tehran increases the risk of miscalculation. Recent strikes in Bahrain and Kuwait prove that regional instability can rapidly escalate into a broader conflict.</p><p><strong>The current state of play</strong></p><ul><li><strong>Fragile Truce:</strong> The U.S. claims a deal to halt strikes is in place, but Tehran disputes the terms.</li><li><strong>Regional Spillover:</strong> Hizbollah is rejecting a U.S.-backed peace deal with Israel, while Syria begins dismantling Assad-era legislation.</li><li><strong>Maritime Crisis:</strong> Sea mines in the Strait of Hormuz have slashed shipping traffic to 50% of pre-war levels.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Markets:</strong> U.S. stocks saw their biggest quarterly gain in six years despite the volatility.</li><li><strong>Defense:</strong> NATO allies are under pressure from the U.S. to increase spending to maintain security guarantees.</li><li><strong>Trade:</strong> Maersk reports higher profits as U.S. companies stockpile goods to avoid looming tariffs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Succession:</strong> The scale and organization of Khamenei's funeral will signal the regime's internal stability.</li><li><strong>Diplomacy:</strong> High-level U.S. envoys in Doha are attempting to formalize a deal to prevent further escalation.</li></ul>", "shipping": "<p>Global shipping is facing a volatile transition as geopolitical conflicts in the Strait of Hormuz collide with shifting U.S. trade policy.</p><p><strong>Why it matters:</strong> Instability in key maritime chokepoints and looming tariffs are driving extreme price swings and forcing logistics giants to restructure.</p><p><strong>The Hormuz Crisis</strong> A recent blockade and subsequent fragile US-Iran accord have left the industry in limbo:</p><ul><li><strong>The Backlog:</strong> Nearly 1,200 ships carrying $125B in goods were stranded.</li><li><strong>The Cost:</strong> Iran is now seeking to implement \"insurance fees\" for passage.</li><li><strong>The Risk:</strong> Tanker owners fear a market crash after record profits driven by the conflict.</li></ul><p><strong>Trade & Geopolitics</strong> Political instability is reshaping supply chains and vessel operations:</p><ul><li><strong>Tariff Rush:</strong> Shipping rates have hit their highest levels since the 2024 Red Sea crisis as firms race to beat new Trump tariffs.</li><li><strong>Shadow Fleets:</strong> The UK is aggressively intercepting Russian \"shadow fleet\" tankers to curb war funding.</li><li><strong>Strategic Shifts:</strong> FedEx is selling its logistics unit to France's CMA CGM for $1.4B to strengthen US-EU supply chain links.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$125B:</strong> Value of goods stranded during the Hormuz closure.</li><li><strong>400+:</strong> Ships currently waiting for the strait to fully reopen.</li><li><strong>$1.4B:</strong> Value of the FedEx logistics unit sale to CMA CGM.</li></ul><p><strong>What's next</strong> Market stability depends on whether the US-Iran deal remains \"material\" enough to restore owner confidence. Expect continued volatility in freight rates as the window for pre-tariff shipments closes.</p>", "artificial intelligence": "<p>AI is shifting from a theoretical gold rush to a period of intense regulatory and physical friction.</p><p><strong>Why it matters:</strong> The rapid deployment of AI is hitting \"real-world\" walls—including power grid constraints, political backlash, and systemic financial risks—forcing a pivot toward governance and specialized utility.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Physical limits:</strong> Local protests are killing infrastructure projects, such as Blackstone’s Virginia data center.</li><li>  <strong>Market instability:</strong> The Bank of England warns of \"herding behavior\" in AI trading, suggesting a need for emergency kill switches.</li><li>  <strong>Legal overload:</strong> AI-generated employment claims are flooding tribunal systems, threatening to break judicial capacity.</li></ul><p><strong>The political game</strong></p><ul><li>  <strong>US Hegemony:</strong> Sam Altman is pushing for a US-led world order to maintain an American oligopoly.</li><li>  <strong>Strategic pivots:</strong> OpenAI is exploring a 5% stake for the Trump administration to mitigate political pressure.</li><li>  <strong>Global divergence:</strong> The UK is shifting focus toward local community utility, while Europe struggles with regulatory red tape.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Standardization:</strong> The White House is accelerating AI model standards to prevent erratic rollouts.</li><li>  <strong>Verticalization:</strong> Companies are moving toward high-revenue niches, evidenced by Anthropic’s \"Claude Science\" for pharma.</li><li>  <strong>Arms control:</strong> Debate continues on whether a US-China safety deal is possible or if competition precludes cooperation.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony as the post-WWII world order collapses.</p><p><strong>Why it matters:</strong> The shift from multilateral cooperation to \"might is right\" geopolitics increases the risk of global economic instability and direct military conflict.</p><p><strong>Between the lines</strong></p><ul><li>  <strong>Economic warfare:</strong> The IMF warns that \"tit-for-tat\" trade barriers are self-defeating and threaten global growth.</li><li>  <strong>Resource leverage:</strong> Beijing is weaponizing critical minerals, evidenced by recent rare earth smuggling detentions and export controls.</li><li>  <strong>Leadership vacuum:</strong> Washington is retreating from global responsibilities, but Beijing has not yet stepped forward to provide a stable alternative.</li><li>  <strong>Strategic pivots:</strong> China is leveraging Russia's isolation to create a one-sided partnership, expanding its influence over Eurasia.</li></ul><p><strong>The ripple effect</strong></p><ul><li>  <strong>Allied friction:</strong> U.S. unpredictability is straining NATO and pushing European allies toward strategic autonomy.</li><li>  <strong>Middle power anxiety:</strong> Nations like Japan and Germany are aggressively forging new alliances to survive the great power stalemate.</li><li>  <strong>Maritime risk:</strong> Competition is shifting toward \"narrow seas\" and vulnerable waterways to secure trade routes.</li></ul><p><strong>What's next:</strong> Watch for increased volatility in critical mineral supply chains and a potential restructuring of G7 coordination as leaders attempt to manage a \"simultaneity nightmare\" of overlapping global crises.</p>", "us elections": "<p>Internal fractures and economic discontent are reshaping the US electoral landscape ahead of the midterms.</p><p><strong>Why it matters:</strong> Ideological volatility within both parties is creating unpredictable general election matchups. Economic instability and foreign policy disputes are eroding traditional voter loyalty.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive surge:</strong> Democratic socialists are winning primaries in Colorado and New York, challenging party establishment leadership.</li><li><strong>Internal turmoil:</strong> The DNC attributes previous losses to a lack of unity within the Biden-Harris administration.</li><li><strong>Candidate risk:</strong> In Maine, the victory of a controversial outsider over an incumbent signals a shift toward anti-establishment sentiment.</li></ul><p><strong>The Republican gamble</strong></p><ul><li><strong>MAGA dominance:</strong> Trump maintains a strong grip on the GOP base, evidenced by Ken Paxton’s primary victory in Texas.</li><li><strong>General election risk:</strong> Democrats believe Trump-backed candidates may lack broad appeal outside the MAGA core, potentially putting Senate seats in play.</li><li><strong>Intra-party friction:</strong> Republican senators are resisting Trump’s proposed $1.8bn \"anti-weaponisation\" fund.</li></ul><p><strong>Key vulnerabilities</strong></p><ul><li><strong>Inflation:</strong> Polls show voters increasingly blame Trump for high grocery prices and the cost of living.</li><li><strong>Industry revolt:</strong> Tariffs and fuel costs are alienating key demographics, such as Maine lobster fishermen.</li><li><strong>Base erosion:</strong> Some evangelical voters are questioning if Trump’s rhetoric aligns with Christian values.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California Governor race:</strong> A showdown between Steve Hilton and Xavier Becerra will serve as a bellwether for MAGA appetite.</li><li><strong>Foreign policy:</strong> Congressional efforts to rein in Trump's war powers regarding Iran indicate growing bipartisan disquiet over Middle East escalation.</li></ul>", "german politics": "<p>Germany is pivoting toward aggressive fiscal deregulation and military restructuring amid rising domestic instability.</p><p><strong>Why it matters:</strong> Chancellor Friedrich Merz is attempting to shock-start a stagnant economy while navigating a volatile security landscape and a surging far-right.</p><p><strong>The economic pivot</strong></p><ul><li><strong>Tax cuts:</strong> Merz proposed €10bn in tax relief to stimulate growth.</li><li><strong>Pension reform:</strong> Berlin is pursuing a Swedish-style public fund to invest contributions in capital markets.</li><li><strong>Spending discipline:</strong> The Finance Ministry will penalize agencies that fail to deploy the €500bn infrastructure fund.</li><li><strong>Privatization:</strong> The government is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Defense and security friction</strong></p><ul><li><strong>Procurement chaos:</strong> Berlin scrapped the F126 frigate program due to cost overruns but is overhauling its arms agency to speed up spending.</li><li><strong>Strategic shifts:</strong> Germany is seeking new fighter jet partners after distancing itself from France.</li><li><strong>Geopolitical tension:</strong> Relations with the U.S. have hit a low, though Berlin is still pursuing Tomahawk missile acquisitions.</li><li><strong>Internal threats:</strong> Intelligence agencies warn of rising left-wing terrorism fueled by Middle East tensions and far-right extremism.</li></ul><p><strong>Political volatility</strong></p><ul><li><strong>AfD surge:</strong> The far-right party leads opinion polls by leveraging voter anger over fuel prices and maintaining ties with the Kremlin.</li><li><strong>Internal CDU strife:</strong> Merz faces a potential \"chancellor swap\" challenge from the more popular Hendrik Wüst.</li><li><strong>Cultural war:</strong> The AfD is reviving Nazi-era attacks on the Bauhaus movement to push a \"patriotic culture\" agenda.</li></ul><p><strong>What's next:</strong> Watch for the KNDS tank maker IPO and the Bundestag's decision on the Strait of Hormuz mission, both of which will signal Berlin's actual capacity for rapid military deployment.</p>", "central banks": "<p>Central banks are navigating a volatile transition as new leadership and diverging inflation paths reshape global monetary policy.</p><p><strong>Why it matters:</strong> Shifts in communication and regulatory frameworks are increasing market volatility and threatening the traditional independence of monetary authorities.</p><p><strong>The Warsh Effect</strong> New Fed Chair Kevin Warsh is pivoting away from traditional guidance, creating immediate friction:</p><ul><li><strong>Guidance Gap:</strong> Warsh is axing \"dot plots\" and forward guidance, leading investors to warn of higher borrowing costs.</li><li><strong>AI Optimism:</strong> He views AI as a primary driver for productivity-based growth.</li><li><strong>Independence:</strong> Despite political pressure, Warsh maintains a strict focus on price stability and institutional autonomy.</li></ul><p><strong>Global Divergence</strong> Central banks are no longer moving in lockstep:</p><ul><li><strong>ECB:</strong> President Lagarde signals a shift away from the \"force\" used in 2022-23, though modest rate hikes remain possible.</li><li><strong>Bank of England:</strong> Moving to limit hedge fund leverage to stabilize the gilt market, despite risks to funding costs.</li><li><strong>Bank of Japan:</strong> Maintaining ambiguity on currency intervention as the yen hits 40-year lows.</li></ul><p><strong>Between the lines</strong> The era of predictable \"Fedspeak\" is ending. Warsh’s preference for fundamental data over explicit signaling is shifting the burden of risk onto traders, increasing the likelihood of market surprises.</p><p><strong>What's next</strong></p><ul><li><strong>Legal Precedents:</strong> The Supreme Court's block on firing Fed Governor Lisa Cook reinforces the legal shield around central bank independence.</li><li><strong>Asset Shift:</strong> Sovereign wealth funds are rotating from public markets into private credit and infrastructure to capture AI growth.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and pursue aggressive international growth.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing lenders to increase investor payouts and acquisitions while simultaneously increasing systemic risk.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital gain for top US and UK banks due to regulatory loosening.</li><li><strong>$700 billion:</strong> Potential losses US banks would face in a severe economic crash, per Fed stress tests.</li><li><strong>$114 billion:</strong> Revenue for non-bank trading firms (e.g., Citadel, Jane Street) now competing with Wall Street.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon says JPMorgan could deploy.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory Arbitrage:</strong> US banks are gaining a competitive edge over EU and Swiss rivals who remain constrained by stricter capital rules.</li><li><strong>Internal Volatility:</strong> Leadership instability is surfacing at top firms, evidenced by succession shifts at JPMorgan and executive departures at Goldman Sachs.</li><li><strong>Geopolitical Hedging:</strong> Banks are balancing growth in China with extreme security measures, such as Morgan Stanley issuing China-only iPhones to protect data.</li></ul><p><strong>What's next</strong></p><ul><li><strong>European Expansion:</strong> JPMorgan is aggressively pushing its digital bank into France, Spain, and Italy.</li><li><strong>Risk Transfer:</strong> Lenders are seeking to offload billions in private equity-linked loans as the PE market slows.</li><li><strong>Lobbying Push:</strong> Wall Street is pressing regulators for further easing of Basel capital rules to maximize balance sheet flexibility.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>03 Jul 2026 12:25 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
