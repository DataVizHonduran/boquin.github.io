const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Trump's proposed ban on U.S. diesel exports is triggering a global energy price shock.</p><p><strong>Why it matters:</strong></p><ul><li><strong>Supply crunch:</strong> Europe relies on U.S. diesel to offset Russian losses; a ban would cause \"catastrophic\" price spikes for EU motorists.</li><li><strong>Political risk:</strong> High energy costs are fueling far-right surges across European capitals.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>€30:</strong> The average increase per tank for European drivers.</li><li><strong>$1.2M:</strong> Record daily cost for oil tankers due to Middle East instability.</li><li><strong>$22B:</strong> South Korea's investment in a Texas gas plant to curry favor with the Trump administration.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Internal strife:</strong> The $60B Exxon-Pioneer merger is fracturing, with founder Scott Sheffield alleging a \"smear campaign\" by Exxon leadership.</li><li><strong>Sanction leaks:</strong> Rosneft is allegedly using hard currency to fund Kremlin-backed money laundering networks to bypass Western sanctions.</li><li><strong>Infrastructure gap:</strong> The UN warns that global power grids require massive investment to sustain both AI data center growth and climate goals.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>UK pressure:</strong> British officials are lobbying Trump to avoid an export ban as domestic pump prices approach record highs.</li><li><strong>Energy pivot:</strong> Italy is reviving nuclear power to diversify its energy mix and reduce reliance on volatile imports.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are being reshaped by a collision of AI infrastructure costs and systemic security risks.</p><p><strong>Why it matters:</strong> Companies are facing a \"double squeeze\" where the massive capital expenditure required for AI is being undermined by new, costly vulnerabilities like \"LLM-jacking.\"</p><p><strong>The AI Trade-off</strong></p><ul><li><strong>Infrastructure vs. Climate:</strong> AI power demand is disrupting global energy markets, shifting corporate focus from emissions cuts to energy procurement.</li><li><strong>Retail Guardrails:</strong> Walmart is explicitly rejecting AI-driven personalized pricing to avoid consumer backlash, limiting a potential revenue lever.</li><li><strong>Security Costs:</strong> A surge in AI-targeted cybercrime is driving a spending boom in cybersecurity stocks as firms scramble to protect costly AI resources.</li></ul><p><strong>Market Consolidation</strong></p><ul><li><strong>Chemicals:</strong> BASF's approach for Evonik signals a push to consolidate Europe's fragmented chemicals sector to gain scale.</li><li><strong>Telecoms:</strong> Apax is nearing a deal for Odido after a planned public listing was shelved due to market instability.</li><li><strong>Fintech:</strong> Monzo's talks with Nubank and private equity highlight a trend toward consolidation in the digital banking space.</li></ul><p><strong>Between the lines</strong> The \"AI honeymoon\" is ending. Earnings are no longer driven by the mere promise of AI, but by the ability to manage its immense energy requirements and security liabilities.</p>", "middle east war": "<p>The Middle East is entering a volatile phase of high-stakes diplomacy and economic warfare.</p><p><strong>Why it matters:</strong> Escalating U.S. sanctions on Iran are triggering immediate logistical collapses and corporate flight, while simultaneous ceasefire talks create extreme volatility in global energy markets.</p><p><strong>The diplomatic friction</strong></p><ul><li><strong>Sanctions pressure:</strong> The UAE, Iraq, Oman, and Azerbaijan have halted flights to Iran following U.S. threats to shut down non-compliant airlines.</li><li><strong>Fragile talks:</strong> The U.S. and Iran held their first direct meetings since June, with Iran proposing a seven-day ceasefire to reopen the Strait of Hormuz.</li><li><strong>Corporate anxiety:</strong> HSBC moved a board meeting from Dubai to London, citing safety concerns as the Iran conflict persists.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Oil volatility:</strong> Brent crude fell below $99 a barrel, marking its longest losing streak in over a year as ceasefire talks fluctuate.</li><li><strong>Investment hurdles:</strong> Wall Street boutiques are resisting Saudi Arabia’s regional headquarters rules, stalling a key government initiative.</li><li><strong>Fiscal pressure:</strong> Surging government bond yields are increasing debt interest bills globally, according to the OECD.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Israel:</strong> The government is using archaeology to seize West Bank land and barring main Arab parties from upcoming elections.</li><li><strong>Syria:</strong> Citizens remain divided between the desire for justice for past crimes and the fear of renewed violence.</li></ul><p><strong>What's next:</strong> Market stability depends on whether the Iranian ceasefire proposal is accepted or if the U.S. accelerates \"annihilation\" rhetoric and sanctions.</p>", "shipping": "<p>Global shipping is entering a period of structural instability driven by geopolitical conflict and climate volatility.</p><p><strong>Why it matters:</strong> The collapse of traditional maritime rules and the rise of \"shadow fleets\" are decoupling global trade from international law, increasing systemic risk for insurers and operators.</p><p><strong>The Geopolitical Chokepoints</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iranian attacks and U.S. military restrictions have turned a primary energy artery into a high-risk zone, forcing cargo to find alternative routes.</li><li><strong>Panama Canal:</strong> El Niño-driven droughts are forcing transit cuts, straining trade flows already disrupted by Middle East instability.</li><li><strong>Arctic Route:</strong> South Korea is accelerating polar sea highway development to bypass traditional chokepoints and reduce reliance on the Middle East.</li></ul><p><strong>The \"Shadow\" Economy</strong></p><ul><li><strong>Russia:</strong> Moscow expanded its fleet by 33% to bypass Western sanctions on fossil fuel exports.</li><li><strong>Regulatory Gaps:</strong> UK insurers are utilizing legal loopholes to cover tankers carrying Russian gas despite government restrictions.</li><li><strong>Institutional Shift:</strong> Long-term investors are pivoting to shipping \"hard assets\" as Middle East conflicts drive short-term returns.</li></ul><p><strong>The Green Transition</strong></p><ul><li><strong>Fuel Shift:</strong> Biodiesel is now cheaper than conventional fuels, accelerating the move toward emissions targets.</li><li><strong>Tech Pivot:</strong> Maersk is deploying wind sails; the industry is eyeing clean ammonia and methanol to cut greenhouse gases.</li><li><strong>Nuclear Ambition:</strong> The U.S. is planning a nuclear-powered merchant fleet by 2028 to challenge China's shipbuilding dominance.</li></ul><p><strong>Emerging Risks</strong></p><ul><li><strong>Cybersecurity:</strong> Hackers are targeting satellite links connected to critical engine and navigation \"edge devices.\"</li><li><strong>Safety:</strong> Container lines warn that exemptions for small batteries (laptops/power banks) are increasing onboard fire risks.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative tool to a systemic disruptor across global finance, law, and geopolitics.</p><p><strong>Why it matters:</strong> The technology is breaking legacy business models—specifically the legal billable hour—while introducing existential security risks and political volatility.</p><p><strong>The economic shift</strong></p><ul><li><strong>Legal industry:</strong> \"AI-first\" boutiques are dismantling traditional fee structures, forcing established firms to overhaul pricing.</li><li><strong>Consulting:</strong> Deloitte is curbing growth expectations as AI transforms tech consulting delivery.</li><li><strong>Finance:</strong> AI-focused funds, like Situational Awareness, are becoming massive revenue drivers for Wall Street prime brokerages.</li></ul><p><strong>Security and Risk</strong></p><ul><li><strong>Cybersecurity:</strong> OpenAI breaches in Australia signal a rise in \"AI agent\" hacking campaigns during routine data tasks.</li><li><strong>Existential threat:</strong> Bill Gates is calling for urgent U.S. government intervention to prevent catastrophic security failures.</li><li><strong>Privacy:</strong> China is scaling smart glasses, balancing on-device data processing against higher hardware costs.</li></ul><p><strong>The cultural friction</strong></p><ul><li><strong>Intellectual property:</strong> The Prix Goncourt's removal of a novel over AI suspicions highlights a growing crisis of authenticity in the arts.</li><li><strong>Political divide:</strong> Donald Trump’s pro-Big Tech AI stance is alienating segments of his MAGA base.</li><li><strong>Social equity:</strong> Experts warn AI will likely increase wealth inequality rather than create a \"universal abundance.\"</li></ul><p><strong>What's next</strong></p><ul><li><strong>Agentic AI:</strong> Meta’s \"Muse\" launch signals the move toward mass-market AI agents that act autonomously.</li><li><strong>Efficiency wars:</strong> New lean models, such as TypeSafe AI’s \"Jev,\" are challenging the dominance of OpenAI and Anthropic by prioritizing speed and cost.</li></ul>", "us-china relations": "<p>US–China relations have shifted from strategic competition to a zero-sum struggle for global dominance.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy creates a power vacuum. This instability pushes allies to hedge their bets and empowers authoritarian blocs.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>BRICS ascent:</strong> The bloc now commands a larger share of the global economy than the G7.</li><li><strong>US reliability:</strong> Scaling back military exercises and defense guarantees in South Korea and Japan is eroding trust in the US security umbrella.</li><li><strong>Institutional flight:</strong> Potential US funding cuts are prompting international organizations to consider leaving Geneva for Gulf or European capitals.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Transactionalism:</strong> Diplomacy is moving from values-based alliances (democracy) to transactional deals.</li><li><strong>AI hegemony:</strong> US dominance in AI hardware ensures power remains centralized in America, regardless of where data centers are physically located.</li><li><strong>Internal friction:</strong> A divide is growing between US hawks in Congress and a more cooperative outlook held by Trump and Gen Z voters.</li></ul><p><strong>What's next</strong></p><ul><li><strong>BRICS consolidation:</strong> Expect increased unity among BRICS nations as a hedge against US sanctions and tariffs.</li><li><strong>Regional realignment:</strong> Japan and South Korea may be forced to develop \"Plan B\" security strategies independent of Washington.</li><li><strong>Escalation risks:</strong> Beijing is signaling readiness to use \"all necessary measures\" if US sanctions expand.</li></ul>", "us elections": "<p>Republicans are spending billions to insulate midterm candidates from Donald Trump’s plummeting approval ratings.</p><p><strong>Why it matters:</strong> Economic volatility and inflammatory rhetoric are alienating key demographics, threatening GOP control of the Senate and House.</p><p><strong>The economic drag</strong></p><ul><li><strong>Mortgage rates:</strong> Have breached 7%, squeezing home affordability.</li><li><strong>Fuel prices:</strong> Hit Labor Day record highs due to the Iran war, rattling rural voters.</li><li><strong>The \"Dividend\":</strong> Trump promised a $5,000 payout to all adults if Republicans win to offset inflation anxiety.</li></ul><p><strong>The political friction</strong></p><ul><li><strong>Voter betrayal:</strong> Hispanic voters report feeling abandoned by heavy-handed immigration policies.</li><li><strong>Internal rift:</strong> GOP candidates fear Trump has become \"toxic\" on the campaign trail.</li><li><strong>Legal battles:</strong> The Supreme Court allowed immigration status vetting for voters but rejected mail-in ballot restrictions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1 billion:</strong> The scale of the GOP ad blitz to counter Trump's unpopularity.</li><li><strong>Millions:</strong> The amount being poured into the race by Trump and Elon Musk’s Super PACs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Democratic strategy:</strong> If they seize Congress, Democrats vow to probe the \"Trump crime family,\" including the president's sons and Elon Musk.</li><li><strong>The 2028 pipeline:</strong> Jon Ossoff’s lead in Georgia is positioning him as a future presidential contender.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival following a devastating surge of the far-right AfD in regional elections.</p><p><strong>Why it matters:</strong> The collapse of the political center weakens Germany's leadership in the EU and emboldens populist movements across Europe.</p><p><strong>The breakdown</strong></p><ul><li><strong>The AfD Surge:</strong> The far-right party became the largest force in Saxony-Anhalt, fueled by eastern nostalgia and dissatisfaction with Ukraine policy.</li><li><strong>CDU Crisis:</strong> Merz’s party suffered severe losses, including a total wipeout in Mecklenburg-Vorpommern.</li><li><strong>The Kingmaker:</strong> The hard-left BSW party has emerged as a critical power broker in regional coalitions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Brussels Impact:</strong> Merz's diminished domestic authority hobbles his ability to negotiate the EU’s €2tn budget deal.</li><li><strong>The Successor:</strong> Hendrik Wüst, the popular premier of North Rhine-Westphalia, is already being positioned as a viable alternative to Merz.</li><li><strong>Generational Shift:</strong> Younger voters are increasingly disconnected from the historical warnings against fascism and communism.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Federal Pressure:</strong> The AfD is targeting 40% of the vote in the next federal election.</li><li><strong>Survival Mode:</strong> Merz must deliver rapid policy wins to stabilize the center or face a leadership challenge within the CDU.</li></ul>", "central banks": "<p>Central banks are facing a crisis of legitimacy as political pressure and structural economic shifts challenge their independence.</p><p><strong>Why it matters:</strong> The traditional toolkit of interest rate adjustments is proving insufficient for modern shocks, leaving policymakers vulnerable to populist demands and state-directed capital.</p><p><strong>The current friction</strong></p><ul><li><strong>Political pressure:</strong> The Bank of England is under review for its \"fitness for purpose,\" while Donald Trump is publicly demanding Fed rates drop to 1% or less.</li><li><strong>Tool failure:</strong> Critics argue rate hikes are \"the only game in town\" but are ineffective against energy-driven inflation and social-media-skewed expectations.</li><li><strong>Geopolitical shifts:</strong> Saudi Arabia's exit from China's currency platform signals the fragility of efforts to build alternatives to the U.S. dollar.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>2034:</strong> The target date for the Bank of England to fully unwind its quantitative easing gilt purchases.</li><li><strong>1995:</strong> The benchmark for the Bank of Japan's recent rate hike, the highest level seen since then.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Credibility gap:</strong> Incoherent projections (like the Fed's \"dot plot\") and policy errors at the ECB are eroding market trust.</li><li><strong>Institutional instability:</strong> High-profile departures, such as Isabel Schnabel leaving the ECB for the IMF, are triggering leadership reshuffles.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory pivot:</strong> The Fed and BoE are shifting focus toward systemic risk, specifically scrutinizing bank exposure to AI-focused hedge funds.</li><li><strong>The \"State-Directed\" era:</strong> A transition toward finance directed by national governments may permanently end the era of the fully independent central banker.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven infrastructure and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> The sector is transitioning from traditional lending to high-stakes tech financing and digital asset integration to maintain growth as trading revenues cool.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Infrastructure:</strong> Morgan Stanley and other lenders are architecting the debt structures for AI data centers.</li><li><strong>Liquidity:</strong> Banks are offloading $15bn in Anthropic-related debt to free up capacity for more mega-deals.</li><li><strong>Cost pressure:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven efficiency.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB fallout:</strong> Postmortems highlight a \"culture of risk aversion\" among regulators that contributed to the 2023 collapse.</li><li><strong>Crypto integration:</strong> The US government granted a banking license to a Trump family crypto venture, blurring political and financial lines.</li></ul><p><strong>Strategic maneuvers</strong></p><ul><li><strong>Asset growth:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn to expand its asset management footprint.</li><li><strong>Digital evolution:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with tokenized systems.</li><li><strong>Political alignment:</strong> Bank of America pledged $250bn to US projects to align with the \"America First\" agenda.</li></ul><p><strong>Between the lines</strong> Wall Street is increasingly acting as a venture capital arm for AI, but this creates new vulnerabilities. The recent demand for hedge fund collateral as AI stocks tumble suggests the sector is highly sensitive to tech volatility.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>26 Sep 2026 14:43 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
