.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and climate litigation are decoupling oil prices from traditional market fundamentals.</p><p><strong>Why it matters:</strong> Supply chain bottlenecks in the Strait of Hormuz and aggressive climate lawsuits are increasing operational risks for majors, forcing a shift toward diversified offshore assets and critical mineral independence.</p><p><strong>The volatility drivers</strong></p><ul><li><strong>Conflict:</strong> Tanker attacks and Iranian tensions have throttled Hormuz flows, sparking warnings of $200-a-barrel oil.</li><li><strong>Politics:</strong> The U.S. is using diesel releases and red diesel limit easing as levers to combat inflation ahead of midterms.</li><li><strong>Regulation:</strong> The EU is weighing windfall taxes on energy profits, while the U.S. Supreme Court decides if majors are liable for climate damages.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Geographic shifts:</strong> ExxonMobil is targeting Trinidad and Tobago to replicate Guyana's success; Aramco is pivoting to export its gas surplus.</li><li><strong>Resource security:</strong> Houston-based Hertha Metals is attempting to break China's monopoly on high-purity iron for rare earth magnets.</li><li><strong>Risk appetite:</strong> TotalEnergies and other majors are pursuing Middle East investments despite active conflict, viewing disruption as a competitive opportunity.</li></ul><p><strong>Between the lines</strong> Crude futures are losing their utility as an inflationary guide. Market pricing is now driven more by shipping bottlenecks and geopolitical pacts than by raw supply-and-demand metrics.</p><p><strong>What's next</strong></p><ul><li><strong>Legal precedents:</strong> Upcoming Supreme Court rulings will determine the financial liability of \"Big Oil\" for global warming.</li><li><strong>Investment climate:</strong> The UK's stance on North Sea projects (Rosebank/Jackdaw) will signal whether the region remains \"investable\" for foreign capital.</li></ul>", "corporate earnings and results": "<p>Private equity and AI infrastructure are shifting from aggressive expansion to a focus on valuation and sustainability.</p><p><strong>Why it matters:</strong> High interest rates and \"AI jitters\" are cooling the deal market, forcing firms to prioritize lower entry prices over rapid growth.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Nvidia</strong> is pursuing Reflection AI to create a U.S.-based rival to China's DeepSeek.</li><li><strong>Debt fatigue:</strong> Investors are scaling back financing for AI infrastructure following a period of record bond issuance.</li><li><strong>Physical AI:</strong> Developers are shifting focus to \"robot gyms\" to gather real-world training data for robotics.</li></ul><p><strong>Private Equity trends</strong></p><ul><li><strong>Valuation play:</strong> Permira reports that lower valuations and reduced competition are creating opportunities for \"exceptional returns.\"</li><li><strong>Regional bets:</strong> JPMorgan is increasing its bullish stance on UK asset management, while PE firms are funding healthcare expansion in small-city India.</li><li><strong>The struggle:</strong> KKR’s €22bn FiberCop deal in Italy is under pressure due to high debt and customer friction.</li></ul><p><strong>Sector warnings</strong></p><ul><li><strong>Cruise lines:</strong> Shares are dropping as capacity outpaces demand, leading to aggressive price cuts.</li><li><strong>Ski industry:</strong> Vail Resorts reports tumbling profits despite weather-driven demand forecasts.</li><li><strong>Consumer shifts:</strong> UK spending is pivoting rapidly toward subscription models for health tech and pet food.</li></ul><p><strong>What's next:</strong> Watch for a \"flight to quality\" in equity markets as rising yields continue to suppress risk appetite for mid-market deals.</p>", "middle east war": "<p>Regional instability is escalating into a systemic economic and security crisis.</p><p><strong>Why it matters:</strong> Houthi missile capabilities and Iranian naval aggression are directly threatening global energy corridors and aviation hubs, forcing a shift in international risk assessments.</p><p><strong>The security landscape</strong></p><ul><li><strong>Houthi reach:</strong> Deadly strikes on Riyadh airport prove Yemen's militants possess sophisticated long-range capabilities.</li><li><strong>Naval friction:</strong> U.S. and Iranian forces are clashing over blockades in the Gulf of Oman and the Strait of Hormuz.</li><li><strong>Internal instability:</strong> Israel faces deep political polarization and international scrutiny over civilian casualties in Gaza.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>£12 billion:</strong> Estimated hole in British public finances due to war-driven inflation and borrowing costs.</li><li><strong>$50 billion:</strong> Value of the secretive Syrian Sovereign Fund consolidating Assad-linked assets.</li><li><strong>100+:</strong> Flights cancelled in Riyadh following Houthi missile barrages.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic deterrence:</strong> Attacks on Saudi flagship summits threaten the Kingdom's goal of attracting foreign investment.</li><li><strong>Diplomatic fragility:</strong> The conversion of the UK consulate to a \"Mission\" signals a deteriorating relationship between London and Jerusalem.</li><li><strong>Political paralysis:</strong> Election delays in Palestine and leadership challenges in Israel create a vacuum for long-term peace negotiations.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Energy volatility:</strong> Continued attacks on tankers will likely spike global oil prices heading into winter.</li><li><strong>U.S. Pivot:</strong> The White House is attempting to balance naval enforcement with \"productive discussions\" to avoid a full-scale war before midterms.</li></ul>", "shipping": "<p>Global shipping is fracturing into a high-risk, high-cost environment driven by geopolitical conflict and climate instability.</p><p><strong>Why it matters:</strong> War in the Middle East and Arctic melting are forcing a structural redesign of trade routes, spiking operational costs and creating a \"shadow fleet\" that bypasses international law.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>$100,000:</strong> Monthly pay for captains risking the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ice melts and ships avoid conflict zones.</li><li><strong>33%:</strong> Growth in the Russian-flagged fleet to evade Western sanctions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Immediacy over quality:</strong> Old supertankers now command higher prices than new builds because they are available for immediate deployment.</li><li><strong>Security gaps:</strong> The shift toward \"edge devices\" for navigation has opened a new frontier for cyberattacks on satellite links.</li><li><strong>Regulatory collapse:</strong> 18 maritime authorities warn that the rise of shadow fleets and regional wars are dismantling global shipping rules.</li></ul><p><strong>The green pivot</strong></p><ul><li><strong>Cost flip:</strong> Biodiesel is now cheaper than conventional fuels, accelerating the transition to green energy.</li><li><strong>Hybrid tech:</strong> Maersk is integrating wind sails and methanol to hit emissions targets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>IPO wave:</strong> High tanker rates are driving commodities traders, like Trafigura, to take shipping arms public.</li><li><strong>Route shifts:</strong> Continued water shortages in the Panama Canal and volatility in the Hormuz Strait will push more cargo toward the Arctic and alternative hubs.</li></ul>", "artificial intelligence": "<p>AI has transitioned from a speculative tool to a systemic economic and geopolitical driver.</p><p><strong>Why it matters:</strong> Massive capital expenditure is decoupling market valuations from actual revenue, creating a high-stakes bubble. Simultaneously, AI is fundamentally altering labor markets and national security doctrines.</p><p><strong>By the numbers</strong></p><ul><li><strong>$40 billion:</strong> Amount SpaceX is seeking to raise specifically for Nvidia chips.</li><li><strong>$100 billion:</strong> Capital SoftBank is pursuing from Gulf investors to expand AI bets.</li><li><strong>$20 billion:</strong> The gap between OpenAI's reported and actual annualized revenue.</li><li><strong>25%:</strong> Forecasted Q3 growth for US earnings driven by the AI boom.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Financial Fragility:</strong> Investor portfolios are overly concentrated in a single \"AI trade,\" increasing systemic risk if infrastructure returns lag.</li><li><strong>Labor Shift:</strong> Job losses are beginning in call centers, not through mass firings, but through a freeze in new hiring.</li><li><strong>Cognitive Erosion:</strong> The primary risk of generative AI is \"cognitive laziness,\" where users stop verifying outputs.</li><li><strong>Geopolitical Arms Race:</strong> China is aggressively building data centers in Inner Mongolia to secure computing supremacy.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Agentic Shift:</strong> Big Tech is pivoting from chatbots to \"AI agents\" capable of executing complex tasks.</li><li><strong>Political Volatility:</strong> Deepfakes are now integrated into US political attack ads, complicating election integrity.</li><li><strong>Infrastructure Stress:</strong> High borrowing costs and market volatility are already causing AI-backed IPOs to collapse.</li></ul>", "us-china relations": "<p>The U.S.-China relationship has shifted from strategic competition to a zero-sum struggle for global primacy.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy increases the risk of systemic conflict and pushes neutral nations toward alternative power blocs.</p><p><strong>Between the lines</strong></p><ul><li><strong>Eroding Trust:</strong> Trump’s unpredictable approach to allies—including South Korea and Japan—signals a retreat from traditional U.S. security guarantees.</li><li><strong>The BRICS Pivot:</strong> U.S. tariffs and sanctions are driving rare unity among BRICS nations, creating a formal economic counterweight to the G7.</li><li><strong>AI Hegemony:</strong> U.S. dominance in AI hardware creates a centralized power structure that China is actively seeking to disrupt.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>GDP Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li><strong>Diplomatic Cost:</strong> High-level summits between Trump and Xi are viewed as tactical necessities rather than a return to détente.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Flight:</strong> U.S. aid cuts may trigger a migration of UN bodies and NGOs from Geneva to Gulf or European capitals.</li><li><strong>Regional Realignment:</strong> Beijing will likely leverage U.S. instability to strengthen ties with Middle Eastern and Asian partners.</li></ul>", "us elections": "<p>Economic anxiety and internal instability are eroding Donald Trump's lead heading into the midterms.</p><p><strong>Why it matters:</strong> Rising costs and mortgage rates are neutralizing the GOP's economic narrative, while internal campaign turmoil threatens operational stability.</p><p><strong>The economic drag</strong></p><ul><li><strong>Affordability:</strong> Surging fuel prices and a seven-week streak of rising mortgage rates are alienating blue-collar and Rust Belt voters.</li><li><strong>The AI paradox:</strong> Despite a booming macro economy, voter anxiety over AI-driven job displacement is fueling populist backlash.</li><li><strong>Policy pivots:</strong> Trump is considering suspending the federal petrol tax to blunt voter anger over energy costs.</li></ul><p><strong>Political vulnerabilities</strong></p><ul><li><strong>Demographic shifts:</strong> Latino voters remain the primary \"moveable middle,\" while Black voters are mobilizing against GOP-led redistricting.</li><li><strong>Internal chaos:</strong> Trump is weighing the termination of key campaign advisers, Chris LaCivita and James Blair, citing conflicts of interest.</li><li><strong>Ethics scandals:</strong> Backlash over taxpayer-funded campaign ads forced a reversal, with MAGA Inc. now slated to cover costs.</li></ul><p><strong>Between the lines</strong> The GOP is struggling to maintain its industrial heartland coalition. While a Democratic gain in Congress is likely, a divided government may not be enough to derail Trump's core agenda.</p><p><strong>What's next</strong></p><ul><li><strong>Senate battlegrounds:</strong> Focus shifts to Maine and other blue-collar districts to test Trump's appeal.</li><li><strong>Democratic strategy:</strong> A debate persists over whether to prioritize economic messaging or develop a distinct foreign policy platform.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's eastern strongholds.</p><p><strong>Why it matters:</strong> The surge of the AfD creates a power vacuum in regional governments and weakens Germany's leverage in EU budget negotiations.</p><p><strong>The political crisis</strong></p><ul><li><strong>Electoral rout:</strong> The CDU suffered disastrous losses in Mecklenburg-Vorpommern and Berlin, leaving Merz deeply unpopular.</li><li><strong>Far-right ascent:</strong> The AfD secured its first regional parliament president via secret support from established party members.</li><li><strong>Internal fractures:</strong> Allegations surface that regional CDU lawmakers in Saxony-Anhalt traded votes for AfD support.</li></ul><p><strong>The leadership struggle</strong></p><ul><li><strong>The successor:</strong> Hendrik Wüst, premier of North Rhine-Westphalia, is emerging as the \"chancellor-in-waiting\" amid Merz's decline.</li><li><strong>The catalyst:</strong> Younger voters, disconnected from the historical trauma of fascism, are increasingly drawn to radicalism.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Rearmament:</strong> Berlin is aggressively bolstering its arms industry and utilizing a \"guerrilla unit\" for rapid weapons procurement for Ukraine.</li><li><strong>Diplomatic pivots:</strong> Germany is resuming high-level contact with Russia to address drone incursions and de-escalation.</li></ul><p><strong>What's next:</strong> Watch for whether the BSW (hard-left) acts as a kingmaker in eastern coalitions, further isolating the center-right.</p>", "central banks": "<p>Central banks are facing a simultaneous crisis of market volatility, geopolitical instability, and eroding institutional trust.</p><p><strong>Why it matters:</strong> Persistent inflation and rising bond yields are forcing a shift toward tighter monetary policy, while systemic vulnerabilities leave most global economies without adequate safety nets for bank failures.</p><p><strong>The stability gap</strong></p><ul><li><strong>Lack of backstops:</strong> The Financial Stability Board warns only the US, UK, Japan, and Hong Kong have credible public sector tools to handle bank failures.</li><li><strong>AI risk:</strong> The Bank of England warns an AI-driven debt surge could trigger a sharp market correction.</li><li><strong>Security threats:</strong> Watchdogs report \"breakdowns and deficiencies\" in security at the US Federal Reserve, leaving it exposed to foreign adversaries.</li></ul><p><strong>Market turbulence</strong></p><ul><li><strong>Bond rout:</strong> Rising yields are straining national budgets, with France's central bank chief warning the country risks being \"strangled by interest rates.\"</li><li><strong>Policy tension:</strong> Calls are growing for the ECB to pause Quantitative Tightening (QT) to restore stability.</li><li><strong>Treasury risk:</strong> Repeated US Treasury interventions may be creating moral hazard and eroding long-term credibility.</li></ul><p><strong>Divergent paths</strong></p><ul><li><strong>Tightening:</strong> India raised rates for the first time in three years to combat energy costs and inflation.</li><li><strong>Holding:</strong> Fed officials signal a likely hold for October, though markets price in further \"insurance\" increases for 2026.</li><li><strong>External shocks:</strong> The Philippines is bracing for \"Godzilla\" El Niño, which threatens to spike agricultural inflation.</li></ul><p><strong>Between the lines:</strong> The era of central bank autonomy is under siege. Populist political pressure and \"Trump-style\" attacks are damaging public trust, limiting the effectiveness of monetary tools against supply-side shocks.</p>", "us banks": "<p>US banks are pivoting toward AI-driven efficiency and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Banks are shifting from risk-taking to fee-generating services to maintain margins as traditional trading booms fade and AI threatens deposit stability.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>The Risk:</strong> AI agents could cost banks $500bn by enabling savers to automatically migrate funds to higher-yielding accounts.</li><li><strong>The Opportunity:</strong> Banks are demanding lower fees from law firms, arguing AI has reduced the billable hours required for routine work.</li><li><strong>The Exposure:</strong> Wall Street is financing the AI build-out, including a $15bn debt offload for Anthropic data centers.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulatory Trend:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>Compliance Failures:</strong> Amex was fined $350mn for \"systemic\" failures that left $13bn in suspicious transactions unreported.</li><li><strong>Political Ties:</strong> Regulators granted a banking license to the Trump family's crypto venture.</li></ul><p><strong>Strategic Pivots</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is expanding its footprint with a $2.3bn acquisition of ETF provider Neos.</li><li><strong>Talent War:</strong> Citi is shortening junior banker promotion paths to two years to prevent poaching by private equity firms.</li><li><strong>Prime Brokerage:</strong> Banks are increasingly acting as \"cash cows\" for hedge funds, earning massive fees without placing the underlying bets.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500mn:</strong> Special bonuses Goldman is preparing for top executives.</li><li><strong>$7bn:</strong> Deposits attracted by tech-focused startup bank Erebor.</li><li><strong>$250bn:</strong> Bank of America's commitment to \"America First\" US projects.</li><li><strong>38%:</strong> The drop in Shein shares after Goldman invested $220mn.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>11 Oct 2026 16:27 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
