strong>Diplomatic pivot:</strong> Qatar is mediating an interim deal between Washington and Tehran to end the Iran war.</li><li><strong>Market reaction:</strong> Brent crude hit a 10-week low and dropped below $100 as Trump signaled strikes on Iran are \"highly unlikely.\"</li><li><strong>Security risks:</strong> Iran-linked ships are hovering over subsea cables in the Gulf of Oman, threatening digital infrastructure.</li></ul><p><strong>Regional instability</strong></p><ul><li><strong>Saudi Arabia:</strong> Houthi strikes recently damaged a Saudi Aramco office in Riyadh's financial district.</li><li><strong>Israel:</strong> President Isaac Herzog has tasked Gadi Eisenkot with forming a new government.</li><li><strong>Russia:</strong> Moscow continues to deepen military ties with Tehran via missile launcher deals despite the Ukraine conflict.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the Qatar-led negotiations. A formal U.S. withdrawal or policy reversal would likely accelerate Chinese influence in the Gulf and shift the balance of power toward the Iran-Russia axis.</p>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict transforms the world's most vital maritime chokepoints into war zones.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are driving up operational costs, diverting trade to the Arctic, and creating extreme volatility in vessel pricing.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has intensified attacks, targeting 24 vessels in two weeks. Captains now command up to $100,000 monthly to transit the area.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route. Russia is diverting grain to Arctic ports to bypass combat zones.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades and Iranian limpet mine attacks are disrupting oil flows.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel of oil warned by Vitol if tanker shortages persist.</li><li><strong>4x:</strong> The increase in Northern Sea Route transits as ships avoid the Middle East and ice melts.</li><li><strong>24.6M:</strong> Daily barrels of Middle East oil exports, which have climbed back to prewar levels via alternative routes.</li></ul><p><strong>Market distortions</strong></p><ul><li><strong>Asset flip:</strong> Old supertankers are now more valuable than new builds because they are available for immediate delivery.</li><li><strong>Strategic pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM despite a recent 10% share dip.</li><li><strong>Port shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe due to a surge in Chinese EV imports.</li></ul><p><strong>What's next</strong> Expect continued volatility in oil prices as the industry balances increased Gulf production against the physical risk of transit. The viability of the Arctic as a primary trade artery will accelerate as traditional routes remain unstable.</p>", "artificial intelligence": "<p>The AI investment cycle is shifting from blind optimism to a volatile correction.</p><p><strong>Why it matters:</strong> Markets are decoupling AI's long-term potential from immediate stock valuations. Political backlash and infrastructure costs are creating new risks for Big Tech.</p><p><strong>The market shift</strong></p><ul><li><strong>Volatility:</strong> Global indices, including the Nikkei 225, saw sharp drops as investors exited \"AI trades.\"</li><li><strong>Valuation reset:</strong> Investors are no longer pricing in accelerating growth, signaling a transition from a hype cycle to a performance cycle.</li><li><strong>Commodity impact:</strong> Copper prices fell as fears grew that political opposition to data centers will curb demand.</li></ul><p><strong>The political friction</strong></p><ul><li><strong>US backlash:</strong> Voter hostility toward Big Tech influenced recent midterms, forcing Silicon Valley elites to rethink political alliances.</li><li><strong>Global divide:</strong> While the US faces skepticism, the UK is accelerating investment to maintain a competitive edge, and Eastern markets remain optimistic.</li><li><strong>Weaponization:</strong> Russia is utilizing deepfakes to manipulate battlefield narratives, increasing the urgency for AI safety and verification.</li></ul><p><strong>Corporate outlook</strong></p><ul><li><strong>Labor risk:</strong> AI is beginning to target middle management headcount and compensation.</li><li><strong>High-stakes bets:</strong> Despite the rout, Anthropic is pursuing a $1.5tn IPO, and private firms continue to inject billions into AI labs.</li></ul><p><strong>What's next:</strong> Watch for a \"flight to quality\" where capital moves away from speculative AI plays toward companies demonstrating tangible revenue and operational efficiency.</p>", "us-china relations": "<p>US-China relations are entering a volatile era of transactional diplomacy and systemic rivalry.</p><p><strong>Why it matters:</strong> Unpredictable leadership in Washington and Beijing increases the risk of miscalculation. Both powers are prioritizing short-term domestic wins over long-term global stability.</p><p><strong>Between the lines</strong></p><ul><li><strong>Transactionalism over Strategy:</strong> Summits between Trump and Xi focus on immediate deals rather than a sustainable détente.</li><li><strong>The \"Middle Power\" Shift:</strong> Countries like Australia and BRICS nations are diversifying supply chains to avoid becoming hostages to US-China geopolitics.</li><li><strong>BRICS Cohesion:</strong> US tariffs and sanctions are driving historically fractious nations toward a rare consensus against American hegemony.</li></ul><p><strong>The Risks</strong></p><ul><li><strong>Leadership Gap:</strong> A lack of far-sighted leadership in both capitals makes the relationship prone to sudden escalations.</li><li><strong>External Variables:</strong> Like the 19th-century \"Great Game,\" the outcome may be decided by forces beyond the direct control of either superpower.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Economic Decoupling:</strong> Expect continued pressure on global supply chains as \"economic security\" replaces free trade.</li><li><strong>Proxy Friction:</strong> Increased volatility in regional conflicts as both powers test the resolve of the other's allies.</li></ul>", "us elections": "<p>Democrats secured a decisive midterm victory, reclaiming former heartlands and signaling a rejection of the Trump administration.</p><p><strong>Why it matters:</strong> High living costs and inflation drove voters toward the Democratic ticket, proving that economic affordability outweighs concerns over political stability or democratic subversion.</p><p><strong>Between the lines</strong></p><ul><li><strong>Moderate dominance:</strong> Despite headlines about the \"radical left,\" the new Democratic majority is primarily composed of centrists.</li><li><strong>Labor resurgence:</strong> Strong union backing was the catalyst for wins in traditional industrial regions.</li><li><strong>Institutional resilience:</strong> The results suggest liberal democracy remains intact despite recent attempts to subvert election processes.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$3.2 trillion:</strong> Market value shed by Wall Street amid chaotic trading following the results.</li><li><strong>6.4%:</strong> The plunge of the tech-heavy Nasdaq 100.</li><li><strong>150 years:</strong> The gap in time if Scott Colom becomes the first Black man in the U.S. Senate from Mississippi.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investigations:</strong> Democrats plan to probe the Trump family's ties to the crypto industry.</li><li><strong>Policy struggle:</strong> A shift in Congress is unlikely to alter economic policy for the remainder of Trump's term.</li><li><strong>The mandate:</strong> Democrats must now decide whether to pursue a pro-growth agenda or address the \"painful truths\" of the cost-of-living crisis.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as regional election losses and coalition instability weaken his grip on power.</p><p><strong>Why it matters:</strong> Merz’s diminished domestic authority hampers Germany's ability to lead the EU budget negotiations and execute critical economic reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition strain:</strong> Labor Minister Bärbel Bas resigned, stalling pension and labor market overhauls.</li><li><strong>Far-right surge:</strong> The AfD is securing regional leadership roles and allegedly poaching votes from Merz’s CDU.</li><li><strong>Succession rumors:</strong> North Rhine-Westphalia Premier Hendrik Wüst is emerging as a popular alternative to the embattled chancellor.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Military pivot:</strong> The appointment of Christian Freuding as Bundeswehr chief signals a hard shift toward Ukraine-centric defense.</li><li><strong>Espionage threats:</strong> The government warned MPs of iPhone hacks while arresting a suspected Russian asset.</li><li><strong>EU leverage:</strong> Merz is threatening to block the EU's next budget unless the bloc agrees on more funding for Kyiv.</li></ul><p><strong>Between the lines</strong> Merz is attempting to project strength—nominating the first female president and confronting Russia—to offset a narrative of domestic failure. However, the AfD's growth is creating a \"firewall\" crisis that scares off foreign investors.</p><p><strong>What's next</strong> Watch for whether Merz can secure a win in upcoming state polls or if the CDU pivots to Hendrik Wüst to stabilize the government.</p>", "central banks": "<p>Global central banks are shifting toward a prolonged period of high interest rates to combat entrenched inflation.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing institutions to abandon \"insurance cuts\" and adopt hawkish stances to prevent inflation from becoming structural.</p><p><strong>The leadership shakeup</strong> The European Central Bank (ECB) is entering a critical transition as Christine Lagarde prepares to step down early.</p><ul><li><strong>The frontrunners:</strong> Klaas Knot and Pablo Hernández de Cos are the leading candidates.</li><li><strong>The stakes:</strong> The next president must manage French bond market turbulence and potential debt crises.</li><li><strong>The strategy:</strong> Knot has signaled a willingness to \"invent new tools\" to fight future financial instability.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>4%:</strong> The Bank of England's new interest rate following its first increase since 2023.</li><li><strong>2%:</strong> The ECB's inflation target, which remains unmet as core inflation accelerates.</li><li><strong>7:</strong> The number of policy meetings the Federal Reserve will hold next year, down from the traditional eight.</li></ul><p><strong>Between the lines</strong> Central banks are prioritizing credibility over market comfort.</p><ul><li><strong>The Fed:</strong> Maintaining a tightening path due to \"hot\" US growth and PCE inflation data.</li><li><strong>The BoE:</strong> Shifting tone sharply to signal that rate rises may continue.</li><li><strong>The BoJ:</strong> Staying on a quarterly tightening trajectory.</li></ul><p><strong>What's next</strong> Analysts are revising 2027 forecasts upward for the BoE, BoJ, Fed, and ECB, suggesting the \"higher for longer\" era is becoming the baseline.</p>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit exodus to higher-yield accounts, while regulatory failures and money laundering fines are eroding bottom lines.</p><p><strong>The AI paradox</strong></p><ul><li><strong>The Risk:</strong> Lenders are restricting AI agents to prevent automated shifts of billions in deposits.</li><li><strong>The Reward:</strong> Goldman Sachs is aggressively promoting engineers to partner ranks to build proprietary tech.</li><li><strong>The Oversight:</strong> Regulators are exploring AI to prevent the cultural failures that led to the SVB collapse.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman is preparing for top executives.</li><li><strong>$350 million:</strong> Amex fine for failing to flag $13 billion in suspicious transactions.</li><li><strong>17%:</strong> Drop in BofA profits following a $1.2 billion money laundering penalty.</li><li><strong>30%:</strong> Increase in Goldman's Q3 net income, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Talent War:</strong> Citi is shortening junior banker programs to two years to stop private equity poaching.</li><li><strong>Risk Shift:</strong> Banks are no longer placing the bets; they are profiting from a trillion-dollar hedge fund borrowing spree.</li><li><strong>Geopolitics:</strong> Citi's approval for China securities business signals a strategic move ahead of US-China diplomatic meetings.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Earnings Slowdown:</strong> Analysts forecast a sharp decline in trading revenue following a bumper start to the year.</li><li><strong>Leadership Shifts:</strong> Evercore is implementing a co-president structure; Goldman remains vague on CEO David Solomon's exit timeline.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>09 Nov 2026 21:04 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
