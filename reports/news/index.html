/* ── controls ── */
.controls{max-width:1200px;margin:0 auto;padding:1.5rem 2rem 0}

.slider-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0 1rem}
.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}

.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}

.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;

.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}

const SUMMARIES = {"oil and gas": "<p>The global energy landscape is fracturing into a tug-of-war between aggressive AI-driven fossil fuel demand and a slowing but persistent renewable transition.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>AI energy hunger:</strong> Data center expansion is forcing tech firms and nations to bypass grids and return to gas-fired power to avoid outages.</li><li>  <strong>Geopolitical volatility:</strong> Infrastructure attacks and shifting US-Russia relations are creating acute fuel shortages and price instability.</li></ul><p><strong>The AI-Energy Nexus</strong></p><ul><li>  <strong>Direct investment:</strong> Anthropic signed a $3.4bn deal for gas-fired power to secure energy for AI.</li><li>  <strong>Infrastructure gaps:</strong> UK gas use is surging as data center developers face electricity grid connection delays.</li><li>  <strong>New hubs:</strong> Argentina is leveraging Patagonian energy resources to attract unregulated AI data centers.</li></ul><p><strong>Geopolitical Friction</strong></p><ul><li>  <strong>Supply shocks:</strong> Russia is rationing petrol following Ukrainian refinery strikes.</li><li>  <strong>Security risks:</strong> Houthi/militia attacks on Saudi Arabia’s East-West pipeline threaten crude exports.</li><li>  <strong>Strategic pivots:</strong> ExxonMobil is exploring a return to Venezuela; Qatar is positioned to become the top buyer of US LNG by 2033.</li></ul><p><strong>The Transition Tension</strong></p><ul><li>  <strong>Policy retreat:</strong> Europe is lowering its climate ambitions ahead of COP31 to secure \"easier wins\" in electrification.</li><li>  <strong>Corporate shifts:</strong> BP and Shell are divesting from retail forecourts to prioritize upstream assets and investor demands.</li><li>  <strong>Market signals:</strong> US renewable groups (e.g., Ørsted) are rallying following political clarity from recent election results.</li></ul><p><strong>What's next:</strong> Watch for the COP31 summit in Turkey. The central conflict will be whether the \"clean electricity\" pledge survives fossil fuel lobbying or is diluted to accommodate surging industrial energy needs.</p>", "corporate earnings and results": "<p>AI infrastructure and leadership stability are driving current market volatility.</p><p><strong>Why it matters:</strong> High-valuation AI firms are facing a critical transition from speculative growth to operational scrutiny. Leadership scandals and infrastructure writedowns threaten the \"AI premium\" currently baked into equity prices.</p><p><strong>The AI Outlook</strong></p><ul><li><strong>Anthropic:</strong> Goldman Sachs projects revenue exceeding $600bn by 2030, targeting a $1.4tn IPO valuation.</li><li><strong>Nvidia:</strong> Facing a leadership crisis. Analysts warn the company would lose dominant market share and pricing power without CEO Jensen Huang.</li><li><strong>SoftBank:</strong> Reported a $7bn loss following a US data center writedown.</li></ul><p><strong>Corporate Shifts</strong></p><ul><li><strong>VW:</strong> Pivoting its China strategy after the \"In China, For China\" approach failed to stop a market downturn.</li><li><strong>CVS:</strong> Underperforming stock price signals the failure of its M&A-first growth strategy.</li><li><strong>Vodafone:</strong> Raising guidance via job cuts despite a €5bn impairment in Germany.</li></ul><p><strong>Global Headwinds</strong></p><ul><li><strong>Italy:</strong> Banks are protesting a planned €7bn tax raid by the Meloni government.</li><li><strong>UK/London:</strong> Aliko Dangote pulled a planned $18.4bn listing; Chinese insurers are divesting from London real estate.</li><li><strong>Energy:</strong> Oil prices have fallen below $90 a barrel.</li></ul>", "middle east war": "<p>President Trump is pivoting toward a diplomatic resolution to the Iran war following a historic Republican defeat in the midterm elections.</p><p><strong>Why it matters:</strong> High fuel prices and war fatigue drove voters to rebuke the administration, forcing a strategic US retreat that shifts the regional balance of power.</p><p><strong>The fallout</strong></p><ul><li><strong>Market reaction:</strong> Brent crude fell below $90 and hit a 10-week low after Trump signaled strikes on Iran are \"highly unlikely.\"</li><li><strong>Military shift:</strong> The US has begun removing aircraft from UK military bases, signaling a reduction in forward deployment.</li><li><strong>Political turmoil:</strong> Defense Secretary Hegseth faces an impeachment push from within his own party over alleged abuses of power during the conflict.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Iranian leverage:</strong> Tehran is celebrating the US electoral loss while simultaneously threatening subsea digital infrastructure in the Gulf of Oman.</li><li><strong>Global vacuum:</strong> US retrenchment creates a strategic opening for China to expand its influence in the Middle East.</li><li><strong>Humanitarian crisis:</strong> Trump’s \"Board of Peace\" warns of an immediate emergency in Gaza due to flooding and insufficient aid.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic push:</strong> Qatar is leading mediation efforts to broker an interim agreement between Washington and Tehran.</li><li><strong>Israeli instability:</strong> President Isaac Herzog has given Gadi Eisenkot 28 days to form a new ruling coalition.</li></ul>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict transforms the world's most vital maritime chokepoints into war zones.</p><p><strong>Why it matters:</strong> Attacks in the Strait of Hormuz and the Black Sea are forcing a massive redistribution of global trade routes, spiking operational costs and threatening energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has launched a tactical shift using limpet mines and speedboat attacks, targeting 24 vessels in two weeks.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route; commercial sailor fatalities here now exceed those in the Gulf.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades of Iranian ports have led to direct kinetic engagements with commercial tankers.</li></ul><p><strong>The economic fallout</strong></p><ul><li><strong>Labor costs:</strong> Captains are earning up to $100,000 per month to transit the Strait of Hormuz.</li><li><strong>Asset values:</strong> Old supertankers now command higher prices than new builds due to immediate availability.</li><li><strong>Oil volatility:</strong> Vitol warns of a tanker shortage that could push crude toward $200 a barrel.</li></ul><p><strong>The strategic pivot</strong></p><ul><li><strong>Arctic surge:</strong> Transits via the Northern Sea Route have quadrupled as ships avoid the Middle East and ice melts.</li><li><strong>Port shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe, driven by a surge in Chinese EV imports.</li><li><strong>Russian deception:</strong> Moscow is coordinating \"spoofing\" tactics, with ships faking locations to evade sanctions and monitoring.</li></ul><p><strong>What's next:</strong> Watch for increased U.S. state-level intervention, such as New Jersey's threat to block Russian diesel, which could create a fragmented regulatory landscape for East Coast ports.</p>", "artificial intelligence": "<p>The AI sector is shifting from speculative euphoria to a volatile period of institutional and political scrutiny.</p><p><strong>Why it matters:</strong> Market corrections and geopolitical tensions are exposing the fragility of \"key man\" dependencies and the risks of aggressive vertical integration.</p><p><strong>The market shift</strong></p><ul><li><strong>Valuation reset:</strong> Investors are stopping the practice of pricing in accelerating AI growth, triggering a tech sell-off.</li><li><strong>High stakes:</strong> Anthropic is pursuing a $1.5tn IPO valuation despite the market rout.</li><li><strong>Exposure:</strong> SoftBank faces significant valuation drops in its AI holdings ahead of earnings.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>Security risks:</strong> Allegations of espionage involving Nvidia's CEO and former OpenAI employees highlight AI as a primary intelligence battleground.</li><li><strong>Global divide:</strong> While US voters show increasing hostility toward Big Tech, the UK and China are accelerating investment to avoid falling behind.</li><li><strong>Information war:</strong> Russia is deploying deepfakes to manipulate battlefield narratives.</li></ul><p><strong>Institutional impact</strong></p><ul><li><strong>Labor disruption:</strong> AI is targeting middle-management headcount and pay grades.</li><li><strong>Academic crisis:</strong> Art schools are redesigning curricula to prevent AI from undermining traditional photography education.</li><li><strong>Infrastructure pushback:</strong> Massive data center capital expenditure is facing increasing political and electoral resistance.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the Anthropic IPO and US policy shifts on data center construction to determine if the \"AI correction\" is a temporary dip or a structural pivot.</p>", "us-china relations": "<p>US-China relations are entering a volatile era defined by transactional leadership and systemic instability.</p><p><strong>Why it matters:</strong> The shift from strategic diplomacy to personality-driven politics increases the risk of miscalculation. Both nations are prioritizing short-term wins over long-term global stability.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in Washington and Beijing is viewed as lacking the far-sightedness required to manage a \"Great Game\" competition.</li><li><strong>The \"Trump Effect\":</strong> US unpredictability is driving a rare consensus among BRICS nations to hedge against US sanctions and tariffs.</li><li><strong>Strategic caution:</strong> China is observing failed Western interventions (Ukraine/Russia) to calibrate its own approach to territorial disputes.</li></ul><p><strong>The ripple effect</strong></p><ul><li><strong>Middle powers:</strong> Countries like Australia are urging \"middle powers\" to diversify supply chains to avoid becoming hostages to US-China geopolitics.</li><li><strong>European anxiety:</strong> Europe is realizing the US may no longer act as the primary underwriter of global security, regardless of who holds the presidency.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tactical summits:</strong> Expect frequent high-level meetings that provide temporary stability but fail to achieve a true détente.</li><li><strong>Economic decoupling:</strong> Continued pressure on trade and technology as both powers treat economic security as a national security imperative.</li></ul>", "us elections": "<p>Democrats secured a sweeping victory in the US midterms, signaling a sharp rejection of the Trump administration's priorities.</p><p><strong>Why it matters:</strong> High living costs outweighed concerns over democratic stability, proving that economic affordability is the primary driver of voter behavior.</p><p><strong>Between the lines</strong></p><ul><li><strong>Centrist dominance:</strong> Despite \"radical left\" headlines, moderates control the new Democratic majority.</li><li><strong>Labor resurgence:</strong> Union-backed candidates successfully reclaimed former Democratic heartlands.</li><li><strong>Tech fallout:</strong> Silicon Valley elites and AI executives are distancing themselves from Trump after their alliance backfired.</li><li><strong>Deep South shift:</strong> The potential election of Scott Colom in Mississippi marks a historic political realignment.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>150 years:</strong> The time since a Black man last held a US Senate seat from Mississippi.</li><li><strong>$1tn+:</strong> China's trade surplus for the first 10 months, increasing pressure on US trade policy.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investigations:</strong> Democrats plan to probe the Trump family's ties to the crypto industry.</li><li><strong>Policy deadlock:</strong> Despite the \"blue wave,\" the shift in Congress is unlikely to alter major economic policy for the remainder of Trump's term.</li><li><strong>Strategic pivot:</strong> Democrats must now decide whether to pursue aggressive change or maintain a centrist coalition to hold power.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as regional election losses and coalition instability weaken his grip on power.</p><p><strong>Why it matters:</strong> Merz's diminished domestic authority hampers Germany's ability to lead the EU and secure critical funding for Ukraine.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition strain:</strong> Labor Minister Bärbel Bas resigned, stalling essential pension and labor market reforms.</li><li><strong>Far-right surge:</strong> The AfD is gaining regional power, securing its first regional parliament president and allegedly poaching votes from Merz’s CDU.</li><li><strong>Leadership rivalry:</strong> North Rhine-Westphalia Premier Hendrik Wüst is emerging as a popular alternative to the embattled chancellor.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Military pivot:</strong> Germany is aggressively rearming, appointing Christian Freuding as Bundeswehr chief to oversee a \"vast transformation.\"</li><li><strong>Espionage threats:</strong> The government warned officials of iPhone hacks and arrested a Ukrainian national suspected of spying for the Kremlin.</li><li><strong>Diplomatic tension:</strong> Merz is using the EU budget as leverage to force a unanimous bloc agreement on Ukraine funding.</li></ul><p><strong>Economic friction</strong></p><ul><li><strong>Market stability:</strong> Merz is opposing Berlin's plans to seize landlord properties to protect market economy principles.</li><li><strong>Investment risk:</strong> Executives warn that the rise of the AfD is deterring foreign investment.</li></ul><p><strong>What's next:</strong> Merz must navigate a \"firewall\" strategy against the far-right while attempting to push through unpopular reforms to prove his viability as leader.</p>", "central banks": "<p>Global central banks are shifting back to a hawkish stance as inflation proves stubborn.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing the Fed, ECB, and BoE to reconsider rate hikes, risking economic growth to prevent inflation from becoming entrenched.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> Governor Christopher Waller is weighing a 50bp hike if inflation fails to slow; strong Q3 growth suggests the US economy is \"running hot.\"</li><li><strong>Bank of England:</strong> Recently raised rates to 4% and signaled further increases to combat slipping inflation control.</li><li><strong>European Central Bank:</strong> Headline price pressures are accelerating, keeping the bank on a tightening path despite leadership instability.</li></ul><p><strong>Leadership transition</strong> Christine Lagarde will step down as ECB president in February, triggering a high-stakes succession race.</p><ul><li><strong>Frontrunners:</strong> Klaas Knot and Pablo Hernández de Cos.</li><li><strong>The stakes:</strong> The next president must manage French bond market turbulence and potential debt crises.</li><li><strong>The strategy:</strong> Knot has signaled a willingness to \"invent new tools\" to fight future financial crises.</li></ul><p><strong>Between the lines</strong> The era of \"predictable\" monetary policy is ending. The Fed is changing its meeting schedule (moving from eight to seven annual votes), and analysts are broadly revising 2027 forecasts upward for the BoE and BoJ.</p><p><strong>What's next</strong> Watch for a \"precautionary tightening cycle\" from the BoE in November and the final ECB presidential nomination deadline this Friday.</p>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit exodus to higher-yield accounts, while regulatory failures continue to trigger massive money-laundering fines.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman Sachs is preparing for top executives.</li><li><strong>$350 million:</strong> Amex fine for failing to flag $13 billion in suspicious transactions.</li><li><strong>$1.2 billion:</strong> Money laundering fine contributing to a 17% profit drop at BofA.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Talent War:</strong> Citi is shortening junior analyst programs to two years to prevent poaching by private equity. Goldman is elevating a record number of engineers to partner to secure technical expertise.</li><li><strong>The AI Paradox:</strong> Lenders are restricting AI agents to protect deposit margins, yet they are relying on AI-driven hedge funds (like Situational Awareness) to fuel prime brokerage fees.</li><li><strong>Regulatory Friction:</strong> The SVB postmortem reveals a \"culture of risk aversion\" at the Fed, prompting calls for AI-driven supervision to prevent future collapses.</li></ul><p><strong>What's next</strong></p><ul><li><strong>China Expansion:</strong> Citi will scale its securities business following long-awaited approval, timed for a Trump-Xi meeting.</li><li><strong>Trading Slowdown:</strong> Analysts forecast a sharp decline in trading revenue following a bumper start to the year.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>10 Nov 2026 18:05 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
