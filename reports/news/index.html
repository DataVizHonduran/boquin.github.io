const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Global energy policy is shifting from fossil fuel phaseouts toward carbon capture and energy security.</p><p><strong>Why it matters:</strong> Geopolitical instability and economic pressure are forcing governments to prioritize reliable supply over aggressive climate targets.</p><p><strong>The pivot to carbon capture</strong></p><ul><li>COP31 sessions are pivoting toward carbon capture and removal as the 1.5C warming threshold looms.</li><li>Saudi Arabia is actively disrupting UN climate talks to block fossil fuel phaseout mandates.</li><li>The EU delayed methane emission rules on imports following intense lobbying from the U.S. and Qatar.</li></ul><p><strong>Market volatility and security</strong></p><ul><li>The IEA claims markets can survive a closure of the Strait of Hormuz, though it would require significant investment.</li><li>Japan is proposing an \"Asian IEA\" to coordinate oil stockpiles and insulate the region from shocks.</li><li>Russia is importing record petrol volumes as Ukraine targets its refineries.</li></ul><p><strong>Strategic shifts in production</strong></p><ul><li><strong>The Americas:</strong> Exxon's success in Guyana is reviving frontier drilling; Chevron and Diamondback are pursuing multi-billion dollar U.S. Gulf and Permian Basin acquisitions.</li><li><strong>The North Sea:</strong> High taxes are driving producers out, evidenced by EnQuest selling its UK fields.</li><li><strong>Critical Minerals:</strong> The U.S. secured a rare earth deposit in Kenya to counter China's market dominance.</li></ul><p><strong>The consumer squeeze</strong></p><ul><li>UK energy price caps are set to rise above £2,000 in January as government subsidies dwindle.</li><li>EU mandates for sustainable aviation fuel (SAF) are increasing ticket costs due to fuel scarcity.</li></ul><p><strong>What's next:</strong> Expect a surge in \"small modular reactor\" deployments as China and the U.S. race for nuclear leadership.</p>", "corporate earnings and results": "<p>AI capital expenditure concerns are triggering a broad sell-off across tech and linked financial assets.</p><p><strong>Why it matters:</strong> Investors are shifting from growth optimism to risk aversion as the massive spending on AI infrastructure fails to yield immediate, scalable returns.</p><p><strong>The AI fallout</strong></p><ul><li><strong>Anthropic:</strong> Shares tumbled following its IPO as the \"AI trade\" loses momentum.</li><li><strong>Financials:</strong> Banks and private equity firms tied to AI growth are seeing valuations slide.</li><li><strong>Hardware:</strong> Market analysts are comparing Nvidia's current dominance to the pre-bubble peak of AIG.</li></ul><p><strong>Corporate headwinds</strong></p><ul><li><strong>Taxation:</strong> Jamie Dimon (JPMorgan) is fighting \"unfair\" UK bank taxes; Betfred is closing 73 stores due to gambling levy hikes.</li><li><strong>Governance:</strong> Worldline faces scrutiny after using delayed payments to artificially bolster cash flow before a profit warning.</li></ul><p><strong>What's next:</strong> Watch for the \"AI bubble\" narrative to intensify if upcoming quarterly earnings from hyperscalers show a decline in capex or a plateau in productivity gains.</p>", "middle east war": "<p>The Middle East is entering a phase of high-intensity volatility as U.S.-Iran tensions escalate into direct military exchanges.</p><p><strong>Why it matters:</strong> Direct strikes on bases and tankers threaten global energy transit and risk a full-scale regional war. This instability is coinciding with internal political fragility in Israel and Saudi Arabia.</p><p><strong>The flashpoints</strong></p><ul><li><strong>U.S. vs. Iran:</strong> Tit-for-tat strikes involving Qeshm Island and Bahrain bases signal a breakdown in deterrence.</li><li><strong>Yemen:</strong> Houthi rebels have seized strategic ground near the Bab al-Mandeb Strait and targeted Saudi sovereign wealth fund headquarters.</li><li><strong>Israel:</strong> Domestic political instability is peaking as the opposition gains ground and the attorney-general freezes West Bank settlements.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic decoupling:</strong> The traditional correlation between oil prices and bond markets has broken, suggesting geopolitical shocks are no longer the primary driver of inflation.</li><li><strong>Proxy warfare:</strong> Iran is expanding its reach beyond Yemen, with reported attacks on Bahrain and Kuwait.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic fragility:</strong> Watch for whether the U.S. can stabilize the Gulf before a miscalculation triggers a broader conflict.</li><li><strong>Israeli leadership:</strong> The ability of ultra-Orthodox parties to pivot away from Netanyahu could trigger a government collapse.</li></ul>", "shipping": "<p>Geopolitical conflict is dismantling traditional global shipping corridors.</p><p><strong>Why it matters:</strong> War in the Black Sea and the Strait of Hormuz is forcing a massive redirection of trade. This shift increases operational costs, spikes insurance premiums, and threatens global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has targeted 24 vessels in two weeks. Captains now command $100,000 monthly salaries to transit the area.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route. Russia is diverting grain exports to Arctic ports, thousands of miles from original hubs.</li></ul><p><strong>The strategic pivots</strong></p><ul><li><strong>Arctic Routes:</strong> Transits via the Northern Sea Route have quadrupled as ships avoid Middle East conflict zones and leverage melting ice.</li><li><strong>UK Infrastructure:</strong> DP World’s London Gateway is poised to overtake Felixstowe due to a surge in Chinese EV imports.</li><li><strong>Corporate Shifts:</strong> Maersk is aggressively purchasing ships to compete with CMA CGM despite a 10% dip in shares.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel of oil warned by Vitol if tanker shortages persist.</li><li><strong>$2 billion:</strong> The scale of a U.S. oil trader's gamble on tankers to bypass Hormuz.</li><li><strong>24.6 million:</strong> Daily barrels of oil exported from the Gulf, surpassing pre-war levels via alternative routes.</li></ul><p><strong>What's next:</strong> Expect continued volatility in fuel prices as U.S. diesel supplies hit 20-year lows and political battles erupt over Russian fuel imports.</p>", "artificial intelligence": "<p>The AI market is shifting from speculative hype to a volatile era of massive valuations and systemic risk.</p><p><strong>Why it matters:</strong> While frontier labs like Anthropic are achieving trillion-dollar valuations, the broader ecosystem faces a \"subprime\" style bubble fueled by off-balance-sheet commitments and geopolitical instability.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 trillion:</strong> Anthropic's valuation following its record-breaking IPO.</li><li><strong>$81 billion:</strong> Total capital raised by Anthropic in its public offering.</li><li><strong>$6 billion:</strong> Amount stolen from Binance as AI-driven cyber attacks surge.</li><li><strong>$40 billion:</strong> Value of chips SpaceX lenders are attempting to block from orbit.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market Divergence:</strong> Individual AI \"winners\" (Anthropic) are decoupling from a sliding Nasdaq, signaling a flight to quality over general AI exposure.</li><li><strong>Security Paradox:</strong> AI is accelerating both the discovery of software bugs and the tools used to exploit them, leading to critical system instabilities at firms like JPMorgan.</li><li><strong>Geopolitical Friction:</strong> The U.S. is balancing chip sales to China against national security, leaving startups like Nscale vulnerable to sudden blacklisting.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The \"Handover\" Crisis:</strong> Investors and regulators are increasingly alarmed by the speed of AI autonomy, triggering \"responsible scaling\" policies to prevent catastrophic risks.</li><li><strong>Labor Shift:</strong> Automation is moving from \"useless\" to \"real-world ready\" for professional roles (e.g., accounting), though human relational skills remain the primary moat.</li></ul>", "us-china relations": "<p>A trilateral summit between the U.S., China, and Russia has positioned Beijing as a central broker in a potential new global order.</p><p><strong>Why it matters:</strong> The meeting signals a shift toward \"Yalta 2.0,\" where the three powers attempt to carve up spheres of influence. This undermines traditional multilateral alliances and empowers autocratic leadership.</p><p><strong>Between the lines</strong></p><ul><li><strong>China's gain:</strong> Xi Jinping used the summit to project global leadership and reshape the international order on Beijing's terms.</li><li><strong>Russia's win:</strong> Vladimir Putin gained diplomatic legitimacy and leverage, emboldening his stance on Ukraine.</li><li><strong>U.S. volatility:</strong> The push for a quick peace deal reflects a transactional approach to diplomacy, prioritizing immediate exits over long-term strategic stability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>European instability:</strong> EU leaders must now determine if they can maintain security without a reliable, outward-looking U.S. superpower.</li><li><strong>Global realignment:</strong> Middle powers are increasingly seeking economic security and supply chain diversification to avoid becoming collateral in the U.S.-China-Russia rivalry.</li></ul>", "us elections": "<p>Democrats secured a sweeping victory in the US midterms, shifting the balance of power in Washington.</p><p><strong>Why it matters:</strong> The results signal a rejection of right-wing populism and \"MAGA\" strategies, forcing Republicans to reassess their leadership and messaging.</p><p><strong>By the numbers</strong></p><ul><li><strong>56:</strong> The number of Senate seats now held by Democrats.</li><li><strong>$500 million:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>$4.2 trillion:</strong> The loss in data center construction stocks as the AI trade unravelled.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Demographic shifts:</strong> Older voters and high turnout in \"deep red\" states drove the Democratic wave.</li><li><strong>Strategic failures:</strong> Republican gerrymandering and reliance on \"new media\" podcasts failed to sway the electorate.</li><li><strong>Policy pivot:</strong> Democrats are shifting focus from \"woke politics\" toward class-based economic issues.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership changes:</strong> Hakeem Jeffries is on track to become the first Black House Speaker.</li><li><strong>Internal strife:</strong> Republicans are blaming external factors—Big Tech and AI—rather than Donald Trump for the loss.</li><li><strong>Long-term outlook:</strong> Eyes are already on 2028, with socialists backing Alexandria Ocasio-Cortez for the presidency.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is attempting to pivot Germany toward a more assertive military and economic posture amid deep internal coalition fractures.</p><p><strong>Why it matters:</strong> Berlin is shifting from a \"peace dividend\" mindset to a \"security first\" strategy. This transition is creating friction between fiscal conservatives, European allies, and a rising far-right.</p><p><strong>The security shift</strong></p><ul><li><strong>Military leadership:</strong> The appointment of Christian Freuding, who has close ties to Ukraine, signals a prioritization of combat readiness.</li><li><strong>Intelligence:</strong> New sweeping surveillance powers and warnings of state-sponsored iPhone hacks highlight a heightened state of alert against Russian espionage.</li><li><strong>Strategic friction:</strong> France is pressuring Berlin over the nuclear risks associated with Germany's new long-range missile capabilities.</li></ul><p><strong>Economic and political instability</strong></p><ul><li><strong>Coalition chaos:</strong> The resignation of the labor minister and deadlocks over ECB appointments signal a fragile governing alliance.</li><li><strong>Fiscal tension:</strong> The Council of Economic Experts is warning against defense borrowing to prevent GDP-to-debt ratios from hitting 98% by 2040.</li><li><strong>The AfD factor:</strong> The far-right's growth is deterring foreign investment and infiltrating regional parliaments through secret deals with established parties.</li></ul><p><strong>Between the lines</strong> Merz is positioning himself as the \"firewall\" against the far-right, but his push for unpopular reforms and military spending is straining the very coalition he needs to govern.</p><p><strong>What's next</strong></p><ul><li><strong>EU Budget:</strong> Watch for a potential standoff as Merz threatens to block the EU budget unless member states agree on more Ukraine funding.</li><li><strong>Presidential Transition:</strong> The expected March inauguration of Ilse Aigner as Germany's first female president.</li></ul>", "central banks": "<p>Central banks are pivoting back to aggressive tightening as inflation proves more entrenched than previously forecasted.</p><p><strong>Why it matters:</strong> Persistent price pressures and strong labor markets are forcing policymakers to abandon \"transitory\" assumptions. This shift increases the risk of growth contractions and financial instability.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> Officials are weighing 50bp rate hikes if inflation fails to decelerate.</li><li><strong>Bank of England:</strong> Rates have hit 4%, with leadership signaling further increases to combat slipping inflation control.</li><li><strong>ECB:</strong> Headline price pressures are keeping the bank on a tightening trajectory as it prepares for a leadership transition.</li><li><strong>Bank of Japan:</strong> Weak GDP growth is complicating the timeline for potential rate rises.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Communication gap:</strong> Divergent messaging between the Fed and BoE suggests a lack of global synchronization on the \"terminal rate.\"</li><li><strong>The AI variable:</strong> Some policymakers believe AI-driven productivity could sustain higher GDP growth without triggering new inflation.</li><li><strong>Reserve dominance:</strong> Central banks maintain a heavy reliance on the US dollar for foreign exchange reserves despite global volatility.</li></ul><p><strong>What's next</strong></p><ul><li><strong>ECB Succession:</strong> Brussels is finalizing nominees to succeed Christine Lagarde, focusing on candidates capable of inventing new crisis-fighting tools.</li><li><strong>Mortgage shifts:</strong> Structural changes in the UK mortgage market may force the BoE to cut rates faster in the future to avoid systemic shocks.</li></ul>", "us banks": "<p>US banks are balancing a surge in trading profits against systemic regulatory failures and the disruptive threat of AI.</p><p><strong>Why it matters:</strong> While equities and hedge fund borrowing are driving short-term revenue, banks face a \"double-edged sword\" with AI: it offers operational efficiency but risks triggering massive deposit outflows to higher-yield competitors.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks as AI agents shift savers to better rates.</li><li><strong>$350 million:</strong> Amex fine for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> BofA fine contributing to a 17% profit drop.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Talent wars:</strong> Citi is shortening junior analyst programs to two years to prevent poaching by private equity.</li><li><strong>Leadership shifts:</strong> JPMorgan and Evercore are restructuring executive ranks to manage succession and gender diversity.</li><li><strong>Risk shift:</strong> Banks are no longer placing the bets; they are profiting from the borrowing sprees of trillion-dollar hedge funds.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory pivot:</strong> Supervisors are exploring AI to detect the cultural failures that led to the SVB collapse.</li><li><strong>China expansion:</strong> Citi will now scale its securities business in China ahead of high-level US-China diplomatic meetings.</li><li><strong>Earnings cooling:</strong> Analysts expect the record-breaking trading streak to slow in upcoming quarterly reports.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>20 Nov 2026 18:43 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
