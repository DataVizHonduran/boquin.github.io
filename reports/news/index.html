const SUMMARIES = {"oil and gas": "<p>Global diesel supplies are tightening as geopolitical volatility and trade threats collide.</p><p><strong>Why it matters:</strong> Persistent fuel price spikes are destabilizing EU public finances and fueling broader inflation, forcing central banks toward preemptive rate hikes.</p><p><strong>The diesel crunch</strong></p><ul><li><strong>Supply shocks:</strong> Russia extended export bans following refinery strikes; the U.S. is weighing export restrictions.</li><li><strong>Market outlook:</strong> Dallas Fed surveys indicate diesel prices will not normalize for at least one year.</li><li><strong>EU pressure:</strong> Italy and Greece are seeking fiscal leeway to fund consumer fuel subsidies.</li></ul><p><strong>Geopolitical leverage</strong></p><ul><li><strong>U.S. Strategy:</strong> The Trump administration is using diesel export threats to pressure Europe into releasing strategic reserves.</li><li><strong>China's edge:</strong> Beijing maintains dominance in battery technology, complicating Western efforts to pivot away from fossil fuels.</li><li><strong>Investment shifts:</strong> South Korea pledged $200B for U.S. energy projects in Alaska and Texas.</li></ul><p><strong>The energy transition</strong></p><ul><li><strong>LNG expansion:</strong> Shell is leading a $23B expansion of LNG Canada to double production capacity.</li><li><strong>Battery paradox:</strong> In Australia, grid-scale storage is lowering emissions but \"cannibalizing\" its own revenue streams.</li><li><strong>Coal persistence:</strong> UK banks (Barclays, HSBC) continue financing coal despite global decarbonization trends.</li></ul><p><strong>What's next:</strong> Watch for ECB policy shifts if energy-driven inflation accelerates in the Eurozone's largest economies.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI spending pressures balance sheets and consumer demand softens in key sectors.</p><p><strong>Why it matters:</strong> High interest rates and inflation fears are triggering a global bond sell-off, increasing borrowing costs and forcing companies to seek unconventional liquidity.</p><p><strong>The AI trade-off</strong></p><ul><li><strong>Amazon</strong> is attempting to offload $8 billion in Nvidia chips to investors to offset soaring AI infrastructure costs.</li><li><strong>Anthropic</strong> is preparing for an IPO amid market skepticism regarding AI valuation sustainability.</li></ul><p><strong>Sector headwinds</strong></p><ul><li><strong>Automotive:</strong> Tesla deliveries fell 2% and Volvo Cars issued a profit warning due to declining Chinese sales.</li><li><strong>Fintech:</strong> Monzo is courting private equity after a \"bruising year\" of boardroom conflict and failed partnerships.</li><li><strong>Media:</strong> Paramount is navigating a $110 billion leveraged buyout during a period of high credit volatility.</li></ul><p><strong>The liquidity squeeze</strong></p><ul><li><strong>Partners Group</strong> split its flagship private equity fund to meet urgent client demands for cash.</li><li><strong>Dyson</strong> issued a £750 million dividend to its holding company despite a decline in overall profits.</li></ul><p><strong>What's next:</strong> Investors will monitor if AI-driven capital expenditures translate into revenue growth or continue to erode corporate margins.</p>", "middle east war": "<p>The Middle East is facing a volatile convergence of military escalation, internal political instability, and aviation security crises.</p><p><strong>Why it matters:</strong> Escalating tensions between the U.S., Iran, and Israel are destabilizing global energy markets and threatening the fragile normalization of ties between Israel and Arab states.</p><p><strong>The military flashpoint</strong></p><ul><li><strong>U.S. buildup:</strong> Thousands of troops and the USS Theodore Roosevelt are deploying to the region as the Trump administration considers strikes on Iran.</li><li><strong>Vacuum of power:</strong> The U.S. has withdrawn all remaining troops from Iraq, leaving a security gap for Iran-backed militias to exploit.</li><li><strong>UK involvement:</strong> British officials report \"strong indications\" of Iranian involvement in the RAF Fairford incident.</li></ul><p><strong>Security and Diplomacy</strong></p><ul><li><strong>Aviation crisis:</strong> A cockpit attack on a Flydubai flight to Tel Aviv has triggered a joint UAE-Israel terror probe and threatened the UAE's status as an Israeli safe haven.</li><li><strong>Diplomatic pivots:</strong> Saudi and Emirati royals are meeting to mend rifts over Yemen, while mediators attempt to break a seven-month U.S.-Iran deadlock.</li><li><strong>Syrian shift:</strong> The new Islamist government under Ahmed al-Sharaa is replacing Assad’s protectionist economy with a free-market model.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Energy spike:</strong> EU ministers are discussing emergency oil stock releases as the Iran war adds €100bn in costs to the bloc.</li><li><strong>Fuel prices:</strong> UK diesel is projected to hit £2 per litre due to Middle East disruptions and U.S. export threats.</li></ul><p><strong>What's next:</strong> Watch for the arrival of the USS Theodore Roosevelt in late November, which will signal whether the U.S. is pivoting toward active deterrence or direct conflict.</p>", "shipping": "<p>Geopolitical conflict and climate volatility are dismantling the traditional global shipping order.</p><p><strong>Why it matters:</strong> Chokepoint disruptions in the Middle East and Panama are driving record freight rates and forcing a structural shift toward \"shadow fleets\" and alternative trade routes.</p><p><strong>The volatility loop</strong></p><ul><li><strong>Supply shocks:</strong> Shortages of supertankers have pushed daily costs to a record $1.2 million.</li><li><strong>Asset flip:</strong> Old supertankers now command higher prices than new builds due to immediate availability.</li><li><strong>Strategic pivots:</strong> South Korea is investing in Arctic routes to bypass the Strait of Hormuz.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Security gaps:</strong> Increased reliance on satellite-linked \"edge devices\" has opened vessels to cyberattacks.</li><li><strong>Regulatory collapse:</strong> 18 maritime authorities warn that wars and sanctions-evading fleets are eroding global shipping rules.</li><li><strong>Sanctions friction:</strong> Russia is expanding its own fleet to bypass Western restrictions, while insurance loopholes persist in the UK.</li></ul><p><strong>The green transition</strong></p><ul><li><strong>Fuel shift:</strong> Biodiesel is now cheaper than conventional fuels, accelerating emissions targets.</li><li><strong>Tech bets:</strong> Maersk is testing wind sails; the US is planning nuclear-powered merchant ships to counter Chinese shipbuilding dominance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market activity:</strong> Trafigura will float its supertanker arm (Volare Shipping) in Oslo to capitalize on high rates.</li><li><strong>Risk management:</strong> Shipping lines are lobbying for stricter battery declarations to reduce onboard fire risks.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a technical breakthrough to a systemic financial and geopolitical risk.</p><p><strong>Why it matters:</strong> Massive capital expenditures are outpacing revenue, creating a debt bubble that threatens broader financial stability. Simultaneously, AI is shifting from a software tool to a tool for state-level infrastructure and cyber warfare.</p><p><strong>The financial friction</strong></p><ul><li><strong>Debt risks:</strong> The Bank of England and KKR warn that aggressive AI borrowing could trigger a sharp market correction.</li><li><strong>Pricing crisis:</strong> High operational costs are forcing frontier labs to rethink pricing models ahead of planned IPOs.</li><li><strong>Circular funding:</strong> Concerns are rising over \"circular financing\" loops that may artificially inflate valuations.</li></ul><p><strong>Geopolitical maneuvers</strong></p><ul><li><strong>Infrastructure wars:</strong> Japan is investing $140bn in data centers; Tencent is leasing 100,000 Oracle chips to compete with ByteDance.</li><li><strong>Regulatory shifts:</strong> The FTC is expanding investigations into OpenAI and Anthropic, while Trump promotes \"voluntary\" industry self-regulation.</li><li><strong>Sovereignty:</strong> The UK is pushing for a national AI strategy to avoid a bifurcated global market split between the US and China.</li></ul><p><strong>The operational gap</strong></p><ul><li><strong>Physical bottlenecks:</strong> AI is accelerating data analysis, but physical-world implementation is lagging.</li><li><strong>Security threats:</strong> OpenAI agents have been linked to obscured hacking activity in government breaches.</li><li><strong>Environmental pushback:</strong> Big Tech is forming coalitions to address energy and water consumption to preempt political backlash.</li></ul><p><strong>What's next:</strong> Watch for a \"correction phase\" where investors demand tangible ROI over theoretical capabilities, alongside stricter government mandates replacing voluntary self-regulation.</p>", "us-china relations": "<p>US-China relations have shifted from mutual cooperation to a zero-sum geopolitical rivalry.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy creates a volatile global environment where economic interdependence is now viewed as a strategic vulnerability.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in both Washington and Beijing is viewed as ill-equipped for the far-sighted diplomacy required to prevent conflict.</li><li><strong>Transactionalism:</strong> US policy shifts—including tariffs and unreliable security guarantees in Asia—are pushing allies and rivals toward new alignments.</li><li><strong>BRICS expansion:</strong> China is leveraging US isolationism to strengthen the BRICS bloc, which now exceeds the G7 in share of the world economy.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>AI Hegemony:</strong> US dominance in data centers and hardware maintains a power imbalance that China seeks to disrupt.</li><li><strong>Security vacuums:</strong> US instability in the Asia-Pacific is forcing allies like Japan and South Korea to question the reliability of American defense guarantees.</li><li><strong>Economic warfare:</strong> Beijing is signaling readiness to retaliate with \"all necessary measures\" against US sanctions.</li></ul><p><strong>What's next</strong> Expect continued tactical summits that manage crises without achieving true détente. The global order is moving toward a fragmented system of transactional diplomacy rather than a rules-based multilateral framework.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>02 Oct 2026 16:22 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
