const SUMMARIES = {"oil and gas": "<p>Global oil markets are pivoting from shortage fears to a looming supply glut.</p><p><strong>Why it matters:</strong> A combination of renewed Gulf exports and optimistic production forecasts is crashing prices, undermining OPEC's demand projections and shifting the geopolitical leverage back to importers.</p><p><strong>By the numbers</strong></p><ul><li><strong>$80:</strong> The threshold Brent crude sank below as traders bet on the reopening of the Strait of Hormuz.</li><li><strong>$765 million:</strong> The amount the Trump administration is paying to cancel offshore wind projects in favor of natural gas and geothermal.</li><li><strong>1 million:</strong> The daily barrels Canada aims to send to Asia via a proposed west coast pipeline to bypass U.S. reliance.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political volatility:</strong> In the UK, energy policy is now a primary electoral driver, with Conservatives winning in Aberdeen by opposing limits on oil and gas exploration.</li><li><strong>Strategic depletion:</strong> U.S. Strategic Petroleum Reserve stocks have hit their lowest level since 1983, leaving the U.S. with less cushion for future shocks.</li><li><strong>Sector rotation:</strong> Capital is shifting toward AI-driven infrastructure, evidenced by SGB-SMIT's potential €4bn IPO to support data center power grids.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Consolidation:</strong> Activist investors targeting firms like Devon Energy signal a looming merger wave in the U.S. shale patch.</li><li><strong>Nuclear revival:</strong> Silicon Valley-backed \"nuclear bros\" are accelerating efforts to deploy small modular reactors despite safety concerns.</li><li><strong>Supply surge:</strong> The IEA warns that a Middle East peace deal will trigger a sharp rise in production that outstrips global demand.</li></ul>", "corporate earnings and results": "<p>Corporate earnings and valuations are shifting as regulatory failures and strategic pivots redefine market winners.</p><p><strong>Why it matters:</strong> Compliance lapses and pricing wars are eroding margins for legacy firms, while Big Pharma and Tech conglomerates use aggressive M&A and IPOs to secure future growth.</p><p><strong>The losers</strong></p><ul><li><strong>Asda:</strong> Losses widened to nearly £1bn following aggressive price cuts to regain market share.</li><li><strong>Rathbones:</strong> Stock plummeted 17% after an internal review revealed regulatory compliance failures.</li><li><strong>Greencore:</strong> Transaction expenses pushed the group into a pre-tax loss.</li></ul><p><strong>The winners</strong></p><ul><li><strong>AbbVie:</strong> Moving toward an $11bn acquisition of Apogee Therapeutics to bolster its drug pipeline.</li><li><strong>Reliance Industries:</strong> Mukesh Ambani is filing for a Jio IPO, expected to be India's largest ever.</li><li><strong>NBA (Knicks):</strong> Asset scarcity is driving valuations higher as investors chase limited sports franchises.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Private Credit Shift:</strong> The collapse of Medallia is forcing private lenders to transition from passive \"coupon clippers\" to active equity managers.</li><li><strong>Banking Deregulation:</strong> The EU and UK are both moving to ease capital rules to make their lenders more competitive against U.S. rivals.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Big Tech Friction:</strong> A UK government green paper will likely force Meta and YouTube to prioritize local news, sparking new regulatory battles.</li><li><strong>Commodity Volatility:</strong> Urea prices have returned to pre-war levels, signaling a drop in demand that may weigh on fertilizer producers.</li></ul>", "middle east war": "<p>A fragile interim deal between the U.S. and Iran is attempting to stabilize the Middle East, but escalating Israel-Hezbollah clashes threaten to collapse the agreement.</p><p><strong>Why it matters:</strong> A total breakdown would likely trigger a blockade of the Strait of Hormuz, spiking global energy prices and reigniting a direct Iran-Israel war.</p><p><strong>The deal's core:</strong></p><ul><li><strong>Financials:</strong> The U.S. will release $6 billion in frozen funds held in Qatar to purchase U.S. goods.</li><li><strong>Trade:</strong> The agreement aims to reopen the Strait of Hormuz to commercial shipping.</li><li><strong>Concessions:</strong> Washington acknowledges Tehran will retain its ballistic missile program.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Fragility:</strong> Iran has already postponed nuclear talks in Switzerland citing Israeli strikes in Lebanon.</li><li><strong>Leverage:</strong> Shipping executives warn the deal's language may allow Tehran to introduce new transit fees after 60 days.</li><li><strong>Internal Friction:</strong> U.S. Vice President Vance has clashed with the Israeli government over the deal's terms.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$6 billion:</strong> Frozen Iranian funds slated for phased release.</li><li><strong>$4 billion:</strong> Cost of a controversial Kushner resort project in Albania linked to Iranian-backed protests.</li></ul><p><strong>What's next:</strong> Markets are watching the Israel-Hezbollah ceasefire. If the exchange of fire continues, the \"interim\" nature of the U.S.-Iran accord makes it highly susceptible to immediate termination.</p>", "shipping": "<p>Global shipping is struggling to stabilize as the Strait of Hormuz cautiously reopens following the Iran conflict.</p><p><strong>Why it matters:</strong> The waterway is a critical energy artery. Prolonged closures drove record tanker profits and forced a reliance on high-risk \"shadow fleets,\" creating a volatile market prone to crashes and environmental disasters.</p><p><strong>The Hormuz bottleneck</strong></p><ul><li><strong>Slow recovery:</strong> Despite a US-Iran deal, a massive backlog of vessels remains.</li><li><strong>Confidence gap:</strong> Major operators like Mitsui OSK Lines demand \"material\" proof of stability before resuming full operations.</li><li><strong>Physical decay:</strong> Ships trapped in the Gulf face biological fouling (barnacles/jellyfish), potentially delaying departures.</li></ul><p><strong>The \"Shadow Fleet\" risk</strong></p><ul><li><strong>Sanction evasion:</strong> Russia and Iran use aging, unregulated tankers to move oil.</li><li><strong>Environmental threat:</strong> Over 50% of these vessels are deemed high-risk for catastrophic spills.</li><li><strong>Enforcement:</strong> The UK is actively seizing shadow tankers in the English Channel to disrupt Russian war funding.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Profit volatility:</strong> Shipowners who earned windfalls during the conflict now fear a market crash as rates plummet upon reopening.</li><li><strong>Strategic pivots:</strong> South Korea is seeing an economic boom by capitalizing on the intersection of AI, shipbuilding, and global defense needs.</li><li><strong>Defense spending:</strong> The acquisition of the Cammell Laird shipyard signals a UK push toward naval modernization.</li></ul><p><strong>What's next:</strong> Watch for the volume of China-bound supertankers crossing the Strait; their frequency will dictate the speed of the global oil price decline.</p>", "artificial intelligence": "<p>AI is shifting from a speculative gold rush to a volatile phase of operational correction and systemic risk.</p><p><strong>Why it matters:</strong> High deployment costs and unpredictable outputs are forcing corporations to cap usage, while the technology disrupts traditional labor models and legal standards.</p><p><strong>The corporate squeeze</strong></p><ul><li><strong>Budget strain:</strong> Amazon, Walmart, and Uber are implementing usage caps to curb wasteful spending.</li><li><strong>Business model risk:</strong> Accenture shares hit a 7-year low as AI threatens to automate the core services of IT consultancy.</li><li><strong>Supply chain ripple:</strong> High demand for data center components is driving up prices for consumer electronics like Sony and Nintendo consoles.</li></ul><p><strong>Labor and legal shifts</strong></p><ul><li><strong>Role evolution:</strong> \"Senior-ising\" is occurring as AI handles routine tasks, forcing junior recruits into immediate management and decision-making roles.</li><li><strong>Legal instability:</strong> UK police are reviewing rape convictions after a detective allegedly used AI to manipulate paperwork.</li><li><strong>Financial risk:</strong> Chatbots continue to produce \"costly mistakes\" in financial advice, prompting caution for retail users.</li></ul><p><strong>Geopolitical and strategic moves</strong></p><ul><li><strong>Sovereign AI:</strong> The U.S. is mirroring China's strategy by treating AI as a strategic industry with potential government shareholding.</li><li><strong>Market consolidation:</strong> SpaceX is leveraging a record IPO and $20bn bond deal to increase acquisition firepower.</li><li><strong>Regulatory tension:</strong> Anthropic is lobbying G7 leaders for international cooperation to avoid a fragmented global AI landscape.</li></ul><p><strong>What's next:</strong> Expect a pivot toward \"physical world\" AI, evidenced by Amazon, Nvidia, and AMD's $310mn investment in Odyssey to simulate real-world environments.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony as traditional multilateral institutions fail.</p><p><strong>Why it matters:</strong> A shift toward \"might is right\" geopolitics increases the risk of direct conflict while forcing middle powers to choose sides or forge new, fragile alliances.</p><p><strong>Between the lines</strong></p><ul><li><strong>The Power Vacuum:</strong> Washington is retreating from global leadership and \"burning bridges,\" creating a void Beijing is attempting to fill.</li><li><strong>Asymmetric Leverage:</strong> Power now stems from the ability to exploit imbalances rather than raw economic size or military wealth.</li><li><strong>The Russia Factor:</strong> Putin’s strategic missteps have locked Russia into a subordinate, one-sided partnership with China.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Zero-sum gains:</strong> Beijing is leveraging U.S. instability to improve its global image and attract foreign officials.</li><li><strong>High stakes:</strong> The \"Thucydides Trap\"—where a rising power threatens a ruling power—remains the primary driver of systemic instability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic pivots:</strong> Expect a rise in \"middleman\" diplomacy and special envoys to manage tensions without formal treaties.</li><li><strong>Alliance reshuffling:</strong> European and Asian allies will press the U.S. for clarity on security commitments to avoid deterrence gaps.</li></ul>", "us elections": "<p>U.S. elections are shifting toward a high-stakes clash between MAGA loyalty and general election viability.</p><p><strong>Why it matters:</strong> Trump’s influence over GOP primaries is creating a \"Pyrrhic victory\" risk. By installing controversial loyalists, he may alienate moderate swing voters in critical Senate races.</p><p><strong>The battlegrounds</strong></p><ul><li><strong>Texas:</strong> Trump-backed Ken Paxton won the primary, but Democrats believe his limited appeal outside the MAGA base opens a path to victory.</li><li><strong>Maine:</strong> Democrat Graham Platner secured the nomination despite misconduct allegations, setting up a challenge against incumbent Susan Collins.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li></ul><p><strong>Internal fractures</strong></p><ul><li><strong>GOP:</strong> Senate Republicans are blocking Trump’s $1.8bn \"anti-weaponisation\" fund, sparking a public feud over \"lawfare\" spending.</li><li><strong>Democrats:</strong> A DNC autopsy blames the Biden White House for Kamala Harris's loss, citing a lack of unity and lost voter confidence.</li><li><strong>The Base:</strong> Evangelicals are questioning if Trump’s rhetoric aligns with Christian values, while working-class voters in Pennsylvania are shifting toward populist Democratic candidates.</li></ul><p><strong>Economic headwinds</strong></p><ul><li><strong>Inflation:</strong> FT polling shows voters blame Trump for high grocery prices and the cost of living.</li><li><strong>Tariffs:</strong> In Maine, a \"lobster revolt\" is brewing as tariffs and fuel costs drive fishermen away from the GOP.</li></ul><p><strong>What's next</strong></p><ul><li><strong>2028 Positioning:</strong> VP JD Vance and Secretary of State Marco Rubio are already emerging as primary rivals for the next presidential cycle.</li><li><strong>Legal Pressure:</strong> A DOJ probe into Gavin Newsom could reshape his viability as a future presidential contender.</li></ul>", "german politics": "<p>Germany is pivoting toward aggressive military autonomy and right-wing nationalism.</p><p><strong>Why it matters:</strong> Berlin's shift from a cautious \"civilian power\" to a dominant military spender is destabilizing EU alliances and fueling internal political polarization.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Strategic shift:</strong> Germany is bypassing France in fighter jet projects and seeking a 40% stake in tank maker KNDS.</li><li><strong>US friction:</strong> Tensions with Donald Trump over the Iran war have triggered a US troop review and a potential withdrawal of 5,000 soldiers.</li><li><strong>Bureaucratic overhaul:</strong> Berlin is restructuring its arms procurement agency to accelerate the spending of its expanded defense budget.</li></ul><p><strong>The AfD surge</strong></p><ul><li><strong>Polling lead:</strong> The far-right AfD currently leads opinion polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>Ideological return:</strong> The party is reviving Nazi-era attacks on modernist art (Bauhaus) and maintaining ties with Kremlin associates.</li><li><strong>Policy goals:</strong> The AfD is pushing to restart Nord Stream gas flows and opposes current Western war efforts.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Leadership struggle:</strong> CDU leader Friedrich Merz faces a \"chancellor swap\" threat from younger conservative Hendrik Wüst as polls slide.</li><li><strong>Fiscal tension:</strong> The Finance Ministry is threatening to cut funding for ministries that fail to spend the €500bn infrastructure fund.</li><li><strong>EU friction:</strong> Berlin is resisting EU debt while simultaneously clashing with the ECB over the Commerzbank-UniCredit merger.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the KNDS listing and whether Merz can repair the relationship with the Trump administration to avoid a total US security vacuum in Europe.</p>", "central banks": "<p>Global central banks are pivoting toward tighter monetary policy to combat energy shocks and geopolitical instability.</p><p><strong>Why it matters:</strong> Conflict in Iran has spiked inflation and destabilized currencies, forcing a reversal of the previous trend toward rate cuts.</p><p><strong>The Fed shift</strong> Kevin Warsh’s debut as Fed Chair marks a \"new chapter\" defined by hawkishness.</p><ul><li><strong>The trigger:</strong> Inflation is nearly double the Fed's target due to the Iran war.</li><li><strong>The action:</strong> The Fed has dropped its bias for rate cuts; officials now tilt toward rate hikes.</li><li><strong>Market reaction:</strong> U.S. government bonds dropped as markets priced in higher borrowing costs.</li></ul><p><strong>Global divergence</strong> Central banks are reacting to localized pressures and energy volatility:</p><ul><li><strong>ECB:</strong> First G7 bank to raise rates since 2023 to counter Middle East energy crises.</li><li><strong>Bank of Japan:</strong> Raised rates to 1% for the first time since 1995.</li><li><strong>SE Asia:</strong> Indonesia and Philippines raised rates to shore up failing currencies.</li><li><strong>Bank of England:</strong> Held rates at 3.75% as a US-Iran deal temporarily eased oil prices.</li></ul><p><strong>Between the lines</strong> Central banks are losing faith in global stability.</p><ul><li><strong>Gold repatriation:</strong> Institutions are moving bullion home to avoid sanctions and foreign insecurity.</li><li><strong>De-dollarization:</strong> The ECB is tightening its course amid a broader shift away from U.S. dollar reliance.</li></ul><p><strong>What's next</strong> Investors are watching for a \"populist\" push for immediate rate hikes to prevent a repeat of 2008-style policy errors.</p>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand their balance sheets and global footprints.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing Wall Street giants to outpace European and Swiss rivals who remain constrained by stricter rules.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan claims was freed by the Trump administration's lighter regulatory approach.</li><li><strong>$20 billion:</strong> The potential acquisition budget Jamie Dimon says JPMorgan could deploy.</li><li><strong>$114 billion:</strong> Combined revenues of non-bank trading firms (e.g., Citadel, Jane Street) challenging traditional banks.</li></ul><p><strong>The strategic pivot</strong></p><ul><li><strong>European Expansion:</strong> JPMorgan is scaling its digital bank, Chase, into France, Spain, Italy, and Germany.</li><li><strong>Private Credit:</strong> Citi is partnering with BlackRock in a €15bn deal to compete in private European lending.</li><li><strong>Crypto Integration:</strong> Morgan Stanley is adding spot crypto trading to its E*Trade platform.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal Friction:</strong> Goldman Sachs is expanding its management committee to a size exceeding its peers, while facing executive departures over internal policy disputes.</li><li><strong>Geopolitical Hedge:</strong> Banks are navigating a fragmented landscape, evidenced by Morgan Stanley issuing China-only iPhones to Hong Kong staff for data security.</li><li><strong>Risk Management:</strong> JPMorgan is actively seeking to offload $4bn in private equity-linked loans as PE firms slow down.</li></ul><p><strong>What's next</strong> Watch for a surge in M&A activity as US banks deploy their newly unlocked capital to acquire smaller players or enter new digital markets.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>20 Jun 2026 12:18 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
