/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Middle East is triggering a global energy shock that transcends crude oil prices.</p><p><strong>Why it matters:</strong> Supply disruptions from Iran and Saudi Arabia are creating critical shortages in lubricants and refining capacity, forcing governments to deploy emergency reserves and subsidies.</p><p><strong>The volatility loop</strong></p><ul><li><strong>Supply shocks:</strong> Attacks on Saudi pipelines have pushed Chinese oil prices to record highs and prompted France to call a G7 summit on oil reserves.</li><li><strong>Secondary effects:</strong> A global motor oil shortage has caused US retail prices to quadruple.</li><li><strong>Market friction:</strong> US government delays in approving the Carlyle-Lukoil deal have left refineries idle during a price surge.</li></ul><p><strong>The transition tension</strong></p><ul><li><strong>Green acceleration:</strong> Biodiesel for shipping is now cheaper than conventional fuels, accelerating the shift to low-carbon maritime energy.</li><li><strong>Battery race:</strong> China leads in sodium battery development, threatening Western dominance in EV energy storage.</li><li><strong>Carbon capture:</strong> Ineos is advancing CO2 storage in Denmark, signaling a shift toward industrial-scale sequestration.</li></ul><p><strong>Geopolitical pivots</strong></p><ul><li><strong>Venezuela:</strong> US-aligned producers, including Harold Hamm, are moving into Venezuela following US military intervention.</li><li><strong>Russia:</strong> New US legislation authorizes tariffs up to 100% on importers of Russian oil.</li><li><strong>LNG risk:</strong> High prices caused by the Hormuz crisis are driving Asian markets to seek long-term alternatives to LNG.</li></ul><p><strong>What's next:</strong> Watch for the impact of the Dangote IPO on African industrial investment and the ability of El Niño to stabilize Europe's energy storage, which currently sits at 69% (down oning the route for costly alternatives.</li><li><strong>Finance:</strong> Saudi Arabia has exited China's cross-border currency platform, signaling a pivot in its strategic financial alignment.</li></ul><p><strong>Geopolitical shifts</strong></p><ul><li><strong>Saudi Crisis:</strong> Riyadh is facing a security emergency after Houthi missiles hit the capital and rebel forces overran previously armed allies.</li><li><strong>Diplomatic Reset:</strong> The UAE and Qatar are pushing for a \"new mindset\" and a regional security framework to end the stalemate.</li><li><strong>US Pressure:</strong> The Trump administration is leveraging arms deals ($24bn F-35 sale to Saudi Arabia) while pressing Ukraine to stop hitting Russian refineries to stabilize diesel prices.</li></ul><p><strong>The new battlefield</strong></p><ul><li><strong>AI Integration:</strong> Autonomous systems are now active in the theater, operating with unpredictable models.</li><li><strong>Sanction War:</strong> Iran is bypassing US naval blockades by activating land routes through Turkey, while US sanctions cripple Iranian aviation.</li></ul><p><strong>What's next:</strong> Watch for US Congressional opposition to the Saudi F-35 deal and whether European sanctions on Israeli settler businesses trigger a wider diplomatic rift.</p>", "shipping": "<p>Global shipping is entering a period of structural instability driven by geopolitical conflict, climate volatility, and cyber vulnerability.</p><p><strong>Why it matters:</strong> The collapse of traditional maritime rules and the rise of \"shadow fleets\" are decoupling global trade from established legal frameworks, increasing systemic risk for insurers and nations.</p><p><strong>The Chokepoint Crisis</strong></p><ul><li><strong>Hormuz:</strong> Iranian attacks and US-imposed transit windows have turned the Strait into a high-risk zone, threatening the \"existential\" viability of hubs like Jebel Ali.</li><li><strong>Panama:</strong> El Niño-driven droughts :</strong> The size of the Maga Inc. war chest Republicans are pressuring Trump to deploy.</li><li><strong>$5,000:</strong> The \"dividend\" Trump promised to pay all American adults if Republicans win.</li><li><strong>Record High:</strong> Fuel prices hitting a Labor Day peak, fueling voter anxiety in swing states.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal Friction:</strong> GOP candidates fear Trump has become \"toxic,\" while Hispanic voters report feeling \"betrayed\" by immigration policies.</li><li><strong>Strategic Pivot:</strong> Republicans are prioritizing \"fear of the alternative\" over specific policy platforms to mask low approval ratings.</li><li><strong>Legal Hurdles:</strong> The Supreme Court's rejection of Trump's mail-in ballot restrictions removes a key GOP effort to limit voting access.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Money War:</strong> Watch for a surge in spending from Trump and Elon Musk’s Super PACs to offset polling deficits.</li><li><strong>The \"Affordability\" Factor:</strong> Cost-of-living data will likely dictate the outcome in pivotal swing states like Pennsylvania.</li><li><strong>Democratic Strategy:</strong> If they seize Congress, Democrats plan to launch oversight probes into the \"Trump crime family\" and Elon Musk.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival after a devastating electoral rout by the far-right AfD in eastern Germany.</p><p><strong>Why it matters:</strong> The AfD's surge signals a collapse of the political center and creates a volatile power vacuum in the east. This instability weakens Germany's leadership at a time of critical security decisions regarding Ukraine and the EU.</p><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for upcoming federal polls.</li><li><strong>3 seats:</strong> The narrow margin preventing the AfD from leading a regional government in Saxony-Anhalt.</li><li><strong>40,000:</strong> Employees at Commerzbank the government is fighting to protect amid takeover talks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Nostalgia\" Gap:</strong> Younger voters view fascism and communism as distant history, making them more susceptible to radicalism.</li><li><strong>The East-West Divide:</strong> Memories of \"friendly\" Russians and a sense of failed reunification are fueling the AfD's momentum in eastern states.</li><li><strong>The Kingmaker:</strong> The hard-left BSW party has emerged as a potential power broker, complicating the path for traditional parties.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Merz's viability:</strong> The CDU is increasingly treating the Chancellor as a liability, avoiding joint campaigns to stem the far-right tide.</li><li><strong>Geopolitical shifts:</strong> The Kremlin and Trump administration are leveraging the AfD's rise to undermine Western cohesion.</li><li><strong>Policy pivot:</strong> The political center must deliver tangible economic and social wins quickly or risk a total shift toward the fringes.</li></ul>", "central banks": "<p>Central banks are entering a volatile cycle of rate hikes and balance sheet reductions amid persistent inflation and political pressure.</p><p><strong>Why it matters:</strong> Rising bond yields and oil prices are forcing policymakers to tighten monetary policy to maintain credibility, even as political figures demand lower borrowing costs.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> Chair Kevin Warsh has initiated rate hikes to curb inflation, signaling a commitment to central bank independence despite pressure from Donald Trump.</li><li><strong>Bank of England:</strong> The BoE is executing a multiyear plan to unwind quantitative easing (QE) gilt purchases by 2034.</li><li><strong>Bank of Japan:</strong> Despite raising rates to the highest level since 1995, the yen continues to sink, prompting warnings of currency intervention.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political Friction:</strong> A growing trend toward state-directed finance threatens the traditional independence of monetary policymakers.</li><li><strong>Data Noise:</strong> Social media echo chambers are skewing consumer inflation expectations, making traditional survey data less reliable for officials.</li><li><strong>Systemic Risk:</strong> Regulators are intensifying scrutiny of prime brokers following significant losses at AI-focused hedge funds.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Further Tightening:</strong> High oil prices may force the ECB and BoE to raise rates further to prevent inflation from embedding.</li><li><strong>Balance Sheet Shifts:</strong> While quantitative tightening (QT) is underway, central bank balance sheets are expected to remain larger than pre-pandemic levels.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven infrastructure and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is shifting capital from traditional lending to high-growth AI data centers and tokenized assets to offset slowing trading revenues.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley is leading debt structures for AI data centers; banks are offloading $15bn in Anthropic-related debt to free up capacity for more mega-deals.</li><li><strong>Cost cutting:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has eliminated routine billable hours.</li><li><strong>Revenue:</strong> Semiconductor investments in Asia are driving record equities growth for US firms.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulatory push:</strong> Regulators are narrowing enforcement to focus strictly on financial /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>21 Sep 2026 16:37 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
