const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and the energy transition are forcing oil and gas majors to aggressively restructure assets and supply routes.</p><p><strong>Why it matters:</strong> Conflict in the Strait of Hormuz threatens global oil flows, while the shift toward net-zero targets creates internal leadership volatility and asset divestment.</p><p><strong>The geopolitical squeeze</strong></p><ul><li><strong>Supply security:</strong> Adnoc is planning a new UAE pipeline to bypass the Strait of Hormuz to mitigate Iranian threats.</li><li><strong>Resource wars:</strong> China is aggressively pursuing US tungsten, while the US is scaling nuclear fuel production to end reliance on Russia.</li><li><strong>Critical minerals:</strong> European startups are drilling for lithium under auto factories to break China's market dominance.</li></ul><p><strong>Corporate volatility</strong></p><ul><li><strong>BP in flux:</strong> CEO Meg O’Neill is pursuing a restructuring that includes potential £2bn North Sea asset sales and follows the removal of the company's chair.</li><li><strong>Leadership shifts:</strong> TotalEnergies shareholders extended Patrick Pouyanné’s tenure beyond 2030 to ensure stability.</li><li><strong>Strategic pivots:</strong> Adani and Tata Power are positioning for India's opening of the nuclear sector to private firms.</li></ul><p><strong>The transition friction</strong></p><ul><li><strong>Policy clashes:</strong> UK Energy Secretary Ed Miliband is pushing for an 87% emissions cut by 2040, sparking political opposition.</li><li><strong>Execution gaps:</strong> Botched heat pump installations are eroding public confidence in government energy transition plans.</li><li><strong>Legal battles:</strong> Seven US states are suing the government over a $1bn payment intended to push Total back into fossil fuels.</li></ul><p><strong>What's next:</strong> Expect increased volatility in oil pricing as the \"demand shock\" from the Iran crisis persists and Western firms accelerate the decoupling of critical mineral chains from China.</p>", "corporate earnings and results": "<p>Big Tech is aggressively pivoting capital toward AI infrastructure to secure future revenue streams.</p><p><strong>Why it matters:</strong> Massive capital expenditures are now the primary driver of corporate equity strategies and product roadmaps. Failure to scale AI capabilities risks permanent loss of market share to rivals.</p><p><strong>The AI Arms Race</strong></p><ul><li><strong>Alphabet:</strong> Upsizing a record-breaking equity raise to $85bn to fund AI spending.</li><li><strong>Meta:</strong> Deploying AI agents within WhatsApp to monetize the messaging platform.</li><li><strong>The Goal:</strong> Shifting from experimental AI to integrated, revenue-generating business tools.</li></ul><p><strong>Market Shifts</strong></p><ul><li><strong>Passive Dominance:</strong> A Vanguard ETF became the first to top $1tn in assets, signaling a massive pool of capital ready for high-valuation IPOs.</li><li><strong>Private Credit:</strong> Growth continues, though some firms, like Partners Group, are capping redemptions to manage liquidity in flagship vehicles.</li></ul><p><strong>Regional Headwinds</strong></p><ul><li><strong>UK Manufacturing:</strong> Nissan partnered with China’s Chery to stabilize the Sunderland plant following a Japanese group restructuring.</li><li><strong>EU Regulation:</strong> Mobile gaming giants warn that Brussels' digital sovereignty plans could stifle tech growth.</li><li><strong>Retail Stress:</strong> B&M profits plummeted 47% amid accounting errors and a difficult turnaround year.</li></ul><p><strong>What's next:</strong> Watch for Alphabet's stock offering to set a new benchmark for how \"hyperscalers\" fund the AI transition without depleting cash reserves.</p>", "middle east war": "<p>The Middle East is oscillating between a fragile ceasefire and expanded military offensives.</p><p><strong>Why it matters:</strong> Escalation in the Strait of Hormuz and Lebanon threatens global energy prices and Eurozone inflation, while contradictory signals from Washington and Tehran create extreme market volatility.</p><p><strong>The conflict landscape</strong></p><ul><li><strong>Lebanon:</strong> Israel has expanded its offensive against Hizbollah, capturing strategic positions including a Crusader castle.</li><li><strong>Displacement:</strong> Nearly 1 million people are displaced in Lebanon, creating a humanitarian crisis in Beirut.</li><li><strong>Iran:</strong> Tehran is utilizing Western AI to enhance cyber operations and malware development.</li></ul><p><strong>Economic ripple effects</strong></p><ul><li><strong>Energy:</strong> Brent crude saw its biggest monthly decline since 2020 on hopes of the Strait of Hormuz reopening.</li><li><strong>Inflation:</strong> Eurozone inflation hit 3.2% in May, driven by Middle East energy shocks.</li><li><strong>Markets:</strong> US stocks hit their longest weekly winning streak since 2023, fueled by ceasefire optimism.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Diplomatic friction:</strong> Prime Minister Netanyahu faces domestic backlash after failing to bomb Hizbollah following pressure from President Trump.</li><li><strong>Tehran's skepticism:</strong> Iran views generous US concessions as a potential trap, fearing a short-term deal leads to future conflict.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Hormuz gamble:</strong> Shipping operators are repositioning vessels to capitalize on a potential reopening of the strategic waterway.</li><li><strong>US Strategy:</strong> The Trump administration remains \"patient\" on a deal but maintains readiness to restart strikes.</li></ul>", "shipping": "<p>Global shipping is fracturing as conflict in the Strait of Hormuz disrupts energy flows and forces a permanent reshaping of trade routes.</p><p><strong>Why it matters:</strong> Blockages in key waterways trigger immediate spikes in freight costs and force nations to pivot to inferior energy alternatives. This instability creates systemic risks for global inflation and environmental safety.</p><p><strong>The Hormuz Crisis</strong></p><ul><li><strong>Operational deadlock:</strong> US insurance schemes have seen zero uptake due to a lack of naval escorts.</li><li><strong>Logistical pivots:</strong> Cargo is shifting to trucks, increasing costs by thousands of dollars per shipment.</li><li><strong>Energy shifts:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert.</li><li><strong>$1.3 billion:</strong> Belfast Harbour's investment to capture diverted Irish Sea freight.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Environmental risk:</strong> A \"shadow fleet\" of aging, sanctioned tankers is increasing the likelihood of catastrophic oil spills.</li><li><strong>Human cost:</strong> Seafarers are stranded on \"ghost\" tankers, facing both geopolitical danger and biological hazards.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route permanence:</strong> Trade patterns are shifting permanently away from high-risk narrow seas.</li><li><strong>Last-mile evolution:</strong> Retailers like Walmart are repurposing urban real estate to bypass traditional shipping bottlenecks.</li></ul>", "artificial intelligence": "<p>Artificial intelligence has triggered a global capital reallocation toward infrastructure and superintelligence.</p><p><strong>Why it matters:</strong> Massive spending on data centers and chips is driving a \"domino rally\" in legacy IT brands while forcing a geopolitical race for \"AI sovereignty.\"</p><p><strong>By the numbers</strong></p><ul><li><strong>$100 billion:</strong> Meta's estimated gamble to secure a lead in the AI race.</li><li><strong>$80 billion:</strong> Alphabet's planned equity raise to fund AI spending.</li><li><strong>37%:</strong> The surge in HPE shares due to infrastructure demand.</li><li><strong>€5 billion:</strong> Investment in a French AI \"gigafactory\" to build Europe's digital backbone.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market volatility:</strong> Investors are betting on high-growth tech via convertible bonds, yet fear AI could disrupt traditional IT consulting firms like Accenture.</li><li><strong>Existential risk:</strong> Labs are shifting focus toward \"machine consciousness\" and superintelligence, sparking warnings from safety experts.</li><li><strong>Regulatory friction:</strong> Governments are balancing early access to models with lawsuits over child safety and concerns over corporate influence on policy.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Public markets:</strong> Anthropic's IPO will test Wall Street's appetite for AI valuations.</li><li><strong>Geopolitics:</strong> A fragile US-China tech truce faces new supply chain conflicts.</li><li><strong>Product shift:</strong> Microsoft and Tencent are pivoting toward business-specific tools and AI agents for mass-market apps.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony defined by asymmetry and instability.</p><p><strong>Why it matters:</strong> A vacuum in global leadership is increasing the risk of direct conflict while forcing middle powers to hedge their bets.</p><p><strong>Between the lines</strong></p><ul><li><strong>The Leadership Gap:</strong> Washington is retreating from traditional global responsibilities; Beijing is attempting to fill the void but lacks the appetite for the associated costs.</li><li><strong>Asymmetric Leverage:</strong> Power no longer stems from raw wealth or size, but from the ability to exploit imbalances in the global order.</li><li><strong>The Russia Factor:</strong> Putin’s strategic errors have created a one-sided dependency on China, granting Beijing significant regional leverage.</li></ul><p><strong>The Strategic Shift</strong></p><ul><li><strong>Soft Power Pivot:</strong> Beijing is aggressively courting foreign officials to project stability as the U.S. burns diplomatic bridges.</li><li><strong>The \"Stalemate\" Era:</strong> Military and political victories are becoming harder to achieve, leading to prolonged conflicts and a reliance on \"middleman\" envoys.</li><li><strong>Geographic Reality:</strong> Despite digital advancement, physical geography and choke points (e.g., the Strait of Hormuz) remain the primary drivers of conflict.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Reform:</strong> Multilateral bodies like the UN face obsolescence unless they reinvent governance to match a fractured world.</li><li><strong>Risk Evolution:</strong> Corporations and governments are shifting from growth-centric models to resilience and contingency planning.</li><li><strong>NATO Tension:</strong> European allies are demanding clarity on U.S. troop levels to prevent a deterrence gap against Russia.</li></ul>", "us elections": "<p>The U.S. midterm landscape is shifting as Trump’s influence over GOP primaries creates strategic vulnerabilities for Republicans in swing states.</p><p><strong>Why it matters:</strong></p><ul><li>Trump-backed \"MAGA\" candidates are winning primaries but may alienate moderate general election voters.</li><li>Democrats are pivoting toward populist, working-class candidates to reclaim lost voter blocs.</li></ul><p><strong>The Texas Tension</strong></p><ul><li>Ken Paxton's primary victory secures Trump's hold on the GOP base.</li><li>Democrats view Paxton's controversial profile as a liability that puts the Texas Senate seat in play.</li></ul><p><strong>Strategic Shifts</strong></p><ul><li><strong>Pennsylvania:</strong> A former firefighter's win signals a Democratic move toward populist messaging.</li><li><strong>Maine:</strong> Rising costs from tariffs and fuel are eroding Trump support among lobster fishermen.</li><li><strong>Kentucky:</strong> Trump-backed challengers are successfully ousting \"maverick\" Republicans.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.8 billion:</strong> The cost of Trump's proposed \"anti-weaponization\" fund, currently stalled by GOP senators.</li><li><strong>>50%:</strong> Proportion of voters who disapprove of Trump's economic handling, per FT polling.</li></ul><p><strong>Between the lines</strong> The GOP is experiencing a generational rightward shift. While this consolidates Trump's power internally, it increases the risk of \"Pyrrhic victories\" where primary wins lead to general election losses.</p><p><strong>What's next</strong></p><ul><li><strong>November Midterms:</strong> Focus shifts to whether MAGA candidates can expand appeal beyond the base.</li><li><strong>2028 Horizon:</strong> Early friction is emerging between JD Vance and Marco Rubio for future leadership.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy and fiscal discipline amid a collapsing relationship with the U.S.</p><p><strong>Why it matters:</strong> A diplomatic rift with Donald Trump is forcing Berlin to accelerate rearmament and assume European leadership to avoid security vacuums.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit the 3.5% GDP NATO target six years ahead of schedule.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency and buying a 40% stake in tank maker KNDS to speed up production.</li><li><strong>Strategic shift:</strong> Germany published its first military strategy since WWII, signaling a permanent move toward \"more responsibility\" for European defense.</li></ul><p><strong>The Trump friction</strong></p><ul><li><strong>Diplomatic fallout:</strong> Chancellor Friedrich Merz’s criticism of U.S. strategy in Iran led Trump to review and potentially pull 5,000 U.S. troops from Germany.</li><li><strong>Arms race:</strong> Berlin is pushing for Tomahawk missile purchases despite the political row to hedge against U.S. instability.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political volatility:</strong> The far-right AfD is topping polls by leveraging voter anger over fuel prices and the Iran war.</li><li><strong>Leadership cracks:</strong> Merz faces internal CDU pressure as younger rival Hendrik Wüst emerges as a \"dark horse\" for the chancellery.</li></ul><p><strong>Economic tightening</strong></p><ul><li><strong>Fiscal discipline:</strong> The Finance Ministry is threatening to cut funding for ministries that fail to spend a €500bn infrastructure fund.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25% to exit the wartime nationalization.</li></ul><p><strong>What's next:</strong> Watch for the September elections in eastern states, which will determine if the AfD's surge translates into governing power.</p>", "central banks": "<p>Central banks are pivoting toward restrictive policies and structural diversification amid geopolitical instability and persistent inflation.</p><p><strong>Why it matters:</strong> Geopolitical shocks—specifically the Iran war—are driving inflation higher, forcing banks to abandon rate-cut signals and threatening the \"policy put\" investors rely on during crises.</p><p><strong>The policy shift</strong></p><ul><li><strong>Fed/BoE:</strong> Shifting toward an \"active hold\" or rate hikes to counter inflation spikes.</li><li><strong>ECB:</strong> Preparing for June tightening as core inflation and energy costs spill into the wider economy.</li><li><strong>Forward Guidance:</strong> The Fed is moving to roll back explicit signals to Wall Street to regain flexibility.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>27%:</strong> Gold's new share of global reserves, surpassing US Treasuries as central banks diversify away from the dollar.</li><li><strong>$219B:</strong> The size of the US Exchange Stabilization Fund currently under bipartisan scrutiny in the Senate.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political Risk:</strong> Threats to central bank independence and volatile trade policies are viewed by the ECB as systemic risks to financial stability.</li><li><strong>Fiscal Constraints:</strong> Demographic shifts and rising debt interest payments are limiting the effectiveness of independent monetary policy.</li><li><strong>Tech Integration:</strong> Banks are successfully testing cross-border blockchain payments while simultaneously warning that AI models create new systemic vulnerabilities.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership Transition:</strong> Incoming Fed Chair Kevin Warsh faces immediate pressure to justify rate decisions amid rising inflation.</li><li><strong>Market Disconnect:</strong> A widening gap persists between professional forecasters and money markets regarding the timing of policy pivots.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand balance sheets and capture market share.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing giants like JPMorgan to pursue massive acquisitions and international retail expansion while European rivals remain constrained.</p><p><strong>The capital shift</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks due to regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan claims is now available for deployment.</li><li><strong>$20 billion:</strong> The potential price tag for JPMorgan's next major acquisition.</li></ul><p><strong>Competitive pressures</strong></p><ul><li><strong>Non-bank threat:</strong> Trading firms like Jane Street and Citadel Securities are eroding Wall Street's dominance, with Jane Street revenues hitting $114 billion.</li><li><strong>AI risk:</strong> Banks are actively offloading data center debt to avoid overexposure to the AI infrastructure boom.</li><li><strong>Crypto pivot:</strong> Morgan Stanley is integrating spot crypto trading into E*Trade to capture retail digital asset flows.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Retail push:</strong> JPMorgan is expanding its \"Chase\" digital bank into Germany after a UK launch.</li><li><strong>Private credit:</strong> Citi partnered with BlackRock in a €15 billion deal to scale private lending in Europe and the Middle East.</li><li><strong>Incentive overhaul:</strong> Citigroup is shifting to direct employee payments for referrals to break down internal silos.</li></ul><p><strong>Between the lines</strong> The gap between US and European investment banks is widening. US traders are posting triple the gains of European peers by better capitalizing on commodity volatility and a more permissive regulatory environment.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>03 Jun 2026 15:16 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
