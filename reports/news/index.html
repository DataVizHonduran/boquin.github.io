const SUMMARIES = {"oil and gas": "<p>Global energy markets are shifting toward a high-stakes competition for resource security and electrification.</p><p><strong>Why it matters:</strong> Geopolitical instability and the AI-driven power surge are forcing a pivot from pure decarbonization to strategic energy resilience.</p><p><strong>The geopolitical tug-of-war</strong></p><ul><li><strong>Venezuela:</strong> Investment firms are launching a $100bn push for Venezuelan oil assets.</li><li><strong>Norway:</strong> Prime Minister Jonas Gahr Støre is pressuring the EU to scrap Arctic drilling bans to ensure security.</li><li><strong>Asia:</strong> 15 countries have requested $4bn in emergency support as conflict in Iran triggers a \"worst case\" energy crisis.</li></ul><p><strong>The AI-Energy paradox</strong></p><ul><li><strong>Demand:</strong> AI efficiency gains are offset by massive energy consumption, accelerating the corporate push for electrification.</li><li><strong>Innovation:</strong> AI is being deployed to speed up battery materials discovery to mitigate these power needs.</li></ul><p><strong>The transition friction</strong></p><ul><li><strong>Policy risk:</strong> Early adopters of EU green policies face uncertainty as Brussels waters down climate targets.</li><li><strong>Market volatility:</strong> Trading firm DRW lost $176mn due to extreme winter power price gyrations.</li><li><strong>Nuclear revival:</strong> New investment in fission and fusion is creating a projected $73bn supplier market.</li></ul><p><strong>Between the lines</strong> The \"new joule order\" prioritizes optionality. China's aggressive investment in electrification has given it a strategic lead over Western nations.</p>", "corporate earnings and results": "<p>Global markets are rallying on a mix of geopolitical breakthroughs and high-valuation AI debuts.</p><p><strong>Why it matters:</strong> A US-Iran deal on the Strait of Hormuz has removed a primary systemic risk, while SpaceX's $2tn valuation signals that investors are prioritizing long-term mission scale over traditional discounted cash flow (DCF) models.</p><p><strong>By the numbers</strong></p><ul><li><strong>$20bn+:</strong> Amount Nvidia seeks to raise in its first bond deal since 2021 to fund AI expansion.</li><li><strong>$22bn:</strong> Fox's acquisition price for Roku, creating the third-largest US TV entity by viewership.</li><li><strong>10%:</strong> Monday's gain for SpaceX shares following its IPO.</li><li><strong>14 cents:</strong> Average recovery for losers in \"creditor-on-creditor\" debt exchanges.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Appetite:</strong> Nvidia's massive debt sale tests whether investor exposure to AI has reached a saturation point.</li><li><strong>Strategic Shifts:</strong> Fox's Roku buy confirms a permanent pivot from linear broadcasting to streaming dominance.</li><li><strong>Regulatory Pressure:</strong> The UK's FCA is increasing fines to counter recent court-ordered penalty reductions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>M&A Volatility:</strong> Watch UniCredit's Commerzbank bid and SFR's €20bn break-up for signs of EU regulatory appetite for consolidation.</li><li><strong>Activist Pressure:</strong> Elliott's push for Bunzl buybacks suggests a continuing trend of US hedge funds targeting UK undervalued assets.</li></ul>", "middle east war": "<p>The U.S. and Iran are set to sign a deal Friday to end a naval blockade and reopen the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The agreement signals the failure of the U.S. military option to force an Iranian surrender, shifting the conflict from active combat to diplomatic negotiation.</p><p><strong>The deal's core:</strong></p><ul><li>Extends the current ceasefire by 60 days.</li><li>Reopens the Strait of Hormuz to global shipping.</li><li>Initiates new nuclear negotiations.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Trump's pivot:</strong> The president is abandoning his \"unconditional surrender\" rhetoric for a \"truce of convenience.\"</li><li><strong>Israeli friction:</strong> Netanyahu faces domestic anger over U.S. demands to halt campaigns in Lebanon.</li><li><strong>Military limits:</strong> U.S. bombardment failed to destroy Iran's underground \"missile cities.\"</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>Oil:</strong> Prices dipped on the news, though analysts warn the Hormuz backlog will take weeks to clear.</li><li><strong>Defense:</strong> European defense stocks are sliding as funding concerns mount.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Friday signing:</strong> Formalization of the waterway reopening.</li><li><strong>Regional stability:</strong> Israel's recent strikes on Beirut threaten to derail the broader peace push.</li></ul>", "shipping": "<p>Global shipping is currently defined by a volatile struggle for control over strategic chokepoints and the rise of a high-risk \"shadow fleet.\"</p><p><strong>Why it matters:</strong> Geopolitical conflict in the Strait of Hormuz and the war in Ukraine are decoupling global trade from traditional safety standards, driving up costs and environmental risks.</p><p><strong>The Hormuz Crisis</strong></p><ul><li><strong>Market volatility:</strong> Oil prices dropped 6% after two supertankers successfully crossed the strait, signaling potential resumption of energy flows.</li><li><strong>Failed interventions:</strong> A $40bn U.S. insurance facility has seen zero uptake because it lacks naval escorts.</li><li><strong>Logistical pivots:</strong> Freight rates are spiking as companies switch to trucks to bypass blocked waterways.</li></ul><p><strong>The Shadow Fleet</strong></p><ul><li><strong>Environmental risk:</strong> Over 50% of sanctioned \"shadow\" tankers are aging vessels posing imminent disaster risks.</li><li><strong>Enforcement:</strong> The UK is actively intercepting Russian tankers to disrupt funding for the Ukraine war.</li><li><strong>Sanction leaks:</strong> Danish shipyard Fayard remains the only EU yard servicing Russian LNG tankers.</li></ul><p><strong>Strategic Shifts</strong></p><ul><li><strong>Defense boom:</strong> South Korea and UK shipyards (Cammell Laird) are scaling up to meet rising global defense spending.</li><li><strong>Energy pivots:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to compete with Dublin via freight and offshore wind.</li></ul><p><strong>What's next:</strong> Shipowners who invested windfall profits into new vessels face a potential market crash if the Strait of Hormuz fully reopens and rates plummet.</p>", "artificial intelligence": "<p>AI is fundamentally restructuring global finance, national security, and the labor market.</p><p><strong>Why it matters:</strong> The rapid deployment of AI is creating a \"capabilities gap\" where technical proficiency is now a prerequisite for non-tech roles, while simultaneously triggering aggressive government intervention to secure AI as a strategic national asset.</p><p><strong>The economic shift</strong></p><ul><li><strong>Investment:</strong> Wall Street is absorbing record capital flows, highlighted by SpaceX's $75bn IPO and massive fundings for Anthropic and Alphabet.</li><li><strong>Labor:</strong> The focus is shifting from \"job replacement\" to a \"self-service economy\" and a requirement for \"human-centric\" skills in finance.</li><li><strong>Infrastructure:</strong> Insurance regulators are now probing credit risks tied to the massive build-out of AI data centers.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>Export Controls:</strong> The Trump administration has frozen Anthropic's top models (Fable and Mythos) to prevent foreign access on national security grounds.</li><li><strong>Sovereignty:</strong> Discussions are emerging around \"AI sovereign wealth funds\" to ensure societal benefit from technological gains.</li></ul><p><strong>The risk profile</strong></p><ul><li><strong>Fraud:</strong> UK consumer losses from financial fraud hit a 4-year high in 2025, increasing pressure on tech firms.</li><li><strong>Reliability:</strong> High-profile \"hallucinations\" in professional reports (e.g., KPMG) highlight the danger of over-reliance on AI-generated data.</li><li><strong>Legal:</strong> Law enforcement is now investigating the criminal use of AI to pervert the course of justice.</li></ul><p><strong>What's next:</strong> Policymakers must develop new tax codes to handle AI-generated wealth and address potential mass underemployment as the \"self-service\" economy scales.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony defined by asymmetry and instability.</p><p><strong>Why it matters:</strong></p><ul><li>Power is shifting from traditional wealth to the ability to leverage geopolitical imbalances.</li><li>A leadership vacuum is emerging as Washington retreats from global commitments and Beijing hesitates to assume the associated responsibilities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Soft power pivot:</strong> Beijing is capitalizing on U.S. diplomatic volatility to improve its global image and portray itself as a pillar of stability.</li><li><strong>The Russia factor:</strong> Putin’s strategic missteps have created a one-sided dependency, granting China significant leverage over Moscow.</li><li><strong>Middle power anxiety:</strong> Nations like Japan and Germany are aggressively forging new alliances to survive a \"might is right\" world order.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Zero-sum gains:</strong> The \"Thucydides Trap\" persists, though high-level summits provide temporary, low-expectation stability.</li><li><strong>Economic risk:</strong> Geopolitical volatility is forcing business schools and global industries (e.g., F1) to integrate risk management into core operations.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional decay:</strong> Multilateral bodies like the UN face irrelevance unless they reinvent governance to reflect current power dynamics.</li><li><strong>Strategic resilience:</strong> Expect a surge in \"simultaneity\" planning as the U.S. manages concurrent crises across Europe, the Middle East, and Asia.</li></ul>", "us elections": "<p>US midterm elections are shifting into a high-stakes general election phase defined by candidate volatility and economic discontent.</p><p><strong>Why it matters:</strong> Trump's influence over GOP primaries is creating a \"MAGA\" slate that may alienate moderate swing voters. Simultaneously, inflation and foreign policy failures are eroding the president's base.</p><p><strong>The battlegrounds</strong></p><ul><li><strong>Texas:</strong> Trump-backed Ken Paxton won the primary, but Democrats view his polarizing image as a liability for Republicans in November.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li><li><strong>Maine:</strong> Controversial Democrat Graham Platner will challenge incumbent Susan Collins despite misconduct allegations.</li><li><strong>Pennsylvania:</strong> A populist victory by a former firefighter signals a working-class shift within the Democratic party.</li></ul><p><strong>The headwinds</strong></p><ul><li><strong>Economics:</strong> FT polling shows voters blame Trump for high grocery prices and inflation.</li><li><strong>Foreign Policy:</strong> House Republicans blocked further strikes in the Middle East, signaling a rift over the Iran war.</li><li><strong>Base Erosion:</strong> Evangelicals are questioning if Trump's rhetoric aligns with Christian values.</li></ul><p><strong>Between the lines</strong> The GOP is currently a house divided. While Trump successfully purged critics—evidenced by Thomas Massie's loss in Kentucky—his $1.8bn \"anti-weaponisation\" fund is facing internal Republican resistance.</p><p><strong>What's next</strong> Watch for the \"lobster revolt\" in Maine and tax refund lows nationwide to further depress voter sentiment ahead of November.</p>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy and fiscal discipline amid collapsing relations with the U.S. and France.</p><p><strong>Why it matters:</strong> Berlin is prioritizing rapid rearmament and industrial control to hedge against U.S. volatility and EU inefficiency. This shift signals a move from \"civilian power\" to a dominant European security actor.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit NATO's 3.5% GDP target six years early.</li><li><strong>Procurement:</strong> Germany is overhauling its arms agency and seeking new fighter jet partners after breaking with France.</li><li><strong>Industry:</strong> Berlin is buying a 40% stake in tank maker KNDS and eyeing a €12bn naval project via Rheinmetall.</li></ul><p><strong>The Trump friction</strong></p><ul><li><strong>Diplomatic rift:</strong> Chancellor Friedrich Merz's criticism of U.S. strategy in Iran has soured ties with Donald Trump.</li><li><strong>Retaliation:</strong> The U.S. is reviewing troop presence and may pull 5,000 soldiers from German soil.</li><li><strong>Urgency:</strong> Berlin is accelerating Tomahawk missile purchases to secure capabilities despite political tension.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD leads opinion polls by leveraging fuel price anger and maintaining ties with the Kremlin.</li><li><strong>Leadership gaps:</strong> Merz faces internal CDU challenges from younger rivals like Hendrik Wüst as polls slide.</li><li><strong>Fiscal pressure:</strong> The Finance Ministry is threatening funding cuts for ministries failing to spend a €500bn infrastructure fund.</li></ul><p><strong>Between the lines</strong> Germany is attempting a high-wire act: leading European defense and financial integration while fighting a domestic populist surge and a hostile U.S. administration.</p>", "central banks": "<p>Central banks are shifting toward aggressive tightening to combat persistent inflation and geopolitical shocks.</p><p><strong>Why it matters:</strong></p><ul><li>Delayed rate hikes risk repeating 2008-era policy errors, potentially embedding inflation into the global economy.</li><li>Energy crises and geopolitical instability are forcing a decoupling of monetary policy from previous \"wait and see\" strategies.</li></ul><p><strong>The current landscape</strong></p><ul><li><strong>ECB:</strong> First G7 bank to raise rates recently, citing Middle East energy crises and broadening price rises.</li><li><strong>The Fed:</strong> New Chair Kevin Warsh faces immediate pressure to hike rates as strong payroll data removes the possibility of cuts.</li><li><strong>Bank of England:</strong> Locked in a debate over corporate pricing strategies while weighing a hold at 3.75%.</li><li><strong>Emerging Markets:</strong> Indonesia implemented an off-cycle rate hike to stabilize the rupiah amid investor flight.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Reserve Shift:</strong> Gold has overtaken US Treasuries as the top reserve asset (27% share) as central banks diversify away from the dollar.</li><li><strong>Guidance Pivot:</strong> The Fed is expected to roll back \"forward guidance,\" reducing the predictability of future rate moves to regain flexibility.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Warsh's Debut:</strong> The Fed Chair's first rate-setting meeting will signal the trajectory for US monetary policy.</li><li><strong>ECB June Meeting:</strong> Higher core inflation in the Eurozone makes a June tightening likely.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand balance sheets and pivot toward high-growth sectors.</p><p><strong>Why it matters:</strong> Lighter regulatory oversight is freeing billions in capital, allowing US lenders to outpace European and Swiss rivals in global market share.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital gain for top US and UK banks due to regulatory loosening.</li><li><strong>$20 billion:</strong> Potential acquisition budget for JPMorgan, fueled by $50 billion in excess capital.</li><li><strong>$114 billion:</strong> Combined revenue for trading firms like Citadel and Jane Street, challenging traditional bank dominance.</li><li><strong>$4 billion:</strong> Amount of private equity-linked loan exposure JPMorgan is seeking to offload.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Banks are shifting toward AI-driven data center debt and spot crypto trading to capture new revenue streams.</li><li><strong>Geopolitical friction:</strong> Morgan Stanley's use of China-only iPhones highlights intensifying data security risks in mainland China.</li><li><strong>Internal volatility:</strong> Goldman Sachs is expanding its management committee and facing executive departures amid leadership friction.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail expansion:</strong> JPMorgan is scaling its Chase digital bank into Germany after its UK launch.</li><li><strong>Risk management:</strong> Lenders will increasingly use private risk transfers to avoid overexposure to the AI infrastructure boom.</li><li><strong>Structural shifts:</strong> Citigroup is overhaulilng internal incentives to pay employees directly for referrals to accelerate its turnaround.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>15 Jun 2026 16:11 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
