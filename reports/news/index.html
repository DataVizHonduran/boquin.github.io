const SUMMARIES = {"oil and gas": "<p>COP31 climate talks collapsed after the EU and Arab nations reached an \"unbridgeable\" deadlock over fossil fuel phaseouts.</p><p><strong>Why it matters:</strong> The failure signals a breakdown in global consensus on decarbonization, shifting the focus from eliminating fossil fuels to relying on carbon capture and energy security.</p><p><strong>The fallout</strong></p><ul><li><strong>Policy pivot:</strong> Negotiators are pivoting toward carbon removal technologies as the 1.5C warming threshold looms.</li><li><strong>EU frustration:</strong> The EU is seeking to reform the UN climate process after rejecting deals it claims \"greenwash\" fossil fuels.</li><li><strong>Market volatility:</strong> Energy prices remain erratic, with a gasoline glut contrasting with inflationary pressures on diesel and jet fuel.</li></ul><p><strong>Sector risks</strong></p><ul><li><strong>Cybersecurity:</strong> U.S. crude export hubs report thousands of daily hacking attempts targeting vital trade routes.</li><li><strong>Supply chain:</strong> European fertilizer plants are shutting down due to soaring power costs, increasing reliance on imports.</li><li><strong>Infrastructure:</strong> The UK's Acorn carbon capture project gained a new developer, EnEarth, to bolster decarbonization goals.</li></ul><p><strong>Between the lines:</strong> The tension between energy security and climate mandates is creating a fragmented market. While China leads in renewables deployment, its hydrogen transport ambitions are faltering due to high costs and subsidy cuts.</p>", "corporate earnings and results": "<p>Corporate earnings are increasingly decoupled from fundamentals, driven instead by founder-led volatility and geopolitical risk.</p><p><strong>Why it matters:</strong> Investor sentiment now prioritizes \"charismatic leadership\" and strategic pivots over traditional balance sheets, creating high-risk valuation bubbles in AI and biotech.</p><p><strong>The \"Founder Effect\"</strong></p><ul><li><strong>Nvidia:</strong> Markets rallied on Jensen Huang’s return, signaling that investors value founder-control over formal succession planning.</li><li><strong>CrowdStrike:</strong> A share drop following the Zscaler merger proves investor patience for \"invincible founders\" has a ceiling.</li></ul><p><strong>Strategic Pivots</strong></p><ul><li><strong>Sanofi:</strong> Executed a $41bn deal to hedge against the \"patent cliff\" and falling Dupixent revenue.</li><li><strong>Ineos:</strong> Negotiating a BYD plant sale to shift production to the U.S. to avoid tariffs.</li><li><strong>Compass:</strong> Planning a move to New York to capture higher liquidity and valuations.</li></ul><p><strong>Between the lines</strong> The shift toward private market ETFs (BlackRock) and the \"private credit tug of war\" suggests a systemic move away from public transparency toward opaque, high-yield alternative assets.</p><p><strong>What's next</strong> Watch for a clash between corporate deregulation (SEC proposals) and national security mandates (U.S. chip controls in Singapore), which will dictate the next cycle of CAPEX spending.</p>", "middle east war": "<p>The Middle East is spiraling toward a full-scale U.S.-Iran confrontation as Houthi and Iranian strikes destabilize Gulf energy hubs.</p><p><strong>Why it matters:</strong> Escalating kinetic attacks on sovereign infrastructure and shipping lanes threaten global energy security and strain U.S. military readiness.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Saudi Arabia:</strong> Houthi rebels struck the Public Investment Fund (PIF) headquarters in Riyadh, targeting the kingdom's economic engine.</li><li><strong>Shipping:</strong> Iranian strikes have reduced oil flows through the Strait of Hormuz, leaving crude exports \"fragile.\"</li><li><strong>Regional Sprawl:</strong> Iran has expanded attacks to include Bahrain and Kuwait; the U.S. responded with strikes on Qeshm Island.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>11:</strong> People injured in the Houthi attack on the PIF Tower.</li><li><strong>8:</strong> Israeli firms sanctioned by the UK for West Bank settlement activity.</li><li><strong>74:</strong> Lashes administered to an Iranian singer, signaling continued internal repression amid external conflict.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>U.S. Strain:</strong> Indefinite deployments and budget cuts are eroding military readiness as the Trump administration weighs further strikes.</li><li><strong>Market Shift:</strong> The traditional correlation between crude prices and bond markets has broken, suggesting inflation is decoupling from oil.</li><li><strong>Political Friction:</strong> In Israel, the appointment of a new parliamentary Speaker and the freezing of the E1 settlement project signal growing internal opposition to Netanyahu’s far-right coalition.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Energy Pivot:</strong> The IEA suggests markets can survive without the Strait of Hormuz, but only with significant time and investment.</li><li><strong>Diplomatic Stakes:</strong> The UAE's bid for a top UN post now hinges on UK diplomatic maneuvering.</li></ul>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict turns primary trade arteries into active war zones.</p><p><strong>Why it matters:</strong> Escalating attacks in the Black Sea and the Strait of Hormuz are driving up operational costs, endangering crews, and forcing a costly reconfiguration of global supply chains.</p><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24:</strong> Tankers targeted by Iran in a two-week window.</li><li><strong>24.6 million:</strong> Daily barrels of oil exported from the Gulf, surpassing pre-war levels via alternative routes.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Tactical shifts:</strong> Iran is moving from harassment to direct sabotage using limpet mines.</li><li><strong>Sovereignty risks:</strong> Russia is using \"spoofing\" (faking locations) to evade sanctions, while the U.S. is utilizing naval blockades to restrict Iranian ports.</li><li><strong>Infrastructure pivots:</strong> DP World’s London Gateway is poised to overtake Felixstowe as Chinese EV imports surge.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Arctic migration:</strong> Russia is shifting grain exports to Arctic ports to bypass Black Sea combat, increasing costs for global buyers.</li><li><strong>Legal battles:</strong> A court case between Mercuria and the Baltic Exchange will determine the validity of shipping price estimates in high-risk zones.</li><li><strong>Political friction:</strong> U.S. state-level officials may block Russian diesel shipments, complicating federal attempts to lower fuel prices.</li></ul>", "artificial intelligence": "<p>AI is shifting from a theoretical innovation phase to a volatile era of geopolitical tension and market instability.</p><p><strong>Why it matters:</strong> The intersection of national security, corporate governance, and supply chain fragility is creating systemic risks for the global economy.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>US-China rivalry:</strong> Focus has shifted from software to supply chain dominance, exposing Washington's limited leverage against Beijing.</li><li><strong>Espionage:</strong> US prosecutors allege an OpenAI engineer compromised confidential documents and recordings for a Saudi national.</li></ul><p><strong>Market volatility</strong></p><ul><li><strong>Nvidia's influence:</strong> The company's valuation surged nearly $1tn following Jensen Huang's reinstatement as CEO via political intervention.</li><li><strong>Cost spikes:</strong> Server suppliers (Dell, HPE, Lenovo, Supermicro) are raising prices up to 45% after contracts are signed.</li><li><strong>M&A activity:</strong> Amazon is pursuing a $7.5bn acquisition of AI start-up Decart to challenge Nvidia's computing power.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Healthcare skepticism:</strong> Novartis rejected claims that AI will cure cancer within a decade, clashing with optimistic views from Anthropic and DeepMind.</li><li><strong>Audit risks:</strong> Grant Thornton warns that over-reliance on AI in accounting could trigger a \"race to the bottom\" in quality.</li><li><strong>Social impact:</strong> South Korean officials are resigning over the failure to curb AI-driven cheating in high-stakes exams.</li></ul><p><strong>What's next:</strong> Watch for the \"circular AI economy\" to face a stress test if vendor financing for chip manufacturers collapses.</p>", "us-china relations": "<p>The U.S., China, and Russia are attempting to revive a \"Yalta-style\" trilateral diplomacy to carve up global spheres of influence.</p><p><strong>Why it matters:</strong> A return to \"Great Power\" diplomacy risks marginalizing middle powers and rewarding Russian aggression. It signals a shift from a rules-based international order toward a transactional system managed by a few autocrats and the U.S. executive.</p><p><strong>Between the lines</strong></p><ul><li><strong>China's Gain:</strong> Beijing is leveraging these summits to project global leadership and reshape the international order on its own terms.</li><li><strong>Russia's Leverage:</strong> Vladimir Putin is using the trilateral format to seek legitimacy and potential territorial concessions in Ukraine.</li><li><strong>U.S. Volatility:</strong> The approach reflects a preference for personal diplomacy over institutional alliances, creating uncertainty for European and Asian allies.</li></ul><p><strong>The Middle Power Dilemma</strong></p><ul><li>Smaller nations face increasing dependency on the U.S. and China.</li><li>AI dominance by the two superpowers threatens to compound the economic and political vulnerability of these states.</li></ul><p><strong>What's next:</strong> Watch for a \"joint statement\" from the trilateral summit. The outcome will determine if the U.S. continues to underwrite global security or retreats into a transactional, bilateral framework.</p>", "us elections": "<p>Democrats have secured a sweeping victory in the US midterms, seizing control of both houses of Congress.</p><p><strong>Why it matters:</strong> This shift strips President Trump of legislative protection and enables aggressive oversight of his administration. It signals a potential rejection of right-wing populism by key demographics, including senior voters.</p><p><strong>By the numbers</strong></p><ul><li><strong>56 seats:</strong> The Democratic tally in the 100-member Senate.</li><li><strong>$500 million:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>$4.2 trillion:</strong> Market value lost in AI data center stocks amid a broader tech sell-off.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivot:</strong> Democrats are shifting focus from \"woke\" culture wars toward class-based economic issues.</li><li><strong>Gerrymandering failure:</strong> Republican redistricting efforts failed to stop the Democratic \"blue wave.\"</li><li><strong>Internal GOP friction:</strong> Party leaders are blaming Big Tech and foreign policy (Iran) rather than Trump for the losses.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investigations:</strong> House Democrats plan to use their majority to probe corruption and conflicts of interest within the Trump administration.</li><li><strong>Leadership shifts:</strong> Hakeem Jeffries is poised to become the first Black Speaker of the House.</li><li><strong>Future candidates:</strong> Socialists are already backing Alexandria Ocasio-Cortez for a 2028 presidential run.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is attempting to pivot Germany toward a more assertive military and economic posture amid deepening domestic instability.</p><p><strong>Why it matters:</strong> Germany is shifting from a \"culture of restraint\" to a leadership role in European defense and diplomacy. This transition is colliding with internal coalition fractures and a surging far-right AfD.</p><p><strong>Internal instability</strong></p><ul><li><strong>Coalition strain:</strong> The resignation of Labour Minister Bärbel Bas stalls critical pension and labor reforms.</li><li><strong>Political deadlock:</strong> Disagreements between the Chancellor and Finance Minister are blocking appointments to the ECB executive board.</li><li><strong>Far-right rise:</strong> The AfD is securing key regional positions and influencing established parties, threatening the \"firewall\" against extremism.</li></ul><p><strong>Security and Defense</strong></p><ul><li><strong>Military pivot:</strong> Germany is appointing leadership with deep Ukraine ties and expanding spy agency powers to counter Russian espionage.</li><li><strong>Strategic friction:</strong> France is pressuring Berlin over the nuclear risks of long-range missiles, while Italy blocked Germany's entry into a key fighter jet project.</li><li><strong>Fiscal tension:</strong> The Council of Economic Experts warns against debt-funded military spending to avoid a GDP-to-debt ratio of 98% by 2040.</li></ul><p><strong>Economic stakes</strong></p><ul><li><strong>Banking shift:</strong> UniCredit's deal to take over Commerzbank ends a two-year battle for Germany's second-largest lender.</li><li><strong>Investment risk:</strong> Executives warn that AfD gains are undermining confidence ahead of major investment summits.</li></ul><p><strong>What's next:</strong> Merz is using the EU budget as leverage to force a unanimous bloc agreement on Ukraine funding, signaling a more aggressive approach to European diplomacy.</p>", "central banks": "<p>Central banks are pivoting toward a more aggressive, unpredictable stance to combat entrenched inflation.</p><p><strong>Why it matters:</strong> Persistent price pressures and volatile growth data are forcing policymakers to abandon predictable \"scripts\" in favor of larger, sudden rate hikes.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> Officials are weighing 50bp hikes if inflation stalls, while simultaneously managing balance sheet volatility due to money market stress.</li><li><strong>Bank of England:</strong> Rates hit 4% as the BoE signals a \"sharp change in tone,\" admitting that previous inflation control efforts have slipped.</li><li><strong>ECB:</strong> Core inflation remains well above the 2% target, keeping the door open for further tightening.</li><li><strong>Bank of Japan:</strong> Weak GDP contraction is casting doubt on planned December rate hikes.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Paradox:</strong> Central banks are split on artificial intelligence. Some see it as a productivity engine that boosts GDP without inflation; others warn of a \"subprime-style\" bubble driven by off-balance sheet borrowing.</li><li><strong>Communication Gap:</strong> Divergent messaging from Fed and BoE officials suggests a lack of global synchronization on when the tightening cycle ends.</li></ul><p><strong>What's next</strong></p><ul><li><strong>ECB Leadership:</strong> The race to succeed Christine Lagarde will determine if the Eurozone adopts more \"inventive\" crisis-fighting tools for debt instability.</li><li><strong>US Policy:</strong> Watch for a potential balance sheet expansion to stabilize markets before the Fed attempts to shrink it in 2025.</li></ul>", "us banks": "<p>US banks are navigating a volatile mix of soaring trading profits, regulatory penalties, and the disruptive threat of AI.</p><p><strong>Why it matters:</strong> While equities and hedge fund borrowing are fueling short-term gains, systemic risks from AI-driven deposit flight and aggressive regulatory fines threaten long-term margins.</p><p><strong>The profit engine</strong></p><ul><li><strong>Trading boom:</strong> Goldman Sachs saw a 30% rise in Q3 net income, driven by equities and prime brokerage fees from AI-focused hedge funds.</li><li><strong>Cash cows:</strong> Banks are increasingly profiting from hedge fund borrowing rather than taking direct market bets.</li></ul><p><strong>The headwinds</strong></p><ul><li><strong>Regulatory hits:</strong> BofA profits dropped 17% following a $1.2bn money laundering fine; Amex was fined $350mn for systemic reporting failures.</li><li><strong>AI risk:</strong> Lenders are restricting AI agents to prevent \"automated churn,\" where bots move billions in deposits to higher-yielding accounts.</li><li><strong>Geopolitical friction:</strong> US-EU tensions over banking reforms are widening, while Jamie Dimon is fighting \"unfair\" UK bank taxes.</li></ul><p><strong>Internal shifts</strong></p><ul><li><strong>Talent war:</strong> Citi is shortening junior banker programs to two years to prevent poaching by private equity firms.</li><li><strong>Tech pivot:</strong> Goldman is promoting a record number of engineers to partner ranks, signaling a shift toward a tech-first operating model.</li></ul><p><strong>What's next:</strong> Watch for the impact of the Trump-Xi meeting on Citi's newly approved China securities business and the potential for AI to reshape bank supervision following the SVB collapse.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>24 Nov 2026 20:46 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
