.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

<p><strong>What's next:</strong> Expect increased M&A activity in the US Gulf and South America as majors prioritize \"safe\" jurisdictions over high-tax or politically unstable regions.</p>", "corporate earnings and results": "<p>Anthropic's record-breaking $81 billion IPO signals a massive market bet on the scalability of generative AI.</p><p><strong>Why it matters:</strong> The $1.5 trillion valuation forces the company to transition from a research lab to a full enterprise technology platform to justify its price.</p><p><strong>By the numbers:</strong></p><ul><li><strong>$81 billion:</strong> Total capital raised in the IPO.</li><li><strong>$1.5 trillion:</strong> Anthropic's current market valuation.</li><li><strong>$600 billion:</strong> The company's ambitious near-term revenue target.</li><li><strong>100,000+:</strong> Number of UK retail investors who rushed to buy shares.</li></ul><p><strong>Between the lines:</strong> The IPO arrives amid extreme volatility for the broader chip sector. TSMC and Samsung are suspending shipments to China due to new US export controls, creating a precarious supply chain for AI hardware.</p><p><strong>What's next:</strong> Investors will now scrutinize Anthropic's ability to monetize enterprise tools and navigate the \"handoverism\" risk—the fear that AI is advancing faster than human control mechanisms.</p>", "middle east war": "<p>The Middle East is spiraling toward a full-scale regional war as U.S.-Iran hostilities intensify and Israeli political stability collapses.</p><p><strong>Why it matters:</strong> Direct military exchanges between the U.S. and Iran threaten global energy security and trade. Simultaneously, internal Israeli fractures are weakening its strategic alliance with the U.S.</p><p><strong>The escalation loop</strong></p><ul><li><strong>Direct conflict:</strong> The U.S. struck Qeshm Island and fuel tankers in the Strait of Hormuz following Iranian attacks on a U.S. base in Bahrain.</li><li><strong>Proxy warfare:</strong> Houthi rebels hit the Saudi Public Investment Fund headquarters and forced Saudi-backed forces to retreat from the Red Sea.</li><li><strong>Regional spillover:</strong> Iran has expanded its targeting to include Bahrain and Kuwait.</li></ul><p><strong>Israel's internal crisis</strong></p><ul><li><strong>Political instability:</strong> Netanyahu's coalition is fracturing as the opposition elects a new Speaker and Haredi parties negotiate with rivals.</li><li><strong>Diplomatic friction:</strong> The UK is sanctioning West Bank settlement firms, while the U.S.-Israel alliance reaches a \"crisis point.\"</li><li><strong>Humanitarian pressure:</strong> International diplomats are criticizing Israel for restricting vital supplies to Gaza during winter rains.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Supply chains:</strong> The U.S.-Iran conflict has disrupted food imports to Dubai, forcing retailers into \"extraordinary measures.\"</li><li><strong>Energy markets:</strong> Global oil markets are swinging to a surplus as shipments rebound, though stockpiles remain depleted.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the U.S.-China AI supply chain accord and whether the Israeli government collapses before a new coalition is sworn in.</p>", "shipping": "<p>Global shipping is facing a volatility crisis as geopolitical conflict weaponizes key maritime chokepoints.</p><p><strong>Why it matters:</strong> Attacks in the Strait of Hormuz and the Black Sea are forcing ships into longer, costlier routes. This disrupts energy supplies and spikes operational costs for carriers.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has shifted tactics to limpet mines; 24 vessels were targeted in two weeks.</li><li><strong>Black Sea:</strong> Now the world's deadliest route for commercial sailors due to Russia-Ukraine combat.</li><li><strong>Arctic:</strong> Transits via the Northern Sea Route have quadrupled as ships bypass the Middle East.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly pay for captains willing to transit the Strait of Hormuz.</li><li><strong>24.6 million:</strong> Daily barrels exported from the Gulf, recovering to pre-war levels.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Sovereign risk:</strong> Russia is using \"spoofing\" to fake vessel locations, masking tanker movements.</li><li><strong>Infrastructure shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe, driven by Chinese EV imports.</li><li><strong>Supply chain fragility:</strong> Vitol warns of a tanker shortage that could push oil toward $200 a barrel.</li></ul><p><strong>What's next</strong> Expect increased friction between U.S. state and federal authorities over Russian diesel imports, alongside a continued shift toward Arctic shipping as ice melts and conflict persists.</p>", "artificial intelligence": "<p>AI is transitioning from a speculative bubble to a volatile operational reality.</p><p><strong>Why it matters:</strong> Rapid deployment is creating a \"stability gap\" where technical capabilities outpace safety protocols and infrastructure reliability.</p><p><strong>The economic tension</strong></p><ul><li><strong>Market Frenzy:</strong> Anthropic's projected trillion-dollar IPO and Nvidia's revenue doubling signal massive capital inflows.</li><li><strong>Bubble Risks:</strong> The ECB warns that hyperscalers' off-balance sheet commitments mirror the subprime mortgage crisis.</li><li><strong>Labor Shift:</strong> AI now outperforms junior accountants in specific audit tasks, though relational skills remain a human moat.</li></ul><p><strong>The operational cost</strong></p><ul><li><strong>System Instability:</strong> A rush to patch AI-discovered bugs has triggered major outages at Microsoft and JPMorgan.</li><li><strong>Security Gaps:</strong> AI-driven hacking has surged, leading to a $6bn theft from Binance and new regulatory mandates for city firms.</li><li><strong>Safety Triggers:</strong> Anthropic has activated \"responsible scaling\" policies to prevent catastrophic risks as models accelerate.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Pivot:</strong> Brussels faces pressure to increase funding to meet AI ambitions while leveraging frozen Russian assets.</li><li><strong>Political Strategy:</strong> U.S. Democrats are weighing a new \"social contract\" to address voter grievances beyond infrastructure.</li><li><strong>Corporate Governance:</strong> Markets are struggling to value \"superstar\" CEOs like Jensen Huang and Dario Amodei.</li></ul>", "us-china relations": "<p>The U.S. and China are navigating a volatile global order defined by American retrenchment and Chinese ambition.</p><p><strong>Why it matters:</strong> A perceived U.S. retreat from global leadership creates a power vacuum. China is actively leveraging this gap to reshape international norms and trade on its own terms.</p><p><strong>Between the lines</strong></p><ul><li><strong>The \"Big Three\" Fallacy:</strong> Attempts to revive a Yalta-style arrangement between the U.S., China, and Russia are failing. Modern geopolitical complexities prevent a simple \"carve-up\" of global influence.</li><li><strong>Strategic Opportunism:</strong> Beijing views U.S. domestic political instability and a shift toward isolationism as a window to expand its regional hegemony.</li><li><strong>Middle Power Pivot:</strong> Smaller nations are increasingly diversifying supply chains to avoid becoming collateral damage in the U.S.-China rivalry.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Order Transition:</strong> Expect China to use high-profile summits (like APEC) to project itself as the primary guarantor of global stability.</li><li><strong>Security Shifts:</strong> As the U.S. wavers on underwriting foreign defense, China will likely increase its security footprints in the Middle East and Asia.</li></ul>", "us elections": "<p>Democrats secured a sweeping victory in the US midterm elections, fundamentally shifting the balance of power in Washington.</p><p><strong>Why it matters:</strong> The result signals a rejection of right-wing populism and \"MAGA\" strategies, proving that aggressive gerrymandering and high-dollar donations cannot overcome a motivated, diverse electorate.</p><p><strong>By the numbers</strong></p><ul><li><strong>56:</strong> The number of Senate seats now held by Democrats.</li><li><strong>$500M:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>1881:</strong> The last time a Black senator represented Mississippi until Scott Colom's historic win.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Demographic shifts:</strong> Older voters and minority groups broke traditional party lines, fueling the \"blue wave.\"</li><li><strong>Strategic pivot:</strong> Democrats are moving away from \"woke\" politics toward class-based economic issues.</li><li><strong>GOP dysfunction:</strong> Republicans are blaming external factors—Big Tech, AI, and foreign policy—rather than Donald Trump's influence.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership transitions:</strong> Hakeem Jeffries is set to become the first Black lawmaker to lead the House.</li><li><strong>2028 horizon:</strong> New York socialists are already backing Alexandria Ocasio-Cortez for the presidency.</li><li><strong>Economic focus:</strong> Voter attention is shifting toward the \"affordability tracker\" and the cost of living.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is attempting to pivot Germany toward a more aggressive military and fiscal posture amid deepening domestic instability.</p><p><strong>Why it matters:</strong> Germany is shifting from a \"peace dividend\" era to a frontline security state. This transition is creating friction with EU allies and fueling internal political volatility.</p><p><strong>The security shift</strong></p><ul><li><strong>Military expansion:</strong> Berlin is appointing Ukraine-aligned leadership to the Bundeswehr and expanding spy agency powers to conduct \"disruptive operations.\"</li><li><strong>Diplomatic friction:</strong> France is demanding clarity on Germany's long-range missile doctrine to prevent accidental nuclear escalation.</li><li><strong>Strategic isolation:</strong> Italy blocked Germany's entry into a key next-gen fighter jet project, limiting Berlin's aerospace autonomy.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of the labor minister and deadlocks over ECB appointments signal a fracturing government.</li><li><strong>Far-right surge:</strong> The AfD is gaining institutional power, securing its first regional parliament president and deterring foreign investors.</li><li><strong>Fiscal tension:</strong> The Council of Economic Experts warns that military borrowing could push debt to 98% of GDP by 2040.</li></ul><p><strong>What's next</strong></p><ul><li><strong>EU Budget Battle:</strong> Merz is using the EU's next budget as leverage to force unanimous bloc support for Ukraine funding.</li><li><strong>Presidential Transition:</strong> The nomination of Ilse Aigner for president aims to stabilize the conservative image ahead of further reforms.</li></ul>", "central banks": "<p>Central banks are pivoting back toward aggressive rate hikes to combat entrenched inflation.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing the Fed and BoE to abandon \"pause\" narratives. This shift increases borrowing costs globally and threatens economic growth.</p><p><strong>The current landscape</strong></p><ul><li><strong>Federal Reserve:</strong> Officials are weighing a 50bp increase in December due to strong jobs and inflation data.</li><li><strong>Bank of England:</strong> Rates hit 4% with signals that further hikes are necessary to tame inflation.</li><li><strong>ECB:</strong> Headline inflation remains above the 2% target, keeping the bank on a tightening trajectory.</li><li><strong>Bank of Japan:</strong> Weak GDP growth is delaying planned rate increases.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Communication gap:</strong> Divergent signals from officials (e.g., Waller vs. Lombardelli) create market volatility.</li><li><strong>Leadership transition:</strong> The ECB is entering a critical succession phase as Christine Lagarde prepares to exit.</li><li><strong>AI variable:</strong> Some policymakers believe AI-driven productivity could sustain higher GDP growth without triggering inflation.</li></ul><p><strong>What's next</strong></p><ul><li><strong>December meetings:</strong> Watch for a potential \"hawkish\" surprise from the Fed.</li><li><strong>ECB Presidency:</strong> Eurozone leaders must finalize nominees to replace Lagarde.</li><li><strong>Reserve shifts:</strong> Central banks continue to lean heavily on US dollar reserves despite global volatility.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and leadership restructuring as trading booms face a potential cooldown.</p><p><strong>Why it matters:</strong> Banks are fighting a two-front war: leveraging AI to boost efficiency while preventing those same tools from triggering massive deposit outflows to higher-yield competitors.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks if AI agents shift savers to better rates.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li><li><strong>$350 million:</strong> Amex fine for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> BofA fine contributing to a 17% profit drop.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Talent War:</strong> Citi is shortening junior analyst programs to two years to stop private equity poaching.</li><li><strong>The AI Paradox:</strong> Banks are hiring record numbers of engineers to build AI tools, yet restricting those tools from accessing accounts to protect deposit margins.</li><li><strong>Regulatory Friction:</strong> The SVB postmortem reveals a \"culture of risk aversion\" at the Fed that hindered timely intervention.</li></ul><p><strong>What's next</strong></p><ul><li><strong>China Expansion:</strong> Citi will activate its newly approved securities business in China ahead of high-level US-China diplomatic meetings.</li><li><strong>Succession Watch:</strong> Goldman Sachs continues to delay a definitive timeline for CEO David Solomon's departure despite the prominence of heir apparent John Waldron.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>19 Nov 2026 19:06 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
