const SUMMARIES = {"oil and gas": "<p>Geopolitical conflict is driving a volatile divergence between fossil fuel profits and the global energy transition.</p><p><strong>Why it matters:</strong> War-driven price spikes are boosting Big Oil's balance sheets while simultaneously triggering critical fuel shortages and accelerating the shift toward energy independence.</p><p><strong>The conflict catalyst</strong></p><ul><li><strong>Price surges:</strong> US-Iran hostilities are pushing crude prices higher, allowing majors like BP to aggressively cut net debt.</li><li><strong>Supply shocks:</strong> Ukrainian drone strikes on Russian refineries have forced Russia to ban diesel exports, creating a global supply crunch.</li><li><strong>Strategic risk:</strong> Traders fear disruptions in the Strait of Hormuz could further restrict global crude flows.</li></ul><p><strong>The transition tug-of-war</strong></p><ul><li><strong>Strategic pivots:</strong> Shell is exiting Indian renewables ($1.8bn sale) to refocus on core oil and gas assets.</li><li><strong>Infrastructure demand:</strong> AI data centers are driving massive demand for off-grid renewables and straining transformer supply chains.</li><li><strong>Policy friction:</strong> The EU faces a \"major mistake\" in slow electrification, even as it buys record LNG from Russia ahead of import bans.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.8bn:</strong> Shell's sale price for its Indian wind and solar business.</li><li><strong>€5bn:</strong> The target size for the EU's new energy \"scale-up\" fund.</li><li><strong>50 million:</strong> Russians impacted by fuel shortages following refinery strikes.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market volatility:</strong> Watch for the Nasdaq debut of General Fusion, a bellwether for private investment in fusion energy.</li><li><strong>Regulatory shifts:</strong> The CFTC is blocking 24/7 oil contracts, potentially limiting hedging flexibility for traders.</li><li><strong>US Policy:</strong> The expiration of renewable tax credits may slow US solar projects despite corporate backing from giants like Google.</li></ul>", "corporate earnings and results": "<p>Wall Street banks are posting stronger-than-expected results driven by a surge in market volatility.</p><p><strong>Why it matters:</strong> High equity market swings create lucrative trading opportunities for investment banks, offsetting stagnation in other revenue streams.</p><p><strong>The big winners</strong></p><ul><li><strong>JPMorgan and Goldman Sachs:</strong> Both reported profit surges fueled by a \"blockbuster trading haul.\"</li><li><strong>Watches of Switzerland:</strong> Defied the broader luxury slowdown with a 13% sales jump to £1.83bn, led by US demand.</li></ul><p><strong>The mixed bag</strong></p><ul><li><strong>Citigroup:</strong> Outperformed peers over the last year but remains less profitable than its largest rivals.</li><li><strong>Rothschild:</strong> Higher deal fees were neutralized by rising banker bonuses, leading to a drop in overall profits.</li></ul><p><strong>Between the lines:</strong> Corporate earnings are diverging by sector. While high-end luxury and volatile trading are thriving, traditional investment banking margins are being squeezed by internal labor costs.</p><p><strong>What's next:</strong> \"Super Tuesday\" earnings reports will provide a broader benchmark for corporate health, though simultaneous reporting is having a diminishing impact on market volatility.</p>", "middle east war": "<p>Escalating US-Iran hostilities over the Strait of Hormuz are triggering a global energy shock and destabilizing financial markets.</p><p><strong>Why it matters:</strong> Control of the Strait is a critical chokepoint for global oil supplies. Disruptions drive immediate inflation, spiking fuel costs and forcing investors into \"risk-off\" mode.</p><p><strong>By the numbers</strong></p><ul><li><strong>$87:</strong> Recent peak for oil prices amid Hormuz instability.</li><li><strong>77%:</strong> Increase in jet fuel costs for airlines like Delta.</li><li><strong>20%:</strong> Proposed \"security fee\" by the Trump administration for waterway passage.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric warfare:</strong> Iran is leveraging ad tech and roaming systems to track US military personnel.</li><li><strong>Strategic pivots:</strong> Dubai is building a new port on its east coast to bypass the Strait entirely.</li><li><strong>Political volatility:</strong> Israeli PM Netanyahu is trailing in polls ahead of October elections.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic gambles:</strong> The US is attempting to balance military strikes on Iranian infrastructure with renewed talks.</li><li><strong>Regional shifts:</strong> The US is easing chip and drone export controls for the UAE to strengthen Gulf alliances.</li><li><strong>Ceasefire fragility:</strong> US teams are in Beirut to prevent the Israel-Hezbollah truce from collapsing.</li></ul>", "shipping": "<p>Global shipping is facing a volatile convergence of geopolitical conflict, regulatory shifts, and trade wars.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the Red Sea is driving up freight costs and forcing a reliance on \"shadow fleets\" to bypass sanctions.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>Strait of Hormuz:</strong> US-Iran tit-for-tat strikes and naval mines have restricted traffic to half of pre-war levels.</li><li><strong>Ukraine-Russia:</strong> Kyiv is intensifying attacks on Russian fuel tankers in the Azov Sea to disrupt Crimea's supply lines.</li><li><strong>Taiwan:</strong> Investigations reveal criminal smuggling networks, linked to North Korea, are targeting Taiwanese maritime security.</li></ul><p><strong>The economic impact</strong></p><ul><li><strong>Tariff surges:</strong> Freight rates have hit their highest levels since the 2024 Red Sea crisis as US companies stockpile goods to beat new tariffs.</li><li><strong>Route shifts:</strong> Maersk is resuming Suez Canal transits, though the move may lower freight rates.</li><li><strong>Sanction evasion:</strong> Greek shipping firms earned nearly $4bn transporting Russian oil under the G7 price cap.</li></ul><p><strong>Industry pivots</strong></p><ul><li><strong>Consolidation:</strong> CMA CGM acquired FedEx's logistics unit for $1.4bn to expand its US supply chain footprint.</li><li><strong>Energy divide:</strong> Shipowners are abandoning unified \"green\" goals, splitting between nuclear power and traditional fossil fuels.</li><li><strong>Regulation:</strong> The EU is closing loopholes on carbon emissions fees, increasing costs for international carriers.</li></ul><p><strong>What's next:</strong> Shipping costs will remain volatile as the industry balances the risk of naval mines in the Middle East against the urgency of US trade deadlines.</p>", "artificial intelligence": "<p>The AI sector is shifting from a phase of speculative hype to a period of operational friction and geopolitical volatility.</p><p><strong>Why it matters:</strong> Ballooning capital expenditures and tightening trade controls are forcing companies to seek cheaper alternatives and creating high-risk shadow markets.</p><p><strong>The geopolitical squeeze</strong></p><ul><li><strong>Export evasion:</strong> A thriving black market is bypassing U.S. controls to funnel advanced semiconductors into China.</li><li><strong>Regulatory leaks:</strong> OpenAI and Google are selling models to Singapore-based subsidiaries of blacklisted Chinese firms like Alibaba and Tencent.</li><li><strong>Market concentration:</strong> TSMC, SK Hynix, and Samsung now control 29% of the MSCI Emerging Markets index.</li></ul><p><strong>The financial reality check</strong></p><ul><li><strong>Cost cutting:</strong> Firms including DoorDash and Airbnb are switching to Chinese AI models to reduce reliance on expensive U.S. tech.</li><li><strong>Valuation decay:</strong> Analysis shows \"AI rebranding\" fails to provide sustained share price boosts.</li><li><strong>Debt skepticism:</strong> Investors are selling long-dated AI debt, questioning the sector's long-term profitability.</li></ul><p><strong>Operational friction</strong></p><ul><li><strong>Corporate conflict:</strong> Apple is suing OpenAI over alleged theft of secret information.</li><li><strong>Labor strain:</strong> AI-generated code is overwhelming human maintainers, while forced employee adoption of AI tools is backfiring.</li><li><strong>Performance gaps:</strong> AI \"superforecasters\" currently lack a competitive edge in predicting Federal Reserve decisions.</li></ul><p><strong>What's next:</strong> Expect a pivot toward \"sludge busting\"—using AI for regulatory efficiency—as companies move away from generative novelty toward tangible cost reduction.</p>", "us-china relations": "<p>US-China relations are shifting toward a \"might is right\" world order defined by military brinkmanship and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and China's aggressive posture increase the risk of direct conflict. This instability forces allies to choose between security guarantees and economic survival.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China recently fired a submarine-launched ballistic missile into a Pacific nuclear-free zone, triggering condemnation from Japan, Australia, and New Zealand.</li><li>  <strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, recently detaining Japanese nationals for rare earth smuggling.</li><li>  <strong>Trade volatility:</strong> The IMF warns that \"tit-for-tat\" trade wars between the superpowers are self-defeating and threaten global economic stability.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Beijing's play:</strong> China is positioning itself as a \"pillar of stability\" to attract non-aligned nations while simultaneously utilizing a \"tribute system\" to exercise power without open war.</li><li>  <strong>US instability:</strong> Internal political volatility and a perceived retreat from global leadership are driving allies like Germany to seek independent military capabilities.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance reshuffling:</strong> Middle powers will increasingly forge flexible, multi-lateral alliances to avoid being crushed by the US-China rivalry.</li><li>  <strong>Maritime tension:</strong> Competition will intensify over \"narrow seas\" and vulnerable waterways as nations scramble to secure global supply chains.</li></ul>", "us elections": "<p>The U.S. electoral landscape is fracturing as both parties face internal volatility and voter fatigue.</p><p><strong>Why it matters:</strong> Internal instability and unpopular foreign policy are eroding candidate viability. This creates a high-risk environment for both the Democratic establishment and the Trump-led GOP.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Ideological war:</strong> Progressive victories in Colorado and New York signal a growing insurgency against party leadership.</li><li><strong>Candidate crises:</strong> The Graham Platner scandal in Maine forces a last-minute scramble to salvage a Senate bid.</li><li><strong>Corporate friction:</strong> Big Tech lobbying is successfully neutralizing pro-regulation candidates in House races.</li></ul><p><strong>The Republican gamble</strong></p><ul><li><strong>Trump fatigue:</strong> Polls show voters are souring on the president's handling of inflation and the Iran conflict.</li><li><strong>Base erosion:</strong> Evangelicals are questioning the alignment of Trump's rhetoric with Christian values.</li><li><strong>Local backlash:</strong> In Pennsylvania and Maine, Trump's national brand is creating friction for local candidates facing economic discontent.</li></ul><p><strong>Between the lines</strong> The \"MAGA\" effect is becoming a double-edged sword. While it secures the core base, it is alienating swing voters in critical battlegrounds like the Lehigh Valley and Maine's coastal regions.</p><p><strong>What's next</strong></p><ul><li><strong>California's gauge:</strong> The governor's race between Steve Hilton and Xavier Becerra will serve as a proxy for the national appetite for Trumpism.</li><li><strong>Senate volatility:</strong> The GOP's preference for divisive candidates may jeopardize their hold on the Senate.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to address security gaps and stagnant growth, signaling a fundamental shift in Germany's role within Europe and the global order.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Berlin will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> Germany is ditching France for new fighter jet partners to secure a leadership role proportional to its funding.</li><li><strong>Failures:</strong> Cost overruns led Berlin to scrap the F126 frigate, its largest planned warship since WWII.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts and is pushing for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Deregulation:</strong> The coalition agreed to longer Sunday opening hours and stricter sick-leave rules.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD currently leads opinion polls, fueled by fuel price anger and ties to Kremlin associates.</li><li><strong>Internal rivalry:</strong> Merz faces a \"chancellor swap\" threat from younger conservative Hendrik Wüst as polls slide.</li><li><strong>Security threats:</strong> Intelligence agencies warn of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission and the outcome of the KNDS IPO.</p>", "central banks": "<p>Central banks are entering a period of structural instability and communication overhaul.</p><p><strong>Why it matters:</strong> A growing \"trust deficit\" is decoupling market expectations from policy goals, risking higher long-run inflation. Simultaneously, geopolitical volatility and AI-driven trading are challenging traditional monetary toolkits.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is aggressively restructuring the U.S. central bank:</p><ul><li><strong>Governance:</strong> Appointed business and academic leaders to five new task forces to reform operations.</li><li><strong>Communication:</strong> Moving away from traditional \"forward guidance\" to reduce market predictability, though this is currently increasing rate volatility.</li><li><strong>Independence:</strong> Publicly vowing to resist White House pressure despite ongoing legal battles over the removal of governors.</li></ul><p><strong>Global divergence</strong> Central banks are no longer moving in lockstep:</p><ul><li><strong>New Zealand:</strong> Raising rates for the first time in three years to combat persistent inflation.</li><li><strong>Eurozone:</strong> ECB President Lagarde signals a shift toward \"modest\" rate increases rather than the aggressive force used in 2022.</li><li><strong>Japan:</strong> Shifting focus toward domestic investment to stabilize the yen and bond markets.</li></ul><p><strong>Emerging risks</strong> New systemic threats are forcing a rethink of stability mandates:</p><ul><li><strong>AI Volatility:</strong> The Bank of England is considering \"kill switches\" for AI-powered trading to prevent herd-driven market crashes.</li><li><strong>QT Failure:</strong> Geopolitical crises (e.g., Iran) are undermining Quantitative Tightening programs by forcing banks to hold assets they intended to sell.</li><li><strong>Leverage:</strong> The BoE is tightening limits on hedge fund leverage to protect the gilt market, despite risks of higher funding costs.</li></ul><p><strong>What's next:</strong> Markets will watch if Warsh's \"fundamental\" communication style stabilizes inflation expectations or simply creates more noise and volatility.</p>", "us banks": "<p>US banks are navigating a volatile mix of rebounding deal flows, leadership instability and regulatory friction.</p><p><strong>Why it matters:</strong> Wall Street is attempting to capitalize on an AI-driven market rally while simultaneously fighting to lower capital requirements and manage internal succession crises.</p><p><strong>The bottom line</strong></p><ul><li><strong>Revenue surge:</strong> Investment banking fees are hitting a four-year high, driven by a revival in large-scale deals.</li><li><strong>Global expansion:</strong> JPMorgan is aggressively expanding its digital footprint into France, Spain, and Italy.</li><li><strong>China recovery:</strong> Goldman Sachs, Morgan Stanley, and JPMorgan reported record profits from their China securities units.</li></ul><p><strong>Internal turmoil</strong></p><ul><li><strong>JPMorgan:</strong> Jamie Dimon has upended the CEO succession race, axing longtime contender Marianne Lake and promoting Doug Petno and Troy Rohrbaugh.</li><li><strong>Citigroup:</strong> CEO Jane Fraser is executing a \"ruthless remake\" involving asset sales and job cuts to regain market standing.</li><li><strong>Goldman Sachs:</strong> Internal friction persists over leadership decisions, resulting in the departure of top executive Russell Horwitz.</li></ul><p><strong>Regulatory friction</strong></p><ul><li><strong>Capital rules:</strong> Banks are lobbying regulators to further ease Basel capital requirements to free up liquidity.</li><li><strong>Compliance risks:</strong> Goldman is limiting employee use of prediction markets (e.g., Polymarket) to avoid regulatory breaches.</li><li><strong>Stress tests:</strong> The Fed warns banks could lose $700 billion in a severe economic crash, despite most lenders passing recent tests.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Political alignment:</strong> Banks are increasingly cultivating ties with the Trump administration to influence deregulation.</li><li><strong>Fintech convergence:</strong> Circle's new trust bank license signals a deeper integration of stablecoins into the US banking system.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>14 Jul 2026 11:53 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
