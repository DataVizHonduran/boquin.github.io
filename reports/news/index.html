*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;line-height:1.6;color:#475569;background:#f6f7f9;min-height:100vh}

/* ── navbar ── */

/* ── hero ── */

/* ── controls ── */
.controls{max-width:1200px;margin:0 auto;padding:1.5rem 2rem 0}
.tag-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}

.tag-btn.all{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.tag-btn.all.active{background:#0f172a;color:#fff;border-color:#0f172a}
.tag-btn.active{color:#fff!important;border-color:transparent!important}
.tag-btn:not(.active){background:#fff;border-color:#e2e8f0}

.slider-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0 1rem}
.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}
#days-slider{flex:1;max-width:320px;accent-color:#4f46e5;height:4px;cursor:pointer}
.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner{max-width:1200px;margin:0 auto 1.5rem;padding:0 2rem}
.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;

  font-size:.88rem;color:#475569;line-height:1.6}
.summary-banner-inner strong{color:#0f172a}
.summary-banner-inner p{margin:.4rem 0}
.summary-banner-inner ul{margin:.5rem 0 0 1.2rem;padding:0}
.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8ecf2;
  display:flex;flex-direction:column;gap:.6rem;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;
  white-space:nowrap;flex-shrink:0}
.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}
.card-title{font-size:.97rem;font-weight:700;color:#0f172a;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#4f46e5;
  text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.card-link:hover{text-decoration:underline}

/* ── empty state ── */
.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

/* ── footer ── */
.footer{text-align:center;padding:2rem;font-size:.8rem;color:#94a3b8;border-top:1px solid #e4e8ef}

@media(max-width:600px){
  .hero h1{font-size:1.8rem}
  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}
  .controls{padding:1rem 1rem 0}

 "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward massive debt-funded rearmament and market-driven economic reform.</p><p><strong>Why it matters:</strong> Berlin is abandoning traditional fiscal restraint to fill a security vacuum left by waning U.S. support. Internal political instability and the rise of the AfD threaten the government's ability to execute these shifts.</p><p><strong>By the numbers</strong></p><ul><li><strong>€800 billion:</strong> Planned borrowing for rearmament, the largest shift since reunification.</li><li><strong>€10 billion:</strong> Proposed tax cuts to stimulate economic growth.</li><li><strong>40%:</strong> Berlin's target stake in tank maker KNDS.</li><li><strong>25%:</strong> Target stake in Uniper following privatization.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Defense friction:</strong> Berlin is ditching French partnerships in fighter jets and warships to prioritize speed and financial control.</li><li><strong>Political fragility:</strong> The AfD's polling lead and Kremlin ties create a volatile backdrop for Merz's leadership.</li><li><strong>Internal rivalry:</strong> The emergence of Hendrik Wüst as a popular alternative suggests Merz's grip on the CDU is slipping.</li></ul><p><strong>What's next</strong></p><ul><li>The Bundestag must decide on minesweeper approval for the Strait of Hormuz mission.</li><li>The Finance Ministry will begin penalizing agencies that fail to spend infrastructure funds.</li><li>Berlin will push for a Swedish-style public pension fund to invest in capital markets.</li></ul>", "central banks": "<p>Global central banks are abandoning traditional forward guidance in favor of strategic ambiguity and structural overhauls.</p><p><strong>Why it matters:</strong> The shift reduces market reliance on central bank signaling, forcing investors to react to real-time data. Simultaneously, political pressure and a \"trust deficit\" are undermining the perceived independence of monetary policy.</p><p><strong>Between the lines</strong></p><ul><li><strong>The Fed's pivot:</strong> New chair Kevin Warsh is revamping communication to stop signaling future rate moves.</li><li><strong>Structural reform:</strong> Warsh has appointed business and academic leaders to five task forces to modernize Fed operations.</li><li><strong>AI focus:</strong> The Fed is now viewing AI-driven productivity as a primary driver for long-term economic growth.</li></ul><p><strong>The QT friction</strong></p><ul><li><strong>Bond market stress:</strong> The Bank of England faces criticism that its quantitative tightening (QT) is driving up government borrowing costs.</li><li><strong>Leverage limits:</strong> The BoE is moving to limit hedge fund leverage to stabilize the gilt market.</li><li><strong>Systemic risk:</strong> Officials are considering \"kill switches\" for AI-powered trading to prevent volatility caused by herding behavior.</li></ul><p><strong>Global divergence</strong></p><ul><li><strong>Japan:</strong> The Yen has hit a 40-year low, creating tension between fiscal stimulus and central bank independence.</li><li><strong>New Zealand:</strong> The RBNZ raised interest rates for the first time in three years due to persistent inflation.</li><li><strong>Eurozone:</strong> The Bundesbank is advocating for rate holds despite surging oil prices.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Independence tests:</strong> Markets are monitoring whether the Fed can maintain autonomy under potential White House pressure.</li><li><strong>Communication shift:</strong> A move away from \"Fedspeak\" will likely increase short-term market volatility as investors lose their primary roadmap.</li></ul>", "us banks": "<p>US banks are posting record profits driven by an AI-fueled trading boom.</p><p><strong>Why it matters:</strong> The surge in equity trading and AI optimism is decoupling bank earnings from traditional interest rate dependencies. Thi /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>23 Jul 2026 12:15 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
