const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and supply chain bottlenecks are decoupling oil prices from traditional market fundamentals.</p><p><strong>Why it matters:</strong> Conflict in the Middle East and shifting U.S. diplomatic pivots are creating volatile \"energy ceasefires\" that threaten collective security and fuel global inflation.</p><p><strong>The volatility drivers</strong></p><ul><li><strong>Hormuz Chokepoint:</strong> Tanker attacks and slowing flows through the Strait of Hormuz are spiking crude prices and creating a shipping squeeze.</li><li><strong>Diesel Shortages:</strong> A lack of additional IEA fuel releases and fragmented state policies are testing the limits of global energy distribution.</li><li><strong>Political Leverage:</strong> The U.S. is using energy deals with Russia and Mexico as tactical tools ahead of midterm elections.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel warned by Vitol's chief due to tanker shortages.</li><li><strong>$2 billion:</strong> The gamble taken by a U.S. trader on tankers to bypass Hormuz and spur Asian refining.</li><li><strong>£2 billion:</strong> The amount the UK energy department must save, leading to cuts in heat pump funding.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Investment Paradox:</strong> Despite war risks, oil majors are doubling down on Middle East investments and Caribbean offshore projects (Trinidad and Tobago).</li><li><strong>Legal Pressure:</strong> Fossil fuel producers face a rising tide of climate litigation in Australian courts and the U.S. Supreme Court.</li><li><strong>Resource Nationalism:</strong> The U.S. is aggressively pursuing critical mineral independence to break China's grip on rare earth magnets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>EU Policy:</strong> Expect a push for windfall taxes on energy companies profiting from the Iran-Israel conflict.</li><li><strong>UK Stability:</strong> The North Sea's \"investable\" status hinges on the approval of the Rosebank and Jackdaw projects.</li><li><strong>Saudi Pivot:</strong> Aramco will determine how to monetize the gas surplus from the Jafurah field.</li></ul>", "corporate earnings and results": "<p>Wall Street is bracing for a sharp slowdown in bank earnings following a record-breaking trading streak.</p><p><strong>Why it matters:</strong> A cooling trend in Q3 results will test whether the current market rally is sustainable or driven by temporary volatility.</p><p><strong>Between the lines</strong></p><ul><li><strong>Luxury Divergence:</strong> LVMH is struggling with a demand slump in China, while mid-market brands like Uniqlo are gaining market share.</li><li><strong>AI Capital Risk:</strong> Creditors are shifting focus from AI growth potential to the \"lurking leverage\" of hyperscalers, specifically data center lease liabilities.</li><li><strong>PE Retreat:</strong> Private equity firms are aggressively exiting UK high street assets, including PizzaExpress and Morrisons, signaling a cooling appetite for the sector.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bank Reports:</strong> Next week's third-quarter earnings will confirm if the trading boom has peaked.</li><li><strong>EU Policy:</strong> An imminent Franco-German deal may delay the phaseout of combustion engines to counter Chinese EV competition.</li></ul>", "middle east war": "<p>Houthi missile strikes on Riyadh’s international airport are directly undermining Saudi Arabia's economic diversification strategy.</p><p><strong>Why it matters:</strong> The attacks signal that Iran-backed militants have evolved into a potent regional force capable of disrupting global finance and energy hubs. This instability deters the foreign investment essential to Crown Prince Mohammed bin Salman’s \"Vision 2030.\"</p><p><strong>By the numbers</strong></p><ul><li><strong>12:</strong> Deaths resulting from the Riyadh airport assault.</li><li><strong>$50 billion:</strong> Value of the secretive Syrian fund absorbing assets from Assad cronies.</li><li><strong>21 years:</strong> Duration of Mahmoud Abbas's presidency amid delayed Palestinian elections.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic fragility:</strong> Major oil executives (including BP) are skipping Riyadh summits, proving that security risks now outweigh commercial incentives.</li><li><strong>Naval escalation:</strong> US strikes on tankers in the Gulf of Oman and Iranian attacks beyond the Strait of Hormuz indicate a widening maritime conflict.</li><li><strong>Diplomatic friction:</strong> The UK is balancing sanctions on Iran with the need to protect bilateral relations tied to Abu Dhabi's ownership of Manchester City.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market volatility:</strong> Global economies are currently resilient, but rising public debt and energy shocks from the Iran war create \"worrying omens\" for IMF and World Bank meetings.</li><li><strong>US Strategy:</strong> The White House is attempting to maintain a precarious balance, with Trump signaling no direct attacks on Iran before midterms to preserve \"productive discussions.\"</li></ul>", "shipping": "<p>Global shipping is entering a period of structural instability driven by geopolitical conflict and climate change.</p><p><strong>Why it matters:</strong> Conflict in the Middle East and the Arctic's opening are forcing a total redesign of trade routes. This volatility is spiking operational costs while accelerating the shift toward \"shadow fleets\" and alternative fuels.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>$100,000:</strong> Monthly pay for captains willing to transit the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ice melts and ships avoid the Gulf.</li><li><strong>33%:</strong> Growth in the Russian-flagged fleet to bypass Western sanctions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asset flip:</strong> Old supertankers now command higher prices than new builds because immediate availability outweighs vessel age.</li><li><strong>Security gaps:</strong> The industry faces a dual threat: physical attacks in the Bab al-Mandeb and cyberattacks targeting satellite-linked navigation systems.</li><li><strong>Regulatory collapse:</strong> 18 maritime authorities warn that \"shadow fleets\" and war are breaking the global rules-based shipping order.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Energy transition:</strong> Falling biodiesel prices and the adoption of wind sails and methanol will accelerate decarbonization.</li><li><strong>Market shifts:</strong> Trafigura’s IPO of Volare Shipping signals a move to monetize record-high tanker rates.</li><li><strong>Route diversification:</strong> Businesses will continue migrating away from the Strait of Hormuz and the drought-stricken Panama Canal.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative bubble to a high-stakes infrastructure race.</p><p><strong>Why it matters:</strong> Massive capital injections and geopolitical competition are accelerating deployment, but revenue gaps and \"AI slop\" are testing the technology's actual utility.</p><p><strong>The money trail</strong></p><ul><li><strong>Revenue misses:</strong> OpenAI's annualized revenue is reportedly $20B lower than some investor expectations, trailing at $50B versus a rumored $70B.</li><li><strong>Capital hunts:</strong> SoftBank is seeking $100B from Gulf investors to double down on AI bets.</li><li><strong>Market volatility:</strong> Nvidia-backed Firmus pulled a $5B IPO, citing unstable market conditions.</li><li><strong>Concentration risk:</strong> Investor portfolios are becoming dangerously reliant on a single bet: AI build-out.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>US vs. China:</strong> Nvidia is eyeing Reflection AI to create a US rival to China's DeepSeek; meanwhile, Beijing is rapidly building data centers in Inner Mongolia.</li><li><strong>UK struggle:</strong> Britain risks losing its \"DeepMind dividend\" due to a lack of domestic capital and US talent lures.</li></ul><p><strong>Real-world friction</strong></p><ul><li><strong>Labor shifts:</strong> Call center hiring is dropping as AI takes over routine tasks.</li><li><strong>The \"Slop\" problem:</strong> Academic publishing and creative fields are fighting a surge of low-quality AI-generated content.</li><li><strong>Systemic bias:</strong> Evidence suggests AI recruiters may prefer CVs written by other AI.</li><li><strong>Physical AI:</strong> Developers are installing cameras in homes and offices to create \"robot gyms\" for training physical machines.</li></ul><p><strong>What's next:</strong> The industry is pivoting toward \"AI agents\"—autonomous services that move beyond chat to execute complex tasks.</p>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The shift from \"win-win\" cooperation to strategic rivalry destabilizes global trade and security. This friction forces third-party nations to hedge their bets or align with the BRICS bloc.</p><p><strong>By the numbers</strong></p><ul><li><strong>GDP Share:</strong> BRICS now accounts for a larger share of the global economy than the G7.</li><li><strong>AI Lead:</strong> U.S. national data center projects are consolidating American dominance in artificial intelligence.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Reliability Gap:</strong> U.S. volatility regarding defense guarantees—specifically in South Korea and Japan—is eroding trust in American security umbrellas.</li><li><strong>Tactical Dialogue:</strong> High-level summits are now tools for crisis management, not a return to détente.</li><li><strong>Institutional Flight:</strong> Potential U.S. funding cuts are prompting international organizations to consider leaving Geneva for Gulf or European capitals.</li></ul><p><strong>What's next</strong></p><ul><li><strong>BRICS Expansion:</strong> Expect the bloc to leverage its economic weight to create alternatives to U.S.-led sanctions and financial systems.</li><li><strong>Regional Realignment:</strong> Middle Eastern and Asian powers will increasingly prioritize bilateral \"survival\" diplomacy over multilateral idealism.</li></ul>", "us elections": "<p>President Trump faces a precarious path to maintaining Republican majorities in the upcoming midterms.</p><p><strong>Why it matters:</strong> Economic anxiety and controversial foreign policy are eroding Trump's support among key demographics, specifically blue-collar and minority voters.</p><p><strong>The economic drag</strong></p><ul><li><strong>Affordability:</strong> Rising mortgage rates (highest since 2023) and surging fuel prices are neutralizing overall economic growth.</li><li><strong>AI Anxiety:</strong> Voter fear regarding AI-driven job displacement is undermining the GOP's populist appeal.</li><li><strong>Policy pivots:</strong> Trump is considering suspending federal petrol taxes and easing red diesel limits to quell inflation.</li></ul><p><strong>The political friction</strong></p><ul><li><strong>The Rust Belt:</strong> Republicans are struggling to hold gains in industrial heartlands as blue-collar voters question Trump's record.</li><li><strong>Swing demographics:</strong> Latino voters remain the \"moveable middle,\" while Black voters are mobilizing against redistricting and gerrymandering.</li><li><strong>Internal chaos:</strong> Trump is considering firing top campaign advisers, Chris LaCivita and James Blair, citing conflicts of interest.</li></ul><p><strong>Between the lines</strong> Trump is attempting to use \"public service announcements\" to bypass campaign finance norms, though backlash has forced a pivot toward private funding via Maga Inc.</p><p><strong>What's next</strong></p><ul><li><strong>The Putin Factor:</strong> GOP lawmakers are opposing a diesel deal with Russia, citing violations of US law and the funding of Ukraine's war.</li><li><strong>The 2026 Horizon:</strong> Cost-of-living data is already being tracked as the primary determinant for the next election cycle.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's grip on eastern Germany.</p><p><strong>Why it matters:</strong></p><ul><li>Regional electoral disasters have crippled Merz's authority in Brussels, jeopardizing the EU's €2tn budget deal.</li><li>The AfD's rise is no longer marginal; the party is securing regional leadership and infiltrating established party ranks.</li></ul><p><strong>The internal crisis</strong></p><ul><li><strong>Leadership vacuum:</strong> Merz is deeply unpopular, fueling speculation that North Rhine-Westphalia Premier Hendrik Wüst is the viable successor.</li><li><strong>Coalition strain:</strong> The resignation of the labour minister stalls critical pension and labour market reforms.</li><li><strong>Right-wing drift:</strong> Allegations that CDU lawmakers traded votes with the AfD in Saxony-Anhalt suggest a breakdown in the \"firewall\" against the far-right.</li></ul><p><strong>The geopolitical shift</strong></p><ul><li><strong>Rearmament:</strong> Germany is aggressively bolstering its arms industry and utilizing \"guerrilla units\" for rapid Ukrainian weapons procurement.</li><li><strong>Diplomatic pivots:</strong> Berlin is balancing intense de-escalation talks with Russia against a historic shift back toward military power.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"East\" divide:</strong> The AfD is leveraging nostalgia and Ukraine as a wedge issue to exploit emotional fault lines from reunification.</li><li><strong>Generational gap:</strong> Younger voters view fascism and communism as distant history, making them more susceptible to modern radicalism.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Kingmaker dynamics:</strong> The hard-left BSW party is emerging as a critical power broker in regional coalitions.</li><li><strong>The Wüst factor:</strong> Watch for Hendrik Wüst's movements as he positions himself as the \"chancellor-in-waiting\" while Merz remains defensive.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control with systemic instability as geopolitical shocks and debt surges mount.</p><p><strong>Why it matters:</strong> Monetary policy is hitting a ceiling. Central banks can no longer rely solely on interest rates to manage supply-side shocks—like climate events or war—without risking financial collapse.</p><p><strong>The stability gap</strong></p><ul><li><strong>Backstop deficiency:</strong> The Financial Stability Board warns only the US, UK, Japan, and Hong Kong have credible public sector mechanisms to handle bank failures.</li><li><strong>AI risk:</strong> The Bank of England warns an AI-driven debt surge could trigger a sharp market correction.</li><li><strong>Security threats:</strong> Watchdogs report \"breakdowns and deficiencies\" in US Federal Reserve security, leaving it vulnerable to foreign adversaries.</li></ul><p><strong>Bond market turbulence</strong></p><ul><li><strong>Yield pressure:</strong> Middle East tensions and fiscal instability are pushing bond yields higher.</li><li><strong>French fragility:</strong> The French central bank warns the country risks being \"strangled\" by interest rates amid a bond rout.</li><li><strong>Credibility risk:</strong> Repeated US Treasury interventions to stabilize markets may create moral hazard and increase long-term volatility.</li></ul><p><strong>Divergent paths</strong></p><ul><li><strong>Tightening:</strong> India raised rates for the first time in three years to combat energy costs and inflation.</li><li><strong>Holding:</strong> Fed officials signal a pause in October, though markets price in further \"insurance\" increases for 2026.</li><li><strong>QT debate:</strong> Calls are growing for the ECB to halt Quantitative Tightening (QT) to restore market stability.</li></ul><p><strong>Between the lines:</strong> The era of \"money-like\" Treasuries is ending. As US government bonds lose their unique status as both securities and cash, the global financial plumbing is becoming more volatile and less predictable.</p>", "us banks": "<p>US banks are pivoting toward asset management and AI integration while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Banks are shifting from taking direct risks to earning fees via prime brokerage and asset management to bypass post-crisis capital constraints.</p><p><strong>The AI paradox</strong></p><ul><li><strong>The Risk:</strong> AI agents could cost banks $500 billion by enabling savers to automatically migrate funds to higher-yielding accounts.</li><li><strong>The Opportunity:</strong> Banks are demanding lower fees from law firms, arguing AI has reduced the billable hours required for routine work.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulatory push:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>Compliance failures:</strong> Amex was fined $350 million after failing to report $13 billion in suspicious transactions.</li><li><strong>Political friction:</strong> The Fed granted a banking license to a Trump family crypto venture, creating a new political flashpoint.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3 billion to diversify revenue.</li><li><strong>Talent War:</strong> Citi is shortening junior analyst programs to two years to prevent poaching by private equity firms.</li><li><strong>Client Dynamics:</strong> JPMorgan restricted lending to Jane Street as the trading firm began competing directly in US Treasuries.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman is preparing for top executives.</li><li><strong>$7 billion:</strong> Deposits surged into Erebor, a tech-focused startup filling the SVB void.</li><li><strong>$250 billion:</strong> Bank of America's commitment to US projects to align with \"America First\" policies.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>12 Oct 2026 19:58 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>

</html>
