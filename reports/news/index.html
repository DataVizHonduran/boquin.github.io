const SUMMARIES = {"oil and gas": "<p>Geopolitical conflict and infrastructure gaps are triggering a global fuel supply crunch.</p><p><strong>Why it matters:</strong> Ukrainian drone strikes on Russian refineries and escalating US-Iran hostilities are restricting diesel and crude flows. This volatility spikes costs for consumers while boosting short-term profits for Big Oil.</p><p><strong>The supply squeeze</strong></p><ul><li><strong>Russia:</strong> Domestic fuel shortages and export bans follow targeted strikes on refining capacity.</li><li><strong>Middle East:</strong> Tit-for-tat strikes between the US and Iran threaten the Strait of Hormuz, a critical crude chokepoint.</li><li><strong>Refining:</strong> The IEA warns of a global petrol and diesel crunch as Gulf and Russian facilities face war-related disruptions.</li></ul><p><strong>The energy transition pivot</strong></p><ul><li><strong>AI Demand:</strong> Surging data center power needs are straining transformer supply chains and driving private equity investment in power infrastructure.</li><li><strong>Renewables:</strong> Australia is rapidly adopting Chinese batteries to stabilize a grid where clean energy now provides roughly 50% of supply.</li><li><strong>Nuclear/Fusion:</strong> The UK is extending the life of the Sizewell plant, while Bezos-backed General Fusion prepares for a Nasdaq debut.</li></ul><p><strong>Between the lines</strong> The EU remains in a precarious position. Despite record LNG purchases from Russia's Yamal plant to hedge against bans, the IEA warns that slow electrification is a \"major mistake\" hindering energy independence.</p><p><strong>What's next</strong> Watch for US states to scale the repurposing of abandoned oil wells to mitigate pollution costs and create new revenue streams.</p>", "corporate earnings and results": "<p>Wall Street investment banks are poised for their largest fee haul in four years.</p><p><strong>Why it matters:</strong> A surge in large-scale deals, driven by AI optimism and resilient consumer spending, is reversing a multi-year slump in investment banking revenue.</p><p><strong>By the numbers:</strong></p><ul><li><strong>$23 trillion:</strong> The estimated cost to the West to fully decouple supply chains from China.</li><li><strong>29%:</strong> The combined weight of TSMC, SK Hynix, and Samsung in the MSCI Emerging Markets index.</li><li><strong>£33 billion:</strong> The potential boost to the UK economy from accelerating digital finance and blockchain adoption.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>AI cost fatigue:</strong> While AI fuels market rallies, companies like DoorDash and Airbnb are switching to cheaper Chinese models to curb ballooning operational costs.</li><li><strong>Concentration risk:</strong> Investors are increasingly wary of \"chip-heavy\" indices, where a few Asian semiconductor firms dictate broader market volatility.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Regulatory shifts:</strong> The EU is preparing a phased social media ban for children under 13.</li><li><strong>Corporate restructuring:</strong> Citigroup continues aggressive asset sales and job cuts to regain competitiveness.</li></ul>", "middle east war": "<p>The U.S. and Iran are locked in a high-stakes military escalation over control of the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The Strait is a global energy chokepoint. Any prolonged closure or instability threatens global oil supplies and spikes corporate operational costs.</p><p><strong>The current flashpoint</strong></p><ul><li><strong>Military action:</strong> The U.S. has launched multiple strikes on Iranian infrastructure, including railway bridges.</li><li><strong>The gamble:</strong> Tehran claims the Strait is closed; President Trump insists it remains open and warns attacks will \"get much worse\" if shipping is targeted.</li><li><strong>Diplomatic deadlock:</strong> While Trump claims talks continue, analysts suggest Tehran is betting the U.S. will blink first.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>77%:</strong> The increase in jet fuel costs reported by Delta, directly linked to the Iran conflict.</li><li><strong>2 days:</strong> The duration of the most recent concentrated U.S. strike campaign.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Power vacuum:</strong> The death and burial of Supreme Leader Khamenei has shifted internal Iranian dynamics to his son, Mojtaba, who faces immediate instability.</li><li><strong>Strategic pivots:</strong> The U.S. is relaxing chip and drone export controls for the UAE to strengthen Gulf alliances as tensions with Iran rise.</li><li><strong>Fragile peace:</strong> U.S. teams are in Beirut attempting to prevent the Israel-Hezbollah ceasefire from collapsing amid the broader regional chaos.</li></ul><p><strong>What's next</strong> Watch for whether Iran formally declares the Strait closed or if a diplomatic breakthrough occurs before oil prices trigger a wider global inflationary spike.</p>", "shipping": "<p>Global shipping is facing a volatile convergence of geopolitical conflict, trade wars, and regulatory shifts.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the Red Sea is disrupting energy flows and inflating freight costs, while new U.S. tariffs are triggering artificial demand spikes.</p><p><strong>The Geopolitical Friction</strong></p><ul><li><strong>Strait of Hormuz:</strong> A cycle of U.S.-Iran strikes and mine threats has stranded ~1,200 ships carrying $125B in goods.</li><li><strong>Ukraine-Russia:</strong> Kyiv is intensifying attacks on Russian fuel tankers in the Azov Sea and targeting \"shadow fleet\" vessels.</li><li><strong>Sanctions Evasion:</strong> Russian tankers are bypassing the English Channel to avoid European naval interceptions.</li></ul><p><strong>Market Drivers</strong></p><ul><li><strong>Tariff Front-running:</strong> Freight rates have surged to 2024 Red Sea crisis levels as U.S. companies stockpile goods to beat new tariffs.</li><li><strong>Strategic M&A:</strong> CMA CGM is spending $1.4B to acquire FedEx's logistics unit to expand its U.S. supply chain footprint.</li><li><strong>Profit Shifts:</strong> Maersk raised profit guidance due to tariff-driven demand, though shares dipped as Suez Canal traffic resumed.</li></ul><p><strong>The Green Divide</strong></p><ul><li><strong>Regulatory Pressure:</strong> The EU is closing loopholes to increase carbon fees on shipping emissions.</li><li><strong>Tech Fracture:</strong> Shipowners are splitting between nuclear power and \"dirty\" fossil fuels as a unified green transition stalls.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$4B:</strong> Revenue Greek shipping firms earned transporting Russian oil over three years.</li><li><strong>50%:</strong> The current traffic level in the Strait of Hormuz compared to pre-war levels.</li><li><strong>7%:</strong> Maersk's share drop following the reopening of the Suez route.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative hype cycle to a period of operational and legal volatility.</p><p><strong>Why it matters:</strong> Market enthusiasm is decoupling from actual profitability, while regulatory and ethical frictions are creating systemic risks for Big Tech.</p><p><strong>The market reality</strong></p><ul><li><strong>Valuation fade:</strong> Companies rebranding as \"AI-first\" are failing to sustain initial share price boosts.</li><li><strong>Debt skepticism:</strong> Investors are selling long-dated AI debt, signaling doubt over long-term margins.</li><li><strong>Hardware wins:</strong> SK Hynix's 13% Nasdaq debut jump shows that chipmakers remain the primary beneficiaries of the build-out.</li></ul><p><strong>Strategic friction</strong></p><ul><li><strong>Legal warfare:</strong> Apple is suing OpenAI for alleged theft of secret information, ending a key Silicon Valley partnership.</li><li><strong>Geopolitical leaks:</strong> OpenAI and Google are selling models to blacklisted Chinese groups via Singaporean subsidiaries.</li><li><strong>Regulatory pushback:</strong> Beijing ordered the reversal of Meta’s $2bn Manus acquisition, favoring Tencent.</li></ul><p><strong>Emerging risks</strong></p><ul><li><strong>Infrastructure strain:</strong> AI-generated code is overwhelming human maintainers and \"caretakers.\"</li><li><strong>Privacy battles:</strong> Meta's \"super sensing\" glasses are triggering new conflicts over non-consensual recording.</li><li><strong>Cognitive influence:</strong> Biased LLMs are being flagged as tools for emotional hacking and public opinion manipulation.</li></ul><p><strong>What's next:</strong> Watch for a shift in capital spending. Microsoft and other giants are facing a \"test of faith\" as massive infrastructure investments struggle to produce proportional revenue.</p>", "us-china relations": "<p>US-China relations are shifting toward a \"might is right\" world order defined by military brinkmanship and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and China's aggressive posture increase the risk of direct conflict. This instability forces middle powers to choose sides or seek non-alignment to survive.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China recently fired a submarine-launched ballistic missile into a Pacific nuclear-free zone, triggering condemnation from US allies Japan, Australia, and New Zealand.</li><li>  <strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, recently detaining Japanese nationals for rare earth smuggling.</li><li>  <strong>Trade volatility:</strong> The IMF warns that \"tit-for-tat\" trade wars between the superpowers are self-defeating and threaten global economic stability.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Diplomatic pivot:</strong> While the US faces internal crisis and perceived instability, foreign officials are flocking to Xi Jinping, allowing Beijing to frame itself as the global \"pillar of stability.\"</li><li>  <strong>Strategic shift:</strong> China is exploring a \"tribute system\" model—exercising power through economic and political leverage rather than direct kinetic war.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance restructuring:</strong> US allies, including Germany and Japan, are aggressively increasing defense capabilities and procurement to hedge against superpower volatility.</li><li>  <strong>Non-alignment revival:</strong> More nations are adopting postcolonial non-alignment doctrines to avoid being crushed by the US-China competition.</li></ul>", "us elections": "<p>US midterm elections are becoming a volatile referendum on populist influence and foreign policy.</p><p><strong>Why it matters:</strong> Internal party fractures and economic discontent are eroding traditional base loyalty for both Republicans and Democrats.</p><p><strong>The Trump Factor</strong></p><ul><li><strong>Economic drag:</strong> Voters blame the president for inflation and rising grocery prices.</li><li><strong>Foreign policy:</strong> A poll shows the Iran war is dragging down approval ratings.</li><li><strong>Base erosion:</strong> Evangelicals and rural voters (e.g., Maine lobster fishermen) are questioning Trump's rhetoric and tariff policies.</li></ul><p><strong>Democratic Divisions</strong></p><ul><li><strong>Ideological rift:</strong> Socialist victories in Colorado and New York are challenging party establishment leaders.</li><li><strong>Candidate volatility:</strong> The Graham Platner scandal in Maine has forced a last-minute scramble to replace a populist candidate.</li><li><strong>Corporate influence:</strong> Big Tech lobbying successfully ousted pro-regulation candidates in House primaries.</li></ul><p><strong>Key Battlegrounds</strong></p><ul><li><strong>Texas:</strong> Republicans risk a \"Pyrrhic victory\" by nominating divisive candidates, opening a path for Democrats.</li><li><strong>California:</strong> The governor's race between Steve Hilton and Xavier Becerra serves as a proxy for the national appetite for MAGA politics.</li></ul><p><strong>What's next:</strong> Watch for how the GOP manages the fallout from the Iran war resolution and how Democrats reconcile their progressive wing before November.</p>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its traditional fiscal restraint to address security gaps and stagnant growth, signaling a fundamental shift in Germany's role within Europe and the global order.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Borrowing €800bn for rearmament, the largest shift since reunification.</li><li><strong>Procurement:</strong> Overhauling arms agencies to speed spending; buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> Ditching France for a new fighter jet project to ensure leadership commensurate with financial input.</li><li><strong>Failures:</strong> Scrapping the F126 frigate program due to cost overruns and delays.</li></ul><p><strong>Economic restructuring</strong></p><ul><li><strong>Growth:</strong> Implementing €10bn in tax cuts and loosening labor laws (Sunday opening hours, sick-leave rules).</li><li><strong>Pensions:</strong> Moving toward a Swedish-style public fund to invest contributions in capital markets.</li><li><strong>Privatization:</strong> Reducing state ownership of gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD leads opinion polls, fueled by fuel prices and ties to Kremlin associates.</li><li><strong>Internal strife:</strong> Merz faces \"chancellor swap\" rumors as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Security:</strong> Intelligence warns of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Merz must balance massive domestic borrowing for defense while simultaneously blocking new EU-wide debt, creating a potential contradiction in Berlin's European leadership.</p>", "central banks": "<p>Central banks are shifting toward structural reform and divergent monetary paths.</p><p><strong>Why it matters:</strong> New leadership at the Fed and persistent inflation globally are forcing a rethink of how central banks communicate, manage AI risks, and maintain independence.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is aggressively restructuring the U.S. central bank:</p><ul><li><strong>Reform:</strong> Established five task forces led by business and academic leaders to overhaul operations.</li><li><strong>Communication:</strong> Moving away from traditional \"forward guidance\" to reduce market predictability, though this is increasing short-term volatility.</li><li><strong>Independence:</strong> Publicly vowing to maintain price stability despite political pressure from the White House.</li></ul><p><strong>Global divergence</strong> National banks are moving in opposite directions based on local inflation and currency needs:</p><ul><li><strong>New Zealand:</strong> Raising rates for the first time in three years to combat persistent inflation.</li><li><strong>Japan:</strong> Pushing domestic pension funds to shift assets from foreign to domestic to support the yen.</li><li><strong>Eurozone:</strong> ECB President Lagarde signals a less aggressive approach to inflation than in 2022-23.</li></ul><p><strong>Emerging risks</strong> Regulators are pivoting toward systemic stability and technology:</p><ul><li><strong>AI Volatility:</strong> The Bank of England is considering \"kill switches\" for AI-powered trading to prevent market herding.</li><li><strong>Leverage:</strong> The BoE is limiting hedge fund leverage to protect the gilt market.</li><li><strong>QT Stress:</strong> Geopolitical crises (e.g., Iran) are complicating Quantitative Tightening programs.</li></ul><p><strong>What's next</strong> Markets are bracing for a \"hawkish\" shift in Fed forecasts, while sovereign wealth funds are exiting public markets for private credit to capture AI growth.</p>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and pursue aggressive growth.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing up billions in liquidity, allowing Wall Street firms to outpace international rivals and pivot toward acquisitions.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital gained by top US and UK banks due to regulatory loosening.</li><li><strong>$700 billion:</strong> Potential losses US banks would face in a severe economic crash, per Fed stress tests.</li><li><strong>$114 billion:</strong> Revenue for non-bank trading firms (e.g., Citadel, Jane Street) as they erode traditional bank market share.</li><li><strong>$20 billion:</strong> The amount JPMorgan may spend on new acquisitions following regulatory relief.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal instability:</strong> JPMorgan is undergoing a volatile leadership reshuffle, evidenced by the abrupt exit of CEO contender Marianne Lake.</li><li><strong>Compliance friction:</strong> The rise of prediction markets (Kalshi, Polymarket) is forcing banks like Goldman Sachs to tighten employee betting rules to avoid regulatory breaches.</li><li><strong>Strategic pivots:</strong> US lenders are shifting focus toward digital retail expansion in Europe (France, Spain, Italy) and capitalizing on a trading boom in China.</li></ul><p><strong>What's /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>13 Jul 2026 12:45 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
