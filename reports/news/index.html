.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}

.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and refining bottlenecks are driving a global surge in energy costs and corporate windfalls.</p><p><strong>Why it matters:</strong> Conflict in the Middle East and Ukraine has crippled production capacity, shifting the market from a supply glut to a high-margin environment for oil majors.</p><p><strong>The profit paradox</strong></p><ul><li><strong>Bumper returns:</strong> ExxonMobil, Chevron, and BP report record profits fueled by soaring refining margins.</li><li><strong>Capital allocation:</strong> European majors are increasing buybacks, while BP prioritizes debt reduction.</li><li><strong>Investment gap:</strong> Majors are resisting new refinery construction despite rising fuel prices, prioritizing short-term margins over capacity expansion.</li></ul><p><strong>Geopolitical volatility</strong></p><ul><li><strong>Supply threats:</strong> Iranian tanker attacks in the Strait of Hormuz are causing environmental damage and price spikes.</li><li><strong>Energy security:</strong> Japan is spending $21B to secure US Gulf Coast LNG to hedge against market upheavals.</li><li><strong>Storage failures:</strong> Germany missed winter gas storage targets, forcing a reliance on expensive spot markets.</li></ul><p><strong>The transition friction</strong></p><ul><li><strong>Policy pivots:</strong> The UK is shifting away from aggressive \"clean power by 2030\" goals to prioritize immediate cost reduction.</li><li><strong>Critical minerals:</strong> US government backing for domestic minerals has increased lobbying activity but failed to boost actual production.</li><li><strong>Nuclear debate:</strong> Small modular reactors are being pitched for AI data centers, though critics question their financial viability.</li></ul><p><strong>What's next:</strong> Watch for US election outcomes to dictate fuel pricing trends and potential shifts in Texas' energy policy as Democrats test an \"all of the above\" strategy.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI infrastructure costs clash with macroeconomic headwinds.</p><p><strong>Why it matters:</strong> Massive capital expenditures in AI are creating a \"burn rate\" crisis for startups and hardware firms, while traditional sectors face rising operational costs and regulatory pressure.</p><p><strong>The AI Divide</strong></p><ul><li><strong>The Bet:</strong> Marvell is spending $115bn to acquire Lumentum to dominate AI connectivity.</li><li><strong>The Burn:</strong> Anthropic reports $900bn in spending commitments; infrastructure costs are currently outpacing revenue growth.</li><li><strong>The Risk:</strong> Higher interest rates threaten to deflate the AI bubble by increasing the cost of capital for these massive build-outs.</li></ul><p><strong>Sector Stress Tests</strong></p><ul><li><strong>Industrial:</strong> Alstom shares dropped 26% after missing forecasts for the sixth consecutive year and announcing a €2bn debt reduction plan.</li><li><strong>Aviation:</strong> Ryanair is freezing pay and cutting hiring to offset a €2bn surge in jet fuel costs linked to geopolitical instability.</li><li><strong>Consumer Goods:</strong> \"Big Food\" faces multibillion-dollar risks as the US government targets ultra-processed foods.</li></ul><p><strong>Systemic Vulnerabilities</strong></p><ul><li><strong>Cybersecurity:</strong> A fresh attack on European supermarkets caused freezer temperatures to hit 55C; German officials warn of state-level iPhone compromises.</li><li><strong>Crypto:</strong> Binance is reeling from a $6.3bn hack and $5bn in user withdrawals, highlighting ecosystem vulnerabilities over blockchain flaws.</li></ul><p><strong>What's next:</strong> Investors will shift focus from AI \"potential\" to actual cash flow as the market tests whether AI revenues can sustain current spending levels.</p>", "middle east war": "<p>The Middle East is teetering on the edge of a major US-Israeli escalation against Iran.</p><p><strong>Why it matters:</strong> A renewed conflict would disrupt global trade and risk a regional war far more destructive than previous skirmishes.</p><p><strong>The catalyst:</strong></p><ul><li>Prime Minister Benjamin Netanyahu is pressing President Trump for renewed strikes against Iran.</li><li>Netanyahu currently serves as a caretaker leader after a contested election left him without a clear majority.</li><li>Security experts warn Netanyahu may launch a bombing campaign to secure his political standing during coalition talks.</li></ul><p><strong>The flashpoints:</strong></p><ul><li><strong>Maritime risk:</strong> Iran recently attacked a Hormuz tanker with limpet mines, signaling a tactical shift to disrupt shipping.</li><li><strong>Iranian response:</strong> Ayatollah Khamenei warned of \"immediate\" retaliation without \"geographical limitations\" if attacked.</li><li><strong>Diplomatic race:</strong> Qatari mediators are conducting last-ditch talks in Tehran to avert a US-Israeli campaign.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Political survival:</strong> Netanyahu is claiming the election was \"stolen\" by foreign entities to deflect from his loss of a majority.</li><li><strong>Economic volatility:</strong> Oil prices are currently tumbling on hopes for US-Iran talks, but a strike would trigger a price spike.</li></ul><p><strong>What's next:</strong> Watch for the outcome of Qatari mediation and the finalization of Israel's coalition government, which will determine the likelihood of an imminent strike.</p>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict turns the Black Sea and Strait of Hormuz into high-risk zones.</p><p><strong>Why it matters:</strong> Military volatility is decoupling trade routes and spiking operational costs. This creates a \"shipping squeeze\" that threatens global energy prices and food security.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers.</li><li><strong>$100,000:</strong> Monthly salary for captains transiting the Strait of Hormuz.</li><li><strong>24 tankers:</strong> Targeted by Iran in a two-week window.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships bypass the Middle East.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk premiums:</strong> The Black Sea is now the world's deadliest shipping route, forcing Russia to divert grain to the Arctic.</li><li><strong>Market distortion:</strong> Demand for immediate capacity has made old supertankers more valuable than new builds.</li><li><strong>State control:</strong> Russia is expanding its own fleet and using coordinated location-spoofing to evade sanctions.</li><li><strong>Strategic pivots:</strong> Maersk is aggressively acquiring ships to maintain competitiveness against CMA CGM.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Price volatility:</strong> Vitol warns of a potential surge to $200-a-barrel oil if tanker shortages persist.</li><li><strong>Legal precedents:</strong> The Mercuria vs. Baltic Exchange court case will determine how shipping price estimates are handled during active wars.</li><li><strong>Financialization:</strong> Trafigura's plan to float Volare Shipping signals a move to capitalize on record-high tanker rates via public markets.</li></ul>", "artificial intelligence": "<p>Wall Street is questioning the financial sustainability of the AI boom.</p><p><strong>Why it matters:</strong> Massive capital expenditures are not yet yielding proportional revenue growth, triggering a market correction and tightening investor appetite.</p><p><strong>By the numbers</strong></p><ul><li><strong>$900 billion:</strong> Market value shed by Big Tech amid concerns over soaring AI spending.</li><li><strong>$10 billion:</strong> The amount OpenAI slashed from its funding target.</li><li><strong>22%:</strong> The drop in Intel shares following a weak sales outlook.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Burn\" Problem:</strong> High cash burn at Google, Amazon, and Meta is shifting the narrative from \"innovation\" to \"ROI.\"</li><li><strong>Credit Risk:</strong> Potential \"junk\" ratings for firms like Anthropic signal a shift in how private capital views AI borrowing.</li><li><strong>Labor Shift:</strong> Early data shows productivity gains in tech are coinciding with employment drops, suggesting a structural shift in the workforce.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Governance Pivot:</strong> Governments, led by the UK, are prioritizing \"sovereignty and control\" to mitigate safety breaches.</li><li><strong>Leadership Evolution:</strong> Executives are shifting from technical expertise to \"judgment-based\" leadership as agentic tools automate routine strategy.</li><li><strong>Implementation Caution:</strong> Companies are moving toward incremental rollouts to avoid the systemic failures of complex, large-scale deployments.</li></ul>", "us-china relations": "<p>US-China relations have shifted from mutual economic gain to a zero-sum geopolitical struggle.</p><p><strong>Why it matters:</strong></p><ul><li>  The \"win-win\" era of globalization is over, replaced by systemic rivalry and supply chain weaponization.</li><li>  Unpredictable leadership in both Washington and Beijing increases the risk of miscalculation and global instability.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Middle power agency:</strong> Smaller nations and \"middle powers\" are diversifying ties to avoid becoming hostages to the US-China binary.</li><li>  <strong>BRICS expansion:</strong> The bloc is finding rare unity against US sanctions and tariffs, now surpassing the G7 in share of the global economy.</li><li>  <strong>Strategic distrust:</strong> Diplomatic summits are viewed as tactical necessities rather than paths toward genuine détente.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Economic decoupling:</strong> Expect continued pressure on supply chains as \"economic security\" overrides consumer cost-efficiency.</li><li>  <strong>Proxy volatility:</strong> Competition will likely intensify in the Global South, where both powers vie for influence over critical minerals and infrastructure.</li></ul>", "us elections": "<p>The upcoming U.S. midterm elections will determine whether Donald Trump retains a legislative shield or becomes a lame duck.</p><p><strong>Why it matters:</strong> A Democratic sweep would shift control of energy and trade policy and increase executive scrutiny. Conversely, Republican victory secures Trump's agenda for his final two years.</p><p><strong>The primary drivers</strong></p><ul><li><strong>Inflation:</strong> A majority of voters disapprove of the administration's handling of the economy and living costs.</li><li><strong>Legal battles:</strong> The White House is petitioning the Supreme Court to invalidate specific California mail-in ballots.</li><li><strong>Internal friction:</strong> Democratic unity is fracturing over Israel, while Republicans face predicted post-election \"civil war.\"</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market volatility:</strong> While the S&P 500 historically rises post-midterms, bond investors may prefer legislative gridlock to avoid drastic policy swings.</li><li><strong>Political risk:</strong> Experts warn of potential political violence and disorder surrounding the results.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate arithmetic:</strong> Key races in states like Michigan will decide if Democrats can flip the chamber.</li><li><strong>Policy pivot:</strong> A \"blue wave\" would likely trigger immediate shifts in U.S. trade agreements and climate initiatives.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz's dwindling domestic authority weakens Germany's leadership within the EU and stalls critical economic and pension reforms.</p><p><strong>The AfD threat</strong></p><ul><li><strong>Electoral gains:</strong> The far-right party is winning regional seats and securing key positions, including its first regional parliament president.</li><li><strong>Institutional infiltration:</strong> Allegations suggest CDU lawmakers may have traded votes with the AfD in Saxony-Anhalt.</li><li><strong>Investment risk:</strong> Executives warn that the AfD's rise is deterring foreign investment.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Coalition strain:</strong> The resignation of the labor minister delays essential market reforms.</li><li><strong>Succession rumors:</strong> Hendrik Wüst, premier of North Rhine-Westphalia, is emerging as a popular alternative to Merz.</li><li><strong>Policy clashes:</strong> Tensions are rising over Berlin's plans to seize landlord properties.</li></ul><p><strong>Security and Foreign Policy</strong></p><ul><li><strong>Russian influence:</strong> Authorities are battling \"intense\" espionage and illegal state-secret trading.</li><li><strong>Military pivot:</strong> Germany is rapidly rearming and utilizing \"guerrilla units\" to fast-track arms deals for Ukraine.</li><li><strong>Diplomatic shifts:</strong> Germany is resuming high-level talks with Russia to address drone incursions and de-escalation.</li></ul><p><strong>What's next:</strong> Merz must stabilize his party's regional performance to maintain his grip on power and secure the EU's €2tn budget deal.</p>", "central banks": "<p>Central banks are maintaining high interest rates while preparing for further tightening to combat persistent inflation.</p><p><strong>Why it matters:</strong> Sticky inflation in the U.S., U.K., and Japan is forcing policymakers to abandon \"insurance cuts\" and extend tightening cycles. This prolongs borrowing costs for consumers and businesses globally.</p><p><strong>The leadership shift</strong></p><ul><li><strong>ECB Transition:</strong> President Christine Lagarde will step down in February, ahead of her 2027 term end.</li><li><strong>Frontrunners:</strong> Pablo Hernández de Cos and Klaas Knot are the leading candidates to succeed her.</li><li><strong>The Risk:</strong> The new president must manage French bond market turbulence and ensure a smooth policy transition.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$90 billion:</strong> Amount India's central bank spent to shore up the rupee.</li><li><strong>7 meetings:</strong> The Federal Reserve's new annual policy vote schedule for next year, down from the traditional eight.</li><li><strong>2.5%:</strong> The current interest rate held by the ECB.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hawkish pivot:</strong> Analysts have raised 2027 rate forecasts for the Bank of England and Bank of Japan.</li><li><strong>Fed pressure:</strong> Strong U.S. Q3 growth and PCE data suggest the economy is \"running hot,\" limiting the Fed's room to pivot.</li><li><strong>New threats:</strong> BoE Governor Andrew Bailey has flagged AI agents as a primary risk to financial stability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed October:</strong> Markets are bracing for high volatility surrounding the Federal Reserve's upcoming rate decision.</li><li><strong>Digital Strategy:</strong> The EU continues developing a \"geopolitical monetary strategy\" via public digital money.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as record trading profits clash with AI-driven deposit risks and regulatory penalties.</p><p><strong>Why it matters:</strong> Banks are facing a \"double-edged sword\" with AI: while it promises better supervision and efficiency, it threatens to trigger a $500 billion exodus of deposits toward higher-yielding accounts.</p><p><strong>The bottom line</strong></p><ul><li><strong>Trading volatility:</strong> Goldman Sachs saw a 30% net income jump driven by equities, but analysts warn the record-breaking trading streak is cooling.</li><li><strong>Regulatory costs:</strong> BofA profits dropped 17% following a $1.2bn money laundering fine; Amex was fined $350mn for systemic reporting failures.</li><li><strong>Talent wars:</strong> Citi is shortening its junior analyst program to two years to prevent poaching by private equity firms.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The SVB hangover:</strong> The collapse of Silicon Valley Bank continues to reshape the sector, fueling the rise of tech-focused alternatives like Erebor (now $7bn+ in deposits) and prompting calls for AI-enhanced supervision.</li><li><strong>Strategic pivots:</strong> Citi is expanding its footprint in China, while JPMorgan is tightening lending to non-bank competitors like Jane Street to protect its bond market dominance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>AI restrictions:</strong> Expect more lenders to block AI agents from account access to prevent automated \"rate shopping\" by savers.</li><li><strong>Leadership shifts:</strong> Goldman Sachs remains in a holding pattern regarding David Solomon's succession, while Evercore has shifted to a co-president model.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>02 Nov 2026 20:30 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
