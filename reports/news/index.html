.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;

.summary-banner-inner p{margin:.4rem 0}

.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}
.card-title{font-size:.97rem;font-weight:700;color:#0f172a;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#4f46e5;

.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

/* ── footer ── */

  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}
  .controls{padding:1rem 1rem 0}

const SUMMARIES = {"oil and gas": "<p>Global oil markets are shifting toward a surplus as Gulf shipments recover from conflict-driven disruptions.</p><p><strong>Why it matters:</strong> Rebounding Saudi production and restored shipping lanes are easing immediate supply fears, but depleted global stockpiles leave the system vulnerable to future shocks.</p><p><strong>The energy-AI collision</strong> Data center expansion is creating a critical power bottleneck, driving erratic investment patterns:</p><ul><li><strong>Failed bets:</strong> SoftBank took a $3.7bn charge after overordering inefficient gas turbines for AI hubs.</li><li><strong>Infrastructure gaps:</strong> Oracle’s \"Project Jupiter\" underscores the extreme difficulty of securing reliable electricity for massive AI builds.</li><li><strong>Anchor deals:</strong> Amazon is reviving a deal with Fermi to secure essential data center capacity.</li></ul><p><strong>Geopolitical friction</strong> Energy security and climate mandates are clashing in courts and capitals:</p><ul><li><strong>Legal battles:</strong> ExxonMobil is challenging EU carbon capture rules via investment treaties; Norway's Supreme Court ruled the government must consider \"exported\" emissions from oilfields.</li><li><strong>US Policy:</strong> The Trump administration is pushing to overhaul permitting systems to accelerate fossil fuel infrastructure.</li><li><strong>Russia/Ukraine:</strong> Russian diesel exports doubled following sanction lifts, though Ukrainian refinery attacks threaten to shorten this window.</li></ul><p><strong>The COP31 tension</strong> Negotiators are fighting over the definition of \"electrification\":</p><ul><li><strong>The goal:</strong> A proposal to raise electricity's share of energy consumption to 35% by 2035.</li><li><strong>The risk:</strong> Critics warn the pledge lacks green targets, potentially allowing fossil-fired generation to masquerade as progress.</li></ul><p><strong>What's next:</strong> Watch for the UK Treasury's \"worst-case\" energy support plans for households as the economic impact of the Iran conflict persists.</p>", "corporate earnings and results": "<p>Nvidia faces a critical governance crisis as legal vulnerabilities expose the risks of its founder-centric leadership.</p><p><strong>Why it matters:</strong> A lack of comprehensive insurance for executive conduct leaves the chip giant open to massive lawsuits. This creates a direct link between corporate hubris and potential shareholder losses.</p><p><strong>Between the lines</strong></p><ul><li><strong>Governance gap:</strong> The board's perceived lack of independence has allowed a \"cult of personality\" to supersede traditional risk management.</li><li><strong>Legal exposure:</strong> Without full insurance coverage for executive damages, the company's balance sheet is directly tied to Jensen Huang's legal standing.</li></ul><p><strong>The broader AI landscape</strong></p><ul><li><strong>China:</strong> Investors are pivoting toward \"picks and shovels\" supply chain stocks to avoid the volatility of primary AI plays.</li><li><strong>India:</strong> The government is funding native models via start-up Sarvam to prevent \"digital colonization\" by U.S. firms.</li><li><strong>Anthropic:</strong> The scale of AI windfalls is evident, with early investments (such as those by Sam Bankman-Fried) potentially reaching $40B.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory shifts:</strong> The SEC may loosen executive pay disclosure rules, potentially reducing transparency for all but CEOs and CFOs.</li><li><strong>Geopolitical stability:</strong> Trump's decision not to raise Nvidia-specific spying issues with Xi suggests a strategic decoupling of corporate disputes from high-level diplomacy.</li></ul>", "middle east war": "<p>The U.S.-Israel alliance has reached a crisis point as the Trump administration pivots toward a domestic-first agenda and a volatile peace process with Iran.</p><p><strong>Why it matters:</strong> A shift in U.S. strategic priorities is destabilizing regional security, triggering oil market volatility, and leaving Gaza in a humanitarian emergency.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>U.S. Pivot:</strong> President Trump has signaled an end to pushes for a formal Iran peace deal, directing JD Vance to focus on domestic issues.</li><li><strong>De-escalation:</strong> Oil prices dropped below $90 after Trump stated strikes on Iran are \"highly unlikely,\" sparking a global stock recovery.</li><li><strong>Military Drawdown:</strong> The U.S. is removing aircraft from UK military bases following previous security incidents.</li></ul><p><strong>Regional instability</strong></p><ul><li><strong>Gaza Crisis:</strong> The \"Board of Peace\" warns of an immediate humanitarian emergency due to flooding and insufficient aid.</li><li><strong>Infrastructure Attacks:</strong> Houthi and Iraqi militias struck Saudi Arabia’s critical East-West crude pipeline.</li><li><strong>Cyber Warfare:</strong> France has formally accused Iran's IRGC of cyber attacks targeting supermarket infrastructure.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Gulf Markets:</strong> High \"war inflation\" is forcing Gulf consumers to cut luxury spending, hitting retail profits.</li><li><strong>Abu Dhabi Hedge:</strong> The UAE is aggressively investing in culture and real estate (e.g., Frieze art fair) to insulate its economy from geopolitical jitters.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the internal Republican struggle over Defense Secretary Pete Hegseth, which signals the level of Congressional oversight regarding the conduct of the Iran war.</p>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict transforms the world's most vital maritime chokepoints into war zones.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are driving up operational costs, diverting trade to the Arctic, and threatening global energy price stability.</p><p><strong>The danger zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iran has launched a tactical shift using limpet mines and speedboats, targeting 24 vessels in two weeks.</li><li><strong>Black Sea:</strong> Now the world's deadliest shipping route; commercial sailor fatalities here now exceed those in the Gulf.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades of Iranian ports have led to direct kinetic engagements with commercial tankers.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East and ice melts.</li><li><strong>$200:</strong> Potential price per barrel of oil warned by Vitol if tanker shortages create a critical bottleneck.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results despite data center demand.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Russia is faking vessel locations to evade sanctions and shifting grain exports to the Arctic to bypass Black Sea battles.</li><li><strong>Market volatility:</strong> The value of old supertankers is surpassing new builds because immediate availability outweighs long-term efficiency.</li><li><strong>Political friction:</strong> U.S. domestic politics are interfering with fuel imports, with New Jersey officials threatening to block Russian diesel cargoes.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Infrastructure shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe as the primary hub for Chinese EV imports.</li><li><strong>Corporate warfare:</strong> Maersk is aggressively purchasing ships to counter the growth of rival CMA CGM.</li></ul>", "artificial intelligence": "<p>Jensen Huang’s sudden resignation as Nvidia CEO has triggered a leadership crisis at the center of the AI economy.</p><p><strong>Why it matters:</strong> Nvidia provides the essential hardware for the AI boom. Huang's exit creates a power vacuum that threatens chip supply chains and geopolitical stability between the U.S. and China.</p><p><strong>The fallout</strong></p><ul><li><strong>Leadership shift:</strong> Silicon Valley veterans Harvey Jones (Chair) and Colette Kress (CEO) are now tasked with stabilizing the company.</li><li><strong>Geopolitical risk:</strong> Huang previously advocated for maintaining sales to China; his departure may accelerate tougher U.S. chip restrictions.</li><li><strong>Market volatility:</strong> While shares initially dipped, investors are betting on the underlying AI demand rather than founder-led stability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Founder Mode\" failure:</strong> The crisis highlights the systemic risk of giving tech founders unchecked authority over infrastructure critical to national security.</li><li><strong>Financial fragility:</strong> The industry is now testing whether the AI boom is tied to Huang’s personal vision or the actual utility of the hardware.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Stock movement:</strong> Markets are watching for any sign of Huang offloading his $135 billion stake, which could trigger a massive sell-off.</li><li><strong>Regulatory pivot:</strong> Expect a push for standardized AI agent access to prevent a few dominant providers from controlling the ecosystem.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition where leadership instability and geopolitical volatility increase the risk of global conflict.</p><p><strong>Why it matters:</strong></p><ul><li>  U.S. political volatility and perceived retrenchment create power vacuums that China seeks to exploit.</li><li>  The lack of far-sighted leadership in both Washington and Beijing raises the probability of miscalculation.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The \"Retreat\" Narrative:</strong> Perceptions of American isolationism signal to Beijing that the U.S. may no longer underwrite global security.</li><li>  <strong>The Middle Power Shift:</strong> Smaller nations are increasingly diversifying supply chains to avoid becoming hostages to the U.S.-China rivalry.</li><li>  <strong>The Proxy Effect:</strong> Conflicts in Ukraine and the Middle East serve as testing grounds for how revisionist powers challenge the established order.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Tactical Engagement:</strong> Expect continued high-level summits, though these are viewed as risk-management tools rather than a return to détente.</li><li>  <strong>Economic Security:</strong> A shift toward \"economic security\" will prioritize resilient supply chains over raw efficiency to mitigate geopolitical shocks.</li></ul>", "us elections": "<p>Democrats secured a sweeping midterm victory, reclaiming power and rejecting the \"America First\" agenda.</p><p><strong>Why it matters:</strong> The results signal a rejection of Trump-era populism and a mandate for centrist, pro-labor policies. This shift forces a fundamental identity crisis within the Republican Party.</p><p><strong>The big wins</strong></p><ul><li><strong>Historic breakthroughs:</strong> Scott Colom became the first Black senator from Mississippi since 1881.</li><li><strong>Centrist surge:</strong> Moderate Democrats, including retired admiral Eileen Laubacher, defeated MAGA incumbents.</li><li><strong>Failed strategy:</strong> Republican gerrymandering efforts failed to stop the Democratic \"blue wave.\"</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Labor's return:</strong> Union-backed candidates successfully reclaimed former Democratic heartlands.</li><li><strong>Trump's pivot:</strong> The president is already floating amnesty deals, admitting his stance on immigration and the economy was \"too tough.\"</li><li><strong>Internal GOP strife:</strong> The party is split between maintaining \"America First\" without Trump and returning to pragmatism.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership battles:</strong> Chris Van Hollen is challenging Chuck Schumer for Senate majority leader.</li><li><strong>Legal scrutiny:</strong> Democrats plan investigations into the Trump family's ties to the crypto industry.</li><li><strong>Economic focus:</strong> The 2028 cycle will be defined by \"affordability\" and the cost of living.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is struggling to maintain domestic stability while attempting to pivot Germany toward a more aggressive military and European leadership role.</p><p><strong>Why it matters:</strong> Internal coalition fractures and the rise of the far-right AfD are paralyzing key policy reforms and weakening Germany's leverage within the EU.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of the labor minister and deadlocks over ECB appointments signal a breakdown in government cooperation.</li><li><strong>AfD surge:</strong> The far-right is infiltrating regional parliaments and securing leadership roles, fueling investor anxiety and threatening the market economy.</li><li><strong>Security threats:</strong> Widespread iPhone hacks of officials and Russian espionage arrests are forcing a sweeping expansion of spy agency powers.</li></ul><p><strong>The military pivot</strong></p><ul><li><strong>Rearmament:</strong> The appointment of Ukraine-aligned Christian Freuding as armed forces chief marks a historic shift toward active military power.</li><li><strong>Fiscal tension:</strong> The Council of Economic Experts warns that defense spending must move to the regular budget to avoid a debt-to-GDP ratio of 98% by 2040.</li><li><strong>Diplomatic friction:</strong> France is pressuring Berlin over the nuclear risks associated with Germany's new long-range precision strike capabilities.</li></ul><p><strong>The EU power struggle</strong></p><ul><li><strong>Budget leverage:</strong> Merz is using the €2tn EU budget as a bargaining chip to force unanimous bloc support for Ukraine funding.</li><li><strong>Diminished authority:</strong> Poor regional election results have hobbled Merz’s standing in Brussels, complicating critical EU financial deals.</li></ul><p><strong>What's next:</strong> Watch for the March presidential transition to Ilse Aigner and whether Hendrik Wüst emerges as a viable alternative to Merz as the \"chancellor-in-waiting.\"</p>", "central banks": "<p>Central banks are pivoting back to aggressive tightening as inflation remains entrenched.</p><p><strong>Why it matters:</strong> Strong growth and labor data are neutralizing previous cooling efforts, forcing policymakers to consider larger rate hikes to prevent inflation from becoming structural.</p><p><strong>The current landscape</strong></p><ul><li><strong>U.S. Fed:</strong> Officials are weighing 50bp increases if inflation fails to slow, driven by a \"hot\" economy.</li><li><strong>Bank of England:</strong> Rates hit 4%, but leadership warns there is \"further to go\" to combat slipping inflation control.</li><li><strong>ECB:</strong> Headline price pressures are accelerating, keeping the bank on a tightening trajectory.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Leadership Vacuum:</strong> The ECB is entering a volatile transition as Christine Lagarde departs early.</li><li><strong>Tool Innovation:</strong> Frontrunners for the ECB presidency, including Klaas Knot, suggest \"inventing new tools\" to manage potential debt crises.</li><li><strong>Transmission Risk:</strong> Shifts in the UK mortgage market may force rates to fall \"far and fast\" in the future, decoupling policy from traditional effects.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed Schedule:</strong> The Fed is shifting to seven policy meetings next year, breaking decades of custom.</li><li><strong>ECB Succession:</strong> Brussels is enforcing tight deadlines for nominations to ensure stability amid French bond market turbulence.</li></ul>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention as a record trading boom begins to cool.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents could trigger a $500 billion deposit exodus to higher-yield accounts, while regulatory failures and money laundering fines are eroding bottom lines.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman Sachs is preparing for top executives.</li><li><strong>$350 million:</strong> Fine levied against Amex for systemic money laundering failures.</li><li><strong>17%:</strong> Drop in Bank of America profits following a $1.2 billion fine.</li><li><strong>30%:</strong> Increase in Goldman Sachs' Q3 net income, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Talent War:</strong> Citi is shortening junior analyst programs to two years to prevent poaching by private equity firms.</li><li><strong>The AI Paradox:</strong> Banks are restricting AI agents to protect deposits while simultaneously elevating engineers to partner ranks to build the tech.</li><li><strong>Risk Shift:</strong> Trading profits are surging not because banks are betting their own capital, but because they are facilitating a trillion-dollar hedge fund borrowing spree.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Overhaul:</strong> The Fed and White House are reviewing the \"culture of risk aversion\" that contributed to the SVB collapse to improve supervision.</li><li><strong>Geopolitical Expansion:</strong> Citi is moving into China's securities business ahead of high-level US-China diplomatic meetings.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>14 Nov 2026 16:43 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
