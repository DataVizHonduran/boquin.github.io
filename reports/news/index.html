.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

would be the first direct negotiations between the two countries in more than four decades", "date_iso": "2026-04-10T23:57:54+00:00", "date_label": "10 Apr 2026", "tag": "us-china relations"}, {"title": "Middle East war day 41 as it happened: S&P 500 posts longest winning streak since October on ceasefire optimism", "url": "https://www.ft.com/content/5fa84873-0c45-462d-9f8b-3adbc9f0a164", "summary": "US stocks closed higher as investors remained positive that Iran would stick to agreement after Israel and Lebanon agree to talks", "date_iso": "2026-04-09T20:58:30+00:00", "date_label": "09 Apr 2026", "tag": "us-china relations"}, {"title": "Middle East war day 40 as it happened: Ceasefire under pressure as strikes persist; JD Vance to lead US delegation in Islamabad talks", "url": "https://www.ft.com/content/2868ed5b-865f-4491-a78e-c84967d50c34", "summary": "Tehran threatens to withdraw from truce pact over Israeli attacks on Hizbollah", "date_iso": "2026-04-08T17:57:54+00:00", "date_label": "08 Apr 2026", "tag": "us-china relations"}, {"title": "Middle East war day 39 as it happened: US and Iran announce two-week ceasefire that will open Strait of Hormuz", "url": "https://www.ft.com/content/e49f0110-f07b-4480-9ea4-2b37aab2c906", "summary": "Oil prices slide as Tehran says it will allow ‘safe passage’ through vital waterway", "date_iso": "2026-04-07T22:51:14+00:00", "date_label": "07 Apr 2026", "tag": "us-china relations"}, {"title": "How Europe made Viktor Orbán", "url": "https://www.ft.com/content/e04b3228-5199-4df7-b5ef-d3540f12ad2a", "summary": "Hungary’s illiberal champion has benefited from the misjudgments and complacency of other leaders", "date_iso": "2026-04-06T16:12:31+00:00", "date_label": "06 Apr 2026", "tag": "german politics"}, {"title": "Campaign to curb cars in Berlin sparks uproar ahead of election", "url": "https://www.ft.com/content/8ac85c84-7947-4ed0-8c41-12733b71c88d", "summary": "Conservatives and far right are opposing a citizens’ initiative to const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>26 May 2026 13:28 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
