/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;

.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#4f46e5;

const SUMMARIES = {"oil and gas": "<p>US fossil fuel spending is outpacing China to meet the massive power demands of AI data centers.</p><p><strong>Why it matters:</strong> AI's energy appetite is forcing a pivot back to gas turbines and fossil fuel infrastructure. Meanwhile, Europe faces a critical supply gap as winter approaches.</p><p><strong>By the numbers</strong></p><ul><li>$200 billion: M&A boom in the US power sector to build AI energy infrastructure.</li><li>15 years: The low point EU gas stocks risk hitting this winter.</li><li>£4.8 billion: Total household energy debt in the UK.</li></ul><p><strong>Between the lines</strong></p><ul><li>The energy transition is colliding with AI growth. US utilities warn of blackouts unless infrastructure spending increases.</li><li>EU member states are fractured on Russian energy. Some push for faster oil bans, while others urge delays on gas bans to avoid crises.</li></ul><p><strong>What's next</strong></p><ul><li>US utilities will likely seek higher electricity rates to fund grid upgrades.</li><li>EU regulators must decide whether to suspend methane rules to protect gas imports under US pressure.</li></ul>", "corporate earnings and results": "<p>Geopolitical instability and regulatory penalties are eroding corporate margins despite a broader US market rally.</p><p><strong>Why it matters:</strong> Supply chain disruptions and antitrust rulings create unpredictable volatility for multinationals. Strategic divestitures and store closures signal a shift toward leaner, risk-averse operations.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 billion:</strong> Antitrust damages Google must pay Klarna.</li><li><strong>$1.4 billion:</strong> Expected sale price of FedEx's logistics unit to CMA CGM.</li><li><strong>$3.7 billion:</strong> Value of the scrapped Getty-Shutterstock merger.</li><li><strong>150:</strong> Number of stores TG Jones is approved to close.</li></ul><p><strong>Between the lines</strong></p><ul><li>UK regulators (CMA) are actively blocking consolidation in the tech and media sectors.</li><li>Private credit is facing a reckoning as equity wipeouts hit firms like Medallia.</li><li>Geopolitical bottlenecks, specifically the Strait of Hormuz, are directly impacting food and retail profits.</li></ul><p><strong>What's next</strong></p><ul><li>Companies will adopt AI-driven \"tone\" analysis to manage investor sentiment during earnings calls.</li><li>European firms will pivot toward joint production concepts to hedge against US political volatility.</li></ul>", "middle east war": "<p>The U.S. and Iran are alternating between direct military strikes and disputed diplomatic overtures.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz threatens global shipping lanes and energy security. Failure to secure a lasting truce risks a wider regional escalation involving Lebanon and Iraq.</p><p><strong>By the numbers</strong></p><ul><li>50%: Current shipping traffic in the Strait of Hormuz compared to prewar levels.</li><li>$72.48: Brent crude price point as oil returns to prewar levels.</li><li>195,000: U.S. defense jobs sustained by Europe's rearmament drive.</li></ul><p><strong>Between the lines</strong></p><ul><li>The U.S. is shifting toward modular missile production to enable mass-production during wartime.</li><li>Tehran is using commercial shipping targets to pressure Washington into a formal deal.</li><li>The Lebanon ceasefire is failing as Hizbollah rejects U.S.-backed terms while Israeli troops remain in occupied territory.</li></ul><p><strong>What's next</strong></p><ul><li>High-level meetings in Doha between U.S. envoys and Qatari mediators to finalize a strike halt.</li><li>Potential for increased UK sanctions on Iran following reported treaty breaches.</li></ul>", "shipping": "<p>Geopolitical volatility is destabilizing global shipping lanes and pricing.</p><p><strong>Why it matters:</strong> The Strait of Hormuz remains a critical chokepoint where political deals dictate global oil flows. Simultaneously, anticipated US tariffs are triggering a preemptive surge in freight costs.</p><p><strong>By the numbers</strong></p><ul><li>1,200: Cargo ships stranded during the Hormuz blockade.</li><li>$125 billion: Value of goods delayed by the closure.</li><li>50%+: Drop in hull war premiums following the US-Iran ceasefire.</li></ul><p><strong>Between the lines</strong></p><ul><li>Iran is leveraging the reopening of Hormuz to implement \"insurance fees,\" effectively creating a toll system for the waterway.</li><li>Shipowners who expanded fleets during the crisis now face a potential market crash as rates normalize.</li><li>The \"shadow fleet\" has become a primary target for Western seizures and Ukrainian military strikes.</li></ul><p><strong>What's next</strong></p><ul><li>Freight rates will likely climb as companies rush shipments to beat new US tariffs.</li><li>South Korea will continue to scale its shipbuilding sector to meet AI and defense demand.</li><li>The UK is positioning its domestic shipyards for a Royal Navy refresh and higher defense spending.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is moving from experimental chatbots to core industrial infrastructure.</p><p><strong>Why it matters:</strong> Integration into pharma, aviation, and manufacturing creates tangible productivity gains but introduces systemic volatility. Massive capital expenditure in hardware is decoupling AI growth from traditional software valuations.</p><p><strong>By the numbers</strong></p><ul><li>$600 billion: Planned chipmaking expansion by Samsung and SK Hynix.</li><li>$2.2 trillion: Value shed by \"Magnificent Seven\" stocks during a rotation toward chipmakers.</li><li>22,000: Number of US companies studied showing heavy AI spenders are hiring staff faster than peers.</li></ul><p><strong>Between the lines</strong></p><ul><li>The \"job loss\" narrative is clashing with data showing AI adoption correlates with headcount growth.</li><li>Tech CEOs are now requesting formal regulation to avoid unpredictable, ad hoc political interventions.</li><li>Financial regulators fear \"herding behavior\" in AI-powered trading, prompting calls for emergency kill switches.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Pharma:</strong> Anthropic is launching Claude Science to target 3D protein rendering and drug discovery.</li><li><strong>Politics:</strong> AI-driven spending is expected to dominate upcoming US midterm elections.</li><li><strong>Automation:</strong> China is accelerating the deployment of AI-powered robots into traditional factory sectors.</li></ul>", "us-china relations": "<p>The U.S. and China are competing for global hegemony in a vacuum of shared responsibility.</p><p><strong>Why it matters:</strong></p><ul><li>Economic warfare over critical minerals and trade threatens global stability.</li><li>The decline of U.S. hegemony creates a leadership gap that neither power is fully filling.</li></ul><p><strong>Between the lines</strong></p><ul><li>Beijing is exploiting Russia's geopolitical isolation to secure a one-sided strategic advantage.</li><li>China is pivoting toward a \"tribute system\" model to exercise power without resorting to open war.</li></ul><p><strong>Key flashpoints</strong></p><ul><li><strong>Critical Minerals:</strong> China is cracking down on rare earth smuggling and export violations.</li><li><strong>Trade:</strong> IMF economists warn that \"tit-for-tat\" trade warfare is self-defeating.</li><li><strong>Diplomacy:</strong> High-level summits provide temporary stability but fail to resolve systemic rivalry.</li></ul><p><strong>What's next</strong></p><ul><li>Increased volatility in the supply of critical minerals.</li><li>A transition toward a \"might is right\" world order as multilateral governance erodes.</li></ul>", "us elections": "<p>Internal ideological warfare is reshaping both the Democratic and Republican parties ahead of the midterm elections.</p><p><strong>Why it matters:</strong></p><ul><li>Democratic socialist victories in Colorado and New York signal a leftward shift that may alienate moderate voters.</li><li>Trump’s insistence on MAGA-aligned candidates, such as Ken Paxton in Texas, risks losing swing seats in the Senate.</li></ul><p><strong>Between the lines</strong></p><ul><li>Economic discontent is eroding Trump's base, specifically regarding inflation and grocery prices.</li><li>Big Tech's political spending is successfully blocking pro-regulation candidates, as seen in the defeat of Alex Bores.</li><li>The Supreme Court is actively rolling back Black enfranchisement through the *Louisiana vs Callais* decision.</li></ul><p><strong>By the numbers</strong></p><ul><li>$1.8 billion: The \"anti-weaponization\" fund causing friction between Trump and GOP senators.</li><li>$300 billion: The proposed fund for Iran if a peace deal is upheld.</li></ul><p><strong>What's next</strong></p><ul><li>California’s gubernatorial race between Steve Hilton and Xavier Becerra will gauge the national appetite for MAGA-style politics.</li><li>Maine’s Senate race will test if local economic grievances over tariffs and fuel prices outweigh party loyalty.</li><li>The DNC must address the \"lack of unity\" cited in the autopsy of Harris's loss to regain voter confidence.</li></ul>", "german politics": "<p>Germany is aggressively restructuring its defense and financial architecture amid a surge in far-right political power.</p><p><strong>Why it matters:</strong> Berlin is abandoning traditional EU partnerships to fix systemic military inefficiency. Simultaneously, the AfD's polling dominance is shifting the national posture toward nationalism and the Kremlin.</p><p><strong>The military pivot</strong></p><ul><li>Berlin is buying a 40% stake in tank maker KNDS and overhauling its procurement agency to accelerate spending.</li><li>Germany is distancing itself from France on fighter jet projects and scrapping the F126 frigate program due to cost overruns.</li><li>The government is pursuing Tomahawk missiles despite diplomatic friction with Donald Trump.</li></ul><p><strong>Political volatility</strong></p><ul><li>The AfD leads opinion polls, leveraging voter anger over fuel prices and the Iran war.</li><li>Chancellor Friedrich Merz faces internal challenges from conservative rival Hendrik Wüst as polls slide.</li><li>AfD executives are holding talks with top Kremlin associates and reviving Nazi-era attacks on modernist art.</li></ul><p><strong>Economic realignment</strong></p><ul><li>Berlin is proposing a Swedish-style public pension fund invested in capital markets.</li><li>The government is reducing its stake in gas importer Uniper from 99% to 25%.</li><li>The Finance Ministry is threatening funding cuts for agencies failing to spend a €500bn infrastructure fund.</li></ul><p><strong>Between the lines</strong> Germany is attempting a high-wire act: increasing military autonomy and financial liberalization while fighting a domestic rise in extremism and a breakdown in relations with its primary allies.</p>", "central banks": "<p>The Federal Reserve is undergoing a radical shift in communication and governance under new chair Kevin Warsh.</p><p><strong>Why it matters:</strong> Warsh’s removal of forward guidance and \"dot plots\" increases market volatility and raises borrowing costs. Simultaneously, legal battles over the removal of governors highlight a fragile tension between executive power and central bank independence.</p><p><strong>The global split</strong></p><ul><li><strong>Hold:</strong> The Bank of England maintains rates at 3.75% as falling oil prices ease inflation.</li><li><strong>Hike:</strong> The ECB and Bank of Japan remain primed for rate increases.</li><li><strong>Defense:</strong> Indonesia and the Philippines are raising rates to shore up currencies against energy shocks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Communication shift:</strong> Warsh is abandoning the ambiguous \"Fedspeak\" of the Greenspan era for a more opaque approach, leaving traders without a clear roadmap.</li><li><strong>Institutional risk:</strong> G7 divergence and economic fragmentation threaten financial stability without coordinated government action.</li><li><strong>Capital flight:</strong> Sovereign wealth funds are moving from public markets into private credit and infrastructure to hedge against stock market concentration.</li></ul><p><strong>What's next</strong></p><ul><li>Investors will monitor Warsh’s proposed reforms to the inflation and balance-sheet frameworks.</li><li>Markets await signals from the ECB on whether \"modest\" rate increases are necessary to finalize the inflation fight.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>01 Jul 2026 13:28 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
