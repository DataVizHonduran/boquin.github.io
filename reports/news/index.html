const SUMMARIES = {"oil and gas": "<p>Geopolitical volatility in the Middle East is driving record profits for Western oil majors while destabilizing global energy security.</p><p><strong>Why it matters:</strong> Conflict involving Iran is spiking refining margins and gas prices, creating a windfall for shareholders but increasing systemic risk for consumers and infrastructure.</p><p><strong>The Profit Paradox</strong></p><ul><li><strong>Bumper Gains:</strong> ExxonMobil, Chevron, and BP report record profits fueled by soaring fuel prices and refining margins.</li><li><strong>Capital Allocation:</strong> European majors are increasing buybacks, while BP focuses on debt reduction.</li></ul><p><strong>Geopolitical Flashpoints</strong></p><ul><li><strong>Iran Conflict:</strong> Tanker attacks in the Strait of Hormuz are causing environmental pollution and pushing European gas prices above €100.</li><li><strong>Russian Diesel:</strong> A Trump-Putin deal to import Russian diesel to the US is triggering legal threats from Congress and potential blocks by state governors.</li><li><strong>Security Risks:</strong> ExxonMobil CEO Darren Woods canceled an Abu Dhabi appearance citing security concerns.</li></ul><p><strong>The Energy Transition Struggle</strong></p><ul><li><strong>Nuclear Divide:</strong> Small modular reactors are pitched as AI power solutions, but large-scale projects like Sizewell are labeled \"terrible deals\" for taxpayers.</li><li><strong>Critical Minerals:</strong> China is reportedly obstructing US-backed exploration for essential minerals in the DR Congo.</li><li><strong>UK Policy:</strong> The government is balancing gasfield approvals (Jackdaw) against a push for heat pumps and waste-to-energy networks.</li></ul><p><strong>What's next:</strong> Watch for the impact of the UK autumn Budget on household energy costs and the White House's attempt to use postwar Russian oil deals as leverage in Ukraine peace talks.</p>", "corporate earnings and results": ht victory for the far-right, giving Arab parties unprecedented leverage.</li><li><strong>Regional Fragility:</strong> While Tehran hosts regional powers (Saudi Arabia, Pakistan, Turkey) to prevent escalation, Iran continues to use military threats against shipping in the Strait of Hormuz.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic Hail Mary:</strong> Qatari negotiators are in Tehran attempting a last-ditch mediation to prevent a new round of war.</li><li><strong>Internal Probe:</strong> Israel's security services are investigating Netanyahu's claims that \"foreign entities\" stole the election.</li></ul>", "shipping": "<p>Global shipping is facing a volatility crisis driven by geopolitical conflict and systemic security failures.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and the Black Sea are decoupling shipping costs from traditional fundamentals, forcing a massive reallocation of global trade routes.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to supertanker shortages.</li><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24.6 million:</strong> Average daily barrels exported from the Gulf, surpassing prewar levels via alternative routes.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as vessels avoid the Middle East.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic deception:</strong> Russia is coordinating \"ghost\" locations for tankers to bypass sanctions and maintain fossil fuel flows.</li><li><strong>Market inversion:</strong> Old supertankers now command higher premiums than new builds because immediate availability outweighs vessel age.</li><li><strong>Cyber vulnerability:</strong> Satellite link hacks are targeting \"edge devices,\" exposing engine and navigation systems to remote interference.</li></ul easing volatility in bond markets and currency valuations.</p><p><strong>The leadership shakeup</strong></p><ul><li><strong>ECB transition:</strong> President Christine Lagarde will step down in February, ahead of her 2027 term end.</li><li><strong>Frontrunners:</strong> Pablo Hernández de Cos and Klaas Knot are the leading candidates to succeed her.</li><li><strong>The risk:</strong> The transition occurs amid French bond market turbulence and a critical need for \"smooth transmission\" of policy.</li></ul><p><strong>Divergent paths</strong></p><ul><li><strong>The Fed:</strong> Holding rates steady but upgrading economic outlooks; shifting to seven policy meetings per year starting next year.</li><li><strong>Bank of England:</strong> Preparing a \"short and precautionary\" tightening cycle for November.</li><li><strong>Bank of Japan:</strong> Maintaining a quarterly tightening trajectory.</li><li><strong>Reserve Bank of India:</strong> Spent ~$90bn to defend the rupee against depreciation.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hawkish shift:</strong> Analysts have raised 2027 rate forecasts for the BoE and BoJ, with marginal increases for the Fed and ECB.</li><li><strong>New threats:</strong> BoE Governor Andrew Bailey identifies AI agents as a primary risk to global financial stability.</li><li><strong>Strategic pivots:</strong> The EU is accelerating digital money development to create a \"geopolitical monetary strategy.\"</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed October:</strong> Markets are highly volatile awaiting the Federal Reserve's next rate decision.</li><li><strong>2026 Outlook:</strong> The ECB remains on course for further rate hikes into 2026.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition marked by regulatory penalties, AI-driven deposit risks, and a cooling trading boom.</p><p><strong>Why it matters:</strong> Banks are facing a \"pincer movement\" where operational costs are rising due to compliance failures while AI threatens to erode their net interest margins.</p><p><strong>The AI paradox</strong></p><ul><li><strong>Deposit flight:</strong> Lenders are restricting AI agents to prevent chatbots from automatically shifting billions in deposits to higher-yielding accounts.</li><li><strong>Cost pressure:</strong> Banks are demanding lower fees from law firms, arguing AI has made routine legal work faster and cheaper.</li><li><strong>Revenue risk:</strong> Analysts warn AI agents could cost the banking sector $500 billion by empowering savers to find better rates.</li></ul><p><strong>Regulatory headwinds</strong></p><ul><li><strong>Compliance costs:</strong> BofA profits dropped 17% following a $1.2 billion money laundering fine; Amex was fined $350 million for systemic reporting failures.</li><li><strong>SVB fallout:</strong> White House reviews cite a \"culture of risk aversion\" among regulators that contributed to the Silicon Valley Bank collapse.</li></ul><p><strong>Market dynamics</strong></p><ul><li><strong>Trading cooldown:</strong> After a record-breaking streak fueled by hedge fund borrowing, analysts forecast a sharp slowdown in equities and fixed-income revenue.</li><li><strong>Talent war:</strong> Citi is shortening junior banker promotion paths to two years to prevent poaching by private equity firms.</li><li><strong>China pivot:</strong> Citi received long-awaited approval for its China securities business, timing the move ahead of high-level US-China diplomatic meetings.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>30%:</strong> Goldman Sachs' Q3 net income increase, driven by equities.</li><li><strong>$500 million:</strong> Special bonuses Goldman is preparing for top executives.</li><li><strong>$7 billion:</strong> Deposits surged into Erebor, a tech-focused startup filling the SVB void.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>30 Oct 2026 16:48 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
