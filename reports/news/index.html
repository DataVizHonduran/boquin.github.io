const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Gulf and extreme European heatwaves are destabilizing global energy supplies.</p><p><strong>Why it matters:</strong> Supply shocks from the Strait of Hormuz are forcing a strategic tug-of-war over Russian imports. Simultaneously, AI-driven power demand and climate-induced grid strain are increasing the risk of systemic blackouts.</p><p><strong>By the numbers</strong></p><ul><li><strong>$72.48:</strong> Brent crude price, now returning to pre-war levels as Gulf flows recover.</li><li><strong>$1.9 billion:</strong> Cost of Energy Fuels' acquisition of a German magnet group to reduce China dependency.</li><li><strong>20%:</strong> Portion of green home improvement loans the UK government will now subsidize.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The transition paradox:</strong> Extreme heat is spiking electricity demand while simultaneously reducing the efficiency of solar panels and gas generation.</li><li><strong>EU fragmentation:</strong> Member states are split on Russian energy. Baltic states demand faster oil bans, while Spain and Germany seek delays on gas and methane rules to protect supply.</li><li><strong>AI pressure:</strong> Data center expansion is outstripping grid capacity, forcing utilities to choose between price hikes and power shortfalls.</li></ul><p><strong>What's next</strong></p><ul><li>Iraq will pressure OPEC for higher production quotas to recover revenue lost during the Hormuz blockade.</li><li>Qatar expects to resume normal LNG production within weeks as it pushes for a US-Iran hotline.</li><li>US utilities will likely implement electricity rate increases to fund infrastructure for the AI boom.</li></ul>", "corporate earnings and results": "<p>AI infrastructure constraints and Chinese industrial competition are redefining corporate profit drivers.</p><p><strong>Why it matters:</strong> Computing power has become a scarce commodity, capping the growth of software giants. Meanwhile, low-cost Chinese automation is forcing a structural collapse of European industrial models.</p><p><strong>By the numbers</strong></p><ul><li>90%: Drop in QuidelOrtho shares since the Covid-19 peak.</li><li>£7: Target share price for EasyJet investors in the Castlelake bid.</li><li>$500 million: Patent bill Apple is contesting in the UK Supreme Court.</li></ul><p><strong>Between the lines</strong></p><ul><li>The AI investment thesis is shifting from generative chatbots to factory-floor robotics.</li><li>Private credit is increasingly replacing public markets for corporate buyouts and liquidity.</li></ul><p><strong>What's next</strong></p><ul><li>Increased volatility for AI-exposed chipmakers as global valuations peak.</li><li>Further job cuts across German automotive sectors to counter Chinese market flooding.</li></ul>", "middle east war": "<p>The U.S.-Iran ceasefire is collapsing as both nations exchange direct military strikes.</p><p><strong>Why it matters:</strong> Escalation threatens global trade arteries and triggers security instability across NATO and the Gulf.</p><p><strong>By the numbers</strong></p><ul><li>1,200: Cargo ships stranded by the Hormuz closure.</li><li>$125 billion: Value of goods caught in the blockade.</li><li>500: U.S. aircraft deployed via Italian bases for Operation Epic Fury.</li></ul><p><strong>Between the lines</strong></p><ul><li>Tehran is expanding its target list to include military installations in Bahrain and Kuwait.</li><li>Regional instability is stalling subsea cable projects, risking AI and cloud investment.</li><li>Lebanon's state structure is fracturing as Hezbollah members face unprecedented felony charges.</li></ul><p><strong>What's next</strong></p><ul><li>The U.S. Senate is moving to rein in executive war powers to limit the conflict's scope.</li><li>Global travel and shipping hubs are bracing for prolonged volatility.</li></ul>", "shipping": "<p>A fragile US-Iran accord has failed to resolve a massive shipping backlog in the Strait of Hormuz.</p><p><strong>Why it matters:</strong> Conflicting transit orders and proposed Iranian \"insurance fees\" create operational chaos for global energy flows.</p><p><strong>By the numbers</strong></p><ul><li>400+: Ships waiting near the strait for full reopening.</li><li>60 days: The window before Tehran may introduce new transit fees.</li><li>50%+: Shadow fleet tankers posing significant environmental risks.</li></ul><p><strong>Between the lines</strong></p><ul><li>Shipowners fear a market crash. Windfall profits during the conflict led to aggressive fleet expansion.</li><li>The \"shadow fleet\" is now a primary target for Western sanctions enforcement in the English Channel.</li></ul><p><strong>What's next</strong></p><ul><li>Tanker giants will wait for \"material\" evidence of stability before resuming full transits.</li><li>Industry leaders are debating whether a fixed toll is preferable to strategic instability.</li></ul>", "artificial intelligence": "<p>The AI industry is entering a volatile phase of government intervention, financial instability, and global talent wars.</p><p><strong>Why it matters:</strong> Overinvestment risks a global economic pullback if commercial returns fail to materialize. Simultaneously, U.S. government vetting of new models signals that AI is now treated as a national security asset.</p><p><strong>By the numbers</strong></p><ul><li><strong>$263 billion:</strong> Market capitalization lost by Apple, citing AI-driven memory shortages.</li><li><strong>20%:</strong> Price increase for MacBooks and iPads to offset those costs.</li><li><strong>15-fold:</strong> Profit surge for Micron due to sustained memory demand.</li><li><strong>$25 billion:</strong> SpaceX debt deal followed by a bond sell-off toward junk-rated levels.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>State Control:</strong> The Trump administration's demand for staggered releases and user vetting for GPT-5.6 marks a shift toward ad hoc regulatory oversight.</li><li><strong>Global Pivot:</strong> China is accelerating commercialization via DeepSeek, while India and the UK are attempting to find specialized niches to avoid becoming U.S. outposts.</li><li><strong>Structural Shift:</strong> Law firms are decoupling legal casework from operations to integrate AI, moving from labor-intensive to tech-driven models.</li></ul><p><strong>What's next</strong></p><ul><li>OpenAI and Anthropic must demonstrate clear profitability to sustain valuations ahead of anticipated IPOs.</li><li>Open-source models will increase pressure on closed-lab providers to justify high costs.</li><li>Ethical disputes over AI usage will trigger a new wave of corporate litigation.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony.</p><p><strong>Why it matters:</strong></p><ul><li>Trade warfare and export controls on critical minerals risk destabilizing the global economy.</li><li>A leadership vacuum is emerging as U.S. influence wanes and China resists assuming global responsibilities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Resource weaponization:</strong> Beijing is using rare earth smuggling crackdowns to signal control over critical supply chains.</li><li><strong>Asymmetric power:</strong> Influence now stems from the ability to convert small imbalances into strategic leverage.</li><li><strong>The Russia factor:</strong> China's strategic bet on Russia has created a one-sided relationship favoring Beijing.</li></ul><p><strong>What's next</strong></p><ul><li>Expect continued \"tit-for-tat\" trade escalations that the IMF warns are self-defeating.</li><li>Increased volatility in critical mineral markets as Beijing tightens export controls.</li><li>A shift toward a \"might is right\" world order as multilateral institutions fail to adapt.</li></ul>", "us elections": "<p>Internal party divisions and economic discontent are shifting the U.S. electoral map.</p><p><strong>Why it matters:</strong></p><ul><li>Ideological volatility in primaries is creating risks for general election viability.</li><li>Voter frustration over inflation is weakening incumbent support.</li></ul><p><strong>Between the lines</strong></p><ul><li>Democrats are splitting between a socialist insurgency in New York and a populist shift in Pennsylvania.</li><li>The DNC attributes previous losses to a lack of unity within the Biden White House.</li><li>Republicans are divided over Trump’s $1.8 billion \"anti-weaponization\" fund.</li></ul><p><strong>The battlegrounds</strong></p><ul><li><strong>Texas:</strong> Trump-backed Ken Paxton won the primary, but his profile may benefit Democrats in November.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Xavier Becerra for governor.</li><li><strong>Maine:</strong> Graham Platner will challenge incumbent Susan Collins despite misconduct allegations.</li></ul><p><strong>External pressures</strong></p><ul><li><strong>Economy:</strong> FT polling shows voters blame Trump for high grocery prices.</li><li><strong>Judiciary:</strong> The Supreme Court overturned precedent on Black enfranchisement in *Louisiana vs Callais*.</li><li><strong>Influence:</strong> AI lobbyists successfully blocked pro-regulation candidate Alex Bores.</li></ul>", "german politics": "<p>Germany is restructuring its defense and financial systems as the far-right AfD surges in polls.</p><p><strong>Why it matters:</strong> Berlin is prioritizing strategic autonomy to fix a broken procurement system while facing internal political instability that threatens its EU leadership.</p><p><strong>The defense pivot</strong></p><ul><li>Berlin is scrapping the F126 frigate program due to cost overruns and delays.</li><li>The government is buying a 40% stake in tank maker KNDS to secure domestic production.</li><li>Germany is overhauling its procurement agency to accelerate spending of its expanded budget.</li><li>Friction with France over fighter jets is pushing Berlin to seek new partners.</li></ul><p><strong>Political volatility</strong></p><ul><li>The AfD currently leads opinion polls, leveraging voter anger over fuel prices.</li><li>Chancellor Friedrich Merz faces internal CDU challenges from rivals like Hendrik Wüst.</li><li>AfD executives are maintaining ties with Kremlin associates.</li><li>A Berlin court ordered the AfD to return €2.35 million in illegal donations.</li></ul><p><strong>Financial shifts</strong></p><ul><li>Berlin is proposing a Swedish-style public pension fund to invest in capital markets.</li><li>The government is reducing its stake in gas importer Uniper from 99% to 25%.</li><li>The Finance Ministry is threatening funding cuts for ministries failing to spend a €500 billion infrastructure fund.</li></ul><p><strong>Between the lines</strong></p><ul><li>Germany is oscillating between EU integration and national interest, specifically regarding financial services oversight and the UniCredit-Commerzbank bid.</li><li>Tensions with the U.S. are complicating the acquisition of Tomahawk missiles.</li><li>Berlin remains opposed to new EU debt despite its own domestic borrowing spree.</li></ul>", "central banks": "<p>Kevin Warsh is dismantling the Federal Reserve's communication framework.</p><p><strong>Why it matters:</strong> Removing forward guidance and the \"dot plot\" increases market volatility. A hawkish pivot is now required to combat inflation spikes triggered by the Iran war.</p><p><strong>By the numbers</strong></p><ul><li><strong>1%:</strong> Bank of Japan's new rate, the highest since 1995.</li><li><strong>3.75%:</strong> Bank of England's current hold.</li><li><strong>~2x:</strong> Current US inflation relative to the Fed's target.</li></ul><p><strong>Between the lines</strong></p><ul><li>Warsh is rejecting \"Fedspeak\" ambiguity for directness, though investors warn this creates a \"Delphic\" and dangerous lack of predictability.</li><li>Global insecurity and sanctions are driving central banks to repatriate gold reserves.</li><li>Southeast Asian banks (Indonesia, Philippines) are raising rates specifically to shore up failing currencies against energy shocks.</li></ul><p><strong>What's next</strong></p><ul><li>US borrowing costs will likely rise as the Fed drops its bias for rate cuts.</li><li>The ECB will monitor ceasefire stability to determine if the Eurozone economy can sustain its current growth.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>28 Jun 2026 12:05 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
