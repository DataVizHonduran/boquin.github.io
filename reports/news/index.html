/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and US policy shifts are driving a volatile spike in global energy costs.</p><p><strong>Why it matters:</strong></p><ul><li>Middle East conflict is disrupting shipping and supply, forcing immediate price hikes for European consumers.</li><li>Proposed US diesel export bans threaten to destabilize global fuel markets to achieve short-term domestic political gains.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Iran-related shipping disruptions.</li><li><strong>€30:</strong> Average increase per tank for European diesel drivers.</li><li><strong>$22 billion:</strong> South Korean investment in a Texas gas plant to align with US trade pressure.</li><li><strong>$10 billion:</strong> Proposed US-Arab fund to build energy infrastructure bypassing the Strait of Hormuz.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Energy Security vs. Politics:</strong> The tension between US domestic fuel prices and global stability is peaking as Trump signals a willingness to halt diesel exports.</li><li><strong>Infrastructure Pivot:</strong> AI-driven data center demand is creating a power crisis, forcing a revival of nuclear power in Italy and sparking regulatory battles over utility profits in the US.</li><li><strong>Sanction Evasion:</strong> Investigations into Rosneft reveal systemic money laundering used by the Kremlin to bypass Western sanctions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Lukoil Battle:</strong> A consortium led by Todd Boehly, backed by US and Gulf brokers, is moving to seize Lukoil's international assets.</li><li><strong>UK Transition:</strong> The UK government faces a critical decision on the Rosebank and Jackdaw fields as it balances \"electrify now\" mandates with North Sea production.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI shifts from a speculative catalyst to a structural risk.</p><p><strong>Why it matters:</strong> High-growth tech sectors are facing a \"valuation reality check\" while traditional industries struggle with restructuring costs and regulatory headwinds.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>Capital surge:</strong> SoftBank raised $11bn via junk bonds to fund OpenAI, signaling high investor appetite for AI bets despite risks.</li><li><strong>Revenue drag:</strong> Deloitte’s tech consulting arm is curbing growth as AI disrupts traditional billable-hour models.</li><li><strong>IPO freeze:</strong> Frontier AI labs and infrastructure groups are delaying public offerings as the \"boom\" clock ticks.</li></ul><p><strong>Sector Volatility</strong></p><ul><li><strong>Housing:</strong> Vistry reported an £83mn first-half loss, forcing a scale-back of growth plans.</li><li><strong>Banking:</strong> UK bank tax receipts rose 20% on surging profits, increasing the likelihood of government tax raids.</li><li><strong>Automotive:</strong> VW's recovery plan remains \"fragile,\" relying on a tenuous board truce to execute restructuring.</li></ul><p><strong>Strategic Pivots</strong></p><ul><li><strong>Diversification:</strong> Gen Digital is pursuing GoDaddy to expand beyond cybersecurity into web domains.</li><li><strong>Market Entry:</strong> Tencent launched a dedicated payments app to capture spending from foreign tourists in China.</li><li><strong>Ownership Models:</strong> US law firms are exploring private equity ownership to implement equity-based partner incentives.</li></ul>", "middle east war": "<p>The U.S.-Iran war is triggering a global economic shockwave and destabilizing regional alliances.</p><p><strong>Why it matters:</strong> Supply chain disruptions and energy volatility are fueling inflation, forcing central banks to consider aggressive rate hikes. Simultaneously, U.S. hesitation to engage Houthis is eroding trust with key Gulf allies.</p><p><strong>The economic fallout</strong></p><ul><li><strong>Energy:</strong> Brent crude is falling below $99/barrel amid conflict talks, but motor oil prices have quadrupled.</li><li><strong>Finance:</strong> U.S. Treasury yields are soaring as traders fear an overheating economy.</li><li><strong>Logistics:</strong> Iraq, Oman, and Azerbaijan have suspended flights to Iran following U.S. sanction threats.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>Saudi Arabia:</strong> Riyadh is questioning U.S. reliability after Trump showed reluctance to fight Houthis.</li><li><strong>Diplomacy:</strong> The U.S. and Iran held their first talks since June, though Trump maintains a rhetoric of \"obliteration.\"</li><li><strong>Internal Israel:</strong> The government is barring main Arab parties from upcoming elections and using archaeology to seize West Bank land.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Monetary policy:</strong> The Fed may raise rates to counter \"Iran supply shocks\" and overheating demand.</li><li><strong>Regional security:</strong> The UAE and Qatar are pushing for a new security framework to end the protracted conflict.</li></ul>", "artificial intelligence": "<p>AI is shifting from a theoretical breakthrough to a volatile geopolitical and economic weapon.</p><p><strong>Why it matters:</strong> Rapid deployment is creating a \"risk-innovation gap\" where security vulnerabilities and mental burnout are outpacing safety protocols.</p><p><strong>The geopolitical landscape</strong></p><ul><li><strong>US-China tension:</strong> Both nations are treating AI as a strategic asset, with China reviewing foreign hardware (Broadcom) to boost domestic autonomy.</li><li><strong>Divergent diplomacy:</strong> While some push for shared security dialogues, Trump rejects globalist controls to maintain US dominance.</li></ul><p><strong>Market dynamics</strong></p><ul><li><strong>Price wars:</strong> Anthropic and OpenAI are slashing model costs to  retreat from championing democracy is emboldening authoritarians globally, particularly in Africa.</li></ul><p><strong>The AI divide</strong></p><ul><li><strong>Hardware hegemony:</strong> US national data center projects are consolidating an AI lead that hardware dispersion cannot offset.</li><li><strong>Power concentration:</strong> Control over AI infrastructure is becoming the primary lever of geopolitical power.</li></ul><p><strong>What's next:</strong> Expect increased volatility as Beijing leverages its \"wise camel\" patience against a transactional US administration. The primary friction point will shift from trade tariffs to the control of critical AI infrastructure.</p>", "us elections": "<p>Republicans are leveraging massive billionaire funding to offset Donald Trump's plummeting approval ratings ahead of the midterms.</p><p><strong>Why it matters:</strong> High fuel prices and cost-of-living anxieties are eroding GOP support, forcing the party to rely on financial blitzes and fear-based messaging rather than policy.</p><p><strong>By the numbers</strong></p><ul><li><strong>$300 million:</strong> The amount Republicans are outspending Democrats in Senate races.</li><li><strong>$400 million:</strong> The size of the Maga Inc. war chest Trump is being pressured to deploy.</li><li><strong>$5,000:</strong> The \"dividend\" Trump promised to pay adult voters if Republicans win.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal friction:</strong> GOP candidates fear Trump's rhetoric has become \"toxic,\" potentially alienating swing voters and Hispanic constituents.</li><li><strong>Strategic pivot:</strong> The Trump-Vance campaign is prioritizing \"fear of the alternative\" over specific policy platforms to maintain a fragile coalition.</li><li><strong>Legal hurdles:</strong> The Supreme Court blocked Trump's attempts to restrict mail-in ballots, preserving a key Democratic voting channel.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Post-election probes:</strong> Democrats are already planning investigations into Elon Musk and the Trump family if they seize House control.</li><li><strong>2028 positioning:</strong> High-profile races, such as Jon Ossoff’s in Georgia, are being viewed as auditions for future presidential bids.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival after a devastating wave of regional election losses.</p><p><strong>Why it matters:</strong> The collapse of the center-right CDU in eastern strongholds weakens Germany's leadership at a critical moment for EU budget negotiations and Ukraine defense.</p><p><strong>The catalyst</strong></p><ul><li><strong>AfD Surge:</strong> The far-right Alternative for Germany (AfD) became the largest party in Saxony-Anhalt, fueled by nostalgia in the east and anger over Ukraine policy.</li><li><strong>Center Crumble:</strong> Merz's inability to stem the far-right tide has left him \"on the ropes\" and hobbled in Brussels.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for the next federal elections.</li><li><strong>€2tn:</strong> The EU budget deal now under threat due to Merz's diminished domestic authority.</li><li><strong>3 seats:</strong> How close the AfD came to a parliamentary majority in Saxony-Anhalt.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Successor\" Factor:</strong> Hendrik Wüst, the popular premier of North Rhine-Westphalia, is already being positioned as the viable alternative to Merz.</li><li><strong>The New Kingmaker:</strong> The hard-left BSW party has emerged as a potential power broker, complicating the path to stable regional governments.</li><li><strong>Generational Shift:</strong> Younger voters are increasingly disconnected from the historical warnings against fascism and communism.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Survival Mode:</strong> Merz is skipping international summits to contain the CDU crisis.</li><li><strong>Federal Fallout:</strong> If the center cannot deliver rapid policy wins, the AfD's regional blueprint will likely scale to the national level.</li></ul>", "central banks": "<p>Central banks are facing a crisis of legitimacy as political pressure and structural economic shifts challenge their independence.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Political encroachment:</strong> Populist demands for lower rates and state-directed capital are eroding the \"independent\" mandate of the Fed, BoE, and ECB.</li><li>  <strong>Tool exhaustion:</strong> Rate hikes are increasingly viewed as an insufficient tool for tackling supply-side shocks like energy prices.</li></ul><p><strong>The volatility map</strong></p><ul><li>  <strong>USA:</strong> The Fed is battling internal incoherence (dot plot failures) and external pressure from Donald Trump to slash rates to 1%.</li><li>  <strong>UK:</strong> The BoE is navigating a multiyear quantitative tightening (QT) exit while MPs question if its remit is \"fit for purpose.\"</li><li>  <strong>EU:</strong> The ECB faces a leadership reshuffle and a hawkish pivot to counter prolonged energy inflation.</li><li>  <strong>Japan:</strong> The BoJ is trapped between rising domestic rates and a sinking yen.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Geopolitical fragmentation:</strong> Saudi Arabia's exit from China's currency platform signals the fragility of efforts to displace the US dollar.</li><li>  <strong>Information noise:</strong> Social media echo chambers are distorting inflation expectations, making consumer data unreliable for policymakers.</li><li>  <strong>Systemic risk:</strong> Regulators are intensifying scrutiny of prime brokers following losses at AI-focused hedge funds.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Leadership churn:</strong> High-level departures at the ECB and the arrival of Kevin Warsh at the Fed will redefine monetary narratives.</li><li>  <strong>The \"State-Directed\" shift:</strong> A transition toward finance aligned with national security and great power rivalry may end the era of purely technocratic banking.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven infrastructure and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is shifting capital from traditional lending to high-growth AI data centers and wealth management to offset slowing trading revenues.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley is leading debt structures for AI data centers; banks are offloading $15bn in Anthropic debt to free up lending capacity.</li><li><strong>Cost pressure:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the time required for routine legal work.</li><li><strong>Revenue:</strong> Semiconductor investments in Asia are driving record equities growth for US firms.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under a Trump administration push.</li><li><strong>Controversy:</strong> The White House cited a \"culture of risk aversion\" among regulators following the SVB collapse.</li><li><strong>Crypto:</strong> A Trump family crypto venture recently secured a banking license, sparking political debate over conflicts of interest.</li></ul><p><strong>Strategic moves</strong></p><ul><li><strong>Expansion:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn to scale asset management.</li><li><strong>Technology:</strong> BNY is adopting blockchain for record-keeping to integrate traditional finance with digital assets.</li><li><strong>Politics:</strong> Bank of America pledged $250bn to US projects to align with the \"America First\" agenda.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$74bn:</strong> Wealth management assets generated by Morgan Stanley following high-profile IPOs like SpaceX.</li><li><strong>£22.5bn:</strong> The estimated extra capital burden UK banks carry compared to US rivals.</li><li><strong>$20bn:</strong> The valuation Polymarket is seeking despite being \"debanked\" by JPMorgan.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>24 Sep 2026 15:26 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
