const SUMMARIES = {"oil and gas": "<p>Global diesel supplies are hitting a critical breaking point.</p><p><strong>Why it matters:</strong> A convergence of Russian export bans, Middle East conflict, and U.S. policy threats is depleting strategic reserves. This creates a feedback loop of higher consumer prices and systemic inflation.</p><p><strong>The diesel crunch</strong></p><ul><li><strong>Supply shocks:</strong> Russia extended export bans following refinery strikes; Saudi Aramco warns global stockpiles are \"scarily thin.\"</li><li><strong>Political pressure:</strong> The Trump administration is pressuring the EU to release strategic reserves under threat of a U.S. diesel export ban.</li><li><strong>Market outlook:</strong> Dallas Fed surveys indicate industry executives do not expect prices to normalize for at least a year.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Inflation:</strong> The ECB warns high energy costs are fueling wider inflation, necessitating preemptive rate actions.</li><li><strong>Fiscal strain:</strong> Italy and Greece are seeking EU fiscal leeway to fund fuel price supports for citizens.</li><li><strong>Windfall gains:</strong> While consumers struggle, U.S. refiners have seen margins increase fourfold.</li></ul><p><strong>The legal and strategic pivot</strong></p><ul><li><strong>Climate litigation:</strong> ExxonMobil and Suncor are petitioning the U.S. Supreme Court to block state-led climate damage claims.</li><li><strong>Energy independence:</strong> European leaders are viewing U.S. trade threats as a catalyst to accelerate energy autonomy.</li><li><strong>Infrastructure hurdles:</strong> Kenya's court has paused Dangote’s $16bn refinery, delaying East Africa's push to reduce import reliance.</li></ul><p><strong>What's next:</strong> Watch for the U.S. Supreme Court ruling on climate liability and the EU's decision on strategic reserve releases.</p>", "corporate earnings and results": "<p>Corporate consolidation and AI integration are driving a volatile shift in global market valuations.</p><p><strong>Why it matters:</strong> Companies are aggressively pivoting toward software and AI to avoid obsolescence, but these transitions create new legal risks and valuation vulnerabilities.</p><p><strong>The Big Moves</strong></p><ul><li><strong>Schneider Electric:</strong> Acquiring PTC for $23.7bn to pivot toward manufacturing software.</li><li><strong>BT:</strong> Absorbing TalkTalk out of administration, incurring a £400m cash hit.</li><li><strong>Intesa:</strong> Moving closer to a €34.5bn takeover of Monte dei Paschi.</li><li><strong>Sainsbury’s:</strong> Walked away from multibillion-pound merger talks with Morrisons.</li></ul><p><strong>AI Friction</strong></p><ul><li><strong>Legal battles:</strong> Nvidia faces lawsuits from Groq engineers over a $20bn licensing deal.</li><li><strong>Security gaps:</strong> Experts warn AI \"agent hacks\" are training failures, not simple bugs.</li><li><strong>Regulatory push:</strong> Norway is proposing the first public ban on AI glasses.</li><li><strong>Fraud:</strong> Sony Music is escalating fights against AI-generated deepfake streaming.</li></ul><p><strong>Labor & Policy</strong></p><ul><li><strong>Talent war:</strong> Citi is shortening analyst programs to two years to stop poaching by private equity.</li><li><strong>Trade barriers:</strong> The UK is weighing tariffs on Chinese EVs.</li><li><strong>Capital rules:</strong> UK banks are lobbying for lower capital requirements to match global shifts.</li></ul><p><strong>Between the lines</strong> The \"acqui-hire\" model is becoming a legal minefield. As titans like Nvidia use licensing deals to absorb talent without full acquisitions, disgruntled employees are turning to the courts to claim their share of the value.</p>", "middle east war": "<p>The U.S. is rapidly escalating its military presence in the Middle East as tensions with Iran reach a breaking point.</p><p><strong>Why it matters:</strong> A cycle of alleged Iranian-backed terror plots in the UK and a hijacking attempt on a Flydubai flight have pushed the U.S. toward direct kinetic action.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Military buildup:</strong> The U.S. is deploying thousands of troops, including the USS Theodore Roosevelt aircraft carrier, to the region.</li><li><strong>UK security:</strong> British and U.S. officials link Iran to a terror plot near RAF Fairford, where B-1 bombers were based for strikes on Tehran.</li><li><strong>Aviation terror:</strong> A Flydubai flight to Tel Aviv was diverted to Saudi Arabia after a pilot was stabbed in a hijacking attempt; UAE and Israeli authorities are probing Iranian links.</li><li><strong>Yemeni offensive:</strong> Saudi Arabia has deployed 100 fighter jets to support forces attempting to retake Sana’a and the Bab el-Mandab Strait from Houthi rebels.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political timing:</strong> In Israel, Benjamin Netanyahu is facing accusations of using these security crises to bolster his standing ahead of upcoming elections.</li><li><strong>Strategic shifts:</strong> While military tensions rise, Gulf sovereign wealth funds continue pouring billions into Egypt, signaling a hedge between security instability and economic opportunity.</li></ul><p><strong>What's next</strong></p><ul><li><strong>U.S. Decision:</strong> President Trump is weighing targeted strikes on Iran as the carrier strike group arrives by late November.</li><li><strong>Israeli Elections:</strong> The Supreme Court's decision to allow Arab parties to run could create a hung parliament, complicating Israel's response to regional threats.</li></ul>", "shipping": "<p>Global shipping is undergoing a structural shift as geopolitical conflict and climate change force a redesign of trade routes.</p><p><strong>Why it matters:</strong> Traditional chokepoints like the Strait of Hormuz and the Panama Canal are becoming unreliable. This instability is driving a surge in alternative routes, asset prices, and a fragmented regulatory environment.</p><p><strong>The geopolitical pivot</strong></p><ul><li><strong>Arctic surge:</strong> Northern Sea Route transits have quadrupled as melting ice and Middle East instability make polar paths viable.</li><li><strong>Strategic competition:</strong> South Korea is investing in Arctic trade to bypass chokepoints; the U.S. is planning a nuclear-powered merchant fleet to counter China.</li><li><strong>Shadow fleets:</strong> Russia has expanded its flagged fleet by one-third to bypass Western sanctions on fossil fuels.</li></ul><p><strong>Market volatility</strong></p><ul><li><strong>Asset spikes:</strong> Old supertankers now command higher prices than new builds due to immediate availability.</li><li><strong>Record costs:</strong> Oil tanker rates hit $1.2 million per day on Middle East-China routes.</li><li><strong>Investment shift:</strong> Institutional investors are moving into shipping as a \"hard asset\" hedge against conflict.</li></ul><p><strong>Operational risks</strong></p><ul><li><strong>Cyber threats:</strong> Hackers are targeting satellite links connected to ship engines and navigation.</li><li><strong>Environmental stress:</strong> Droughts are forcing transit cuts at the Panama Canal.</li><li><strong>Safety gaps:</strong> Industry leaders warn that undeclared batteries in containers are increasing ship fire risks.</li></ul><p><strong>The green transition</strong></p><ul><li><strong>Fuel shifts:</strong> Biodiesel is now cheaper than conventional fuels, accelerating the move toward emissions targets.</li><li><strong>Tech trials:</strong> Maersk is deploying wind sails; ammonia and methanol are emerging as primary decarbonization tools.</li></ul><p><strong>What's next:</strong> Expect a permanent decline in global shipping rule cohesion as \"shadow fleets\" grow and nations prioritize secure, sovereign corridors over open international waters.</p>", "artificial intelligence": "<p>AI is transitioning from a speculative gold rush to a volatile phase of legal, financial, and geopolitical friction.</p><p><strong>Why it matters:</strong> Rapid deployment has outpaced regulatory frameworks and balance sheets, creating systemic risks in cybersecurity, intellectual property, and market concentration.</p><p><strong>The financial squeeze</strong></p><ul><li><strong>Capital strain:</strong> Amazon is attempting to offload $8B in Nvidia chips to stabilize its balance sheet as spending soars.</li><li><strong>Infrastructure gaps:</strong> SoftBank’s AI ambitions now exceed its own balance sheet, forcing a reliance on third-party infrastructure partners.</li><li><strong>Pricing instability:</strong> Token price deflation and unpredictable operational costs are forcing a total rethink of AI pricing models ahead of major IPOs.</li></ul><p><strong>Legal and political battlegrounds</strong></p><ul><li><strong>Identity theft:</strong> Italian PM Giorgia Meloni is seeking to trademark her voice to block AI deepfakes, setting a precedent for political figures.</li><li><strong>Academic conflict:</strong> A surge in lawsuits is emerging as students challenge university AI misconduct accusations.</li><li><strong>Security lapses:</strong> OpenAI faces potential lawsuits following the discovery of dozens of hacks involving its AI tools.</li></ul><p><strong>Geopolitical shifts</strong></p><ul><li><strong>Industrial warfare:</strong> Japan and South Korea are deploying \"smart shipyards\" to counter China's maritime dominance.</li><li><strong>Sovereign scale:</strong> Japan is investing $140B in data centers via Dell and Jera to secure regional AI capacity.</li></ul><p><strong>Between the lines</strong> The \"AI bubble\" isn't just about stock prices; it's about a physical-world bottleneck. While analysis productivity is skyrocketing, physical implementation—from data centers to scientific labs—cannot keep pace.</p>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy is driving a global realignment. This shift forces third-party nations to hedge between two superpowers that prioritize national security over economic integration.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in Washington and Beijing is viewed as transactional and short-sighted, increasing the risk of miscalculation.</li><li><strong>The BRICS pivot:</strong> The BRICS bloc is leveraging U.S. instability and tariffs to build a parallel economic system, now surpassing the G7 in global economic share.</li><li><strong>AI hegemony:</strong> U.S. dominance in AI hardware and data centers creates a power imbalance that China is attempting to counter through strategic retaliation.</li></ul><p><strong>The ripple effect</strong></p><ul><li><strong>Alliance erosion:</strong> U.S. unpredictability regarding defense guarantees is undermining trust in South Korea and Japan.</li><li><strong>Institutional flight:</strong> Potential U.S. funding cuts are prompting international organizations to consider relocating from Geneva to Gulf or European capitals.</li></ul><p><strong>What's next:</strong> Expect increased \"poaching\" of diplomatic influence as the Global South seeks alternatives to U.S.-led multilateralism.</p>", "us elections": "<p>The U.S. midterms have evolved into a high-stakes clash over economic instability, AI integration, and the legality of electoral maps.</p><p><strong>Why it matters:</strong> Voter volatility among Latino Americans and rural heartlands could flip Senate control, while Supreme Court rulings on gerrymandering and voter vetting are reshaping the electorate.</p><p><strong>The economic friction</strong></p><ul><li><strong>Housing & Rates:</strong> Mortgage rates exceeding 7% and private equity ownership of homes have turned affordability into a primary campaign liability.</li><li><strong>Energy Crisis:</strong> Fuel price spikes linked to the Iran conflict are forcing rural Republicans to pressure Trump for diesel export bans.</li></ul><p><strong>The AI divide</strong></p><ul><li><strong>Corporate Pivot:</strong> Google, Meta, and Microsoft formed the AI Infrastructure Coalition to mitigate backlash over energy and water usage.</li><li><strong>Base Backlash:</strong> Trump’s overt boosterism of Big Tech is alienating MAGA loyalists, creating a rift within the GOP base.</li></ul><p><strong>Legal and structural battles</strong></p><ul><li><strong>Gerrymandering:</strong> New Supreme Court rulings make it harder to challenge maps that critics say dilute Black voting power in states like Louisiana.</li><li><strong>Voter Vetting:</strong> The Court has allowed the administration to vet voters' immigration status, a move intended to overhaul election rules.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1 billion:</strong> The scale of the GOP ad blitz aimed at countering Trump's declining popularity.</li><li><strong>7%:</strong> The threshold breached by mortgage rates, intensifying the housing crunch.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate Control:</strong> The race is \"on a knife edge,\" with Georgia's Jon Ossoff emerging as a potential 2028 presidential contender.</li><li><strong>Post-Election Probe:</strong> Democrats are signaling a pivot toward investigating the \"Trump crime family\" and Elon Musk if they secure the House.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's eastern strongholds.</p><p><strong>Why it matters:</strong></p><ul><li>Merz's plummeting popularity and regional election losses weaken Germany's leverage in EU budget negotiations.</li><li>The AfD's surge creates a power vacuum that threatens the stability of the political center and emboldens foreign adversaries.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for the next federal elections.</li><li><strong>€2tn:</strong> The EU budget deal currently jeopardized by Merz's diminished authority.</li><li><strong>3 seats:</strong> The margin preventing the AfD from leading a regional government in Saxony-Anhalt.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Succession planning:</strong> Hendrik Wüst is positioning himself as the \"chancellor-in-waiting\" by engaging in high-level diplomacy with Turkey.</li><li><strong>Ideological shift:</strong> Younger voters are decoupling from postwar historical traumas, making them more susceptible to radicalism from both the far-right (AfD) and far-left (BSW).</li><li><strong>Geopolitical friction:</strong> Russia and the U.S. (under a potential Trump administration) view the AfD's rise as a strategic advantage to weaken Western cohesion.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Internal CDU struggle:</strong> Merz must decide whether to pivot his platform or face a leadership challenge from within his own party.</li><li><strong>Coalition chaos:</strong> The BSW party is emerging as a potential \"kingmaker,\" complicating the formation of regional governments.</li><li><strong>Security pivots:</strong> Berlin is accelerating clandestine arms procurement for Ukraine to offset domestic political instability.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control with mounting systemic risks from AI, climate change, and bond market volatility.</p><p><strong>Why it matters:</strong> High interest rates are creating a \"stranglehold\" on sovereign debt while traditional monetary tools fail to address supply-side shocks.</p><p><strong>The current friction</strong></p><ul><li><strong>The Fed:</strong> Officials signal a pause in October, but \"dot plot\" projections face criticism for lacking a coherent economic narrative.</li><li><strong>The ECB:</strong> Bond turbulence is forcing a debate over halting Quantitative Tightening (QT) to stabilize markets.</li><li><strong>Bank of England:</strong> Regulators warn that an AI-driven debt surge could trigger a sharp market correction.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>1995:</strong> The era from which the Bank of Japan's current rate hikes are drawing a comparison.</li><li><strong>40 years:</strong> The duration for which US Treasuries functioned as both securities and money—a status now under threat.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Tool exhaustion:</strong> There is growing consensus that rate hikes are \"not the only game in town\" and are ineffective against geopolitical or climate shocks.</li><li><strong>Security gaps:</strong> Watchdogs warn the US Federal Reserve remains vulnerable to foreign adversaries.</li><li><strong>Geopolitical shifts:</strong> Saudi Arabia's exit from China's cross-border currency platform signals continued, if uneven, dollar dominance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Personnel shifts:</strong> Isabel Schnabel’s early departure from the ECB to the IMF will trigger a leadership reshuffle.</li><li><strong>Remit reviews:</strong> UK MPs are questioning if the Bank of England's mandate is \"fit for purpose\" amid rising populist pressure.</li></ul>", "us banks": "<p>Wall Street is pivoting toward AI-driven asset management and deregulation while grappling with the fallout of the SVB collapse.</p><p><strong>Why it matters:</strong> Banks are shifting capital toward high-growth AI ventures and tokenized assets to offset slowing trading revenues and traditional lending constraints.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Revenue drivers:</strong> Goldman Sachs earned $200M+ in fees from AI-focused hedge fund Situational Awareness.</li><li><strong>Cost pressure:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced routine lawyer workloads.</li><li><strong>Financing limits:</strong> Banks are offloading $15B in debt for Anthropic data centers to free up lending capacity for other mega-AI deals.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB Postmortem:</strong> A White House review blamed a \"culture of risk aversion\" among regulators for mishandling the Silicon Valley Bank collapse.</li><li><strong>Policy debate:</strong> Critics are calling for the end of bank stress tests, arguing they mislead the public about systemic health.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Asset Expansion:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3B to scale its asset management arm.</li><li><strong>Digital Transition:</strong> BNY is adopting blockchain for record-keeping, accelerating the shift toward tokenized finance.</li><li><strong>Political Alignment:</strong> Bank of America pledged $250B to US projects to align with the \"America First\" agenda.</li></ul><p><strong>Between the lines:</strong> The industry is increasingly volatile. While AI creates massive fee opportunities, it also triggers collateral demands as AI stocks tumble and draws SEC scrutiny over fund stability.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>05 Oct 2026 19:28 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
