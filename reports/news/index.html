const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing under the simultaneous pressure of geopolitical conflict and AI-driven power demand.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Supply shocks:</strong> Ukrainian drone strikes on Russian refineries are triggering global diesel shortages and forcing Russia to ban exports.</li><li>  <strong>Infrastructure gaps:</strong> The AI boom is outpacing the electrical grid, creating critical bottlenecks in transformer supply chains and data center power.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$2.6B:</strong> The price Carlyle is fetching for its data center power unit, reflecting a fivefold return.</li><li>  <strong>€5B+:</strong> The target size of the new EU \"scale-up\" fund for energy transition technologies.</li><li>  <strong>$1B:</strong> Adnoc's investment to acquire Shell's South African fuels business.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The AI Paradox:</strong> Tech giants are racing to build AI hubs while facing scrutiny over the environmental fallout and energy consumption of these centers.</li><li>  <strong>Strategic Pivot:</strong> The IEA is urging the EU to accelerate electrification to avoid energy dependence, while simultaneously suggesting a reconsideration of Arctic oil and gas exploration.</li><li>  <strong>Fusion Fever:</strong> High-profile bets from Bezos and Google on fusion startups signal a shift toward \"moonshot\" energy solutions to power the AI era.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>US Shale Evolution:</strong> Industry focus is shifting toward deep reservoirs as the next frontier for domestic production.</li><li>  <strong>Regulatory Friction:</strong> The CFTC is blocking 24/7 oil contracts, signaling tighter oversight of energy derivatives.</li><li>  <strong>Asset Repurposing:</strong> US states like Pennsylvania and Oklahoma will scale efforts to convert abandoned oil wells into new economic opportunities.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are facing a volatile mix of geopolitical risk and AI valuation fatigue.</p><p><strong>Why it matters:</strong> Market instability in the Middle East threatens global supply chains, while the \"AI premium\" is decoupling from actual financial performance.</p><p><strong>The AI disconnect</strong></p><ul><li><strong>Valuation fade:</strong> FT analysis shows companies rebranding as AI-centric fail to sustain long-term share price gains.</li><li><strong>Hardware hesitation:</strong> Despite SK Hynix's strong Nasdaq debut, investors remain skeptical of the memory chip boom-bust cycle.</li><li><strong>Legal friction:</strong> The Apple-OpenAI lawsuit signals a breakdown in the strategic partnerships that fueled early AI growth.</li></ul><p><strong>Macro headwinds</strong></p><ul><li><strong>Geopolitical shocks:</strong> Iranian strikes and the closure of the Strait of Hormuz increase shipping risks and energy costs.</li><li><strong>Regulatory pressure:</strong> The EU is preparing fines for Big Tech over consumer protection failures.</li><li><strong>Political risk:</strong> Trump's push for lower prices signals a potential shift toward populist pricing mandates for US firms.</li></ul><p><strong>Sector shifts</strong></p><ul><li><strong>Hospitality:</strong> Airbnb is capturing World Cup demand, directly eroding traditional US hotel bookings.</li><li><strong>Private Equity:</strong> Capital is concentrating in a few \"winner-take-all\" firms, increasing the prevalence of \"zombie companies.\"</li><li><strong>Pharma:</strong> AstraZeneca is pivoting toward high-risk research in China and the US to offset growth plateaus.</li></ul>", "middle east war": "<p>The U.S. and Iran have entered a volatile cycle of tit-for-tat strikes and failed diplomacy.</p><p><strong>Why it matters:</strong> Escalation in the Strait of Hormuz threatens global energy stability and disrupts international shipping. Unpredictable U.S. policy is creating a power vacuum that Iran is leveraging to project regional influence.</p><p><strong>The current flashpoints</strong></p><ul><li><strong>Military strikes:</strong> The U.S. targeted Iranian railway bridges; Iran responded with attacks on tankers near the Oman coast.</li><li><strong>Diplomatic collapse:</strong> President Trump has signaled that ceasefire negotiations are likely \"over\" following recent bombings.</li><li><strong>Leadership transition:</strong> Following the burial of the Supreme Leader, Mojtaba Khamenei assumes a leadership role amid internal and external instability.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>77%:</strong> The increase in jet fuel costs driven by the Iran conflict, impacting U.S. corporate profits.</li><li><strong>Zero:</strong> The number of \"grand plans\" currently guiding U.S. strategy toward Tehran.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic contradictions:</strong> The U.S. is simultaneously striking Iranian infrastructure and relaxing high-tech export controls for the UAE to maintain Gulf alliances.</li><li><strong>The \"Bluff\" dynamic:</strong> Tehran perceives U.S. moves as confused, leading Iran to resist ceding control of the Strait of Hormuz.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Economic pressure:</strong> The U.S. has revoked waivers allowing Iranian oil sales to punish tanker attacks.</li><li><strong>Regional stability:</strong> U.S. teams in Beirut are attempting to stabilize the Israel-Hezbollah ceasefire to prevent a second front.</li></ul>", "shipping": "<p>Global shipping is facing a volatile convergence of geopolitical conflict, regulatory shifts, and trade wars.</p><p><strong>Why it matters:</strong> Instability in key chokepoints and new tariff threats are driving freight costs higher while forcing a fragmented approach to fleet decarbonization.</p><p><strong>The Geopolitical Friction</strong></p><ul><li><strong>Strait of Hormuz:</strong> A fragile ceasefire has quadrupled transits and slashed insurance premiums, but naval mines and projectile attacks keep traffic at 50% of pre-war levels.</li><li><strong>Black Sea:</strong> Ukraine is intensifying strikes on Russian fuel tankers, arguing that \"shadow fleet\" vessels are legal targets.</li><li><strong>Suez Canal:</strong> Maersk is resuming Suez transits, a move that lowers delivery times but threatens to depress freight rates.</li></ul><p><strong>The Economic Drivers</strong></p><ul><li><strong>Trump Tariffs:</strong> Shipping rates have surged to their highest levels since the 2024 Red Sea crisis as U.S. companies rush to stockpile goods.</li><li><strong>Russian Oil:</strong> Greek shipping firms earned nearly $4bn over three years by transporting Russian fuel under G7 price cap loopholes.</li><li><strong>Strategic M&A:</strong> CMA CGM is spending $1.4bn to acquire FedEx's logistics unit to expand its U.S. supply chain footprint.</li></ul><p><strong>The Green Divide</strong></p><ul><li><strong>Fuel Fracture:</strong> The industry is splitting into camps as shipowners abandon unified green goals for a mix of nuclear power and \"dirty\" fossil fuels.</li><li><strong>EU Regulation:</strong> Brussels is closing loopholes on carbon fees, increasing costs for shipowners and risking trade partner tensions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$125bn:</strong> Value of goods stranded during the Hormuz blockade.</li><li><strong>1,200:</strong> Number of cargo ships caught in the Hormuz closure.</li><li><strong>7%:</strong> Drop in Maersk shares following the Suez Canal reopening.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a period of hype to a high-stakes test of profitability and geopolitical control.</p><p><strong>Why it matters:</strong> Massive capital expenditures are colliding with skepticism over long-term returns, forcing a shift toward practical utility and aggressive global expansion.</p><p><strong>The financial friction</strong></p><ul><li><strong>Debt markets:</strong> Investors are selling longer-dated AI debt, signaling doubt about the sector's long-term margins.</li><li><strong>Capex surge:</strong> Microsoft's early lead is now a \"test of faith\" as spending continues to climb without guaranteed payoffs.</li><li><strong>Market edge:</strong> AI \"superforecasters\" currently fail to outperform humans in predicting Federal Reserve decisions.</li></ul><p><strong>Geopolitical maneuvers</strong></p><ul><li><strong>China loophole:</strong> OpenAI and Google are providing AI services to Singapore-based subsidiaries of blacklisted Chinese firms like Alibaba and Tencent.</li><li><strong>Regulatory reversals:</strong> Beijing ordered the reversal of Meta's $2bn Manus acquisition, paving the way for Tencent to take a lead stake.</li></ul><p><strong>Societal risks</strong></p><ul><li><strong>Privacy:</strong> Meta's \"super sensing\" glasses are triggering new battles over unauthorized recording.</li><li><strong>Influence:</strong> Biased LLMs and deepfakes are moving beyond disinformation toward active emotional manipulation of public opinion.</li><li><strong>Ethics:</strong> AI partnerships with museums are raising concerns over data trust and intellectual property.</li></ul><p><strong>What's next:</strong> Regulators will attempt to use AI to reduce \"financial sludge\" and red tape, while the industry pivots toward AI agents and hardware integration to justify current valuations.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition that is destabilizing global trade and security.</p><p><strong>Why it matters:</strong> Escalating military posturing and trade volatility are forcing third-party nations to choose sides or adopt non-alignment to mitigate risk.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China recently fired a submarine-launched ballistic missile into a Pacific nuclear-free zone, triggering condemnation from U.S. allies Japan, Australia, and New Zealand.</li><li>  <strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, recently detaining Japanese nationals for rare earth smuggling.</li><li>  <strong>Economic instability:</strong> The IMF warns that \"tit-for-tat\" trade warfare between the superpowers is self-defeating and threatens the global economy.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The \"Stability\" Play:</strong> While the U.S. faces internal political volatility, Xi Jinping is positioning China as a \"pillar of stability\" to attract foreign officials.</li><li>  <strong>Hegemony in decline:</strong> The U.S. is struggling to maintain its post-WWII world order as allies in Europe and Asia question the reliability of American security guarantees.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance shifting:</strong> Middle powers will increasingly forge independent alliances to avoid being collateral damage in the U.S.-China rivalry.</li><li>  <strong>Waterway volatility:</strong> Competition will intensify over \"narrow seas\" and strategic maritime chokepoints to secure supply chains.</li></ul>", "us elections": "<p>The Democratic Party is facing internal fractures and candidate scandals as it prepares for high-stakes midterm elections.</p><p><strong>Why it matters:</strong> Progressive insurgencies and misconduct allegations are destabilizing Democratic strategies, while President Trump faces declining support over inflation and foreign policy.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive surge:</strong> Democratic socialists won key primaries in Colorado and New York, signaling a shift away from party establishment leadership.</li><li><strong>Candidate turmoil:</strong> Graham Platner quit his Maine Senate bid following rape allegations, leaving the party scrambling to replace him on the ballot.</li><li><strong>Corporate influence:</strong> Pro-regulation Democrat Alex Bores lost his House race after targeted spending by Silicon Valley billionaires.</li></ul><p><strong>Trump's vulnerabilities</strong></p><ul><li><strong>Foreign policy:</strong> A Senate war powers resolution and FT polling show voters view the Iran conflict as too costly.</li><li><strong>Economic pressure:</strong> High grocery prices and inflation are eroding Trump's approval ratings.</li><li><strong>Base erosion:</strong> Evangelicals are questioning the alignment of Trump's rhetoric with Christian values.</li></ul><p><strong>Key battlegrounds</strong></p><ul><li><strong>Texas:</strong> Democrats see an opening in the Senate race, betting that Trump-backed candidates have limited appeal outside the MAGA base.</li><li><strong>Maine:</strong> Tariff-driven price hikes in the lobster industry are pushing rural voters away from the president.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li></ul><p><strong>What's next:</strong> The DoJ probe into Gavin Newsom could reshape the 2028 presidential landscape, while the GOP must determine if divisive candidates in swing states will lead to a \"Pyrrhic victory.\"</p>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to address security gaps and stagnant growth, risking internal political instability and friction with EU allies.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Germany will borrow €800bn for rearmament, the largest shift since reunification.</li><li><strong>Procurement:</strong> Berlin is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> France fears Germany is \"going it alone\" after Berlin ditched a joint fighter jet project to seek a leadership role.</li><li><strong>Failures:</strong> Cost overruns led to the cancellation of the F126 frigate, the largest warship since WWII.</li></ul><p><strong>Economic restructuring</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts and is pushing for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Labor:</strong> The coalition agreed to tighter sick-leave rules and expanded Sunday opening hours.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political volatility</strong></p><ul><li><strong>The Far-Right:</strong> The AfD currently leads opinion polls, fueled by anger over fuel prices and ties to Kremlin associates.</li><li><strong>Internal Rivalry:</strong> Merz faces a \"chancellor swap\" threat from younger conservative Hendrik Wüst as polls slide.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's decision on the Strait of Hormuz mission and the outcome of the KNDS IPO.</p>", "central banks": "<p>Central banks are shifting toward structural reform and divergent monetary paths to combat persistent inflation and AI-driven volatility.</p><p><strong>Why it matters:</strong> Divergent policies across G7 nations increase fragmentation risks, while new leadership at the Fed is prioritizing institutional overhaul over clear rate guidance.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is aggressively restructuring the U.S. central bank:</p><ul><li><strong>Reform:</strong> Established five task forces led by business and academic leaders to modernize operations.</li><li><strong>Communication:</strong> Moving away from traditional \"forward guidance\" to reduce market predictability, though this is increasing short-term rate volatility.</li><li><strong>Independence:</strong> Vowed to maintain price stability despite political pressure from the White House.</li></ul><p><strong>Global divergence</strong> Central banks are no longer moving in lockstep:</p><ul><li><strong>New Zealand:</strong> Raised rates for the first time in three years to fight stubborn inflation.</li><li><strong>Japan:</strong> Pushing domestic pension funds to shift assets from foreign to domestic markets to support the yen.</li><li><strong>Eurozone:</strong> ECB President Lagarde signaled a less aggressive approach to inflation than in 2022-23.</li></ul><p><strong>New systemic risks</strong> Regulators are pivoting toward technology and leverage:</p><ul><li><strong>AI Volatility:</strong> The Bank of England is considering \"kill switches\" for AI-powered trading to prevent market herding.</li><li><strong>Leverage:</strong> The BoE is limiting hedge fund leverage to stabilize the gilt market.</li><li><strong>Private Shift:</strong> Sovereign wealth funds are exiting public markets for private credit and infrastructure to capture AI growth.</li></ul><p><strong>What's next:</strong> Markets will watch for the \"Warsh effect\"—whether his preference for fundamental data over explicit guidance leads to higher volatility or more resilient growth.</p>", "us banks": "<p>US banks are aggressively leveraging deregulation to expand balance sheets and international footprints.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing giants like JPMorgan to pursue massive acquisitions and digital expansion into Europe.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital gain for top US and UK banks due to regulatory loosening.</li><li><strong>$700 billion:</strong> Potential losses US banks would face in a severe economic crash, per Fed stress tests.</li><li><strong>$114 billion:</strong> Revenue for non-bank trading firms (e.g., Citadel, Jane Street) as they erode traditional Wall Street market share.</li><li><strong>$20 billion:</strong> The amount JPMorgan may spend on a new acquisition.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal Volatility:</strong> Leadership instability is surfacing at the top. JPMorgan's succession race remains chaotic, and Goldman Sachs is seeing departures of executives who challenged leadership.</li><li><strong>Strategic Shifts:</strong> Boutique firms are struggling with high overhead after hiring \"star\" bankers for a deal upswing that hasn't arrived.</li><li><strong>Compliance Friction:</strong> The rise of prediction markets (Kalshi, Polymarket) is forcing banks to tighten employee betting policies to avoid regulatory scrutiny.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Basel III Battle:</strong> Wall Street is lobbying for further easing of Basel capital rules to maximize investor payouts.</li><li><strong>Digital Push:</strong> Expect JPMorgan to accelerate its retail entry into France, Spain, and Italy.</li><li><strong>Risk Transfer:</strong> Banks will likely seek to offload private equity-linked loans as PE firms struggle with a prolonged slowdown.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>12 Jul 2026 11:37 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
