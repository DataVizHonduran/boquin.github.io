*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;line-height:1.6;color:#475569;background:#f6f7f9;min-height:100vh}

/* ── navbar ── */

/* ── controls ── */

.slider-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0 1rem}
.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}

.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner{max-width:1200px;margin:0 auto 1.5rem;padding:0 2rem}
.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;

.summary-banner-inner strong{color:#0f172a}
.summary-banner-inner p{margin:.4rem 0}
.summary-banner-inner ul{margin:.5rem 0 0 1.2rem;padding:0}
.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8ecf2;
  display:flex;flex-direction:column;gap:.6rem;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;
  white-space:nowrap;flex-shrink:0}
.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}
.card-title{font-size:.97rem;font-weight:700;color:#0f172a;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}

.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

/* ── footer ── */
.footer{text-align:center;padding:2rem;font-size:.8rem;color:#94a3b8;border-top:1px solid #e4e8ef}

@media(max-width:600px){
  .hero h1{font-size:1.8rem}
  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}
  .controls{padding:1rem 1rem 0}

const SUMMARIES = {"oil and gas": "<p>AI is poised to increase oil and gas production more than it boosts green energy output.</p><p><strong>Why it matters:</strong> AI-driven efficiency gains in extraction and exploration are outpacing renewable energy's tech adoption. This creates a paradox where the technology driving the energy transition may actually prolong fossil fuel dominance.</p><p><strong>The refining crunch</strong> Fuel prices remain high despite falling crude costs due to lost capacity in Russia and the Gulf.</p><ul><li><strong>The result:</strong> U.S. refiners are seeing record margins.</li><li><strong>The risk:</strong> High diesel and petrol costs create political volatility for the U.S. administration.</li></ul><p><strong>Geopolitical shifts</strong> Energy security is driving aggressive state-level maneuvers.</p><ul><li><strong>UAE:</strong> Adnoc is pursuing an assertive, expansive global strategy after the UAE left OPEC.</li><li><strong>Iran:</strong> U.S. naval interdictions at Kharg Island are stalling crude exports.</li><li><strong>U.S./Australia:</strong> A $400M loan to Sunrise Energy aims to decouple rare earth supplies from China.</li></ul><p><strong>The \"Data Center\" dilemma</strong> The AI boom is straining power grids and distorting investment.</p><ul><li><strong>Gas risk:</strong> Over-investing in natural gas to power data centers may spike electricity bills for residential utility customers.</li><li><strong>Copper surge:</strong> Chile's Codelco is struggling with debt and production slumps despite exploding demand for data center infrastructure.</li></ul><p><strong>What's next</strong> Watch for a leadership transition at ConocoPhillips as CEO Ryan Lance steps down, and monitor the EU's response to Exxon's challenges against carbon storage rules.</p>", "corporate earnings and results": "<p>Nvidia is partnering with Wall Street giants to create a $500 billion funding vehicle for AI infrastructure.</p><p><strong>Why it matters:</strong> The massive capital requirements for data centers have outpaced traditional corporate spending, forcing a shift toward specialized infrastructure financing.</p><p><strong>The players</strong></p><ul><li><strong>The Lead:</strong> Nvidia is coordinating the package to ensure continued demand for its chips.</li><li><strong>The Capital:</strong> Apollo, Blackstone, and Goldman Sachs are among the firms structuring the deal.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure bottleneck:</strong> AI growth is no longer limited by software, but by the physical capacity of power grids and data centers.</li><li><strong>Financialization of AI:</strong> Nvidia is effectively moving from a hardware vendor to a financial orchestrator for the AI ecosystem.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Capital deployment:</strong> The fund will likely target the construction of massive GPU clusters and energy infrastructure.</li><li><strong>Market impact:</strong> Success here could create a blueprint for how other \"hyper-growth\" technologies bypass traditional balance sheet constraints.</li></ul>", "middle east war": "<p>The Middle East is shifting toward a fragmented security landscape as Iran leverages strategic chokepoints to force U.S. concessions.</p><p><strong>Why it matters:</strong> Regional instability is driving global economic volatility, specifically through energy costs and shipping disruptions in the Strait of Hormuz.</p><p><strong>The geopolitical map</strong></p><ul><li><strong>Iran:</strong> Tightening internal control via loyalist appointments while using Oman as a mediator to maintain leverage over the Hormuz shipping route.</li><li><strong>Israel:</strong> Rejecting U.S. disarmament plans for Gaza and escalating strikes in Lebanon, signaling a preference for military dominance over diplomatic exits.</li><li><strong>Turkey:</strong> Pursuing a dual track of internal stability via a Kurdish peace law and external security through a new defense pact with Saudi Arabia and Pakistan.</li><li><strong>UAE:</strong> Expanding influence through aggressive investment in Africa and strategic alignment with Washington.</li></ul><p><strong>Economic ripple effects</strong></p><ul><li><strong>Energy:</strong> High fuel costs are squeezing airlines like Wizz Air and driving U.S. consumers toward Asian hybrid vehicles.</li><li><strong>Trade:</strong> Saudi-Israeli tensions are stalling India’s IMEC corridor, preserving China’s Belt and Road advantage.</li><li><strong>Markets:</strong> U.S. stocks are reacting sharply to the volatility of Hormuz negotiations.</li></ul><p><strong>What's next:</strong> The Trump administration faces a critical choice between escalating a costly conflict or accepting a deal on Tehran's terms to stabilize global oil markets.</p>", "shipping": "<p>Global shipping is facing a systemic crisis as geopolitical conflict and climate change dismantle traditional trade routes.</p><p><strong>Why it matters:</strong> The convergence of Iranian aggression in the Strait of Hormuz and Houthi attacks in the Red Sea is forcing a costly redesign of global energy and goods logistics.</p><p><strong>The choke point crisis</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iranian missile attacks and \"toll\" demands have forced tankers to divert, depleting global oil stockpiles and driving prices toward $100/barrel.</li><li><strong>Red Sea:</strong> Houthi drone and missile strikes on Saudi tankers are delaying Asian crude deliveries by up to a month.</li><li><strong>Black Sea:</strong> Russian strikes on Ukrainian ports have surged wheat prices and disrupted grain exports.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>The Arctic:</strong> China is launching the \"Ice Silk Road\" to bypass traditional chokepoints and reduce Europe-Asia voyage times.</li><li><strong>Infrastructure:</strong> Dubai is building a new east-coast port to eliminate reliance on the Strait of Hormuz.</li><li><strong>Shadow Fleets:</strong> Russia is expanding its \"shadow\" LNG fleet to evade EU sanctions and maintain energy exports.</li></ul><p><strong>Environmental and political shocks</strong></p><ul><li><strong>Climate:</strong> Record-low water levels on the Rhine are forcing German production cuts.</li><li><strong>Trade War:</strong> French shipping firms report a demand spike as customers stockpile goods to beat anticipated Trump tariffs.</li><li><strong>Diplomacy:</strong> Panama is negotiating with Beijing to stop the detention of Panamanian-flagged vessels.</li></ul><p><strong>What's next:</strong> Expect a permanent shift toward \"de-risking\" routes, increasing the cost of maritime insurance and lengthening global supply chains.</p>", "artificial intelligence": "<p>AI is shifting from a theoretical frontier to a volatile operational reality across global industries.</p><p><strong>Why it matters:</strong> Rapid deployment is outpacing safety frameworks and labor protections, creating systemic risks in security and employment.</p><p><strong>The corporate landscape</strong></p><ul><li><strong>Consolidation:</strong> Google is restructuring DeepMind to prioritize product urgency over scientific research.</li><li><strong>Open vs. Closed:</strong> Meta is aggressively pushing open-source models to undermine the market dominance of OpenAI and Anthropic.</li><li><strong>Expansion:</strong> ByteDance and Alibaba are scaling massive models to maintain competitiveness in the Asian market.</li></ul><p><strong>Critical risks</strong></p><ul><li><strong>Biosecurity:</strong> Genomic language models have successfully created the first synthetic viruses.</li><li><strong>Labor:</strong> Experts warn of a \"bifurcated\" labor market that could create a permanent economic underclass.</li><li><strong>Governance:</strong> Law enforcement is already facing internal crises over the misuse of AI tools in official investigations.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Hardware shift:</strong> OpenAI is pivoting toward dedicated AI devices to reduce reliance on third-party platforms.</li><li><strong>Interface evolution:</strong> Google and OpenAI are prioritizing voice-first systems to enable a new generation of autonomous AI agents.</li><li><strong>Capital flight:</strong> Europe is under pressure to build \"money-mobilisation machines\" to prevent its AI talent from migrating to the U.S. or China.</li></ul>", "us-china relations": "<p>US-China relations are shifting toward a volatile mix of strategic aggression and unexpected political openness.</p><p><strong>Why it matters:</strong> The tension between military escalation and transactional diplomacy creates a precarious global stability. Miscalculations in the Pacific could trigger a broader systemic collapse.</p><p><strong>The friction points</strong></p><ul><li><strong>Military escalation:</strong> China recently fired a ballistic missile into a Pacific nuclear-free zone, alarming Japan, Australia, and New Zealand.</li><li><strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, detaining Japanese nationals for rare earth smuggling.</li><li><strong>Economic risk:</strong> The IMF warns that \"tit-for-tat\" trade warfare is self-defeating and threatens the global economy.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political divergence:</strong> A gap is widening between \"hawks\" in Congress and a growing openness toward cooperation among Gen Z voters and Donald Trump.</li><li><strong>Trust deficit:</strong> Global suspicion of U.S. hegemony is rising, leading some nations to trust China's stability over American volatility.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bloc formation:</strong> Overlapping conflicts in Europe and Asia are pushing the world toward two rival, formalized blocs.</li><li><strong>Non-alignment:</strong> A revival of non-alignment doctrines may allow third-party nations to hedge between Washington and Beijing.</li></ul>", "us elections": "<p>US midterm elections are becoming a battleground between populist surges and establishment control.</p><p><strong>Why it matters:</strong> Internal party fractures and massive spending shifts are redefining candidate viability in swing states.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive momentum:</strong> Abdul El-Sayed’s Michigan victory signals a rebuke of party leadership and a shift toward radical platforms.</li><li><strong>Centrist pushback:</strong> Virginia Governor Abigail Spanberger is publicly dismissing claims of a \"civil war\" to maintain party unity.</li><li><strong>Maine crisis:</strong> The party is scrambling to replace candidate Graham Platner following sexual assault allegations.</li></ul><p><strong>The Trump strategy</strong></p><ul><li><strong>Financial dominance:</strong> The Maga Inc. Super PAC has amassed a $400 million war chest.</li><li><strong>Voter outreach:</strong> Trump is pivoting toward blue-collar industrial heartland voters as overall support flags.</li><li><strong>Risk factors:</strong> Polls show voter dissatisfaction with the cost of conflict in Iran and \"hyper-populist\" economic pressures.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Lobbying limits:</strong> Massive spending is no longer a guarantee of success; crypto bills are stalling and pro-Israel lobby spending is becoming a primary liability.</li><li><strong>Future grooming:</strong> Billionaire backing of Glenn Youngkin suggests a strategic pivot toward 2028 presidential ambitions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Midwest tests:</strong> Wisconsin gubernatorial primaries will determine if socialist pitches can win in \"Trump country.\"</li><li><strong>Senate volatility:</strong> The outcome in Maine and Michigan will decide if Democrats can seize Congress during Trump's second term.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is attempting a high-stakes economic and military pivot to stabilize a fracturing Germany.</p><p><strong>Why it matters:</strong> Merz is leveraging massive debt and tax cuts to stave off economic stagnation while simultaneously rebuilding the Bundeswehr to fill a security vacuum left by waning U.S. support.</p><p><strong>The economic gamble</strong></p><ul><li><strong>Stimulus:</strong> Merz unveiled €10bn in tax cuts and a proposal for a Swedish-style public pension fund to boost capital market investment.</li><li><strong>Investment:</strong> Berlin aims to attract €3.75tn in private capital by 2040, though the rise of the far-right AfD threatens investor confidence.</li><li><strong>Efficiency:</strong> The Finance Ministry will now punish government agencies that fail to spend allocated infrastructure funds quickly.</li></ul><p><strong>The military shift</strong></p><ul><li><strong>Spending:</strong> Germany will borrow €800bn for rearmament, the largest debt-fueled spending spree since reunification.</li><li><strong>Strategic pivots:</strong> Berlin is ditching French partnerships for fighter jets and scrapping the F126 frigate program due to cost overruns.</li><li><strong>Tactics:</strong> The Bundeswehr is integrating battlefield lessons from Ukraine to modernize land forces.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Internal strife:</strong> Merz faces dissent within his own party following a cabinet shake-up and the resignation of parliamentary leader Jens Spahn.</li><li><strong>The AfD threat:</strong> The far-right party leads polls and maintains ties with the Kremlin, fueling fears of a shift toward Russia and away from EU norms.</li><li><strong>Security risks:</strong> Intelligence warns of rising left-wing terrorism and foreign interference (Russia's \"Matryoshka\" campaign) targeting state votes.</li></ul><p><strong>What's next:</strong> Watch for whether Merz's \"bedrock of stability\" pitch convinces global investors or if internal party challenges from figures like Hendrik Wüst trigger a leadership crisis.</p>", "central banks": "<p>Central banks are struggling to maintain market stability amid a shift toward \"currency activism\" and opaque communication.</p><p><strong>Why it matters:</strong> Lack of coordination between the Fed, ECB, and BoJ erodes policy credibility and increases volatility in the Treasury and FX markets.</p><p><strong>The Yen Crisis</strong></p><ul><li><strong>Intervention:</strong> The US Treasury and New York Fed sold euros to prop up the yen, marking a historic shift toward US \"currency activism.\"</li><li><strong>The fallout:</strong> Gains faded quickly due to a lack of a \"unified voice\" among central banks.</li><li><strong>The risk:</strong> Critics argue these monetary experiments create long-term instability and signal a decline in the dollar's reserve status.</li></ul><p><strong>Fed Friction</strong></p><ul><li><strong>Communication:</strong> Chair Kevin Warsh is facing investor backlash for a \"less is more\" messaging strategy.</li><li><strong>Market reaction:</strong> Traders warn that opaque guidance erodes the Fed's influence over the Treasury market.</li><li><strong>Internal rift:</strong> Some officials, including Alberto Musalem, suggest bond sell-offs are a direct warning on the Fed's credibility.</li></ul><p><strong>Global Divergence</strong></p><ul><li><strong>Bank of England:</strong> Holding rates at 3.75% amid geopolitical tension (Iran war) while debating the end of active quantitative tightening (QT).</li><li><strong>Indonesia:</strong> Appointed veteran technocrat Destry Damayanti to stabilize markets following a sudden leadership vacancy.</li><li><strong>Japan:</strong> Research indicates the neutral rate has risen, necessitating a potential shift in long-term monetary policy.</li></ul><p><strong>What's next:</strong> Watch for further joint US-Japan interventions to counter \"disorderly\" currency movements and whether Warsh pivots his communication style to appease bond vigilantes.</p>", "us banks": "<p>US banks are leveraging an AI-driven deal surge to drive record profits and asset growth.</p><p><strong>Why it matters:</strong> The convergence of AI infrastructure financing and a revival in IPOs is shifting bank revenue models toward high-growth tech ecosystems.</p><p><strong>The AI catalyst</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley is leading the architecture for data center debt; banks are offloading $15bn in Anthropic debt to maintain lending capacity.</li><li><strong>Revenue:</strong> AI-driven semiconductor investments are fueling record equity runs and regional revenue growth in Asia.</li><li><strong>Wealth Management:</strong> AI-linked IPOs (e.g., SpaceX) are driving massive asset inflows, with Morgan Stanley reporting a $74bn Q2 haul.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Digital Infrastructure:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with tokenized assets.</li><li><strong>Talent War:</strong> JPMorgan is aggressively poaching specialists to build \"activism defense\" practices.</li><li><strong>Restructuring:</strong> Citigroup continues a \"ruthless\" overhaul under Jane Fraser to close the profitability gap with larger peers.</li></ul><p><strong>Key risks</strong></p><ul><li><strong>Market Volatility:</strong> Tumbling AI stocks are forcing hedge funds to increase collateral, signaling rising risk aversion.</li><li><strong>Regulatory Friction:</strong> Debates are intensifying over the efficacy of stress tests and the capital advantage US banks hold over UK rivals.</li><li><strong>Political Pressure:</strong> JPMorgan faces scrutiny over historical ties and potential UK tax raids on banking bonuses.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>11 Aug 2026 11:13 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
