const SUMMARIES = {"oil and gas": "<p>BP is facing a leadership crisis following the removal of chair Albert Manifold over allegations of boardroom bullying.</p><p><strong>Why it matters:</strong> Chronic instability at the top—two CEOs and two chairs in three years—threatens BP's strategic execution during a volatile energy transition.</p><p><strong>The geopolitical squeeze</strong></p><ul><li><strong>Supply shocks:</strong> US producers are ramping up output to offset price surges caused by the Iran war.</li><li><strong>Energy dependence:</strong> Iraq faces summer blackouts due to its reliance on Iranian gas.</li><li><strong>Resource wars:</strong> US-backed rare earth firms are locked in legal battles over tech theft to break China's monopoly.</li></ul><p><strong>The power pivot</strong></p><ul><li><strong>AI demand:</strong> DigitalBridge's $1bn acquisition of ArcLight signals a Wall Street rush to secure power for data centers.</li><li><strong>Grid fragility:</strong> Texas is upgrading utility poles to survive extreme storms; the UK is curbing electricity trading to protect strained grids.</li><li><strong>Carbon bets:</strong> Exxon is investing billions in carbon capture, though local backlash on the US Gulf Coast creates headwinds.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>13%:</strong> The increase in UK household energy bills starting July.</li><li><strong>£4.5bn:</strong> Record debt owed by British customers to power suppliers.</li><li><strong>40%:</strong> The jump in costs resulting from the global supply crunch linked to the Iran war.</li></ul><p><strong>Between the lines</strong> The \"energy shock\" is evolving from a simple fuel shortage into a systemic struggle over infrastructure, AI power needs, and supply chain independence from non-Western rivals.</p>", "corporate earnings and results": "<p>AI demand is driving a massive capital reallocation across the global economy.</p><p><strong>Why it matters:</strong> Big Tech's data center spending is triggering a \"supercycle\" in semiconductors and optical tech, forcing traditional professional services—like law firms—to invest hundreds of millions in proprietary AI to remain competitive.</p><p><strong>By the numbers</strong></p><ul><li><strong>75%:</strong> Gains in the Philadelphia Semiconductor Index for 2026.</li><li><strong>$500 million:</strong> Kirkland & Ellis's planned investment in its own AI platform.</li><li><strong>€200 million:</strong> EU fine against Temu for Digital Services Act violations.</li><li><strong>$17.6 billion:</strong> Value of Tilman Fertitta's all-cash bid for Caesars Entertainment.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Sovereignty vs. Capital:</strong> The UK's potential block of an Indian billionaire's BT stake signals a shift toward prioritizing national security over foreign investment.</li><li><strong>Geopolitical Friction:</strong> Airwallex moving staff out of China highlights the increasing difficulty of operating cross-border payments amid US-China tensions.</li><li><strong>Corporate Migration:</strong> Exxon's move to Texas reflects a broader trend of US corporations fleeing \"blue state\" regulatory environments.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Crackdown:</strong> Increased scrutiny of \"forever chemicals\" (3M) and audit failures (BDO) suggests a tightening legal environment for industrial and financial firms.</li><li><strong>IPO Watch:</strong> The market will monitor the European tank maker and Superdrug to gauge appetite for new listings in volatile sectors.</li></ul>", "middle east war": "<p>The U.S. and Iran are engaged in a volatile cycle of military strikes and high-stakes diplomacy to end a regional war.</p><p><strong>Why it matters:</strong> A failure to reach a stopgap agreement threatens global energy stability and risks a wider escalation involving Israel and Hezbollah.</p><p><strong>The current friction</strong></p><ul><li><strong>Military escalation:</strong> The U.S. has struck Iranian missile sites in \"self-defense,\" while Iran has launched retaliatory drones.</li><li><strong>Israeli strategy:</strong> Israel is intensifying strikes on Hezbollah in Lebanon, partly driven by far-right officials fearing a U.S.-Iran deal will limit Israeli military freedom.</li><li><strong>Internal pressure:</strong> Trump faces a dual threat from Republican hawks demanding total Iranian surrender and hardline Iranian lawmakers rejecting compromise.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>50%:</strong> The increase in fuel prices for U.S. consumers driven by the Strait of Hormuz blockade.</li><li><strong>$17 billion:</strong> Pledges for Trump’s Board of Peace fund that remain unpaid and unavailable for Gaza.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic divergence:</strong> While the war spikes inflation and fuel costs, the AI boom is currently offsetting geopolitical pain for some global economies, such as South Korea.</li><li><strong>Diplomatic paradox:</strong> Despite military exchanges, back-channel talks in Qatar and the movement of Hajj pilgrims to Saudi Arabia suggest a mutual desire to avoid total war.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Doha talks:</strong> Lead negotiators are meeting in Qatar to finalize a stopgap agreement.</li><li><strong>The \"Other Way\":</strong> If talks fail, the U.S. may pivot to alternative pressure campaigns, though markets are currently betting on a deal to reopen the Strait of Hormuz.</li></ul>", "shipping": "<p>The conflict in the Strait of Hormuz is destabilizing global trade routes and inflating operational costs.</p><p><strong>Why it matters:</strong> Blockages in the world's most critical energy artery force ships into longer, costlier detours, triggering a ripple effect across energy prices and supply chains.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert from the Middle East.</li><li><strong>$0:</strong> Total uptake of Trump’s $40bn insurance facility due to lack of naval escorts.</li><li><strong>6%:</strong> Drop in Brent crude prices following the successful crossing of two supertankers.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic shifts:</strong> Asian nations are pivoting to coal to replace disrupted gas supplies.</li><li><strong>Logistical failure:</strong> Cargo is shifting from ships to trucks in the Gulf, drastically increasing costs while reducing volume.</li><li><strong>Hidden risks:</strong> Stranded vessels face biological degradation (barnacles/jellyfish) and crew crises, complicating eventual restarts.</li><li><strong>Regulatory deadlock:</strong> US opposition is stalling global agreements on shipping carbon levies.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route permanence:</strong> Panama Canal leadership expects global trading routes to be permanently reshaped.</li><li><strong>Infrastructure wars:</strong> Regional ports, such as Belfast, are investing billions to capture diverted freight and offshore wind business.</li><li><strong>Surveillance surge:</strong> Demand for real-time ship-tracking apps (e.g., Kpler) will grow as traders monitor energy flows.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative tool to a systemic disruptor across global finance, governance, and labor.</p><p><strong>Why it matters:</strong> Rapid deployment is outpacing safety frameworks and regulatory consensus, creating high-stakes volatility in job markets and financial stability.</p><p><strong>The economic friction</strong></p><ul><li><strong>Consulting at risk:</strong> The \"Big Four\" face disruption as AI lowers barriers for smaller, agile challengers.</li><li><strong>Financial volatility:</strong> The ECB warns that private-credit-fueled AI bubbles could trigger systemic financial losses.</li><li><strong>Market mania:</strong> The Roundhill Memory ETF hit a $10bn valuation in record time, signaling extreme investor concentration in hardware.</li></ul><p><strong>The regulatory gap</strong></p><ul><li><strong>Safety concerns:</strong> The White House is considering mandatory testing for \"frontier models\" to prevent catastrophic failures.</li><li><strong>Sovereignty shifts:</strong> The EU is pivoting from merely regulating Big Tech to actively funding European AI alternatives.</li><li><strong>Legal liability:</strong> Courts are already reprimanding law firms for outsourcing critical reasoning to AI.</li></ul><p><strong>The human cost</strong></p><ul><li><strong>Hiring bias:</strong> Stanford research shows AI-driven recruitment creates \"systemic rejection\" and racial disparities.</li><li><strong>Labor uncertainty:</strong> Conflicting economic models leave policymakers unable to predict which specific jobs will vanish.</li><li><strong>Talent wars:</strong> ByteDance is using specialized stock options to prevent poaching in an intensifying global AI talent race.</li></ul><p><strong>What's next:</strong> Expect a surge in \"defensive\" corporate investments—like KPMG scouting startups—as incumbents attempt to buy the technology that threatens to replace them.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global influence as Washington retreats from traditional leadership.</p><p><strong>Why it matters:</strong> A vacuum in global governance is creating a \"century of stalemate\" where power is derived from leverage and asymmetry rather than raw wealth.</p><p><strong>The strategic shift</strong></p><ul><li><strong>Beijing's gain:</strong> China is leveraging U.S. instability to build soft power and position itself as a pillar of global stability.</li><li><strong>Russia's dependency:</strong> Putin’s strategic errors have forced Russia into a one-sided partnership, granting China significant geopolitical leverage.</li><li><strong>U.S. volatility:</strong> Pre-emptive strikes and unpredictable diplomacy are eroding trust with NATO allies and traditional partners.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hegemony without responsibility:</strong> Both superpowers seek dominance but avoid the costs of maintaining the international order.</li><li><strong>The \"Middleman\" era:</strong> Formal diplomacy is failing; special envoys and non-experts are now the primary drivers of conflict resolution.</li><li><strong>Geographic reality:</strong> Digital connectivity has not replaced physical geography, as evidenced by the critical importance of the Strait of Hormuz.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional overhaul:</strong> Multilateral bodies like the UN must reinvent their governance or face total irrelevance.</li><li><strong>Corporate pivot:</strong> Business schools are integrating geopolitics into core curricula as risk management shifts toward crisis resilience.</li><li><strong>Middle power rise:</strong> Smaller nations are adopting \"armadillo\" strategies to survive the friction between the two superpowers.</li></ul>", "us elections": "<p>Donald Trump's grip on the Republican Party is creating strategic vulnerabilities ahead of the midterm elections.</p><p><strong>Why it matters:</strong> Trump's preference for \"MAGA warriors\" over traditional conservatives risks alienating moderate swing voters. This shift provides Democrats a narrow opening to reclaim seats in key states.</p><p><strong>The Texas Equation</strong></p><ul><li>Trump-backed Ken Paxton won the GOP primary, ousting a sitting senator.</li><li>Democrats view Paxton's controversial profile as a liability in a general election.</li><li>The strategy: Bet that Paxton's appeal is limited to the MAGA base, not the broader electorate.</li></ul><p><strong>Internal GOP Fractures</strong></p><ul><li><strong>The \"Maga Divorce\":</strong> Nationalists claim Trump betrayed \"America First\" pledges regarding the Iran war.</li><li><strong>Fiscal Friction:</strong> Senate Republicans are stalling a $1.8bn \"anti-weaponization\" fund for \"lawfare\" victims.</li><li><strong>The Musk Factor:</strong> A $8M GOP-led push aims to undo Elon Musk's aid cuts to protect swing districts.</li></ul><p><strong>Democratic Pivot</strong></p><ul><li><strong>Working-Class Shift:</strong> Democrats are nominating populist candidates, such as a former firefighter in Pennsylvania, to win back blue-collar voters.</li><li><strong>Post-Mortem:</strong> A DNC report blames White House disunity for previous losses under Harris.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>50%+</strong>: US voters who disapprove of Trump’s economic handling, per FT poll.</li><li><strong>$1.8B</strong>: The disputed cost of Trump's proposed \"anti-weaponization\" fund.</li><li><strong>$8M</strong>: Spending by Republicans to mitigate the impact of Musk's aid cuts.</li></ul><p><strong>What's next:</strong> Watch the Pennsylvania and Texas general elections to see if populist Democratic messaging and controversial GOP nominees shift the balance of power.</p>", "german politics": "<p>Germany is pivoting toward aggressive military expansion while facing a diplomatic crisis with the United States.</p><p><strong>Why it matters:</strong> Berlin is abandoning decades of military restraint to counter Russian threats, but this shift is straining relations with Washington and triggering friction with EU partners.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin is accelerating spending to hit a 3.5% GDP target six years ahead of schedule.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Strategy:</strong> Germany published its first military strategy since WWII, signaling a willingness to take \"more responsibility\" for European security.</li></ul><p><strong>The Trump friction</strong></p><ul><li><strong>The Spark:</strong> Chancellor Friedrich Merz criticized U.S. strategy in Iran, calling the war \"ill-prepared.\"</li><li><strong>The Fallout:</strong> President Trump responded by reviewing U.S. troop presence and pulling 5,000 soldiers out of Germany.</li><li><strong>The Paradox:</strong> Despite the row, Berlin is pushing to buy Tomahawk missiles to bolster its arsenal.</li></ul><p><strong>Domestic instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD is topping polls by leveraging voter anger over fuel prices and criticizing the Iran war.</li><li><strong>Legal blows:</strong> A Berlin court ordered the AfD to return a record €2.35 million in illegal donations.</li><li><strong>Policy rifts:</strong> The AfD is internally divided over conscription ahead of key eastern state elections.</li></ul><p><strong>Economic tensions</strong></p><ul><li><strong>Protectionism:</strong> Netflix and other streamers are criticizing German proposals to force higher local investment.</li><li><strong>Single Market:</strong> The ECB criticized Berlin's opposition to UniCredit’s bid for Commerzbank as contrary to EU spirit.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>What's next:</strong> Watch for the September regional elections in eastern Germany to determine if the AfD's polling surge translates into governing power.</p>", "central banks": "<p>Central banks are pivoting toward higher interest rates as geopolitical conflict drives a new wave of global inflation.</p><p><strong>Why it matters:</strong> Persistent price pressures from the Iran war are eroding the \"policy put,\" leaving central banks with fewer tools to stabilize markets without triggering further volatility.</p><p><strong>The inflation trigger</strong></p><ul><li><strong>Energy shocks:</strong> The closure of the Strait of Hormuz is pushing energy costs higher, forcing the ECB and BoJ toward June rate hikes.</li><li><strong>Debt costs:</strong> US borrowing costs have hit their highest levels since 2007, increasing the interest burden on national debt.</li><li><strong>Target failures:</strong> Turkey has scrapped its 16% inflation target, raising it to 24% as economic strains deepen.</li></ul><p><strong>Fed transition</strong></p><ul><li><strong>Leadership shift:</strong> Kevin Warsh is set to replace Jay Powell, bringing a preference for less public guidance (\"incantations\") to manage market expectations.</li><li><strong>Policy disconnect:</strong> A gap persists between money markets and professional forecasters regarding the timing of future rate moves.</li><li><strong>Internal friction:</strong> Fed officials are increasingly calling for the removal of rate-cut signals as inflation trends reverse.</li></ul><p><strong>Systemic risks</strong></p><ul><li><strong>AI vulnerability:</strong> The ECB is summoning banks to address financial system flaws exposed by new AI models.</li><li><strong>Bond fragility:</strong> Rising public debt and hedge fund trading are increasing vulnerability in the gilt and global bond markets.</li><li><strong>Sovereignty:</strong> The UK faces pressure regarding euro-denominated debt, which critics argue would surrender monetary independence.</li></ul><p><strong>What's next:</strong> Watch for a coordinated shift toward hawkish policy in June across the ECB and BoJ, and the immediate impact of Kevin Warsh's communication style on Fed market signaling.</p>", "us banks": "<p>US banks are aggressively expanding balance sheets and pursuing acquisitions as deregulation unlocks massive capital reserves.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles allow US lenders to outpace European and Swiss rivals in scale and risk-taking, shifting the global competitive balance.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital freed for top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan alone claims was unlocked by a lighter regulatory approach.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering for JPMorgan.</li><li><strong>$9.4 billion:</strong> Total employee compensation at Jane Street for 2025.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk shifting:</strong> Banks are actively offloading private equity-linked loans and AI-driven data center debt to avoid overexposure.</li><li><strong>Geopolitical friction:</strong> Security concerns are forcing operational splits, evidenced by Morgan Stanley issuing China-only iPhones and Goldman restricting AI tools in Hong Kong.</li><li><strong>Strategic pivots:</strong> Citi is shifting toward private lending partnerships (BlackRock) and direct employee referral incentives to accelerate its turnaround.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market expansion:</strong> JPMorgan is scaling its digital consumer bank into Germany.</li><li><strong>Product evolution:</strong> Morgan Stanley is integrating spot crypto trading into E*Trade.</li><li><strong>Treasury surge:</strong> Primary dealers are boosting government debt holdings to their highest levels since 2007.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>28 May 2026 14:15 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
