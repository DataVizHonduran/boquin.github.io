.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing as geopolitical volatility drives fuel prices higher while the U.S. struggles to align its power grid with the AI boom.</p><p><strong>Why it matters:</strong> Supply chain disruptions in the Middle East and outdated U.S. infrastructure are creating a \"price squeeze\" that threatens political stability and industrial growth.</p><p><strong>The fuel crunch</strong></p><ul><li><strong>Refining bottlenecks:</strong> Oil majors are resisting new refinery investments, opting to harvest high margins from existing capacity.</li><li><strong>Geopolitical risk:</strong> Iranian tanker attacks in the Strait of Hormuz are disrupting flows and causing environmental damage in the UAE.</li><li><strong>U.S. instability:</strong> Fuel supplies have hit a 20-year low as diplomatic gambits to lower prices fail.</li></ul><p><strong>The LNG pivot</strong></p><ul><li><strong>Qatar's dominance:</strong> The Gulf nation is on track to become the largest buyer of U.S. LNG by 2033.</li><li><strong>Japanese urgency:</strong> Japanese firms are spending $21B to secure U.S. Gulf Coast shale resources to hedge against market upheavals.</li></ul><p><strong>The transition gap</strong></p><ul><li><strong>Infrastructure lag:</strong> The U.S. is building electricity transmission lines at 25% of the rate seen a decade ago, stalling AI data center expansion.</li><li><strong>Political shifts:</strong> Renewable energy firms are gaining \"clarity\" following U.S. election results, while the UK is mandating community investment for new projects.</li></ul><p><strong>Between the lines</strong> The \"energy transition\" is facing a reality check. While tech firms are promoting efficiency at conferences like Adipec, the physical reality is a reliance on mature gas assets and a desperate scramble for critical minerals.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI optimism hits a political and regulatory wall.</p><p><strong>Why it matters:</strong> Market volatility is shifting from technical performance to geopolitical risk. Regulatory threats to data centers and healthcare consolidation are now outweighing raw growth projections.</p><p><strong>The winners</strong></p><ul><li><strong>Sony:</strong> Profits surged via a 48% revenue jump in its film division, driven by *Spider-Man*.</li><li><strong>BT:</strong> Shares rallied on better-than-expected profits, signaling a return on heavy network investment.</li><li><strong>Taiwanese Chipmakers:</strong> Reaching historic peaks as the primary hardware providers for the AI trade.</li></ul><p><strong>The losers</strong></p><ul><li><strong>Rheinmetall:</strong> Shares dropped 17% following a sales forecast cut and delayed armored vehicle orders.</li><li><strong>Maersk:</strong> Shares fell 10% due to Q3 results missing investor expectations despite data center demand.</li><li><strong>Blue Origin:</strong> Launch timelines pushed to 2027 following a devastating explosion.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Backlash:</strong> A \"blue wave\" in the US is sparking fears that new politicians will throttle data center development.</li><li><strong>Strategic Pivots:</strong> CVS is exploring a breakup to avoid bipartisan antitrust pressure on healthcare giants.</li><li><strong>Valuation Gaps:</strong> Monzo is targeting a £7.5bn valuation after failing to secure a £10bn takeover by Nubank.</li></ul><p><strong>What's next</strong></p><ul><li><strong>IPO Watch:</strong> WB Electronics is preparing for a potential €7bn listing in Warsaw next year.</li><li><strong>State Intervention:</strong> The German government is expected to finalize the purchase of 50% of tank maker KNDS this week.</li></ul>", "middle east war": "<p>U.S. midterm election results are forcing a pivot in Middle East strategy toward de-escalation with Iran and reduced support for Israel.</p><p><strong>Why it matters:</strong> A Democratic sweep of Congress and internal Republican dissent are stripping President Trump of the political mandate to pursue a \"maximum pressure\" campaign.</p><p><strong>The pivot</strong></p><ul><li><strong>Funding cuts:</strong> Trump announced an end to $4 billion in annual military aid to Israel by year-end.</li><li><strong>Diplomatic shift:</strong> Oil prices tumbled below $100 on renewed hopes for U.S.-Iran talks.</li><li><strong>Internal friction:</strong> VP JD Vance explicitly linked Republican midterm losses to voter anger over the Iran war.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Israel's isolation:</strong> Prime Minister Netanyahu is pressing for renewed strikes on Iran, but Washington is signaling a retreat from proximity to Israel.</li><li><strong>Russia's role:</strong> Moscow is deepening military ties with Tehran via missile launcher deals, complicating U.S. efforts to isolate Iran.</li><li><strong>Regional instability:</strong> The conflict has already forced the postponement of high-profile events in Saudi Arabia, including the Asian Cup.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Qatar mediation:</strong> Watch for an interim deal between Washington and Tehran brokered by Doha.</li><li><strong>UN leadership:</strong> The candidacy of Lana Nusseibeh for UN Secretary-General will test whether Emirati diplomacy can be viewed as independent of Abu Dhabi.</li></ul>", "shipping": "<p>Global shipping is fracturing into high-risk war zones and opportunistic new corridors.</p><p><strong>Why it matters:</strong> Geopolitical volatility in the Black Sea and Strait of Hormuz is driving up operational costs, inflating oil prices, and forcing a permanent redraw of global trade maps.</p><p><strong>The danger zones</strong></p><ul><li><strong>Black Sea:</strong> Now the world's deadliest route for commercial sailors due to the Russia-Ukraine conflict.</li><li><strong>Strait of Hormuz:</strong> Iran has intensified g>Security threats:</strong> GCHQ warns that AI-driven cyber attacks from Russia and China will be routine by 2028.</li><li><strong>National security:</strong> OpenAI is hiring former US Army leadership to integrate AI into military modernization.</li></ul><p><strong>Infrastructure headwinds</strong></p><ul><li><strong>Political pushback:</strong> Democratic governors in Texas, Georgia, and Ohio are blocking data center expansions.</li><li><strong>Financial strain:</strong> Investors are demanding higher returns in the credit market; Anthropic's infrastructure costs are outstripping revenue.</li><li><strong>Strategic pivots:</strong> Microsoft rejected a multibillion-dollar deal with Nscale, signaling a more selective approach to expansion.</li></ul><p><strong>Labor and productivity</strong></p><ul><li><strong>Demographic necessity:</strong> Meta executives argue AI is vital to offset global population collapse and falling birth rates.</li><li><strong>Skill shift:</strong> Consultancies report a growing need for junior graduates with high-level AI skills over traditional \"grunt work.\"</li><li><strong>Corporate mandates:</strong> A&O Shearman is requiring lawyers to spend 3% of billable time developing AI tools.</li></ul><p><strong>The bottom line:</strong> The \"AI bust\" risk is rising as financial engineering meets real-world constraints in energy, politics, and international trade.</p>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic rivalry that transcends individual administrations.</p><p><strong>Why it matters:</strong></p><ul><li>Strategic competition is now structural, meaning diplomatic summits provide tactical stability but cannot reverse the long-term trend of decoupling.</li><li>The volatility of U.S. domestic politics is pushing \"middle powers\" and the BRICS bloc to build alternative economic security frameworks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Trump Effect\":</strong> U.S. unpredictability is acting as a catalyst for BRICS unity, accelerating the shift toward a multipolar world.</li><li><strong>Beyond Détente:</strong> Communication between Washington and Beijing is now a tool for risk management, not a path toward friendship.</li><li><strong>The Middle Power Pivot:</strong> Countries like Australia are prioritizing supply chain diversification to avoid becoming collateral damage in the Great Power struggle.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Economic Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li><strong>Global Order:</strong> The \"win-win\" era of post-Cold War globalization has been replaced by a \"zero-sum\" geopolitical logic.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Stress:</strong> Expect increased pressure on the UN and other multilateral bodies as the U.S. and China compete for leadership of the Global South.</li><li><strong>Security Realignment:</strong> Europe will likely accelerate its own defense autonomy, assuming the U.S. will no longer unconditionally underwrite Western security.</li></ul>", "us elections": "<p>Democrats secured a historic \"blue wave\" victory in the US midterms, dealing a decisive blow to Donald Trump and the Republican party.</p><p><strong>Why it matters:</strong> The landslide shift signals a public rejection of Trumpism and the current GOP agenda, specifically regarding the Iran war and the cost of living. This realignment shifts the legislative balance of power and forces an immediate strategic pivot for the 2028 presidential race.</p><p><strong>By the numbers</strong></p><ul><li><strong>$120 billion:</strong> Estimated loss in Elon Musk's net worth following the election.</li><li><strong>$600 million:</strong> Amount spent by Big Tech on campaigns that failed to move the needle.</li><li><strong>75 years:</strong> The scale of the House swing in favor of Democrats is the largest in over seven decades.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Backlash:</strong> Investors are betting against the AI boom; chip stocks plummeted while hyperscalers surged as markets anticipate increased regulation.</li><li><strong>Economic Disconnect:</strong> Broad statistics failed to save Republicans because voters did not feel personal real income growth.</li><li><strong>GOP Fracture:</strong> The defeat has triggered internal warfare, with party leaders blaming Trump's strategy and the Iran conflict for the collapse.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Policy Shift:</strong> Democrats plan a dramatic reshaping of US policy, keeping wealth taxes on the table despite a specific loss in California.</li><li><strong>Foreign Relations:</strong> Expect a push to end the Middle East conflict, as evidenced by tumbling oil prices and optimism from European and Canadian leaders.</li><li><strong>Executive Resistance:</strong> Critics warn Trump may bypass the legislative defeat by relying more heavily on executive orders.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as a surge in far-right support and internal coalition fractures destabilize his government.</p><p><strong>Why it matters:</strong> Merz's weakened domestic authority hobbles Germany's ability to lead EU budget negotiations and implement critical economic reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition strain:</strong> The resignation of the labor minister stalls urgent pension and labor market overhauls.</li><li><strong>AfD ascent:</strong> The far-right party is securing regional power and allegedly poaching votes from Merz's CDU.</li><li><strong>Leadership rivalry:</strong> Hendrik Wüst is emerging as a popular alternative to the embattled chancellor.</li></ul><p><strong>Security threats</strong></p><ul><li><strong>Espionage:</strong> Authorities are warning officials of iPhone hacks and arresting suspected Russian spies targeting military sites.</li><li><strong>Military shift:</strong> The appointment of Christian Freuding as armed forces chief signals a pivot toward rapid modernization and Ukraine alignment.</li></ul><p><strong>Between the lines</strong> The \"firewall\" against the AfD is leaking. The party's first regional parliament presidency suggests established parties are quietly collaborating with the far right to secure power.</p><p><strong>What's next</strong></p><ul><li><strong>Investment risk:</strong> Executives are weighing the impact of political instability on Germany's industrial drive.</li><li><strong>EU deadlock:</strong> Merz's diminished mandate may derail the proposed €2tn EU budget deal.</li></ul>", "central banks": "<p>Central banks are shifting back toward aggressive tightening as global inflation remains stubborn.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing the Fed, ECB, and BoE to abandon \"pause\" narratives to prevent inflation from becoming structural.</p><p><strong>The current state</strong></p><ul><li><strong>Bank of England:</strong> Raised rates to 4% to combat accelerating autumn inflation.</li><li><strong>European Central Bank:</strong> On course for further tightening as core inflation exceeds the 2% target.</li><li><strong>Federal Reserve:</strong> Maintaining a tightening path due to strong U.S. growth and \"hot\" PCE data.</li><li><strong>Bank of Japan:</strong> Continuing a quarterly tightening trajectory.</li></ul><p><strong>Leadership transition</strong> Christine Lagarde will step down as ECB president in February, ahead of her 2027 term end.</p><p><strong>Between the lines:</strong> The transition occurs during a period of French bond market turbulence, making the successor's ability to manage \"smooth transmission\" critical. Frontrunners include Pablo Hernández de Cos and Klaas Knot.</p><p><strong>What's next</strong></p><ul><li><strong>Policy lysts expect a sharp slowdown in trading revenue for Q3 after a record-breaking start to the year.</li><li><strong>AI Restrictions:</strong> Expect more US lenders to block AI agents from account access to protect low-cost deposit bases.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>05 Nov 2026 18:13 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
