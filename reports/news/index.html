/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical conflict in the Middle East is driving Brent crude back to $100.</p><p><strong>Why it matters:</strong> Supply shocks from Iran and Saudi Arabia are spiking fuel costs, threatening to reignite global inflation. This volatility forces central banks to reconsider interest rate hikes to stabilize economies.</p><p><strong>By the numbers</strong></p><ul><li><strong>$100:</strong> Current price of Brent crude.</li><li><strong>$6:</strong> Record US diesel price per gallon.</li><li><strong>$80 billion:</strong> Estimated cost to realize Alaska's LNG potential.</li><li><strong>11%:</strong> Decline in coal-fired electricity generation in H1 2026.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Energy transition:</strong> The oil shock is paradoxically accelerating interest in clean hydrogen and floating wind turbines.</li><li><strong>Public perception:</strong> US shale executives report that Big Tech has replaced Big Oil as the primary target of public and youth scrutiny.</li><li><strong>UK instability:</strong> Regulatory probes into KPMG and delays in North Sea gas projects signal a volatile environment for UK energy investment.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Monetary policy:</strong> The ECB will monitor refined product prices to determine if further rate hikes are required.</li><li><strong>Infrastructure:</strong> The US must resolve financing and legal hurdles to transform Alaska into an LNG superpower.</li><li><strong>Nuclear gap:</strong> Global reactor construction must increase fivefold over the next decade to meet 2050 climate targets.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are being reshaped by AI-driven operational shifts and a cooling private equity market.</p><p><strong>Why it matters:</strong> AI is forcing legacy firms to overhaul delivery models to protect margins. Simultaneously, high interest rates are eroding the returns of \"boom-era\" private equity funds.</p><p><strong>By the numbers</strong></p><ul><li><strong>$40 billion:</strong> Vy Capital's stake in SpaceX.</li><li><strong>$1 billion:</strong> GE HealthCare's target acquisition for cancer scan chemicals.</li><li><strong>40,000:</strong> Employees in PwC's new AI-focused joint venture.</li><li><strong>$1 trillion:</strong> Canada's target investment to decouple from US volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Infrastructure:</strong> The race is shifting from software to physical assets, creating new bottlenecks in power and water supplies.</li><li><strong>PE Friction:</strong> Funds launched between 2019 and 2021 are struggling to meet expectations, leading to shareholder revolts over \"lowball\" take-private prices.</li><li><strong>Regulatory Pressure:</strong> Forced listings, such as the RBI's mandate for Tata Sons, signal a push for greater transparency in major conglomerates.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Capital Flight:</strong> Investors may move assets toward stable havens to hedge against US political instability.</li><li><strong>IPO Recovery:</strong> Large-scale deals, like the potential Belron listing, will serve as a litmus test for Europe's broken IPO window.</li></ul>", "middle east war": "<p>Escalating conflict between Iran-backed proxies and regional powers is destabilizing global energy markets and shipping lanes.</p><p><strong>Why it matters:</strong></p><ul><li>Houthi seizures of Red Sea ports and Iranian threats to the Strait of Hormuz create critical vulnerabilities for global oil transit.</li><li>The shift toward attacking Saudi energy infrastructure forces regional hubs like Dubai to rebuild critical logistics underground.</li></ul><p><strong>By the numbers:</strong></p><ul><li>$108: Current price of oil ahead of Iran-Gulf talks.</li><li>2: Daily air defense time slots the US now provides for tankers in Hormuz.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>AI Weaponization:</strong> Houthi attempts to use Anthropic AI for ballistic missiles expose gaps in AI safety guardrails.</li><li><strong>Western Pivot:</strong> Trade bans on West Bank settlements by the UK, France, and Canada signal a hardening diplomatic stance against Israel.</li><li><strong>Financial Survival:</strong> Iran's relaxation of crypto controls indicates a move to bypass sanctions and repatriate funds to fuel proxy wars.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>The Hormuz Deal:</strong> A proposed shipping agreement between Iran and Oman aims to ease hostilities and stabilize the strait.</li><li><strong>Lebanon Mandate:</strong> Paris and Beirut are pushing to extend UN peacekeeper missions as Israel occupies southern territory.</li></ul>", "shipping": "<p>Geopolitical conflict and climate change are destabilizing global shipping routes and pricing.</p><p><strong>Why it matters:</strong></p><ul><li>Instability at key chokepoints forces a structural shift in how global trade flows.</li><li>The growth of \"shadow fleets\" and sanctions evasion is eroding international maritime law.</li></ul><p><strong>The chokepoint crisis</strong></p><ul><li><strong>Panama Canal:</strong> El Niño-driven water shortages are forcing cuts to daily transits.</li><li><strong>Strait of Hormuz:</strong> US-Iran tensions have led to tanker strikes and threats of vessel confiscation.</li><li><strong>Black Sea:</strong> War-related disruptions to grain exports are increasing global food prices.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>US:</strong> Planning nuclear-powered merchant ships to challenge Chinese shipbuilding dominance.</li><li><strong>South Korea:</strong> Pursuing Arctic trade routes to reduce reliance on traditional chokepoints.</li><li><strong>Maersk:</strong> Installing wind sails to lower long-term fuel consumption.</li></ul><p><strong>Market dynamics</strong></p><ul><li><strong>Rates:</strong> Port bottlenecks and sea disruptions are temporarily increasing freight rates and profits.</li><li><strong>Capital:</strong> Institutional investors are increasing exposure to shipping as a hard asset hedge.</li><li><strong>Security:</strong> Sanctions loopholes allow UK insurers to continue covering Russian gas tankers.</li></ul>", "artificial intelligence": "<p>AI is entering a high-friction phase defined by infrastructure bottlenecks and escalating safety risks.</p><p><strong>Why it matters:</strong> Physical constraints and financial instability are capping growth while the gap between commercial speed and safety controls creates systemic vulnerabilities.</p><p><strong>By the numbers</strong></p><ul><li><strong>$7.5 billion:</strong> Value of Oracle stock founder Larry Ellison plans to sell.</li><li><strong>$2 billion:</strong> Loans Vantage Data Centers is seeking as Wall Street banks limit AI exposure.</li><li><strong>5:</strong> Instances where Anthropic blocked users from using AI to develop bioweapons.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure fatigue:</strong> Texas is slowing data center approvals due to public backlash and political risk.</li><li><strong>The \"Open\" pivot:</strong> Firms like Latham & Watkins are bypassing closed APIs for custom open-weight models to increase security.</li><li><strong>Financial fragility:</strong> JPMorgan is cutting lending to AI-focused hedge funds following significant losses.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory shifts:</strong> The UK is proposing \"L-plates\" (live monitoring) for AI tools entering patient care.</li><li><strong>Sovereignty plays:</strong> Europe is prioritizing data control to maintain economic independence from US tech.</li><li><strong>Safety alarms:</strong> New OpenAI board members are warning that advanced AI could be \"deadly\" without stronger safety features.</li></ul>", "us-china relations": "<p>US-China competition is driving a global pivot toward rival economic and political blocs.</p><p><strong>Why it matters:</strong> US transactional diplomacy is eroding traditional alliances, pushing neutral nations toward the BRICS grouping. The shift from \"win-win\" cooperation to zero-sum logic increases the risk of systemic conflict.</p><p><strong>By the numbers</strong></p><ul><li><strong>Economic shift:</strong> The BRICS bloc now accounts for a larger share of the world economy than the G7.</li><li><strong>AI lead:</strong> The US maintains a technological advantage through consolidated national data center projects.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Allied instability:</strong> US reliability concerns in South Korea and Japan are forcing allies to reconsider security guarantees.</li><li><strong>Internal US divide:</strong> Trump and Gen Z voters show more openness to cooperation with Beijing than Congressional hawks.</li><li><strong>Trade weaponization:</strong> The use of sanctions and tariffs is accelerating the creation of alternative financial systems.</li></ul><p><strong>What's next</strong></p><ul><li><strong>BRICS expansion:</strong> The bloc will likely seek further consensus to hedge against US sanctions and tariffs.</li><li><strong>Geopolitical realignment:</strong> China will leverage US instability to expand influence in Africa and the Middle East.</li></ul>", "us elections": "<p>Donald Trump is betting his personal brand and a massive cash payout to secure a Republican congressional majority.</p><p><strong>Why it matters:</strong> Trump's plummeting approval ratings risk dragging down GOP candidates in tight swing districts. Economic instability, fueled by inflation and foreign conflict, is eroding the party's working-class base.</p><p><strong>By the numbers</strong></p><ul><li><strong>$5,000:</strong> The \"dividend\" Trump promised to all American adults if Republicans win.</li><li><strong>$400 million:</strong> The size of the Maga Inc. war chest.</li><li><strong>Record high:</strong> Fuel prices hitting a peak on Labor Day.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Fear over policy:</strong> The GOP is pivoting from policy platforms to campaigns centered on the \"lunacy\" of the Democratic alternative.</li><li><strong>Leftward shift:</strong> Democratic socialist candidates are winning primaries as voters reject traditional capitalist frameworks.</li><li><strong>Voting chaos:</strong> A Supreme Court ruling allowing Trump to restrict mail-in ballots has created uncertainty weeks before the election.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Cash deployment:</strong> Watch for Maga Inc. and America Pac to release millions in funding following pressure from struggling GOP candidates.</li><li><strong>Economic indicators:</strong> Affordability trackers in swing states like Pennsylvania will likely determine the final congressional makeup.</li></ul>", "german politics": "<p>The far-right Alternative for Germany (AfD) has seized the political lead in Saxony-Anhalt.</p><p><strong>Why it matters:</strong> The victory signals a collapse of the political center in eastern Germany and provides a blueprint for the AfD to challenge for national power.</p><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for the next federal election.</li><li><strong>3 seats:</strong> The margin keeping the AfD from leading the regional government.</li><li><strong>€3.75 trillion:</strong> Private capital Berlin aims to attract by 2040, now threatened by political instability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Generational shift:</strong> Younger voters are decoupling from historical memories of fascism and communism, making radicalism more palatable.</li><li><strong>Unlikely alliances:</strong> The hard-left BSW party is emerging as a potential kingmaker, complicating traditional coalition building.</li><li><strong>Leadership crisis:</strong> The CDU is distancing itself from Chancellor Merz as he becomes a political liability in eastern strongholds.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal challenges:</strong> Senior politicians are calling for the top court to outlaw the AfD's most radical flank.</li><li><strong>Economic risk:</strong> The government must address infrastructure bottlenecks and investor skepticism to prevent further decline.</li><li><strong>Security threats:</strong> Berlin expects increased hybrid warfare from Russia following the AfD's rise.</li></ul>", "central banks": "<p>Central banks are struggling to maintain policy independence amid persistent inflation and rising sovereign debt.</p><p><strong>Why it matters:</strong> Political interference and high public deficits undermine the ability of central banks to stabilize prices and manage market volatility.</p><p><strong>The policy landscape</strong></p><ul><li><strong>ECB:</strong> Lifted rates to 2.5% and warned that Middle East conflicts will keep inflation elevated through 2027.</li><li><strong>Fed:</strong> Strong US payroll data increases the likelihood of rate hikes, though some officials signal a hold.</li><li><strong>BoJ:</strong> Facing intense pressure to raise rates to combat currency volatility and US Treasury interference.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Independence at risk:</strong> The Bank of England warns that populist rhetoric labeling rate-setters as \"unrepresentative elites\" threatens institutional autonomy.</li><li><strong>Political friction:</strong> US Treasury Secretary Scott Bessent’s claims of insider knowledge are eroding market perceptions of the BoJ's independence.</li><li><strong>Geopolitical shifts:</strong> The Dutch central bank is moving gold reserves from New York to London, citing geopolitical unrest and better tradeability.</li></ul><p><strong>The fiscal trap</strong></p><ul><li><strong>Debt burden:</strong> High public deficits are weakening the effectiveness of interest rate hikes in controlling inflation.</li><li><strong>AI risk:</strong> If US Treasury yields decisively breach 5%, the cost of capital could derail the AI investment boom.</li><li><strong>QE legacy:</strong> Central bank balance sheets are expected to remain large, extending the shadow of quantitative easing.</li></ul>", "us banks": "<p>Wall Street is aggressively financing the AI build-out while preparing for a deregulatory shift.</p><p><strong>Why it matters:</strong> AI has evolved from a productivity tool into a primary driver of debt financing and wealth management growth. Simultaneously, a shift in federal oversight is prioritizing financial risk over compliance rituals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$250 billion:</strong> Bank of America's commitment to \"America First\" projects.</li><li><strong>$74 billion:</strong> Morgan Stanley's Q2 wealth management haul from new issues, including SpaceX.</li><li><strong>$15 billion:</strong> Debt banks are offloading for Anthropic data centers to free up lending capacity.</li><li><strong>$2.3 billion:</strong> Goldman Sachs' potential acquisition of ETF provider Neos.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Vendor pressure:</strong> Banks are demanding lower legal fees, arguing that AI has made routine law firm work faster.</li><li><strong>Market friction:</strong> JPMorgan is curbing lending to trading firms like Jane Street as they compete in the US Treasury market.</li><li><strong>Digital pivot:</strong> BNY's adoption of blockchain for records signals a permanent blur between traditional finance and digital assets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory overhaul:</strong> US regulators will narrow enforcement to core financial risks under the Trump administration.</li><li><strong>Stress test exit:</strong> Calls are growing to eliminate time-consuming bank stress tests.</li><li><strong>Asset diversification:</strong> Banks will continue acquiring asset managers to stabilize revenue against volatile trading cycles.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>13 Sep 2026 14:37 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
