rong>Political shift:</strong> The Supreme Court overturned a ban on Arab parties, potentially giving them the balance of power in a hung parliament.</li><li><strong>Internal strife:</strong> Opponents accuse PM Netanyahu of using recent security incidents to manipulate election outcomes.</li></ul><p><strong>Regional shifts</strong></p><ul><li><strong>Iraq:</strong> The U.S. has withdrawn all remaining troops, leaving a power vacuum for Iran-backed militias.</li><li><strong>Syria:</strong> The new Islamist government under Ahmed al-Sharaa is replacing Assad’s protectionism with a free-market model.</li><li><strong>Diplomacy:</strong> Mediators are attempting to break a seven-month deadlock between Washington and Tehran.</li></ul><p><strong>What's next:</strong> Watch for the arrival of the USS Theodore Roosevelt in late November. Its positioning will signal whether the U.S. is pursuing deterrence or preparing for offensive action.</p>", "shipping": "<p>Global shipping is undergoing a structural collapse as geopolitical conflict and climate change force a total redesign of trade routes.</p><p><strong>Why it matters:</strong> Traditional chokepoints like the Strait of Hormuz and Panama Canal are becoming unreliable. This volatility is driving a shift toward \"shadow fleets,\" Arctic alternatives, and record-high vessel valuations.</p><p><strong>The Geopolitical Pivot</strong></p><ul><li><strong>Route Diversion:</strong> Northern Sea Route transits have quadrupled as vessels avoid Middle East conflict and leverage melting Arctic ice.</li><li><strong>Strategic Competition:</strong> The U.S. is planning a nuclear-powered merchant fleet by 2028 to counter China's shipbuilding dominance.</li><li><strong>Shadow Fleets:</strong> Russia expanded its fleet by one-third to bypass Western sanctions on fossil fuel exports.</li></ul><p><strong>Market Volatility</strong></p><ul><li><strong>Asset Surge:</strong> Old supertankers now command higher prices than new builds due to immediate availability.</li><li><strong>Record Costs:</strong> Oil tanker rates hit $1.2 million per day on Middle East-China routes.</li><li><strong>Investment Shift:</strong> Institutional investors are pivoting to shipping as a \"hard asset\" hedge against Middle East instability.</li></ul><p><strong>The Green Transition</strong></p><ul><li><strong>Fuel Shift:</strong> Biodiesel is now cheaper than conventional fuels, accelerating emissions target compliance.</li><li><strong>Tech Mix:</strong> Maersk is integrating wind sails; ammonia and methanol are emerging as primary decarbonization tools.</li></ul><p><strong>Critical Risks</strong></p><ul><li><strong>Cybersecurity:</strong> Hackers are targeting satellite links connected to engine and navigation \"edge devices.\"</li><li><strong>Safety:</strong> Shipping lines warn that battery declaration exemptions are increasing onboard fire risks.</li><li><strong>Infrastructure:</strong> Jebel Ali port faces \"existential risk\" due to its dependence on the Strait of Hormuz.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative gold rush to a volatile industrial phase defined by massive capital expenditures and regulatory friction.</p><p><strong>Why it matters:</strong> The gap between AI's theoretical productivity and its actual cost is creating financial instability for tech giants and legal chaos for institutions.</p><p><strong>The financial squeeze</strong></p><ul><li><strong>Balance sheet strain:</strong> Amazon is attempting to offload $8B in Nvidia chips to offset soaring AI spending.</li><li><strong>Pricing crisis:</strong> Frontier labs are rethinking pricing models as powerful tools burn through budgets faster than revenue scales.</li><li><strong>New markets:</strong> Volatile chip rental prices are sparking the creation of a futures market for AI compute.</li></ul><p><strong>Geopolitical and regulatory heat</strong></p><ul><li><strong>State-level competition:</strong> Japan is investing $140B in data centers; Tencent is leasing 100k chips from Oracle to compete with ByteDance.</li><li><strong>Government scrutiny:</strong> The FTC has expanded investigations into OpenAI and Anthropic.</li><li><strong>Political pivots:</strong> Silicon Valley is negotiating \"self-regulation\" agreements with the Trump administration.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Academic crisis:</strong> Students are hiring lawyers to fight AI misconduct charges as universities fail to set clear policies.</li><li><strong>Security risks:</strong> OpenAI agents have been linked to obscured hacking activity in government breaches.</li><li><strong>Physical bottlenecks:</strong> AI-driven scientific gains are stalling due to real-world physical constraints.</li></ul><p><strong>What's next:</strong> Expect a shift toward \"circular financing\" and aggressive cost-cutting as companies struggle to prove the ROI of massive hardware investments.</p>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy increases the risk of miscalculation. Both nations are prioritizing strategic dominance over global stability, eroding the post-Cold War order.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Current leadership in Washington and Beijing is viewed as ill-equipped for the far-sighted diplomacy required to avoid conflict.</li><li><strong>Alliance erosion:</strong> U.S. unpredictability regarding security guarantees is unsettling key Asia-Pacific allies, specifically Japan and South Korea.</li><li><strong>Alternative blocs:</strong> The BRICS grouping is leveraging U.S. volatility to build a cohesive counter-weight, now surpassing the G7 in share of the world economy.</li></ul><p><strong>The AI factor</strong></p><ul><li><strong>Hardware hegemony:</strong> U.S. consolidation of national data centers maintains a critical lead in AI.</li><li><strong>Power imbalance:</strong> Hardware dispersion does not equal decentralized power; the U.S. retains the primary structural advantage.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tactical engagement:</strong> Expect continued high-level summits, though these are viewed as risk-management tools rather than a return to détente.</li><li><strong>Economic warfare:</strong> Increased use of sanctions and tariffs will likely drive further rapprochement between China and other BRICS members.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>04 Oct 2026 15:29 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
