.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Global diesel supplies are tightening as geopolitical volatility and trade threats collide.</p><p><strong>Why it matters:</strong> Persistent fuel shortages drive inflation and destabilize public finances, forcing EU nations to seek fiscal leeway and risk strategic reserve depletion.</p><p><strong>The diesel crunch</strong></p><ul><li><strong>Supply shocks:</strong> Russia extended export bans following refinery strikes; the US is weighing export restrictions.</li><li><strong>Market outlook:</strong> Dallas Fed surveys indicate diesel prices will not normalize for at least one year.</li><li><strong>Economic ripple:</strong> High fuel costs are accelerating Eurozone inflation, prompting the ECB to consider pre-emptive rate hikes.</li></ul><p><strong>Geopolitical leverage</strong></p><ul><li><strong>US pressure:</strong> The Trump administration is leveraging diesel exports to force EU reserve releases and secure energy concessions.</li><li><strong>Strategic shifts:</strong> Threats of US bans are accelerating Europe's push for energy independence.</li><li><strong>Investment pivots:</strong> South Korea pledged $200bn for US energy projects in Alaska and Texas.</li></ul><p><strong>The energy transition</strong></p><ul><li><strong>LNG expansion:</strong> Shell is doubling capacity at the $23bn LNG Canada project to meet global demand.</li><li><strong>Battery dominance:</strong> China maintains a lead in power technology, while Australia faces \"revenue cannibalization\" as grid storage lowers power prices.</li><li><strong>Coal persistence:</strong> UK banks continue financing coal despite climate pledges, driven by energy security needs post-Ukraine invasion.</li></ul><p><strong>What's next:</strong> Watch for EU fiscal rule waivers and the outcome of White House lobbying as midterms approach.</p>", "corporate earnings and results": "<p>Global markets are reacting to a volatile mix of geopolitical instability and shifting trade routes.</p><p><strong>Why it matters:</strong> Inflation fears are driving a massive bond sell-off, forcing investors to pivot toward \"safe haven\" assets like German debt to protect capital.</p><p><strong>The big shifts</strong></p><ul><li><strong>Logistics:</strong> Arctic sea routes are quadrupling as shipping firms avoid Middle East conflict zones and leverage melting ice.</li><li><strong>E-commerce:</strong> Temu doubled UK sales to $171M by utilizing customs duty loopholes for small parcels.</li><li><strong>Infrastructure:</strong> Private equity firms (Brookfield, Apollo) are aggressively entering the European hostel market.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$21.2M:</strong> Annual rent Castle Hook is paying for a New York penthouse, signaling high-end commercial resilience.</li><li><strong>£2B:</strong> The value of the pending SkyNet satellite contract between Airbus and Lockheed Martin.</li><li><strong>2002:</strong> The historical benchmark for current 10-year US Treasury yields following a sharp sell-off.</li></ul><p><strong>Between the lines</strong> The divergence between US and German bonds suggests a lack of confidence in US inflation management. Simultaneously, the rise of long-range narrow-body planes is eroding the economic justification for expanding massive airport hubs like Heathrow.</p><p><strong>What's next</strong> Watch for the UK government's decision on the SkyNet contract to see if \"Buy British\" policies outweigh international competitive bidding.</p>", "middle east war": "<p>The Middle East is shifting toward a high-stakes confrontation between the U.S. and Iran as regional instability spills into global security.</p><p><strong>Why it matters:</strong> Iranian-linked activity is expanding from regional proxies to direct threats against Western soil and civil aviation. This escalation risks a wider war that could destabilize global energy markets.</p><p><strong>The security flashpoints</strong></p><ul><li><strong>UK targets:</strong> Authorities are investigating Iranian direction in a Manchester terror plot and a security breach at RAF Fairford.</li><li><strong>Aviation risk:</strong> A Flydubai flight to Tel Aviv was diverted after a cockpit attack, triggering terror probes in the UAE and Israel.</li><li><strong>U.S. buildup:</strong> Thousands of troops and the USS Theodore Roosevelt are deploying to the region as the Trump administration weighs strikes on Tehran.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Power vacuums:</strong> The total withdrawal of U.S. troops from Iraq leaves a void for Iran-backed militias to seize influence.</li><li><strong>Diplomatic fragility:</strong> While mediators attempt to break a seven-month deadlock, Saudi Arabia and the UAE are prioritizing internal rift-mending to maintain a united front.</li><li><strong>Syrian pivot:</strong> The new Islamist government in Syria is aggressively abandoning Assad’s protectionism for a free-market model.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>€100bn:</strong> Extra cost incurred by the EU since the Iran war began.</li><li><strong>150+:</strong> Passengers endangered during the Flydubai cockpit attack.</li><li><strong>20+:</strong> Years of U.S. military presence in Iraq ending with the final troop withdrawal.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Election volatility:</strong> Israel's Supreme Court has cleared Arab parties to run, potentially creating a hung parliament and shifting the balance of power.</li><li><strong>Energy shocks:</strong> EU ministers are meeting in Dublin to discuss releasing oil stocks to combat surging fuel costs.</li></ul>", "shipping": "<p>Geopolitical instability and climate volatility are dismantling the traditional global shipping order.</p><p><strong>Why it matters:</strong> Conflict in the Middle East and the rise of \"shadow fleets\" are decoupling vessel value from age and shifting trade away from historic chokepoints.</p><p><strong>The volatility loop</strong></p><ul><li><strong>Price spikes:</strong> Supertanker daily costs hit record $1.2M as Middle East-China routes tighten.</li><li><strong>Asset flip:</strong> Old tankers now command higher premiums than new builds due to immediate availability.</li><li><strong>Investment shift:</strong> Institutional investors are pivoting to shipping as a hedge via hard assets.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Route diversification:</strong> South Korea is prioritizing Arctic trade to bypass the Strait of Hormuz.</li><li><strong>Infrastructure risk:</strong> Dubai’s Jebel Ali port faces \"existential risk\" due to its dependence on a single volatile waterway.</li><li><strong>Nuclear ambition:</strong> The U.S. is planning a nuclear-powered merchant fleet by 2028 to counter Chinese shipbuilding dominance.</li></ul><p><strong>The \"Shadow\" economy</strong></p><ul><li><strong>Sanction evasion:</strong> Russia expanded its fleet by 33% to maintain fossil fuel exports.</li><li><strong>Regulatory collapse:</strong> 18 maritime authorities warn that wars and stateless vessels are causing a \"structural shift\" in global trade rules.</li></ul><p><strong>The green transition</strong></p><ul><li><strong>Fuel shift:</strong> Biodiesel is now cheaper than conventional fuels, accelerating emissions targets.</li><li><strong>Tech hybrid:</strong> Maersk is integrating wind sails alongside ammonia and methanol research to cut fuel consumption.</li></ul><p><strong>Critical vulnerabilities</strong></p><ul><li><strong>Cyber risk:</strong> Hackers are targeting satellite links connected to engine and navigation \"edge devices.\"</li><li><strong>Climate bottlenecks:</strong> Water shortages continue to force transit cuts at the Panama Canal.</li><li><strong>Safety gaps:</strong> Industry leaders warn that undeclared small batteries are increasing onboard fire risks.</li></ul>", "artificial intelligence": "<p>The AI industry is shifting from a phase of pure technical discovery to one of financial volatility and regulatory scrutiny.</p><p><strong>Why it matters:</strong> Massive capital expenditures are creating systemic financial risks and legal friction, forcing a pivot toward sustainable pricing and government oversight.</p><p><strong>The financial squeeze</strong></p><ul><li><strong>Balance sheet stress:</strong> Amazon is attempting to offload $8bn in Nvidia chips to investors to offset soaring AI spending.</li><li><strong>Debt warnings:</strong> The Bank of England and KKR warn that an AI borrowing spree could trigger a sharp market correction.</li><li><strong>Pricing crisis:</strong> Frontier labs are rethinking pricing models as powerful tools burn through budgets faster than they generate revenue.</li></ul><p><strong>Regulatory and legal friction</strong></p><ul><li><strong>Antitrust heat:</strong> The FTC has expanded investigations into OpenAI and Anthropic.</li><li><strong>Academic conflict:</strong> Students are hiring lawyers to fight AI misconduct charges as universities fail to establish clear policies.</li><li><strong>Security threats:</strong> OpenAI agents have been linked to obscured hacking activity in government site breaches.</li></ul><p><strong>Global infrastructure race</strong></p><ul><li><strong>Asian expansion:</strong> Japan is investing $140bn in data centers; Tencent is leasing 100,000 chips from Oracle to compete with ByteDance.</li><li><strong>Resource backlash:</strong> Google, Meta, and Microsoft formed the AI Infrastructure Coalition to mitigate energy and water usage concerns ahead of US elections.</li></ul><p><strong>Between the lines</strong> The \"circular financing\" and compute-rental markets suggest the AI boom is increasingly driven by financial engineering rather than immediate productivity gains. While models are getting smarter, physical-world bottlenecks are stalling actual scientific breakthroughs.</p>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The shift from \"win-win\" cooperation to strategic rivalry destabilizes global trade and security. This friction forces third-party nations to hedge their bets or align with a rising BRICS bloc.</p><p><strong>By the numbers:</strong></p><ul><li><strong>GDP Shift:</strong> BRICS now accounts for a larger share of the global economy than the G7.</li><li><strong>AI Lead:</strong> U.S. national data center projects are consolidating American dominance in artificial intelligence.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Reliability Gap:</strong> U.S. volatility regarding defense guarantees in South Korea and Japan is eroding trust in American security umbrellas.</li><li><strong>Diplomatic Friction:</strong> High-level summits are now viewed as tactical necessities rather than paths toward genuine détente.</li><li><strong>Institutional Flight:</strong> Potential U.S. funding cuts are prompting international organizations to consider relocating from Geneva to Gulf or European capitals.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>BRICS Expansion:</strong> Expect the bloc to leverage its economic weight to create alternatives to U.S.-led sanctions and financial systems.</li><li><strong>Regional Hedging:</strong> Middle powers (e.g., Pakistan, Oman) will increasingly play both sides to maximize investment and security.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>03 Oct 2026 14:51 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
