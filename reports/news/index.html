const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing under the weight of geopolitical deadlock and volatile pricing.</p><p><strong>Why it matters:</strong> Divergent interests between OPEC+ and climate-focused coalitions are stalling global policy. This instability triggers immediate price spikes for consumers and disrupts industrial production.</p><p><strong>The friction points</strong></p><ul><li><strong>Diplomatic failure:</strong> COP31 ended without a fossil fuel phaseout agreement due to \"unbridgeable\" red lines between the EU and Saudi Arabia.</li><li><strong>Cartel tension:</strong> OPEC+ faces a potential clash over production estimates as markets shift toward oversupply.</li><li><strong>Cyber risk:</strong> U.S. crude export hubs are reporting thousands of daily hacking attempts, threatening trade stability.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>26%:</strong> The projected increase in British household energy bills starting January.</li><li><strong>33%:</strong> The portion of Europe's ammonia output currently suspended due to soaring energy costs.</li><li><strong>$3.4B:</strong> The value of contracts at the center of a Petrofac bribery trial involving UAE deals.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Energy security vs. Climate:</strong> The pivot from \"phaseout\" to \"carbon capture\" at COP31 signals a retreat toward energy security over aggressive decarbonization.</li><li><strong>Hydrogen hurdles:</strong> China's hydrogen transport ambitions are stalling due to high costs and disappearing subsidies.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market leverage:</strong> Watch for DR Congo's cobalt export ban to influence critical mineral pricing.</li><li><strong>Infrastructure bets:</strong> The Acorn carbon capture project's new investment indicates a shift toward industrial-scale carbon removal to meet 1.5C targets.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are increasingly volatile as the \"AI trade\" faces a critical reality check.</p><p><strong>Why it matters:</strong> Market concentration in a few tech giants creates systemic risk. When leaders like Nvidia face regulatory scrutiny or demand shifts, the ripple effect destabilizes broader indices.</p><p><strong>Between the lines</strong></p><ul><li><strong>AI Fatigue:</strong> Discrepancies between frontier lab growth predictions and actual corporate productivity are fueling investor skepticism.</li><li><strong>Regulatory Headwinds:</strong> Federal and state investigations into Nvidia and CEO Jensen Huang introduce governance risks that could cap valuation premiums.</li><li><strong>Sovereign Shifts:</strong> Europe and China are pivoting toward \"sovereign AI\" to reduce dependence on U.S. tech, potentially limiting the long-term addressable market for American chipmakers.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>96%:</strong> The drop in EasyJet profits, driven by soaring fuel costs and declining consumer demand.</li><li><strong>€500M+:</strong> Fines imposed on fragrance makers for price-fixing cartels.</li><li><strong>$100M:</strong> The settlement Shein will pay to resolve U.S. consumer deception allegations.</li></ul><p><strong>What's next:</strong> Watch for the OpenAI IPO. The high valuation benchmarks set by Anthropic have created a \"hard act to follow,\" raising the stakes for the next wave of AI listings.</p>", "middle east war": "<p>The U.S. and Iran are locked in a cycle of direct military escalation and cyber warfare that threatens global energy stability.</p><p><strong>Why it matters:</strong> Tit-for-tat strikes in Bahrain, Kuwait, and the Strait of Hormuz risk a full-scale regional war. This volatility strains U.S. military readiness and disrupts critical oil shipping lanes.</p><p><strong>The escalation map</strong></p><ul><li><strong>Kinetic strikes:</strong> U.S. forces hit Qeshm Island following Iranian attacks on a Bahrain base.</li><li><strong>Houthi activity:</strong> Rebels struck the Saudi Public Investment Fund (PIF) tower in Riyadh, targeting the kingdom's economic nerve center.</li><li><strong>Cyber warfare:</strong> The IRGC's \"Shahid Kaveh\" unit is targeting U.S. and European industrial control systems.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>11:</strong> People injured in the Houthi strike on the Saudi sovereign wealth fund HQ.</li><li><strong>74:</strong> Lashes administered to an Iranian singer, signaling continued internal repression amid external conflict.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic decoupling:</strong> The IEA suggests global markets can eventually bypass the Strait of Hormuz, reducing Iran's primary geopolitical lever.</li><li><strong>Political fragility:</strong> In Israel, the election of a new parliamentary Speaker marks a strategic setback for Netanyahu’s far-right coalition.</li></ul><p><strong>What's next</strong></p><ul><li><strong>U.S. Strategy:</strong> The Trump administration is weighing new strikes against Iran while facing warnings from military officials regarding force exhaustion and budget cuts.</li><li><strong>Regional Power Shifts:</strong> Iraq is moving to seize Kurdish-held oilfields to consolidate central government power.</li></ul>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict transforms primary trade arteries into active war zones.</p><p><strong>Why it matters:</strong> Escalating attacks in the Black Sea and Strait of Hormuz are driving up operational costs and forcing a radical reconfiguration of global logistics.</p><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24:</strong> Tankers targeted by Iran in a two-week span.</li><li><strong>24.6 million:</strong> Daily barrels of oil exported from the Gulf, recovering to pre-war levels via alternative routes.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Tactical shifts:</strong> Iran is moving from harassment to direct sabotage, utilizing limpet mines and speedboat attacks.</li><li><strong>Deception:</strong> Russia is employing coordinated \"spoofing\" to hide tanker locations, complicating sanction enforcement.</li><li><strong>Infrastructure pivot:</strong> Trade flows are shifting; London Gateway is poised to overtake Felixstowe due to a surge in Chinese EV imports.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Arctic routes:</strong> Russia is increasingly forced to move grain via the Arctic to bypass Black Sea hostilities, raising costs for global buyers.</li><li><strong>Legal battles:</strong> A court case between Mercuria and the Baltic Exchange will determine the validity of shipping price estimates in conflict zones.</li><li><strong>Political friction:</strong> U.S. state-level officials may block Russian diesel shipments, challenging federal attempts to lower fuel prices.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is transitioning from a period of hype to a phase of systemic friction and operational risk.</p><p><strong>Why it matters:</strong> Rapid adoption is exposing critical gaps in regulatory oversight, cybersecurity, and corporate governance. The technology is creating new vulnerabilities in financial security and intellectual property protection.</p><p><strong>The Nvidia Factor</strong></p><ul><li>Jensen Huang's return as CEO, orchestrated by Donald Trump, added nearly $1tn to the company's valuation.</li><li>The move underscores the geopolitical weight of chip production and the fragility of U.S.-China tech relations.</li></ul><p><strong>The Hidden Costs</strong></p><ul><li><strong>Financial Crime:</strong> AI-powered \"industrialized\" scams cost UK victims £659mn in the first half of 2026.</li><li><strong>Operational Drag:</strong> Researchers find that AI efficiency can stifle the \"friction\" necessary for human creativity.</li><li><strong>Security Breaches:</strong> Recent OpenAI legal battles highlight risks of internal espionage and data theft.</li></ul><p><strong>Sector Realities</strong></p><ul><li><strong>Healthcare:</strong> AI is a tool for drug discovery, not a replacement for the complex biological discovery process.</li><li><strong>Education:</strong> The UK is now implementing checklists to protect schoolchildren from unregulated AI use.</li><li><strong>Markets:</strong> IPO volatility for AI firms like Nscale and Anthropic suggests investor appetite is cooling.</li></ul><p><strong>What's next:</strong> Expect a shift toward \"defensive AI\"—prioritizing security, rare earth supply chains, and strict regulatory frameworks over raw growth.</p>", "us-china relations": "<p>The U.S., China, and Russia are attempting to establish a \"Yalta 2.0\" framework to carve up global spheres of influence.</p><p><strong>Why it matters:</strong> A trilateral agreement between Trump, Xi, and Putin would effectively sideline middle powers and dismantle the current rules-based international order. This shift prioritizes great-power stability over democratic sovereignty.</p><p><strong>Between the lines</strong></p><ul><li><strong>China's gain:</strong> Xi is leveraging the summit to project global leadership and reshape the international order on Beijing's terms.</li><li><strong>Russia's win:</strong> Putin is using the meeting to break diplomatic isolation and seek legitimacy for territorial gains in Europe.</li><li><strong>U.S. pivot:</strong> The Trump administration is prioritizing a rapid peace deal in Ukraine to secure a geopolitical \"win\" before domestic political shifts.</li></ul><p><strong>The risk to middle powers</strong></p><ul><li>Smaller nations face increased dependency as AI dominance and economic security concentrate in the U.S. and China.</li><li>\"Middle power\" cooperation on supply chains is an attempt to avoid becoming hostages to this new trilateral geopolitics.</li></ul><p><strong>What's next:</strong> Watch for a \"joint statement\" from the trilateral summit that could formally redefine security boundaries in Eastern Europe and the Indo-Pacific.</p>", "us elections": "<p>Democrats secured a sweeping victory in the U.S. midterms, seizing control of the House and expanding their Senate majority.</p><p><strong>Why it matters:</strong> This shift fundamentally alters the balance of power in Washington. Democrats now possess the legislative leverage to launch aggressive corruption investigations into the Trump administration and block key appointments.</p><p><strong>By the numbers:</strong></p><ul><li><strong>56:</strong> The Democratic tally in the 100-member Senate.</li><li><strong>$500M:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>1881:</strong> The last time a Black senator represented Mississippi until Scott Colom's historic win.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Strategic pivot:</strong> Democrats are shifting focus from \"woke\" culture war issues toward class-based economic politics.</li><li><strong>Demographic shift:</strong> Older voters, traditionally a GOP stronghold, drove the \"blue wave.\"</li><li><strong>GOP failure:</strong> Extensive gerrymandering efforts failed to stop the Democratic surge.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Leadership transitions:</strong> Hakeem Jeffries is positioned to become the first Black Speaker of the House.</li><li><strong>Oversight:</strong> House Democrats plan to prioritize investigations into administration conflicts of interest.</li><li><strong>Internal strife:</strong> Republicans are debating whether to distance themselves from Donald Trump to regain voter trust.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is aggressively pivoting Germany toward a \"security-first\" posture amid rising Russian aggression and domestic political instability.</p><p><strong>Why it matters:</strong> Germany is abandoning its historic reluctance toward military leadership to prevent European destabilization. This shift creates friction between fiscal conservatives and urgent defense needs.</p><p><strong>The security pivot</strong></p><ul><li><strong>Ukraine support:</strong> Merz is using EU budget leverage to force unanimous funding for Kyiv.</li><li><strong>Military leadership:</strong> The appointment of Christian Freuding as armed forces chief signals a deeper operational tie to Ukraine.</li><li><strong>Intelligence surge:</strong> New sweeping surveillance powers aim to counter \"intense\" Russian espionage and hacking of government officials.</li></ul><p><strong>Internal fractures</strong></p><ul><li><strong>Coalition instability:</strong> The resignation of Labor Minister Bärbel Bas stalls critical pension and market reforms.</li><li><strong>The AfD threat:</strong> The far-right is gaining institutional footholds, including its first regional parliament president.</li><li><strong>Fiscal tension:</strong> The Council of Economic Experts warns against defense borrowing to avoid a debt-to-GDP crisis by 2040.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>EU tensions:</strong> France is demanding clarity on Germany's long-range missile doctrine to avoid accidental nuclear escalation.</li><li><strong>Defense setbacks:</strong> Italy rejected Germany's bid to join the UK-Japan-Italy next-gen fighter project as an equal partner.</li></ul><p><strong>What's next:</strong> Merz must balance unpopular economic reforms with a massive military buildup while attempting to maintain a \"firewall\" against the surging AfD.</p>", "central banks": "<p>Central banks are pivoting toward aggressive, fragmented strategies to combat stubborn inflation and emerging systemic risks.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing the Fed, ECB, and BoE to prioritize \"higher for longer\" rates over growth, while AI-driven debt creates new financial stability vulnerabilities.</p><p><strong>The global outlook</strong></p><ul><li><strong>Federal Reserve:</strong> Weighing a 50bp hike in December due to strong jobs and inflation data; balance sheet may expand temporarily to ease money market stress.</li><li><strong>ECB:</strong> Preparing for further tightening as core inflation exceeds the 2% target; leadership transition is underway to replace Christine Lagarde.</li><li><strong>Bank of England:</strong> Raised rates to 4% with a hawkish signal that more increases are likely to prevent entrenched inflation.</li><li><strong>Bank of Japan:</strong> Rate hikes in December are unlikely following a contraction in quarterly GDP.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Risk:</strong> The ECB warns that \"hyperscaler\" borrowing patterns mirror the subprime bubble, citing trillions in off-balance sheet commitments.</li><li><strong>Growth Paradox:</strong> Some officials argue AI innovation could sustain higher GDP growth without triggering inflation.</li><li><strong>Policy Lag:</strong> The BoE is facing criticism for a slipping record on inflation control compared to international peers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership:</strong> Brussels is finalizing nominations for the ECB presidency.</li><li><strong>Market Shift:</strong> UK mortgage market changes may force the BoE to cut rates \"far and fast\" in the future to avoid systemic collapse.</li></ul>", "us banks": "<p>Wall Street is leveraging a trading boom to offset regulatory fines and the disruptive threat of AI.</p><p><strong>Why it matters:</strong> High-volume equities trading is masking structural vulnerabilities, including systemic compliance failures and the risk of AI-driven deposit flight.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks if AI agents shift deposits to higher-yielding accounts.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, driven by equities.</li><li><strong>$350 million:</strong> Amex fine for failing to flag suspicious transactions.</li><li><strong>$1.2 billion:</strong> Bank of America's money laundering fine, contributing to a 17% profit drop.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Paradox:</strong> Banks are integrating AI to improve supervision and efficiency, yet they are restricting AI agents to prevent \"automated\" outflows of capital.</li><li><strong>Talent War:</strong> Citi is shortening analyst programs to two years to stop private equity firms from poaching junior talent.</li><li><strong>Private Credit:</strong> Traditional banks are regaining ground as borrowers seek more flexible options between bank and non-bank lenders.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Friction:</strong> Expect increased tension between the US and EU over banking reforms and disputes over \"unfair\" national taxes.</li><li><strong>China Expansion:</strong> Citi will scale its securities business in China following long-awaited regulatory approval.</li><li><strong>Leadership Shifts:</strong> Goldman Sachs and Evercore are restructuring executive ranks to manage succession and reward top engineering talent.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>25 Nov 2026 20:03 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
