const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and the race for critical minerals are destabilizing global energy markets.</p><p><strong>Why it matters:</strong></p><ul><li>Conflict in the Strait of Hormuz is removing up to 13 million barrels of oil per day, erasing global supply buffers.</li><li>Western nations are aggressively diversifying fuel and mineral sources to break dependence on Russia and China.</li></ul><p><strong>The energy shock</strong></p><ul><li><strong>Oil:</strong> Chevron warns of summer price spikes as the Hormuz blockade chokes supply.</li><li><strong>Electricity:</strong> Iraq faces summer blackouts due to its reliance on Iranian gas.</li><li><strong>Industry:</strong> India's glass sector is stalling as energy imports drop.</li></ul><p><strong>The critical minerals race</strong></p><ul><li><strong>Uranium:</strong> Urenco is investing billions in New Mexico to replace banned Russian imports.</li><li><strong>Lithium:</strong> Atana Elements is drilling under German battery factories to bypass China.</li><li><strong>Tungsten:</strong> Chinese demand is driving up prices and triggering US calls for export restrictions.</li></ul><p><strong>Corporate turmoil</strong></p><ul><li><strong>BP:</strong> CEO Meg O'Neill is managing a turnaround amid the removal of Chair Albert Manifold following conduct allegations.</li><li><strong>TotalEnergies:</strong> Shareholders extended Patrick Pouyanné’s tenure beyond 2030 to ensure leadership stability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Nuclear expansion:</strong> India is preparing to open nuclear power construction to private conglomerates like Tata and Adani.</li><li><strong>Policy shift:</strong> Market volatility is increasing pressure on governments to provide clear policy frameworks for the energy transition.</li></ul>", "corporate earnings and results": "<p>Corporate capital is shifting toward AI infrastructure and geopolitical risk mitigation.</p><p><strong>Why it matters:</strong> Massive equity raises and strategic pivots signal that AI is no longer a speculative bet but a capital-intensive arms race. Simultaneously, regional instability is forcing energy and transport firms to diversify physical assets.</p><p><strong>The AI Capital Crunch</strong></p><ul><li><strong>Alphabet:</strong> Raising $80bn via share sales to fund AI scaling.</li><li><strong>Tencent:</strong> Accelerating AI agent deployment for WeChat to close the gap with domestic rivals.</li><li><strong>Accenture:</strong> Facing a share price rout as investors fear AI will automate traditional IT consulting.</li><li><strong>Anthropic:</strong> Expanding its cybersecurity model, Mythos, to 15+ countries.</li></ul><p><strong>Geopolitical Hedging</strong></p><ul><li><strong>Adnoc:</strong> Building a new UAE pipeline to bypass the Strait of Hormuz.</li><li><strong>Dynacom:</strong> Positioning tankers near the strait to capitalize on potential reopenings.</li><li><strong>EasyJet:</strong> Emerging as a takeover target for Castlelake as regional conflict disrupts travel.</li></ul><p><strong>Market Shifts</strong></p><ul><li><strong>M&A:</strong> Hellman & Friedman acquired Hyve for $1.8bn, betting on the return of in-person events.</li><li><strong>IPOs:</strong> Market sentiment suggests a massive surge in public offerings, mirroring the 1999 boom.</li><li><strong>Reserve Assets:</strong> Gold has overtaken US Treasuries as the primary global reserve asset.</li></ul><p><strong>What's next:</strong> Watch for further \"big number\" equity raises from Big Tech as the cost of training conscious-capable AI models scales.</p>", "middle east war": "<p>The Middle East is locked in a volatile cycle of tactical escalation and fragile ceasefire negotiations.</p><p><strong>Why it matters:</strong> Unpredictable military strikes are colliding with high-stakes diplomacy, creating extreme volatility for global energy markets and regional stability.</p><p><strong>The current state of play</strong></p><ul><li><strong>Israel:</strong> PM Netanyahu is expanding offensives in southern Lebanon and Gaza, despite facing domestic and U.S. pressure to scale back.</li><li><strong>Iran:</strong> Tehran is leveraging Western AI for cyber warfare while remaining skeptical of U.S. ceasefire concessions.</li><li><strong>U.S.:</strong> The Trump administration is pushing for a \"great deal\" with Iran, alternating between diplomatic patience and threats of renewed attacks.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>1 million:</strong> People displaced in Lebanon.</li><li><strong>3.2%:</strong> Eurozone inflation in May, driven by Middle East energy shocks.</li><li><strong>70%:</strong> The portion of Gaza Netanyahu has ordered Israeli forces to control.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market sensitivity:</strong> U.S. stocks and oil prices are reacting in real-time to rumors of a U.S.-Iran deal, showing that investor confidence is now tied to ceasefire timelines.</li><li><strong>Diplomatic friction:</strong> The gap between Netanyahu's military objectives and Trump's desire for a deal is creating a strategic rift in U.S.-Israel coordination.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Security talks:</strong> Washington is scheduled to host security meetings to prevent further escalation between Israel and Hezbollah.</li><li><strong>Energy volatility:</strong> Oil prices will fluctuate based on whether the Strait of Hormuz remains open and if a formal U.S.-Iran ceasefire is signed.</li></ul>", "shipping": "<p>Global shipping is fracturing as conflict in the Strait of Hormuz disrupts energy flows and forces a permanent reshaping of trade routes.</p><p><strong>Why it matters:</strong> Blockages in narrow waterways trigger immediate spikes in freight costs and force nations to pivot to inferior energy alternatives. This instability accelerates the shift toward diversified, non-traditional logistics hubs.</p><p><strong>The Gulf Crisis</strong></p><ul><li><strong>Operational risk:</strong> \"Shadow fleet\" tankers—ageing, sanctioned vessels—increase the probability of environmental disasters.</li><li><strong>Logistics shift:</strong> Freight rates are surging as companies switch to trucks to bypass maritime bottlenecks.</li><li><strong>Financial failure:</strong> A $40bn U.S. insurance facility has seen zero uptake because it lacks naval escorts.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk due to the Iran conflict.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert from Middle East routes.</li><li><strong>$1.3 billion:</strong> Belfast Harbour's investment to capture freight diverted from rivals.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Energy pivots:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li><li><strong>Regulatory deadlock:</strong> U.S. blocking tactics are stalling global agreements on shipping carbon levies.</li><li><strong>Last-mile evolution:</strong> Retailers like Walmart are repurposing drugstores as stockrooms to bypass traditional shipping delays.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route permanence:</strong> Panama Canal leadership expects global trading routes to be permanently altered.</li><li><strong>Environmental pressure:</strong> International clashes will continue over the framework for regulating sector emissions.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is triggering a massive global reallocation of capital and legal scrutiny.</p><p><strong>Why it matters:</strong> Massive infrastructure spending is driving market valuations higher, while regulatory and social backlash creates significant operational risk for developers.</p><p><strong>By the numbers</strong></p><ul><li><strong>$80 billion:</strong> Amount Alphabet plans to raise in stock sales to fund AI spending.</li><li><strong>€75 billion:</strong> SoftBank's pledge for a massive AI facility in France.</li><li><strong>37%:</strong> Jump in HPE shares due to surging demand for AI servers.</li><li><strong>200%:</strong> Intel's share rally this year as it targets new inference GPUs.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure race:</strong> Investment is shifting from software to \"gigafactories\" and data centers to secure digital sovereignty in Europe.</li><li><strong>Market volatility:</strong> Wall Street is betting on continued gains despite growing \"bubble\" fears and concerns over AI's impact on GDP.</li><li><strong>Social friction:</strong> Gen Z users report increasing anxiety over job prospects and creativity, while Florida is pursuing litigation over harms to children.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Public markets:</strong> Anthropic's IPO will test investor appetite for standalone AI firms.</li><li><strong>Ethical boundaries:</strong> The UK military is weighing the legality of autonomous lethal strikes.</li><li><strong>Hardware pivot:</strong> Intel aims to release a new AI data center chip by year-end to regain competitive footing.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global influence as Washington retreats from traditional leadership.</p><p><strong>Why it matters:</strong> Beijing is leveraging U.S. volatility to position itself as a stable alternative for global partners. This shift creates a power vacuum that threatens existing multilateral governance.</p><p><strong>The strategic shift</strong></p><ul><li><strong>China's gain:</strong> Beijing is building soft power and attracting foreign officials while the U.S. burns diplomatic bridges.</li><li><strong>Russia's role:</strong> Putin’s strategic errors have forced Russia into a subordinate, one-sided dependency on China.</li><li><strong>U.S. instability:</strong> Pre-emptive strikes and unpredictable foreign policy are eroding trust among NATO allies.</li></ul><p><strong>Between the lines</strong></p><ul><li>Hegemony is decoupling from responsibility. Neither power is currently willing to shoulder the costs of global stability.</li><li>Power now flows from asymmetry and leverage rather than raw economic size or military wealth.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic pivots:</strong> Expect a rise in \"middleman\" diplomacy and special envoys to bypass rigid institutional failures.</li><li><strong>Institutional crisis:</strong> The UN and other multilateral bodies must reinvent their governance or face total irrelevance.</li><li><strong>Risk evolution:</strong> Global businesses are shifting curricula toward geopolitics to manage permanent instability.</li></ul>", "us elections": "<p>The U.S. midterm landscape is shifting as Donald Trump’s influence over the GOP clashes with general election viability.</p><p><strong>Why it matters:</strong> Trump's preference for \"MAGA warriors\" secures his grip on the party base but creates openings for Democrats in swing states. Economic dissatisfaction and internal GOP fractures are eroding Republican advantages.</p><p><strong>The Texas Tension</strong></p><ul><li>Trump-backed Ken Paxton won the primary, signaling the president's enduring hold on the GOP.</li><li>Democrats view Paxton’s controversial profile as a liability that could flip the Senate seat in November.</li></ul><p><strong>Strategic Shifts</strong></p><ul><li><strong>Democrats:</strong> Pivoting toward working-class and populist candidates to regain lost voters, evidenced by primary wins in Pennsylvania.</li><li><strong>Republicans:</strong> Facing a \"MAGA divorce\" as nationalists claim Trump betrayed \"America First\" pledges regarding the Iran war.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.8 billion:</strong> The cost of Trump's proposed \"anti-weaponization\" fund, currently stalled by skeptical GOP senators.</li><li><strong>>50%:</strong> The share of voters who disapprove of Trump’s economic handling, according to FT polling.</li></ul><p><strong>Between the lines</strong> The GOP is experiencing a generational rightward shift. While this consolidates power for the Trump wing, it risks alienating moderate voters in critical battlegrounds like Maine and Texas.</p><p><strong>What's next</strong></p><ul><li><strong>Midterm volatility:</strong> Watch if populist Democratic candidates can successfully peel away working-class Republicans.</li><li><strong>2028 positioning:</strong> JD Vance and Marco Rubio are already emerging as primary contenders for the future White House ticket.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military expansion while facing severe diplomatic friction with the U.S. and internal political instability.</p><p><strong>Why it matters:</strong> Berlin is abandoning its post-WWII pacifist identity to lead European defense, but this shift is triggering a volatile relationship with Donald Trump and fueling far-right populism at home.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit NATO's 3.5% GDP target six years ahead of schedule.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency and buying a 40% stake in tank maker KNDS to accelerate production.</li><li><strong>Strategy:</strong> Germany published its first formal military strategy since WWII, signaling a permanent increase in European security responsibility.</li></ul><p><strong>The Trump friction</strong></p><ul><li><strong>Diplomatic rift:</strong> Chancellor Friedrich Merz’s criticism of U.S. strategy in Iran has soured relations with the White House.</li><li><strong>Retaliation:</strong> The Pentagon is reviewing troop levels and pulling 5,000 soldiers out of Germany.</li><li><strong>Urgency:</strong> Despite the row, Berlin is pushing to purchase Tomahawk missiles to secure its deterrent.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Leadership:</strong> Merz faces a \"chancellor swap\" threat as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Far-right surge:</strong> The AfD is topping polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>Legal blows:</strong> A Berlin court ordered the AfD to return €2.35 million in illegal donations.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Fiscal discipline:</strong> Finance Minister is threatening to cut funding for ministries that fail to spend a €500bn infrastructure fund.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>EU Integration:</strong> Germany is prioritizing a Capital Markets Union over national interests to boost financial services.</li></ul>", "central banks": "<p>Central banks are navigating a volatile transition marked by sticky inflation, geopolitical instability, and threats to institutional independence.</p><p><strong>Why it matters:</strong> Persistent price pressures and political interference are eroding the \"policy put,\" leaving central banks with fewer tools to stabilize markets during shocks.</p><p><strong>The inflation tug-of-war</strong></p><ul><li><strong>ECB:</strong> Preparing for a June rate hike as core inflation rises and energy costs spill into the wider economy.</li><li><strong>Fed/BoE:</strong> Signaling a \"hold\" pattern, though internal Fed minutes show growing alarm over Iran-driven inflation.</li><li><strong>BoJ:</strong> Moving forward with a rate increase scheduled for June.</li></ul><p><strong>Institutional instability</strong></p><ul><li><strong>Political pressure:</strong> Former Fed Chair Powell warns that attempts to fire central bankers undermine the rule of law.</li><li><strong>Fiscal constraints:</strong> Demographics and rising debt costs—exacerbated by conflict in Iran—are limiting the effectiveness of independent monetary policy.</li><li><strong>Reserve shifts:</strong> Gold has overtaken US Treasuries as the top global reserve asset (27% share) as banks diversify away from the dollar.</li></ul><p><strong>Technological pivots</strong></p><ul><li><strong>Blockchain:</strong> The Fed and BoE successfully tested a prototype for near-instantaneous cross-border payments.</li><li><strong>AI Risks:</strong> The ECB is summoning banks to address systemic financial flaws exposed by new AI models.</li><li><strong>GDP Boost:</strong> South Korea reports that AI-driven chip demand is currently outweighing the economic pain of regional wars.</li></ul><p><strong>What's next:</strong> Markets are betting on a 2026 rate rise under new Fed leadership as the \"Warsh inheritance\" faces a combination of rising inflation and geopolitical volatility.</p>", "us banks": "<p>US banks are aggressively expanding balance sheets and international footprints as deregulation unlocks massive capital.</p><p><strong>Why it matters:</strong> Lighter regulatory oversight under the Trump administration is freeing billions in excess capital, giving US lenders a competitive edge over constrained EU and Swiss rivals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital handed back to top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital freed at JPMorgan alone.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering.</li><li><strong>$40 billion:</strong> Record revenue for trading firm Jane Street.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk shifting:</strong> Banks are offloading private equity-linked loans and AI-driven data center debt to avoid overexposure.</li><li><strong>Geopolitical friction:</strong> Security concerns are forcing operational splits, evidenced by Morgan Stanley issuing China-only iPhones to Hong Kong staff.</li><li><strong>Strategic pivots:</strong> Citi is shifting to direct employee incentives for referrals to accelerate its turnaround.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail push:</strong> JPMorgan is scaling its digital \"Chase\" brand into Germany.</li><li><strong>Product expansion:</strong> Morgan Stanley is integrating spot crypto trading into E*Trade.</li><li><strong>Treasury surge:</strong> Primary dealers are boosting government debt holdings to their highest levels since 2007.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>02 Jun 2026 14:40 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
