const SUMMARIES = {"oil and gas": "<p>Global energy markets are facing a volatile convergence of geopolitical instability, corporate governance crises, and infrastructure fragility.</p><p><strong>Why it matters:</strong> Supply shocks in the Middle East and political instability in Africa are tightening global inventories. Simultaneously, internal turmoil at \"supermajors\" like BP threatens strategic continuity during the energy transition.</p><p><strong>By the numbers</strong></p><ul><li><strong>13 million:</strong> Barrels per day removed from global markets due to the Strait of Hormuz blockade.</li><li><strong>13%:</strong> Expected rise in UK household energy bills starting July.</li><li><strong>$4 billion:</strong> Value of Zijin's stalled acquisition of Allied Gold.</li><li><strong>£4.5 billion:</strong> Record debt owed by British customers to power suppliers.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Governance collapse:</strong> BP's removal of Chair Albert Manifold over bullying allegations marks the fourth leadership change in three years, signaling deep dysfunction.</li><li><strong>Geopolitical risk:</strong> Iraq's dependence on Iranian gas and Mali's arrest of foreign executives highlight the fragility of energy supply chains in unstable regions.</li><li><strong>Transition friction:</strong> EU member states are pushing for carbon cost shields, while state oil companies risk obsolescence by ignoring long-term decarbonization trends.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Price spikes:</strong> Chevron warns of summer price jumps as \"shock absorbers\" in global supply dwindle.</li><li><strong>Power instability:</strong> Iraq faces imminent summer blackouts as temperatures exceed 45C.</li><li><strong>Strategic shifts:</strong> Data center operators are aggressively acquiring energy firms to secure power for AI infrastructure.</li></ul>", "corporate earnings and results": "<p>Market volatility and geopolitical tension are driving divergent corporate financial outcomes.</p><p><strong>Why it matters:</strong> High-frequency trading firms are capitalizing on instability while consumer-facing brands face structural demand shocks.</p><p><strong>The winners</strong></p><ul><li><strong>Citadel Securities:</strong> Posted record $4.3B in trading revenues, fueled by Iran-driven volatility in oil and Treasury rates.</li><li><strong>US Equities:</strong> Achieved the longest weekly winning streak since 2023, driven by AI optimism and ceasefire hopes.</li></ul><p><strong>The losers</strong></p><ul><li><strong>Durex:</strong> Sales are declining due to Chinese government crackdowns on contraceptives to boost birth rates.</li><li><strong>Enhanced Games:</strong> Valuation plummeted from $1.2B to $350M.</li><li><strong>Aviva:</strong> Share price has dropped 8% year-to-date.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asset Liquidity:</strong> Crypto-heavy treasuries are shifting toward risky equity to generate cash.</li><li><strong>Regulatory Shift:</strong> The SEC is moving to overturn Biden-era climate risk disclosure requirements, citing regulatory overreach.</li><li><strong>M&A Trends:</strong> Private credit firms (Castlelake) and building societies (Atom) are targeting undervalued UK assets to take them off public markets.</li></ul>", "middle east war": "<p>The U.S. and Iran are locked in a high-stakes diplomatic gamble to end active hostilities while Israel intensifies military operations in Gaza and Lebanon.</p><p><strong>Why it matters:</strong> A failure to secure a U.S.-Iran deal risks a regional escalation that could destabilize global energy markets and prolong the humanitarian crisis in Palestine.</p><p><strong>The diplomatic friction</strong></p><ul><li><strong>The U.S. position:</strong> The Trump administration is pursuing a \"great deal\" but maintains a policy of \"strategic patience,\" backed by the threat of renewed attacks.</li><li><strong>The Iran dilemma:</strong> Tehran is split between negotiators seeking a ceasefire and ultra-hardliners who view U.S. concessions as a trap.</li><li><strong>The volatility:</strong> Frequent ceasefire violations and drone exchanges continue despite back-channel talks.</li></ul><p><strong>The Israeli offensive</strong></p><ul><li><strong>Gaza:</strong> Prime Minister Netanyahu has ordered the military to seize 70% of the enclave to \"squeeze\" Hamas.</li><li><strong>Lebanon:</strong> Israel is ratcheting up bombing campaigns in Beirut and against Hezbollah.</li><li><strong>Human Rights:</strong> A UN report accuses the IDF of committing sexual violence against Palestinians.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Oil:</strong> Brent crude saw its biggest monthly decline since 2020 on hopes of a Strait of Hormuz reopening.</li><li><strong>Finance:</strong> The \"Board of Peace\" fund remains empty despite $17 billion in pledges for Gaza.</li><li><strong>Media:</strong> UK-based Iran International received £650 million in debt relief to sustain opposition broadcasting.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Security talks:</strong> Washington is hosting critical meetings between regional actors to prevent total war.</li><li><strong>Economic pressure:</strong> Trump has signaled that rising economic costs will not force him into a suboptimal agreement.</li></ul>", "shipping": "<p>The conflict in the Strait of Hormuz is destabilizing global energy flows and forcing a permanent restructuring of maritime trade routes.</p><p><strong>Why it matters:</strong> Disruption in this critical chokepoint triggers immediate volatility in oil prices and forces shippers to adopt costlier, longer alternatives to avoid seizure or attack.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert from the Middle East.</li><li><strong>$0:</strong> Total utilization of the U.S. $40bn insurance facility due to lack of naval escorts.</li><li><strong>6%:</strong> Drop in Brent crude prices following the successful passage of two China-bound supertankers.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Asian nations are spiking coal imports to replace disrupted gas supplies.</li><li><strong>Logistical failures:</strong> Cargo is shifting from ships to trucks in the Gulf, drastically increasing costs while reducing volume.</li><li><strong>Operational decay:</strong> Stranded vessels face biological degradation (barnacles/jellyfish), threatening their ability to sail once the conflict ends.</li><li><strong>Regulatory deadlock:</strong> U.S. opposition is stalling global agreements on shipping carbon levies.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route permanence:</strong> The Panama Canal expects a permanent shift in global trading patterns.</li><li><strong>Infrastructure bets:</strong> Regional ports, such as Belfast, are investing heavily (£1.3bn) to capture freight diverted from traditional hubs.</li><li><strong>Surveillance surge:</strong> Demand for real-time ship-tracking apps (e.g., Kpler) will remain high as traders monitor energy flows.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative software boom to a high-stakes infrastructure and geopolitical arms race.</p><p><strong>Why it matters:</strong> Massive capital expenditures in semiconductors and data centers are outpacing clear revenue models, creating a volatile economic bubble. Simultaneously, the integration of AI into lethal weaponry and public governance is outstripping existing regulatory frameworks.</p><p><strong>By the numbers</strong></p><ul><li><strong>$965 billion:</strong> Anthropic's valuation following a $65 billion funding deal.</li><li><strong>$500 million:</strong> Investment by Kirkland & Ellis to build proprietary legal AI.</li><li><strong>75%:</strong> Projected gains for the Philadelphia Semiconductor Index by 2026.</li><li><strong>$250 million:</strong> OpenAI's initial research spend on AI's economic impact.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Efficiency vs. Utility:</strong> Amazon's removal of AI leaderboards suggests a corporate pivot from \"adoption at any cost\" to measurable ROI.</li><li><strong>Sovereignty shifts:</strong> The EU is moving from a purely regulatory stance to actively funding domestic services to reduce U.S. dependency.</li><li><strong>Accountability gap:</strong> The push for autonomous lethal strikes in the UK highlights a growing tension between military speed and human oversight.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory clash:</strong> Expect increased friction between \"fast-mover\" tech companies and elected officials seeking to close accountability loopholes.</li><li><strong>Labor volatility:</strong> Divergent economic models on job displacement will lead to inconsistent policy responses across different sectors.</li><li><strong>Infrastructure stress:</strong> The \"chip frenzy\" will continue until software applications can justify the massive hardware spend.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic struggle for global influence as traditional power structures fracture.</p><p><strong>Why it matters:</strong> Washington's erratic diplomacy and military overreach are creating a leadership vacuum. Beijing is exploiting this gap to position itself as a stable alternative for the Global South.</p><p><strong>The power shift</strong></p><ul><li><strong>Asymmetric leverage:</strong> Power now derives from converting imbalances into leverage rather than raw wealth or size.</li><li><strong>Soft power flip:</strong> Beijing's image is improving as the U.S. burns diplomatic bridges.</li><li><strong>Russia's dependency:</strong> Putin's strategic errors have forced Russia into a one-sided, subordinate relationship with China.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hegemony without responsibility:</strong> Both superpowers seek dominance but avoid the costs of maintaining global order.</li><li><strong>The \"Stalemate Century\":</strong> Decisive victories are becoming rarer in war and politics, favoring those who can manage prolonged friction.</li><li><strong>Middleman diplomacy:</strong> Traditional expertise is being replaced by special envoys and \"middle powers\" to navigate the deadlock.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional rethink:</strong> Multilateral bodies like the UN must reinvent their governance or face total irrelevance.</li><li><strong>Risk evolution:</strong> Global business and government are shifting from growth-centric models to resilience and contingency planning.</li><li><strong>NATO tension:</strong> European allies are demanding clarity on U.S. troop levels to prevent a deterrence gap against Russia.</li></ul>", "us elections": "<p>Donald Trump's grip on the Republican Party is creating strategic vulnerabilities ahead of the midterm elections.</p><p><strong>Why it matters:</strong> Trump's preference for \"MAGA warriors\" over moderate candidates risks alienating swing voters in critical battlegrounds. This internal GOP shift provides Democrats a path to flip seats in traditionally red states.</p><p><strong>The Texas Tension</strong></p><ul><li>Trump-backed Ken Paxton won the primary, ousting a sitting senator.</li><li>Democrats view Paxton's divisive reputation as a liability that limits his appeal outside the MAGA base.</li><li>The result puts a Texas Senate seat in play for the first time in years.</li></ul><p><strong>Internal GOP Fractures</strong></p><ul><li><strong>Policy clashes:</strong> Senators are stalling a $1.8bn \"anti-weaponization\" fund, sparking public clashes with Trump.</li><li><strong>Foreign policy:</strong> The Iran war is creating a \"MAGA divorce,\" with nationalists claiming a betrayal of \"America First.\"</li><li><strong>Economic drag:</strong> Over 50% of voters disapprove of Trump's economic handling due to inflation and war.</li></ul><p><strong>Democratic Pivot</strong></p><ul><li><strong>Class shift:</strong> Democrats are nominating populist, working-class candidates (e.g., a former firefighter in Pennsylvania) to win back blue-collar voters.</li><li><strong>Post-mortem:</strong> A DNC report blames White House disunity for previous losses, prompting a push for a more cohesive identity.</li></ul><p><strong>What's next:</strong> Watch the \"Doge\" effect. A $8M GOP-led push to undo Elon Musk's aid cuts suggests that efficiency drives are becoming a political liability in swing districts.</p>", "german politics": "<p>Germany is undergoing a volatile strategic pivot as Chancellor Friedrich Merz balances aggressive rearmament with a deteriorating relationship with the U.S.</p><p><strong>Why it matters:</strong> Berlin is attempting to lead European defense and financial integration while facing internal political instability and a surge in far-right populism.</p><p><strong>The Defense Pivot</strong></p><ul><li><strong>Rapid Scaling:</strong> Germany is accelerating spending to hit a 3.5% GDP target six years ahead of NATO deadlines.</li><li><strong>Structural Overhaul:</strong> Berlin is restructuring its arms procurement agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Strategic Shift:</strong> The government published its first military strategy since WWII, signaling a move toward \"more responsibility\" for European security.</li></ul><p><strong>The Trump Friction</strong></p><ul><li><strong>Diplomatic Collapse:</strong> Merz’s criticism of U.S. strategy in Iran has triggered a retaliatory review of U.S. troop presence in Germany.</li><li><strong>Military Fallout:</strong> The Pentagon is pulling 5,000 soldiers from Germany following the diplomatic row.</li><li><strong>Urgent Needs:</strong> Despite the tension, Berlin is pushing to purchase Tomahawk missiles to fill capability gaps.</li></ul><p><strong>Internal Instability</strong></p><ul><li><strong>Leadership Rivalry:</strong> Merz faces a \"chancellor swap\" threat as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Far-Right Surge:</strong> The AfD is topping polls by leveraging voter anger over fuel prices and the Iran war.</li><li><strong>Legal Blows:</strong> A Berlin court ordered the AfD to return a record €2.35 million in illegal donations.</li></ul><p><strong>Economic Realignment</strong></p><ul><li><strong>EU Integration:</strong> The Finance Minister is prioritizing a Capital Markets Union over national interests.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>Protectionism:</strong> The government is pushing for higher European investment from streamers like Netflix, sparking \"protectionist\" accusations.</li></ul><p><strong>What's next:</strong> Watch for the September regional elections in eastern states, which will determine if the AfD's surge translates into governing power.</p>", "central banks": "<p>Central banks are facing a volatile convergence of geopolitical conflict, stubborn inflation, and leadership transitions.</p><p><strong>Why it matters:</strong> Geopolitical instability—specifically the Iran war—is driving inflation higher, forcing central banks to prioritize price stability over economic growth. This limits their ability to cut rates and erodes the \"policy put\" investors previously relied on during market shocks.</p><p><strong>The policy divide</strong></p><ul><li><strong>Federal Reserve:</strong> Incoming chair Kevin Warsh inherits a high-inflation environment, making immediate rate cuts difficult to justify.</li><li><strong>ECB:</strong> Policymakers are preparing for June rate hikes as energy price spikes spill into the broader economy.</li><li><strong>Bank of Japan:</strong> Moving forward with a rate increase scheduled for June.</li></ul><p><strong>Systemic risks</strong></p><ul><li><strong>Fiscal pressure:</strong> Rising public debt and demographic shifts are constraining the independence of monetary policy.</li><li><strong>Financial stability:</strong> The ECB is warning banks about systemic risks introduced by AI models.</li><li><strong>Market disconnect:</strong> A gap persists between professional forecasters and money market expectations regarding policy shifts.</li></ul><p><strong>Innovation and shifts</strong></p><ul><li><strong>Blockchain:</strong> The NY Fed and BoE successfully tested a prototype for near-instantaneous cross-border payments.</li><li><strong>Sovereignty:</strong> The UK faces pressure over euro-denominated debt, which critics argue would surrender monetary autonomy.</li></ul><p><strong>What's next:</strong> Markets are now pricing in a potential US rate rise by 2026 as the conflict in the Middle East continues to push borrowing costs to their highest levels since 2007.</p>", "us banks": "<p>US banks are aggressively expanding balance sheets and pursuing acquisitions as deregulation unlocks massive capital reserves.</p><p><strong>Why it matters:</strong> Lighter regulatory oversight under the Trump administration is shifting the competitive landscape, giving US lenders a capital advantage over EU and Swiss rivals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital freed for top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan says was unlocked by a lighter regulatory approach.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon is considering.</li><li><strong>$40 billion:</strong> Record revenue generated by trading firm Jane Street.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk Management:</strong> Banks are actively offloading \"choking\" risks, specifically private equity-linked loans ($4bn at JPMorgan) and AI-driven data center debt.</li><li><strong>Geopolitical Friction:</strong> Security concerns are manifesting in hardware and software, evidenced by Morgan Stanley's China-only iPhones and Goldman's AI restrictions in Hong Kong.</li><li><strong>Strategic Pivots:</strong> Citi is shifting toward private lending partnerships (BlackRock) and internal incentive structures to drive wealth referrals.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Treasury Surge:</strong> Primary dealers are boosting Treasury holdings to 2007 levels to facilitate government debt trading.</li><li><strong>European Expansion:</strong> JPMorgan is scaling its digital consumer bank, Chase, into Germany.</li><li><strong>Crypto Integration:</strong> Morgan Stanley is moving into retail spot crypto trading via E*Trade.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>30 May 2026 11:55 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
