.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

-28T16:14:09+00:00", "date_label": "28 Sep 2026", "tag": "german politics"}, {"title": "Goldman reaped more than $200mn in fees from hedge fund Situational Awareness", "url": "https://www.ft.com/content/bdec4129-ccac-4149-aa53-90ddd50cb925?syn-25a6b1a6=1", "summary": "Barely two-year-old AI-focused investment firm became biggest client of Wall Street bank’s prime brokerage unit", "date_iso": "2026-09-24T18:00:07+00:00", "date_label": "24 Sep 2026", "tag": "us banks"}];
const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Big Oil is pivoting toward electricity generation to capture surging data center demand.</p><p><strong>Why it matters:</strong> AI-driven power needs are creating a massive supply gap that renewables and aging grids cannot fill alone. Fossil fuel producers are leveraging their infrastructure to diversify into power and carbon capture.</p><p><strong>The friction points</strong></p><ul><li><strong>Political headwinds:</strong> UK Labour MPs are pressuring the government to reject the Rosebank oilfield to protect climate credentials.</li><li><strong>Operational risks:</strong> AI automation is rapidly replacing human labor in drilling, increasing efficiency but cutting \"roughneck\" jobs.</li><li><strong>Market volatility:</strong> OPEC+ faces internal conflict over production estimates as global markets shift toward oversupply.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>26%:</strong> The projected increase in British household energy bills starting January.</li><li><strong>$67B:</strong> The value of the NextEra-Dominion deal currently threatened by AI-driven power cost backlash.</li><li><strong>$3.4B:</strong> The value of UAE contracts linked to alleged bribery involving former Petrofac executives.</li></ul><p><strong>Between the lines:</strong> The energy transition is hitting a \"grid wall.\" While solar and wind capacity is growing, inadequate transmission infrastructure is forcing production shutdowns in markets like Brazil.</p><p><strong>What's next:</strong> Watch the upcoming OPEC+ meeting. It will determine if the cartel can maintain price stability amidst diverging production estimates and a looming gasoline glut.</p>", "corporate earnings and results": "<p>Market volatility is surging as investors struggle to price future earnings amid an AI-driven transition.</p><p><strong>Why it matters:</strong> The \"AI trade\" is no longer a guaranteed catalyst. Investors are shifting from speculative growth to demanding concrete earnings, causing sharp swings in tech valuations.</p><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure pressure:</strong> The AI data center boom is straining the US defense sector, as contractors face ballooning backlogs.</li><li><strong>Strategic pivots:</strong> Verizon's potential $6bn Fidium acquisition signals a shift toward aggressive broadband expansion to protect market share.</li><li><strong>Global headwinds:</strong> Japanese automakers are seeing a sales collapse in China, highlighting the risk of regional market volatility on global earnings.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Valuation resets:</strong> Expect continued volatility in tech stocks until companies prove AI integration translates to bottom-line growth.</li><li><strong>Regulatory risk:</strong> Increased cyber incidents across government agencies may trigger new spending mandates for security infrastructure.</li></ul>", "middle east war": "<p>The U.S. and Iran are locked in a volatile cycle of tit-for-tat escalation that threatens regional stability and global energy flows.</p><p><strong>Why it matters:</strong> Direct military exchanges are now spilling into the Gulf, risking a full-scale war that could disrupt critical oil shipping lanes and strain U.S. military readiness.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Direct conflict:</strong> Recent drone strikes in Kuwait and Houthi attacks on Saudi Arabia's sovereign wealth fund signal a widening theater of war.</li><li><strong>Cyber warfare:</strong> The Iranian \"Shahid Kaveh\" unit is targeting industrial controls in the U.S. and Europe.</li><li><strong>Internal instability:</strong> In Israel, political fractures are deepening as opposition leaders move to oust Prime Minister Netanyahu amid legal battles and accusations of racism.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>11:</strong> People injured in the Houthi strike on Riyadh’s PIF Tower.</li><li><strong>2:</strong> Italian workers killed in a drone strike in Kuwait.</li><li><strong>0:</strong> Fossil fuel phaseout agreements reached at COP31 due to geopolitical divides between Arab states and the EU.</li></ul><p><strong>Between the lines</strong> The \"new normal\" in the Gulf is a fragile coexistence with constant low-level conflict. While the IEA suggests markets can survive a closure of the Strait of Hormuz, the immediate reality is a fragile recovery in crude exports and increased volatility in bond markets.</p><p><strong>What's next</strong> Watch for Trump's potential decision on new Iran strikes and the outcome of the Israeli opposition's effort to replace Netanyahu, both of which will dictate the region's trajectory in 2025.</p>", "shipping": "<p>Global shipping is entering a period of extreme volatility as geopolitical conflict and cyber warfare disrupt primary trade arteries.</p><p><strong>Why it matters:</strong> Escalating attacks in the Black Sea and the Strait of Hormuz are driving up operational costs, risking crew lives, and forcing a costly reconfiguration of global supply chains.</p><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24:</strong> Tankers targeted by Iran in a two-week window.</li><li><strong>24.6 million:</strong> Average daily barrels of oil exported from the Gulf, surpassing prewar levels.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric warfare:</strong> The shift toward limpet mines and drone attacks indicates a tactical evolution in maritime harassment.</li><li><strong>Digital vulnerability:</strong> Frequent cyberattacks on U.S. crude hubs show that trade routes are being targeted in the cloud, not just at sea.</li><li><strong>Strategic pivots:</strong> Russia is shifting grain exports to the Arctic to bypass Black Sea combat, increasing costs for global buyers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route shifts:</strong> DP World’s London Gateway is poised to overtake Felixstowe as the primary hub for Chinese EV imports.</li><li><strong>Legal battles:</strong> The Mercuria vs. Baltic Exchange court case will determine how shipping price estimates are handled during active war zones.</li><li><strong>Political friction:</strong> U.S. state-level opposition to Russian diesel imports may clash with federal energy strategies.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative investment bubble to a complex operational and regulatory challenge.</p><p><strong>Why it matters:</strong> The \"AI trade\" is decoupling. Investors are moving past general hype to scrutinize specific winners, while governments struggle to balance innovation with systemic security and legal accountability.</p><p><strong>The market shift</strong></p><ul><li><strong>Capital rotation:</strong> VC firms are dumping legacy funds at discounts to pivot toward AI startups.</li><li><strong>Stock volatility:</strong> Software and semiconductor shares are fluctuating as investors reassess long-term winners.</li><li><strong>Concentration risk:</strong> Fund managers are struggling to manage the disproportionate weight of AI giants in their portfolios.</li></ul><p><strong>Systemic risks</strong></p><ul><li><strong>Financial security:</strong> Unreleased models may threaten encryption standards across global financial systems.</li><li><strong>Cybercrime:</strong> AI-powered \"industrialized\" scams drove a double-digit jump in authorized fraud in the UK.</li><li><strong>Accountability gaps:</strong> Proposed laws in Delaware could shield autonomous AI companies from human liability.</li></ul><p><strong>Global competition</strong></p><ul><li><strong>Sovereignty:</strong> Europe is pushing for \"sovereign AI\" to reduce dependence on U.S. technology.</li><li><strong>China's struggle:</strong> Lack of domestic capital markets and commercial demand is hindering Beijing's frontier AI progress.</li><li><strong>Emerging plays:</strong> India is emerging as an overlooked high-upside market for AI implementation.</li></ul><p><strong>The productivity paradox</strong></p><ul><li><strong>Hidden costs:</strong> Business researchers warn that rapid AI adoption creates unforeseen operational drawbacks.</li><li><strong>Creativity loss:</strong> Experts argue that removing \"friction\" from work processes may stifle genuine inspiration.</li><li><strong>Sector limits:</strong> In drug development, AI is a tool for efficiency, not a replacement for the complex discovery process.</li></ul>", "us-china relations": "<p>The U.S., China, and Russia are attempting to establish a \"Yalta 2.0\" framework to carve up global influence.</p><p><strong>Why it matters:</strong> A trilateral agreement between Trump, Xi, and Putin would sideline middle powers and dismantle the current rules-based international order. This shift prioritizes great-power stability over democratic sovereignty.</p><p><strong>Between the lines</strong></p><ul><li><strong>China's gain:</strong> Beijing is leveraging these summits to project itself as a global leader and architect of a new world order.</li><li><strong>Russia's leverage:</strong> Putin is using the trilateral format to gain legitimacy and potentially secure territorial concessions in Europe.</li><li><strong>U.S. volatility:</strong> A perceived American retreat or shift toward isolationism creates a power vacuum that China is positioned to fill.</li></ul><p><strong>The middle power dilemma</strong></p><ul><li>Smaller nations face increasing dependence on AI and technology from the U.S. and China.</li><li>Economic security is becoming a hostage to geopolitical competition, forcing nations to choose sides.</li></ul><p><strong>What's next</strong> Watch for a \"joint statement\" from the trilateral summit. The outcome will determine if the global order shifts from multilateral cooperation to a three-way division of spheres of influence.</p>", "us elections": "<p>Democrats have secured a sweeping victory in the U.S. midterms, seizing control of both houses of Congress.</p><p><strong>Why it matters:</strong> This shift creates a legislative firewall against the Trump administration, enabling aggressive oversight and a pivot in party priorities.</p><p><strong>By the numbers</strong></p><ul><li><strong>56 seats:</strong> The Democratic tally in the 100-member Senate.</li><li><strong>$500 million:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>$4.2 trillion:</strong> Value lost in data center construction stocks as the AI trade unravels.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivot:</strong> Democrats are moving from \"woke politics\" toward class-based economic issues.</li><li><strong>Demographic shift:</strong> High turnout among older voters and historic wins in \"red\" states like Mississippi signal a breakdown in traditional political identities.</li><li><strong>MAGA failure:</strong> Unprecedented gerrymandering failed to stop the \"blue wave,\" suggesting a decline in the effectiveness of right-wing populist messaging.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investigations:</strong> House Democrats plan to use their majority to probe corruption claims within the Trump administration.</li><li><strong>Leadership changes:</strong> Hakeem Jeffries is on track to become the first Black House Speaker.</li><li><strong>Future bids:</strong> New York socialists are already backing Alexandria Ocasio-Cortez for a 2028 presidential run.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is aggressively pivoting Germany toward a more assertive military and geopolitical posture amid deepening domestic instability.</p><p><strong>Why it matters:</strong> Germany is attempting to lead European security and Ukraine support while battling a surge in far-right populism and coalition fragility. Failure to stabilize internally risks paralyzing the EU's largest economy and its primary security guarantor.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>Ukraine:</strong> Merz is using the EU budget as leverage to force unanimous funding for Kyiv.</li><li><strong>Defense:</strong> Germany is expanding spy agency powers and rearming, though it faces pushback from the Council of Economic Experts over debt levels.</li><li><strong>Alliances:</strong> Tensions are rising with France over nuclear strike protocols and with Italy over fighter jet partnerships.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of Labour Minister Bärbel Bas signals deepening fractures within the government.</li><li><strong>The AfD threat:</strong> The far-right is gaining institutional power, securing its first regional parliament president and fueling investor anxiety.</li><li><strong>Espionage:</strong> The government is on high alert following warnings of iPhone hacks and the arrest of Russian assets.</li></ul><p><strong>Between the lines</strong> Merz is positioning himself as the \"firewall\" against the far-right, but his reliance on unpopular reforms and high defense spending is creating a volatile political environment.</p><p><strong>What's next</strong></p><ul><li><strong>March:</strong> The transition to Germany's first female president, Ilse Aigner.</li><li><strong>Budget battles:</strong> A showdown over the EU's next budget and Germany's debt-to-GDP ratio.</li><li><strong>Security:</strong> The ongoing transformation of the Bundeswehr under new chief Christian Freuding.</li></ul>", "central banks": "<p>Central banks are pivoting from synchronized tightening to a fragmented, data-dependent approach to inflation and AI-driven growth.</p><p><strong>Why it matters:</strong> Divergent economic pressures—ranging from AI-fueled productivity in the U.S. to stagnant growth in Japan—are forcing policymakers to abandon \"one-size-fits-all\" strategies.</p><p><strong>The state of play</strong></p><ul><li><strong>Federal Reserve:</strong> Facing a \"three-dimensional tussle\" over inflation, AI, and guidance. Officials are weighing larger rate hikes (up to 50bps) if inflation persists.</li><li><strong>Bank of England:</strong> Maintaining a gradual tightening path despite internal calls for more aggressive action to prevent inflation from becoming entrenched.</li><li><strong>ECB:</strong> Transitioning leadership to Pablo Hernández de Cos. The new regime faces a \"baptism of fire\" involving the end of the tightening cycle and French political instability.</li><li><strong>Bank of Korea:</strong> Raising rates (now at 3.25%) to counter the economic volatility of the AI chip boom.</li><li><strong>Bank of Japan:</strong> Rate hikes remain uncertain as quarterly GDP contracts.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Risk:</strong> The ECB warns that AI borrowing patterns mirror the subprime bubble, citing trillions in off-balance sheet commitments by hyperscalers.</li><li><strong>AI Opportunity:</strong> Some Fed officials argue AI could sustain higher GDP growth without triggering inflation.</li><li><strong>Liquidity Stress:</strong> The Fed may temporarily expand its balance sheet to address money market stress before resuming shrinkage.</li></ul><p><strong>What's next</strong> Watch for the ECB's ability to maintain stability during its leadership transition and the Fed's decision on December rate movements based on upcoming jobs and inflation data.</p>", "us banks": "<p>Wall Street is leveraging a trading boom to offset regulatory fines and the disruptive threat of AI.</p><p><strong>Why it matters:</strong> Banks are currently caught between record profits from hedge fund activity and systemic risks from AI-driven deposit flight.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks if AI agents shift deposits to higher-yielding accounts.</li><li><strong>30%:</strong> Increase in Goldman Sachs' third-quarter net income.</li><li><strong>$1.55 billion:</strong> Combined fines paid by BofA ($1.2B) and Amex ($350M) for money laundering failures.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Paradox:</strong> Banks are deploying AI for supervision and efficiency, but fear the same technology will empower customers to leave low-interest accounts instantly.</li><li><strong>The Talent War:</strong> Citi is shortening analyst programs to prevent private equity firms from poaching junior talent.</li><li><strong>Private Credit:</strong> Traditional banks are regaining ground against non-bank lenders as borrowers seek more flexible coexistence.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Geopolitical shifts:</strong> Citi's approval for China securities business arrives just before the anticipated Trump-Xi meeting.</li><li><strong>Leadership transitions:</strong> Goldman Sachs remains vague on David Solomon's exit timeline despite the clear rise of heir apparent John Waldron.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>27 Nov 2026 19:35 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
