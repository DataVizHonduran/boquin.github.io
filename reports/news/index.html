/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

climate volatility.</p><p><strong>Why it matters:</strong> Conflict in the Middle East and the Arctic's opening are forcing a structural redesign of trade routes, driving vessel costs to record highs and destabilizing international maritime law.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>$100,000:</strong> Monthly salary for captains risking transit through the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as vessels bypass the Middle East.</li><li><strong>33%:</strong> Growth in the Russian-flagged fleet to evade Western sanctions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asset scarcity:</strong> Demand for immediate capacity has made old supertankers more valuable than new builds.</li><li><strong>Security premiums:</strong> The \"shadow fleet\" and military-escorted \"time slots\" are replacing standardized global shipping rules.</li><li><strong>Strategic pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM while simultaneously testing wind sails to cut fuel costs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route diversification:</strong> Expect increased reliance on Arctic corridors and alternative hubs to reduce dependence on the Strait of Hormuz and Panama Canal.</li><li><strong>Fuel transition:</strong> Falling biodiesel prices and ammonia/methanol adoption will accelerate the shift toward green shipping.</li><li><strong>Cyber risk:</strong> Increased connectivity of \"edge devices\" on ships creates new vulnerabilities for systemic hacking.</li></ul>", "artificial intelligence": "<p>Artificial intelligence has shifted from a speculative tool to a systemic risk and economic driver.</p><p><strong>Why it matters:</strong> Rapid deployment is creating a volatile feedback loop where massive capital investment clashes with emerging security threats and regulatory gaps.</p><p><strong>The Economic Tension</strong></p><ul><li><strong>Market Bubble:</strong> Broadcom warns of a \"casino mentality\" as investors over-leverage portfolios on AI infrastructure.</li><li><strong>Hardware Hunger:</strong> China is repurposing gaming chips to bypass AI hardware shortages.</li><li><strong>Growth Engine:</strong> The IMF upgraded the UK's outlook, citing AI as a primary driver of economic growth.</li></ul><p><strong>Security & Risk</strong></p><ul><li><strong>Physical Threats:</strong> OpenAI discovered recording devices in its offices; Anthropic warns of \"worm-like\" AI agents hijacking smart home devices.</li><li><strong>Institutional Fraud:</strong> AI-generated CVs are gaming hiring processes, forcing HR departments to adopt intelligence-agency tactics.</li><li><strong>Legal Peril:</strong> Police watchdogs warn that unregulated AI in criminal investigations could lead to wrongful acquittals.</li></ul><p><strong>The Human Friction</strong></p><ul><li><strong>Education & Art:</strong> AI is accelerating mastery in complex fields like chess and unleashing creativity, though \"AI slop\" threatens academic publishing.</li><li><strong>Healthcare Gap:</strong> Chatbots are filling mental health voids but lack the non-verbal capacity to provide actual healing.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Shift:</strong> The UK is pushing for \"Industrial Revolution-style\" laws to mandate risk control before model release.</li><li><strong>Physical AI:</strong> Development is moving into \"robot gyms\" to train machines for real-world environments using home and office data.</li></ul>", "us-china relations": "<p>The U.S.-China relationship has shifted from strategic competition to a zero-sum struggle for global dominance.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy is fueling a fragmented global order. This volatility empowers smaller powers and alternative blocs to challenge traditional Western hegemony.</p><p><strong>The shifting landscape</strong></p><ul><li><strong>BRICS ascent:</strong> The bloc now commands a larger share of the global economy than the G7, creating a viable alternative to U.S.-led financial systems.</li><li><strong>Alliance erosion:</strong> Unpredictable U.S. foreign policy is undermining security guarantees in South Korea and Japan, forcing allies to question American reliability.</li><li><strong>AI hegemony:</strong> U.S. dominance in AI hardware creates a new power imbalance, as data center consolidation concentrates control regardless of where facilities are hosted.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"David\" effect:</strong> Smaller nations are increasingly thwarting superpowers by leveraging geopolitical rivalries to their own advantage.</li><li><strong>Diplomatic decay:</strong> A trend toward \"every man for himself\" is replacing multilateralism, leaving a vacuum that authoritarian regimes are filling.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Economic warfare:</strong> Expect increased use of tariffs and sanctions as both powers prioritize domestic security over global trade efficiency.</li><li><strong>Strategic hedging:</strong> Middle powers will continue to \"poach\" international organizations and pivot between Washington and Beijing to maximize leverage.</li></ul>", "us elections": "<p>President Trump faces a precarious path to retaining congressional majorities as economic anxiety and shifting demographics erode his base.</p><p><strong>Why it matters:</strong> High inflation and rising mortgage rates are neutralizing GOP economic gains, pushing crucial swing voters—specifically Latinos and blue-collar workers—back toward Democrats.</p><p><strong>By the numbers</strong></p><ul><li><strong>$275 million:</strong> The amount Elon Musk injected into Republican coffers, becoming the party's largest donor.</li><li><strong>7 weeks:</strong> The consecutive streak of rising mortgage rates, hitting levels not seen since 2023.</li><li><strong>4 weeks:</strong> The remaining window before midterms for Trump to stabilize fuel prices and voter popularity.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic disconnect:</strong> Despite a \"booming\" macro economy, voters are focused on personal affordability and AI-driven job anxiety.</li><li><strong>Policy friction:</strong> Trump's diesel deal with Putin is creating rare bipartisan opposition, with lawmakers citing violations of US law.</li><li><strong>Digital warfare:</strong> AI-generated \"deepfakes\" are now integrated into attack ads, complicating the information landscape.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fuel pivots:</strong> Watch for the potential suspension of the federal petrol tax to quell inflation anger.</li><li><strong>Personnel shifts:</strong> Trump may terminate key campaign advisers following controversies surrounding their Balkans ties.</li><li><strong>Battleground focus:</strong> Results in rural Iowa and the Rust Belt will determine if the GOP maintains its legislative majority.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's traditional strongholds.</p><p><strong>Why it matters:</strong> The AfD's surge in eastern Germany is not just regional; it is a blueprint for national power that paralyzes federal governance and weakens Germany's leverage within the EU.</p><p><strong>The crisis points</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of the labor minister stalls critical pension and market reforms.</li><li><strong>Far-right infiltration:</strong> The AfD secured its first regional parliament president via secret support from established party lawmakers.</li><li><strong>Leadership vacuum:</strong> Merz's plummeting popularity has positioned North Rhine-Westphalia Premier Hendrik Wüst as the primary \"chancellor-in-waiting.\"</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>€2 trillion:</strong> The EU budget deal now at risk due to Merz's diminished authority in Brussels.</li><li><strong>40,000:</strong> Employees at Commerzbank the government is fighting to protect amid takeover bids to stabilize the *Mittelstand*.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"East\" divide:</strong> The AfD is leveraging nostalgia and Ukraine-related wedge issues to exploit emotional fault lines from reunification.</li><li><strong>Generational shift:</strong> Younger voters are decoupling from the historical traumas of fascism and communism, making them more susceptible to radicalism.</li><li><strong>Strategic pivot:</strong> Germany is aggressively rearming and utilizing \"guerrilla units\" for rapid Ukraine arms deals, signaling a permanent end to post-WWII military restraint.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Succession battle:</strong> Watch for Hendrik Wüst to consolidate support if Merz fails to stabilize the CDU after regional disasters.</li><li><strong>Kingmaker dynamics:</strong> The BSW (hard-left) may emerge as a critical power broker, creating unlikely alliances with the far-right.</li></ul>", "central banks": "<p>Central banks are struggling to balance stubborn inflation against rising systemic instability.</p><p><strong>Why it matters:</strong> Persistent growth and geopolitical shocks are forcing a shift toward \"tightening\" cycles, while fragile bond markets limit the tools available to manage these transitions.</p><p><strong>The current friction</strong></p><ul><li><strong>Inflation triggers:</strong> India has raised rates for the first time in three years; the Philippines is bracing for \"Godzilla\" El Niño weather to spike food costs.</li><li><strong>Bond volatility:</strong> Rising Treasury issuance and Middle East tensions are pushing yields higher, threatening to \"strangle\" debt-heavy nations like France.</li><li><strong>Systemic gaps:</strong> The Financial Stability Board warns most countries lack credible backstops to handle bank failures, leaving only the US, UK, Japan, and Hong Kong prepared.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Credibility crisis:</strong> Repeated US Treasury interventions and political attacks on the Fed are eroding public trust and creating moral hazard.</li><li><strong>New risks:</strong> The Bank of England is flagging an \"AI debt surge\" that could trigger a sharp market correction.</li><li><strong>Policy limits:</strong> Central banks are discovering that monetary policy cannot fix supply-side shocks (climate, war) without underlying economic resilience.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed pivot:</strong> Markets are pricing in a \"hold\" for October as officials signal a dovish shift.</li><li><strong>ECB pressure:</strong> Calls are growing for the European Central Bank to pause Quantitative Tightening (QT) to stabilize bond markets.</li><li><strong>Security focus:</strong> US watchdogs are demanding urgent fixes to \"deficiencies\" in Fed security targeted by foreign adversaries.</li></ul>", "us banks": "<p>US banks are pivoting from a record-breaking trading boom toward a high-stakes battle over AI integration and regulatory shifts.</p><p><strong>Why it matters:</strong> While equities businesses drove recent profit surges, banks now face a \"double-edged sword\" with AI: it lowers operational costs but threatens deposit stability by giving savers better tools to find higher rates.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks as AI agents help savers migrate to higher-yield accounts.</li><li><strong>30%:</strong> Goldman Sachs' third-quarter net income increase, fueled by equities.</li><li><strong>$350 million:</strong> Amex fine for systemic failures in reporting $13 billion in suspicious transactions.</li><li><strong>$500 million:</strong> Special bonuses Goldman is preparing for top executives.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Trading fatigue:</strong> The \"bumper\" trading streak is cooling. Banks are shifting focus from placing bets to earning fees from hedge fund borrowing.</li><li><strong>Talent wars:</strong> Citi is shortening junior promotion paths to prevent private equity firms from poaching analysts.</li><li><strong>Client leverage:</strong> Banks are attempting to use AI as a bargaining chip to force law firms to lower their billing rates.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Deregulatory push:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>AI disruption:</strong> Banks will increasingly compete with tech-centric lenders, like Erebor, which is filling the void left by the SVB collapse.</li><li><strong>Regulatory scrutiny:</strong> The SEC is intensifying probes into AI-focused hedge funds and their relationships with prime brokerage units.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>14 Oct 2026 15:24 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
