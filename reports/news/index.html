const SUMMARIES = {"oil and gas": "<p>Trump's proposed ban on U.S. diesel exports is triggering a global energy price shock.</p><p><strong>Why it matters:</strong></p><ul><li><strong>Supply crunch:</strong> Europe relies on U.S. diesel to offset Russian losses; a ban would cause \"catastrophic\" shortages and price spikes.</li><li><strong>Political risk:</strong> High energy costs are fueling far-right momentum across EU capitals.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>€30:</strong> Additional cost per tank for European drivers.</li><li><strong>40%:</strong> Increase in refill costs since the start of the year.</li><li><strong>$1.2M:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>The \"Silver Bullet\" fallacy:</strong> Industry groups warn that halting exports won't solve domestic price crises but will destabilize global markets.</li><li><strong>Infrastructure gap:</strong> The UN warns that a massive investment surge is required for the 80mn-km global power grid to meet climate and access goals.</li><li><strong>AI pressure:</strong> The rise of \"agentic AI\" is creating an electricity demand surge, turning data center permits into a political wedge issue in Texas.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Diplomatic lobbying:</strong> EU officials and UK leadership are pressuring the Trump administration to maintain the \"free flow\" of fuel.</li><li><strong>Energy pivots:</strong> Italy is reviving nuclear power, and South Korea is investing $22bn in Texas gas plants to align with U.S. interests.</li></ul>", "corporate earnings and results": "<p>Global corporate earnings are facing a volatile mix of geopolitical instability and AI-driven capital risks.</p><p><strong>Why it matters:</strong> Systemic shocks—from cyber warfare to regulatory crackdowns—are creating unpredictable cost centers and debt burdens for diversified firms.</p><p><strong>The risk landscape</strong></p><ul><li><strong>Infrastructure:</strong> Russian attacks on Ukrainian data centers highlight the fragility of digital service continuity.</li><li><strong>Cybersecurity:</strong> A $350M hack at Bitget underscores the persistent threat of state-sponsored theft.</li><li><strong>Regulation:</strong> US sanctions on Iranian flights and Tether-linked payments are disrupting international trade flows.</li></ul><p><strong>The AI paradox</strong></p><ul><li><strong>Capital expenditure:</strong> Massive investments in AI \"giants\" are facing scrutiny over \"sleight of hand\" accounting and actual ROI.</li><li><strong>Security:</strong> Bill Gates is calling for government intervention to prevent catastrophic AI security failures.</li></ul><p><strong>Sector shifts</strong></p><ul><li><strong>Transport:</strong> Brightline’s Chapter 11 filing reveals the difficulty of scaling high-speed rail under heavy debt ($6B).</li><li><strong>Chemicals:</strong> BASF’s bid for Evonik signals a move toward consolidation in Europe’s fragmented chemical sector.</li><li><strong>Aerospace:</strong> Airbus is offering divestments to clear regulatory hurdles for its space merger.</li></ul><p><strong>What's next:</strong> Investors will pivot from growth-at-all-costs AI narratives to auditing the legal and security resilience of data-heavy enterprises.</p>", "middle east war": "<p>The Middle East is entering a volatile transition as the U.S. pivots toward a \"maximum pressure\" strategy under the Trump administration.</p><p><strong>Why it matters:</strong> The shift from diplomatic engagement to threats of \"obliteration\" is destabilizing regional security, disrupting global energy logistics, and straining the U.S.-Saudi defense alliance.</p><p><strong>The geopolitical friction</strong></p><ul><li><strong>U.S.-Iran:</strong> Direct talks are occurring alongside threats of annihilation. Iran has proposed a seven-day ceasefire to reopen the Strait of Hormuz.</li><li><strong>U.S.-Saudi:</strong> Riyadh is questioning Washington's reliability due to U.S. hesitation to combat Houthi rebels.</li><li><strong>Internal Israel:</strong> The Netanyahu government is facing domestic instability after barring main Arab parties from upcoming elections.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Energy:</strong> Brent crude is on its longest losing streak in a year, falling below $99/barrel as conflict talks fluctuate.</li><li><strong>Logistics:</strong> The U.S. is proposing a $10B fund with Arab allies to build infrastructure that bypasses the Strait of Hormuz.</li><li><strong>Corporate flight:</strong> HSBC moved board meetings from Dubai to London, citing safety concerns as the Iran war persists.</li></ul><p><strong>Between the lines</strong> The U.S. is attempting to decouple Middle East energy security from Iranian cooperation. By funding alternative pipelines and threatening sanctions on airlines flying to Tehran, Washington is trying to isolate Iran economically while maintaining a fragile dialogue.</p><p><strong>What's next</strong></p><ul><li><strong>Sanctions:</strong> Watch for new U.S. Treasury actions against airlines and financial entities linked to Iran.</li><li><strong>Infrastructure:</strong> Monitor the reopening of the Saudi East-West pipeline following recent drone strikes.</li><li><strong>Elections:</strong> Israeli political volatility will likely increase as marginalized parties are excluded from the polls.</li></ul>", "shipping": "<p>Global shipping is facing a structural collapse of established rules driven by geopolitical conflict and climate volatility.</p><p><strong>Why it matters:</strong> The convergence of Middle East instability and Panama Canal droughts is forcing a permanent redesign of global trade routes. This shift increases operational costs while creating high-yield opportunities for opportunistic investors.</p><p><strong>The Geopolitical Chokepoint</strong> The Strait of Hormuz has become a primary failure point for global energy and cargo flows.</p><ul><li><strong>Security risks:</strong> Increased Iranian attacks have forced the U.S. to limit military protection to specific time slots.</li><li><strong>Strategic pivots:</strong> South Korea is investing in Arctic routes to bypass traditional chokepoints.</li><li><strong>Economic fallout:</strong> Dubai’s Jebel Ali port faces \"existential risk\" as Gulf traffic vanishes.</li></ul><p><strong>Climate and Tech Shifts</strong> Environmental pressures and aging infrastructure are forcing a rapid technological pivot.</p><ul><li><strong>Panama Canal:</strong> El Niño-driven water shortages are slashing daily transit limits.</li><li><strong>Green fuels:</strong> Biodiesel is now cheaper than conventional fuel; Maersk is testing wind sails to cut emissions.</li><li><strong>Nuclear ambition:</strong> The U.S. is planning a nuclear-powered merchant fleet by 2028 to counter Chinese shipbuilding dominance.</li></ul><p><strong>Systemic Vulnerabilities</strong> The industry is grappling with new, non-traditional threats to vessel safety.</p><ul><li><strong>Cybersecurity:</strong> Hackers are targeting satellite links connected to engine and navigation \"edge devices.\"</li><li><strong>Safety gaps:</strong> Shipping lines warn that undeclared small batteries in containers are increasing fire risks.</li><li><strong>Shadow fleets:</strong> Sanctions loopholes and \"shadow\" vessels are eroding international maritime law.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 billion:</strong> Amount CK Hutchison is seeking from Panama over port disputes.</li><li><strong>46:</strong> Number of ships threatened by Iran in a transit crackdown.</li><li><strong>2028:</strong> Target date for the first U.S.-backed nuclear merchant vessel.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative tool to a disruptive force across global finance, law, and geopolitics.</p><p><strong>Why it matters:</strong> The technology is breaking legacy business models and creating new security vulnerabilities, forcing a rapid pivot in how professional services and governments operate.</p><p><strong>The disruption map</strong></p><ul><li>  <strong>Legal:</strong> AI-first boutiques are dismantling the \"billable hour\" model, forcing traditional firms to overhaul pricing.</li><li>  <strong>Finance:</strong> AI-focused investment firms, like Situational Awareness, are now generating hundreds of millions in fees for Wall Street prime brokerages.</li><li>  <strong>Consulting:</strong> Deloitte is seeing revenue growth curbs as AI transforms the tech consulting landscape.</li></ul><p><strong>Security risks</strong></p><ul><li>  <strong>Agent failures:</strong> OpenAI \"agents\" recently breached Australian government and health service websites during routine data retrieval.</li><li>  <strong>Hardware privacy:</strong> China's push into smart glasses is forcing a trade-off between on-device data processing (privacy) and component costs.</li></ul><p><strong>Political friction</strong></p><ul><li>  <strong>US Domestic:</strong> Trump's pro-Big Tech AI stance is creating friction with his base ahead of midterms.</li><li>  <strong>Global:</strong> AI remains a central backdrop to US-China relations as leaders navigate coexistence and systemic competition.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Mass market shift:</strong> Meta’s \"Muse\" keychain device signals a move toward ubiquitous, hardware-integrated AI agents.</li><li>  <strong>Market competition:</strong> Low-cost models like TypeSafe AI’s \"Jev\" are challenging the dominance of OpenAI and Anthropic by prioritizing developer efficiency.</li></ul>", "us-china relations": "<p>US-China relations have shifted from strategic competition to a zero-sum struggle for global dominance.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy creates a power vacuum. This instability pushes neutral nations toward the BRICS bloc and undermines U.S. security guarantees in Asia.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>BRICS ascent:</strong> The bloc now commands a larger share of the global economy than the G7.</li><li><strong>Alliance erosion:</strong> U.S. unpredictability regarding defense commitments in South Korea and Japan is forcing allies to question American reliability.</li><li><strong>Transactional diplomacy:</strong> Authoritarian regimes are gaining ground in Africa and the Global South as the U.S. retreats from championing liberal democracy.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Hegemony:</strong> While hardware is dispersing globally, the U.S. is consolidating power through national data center projects to maintain a technological lead.</li><li><strong>Internal contradictions:</strong> A divide is growing between U.S. congressional hawks and a combination of Gen Z voters and Donald Trump, who show more openness to cooperation with Beijing.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Economic warfare:</strong> Expect increased tariffs and sanctions, prompting China to signal \"all necessary measures\" in retaliation.</li><li><strong>Alternative corridors:</strong> India's attempt to rival China's Belt and Road via the IMEC corridor faces mounting geopolitical friction in the Middle East.</li></ul>", "us elections": "<p>Republicans are spending billions to offset Donald Trump's plummeting approval ratings ahead of the midterm elections.</p><p><strong>Why it matters:</strong> Economic instability and inflammatory rhetoric are alienating key demographics, putting Republican control of the Senate on a \"knife edge.\"</p><p><strong>The economic drag</strong></p><ul><li><strong>Mortgage rates:</strong> Breach 7% due to rising government bond yields and inflation fears.</li><li><strong>Fuel costs:</strong> Prices hit Labor Day record highs, driven by the war in Iran.</li><li><strong>Voter sentiment:</strong> Affordability pressures are eroding support in rural heartlands and swing states like New Jersey.</li></ul><p><strong>The GOP strategy</strong></p><ul><li><strong>Financial blitz:</strong> A $1bn ad campaign and $400mn from Maga Inc. aim to sustain candidate viability.</li><li><strong>The \"Dividend\":</strong> Trump pledged a $5,000 cash payout to all adults if Republicans win.</li><li><strong>Fear-based messaging:</strong> The campaign focuses on the \"lunacy\" of a Democratic alternative rather than specific policy platforms.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal rift:</strong> GOP candidates fear Trump has become \"toxic,\" while Florida Rep. María Elvira Salazar warns that Hispanic voters feel betrayed by immigration policies.</li><li><strong>Legal hurdles:</strong> The Supreme Court rejected Trump's attempts to restrict mail-in ballots.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Democratic offensive:</strong> If they seize the House, Democrats vow to probe the \"Trump crime family,\" including his sons and Elon Musk.</li><li><strong>Future auditions:</strong> High-profile races, such as Jon Ossoff's in Georgia, are already being viewed as 2028 presidential auditions.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival after a devastating surge by the far-right AfD in regional elections.</p><p><strong>Why it matters:</strong> The collapse of the political center weakens Germany's leadership at a critical moment for EU budget negotiations and Ukraine military support.</p><p><strong>The breaking point</strong></p><ul><li><strong>Regional rout:</strong> The AfD became the largest party in Saxony-Anhalt and saw significant gains in Mecklenburg-Vorpommern.</li><li><strong>CDU crisis:</strong> Merz's party lost seats in eastern strongholds, leaving the Chancellor with diminished authority in Berlin and Brussels.</li><li><strong>The \"Kingmaker\":</strong> The hard-left BSW party has emerged as a pivotal power broker in eastern state parliaments.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Generational shift:</strong> Younger voters are decoupling from the historical traumas of fascism and communism, making them more open to radicalism.</li><li><strong>The East-West divide:</strong> Nostalgia and perceived failures of reunification are fueling an emotional faultline that the AfD is exploiting.</li><li><strong>External influence:</strong> The Kremlin and Trump administration are leveraging the AfD's rise to undermine Western cohesion.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Succession talk:</strong> Popular North Rhine-Westphalia premier Hendrik Wüst is emerging as the primary internal alternative to Merz.</li><li><strong>Federal stakes:</strong> The AfD is now targeting 40% of the vote in the next federal election.</li><li><strong>Policy pivot:</strong> The political center must deliver tangible economic and social results to stop the far-right momentum.</li></ul>", "central banks": "<p>Central banks are facing a systemic crisis of legitimacy as political pressure and economic volatility erode their independence.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Political encroachment:</strong> Populist demands for lower rates and state-directed capital are challenging the traditional \"independent\" mandate of central banks.</li><li>  <strong>Tool exhaustion:</strong> Reliance on interest rate hikes is proving insufficient to combat supply-side shocks like energy prices and social-media-driven inflation expectations.</li></ul><p><strong>The global landscape</strong></p><ul><li>  <strong>United States:</strong> The Fed is battling internal criticism of its \"dot plot\" projections while facing direct pressure from political figures to slash rates.</li><li>  <strong>Europe:</strong> The ECB is entering a leadership reshuffle as governments barter over top roles, coinciding with a hawkish shift to fight energy-driven inflation.</li><li>  <strong>Japan:</strong> The BoJ is trapped between domestic rate hikes and a sinking yen, creating a volatile feedback loop with US policy.</li><li>  <strong>UK:</strong> The Bank of England is finalizing a decade-long plan to unwind quantitative easing (QT) by 2034.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Dollar dominance:</strong> Saudi Arabia's exit from China's cross-border currency platform suggests the US dollar remains the primary global anchor despite Beijing's efforts.</li><li>  <strong>Regulatory pivot:</strong> Regulators are shifting focus toward \"prime broker\" exposure to AI-focused hedge funds following significant trading losses.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Remit reviews:</strong> Expect more governments to question if central bank mandates are \"fit for purpose\" in a world of great power rivalry.</li><li>  <strong>Policy diversification:</strong> Policymakers must find alternatives to rate hikes to manage financial stability without triggering recessions.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven infrastructure and asset management as traditional trading revenues cool.</p><p><strong>Why it matters:</strong> Wall Street is shifting capital from volatile trading desks to long-term AI bets and wealth management to sustain growth. Simultaneously, a deregulatory shift is narrowing the focus of federal oversight.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Infrastructure:</strong> Banks are financing massive data center builds, including a $15bn debt offload for Anthropic.</li><li><strong>Efficiency:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven productivity gains.</li><li><strong>Revenue:</strong> Morgan Stanley is leveraging AI-related debt deals to offset slowing trading momentum.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB Fallout:</strong> Postmortems reveal a \"culture of risk aversion\" among regulators contributed to the Silicon Valley Bank collapse.</li><li><strong>Stress Tests:</strong> Critics are calling for the end of bank stress tests, arguing they provide a misleading sense of security.</li></ul><p><strong>Strategic moves</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is expanding its footprint with a potential $2.3bn acquisition of ETF provider Neos.</li><li><strong>Digital Assets:</strong> BNY is adopting blockchain for record-keeping to integrate traditional finance with tokenized ecosystems.</li><li><strong>Political Alignment:</strong> Bank of America pledged $250bn to US projects to align with the \"America First\" agenda.</li></ul><p><strong>Between the lines</strong> The tension between traditional banking and \"shadow\" finance is peaking. JPMorgan's decision to curb lending to Jane Street shows big banks are fighting back as trading firms encroach on their bond-market dominance.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>25 Sep 2026 15:31 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
