const SUMMARIES = {"oil and gas": "<p>The global oil market is pivoting from shortage fears to a looming supply glut.</p><p><strong>Why it matters:</strong> A combination of geopolitical easing and rising production is crashing prices, shifting the strategic focus from scarcity to oversupply.</p><p><strong>By the numbers</strong></p><ul><li><strong>$80:</strong> The price point Brent crude sank below as traders bet on the return of Strait of Hormuz flows.</li><li><strong>1983:</strong> The year of the previous low for U.S. Strategic Petroleum Reserve stocks, now matched.</li><li><strong>1 million:</strong> Barrels per day capacity of Canada's proposed west coast pipeline to Asia.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical shifts:</strong> A U.S.-Iran ceasefire and potential Middle East peace deals are removing the \"risk premium\" from crude prices.</li><li><strong>Strategic pivots:</strong> The Trump administration is redirecting $765 million from offshore wind toward natural gas and geothermal projects.</li><li><strong>Consolidation:</strong> Activist investors targeting firms like Devon Energy signal a new wave of M&A in the U.S. shale patch.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Production surges:</strong> The IEA warns that a return of flows will outstrip demand forecasts, cementing the glut.</li><li><strong>New frontiers:</strong> ConocoPhillips' deal with Syria marks a rare return of U.S. majors to the region to revive gas production.</li><li><strong>Political volatility:</strong> Energy costs are becoming central to UK elections, specifically in Aberdeen, as voters weigh oil and gas against clean power.</li></ul>", "corporate earnings and results": "<p>AI is fundamentally restructuring corporate profit models and labor hierarchies.</p><p><strong>Why it matters:</strong> Automation is eroding the billable-hour model for consultants while forcing junior employees into high-level decision-making roles prematurely.</p><p><strong>The AI Divide</strong></p><ul><li><strong>Winners:</strong> Samsung reports productivity boosts from AI integration.</li><li><strong>Losers:</strong> Accenture shares are hitting 2017 lows as AI threatens its core business model.</li><li><strong>Risk Management:</strong> JPMorgan and Goldman Sachs have banned Claude (Anthropic) for Hong Kong staff to mitigate data risks.</li></ul><p><strong>Sector Volatility</strong></p><ul><li><strong>Automotive:</strong> BMW warns of Chinese market encroachment in Europe; Nissan is leveraging UK government subsidies to offset EV target pressures.</li><li><strong>Private Equity:</strong> Thoma Bravo faces a $5bn total loss on Medallia, the largest PE loss since 2008.</li><li><strong>Retail:</strong> Aldi is investing $9bn to accelerate US expansion, targeting inflation-weary consumers.</li></ul><p><strong>Macro Headwinds</strong></p><ul><li><strong>Geopolitics:</strong> The Iran war has disrupted shipping fuel supplies and strained crew mental health, despite a recent interim peace deal.</li><li><strong>Regulation:</strong> The Saudi PIF warns that EU foreign subsidy rules are deterring international investment.</li><li><strong>Banking:</strong> Wall Street is lobbying to further relax Basel capital requirements to increase leverage.</li></ul><p><strong>What's next:</strong> Watch for a shift in \"junior\" job descriptions as AI handles execution, moving entry-level roles toward management and oversight.</p>", "middle east war": "<p>The U.S. and Iran have signed an interim deal to end months of conflict and reopen the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The agreement stabilizes global energy markets and lowers inflationary pressure on Western economies, though it creates a deep diplomatic rift between the Trump administration and Israel.</p><p><strong>The deal's terms</strong></p><ul><li><strong>Financials:</strong> The U.S. may provide up to $300 billion in frozen funds, tied to Iranian \"performance.\"</li><li><strong>Security:</strong> Tehran retains its ballistic missile program.</li><li><strong>Logistics:</strong> The deal aims to reopen the Strait of Hormuz to commercial shipping.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>U.S.-Israel rift:</strong> Trump is criticizing Israel's campaign against Hezbollah and urging Syria to take the lead in fighting the group.</li><li><strong>Israeli isolation:</strong> Prime Minister Netanyahu faces domestic backlash and deepening diplomatic isolation, prompting a strategic pivot toward India.</li><li><strong>Iranian perception:</strong> Despite heavy losses, the Tehran regime views the deal as a strategic victory.</li></ul><p><strong>Economic impact</strong></p><ul><li><strong>Oil:</strong> Prices are dropping as the risk of supply disruption fades.</li><li><strong>Inflation:</strong> The Bank of England held rates at 3.75% as the \"Iran war\" premium exited the UK economy.</li><li><strong>Markets:</strong> Investors are betting on a \"peace dividend\" to boost corporate earnings and global confidence.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Verification:</strong> Shipping giants, including Mitsui OSK Lines, are waiting for \"material\" proof of stability before fully resuming operations.</li><li><strong>Fed policy:</strong> New Fed Chair Kevin Warsh must now navigate inflation that remains above target despite the geopolitical easing.</li></ul>", "shipping": "<p>Geopolitical volatility in the Strait of Hormuz is destabilizing global oil logistics and fueling a risky \"shadow fleet\" economy.</p><p><strong>Why it matters:</strong> Disruptions in narrow waterways trigger immediate spikes in freight rates and force energy traders to use aging, uninsured vessels. This increases the probability of catastrophic environmental spills and systemic market crashes.</p><p><strong>The Hormuz Crisis</strong></p><ul><li><strong>Logistics:</strong> Tankers are stranded in the Gulf, facing biological fouling (barnacles/jellyfish) that may impede future movement.</li><li><strong>Market Volatility:</strong> Oil prices are fluctuating based on the transit of individual supertankers; owners fear a rate crash if the strait fully reopens.</li><li><strong>Workarounds:</strong> Cargo is shifting to trucks, drastically increasing costs and reducing volume efficiency.</li></ul><p><strong>The Shadow Fleet Risk</strong></p><ul><li><strong>Sanctions Evasion:</strong> Russia and Iran are using \"dark\" transits and aging tankers to bypass Western restrictions.</li><li><strong>Environmental Threat:</strong> Over 50% of shadow fleet vessels are deemed high-risk for disasters due to poor maintenance and age.</li><li><strong>Enforcement:</strong> The UK is actively seizing vessels linked to sanctioned entities to disrupt war funding.</li></ul><p><strong>Strategic Shifts</strong></p><ul><li><strong>Defense Boom:</strong> South Korea and UK shipyards (Cammell Laird) are expanding capacity to meet rising naval and defense demands.</li><li><strong>Infrastructure:</strong> Belfast Harbour is investing £1.3bn to compete for freight and offshore wind business.</li><li><strong>Hub Reliance:</strong> Singapore remains the critical conduit for maintaining Asian energy flows amid Middle East instability.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the Mercuria vs. Baltic Exchange lawsuit, which will determine how shipping rates are calculated during geopolitical disruptions.</p>", "artificial intelligence": "<p>AI is shifting from a speculative tool to a systemic economic force driving massive capital reallocation and geopolitical tension.</p><p><strong>Why it matters:</strong> The scale of investment is creating a \"winner-take-all\" infrastructure race, while the speed of deployment threatens professional service sectors and labor stability.</p><p><strong>By the numbers</strong></p><ul><li><strong>$34 billion:</strong> OpenAI's spending last year on infrastructure and development.</li><li><strong>$15 billion:</strong> Potential gain for Bain Capital via chipmaker Kioxia.</li><li><strong>$710 million:</strong> Combined recent funding for AI startups Odyssey and CuspAI.</li><li><strong>19.6%:</strong> Second-day share gain for Elon Musk's SpaceX.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical friction:</strong> The U.S. and Europe are struggling to balance \"trusted partner\" access to models with opaque national security controls.</li><li><strong>Sector disruption:</strong> Private equity is pivoting away from law and accountancy as AI threatens the billable-hour model.</li><li><strong>The \"Human\" gap:</strong> Corporate leaders are facing pressure to redistribute AI wealth to prevent worker backlash and \"machine-minding\" burnout.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Global Governance:</strong> Industry leaders (Anthropic, OpenAI) are lobbying G7 nations for a unified regulatory framework to prevent fragmented markets.</li><li><strong>Physical AI:</strong> Investment is shifting toward models that simulate the physical world, moving AI beyond text and images into robotics and materials science.</li><li><strong>Hardware bottlenecks:</strong> A looming \"hardware crunch\" in disk drives and data centers may throttle the current pace of expansion.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony as the traditional multilateral order collapses.</p><p><strong>Why it matters:</strong> A shift toward \"might is right\" geopolitics increases the risk of direct conflict while forcing middle powers to choose sides or forge new, fragile alliances.</p><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric Leverage:</strong> Power no longer stems from sheer wealth or size, but from the ability to exploit imbalances in the global system.</li><li><strong>The Leadership Vacuum:</strong> Washington is retreating from global responsibilities; Beijing is attempting to fill the void through a \"tribute system\" of economic influence rather than formal leadership.</li><li><strong>Russia's Role:</strong> Putin’s strategic failures have locked Moscow into a one-sided dependency on China, granting Beijing significant regional leverage.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Zero-Sum Gains:</strong> China is seeing a rise in soft power and diplomatic visits as the U.S. burns bridges with traditional allies.</li><li><strong>High Stakes:</strong> The \"Thucydides Trap\"—where a rising power threatens a ruling power—remains the primary driver of instability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional Decay:</strong> The UN and other multilateral bodies face irrelevance unless they can adapt to a fractured, great-power-centric world.</li><li><strong>Strategic Pivot:</strong> Expect an increase in \"middleman\" diplomacy and special envoys to manage volatility where formal diplomacy has failed.</li></ul>", "us elections": "<p>The U.S. political landscape is fracturing as MAGA-backed candidates secure primaries but face viability gaps in general elections.</p><p><strong>Why it matters:</strong> Trump’s influence over the GOP base remains absolute, but his preference for divisive candidates is creating strategic openings for Democrats in key swing states.</p><p><strong>The battlegrounds</strong></p><ul><li><strong>Texas:</strong> Trump-backed Ken Paxton won the primary, but analysts warn his limited appeal outside the MAGA base could hand the Senate seat to Democrats.</li><li><strong>Maine:</strong> Democrat Graham Platner won the primary despite misconduct allegations, setting up a challenge against incumbent Susan Collins.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li></ul><p><strong>Internal frictions</strong></p><ul><li><strong>GOP Divide:</strong> Republican senators are blocking Trump’s $1.8bn \"anti-weaponisation\" fund, prompting the president to accuse them of \"screwing the party.\"</li><li><strong>Democratic Autopsy:</strong> A DNC report blames the Biden White House for the loss of Kamala Harris, citing a lack of party unity.</li><li><strong>Base Erosion:</strong> FT polling shows voters blaming Trump for inflation, while evangelicals question if his rhetoric aligns with Christian values.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The 2028 Pipeline:</strong> A power struggle is already emerging within the GOP between VP JD Vance and Secretary of State Marco Rubio.</li><li><strong>Populist Shift:</strong> Democrats are pivoting toward working-class messaging, evidenced by a former firefighter winning a key Pennsylvania primary.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legislative Clash:</strong> The House has blocked Trump from conducting further Middle East strikes without congressional approval.</li><li><strong>Legal Pressure:</strong> A DOJ probe into Gavin Newsom is creating early volatility for the 2028 presidential cycle.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy and rapid rearmament, straining its relationships with both France and the U.S.</p><p><strong>Why it matters:</strong> Berlin's shift from a \"civilian power\" to a military leader creates a power vacuum in EU coordination and triggers retaliation from the Trump administration.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Germany aims to hit the 3.5% GDP NATO target six years ahead of schedule.</li><li><strong>Procurement:</strong> Berlin is overhauling its arms agency and seeking new fighter jet partners to ensure leadership roles match its financial contributions.</li><li><strong>Industry:</strong> The government is buying a 40% stake in tank maker KNDS and eyeing a €12bn takeover of a warship project by Rheinmetall.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>The U.S. Rift:</strong> After Chancellor Friedrich Merz criticized U.S. strategy in Iran, Donald Trump launched a review of U.S. troops in Germany and ordered 5,000 soldiers to withdraw.</li><li><strong>The France Gap:</strong> Paris fears Berlin is \"going it alone,\" threatening European industrial sovereignty and the Franco-German axis.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Far-Right Surge:</strong> The AfD leads opinion polls by leveraging voter anger over fuel prices and maintaining ties with the Kremlin.</li><li><strong>CDU Infighting:</strong> Friedrich Merz faces internal challenges from younger conservatives like Hendrik Wüst as polls slide.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>EU Integration:</strong> The Finance Ministry is prioritizing a Capital Markets Union over national interests to boost financial services.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the U.S. troop review and whether Berlin's \"financial contribution\" model for arms projects permanently alienates EU partners.</p>", "central banks": "<p>Global central banks are pivoting toward aggressive tightening to combat war-driven inflation and currency instability.</p><p><strong>Why it matters:</strong> Geopolitical conflict in Iran has triggered energy shocks, forcing banks to abandon rate-cut biases to prevent inflation from spiraling.</p><p><strong>The Fed shift</strong></p><ul><li><strong>New Leadership:</strong> Kevin Warsh has begun his tenure as Fed Chair, signaling a \"new chapter\" of sweeping reforms.</li><li><strong>Policy Pivot:</strong> The Fed has dropped its bias for rate cuts, tilting toward hikes as inflation nears double the target.</li><li><strong>Market Reaction:</strong> U.S. government bonds dropped following vows to tame the inflation jolt.</li></ul><p><strong>Global contagion</strong></p><ul><li><strong>Eurozone:</strong> The ECB is the first G7 bank to raise rates since 2023, citing a \"broadening\" of price rises.</li><li><strong>Asia:</strong> Indonesia and the Philippines raised rates to shore up currencies and combat energy shocks.</li><li><strong>Japan:</strong> The BoJ raised rates to 1% for the first time since 1995 and will limit bond purchase reductions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Trust Erosion:</strong> Central banks are repatriating gold reserves due to sanctions and global insecurity.</li><li><strong>De-dollarization:</strong> The ECB is tightening its course amid a broader trend of debt restructuring and reduced reliance on the dollar.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bank of England:</strong> Markets are watching the June meeting to see if the BoE holds at 3.75% or bows to demands for an immediate increase.</li><li><strong>Fed Direction:</strong> Warsh's inaugural rate meeting will establish the trajectory for his term amidst high volatility.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand their balance sheets and international footprints.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing Wall Street giants to outpace European and Swiss rivals while diversifying into digital retail and private credit.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks due to regulatory loosening.</li><li><strong>$20 billion:</strong> Potential acquisition budget JPMorgan may deploy following a $50 billion surge in excess capital.</li><li><strong>$114 billion:</strong> Combined revenues of non-bank trading firms (e.g., Citadel, Jane Street) challenging traditional bank dominance.</li><li><strong>€15 billion:</strong> Value of the Citi-BlackRock partnership targeting European private lending.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical hedging:</strong> Banks are navigating a volatile US-China relationship. Morgan Stanley is issuing China-specific iPhones for data security, while Jamie Dimon is praising China's consistency.</li><li><strong>Retail pivot:</strong> JPMorgan is transitioning from a UK-centric digital experiment to a full-scale European rollout in France, Spain, Italy, and Germany.</li><li><strong>Internal friction:</strong> Goldman Sachs is expanding its management committee to stabilize leadership amid high-profile executive departures and internal disputes.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Crypto integration:</strong> Morgan Stanley will launch spot crypto trading via E*Trade, signaling deeper institutional adoption of digital assets.</li><li><strong>Risk offloading:</strong> JPMorgan is actively seeking to transfer $4 billion in private equity-linked loans to mitigate exposure to a PE slowdown.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>18 Jun 2026 13:53 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
