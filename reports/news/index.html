const SUMMARIES = {"oil and gas": "<p>AI-driven power demand is triggering a massive pivot toward fossil fuel infrastructure in the U.S.</p><p><strong>Why it matters:</strong> The energy requirements for AI data centers are outpacing renewable deployment. This creates a paradoxical surge in gas turbine spending and battery storage demand to prevent grid collapse.</p><p><strong>The AI energy surge</strong></p><ul><li><strong>U.S. Spending:</strong> Fossil fuel power investment in the U.S. is set to exceed China's for the first time in decades.</li><li><strong>M&A Boom:</strong> AI is driving a record $200 billion merger and acquisition wave in the U.S. power sector.</li><li><strong>Grid Risk:</strong> Utility executives warn of imminent blackouts without significant infrastructure investment and rate hikes.</li></ul><p><strong>Global energy volatility</strong></p><ul><li><strong>EU Gas:</strong> Storage levels are tracking toward a 15-year low heading into winter.</li><li><strong>Russian Imports:</strong> The EU faces internal conflict over banning Russian gas and oil amid supply crises in the Strait of Hormuz.</li><li><strong>Critical Minerals:</strong> Battery metal futures (cobalt, lithium) are spiking as volatility increases.</li></ul><p><strong>Corporate shifts</strong></p><ul><li><strong>Strategic Alliances:</strong> Eni and Mercuria are partnering to capture commodity trading profits.</li><li><strong>Resource Expansion:</strong> Alcoa acquired South32’s alumina assets for $4.8 billion to hedge against Middle East disruptions.</li><li><strong>Leadership Turmoil:</strong> BP faces further instability as Deputy CEO Carol Howle departs.</li></ul><p><strong>What's next:</strong> Watch for a widening gap between \"green\" climate goals and the physical reality of AI power needs, likely resulting in weakened EU climate rules and prolonged reliance on natural gas.</p>", "corporate earnings and results": "<p>Big Tech faces a mounting collision between AI expansion and regulatory constraints.</p><p><strong>Why it matters:</strong> Regulatory fines and infrastructure bottlenecks are shifting from theoretical risks to direct balance sheet liabilities.</p><p><strong>The regulatory squeeze</strong></p><ul><li><strong>Google:</strong> The European Court of Justice upheld a record €4.1bn fine over Android, signaling a zero-tolerance approach to Big Tech dominance.</li><li><strong>OpenAI:</strong> The company is proposing a 5% government stake to mitigate rising political pressure and secure legitimacy.</li><li><strong>Energy:</strong> FERC has given grid operators 60 days to justify data center connections or face federal mandates.</li></ul><p><strong>Market volatility</strong></p><ul><li><strong>Quant Strategies:</strong> \"Garbage rallies\" are triggering tremors for systematic investors, destabilizing quantitative models.</li><li><strong>Leverage:</strong> The Bank of England is moving to limit hedge fund leverage to stabilize the gilt market, potentially raising funding costs.</li></ul><p><strong>What's next:</strong> Watch for a shift in AI capital expenditure. Companies must now balance aggressive scaling with the cost of compliance and energy grid limitations.</p>", "middle east war": "<p>The U.S. and Iran have entered a volatile cycle of ceasefire agreements and retaliatory strikes.</p><p><strong>Why it matters:</strong> Persistent instability in the Strait of Hormuz threatens global energy supplies and disrupts international shipping lanes.</p><p><strong>The current state of play</strong></p><ul><li><strong>Fragile Truce:</strong> The White House claims a deal to halt strikes, but Tehran disputes the confirmation.</li><li><strong>Military Escalation:</strong> Recent U.S. strikes followed Iranian attacks on commercial shipping; Iran responded by targeting installations in Bahrain and Kuwait.</li><li><strong>Lebanon Tension:</strong> A U.S.-backed peace deal faces backlash from Hizbollah as Israeli troops maintain territorial occupation.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>50%:</strong> The current level of traffic in the Strait of Hormuz compared to pre-war levels due to sea mines.</li><li><strong>195,000:</strong> U.S. defense jobs sustained by Europe's rearmament drive.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic decoupling:</strong> Investors are hedging against volatility, with hedge funds rebounding and U.S. stocks hitting six-year quarterly gains despite the conflict.</li><li><strong>Logistics shift:</strong> Maersk reports higher profits as U.S. companies stockpile goods to avoid upcoming tariffs and war-related delays.</li><li><strong>Strategic pivot:</strong> The U.S. is moving toward a \"McDonald’s model\" of modular, mass-produced missile manufacturing to sustain long-term attrition.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic push:</strong> Steve Witkoff and Jared Kushner are in Doha for high-level talks, though direct meetings with Iranian officials are not currently planned.</li><li><strong>Regional shifts:</strong> Syria is beginning to replace Assad-era legislation via a newly appointed parliament.</li></ul>", "shipping": "<p>Global shipping is facing a volatile convergence of geopolitical conflict and trade policy shifts.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and looming U.S. tariffs are driving extreme price swings and operational risks for global supply chains.</p><p><strong>The Hormuz Crisis</strong> A recent blockade and subsequent fragile U.S.-Iran accord have left the maritime industry in limbo:</p><ul><li><strong>The Backlog:</strong> Nearly 1,200 ships carrying $125B in goods were stranded.</li><li><strong>The Cost:</strong> Insurers slashed war premiums by over 50% following the ceasefire, but Iran now seeks to impose \"insurance fees\" for passage.</li><li><strong>The Risk:</strong> Tanker owners fear a market crash as record profits driven by the conflict evaporate upon full reopening.</li></ul><p><strong>Trade & Geopolitics</strong> Political maneuvers are reshaping logistics and vessel ownership:</p><ul><li><strong>Tariff Rush:</strong> Shipping rates have hit their highest levels since the 2024 Red Sea crisis as firms race to import goods before new Trump tariffs take effect.</li><li><strong>Shadow Fleets:</strong> The UK is actively intercepting Russian \"shadow fleet\" tankers; meanwhile, Ukraine is seeking legal justification to attack them.</li><li><strong>Strategic Shifts:</strong> FedEx is selling its logistics unit to France's CMA CGM for $1.4B to strengthen the latter's U.S. foothold.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$125B:</strong> Value of goods stranded during the Hormuz blockade.</li><li><strong>$1.4B:</strong> Price tag for CMA CGM's acquisition of FedEx's logistics arm.</li><li><strong>400+:</strong> Ships still waiting for full Hormuz reopening.</li></ul><p><strong>What's next:</strong> Watch for the implementation of Iranian transit fees and the actual impact of U.S. tariffs on freight volumes.</p>", "artificial intelligence": "<p>AI is shifting from a speculative tech trend to a systemic disruptor across global markets, governance, and labor.</p><p><strong>Why it matters:</strong> Rapid deployment is outpacing regulation, creating volatility in financial markets and overloading legal systems while forcing a rethink of national security and education.</p><p><strong>The regulatory push</strong></p><ul><li><strong>White House:</strong> Accelerating AI model standards and lifting specific bans on Anthropic models to balance safety with innovation.</li><li><strong>UK Strategy:</strong> Shifting focus toward local community utility over the dominance of U.S. tech firms.</li><li><strong>Global Risk:</strong> Experts warn that a lack of multilateral \"arms control\" between the U.S. and China could escalate geopolitical tensions.</li></ul><p><strong>Market & Economic impact</strong></p><ul><li><strong>Financial Stability:</strong> The Bank of England is considering \"kill switches\" for AI trading to prevent volatile \"herding behavior.\"</li><li><strong>Investment Shift:</strong> Wall Street is rotating capital toward chipmakers fueling hyperscaler spending, despite a $2.2tn dip in \"Magnificent Seven\" stocks.</li><li><strong>Labor Paradox:</strong> Contrary to job-loss fears, heavy AI spenders are currently hiring staff faster than their peers.</li></ul><p><strong>Sector breakthroughs</strong></p><ul><li><strong>Pharma:</strong> Anthropic's \"Claude Science\" is targeting drug discovery and 3D protein rendering.</li><li><strong>Sports:</strong> AI and robotics are being integrated into athlete training to break performance barriers.</li><li><strong>Legal:</strong> A surge in AI-assisted employment claims is overwhelming tribunal systems.</li></ul><p><strong>What's next:</strong> Watch for the White House's upcoming guidance on model standards, which will signal the government's threshold for \"safe\" AI rollouts.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony that threatens to dismantle the existing multilateral order.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Economic instability:</strong> \"Tit-for-tat\" trade wars and critical mineral disputes create self-defeating cycles that destabilize the global economy.</li><li>  <strong>Power vacuum:</strong> As the U.S. retreats from its traditional leadership role, Beijing is attempting to position itself as a pillar of stability without assuming the associated responsibilities.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Asymmetric alliances:</strong> Russia's geopolitical missteps have forced a one-sided dependency on China, granting Beijing significant leverage.</li><li>  <strong>Resource weaponization:</strong> China's crackdown on rare earth smuggling signals a shift toward using critical minerals as diplomatic leverage.</li><li>  <strong>Fragile stability:</strong> High-level summits between Xi and Trump provide temporary stability but fail to resolve the underlying \"Thucydides Trap.\"</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Strategic resilience:</strong> Allies like Japan are prioritizing \"new capabilities\" to survive a turbulent, multipolar environment.</li><li>  <strong>Institutional overhaul:</strong> Pressure is mounting to reinvent global governance as traditional multilateral institutions fail to manage great-power competition.</li></ul>", "us elections": "<p>Internal fractures and economic discontent are reshaping the US electoral landscape ahead of the midterms.</p><p><strong>Why it matters:</strong> Ideological volatility within both parties creates unpredictable general election dynamics. Democratic establishment leaders are losing ground to socialists, while Trump-backed candidates risk alienating moderate Republicans.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive surge:</strong> Socialist victories in Colorado and New York signal a rejection of party establishment strategies.</li><li><strong>Internal turmoil:</strong> Misconduct allegations against Maine candidate Graham Platner and a critical DNC autopsy on the Harris loss highlight leadership instability.</li></ul><p><strong>The Republican gamble</strong></p><ul><li><strong>MAGA dominance:</strong> Ken Paxton’s Texas primary win confirms Trump's grip on the GOP base.</li><li><strong>General election risk:</strong> Democrats view Trump-endorsed candidates as too divisive for moderate swing voters.</li></ul><p><strong>Key pressure points</strong></p><ul><li><strong>Economy:</strong> FT polling shows voters blame Trump for inflation and rising grocery prices.</li><li><strong>Foreign Policy:</strong> Congressional pushback on Iran war powers reflects deep disquiet over executive overreach.</li><li><strong>Corporate Influence:</strong> The defeat of pro-regulation candidate Alex Bores demonstrates the political leverage of the AI lobby.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California Governor race:</strong> A showdown between Steve Hilton and Xavier Becerra will serve as a bellwether for MAGA appetite.</li><li><strong>Texas Senate race:</strong> This contest will determine if Trump's endorsement is a liability or an asset in purple states.</li></ul>", "german politics": "<p>Germany is grappling with a volatile mix of internal political instability and a fragmented defense strategy.</p><p><strong>Why it matters:</strong> Berlin is struggling to balance its role as Europe's primary economic engine with the urgent need to modernize its military amid rising far-right influence and strained transatlantic ties.</p><p><strong>Defense in disarray</strong></p><ul><li><strong>Procurement failures:</strong> Berlin scrapped the F126 frigate program due to cost overruns and is overhauling its arms procurement agency to speed up spending.</li><li><strong>Strategic pivots:</strong> Germany is seeking new fighter jet partners after ditching France and is pursuing Tomahawk missiles despite tensions with Donald Trump.</li><li><strong>Industrial stakes:</strong> The government is buying a 40% stake in tank maker KNDS to secure domestic production.</li></ul><p><strong>Political volatility</strong></p><ul><li><strong>AfD surge:</strong> The far-right party leads opinion polls by leveraging voter anger over fuel prices and maintaining ties with the Kremlin.</li><li><strong>Leadership friction:</strong> Chancellor Friedrich Merz faces internal challenges from younger conservatives like Hendrik Wüst as polls slide.</li><li><strong>Security threats:</strong> Spy agencies warn of rising left-wing terrorism triggered by far-right extremism and Middle East conflicts.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Pension reform:</strong> Merz is pushing for a Swedish-style public pension fund to invest contributions in capital markets.</li><li><strong>Fiscal discipline:</strong> The Finance Ministry is threatening to cut funding for ministries that fail to spend infrastructure budgets quickly.</li><li><strong>EU tension:</strong> Berlin is facing criticism from the ECB and Netflix over protectionist stances on banking and media investment.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's decision on the Strait of Hormuz mission and the outcome of the KNDS IPO, both of which will signal Germany's actual capacity for rapid military deployment.</p>", "central banks": "<p>New Fed Chair Kevin Warsh is dismantling traditional guidance to prioritize flexibility and structural reform.</p><p><strong>Why it matters:</strong> Removing predictable tools like the \"dot plot\" increases market volatility but allows the Fed to react faster to economic shifts.</p><p><strong>The Warsh Strategy</strong></p><ul><li><strong>Communication:</strong> Axing forward guidance to avoid boxing the bank into specific rate paths.</li><li><strong>Growth:</strong> Betting on AI to drive productivity-based economic expansion.</li><li><strong>Independence:</strong> Vowing to maintain price stability despite potential White House pressure.</li></ul><p><strong>Global Divergence</strong></p><ul><li><strong>ECB:</strong> Signaling a shift away from the aggressive inflation-fighting force used in 2022-23.</li><li><strong>Bank of Japan:</strong> Maintaining a hawkish tilt as authorities struggle to stabilize the yen.</li><li><strong>G7 Risk:</strong> Increasing policy fragmentation threatens global financial stability.</li></ul><p><strong>Between the lines</strong> Warsh is trading \"Fedspeak\" predictability for transparency. While he seeks to reform the balance-sheet framework, investors warn this lack of a roadmap could spike US borrowing costs.</p><p><strong>What's next</strong> Markets will watch for Warsh's first major policy shift regarding the inflation framework to see if \"reform\" means a higher inflation target or tighter discipline.</p>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and pursue aggressive international growth.</p><p><strong>Why it matters:</strong> Reduced capital requirements are freeing billions in liquidity, allowing lenders to increase investor payouts and acquisitions while simultaneously increasing systemic risk.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital gain for top US and UK banks due to regulatory loosening.</li><li><strong>$700 billion:</strong> Potential losses US banks would face in a severe economic crash, per Fed stress tests.</li><li><strong>$20 billion:</strong> The amount JPMorgan may spend on new acquisitions following deregulation.</li><li><strong>$114 billion:</strong> Combined revenue of non-bank trading firms (e.g., Citadel, Jane Street) challenging Wall Street dominance.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory arbitrage:</strong> US banks are gaining a competitive edge over EU and Swiss rivals who remain constrained by stricter capital rules.</li><li><strong>Leadership instability:</strong> High-profile exits and shifting succession plans at JPMorgan and Goldman Sachs signal internal friction over strategy and governance.</li><li><strong>Geopolitical hedging:</strong> Banks are adopting \"China-only\" hardware and diversifying into European retail markets to mitigate US political volatility and data security risks.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Basel III battles:</strong> Wall Street will continue lobbying regulators to further ease capital rules to maximize leverage.</li><li><strong>Private credit pivot:</strong> Partnerships like the Citi-BlackRock deal show banks shifting toward private lending to compete with shadow banking.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>02 Jul 2026 12:27 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
