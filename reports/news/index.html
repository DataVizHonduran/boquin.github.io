const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in Iran is driving record profits for Western oil majors while destabilizing global energy supplies.</p><p><strong>Why it matters:</strong> Escalating conflict in the Strait of Hormuz creates a volatile feedback loop: soaring refining margins boost corporate balance sheets, but supply disruptions spike consumer prices and trigger environmental disasters.</p><p><strong>The profit paradox</strong></p><ul><li><strong>Windfalls:</strong> ExxonMobil, Chevron, and BP report record profits fueled by high fuel prices and refining margins.</li><li><strong>Capital allocation:</strong> European majors are increasing share buybacks, while BP focuses on debt reduction.</li><li><strong>The cost:</strong> The OBR warns UK living standards will flatline as energy prices and taxes rise.</li></ul><p><strong>Geopolitical flashpoints</strong></p><ul><li><strong>Iran:</strong> Tanker attacks in the Strait of Hormuz are causing oil spills in the UAE and forcing Tehran to ration domestic gas.</li><li><strong>Russia:</strong> A controversial Trump-Putin deal to import Russian diesel to the US has sparked legal threats from Congress and potential port blocks in New Jersey.</li><li><strong>Ukraine:</strong> Washington is leveraging future business ties for US oil majors as a bargaining chip in peace negotiations.</li></ul><p><strong>The energy transition struggle</strong></p><ul><li><strong>Nuclear:</strong> Small modular reactors are pitched for AI data centers, but large-scale projects like Sizewell are labeled \"terrible deals\" for taxpayers.</li><li><strong>Critical minerals:</strong> China is reportedly obstructing US-backed exploration for essential minerals in the DR Congo.</li><li><strong>UK Policy:</strong> The government is balancing gasfield approvals (Jackdaw, Rosebank) against a push for heat pumps and waste-to-energy networks.</li></ul><p><strong>What's next:</strong> Watch for the impact of the UK autumn Budget on household energy costs and whether US legal challenges successfully halt sanctioned Russian diesel shipments.</p>", "corporate earnings and results": "<p>Investors are pivoting away from AI-driven growth bets as concerns mount over unsustainable tech spending.</p><p><strong>Why it matters:</strong> Over-reliance on AI productivity gains is creating a valuation bubble. If spending doesn't yield immediate returns, capital will continue shifting toward safer assets like bonds.</p><p><strong>The AI cooldown</strong></p><ul><li><strong>OpenAI:</strong> Slashed its funding target by $10 billion, now seeking $20 billion at a $1.25 trillion valuation.</li><li><strong>Anthropic:</strong> Blackstone warns the company may receive a \"high junk\" rating following its IPO.</li><li><strong>Labor Market:</strong> Tech sector data shows rising productivity paired with falling employment, signaling early AI displacement.</li></ul><p><strong>Banking divergence</strong></p><ul><li><strong>France:</strong> BNP Paribas, SocGen, and Crédit Agricole reported strong Q3 earnings, but political instability is triggering a sell-off.</li><li><strong>Supervision:</strong> Regulators are exploring AI deployment to prevent systemic failures similar to the SVB collapse.</li></ul><p><strong>Private equity shifts</strong></p><ul><li><strong>Debt pivot:</strong> Apollo and Thrive are transitioning toward debt financing to maintain profitability amid a generational shift in PE.</li><li><strong>Mega-deals:</strong> CD&R is pursuing a buyout of Global Payments, a $40 billion card processor.</li></ul><p><strong>What's next:</strong> Watch for Spotify's AI remix launch next year. It serves as a litmus test for whether consumers will pay monthly premiums for AI-generated creative tools.</p>", "middle east war": "<p>Israel and Iran are locked in a high-stakes escalation cycle as Benjamin Netanyahu fights to retain power.</p><p><strong>Why it matters:</strong> A paralyzed Israeli government creates a power vacuum that may incentivize a preemptive strike on Iran to secure Netanyahu's political survival.</p><p><strong>The political deadlock</strong></p><ul><li>Netanyahu lacks a clear majority following record-high voter turnout.</li><li>He is currently serving as caretaker prime minister, granting him temporary operational freedom.</li><li>Arab parties have gained significant seats, potentially acting as kingmakers.</li></ul><p><strong>The Iranian threat</strong></p><ul><li>Tehran warned of \"immediate\" retaliation without \"geographical limitations\" if attacked.</li><li>Iran has shifted tactics, using limpet mines on tankers in the Strait of Hormuz.</li><li>The regime is simultaneously rushing to rebuild domestic infrastructure damaged in previous conflicts.</li></ul><p><strong>Between the lines</strong></p><ul><li>Netanyahu is using the \"fear factor\" and allegations of foreign election interference to maintain his grip on the right-wing coalition.</li><li>Qatari mediators are racing to prevent a US-Israeli bombing campaign before US midterm elections.</li></ul><p><strong>What's next</strong></p><ul><li>Watch for whether Netanyahu launches a military campaign to force a coalition deal.</li><li>Monitor Hormuz shipping lanes for increased Iranian harassment of commercial vessels.</li></ul>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict in the Middle East and Black Sea drives costs to record highs.</p><p><strong>Why it matters:</strong> War-driven disruptions in the Strait of Hormuz and the Black Sea are creating a severe tanker shortage, spiking oil prices and forcing a total reconfiguration of global trade routes.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers.</li><li><strong>$100,000:</strong> Monthly salary for captains transiting the Strait of Hormuz.</li><li><strong>24:</strong> Vessels targeted by Iran in a two-week span.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Shadow Fleets:</strong> Russia is expanding its flagged fleet and using coordinated location spoofing to bypass Western sanctions.</li><li><strong>Asset Pivot:</strong> Old supertankers now command higher premiums than new builds because immediate availability outweighs vessel age.</li><li><strong>Strategic Shifts:</strong> Maersk is aggressively acquiring ships to compete with CMA CGM, while Trafigura is IPO-ing its shipping arm to capitalize on high rates.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Price Volatility:</strong> Vitol warns of a potential $200-a-barrel oil price if shipping bottlenecks persist.</li><li><strong>Legal Precedents:</strong> The Mercuria vs. Baltic Exchange court case will determine the liability of price indices during active warfare.</li><li><strong>Green Transition:</strong> Falling biodiesel costs may accelerate the shift to cleaner fuels despite the current crisis.</li></ul>", "artificial intelligence": "<p>Wall Street is questioning the return on investment for the massive capital expenditures driving the AI boom.</p><p><strong>Why it matters:</strong> Soaring cash burn at Big Tech firms is triggering market volatility as investors shift focus from AI potential to actual profitability.</p><p><strong>By the numbers</strong></p><ul><li><strong>$900 billion:</strong> Market value shed by Big Tech during recent AI-driven routs.</li><li><strong>22%:</strong> Drop in Intel shares following a weak sales outlook.</li><li><strong>$35 billion:</strong> The IPO valuation target for Nscale, a neocloud project facing construction and financing risks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Cannibalization:</strong> Alphabet admits \"AI mode\" is eroding traditional search revenue, proving AI can disrupt a company's own core profit engine.</li><li><strong>Leadership shift:</strong> Executive value is migrating from technical expertise to strategic judgment and governance as agentic tools automate routine tasks.</li><li><strong>Verification crisis:</strong> The rise of high-volume AI agents is creating a proportional need for human verification to prevent systemic errors.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Governance focus:</strong> Companies will prioritize ethical frameworks to mitigate reputational harm during rapid rollouts.</li><li><strong>Strategic pivot:</strong> CEOs will increasingly use agentic tools to offload operations and focus on long-term strategy.</li><li><strong>IPO scrutiny:</strong> Anthropic's upcoming public debut will serve as a litmus test for whether investors still value \"existential\" AI growth over immediate margins.</li></ul>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic rivalry.</p><p><strong>Why it matters:</strong> Economic interdependence no longer guarantees peace. Both nations now prioritize national security over market efficiency, triggering a global shift toward protectionism and fragmented supply chains.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership deficit:</strong> Current leadership in both Washington and Beijing is viewed as transactional and short-sighted, increasing the risk of miscalculation.</li><li><strong>The \"Middle Power\" pivot:</strong> Nations like Australia and members of the BRICS bloc are diversifying ties to avoid becoming collateral damage in the bilateral struggle.</li><li><strong>End of \"Win-Win\":</strong> The post-Cold War era of mutual economic gain has been replaced by a \"Great Game\" mentality where one side's gain is viewed as the other's loss.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>GDP Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li><strong>Strategic realignment:</strong> Increased coordination among non-Western powers is a direct response to U.S. tariffs and sanctions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Managed competition:</strong> Expect continued high-level summits, but these will function as risk-management tools rather than paths toward true détente.</li><li><strong>Supply chain decoupling:</strong> \"Middle powers\" will continue pushing for economic security frameworks to reduce reliance on both superpowers.</li></ul>", "us elections": "<p>The U.S. midterms are transforming into a high-stakes referendum on Donald Trump and the cost of living.</p><p><strong>Why it matters:</strong> Control of Congress will dictate the legislative trajectory of Trump's second term and signal whether voters prioritize economic affordability over MAGA-led cultural battles.</p><p><strong>The core tensions</strong></p><ul><li><strong>Economics vs. Ideology:</strong> Voters are focused on an \"affordability crisis\" and corruption, while Trump's messaging remains centered on personal grievances and surreal rhetoric.</li><li><strong>Institutional Stability:</strong> Concerns over political violence and election fraud claims—highlighted by Trump's $1M reward for fraud tips—threaten the peaceful transfer of power.</li><li><strong>Public Health:</strong> A surge in measles is creating a strategic vulnerability for Republicans due to RFK Jr.’s vaccine skepticism.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Bond Market Logic:</strong> Investors may actually prefer a split government. Gridlock reduces the likelihood of volatile policy swings.</li><li><strong>The \"Blue Wave\" Risk:</strong> Democratic gains in the Senate could effectively neutralize Trump's legislative agenda for the remainder of his term.</li><li><strong>Voter Fatigue:</strong> A deluge of unlimited campaign spending has left voters \"over\" political advertising, potentially depressing turnout or fueling anti-establishment sentiment.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate Arithmetic:</strong> Key battles in Texas and Alaska will determine the balance of power in the upper house.</li><li><strong>Post-Election Volatility:</strong> Former strategist Steve Bannon predicts a \"civil war\" within the GOP regardless of the outcome.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz's dwindling domestic authority weakens Germany's leadership within the EU and stalls critical economic and pension reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Electoral collapse:</strong> Poor regional results in the east have left the CDU without seats in some state parliaments.</li><li><strong>Coalition strain:</strong> The resignation of the labor minister signals deepening instability within the government.</li><li><strong>AfD infiltration:</strong> Allegations that CDU lawmakers traded votes with the far-right have triggered a crisis of legitimacy.</li></ul><p><strong>Security and Geopolitics</strong></p><ul><li><strong>Espionage:</strong> Recent arrests of Ukrainian nationals passing intel to the Kremlin highlight \"intense\" Russian infiltration.</li><li><strong>Rearmament:</strong> A historic shift toward military power is fueling domestic alarm over Germany's returning arms industry.</li><li><strong>Diplomatic pivots:</strong> High-level meetings with Russia and Turkey signal a pragmatic, if tense, attempt to manage external threats.</li></ul><p><strong>Economic headwinds</strong></p><ul><li><strong>Investment risk:</strong> Executives are wary of the AfD's rise, threatening Germany's broader investment drive.</li><li><strong>Market friction:</strong> Merz is actively blocking regional plans to seize landlord property to protect market economy stability.</li></ul><p><strong>What's next:</strong> Watch Hendrik Wüst, the premier of North Rhine-Westphalia. As Merz's popularity plummets, Wüst is emerging as the primary \"chancellor-in-waiting.\"</p>", "central banks": "<p>Central banks are maintaining current interest rates while signaling a shift toward further tightening to combat persistent inflation.</p><p><strong>Why it matters:</strong> Sticky inflation in the U.S., U.K., and Japan is forcing policymakers to abandon \"insurance cuts\" and prepare for higher long-term borrowing costs.</p><p><strong>The leadership shift</strong></p><ul><li>ECB President Christine Lagarde will step down in February, ahead of her 2027 term expiration.</li><li>Frontrunners for her successor include Pablo Hernández de Cos and Klaas Knot.</li><li>The transition occurs amid heightened French bond market turbulence.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>7:</strong> The number of policy meetings the Fed will hold next year, down from the traditional eight.</li><li><strong>$90B:</strong> Amount spent by India's central bank to defend the rupee.</li><li><strong>2.5%:</strong> The current ECB interest rate held steady during Lagarde's departure announcement.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hawkish pivot:</strong> Analysts have raised 2027 rate forecasts for the BoE and BoJ.</li><li><strong>Fed strategy:</strong> Strong U.S. growth and PCE data are keeping the Federal Reserve on a tightening path.</li><li><strong>New risks:</strong> BoE Governor Andrew Bailey has flagged AI agents as a primary threat to financial stability.</li></ul><p><strong>What's next</strong></p><ul><li>The Fed will decide its October rate path amid high market volatility.</li><li>The BoE is expected to begin a \"precautionary tightening cycle\" in November.</li><li>The EU continues developing a geopolitical strategy via public digital money.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition defined by AI-driven deposit flight, regulatory penalties, and a cooling trading boom.</p><p><strong>Why it matters:</strong> Banks face a dual threat: AI agents are empowering savers to move billions to higher-yield accounts, while systemic compliance failures are triggering massive fines.</p><p><strong>The AI threat</strong></p><ul><li><strong>Deposit flight:</strong> Lenders fear AI agents could cost the industry $500 billion by automating the search for better rates.</li><li><strong>Defensive moves:</strong> Citi has already restricted AI agents from accessing accounts to prevent rapid capital outflows.</li></ul><p><strong>Financial performance</strong></p><ul><li><strong>Trading volatility:</strong> Goldman Sachs saw a 30% net income rise driven by equities, but analysts warn the record-breaking trading streak is cooling.</li><li><strong>Regulatory costs:</strong> BofA profits dropped 17% following a $1.2 billion money laundering fine; Amex was fined $350 million for similar systemic failures.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>China expansion:</strong> Citi received long-awaited approval for its China securities business ahead of high-level US-China diplomatic meetings.</li><li><strong>Talent wars:</strong> Citi is shortening its junior banker promotion path to two years to prevent poaching by private equity firms.</li><li><strong>Market gaps:</strong> Tech-focused startup Erebor has surged to $7 billion in deposits, filling the void left by the Silicon Valley Bank collapse.</li></ul><p><strong>Between the lines</strong> The \"cash cow\" of modern banking has shifted. Post-crisis regulations mean banks no longer place the bets; instead, they profit from the borrowing sprees of trillion-dollar hedge funds.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>31 Oct 2026 15:52 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
