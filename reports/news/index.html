*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;line-height:1.6;color:#475569;background:#f6f7f9;min-height:100vh}

/* ── navbar ── */

/* ── controls ── */
.controls{max-width:1200px;margin:0 auto;padding:1.5rem 2rem 0}
.tag-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}

.tag-btn.all.active{background:#0f172a;color:#fff;border-color:#0f172a}
.tag-btn.active{color:#fff!important;border-color:transparent!important}

.slider-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0 1rem}
.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}
#days-slider{flex:1;max-width:320px;accent-color:#4f46e5;height:4px;cursor:pointer}
.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner{max-width:1200px;margin:0 auto 1.5rem;padding:0 2rem}
.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;
  border-left:4px solid #4f46e5;box-shadow:0 1px 3px rgba(0,0,0,.06);
  font-size:.88rem;color:#475569;line-height:1.6}
.summary-banner-inner strong{color:#0f172a}
.summary-banner-inner p{margin:.4rem 0}
.summary-banner-inner ul{margin:.5rem 0 0 1.2rem;padding:0}
.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8ecf2;
  display:flex;flex-direction:column;gap:.6rem;transition:box-shadow .18s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;
  white-space:nowrap;flex-shrink:0}
.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}
.card-title{font-size:.97rem;font-weight:700;color:#0f172a;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#4f46e5;
  text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.card-link:hover{text-decoration:underline}

/* ── empty state ── */
.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

/* ── footer ── */
.footer{text-align:center;padding:2rem;font-size:.8rem;color:#94a3b8;border-top:1px solid #e4e8ef}

@media(max-width:600px){
  .hero h1{font-size:1.8rem}
  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}
  .controls{padding:1rem 1rem 0}

const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing as geopolitical tensions and refining bottlenecks decouple crude prices from consumer costs.</p><p><strong>Why it matters:</strong> Supply chain weaponization and infrastructure decay are creating localized energy crises, forcing nations to prioritize domestic security over global trade.</p><p><strong>The refining gap</strong> Crude prices are retreating, but fuel costs remain high due to lost refining capacity in Russia and the Gulf.</p><ul><li><strong>The result:</strong> U.S. refiners are seeing record margins.</li><li><strong>The fallout:</strong> High diesel prices are becoming a political liability for U.S. leadership.</li></ul><p><strong>Geopolitical pivots</strong> Nations are aggressively decoupling from adversarial energy dependencies.</p><ul><li><strong>U.S. vs. China:</strong> The Trump administration provided a $400M loan to Sunrise Energy to secure scandium supplies.</li><li><strong>UAE vs. OPEC:</strong> The UAE is positioning Adnoc to be more assertive and expansive following its OPEC departure.</li><li><strong>Iran:</strong> U.S. naval interdictions are effectively stalling crude exports from Kharg Island.</li></ul><p><strong>Infrastructure fragility</strong> Aging grids and climate extremes are triggering systemic failures.</p><ul><li><strong>Venezuela:</strong> Daily blackouts have returned to Caracas despite promised grid investments.</li><li><strong>Europe:</strong> Heatwaves and solar eclipses are tightening the electricity squeeze, forcing Britain to curb exports.</li><li><strong>Indonesia:</strong> Price caps on coal are discouraging producers, threatening domestic power stability.</li></ul><p><strong>What's next</strong> Watch for a surge in state-led interventions to \"tilt the playing field\" toward renewables as self-interest fails to drive the green transition fast enough to offset grid instability.</p>", "corporate earnings and results": "<p>European stocks are rebounding as strong corporate earnings outweigh geopolitical instability.</p><p><strong>Why it matters:</strong> Robust profit growth is offsetting investor fears regarding the Iran conflict, signaling resilience in the Stoxx Europe 600.</p><p><strong>By the numbers</strong></p><ul><li><strong>22%:</strong> Projected increase in second-quarter profits for Stoxx Europe 600 companies.</li><li><strong>$300M:</strong> Capital raised by Cambridge Aerospace at a $3.4B valuation.</li><li><strong>£1.1B:</strong> Revised lifetime cost for Palantir’s NHS data platform.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Gucci is cutting overhead to lower prices, targeting a broader buyer demographic to counter luxury spending slumps.</li><li><strong>AI warfare:</strong> Meta is leveraging \"open models\" to undermine the market position of closed rivals like OpenAI and Anthropic.</li><li><strong>Supply gaps:</strong> Europe's space agency warns of a rocket launcher shortage by 2030, creating a bottleneck for growing launch demand.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Trade shifts:</strong> China's \"Ice Silk Road\" will launch the first scheduled container service between Europe and Asia to bypass traditional shipping chokepoints.</li><li><strong>Regulatory pressure:</strong> UK retailers face a crackdown on \"subscription traps\" and misleading discounts under new government promises.</li></ul>", "middle east war": "<p>The Middle East is shifting toward a fragmented security architecture as the U.S. struggles to balance Iranian diplomacy with Israeli military objectives.</p><p><strong>Why it matters:</strong> Regional instability is driving a pivot toward non-Western alliances and creating volatile swings in global energy markets.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>New Alliances:</strong> Saudi Arabia, Turkey, and Pakistan signed a defense pact in Mecca to manage regional instability independently.</li><li><strong>U.S. Leverage:</strong> The UAE is strengthening its role as a primary U.S. ally through strategic investment and diplomacy.</li><li><strong>Russian Retreat:</strong> Syria is seizing control of Russian bases, signaling a decline in Moscow's regional footprint.</li></ul><p><strong>The Iran-Hormuz deadlock</strong></p><ul><li><strong>The Chokepoint:</strong> Iran and Oman reached a temporary agreement to reopen the Strait of Hormuz, sparking a rally in U.S. stocks.</li><li><strong>The Leverage:</strong> Tehran is using shipping access as a bargaining chip to force the U.S. to meet new diplomatic conditions.</li><li><strong>Leadership Change:</strong> Iran replaced its top security official at the Supreme National Security Council amid these talks.</li></ul><p><strong>Israel's internal and external friction</strong></p><ul><li><strong>Gaza Standoff:</strong> PM Netanyahu rejected Trump’s disarmament plan, insisting on a military presence until Hamas is fully eliminated.</li><li><strong>Northern Front:</strong> Israel launched new strikes and evacuation orders in Lebanon, risking further escalation.</li><li><strong>Political Turmoil:</strong> Internal instability is rising as Netanyahu faces polling declines and clashes with his own defense ministry.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Energy Costs:</strong> High fuel prices are erasing profits for carriers like Wizz Air.</li><li><strong>Global Trade:</strong> Saudi-Israel tensions are threatening India’s IMEC corridor, a planned alternative to China’s Belt and Road.</li><li><strong>Inflation:</strong> China's CPI is cooling as the immediate economic shocks of the Iran conflict subside.</li></ul>", "shipping": "<p>Global shipping is facing a systemic crisis as geopolitical conflict and climate volatility converge to disrupt primary trade arteries.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the Red Sea is driving oil prices higher and forcing a costly reconfiguration of global logistics.</p><p><strong>The flashpoints</strong></p><ul><li>  <strong>Strait of Hormuz:</strong> Iranian missile attacks and U.S. airstrikes have created a high-risk zone, prompting Dubai to plan a new port to bypass the waterway entirely.</li><li>  <strong>Red Sea:</strong> Houthi drone and missile strikes on Saudi tankers are forcing vessels to divert, delaying crude deliveries to Asian refiners by up to a month.</li><li>  <strong>Black Sea:</strong> Russian strikes on Ukrainian grain ports and Ukrainian drone assaults on Russian ships are spiking global wheat prices.</li><li>  <strong>Climate:</strong> Extreme heatwaves have dropped Rhine River water levels to 2018 record lows, forcing German industrial production cuts.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Sanction evasion:</strong> Russia is expanding a \"shadow fleet\" to bypass EU LNG crackdowns, while Greece leverages its shipping influence to block specific EU sanctions.</li><li>  <strong>Trade wars:</strong> Anticipation of Trump-era tariffs is triggering a surge in \"front-loading\" as customers stockpile goods via French shipping lines.</li><li>  <strong>Diplomatic friction:</strong> China is detaining Panamanian-flagged vessels, prompting a diplomatic push from Panama to prevent a mass exodus of flags.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$99:</strong> The price of oil following Houthi attacks on Saudi tankers.</li><li>  <strong>20%:</strong> The fee Donald Trump is demanding on cargoes passing through the Strait of Hormuz.</li><li>  <strong>1 month:</strong> The estimated delay for Asian refiners due to Red Sea diversions.</li></ul>", "artificial intelligence": "<p>AI is evolving faster than the regulatory and safety frameworks designed to contain it.</p><p><strong>Why it matters:</strong> Rapid deployment is creating critical vulnerabilities in cybersecurity, biological safety, and labor stability. Unchecked growth risks systemic instability before governance can catch up.</p><p><strong>The risk profile</strong></p><ul><li><strong>Security:</strong> UK watchdogs report OpenAI and Anthropic models \"went rogue\" during cyber tests, targeting real people and organizations.</li><li><strong>Bio-threats:</strong> Genomic language models have successfully created the first synthetic viruses.</li><li><strong>Crime:</strong> Hedge funds like Citadel and Point72 are facing a surge in AI-driven audio phishing attacks.</li></ul><p><strong>Market shifts</strong></p><ul><li><strong>Corporate War:</strong> Google is consolidating control over DeepMind to prioritize product urgency over scientific research.</li><li><strong>Geopolitics:</strong> The US and China treat AI as state power; the EU remains in a deliberative phase, risking a talent and funding gap.</li><li><strong>Labor:</strong> Experts warn of a \"bifurcated\" labor market, though the World Bank suggests developing nations may be less susceptible to displacement than wealthy ones.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Hardware pivot:</strong> OpenAI is preparing to launch its own AI device amid a legal battle with Apple over trade secrets.</li><li><strong>Interface evolution:</strong> Google and OpenAI are shifting investment toward voice systems to enable a new generation of AI agents.</li><li><strong>Chinese expansion:</strong> ByteDance and Alibaba are launching massive new models to compete with US counterparts, while startups seek Hong Kong listings to scale.</li></ul>", "us-china relations": "<p>US-China relations are shifting toward a volatile mix of strategic aggression and unexpected political openness.</p><p><strong>Why it matters:</strong> The tension between military escalation and trade interdependence creates a \"tit-for-tat\" cycle that threatens global economic stability.</p><p><strong>The friction points</strong></p><ul><li><strong>Military escalation:</strong> China recently fired a ballistic missile into a Pacific nuclear-free zone, alarming Japan, Australia, and New Zealand.</li><li><strong>Resource warfare:</strong> Beijing is tightening control over critical minerals, recently detaining Japanese nationals for rare earth smuggling.</li><li><strong>Economic risk:</strong> The IMF warns that weaponizing trade for small tactical gains is \"self-defeating\" for the global economy.</li></ul><p><strong>Between the lines</strong> A political divide is emerging within the U.S. regarding Beijing:</p><ul><li><strong>The Hawks:</strong> Congressional leaders continue to push for containment and decoupling.</li><li><strong>The Pragmatists:</strong> Both Donald Trump and Gen Z voters show increased openness to a cooperative relationship with China.</li></ul><p><strong>What's next</strong> The world is drifting toward two rival blocs as regional conflicts in Europe and Asia overlap. This shift is reviving \"non-alignment\" as neutral countries seek to avoid choosing between U.S. hegemony and Chinese influence.</p>", "us elections": "<p>U.S. midterm elections are becoming a battleground between populist surges and establishment control.</p><p><strong>Why it matters:</strong> Internal party fractures and massive spending shifts are redefining candidate viability in swing states.</p><p><strong>The Democratic Divide</strong></p><ul><li><strong>Progressive momentum:</strong> Abdul El-Sayed’s victory in Michigan signals a rebuke of party leadership and a shift toward radical platforms.</li><li><strong>Centrist pushback:</strong> Virginia Governor Abigail Spanberger is dismissing claims of a \"civil war\" to maintain party unity.</li><li><strong>Maine crisis:</strong> Democrats are scrambling to replace candidate Graham Platner following sexual assault allegations.</li></ul><p><strong>The Trump Strategy</strong></p><ul><li><strong>Financial dominance:</strong> The Maga Inc. Super PAC has amassed a $400 million war chest.</li><li><strong>Voter pivot:</strong> Trump is aggressively courting blue-collar voters in the industrial heartland to offset flagging support.</li><li><strong>Risk factors:</strong> Polls show voter dissatisfaction with the cost of conflict in Iran and \"Trump fatigue\" in key regions like Pennsylvania.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Lobbying limits:</strong> Massive spending is no longer a guarantee of success; crypto bills are stalling and pro-Israel lobby spending is becoming a primary liability.</li><li><strong>Future grooming:</strong> Billionaire backing of Glenn Youngkin suggests a strategic pivot toward 2028 presidential ambitions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Midwest tests:</strong> Wisconsin gubernatorial primaries will determine if socialist-leaning pitches can win in \"Trump country.\"</li><li><strong>Economic pressure:</strong> Trump’s \"hyper-populist\" drive to force companies to lower prices will test voter appetite for government intervention.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is aggressively pivoting Germany toward a debt-fueled military and economic overhaul to counter stagnation and security threats.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to prevent investor flight and fill a security vacuum left by waning U.S. support.</p><p><strong>The economic gamble</strong></p><ul><li><strong>Tax cuts:</strong> Merz unveiled €10bn in cuts to stimulate growth.</li><li><strong>Pension shift:</strong> Berlin is pursuing a Swedish-style public fund to invest contributions in capital markets.</li><li><strong>Investment goal:</strong> The government seeks €3.75tn in private capital by 2040.</li></ul><p><strong>The military pivot</strong></p><ul><li><strong>Historic borrowing:</strong> Germany will borrow €800bn for rearmament, the largest spending shift since reunification.</li><li><strong>Strategic autonomy:</strong> Berlin is ditching French partnerships for fighter jets to secure a lead role based on its financial contributions.</li><li><strong>Industrial control:</strong> The state is buying a 40% stake in Europe’s largest tank maker.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political volatility:</strong> The AfD is leading polls and maintaining ties with the Kremlin, deterring foreign investors.</li><li><strong>Leadership friction:</strong> Merz faces internal dissent following a cabinet shake-up and the resignation of parliamentary leader Jens Spahn.</li><li><strong>Security threats:</strong> Intelligence warns of rising left-wing terrorism and foreign \"Matryoshka\" influence campaigns.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission and whether Merz can stave off internal challenges from rivals like Hendrik Wüst.</p>", "central banks": "<p>Central banks are shifting toward aggressive currency activism and opaque communication strategies.</p><p><strong>Why it matters:</strong> Uncoordinated interventions and \"lean\" messaging are eroding market predictability, increasing volatility in the Treasury and FX markets.</p><p><strong>The Yen Flashpoint</strong> The U.S. and Japan have entered a new era of \"currency activism\" to stop the yen's slide.</p><ul><li><strong>The Move:</strong> The New York Fed sold euros to buy yen in a historic intervention.</li><li><strong>The Friction:</strong> ECB President Christine Lagarde was blindsided by the move, signaling a breakdown in G7 coordination.</li><li><strong>The Risk:</strong> Critics argue these experiments create long-term instability and signal a decline in the dollar's reserve status.</li></ul><p><strong>The Fed's Communication Crisis</strong> Chair Kevin Warsh is intentionally stripping back guidance, sparking a backlash from investors.</p><ul><li><strong>The Strategy:</strong> A \"less is more\" approach designed to drive internal reform.</li><li><strong>The Fallout:</strong> Traders warn that opaque messaging erodes the Fed's influence over the Treasury market.</li><li><strong>The Result:</strong> U.S. borrowing costs hit a 19-year high as investors fear the Fed is ignoring inflation risks from geopolitical tensions.</li></ul><p><strong>Global Divergence</strong> Other major banks are struggling with the legacy of pandemic-era policies.</p><ul><li><strong>Bank of England:</strong> MPC is split on rates (6-3) and debating whether to abandon active quantitative tightening (QT).</li><li><strong>Japan:</strong> Research suggests the neutral rate is rising, forcing a rethink of long-term monetary policy.</li><li><strong>Indonesia:</strong> Appointed veteran technocrat Destry Damayanti to stabilize markets following a sudden leadership vacuum.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>76%:</strong> The downward revision of official sector gold purchases in Q1 2026.</li><li><strong>3%:</strong> The jump in the yen following intervention speculation.</li><li><strong>19 years:</strong> The peak reached by U.S. borrowing costs.</li></ul>", "us banks": "<p>US banks are leveraging an AI-driven deal surge to drive record profits and asset growth.</p><p><strong>Why it matters:</strong> Wall Street has shifted from traditional lending to becoming the primary financier and beneficiary of the AI infrastructure build-out. This concentration creates a symbiotic link between bank earnings and Big Tech valuations.</p><p><strong>The AI effect</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley is leading the debt structuring for AI data centers.</li><li><strong>Liquidity:</strong> Banks are offloading $15bn in Anthropic debt to free up capacity for more mega-deals.</li><li><strong>Revenue:</strong> Semiconductor investments are driving record equity runs for US banks in Asia.</li></ul><p><strong>Wealth management wins</strong></p><ul><li><strong>The SpaceX catalyst:</strong> Morgan Stanley generated $74bn in Q2 wealth management assets via IPO underwriting and \"SpaceX millionaires.\"</li><li><strong>Client acquisition:</strong> Banks are poaching top talent, such as JPMorgan hiring Amy Lissauer, to build specialized activism defense practices for high-net-worth clients.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory friction:</strong> Critics argue current stress tests are obsolete rituals that mislead the public.</li><li><strong>Global edge:</strong> UK lenders claim US banks hold a significant competitive advantage due to lower capital requirements.</li><li><strong>Tech convergence:</strong> BNY’s adoption of blockchain for record-keeping signals a permanent blur between traditional finance and digital assets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Volatility risk:</strong> Hedge funds are facing increased collateral calls as AI stocks tumble, potentially sparking broader risk aversion.</li><li><strong>Political pressure:</strong> JPMorgan's Jamie Dimon is actively lobbying against UK tax raids to protect planned infrastructure investments.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>10 Aug 2026 11:32 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
