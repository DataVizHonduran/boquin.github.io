const SUMMARIES = {"oil and gas": "<p>Geopolitical volatility and the AI boom are decoupling traditional energy strategies from long-term climate goals.</p><p><strong>Why it matters:</strong> Supply chain instability and surging power demands for data centers are forcing a pivot toward immediate energy security over gradual transitions.</p><p><strong>The AI power gap</strong></p><ul><li>The U.S. is building electricity transmission lines at 25% of the rate seen a decade ago.</li><li>This infrastructure deficit threatens the scalability of AI data centers.</li><li>Companies are turning to biomass and small nuclear reactors to bridge the gap, despite high costs and technical skepticism.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>LNG dominance:</strong> Qatar is on track to become the largest buyer of U.S. LNG by 2033.</li><li><strong>Asset shedding:</strong> Shell is exiting mature assets, selling its Australian gas stake to Abu Dhabi's XRG for $1.45B.</li><li><strong>Refinery stagnation:</strong> Oil majors are resisting new refinery investments, opting to profit from high margins caused by existing capacity shortages.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>Supply risks:</strong> Germany failed to meet winter gas storage targets, increasing EU reliance on volatile spot markets.</li><li><strong>Security threats:</strong> Iranian tanker attacks in the Strait of Hormuz are causing environmental damage and disrupting shipping.</li><li><strong>Critical minerals:</strong> U.S. government backing for domestic minerals has fueled lobbying efforts but failed to significantly increase actual production.</li></ul><p><strong>Between the lines</strong> The \"energy transition\" is hitting a pragmatic wall. While renewable mandates increase (e.g., UK community investment laws), the immediate priority for majors and nations has shifted to securing shale gas and maintaining refining margins amid conflict.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI demand and GLP-1 drugs clash with geopolitical friction and operational failures.</p><p><strong>Why it matters:</strong> Market volatility is shifting from broad economic trends to sector-specific shocks, specifically in AI infrastructure and healthcare regulation.</p><p><strong>The winners</strong></p><ul><li><strong>Novo Nordisk:</strong> Raising forecasts due to higher-than-expected demand for Wegovy weight-loss pills.</li><li><strong>Uber:</strong> Accelerating robotaxi deployment with a goal of 2,000 vehicles by late 2025.</li></ul><p><strong>The losers</strong></p><ul><li><strong>BMW:</strong> Downgrading financial targets for the second time since June as China sales slump.</li><li><strong>Ahold Delhaize:</strong> Cutting profit forecasts following a fourth-quarter cyber attack.</li><li><strong>CVS Health:</strong> Breaking up its $102bn empire to spin off 9,000 drugstores amid PBM political pressure.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Friction:</strong> Oracle canceled a $7bn Tencent deal due to Trump administration pressure, signaling increased US-China tech decoupling.</li><li><strong>Infrastructure Pushback:</strong> Democratic gubernatorial wins in Texas, Georgia, and Ohio suggest a growing political barrier to data center expansion.</li><li><strong>Risk Exposure:</strong> The collapse of Arini Capital and the dissolution of Weil lawyers highlight fragility in high-risk corporate debt and legal talent markets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>AI Bubble Watch:</strong> Analysts are warning of a potential \"AI bust\" if current financial engineering outweighs actual productivity gains.</li><li><strong>Supply Chain Shifts:</strong> Solvay's Brazilian rare earths deal marks a strategic move to reduce European and US dependence on Chinese minerals.</li></ul>", "middle east war": "<p>The U.S. is pivoting toward a diplomatic resolution with Iran following a Republican midterm defeat.</p><p><strong>Why it matters:</strong> Domestic political pressure is forcing a shift in U.S. foreign policy to stabilize oil prices and avoid a high-cost regional escalation.</p><p><strong>The pivot</strong></p><ul><li>President Trump announced an end to $4bn in annual military aid to Israel by year-end.</li><li>Washington is engaging in Qatari-led mediation to avert a full-scale bombing campaign.</li><li>The administration is signaling a move toward talks after the Supreme Leader granted Iranian officials authority to negotiate.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong><$100:</strong> Oil prices tumbled below this threshold on hopes for peace.</li><li><strong>$4bn:</strong> The amount of annual U.S. funding to Israel slated for termination.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political causality:</strong> JD Vance explicitly linked Republican midterm losses to voter anger over the Iran war.</li><li><strong>Strategic tension:</strong> Prime Minister Netanyahu is actively lobbying Trump for renewed strikes, contradicting the U.S. shift toward diplomacy.</li><li><strong>Regional risk:</strong> Despite talks, Iran has warned of \"immediate\" retaliation without \"geographical limitations\" if attacked.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market volatility:</strong> Oil prices will remain sensitive to the success or failure of U.S.-Iran diplomatic channels.</li><li><strong>Regional stability:</strong> The Gulf remains on high alert for escalation, which diplomats warn would be more damaging than previous conflicts.</li></ul>", "shipping": "<p>Global shipping is fracturing into high-risk war zones and opportunistic new corridors.</p><p><strong>Why it matters:</strong> Geopolitical conflict in the Black Sea and Strait of Hormuz is driving record freight costs and forcing a structural shift in global trade routes.</p><p><strong>The risk zones</strong></p><ul><li><strong>Strait of Hormuz:</strong> Iranian attacks on tankers have spiked daily costs to $1.2M and pushed captain salaries to $100k/month.</li><li><strong>Black Sea:</strong> Now the world's deadliest route for commercial sailors due to Russia-Ukraine combat.</li><li><strong>Gulf of Oman:</strong> US naval blockades of Iranian ports are increasing the frequency of military-commercial collisions.</li></ul><p><strong>The pivots</strong></p><ul><li><strong>Arctic Shift:</strong> Northern Sea Route transits have quadrupled as ships avoid the Middle East and ice melts.</li><li><strong>UK Infrastructure:</strong> London Gateway is poised to overtake Felixstowe, driven by a surge in Chinese EV imports.</li><li><strong>Russian Tactics:</strong> Moscow is expanding its flagged fleet and using \"spoofing\" to fake vessel locations to evade sanctions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> Potential oil price per barrel if tanker shortages create a critical bottleneck.</li><li><strong>24.6M:</strong> Daily barrels of Middle East oil exports, currently exceeding pre-war levels via alternative routes.</li><li><strong>1/3:</strong> The increase in ships sailing under the Russian flag to secure fossil fuel exports.</li></ul><p><strong>Between the lines</strong> Immediate vessel availability now outweighs technical specifications. The market for old supertankers is currently more valuable than new builds because they can be deployed instantly to high-rate war zones.</p><p><strong>What's next</strong> Watch for a potential \"shipping squeeze.\" Despite rebounding export volumes, the shortage of available supertankers threatens to trigger a new wave of global inflation via diesel shortages.</p>", "artificial intelligence": "<p>Wall Street is questioning the economic viability of the AI boom as infrastructure costs outpace revenue.</p><p><strong>Why it matters:</strong> Massive capital expenditure is creating a \"cash burn\" crisis. High interest rates are making the debt required to fund data centers more expensive, threatening the stability of the AI bubble.</p><p><strong>The financial squeeze</strong></p><ul><li><strong>Spending spikes:</strong> Anthropic revealed $900bn in spending commitments; OpenAI slashed its funding target by $10bn.</li><li><strong>Market rout:</strong> Big Tech lost nearly $900bn in market value as investors scrutinized the ROI of hyperscaler spending.</li><li><strong>Credit risk:</strong> Investors are demanding higher yields for data center financing; Anthropic faces a potential \"high junk\" credit rating post-IPO.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>China decoupling:</strong> Nvidia is forcing data center clients to reduce Chinese exposure to comply with trade pressures.</li><li><strong>Cyber warfare:</strong> GCHQ warns that AI-driven attacks from Russia and China will be routine by 2028.</li><li><strong>Defense integration:</strong> OpenAI is hiring former US Army leadership to accelerate military AI modernization.</li></ul><p><strong>Labor and Safety</strong></p><ul><li><strong>Employment shift:</strong> Tech sector productivity is rising while employment drops, creating a barrier for entry-level workers.</li><li><strong>Control gaps:</strong> Repeated safety breaches are undermining confidence in the ability of labs to contain powerful systems.</li></ul><p><strong>What's next:</strong> Watch for a shift from \"growth at all costs\" to \"proven monetization.\" Companies unable to bridge the gap between infrastructure spend and actual revenue will face severe valuation corrections.</p>", "us-china relations": "<p>The U.S. and China are locked in a zero-sum struggle for global primacy that transcends traditional diplomacy.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Systemic instability:</strong> The shift from \"win-win\" cooperation to geopolitical rivalry increases the risk of global conflict.</li><li>  <strong>Leadership vacuum:</strong> Current leadership in both Washington and Beijing is viewed as lacking the far-sightedness required to manage the tension.</li></ul><p><strong>Between the lines:</strong></p><ul><li>  <strong>The \"Middle Power\" pivot:</strong> Smaller nations and blocs (BRICS) are increasingly coordinating to avoid becoming hostages to U.S.-China volatility.</li><li>  <strong>Economic weaponization:</strong> Supply chain security is replacing open trade as the primary driver of national policy.</li></ul><p><strong>By the numbers:</strong></p><ul><li>  <strong>GDP Shift:</strong> The BRICS grouping now accounts for a larger share of the global economy than the G7.</li><li>  <strong>Strategic realignment:</strong> India and China are attempting a cautious rapprochement to counter U.S. tariffs and sanctions.</li></ul><p><strong>What's next:</strong></p><ul><li>  <strong>Tactical summits:</strong> Future meetings between Trump and Xi will likely focus on short-term stability rather than a true détente.</li><li>  <strong>Multilateral stress:</strong> The existing international order faces a choice between strengthening cooperation or collapsing into fragmented power blocs.</li></ul>", "us elections": "<p>Democrats have seized control of both the House and Senate in a landslide midterm rout.</p><p><strong>Why it matters:</strong> The results signal a broad national rejection of Trumpism, stripping the administration of its legislative mandate and creating a systemic check on executive power.</p><p><strong>By the numbers</strong></p><ul><li><strong>$30 billion:</strong> Estimated loss in Elon Musk's net worth following the shift.</li><li><strong>$47 million:</strong> Amount Musk spent on a failed Texas Senate bid.</li><li><strong>Broad gains:</strong> Democrats won across nearly all demographic groups and key battleground states.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic failure:</strong> Voters rejected the administration's populism due to rising costs of living.</li><li><strong>Foreign policy blowback:</strong> The war with Iran served as a primary catalyst for Republican losses.</li><li><strong>Internal collapse:</strong> GOP leadership is now fractured, with party figures blaming Trump's candidates and staff for the defeat.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legislative gridlock:</strong> Expect increased restraints on the Trump administration's second-term agenda.</li><li><strong>Corporate scrutiny:</strong> Democrats are expected to launch investigations into alleged corruption between officials and executives.</li><li><strong>Market volatility:</strong> Investors are repositioning portfolios, betting on a Democratic backlash against the AI boom.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz's declining domestic authority weakens Germany's leverage in EU budget negotiations and stalls critical economic reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition collapse:</strong> Labour Minister Bärbel Bas resigned, delaying pension and market reforms.</li><li><strong>AfD infiltration:</strong> The far-right secured its first regional parliament president via secret support from established parties.</li><li><strong>Leadership challenge:</strong> Hendrik Wüst, premier of North Rhine-Westphalia, is emerging as a popular alternative to Merz.</li></ul><p><strong>Security threats</strong></p><ul><li><strong>Espionage:</strong> Authorities arrested a Ukrainian national suspected of spying for the Kremlin; officials warned of iPhone hacks.</li><li><strong>Rearmament:</strong> Germany is aggressively bolstering its arms industry, sparking concerns over a return to military dominance.</li></ul><p><strong>Between the lines</strong> The AfD is no longer a fringe element but a systemic disruptor. By leveraging \"friendly\" Russian sentiment in eastern states, the party is creating a \"firewall\" breach that threatens the CDU's traditional conservative base.</p><p><strong>What's next</strong></p><ul><li><strong>Investment risk:</strong> Executives are weighing the surge of the far-right against Germany's long-term investment viability.</li><li><strong>EU deadlock:</strong> Merz's hobbled authority in Brussels puts the €2tn EU budget deal at risk.</li></ul>", "central banks": "<p>Global central banks are shifting toward a prolonged tightening cycle as inflation remains stubbornly above targets.</p><p><strong>Why it matters:</strong> Persistent price pressures are forcing the Fed, ECB, and BoE to prioritize rate hikes over early cuts, risking economic growth to ensure price stability.</p><p><strong>The leadership shakeup</strong> The European Central Bank faces a critical transition as President Christine Lagarde announces an early departure in February.</p><ul><li><strong>The stakes:</strong> The successor must manage bond market turbulence and maintain policy continuity.</li><li><strong>Frontrunners:</strong> Pablo Hernández de Cos and Klaas Knot are leading candidates.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>ECB:</strong> Core inflation remains well above the 2% target; rate rises projected into 2026.</li><li><strong>Fed:</strong> Shifting to seven policy meetings per year starting next year, down from eight.</li><li><strong>BoE:</strong> Expected to begin a \"short and precautionary\" tightening cycle in November.</li><li><strong>BoJ:</strong> Maintaining a quarterly tightening path.</li></ul><p><strong>Between the lines</strong> Central banks are moving away from \"insurance cuts\" and toward a \"higher for longer\" reality.</p><ul><li><strong>US Economy:</strong> Strong Q3 growth and PCE data confirm the US economy is \"running hot,\" limiting the Fed's room to pivot.</li><li><strong>Market Sentiment:</strong> Analysts have grown more hawkish for 2027 across the BoE, BoJ, Fed, and ECB.</li></ul><p><strong>What's next</strong></p><ul><li><strong>EU Strategy:</strong> The EU is accelerating the development of public digital money as part of a broader geopolitical monetary strategy.</li><li><strong>Policy Shift:</strong> A potential revival of monetarist principles, led by figures like Kevin Warsh, may challenge current signaling methods.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as record trading profits clash with AI-driven deposit risks and regulatory penalties.</p><p><strong>Why it matters:</strong> Banks are facing a \"double-edged sword\" with AI: while it promises operational efficiency and better supervision, it threatens to trigger a $500 billion exodus of deposits toward higher-yielding accounts.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Special bonuses Goldman Sachs is preparing for top executives.</li><li><strong>$350 million:</strong> Fine levied against Amex for systemic money laundering failures.</li><li><strong>17%:</strong> Drop in BofA profits following a $1.2 billion money laundering penalty.</li><li><strong>30%:</strong> Increase in Goldman Sachs' Q3 net income, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Threat:</strong> Citi and other lenders are restricting AI agents to prevent chatbots from automatically shifting customer funds to competitors.</li><li><strong>The Talent War:</strong> Citi is shortening its analyst program to two years to stop private equity firms from poaching junior bankers.</li><li><strong>The SVB Vacuum:</strong> New entrants like Erebor are scaling rapidly, capturing over $7 billion in deposits from tech clients abandoned after the SVB collapse.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Trading Cool-down:</strong> Analysts expect the record-breaking trading streak to slow as banks report Q3 results.</li><li><strong>Geopolitical Pivot:</strong> Citi's approval for a China securities business signals a strategic push ahead of high-level US-China diplomatic meetings.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>04 Nov 2026 18:11 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
