.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Oil majors are reporting record profits while aggressively shedding assets to hedge against oversupply and political volatility.</p><p><strong>Why it matters:</strong> High earnings are triggering political backlash in the U.S. and U.K., while strategic divestments signal a pivot toward leaner operations amid shifting energy demands.</p><p><strong>By the numbers</strong></p><ul><li><strong>$4 billion:</strong> Value of the U.S. biogas business BP is selling.</li><li><strong>700:</strong> Jobs BP is cutting to flatten its corporate structure.</li><li><strong>3x:</strong> The rate at which U.K. oil companies are spending on international deals compared to domestic projects.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Sanction evasion:</strong> Russia is expanding a \"shadow fleet\" of LNG ships to bypass EU crackdowns and maintain exports.</li><li><strong>AI power hunger:</strong> Rising electricity demand for data centers is reviving interest in coal and accelerating nuclear energy pivots in Italy and the U.S.</li><li><strong>Capital flight:</strong> High taxes and political instability are pushing North Sea operators to seek growth in overseas markets.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market benchmarks:</strong> Watch Adnoc's return to the Dubai benchmark as it abandons Murban futures for pricing stability.</li><li><strong>Nuclear viability:</strong> The Westinghouse IPO will serve as a key indicator for the commercial scalability of nuclear power.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are splitting between AI-driven growth and defensive consolidation.</p><p><strong>Why it matters:</strong> AI is shifting from speculative investment to tangible revenue for software firms. Meanwhile, patent expirations and currency volatility are forcing legacy giants to restructure or merge to maintain margins.</p><p><strong>By the numbers</strong></p><ul><li><strong>$10.1 billion:</strong> HSBC's quarterly profit, driven by Hong Kong wealth management.</li><li><strong>$6.3 billion:</strong> Toyota's planned buyback, boosted by a weak yen.</li><li><strong>23%:</strong> Palantir's growth in U.S. sales for AI software.</li><li><strong>$400 billion:</strong> Potential value of a merger between AstraZeneca and Bristol Myers Squibb.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Monetization:</strong> Palantir's results signal that enterprise AI demand is scaling. Google is further cementing this ecosystem by acting as a financier for startups like Anthropic.</li><li><strong>Pharma Panic:</strong> The AstraZeneca-BMS talks and Novo Nordisk's shift toward \"large\" risky deals reveal a sector desperate to diversify before major patents expire.</li><li><strong>Exit Freeze:</strong> Apollo’s decision to delay asset sales confirms a challenging environment for private equity exits.</li></ul><p><strong>What's next</strong></p><ul><li>Expect more takeovers of London-listed companies following the £14bn Prologis-Segro deal.</li><li>Watch for India's tax exemption updates to determine if foreign tech manufacturers will shift production from China.</li></ul>", "middle east war": "<p>The U.S. has launched direct military strikes on Iran following ballistic missile attacks on American forces.</p><p><strong>Why it matters:</strong> Direct U.S.-Iran kinetic conflict threatens global energy stability and disrupts diplomatic efforts to stabilize Gaza.</p><p><strong>By the numbers</strong></p><ul><li><strong>-4.8%:</strong> Saudi Arabia's Q2 GDP contraction.</li><li><strong>0.4%:</strong> Eurozone Q2 growth, exceeding expectations despite energy shocks.</li><li><strong>14:</strong> Countries joining Saudi Arabia's new maritime defense coalition to protect Red Sea shipping.</li></ul><p><strong>Between the lines</strong></p><ul><li>Trump is oscillating between aggressive military action and claims of a breakthrough deal involving Hamas disarmament.</li><li>Benjamin Netanyahu is prioritizing far-right domestic support over U.S. diplomatic pressure to avoid political collapse.</li></ul><p><strong>What's next</strong></p><ul><li>Oil prices will remain volatile as U.S. inventories hit \"precariously low\" levels.</li><li>The Bank of England may raise interest rates if energy prices stay elevated.</li></ul>", "shipping": "<p>Global shipping is destabilizing due to geopolitical conflict and climate shocks.</p><p><strong>Why it matters:</strong></p><ul><li>Attacks in the Strait of Hormuz and Red Sea are spiking energy costs and forcing permanent infrastructure shifts.</li><li>Weaponized maritime routes are disrupting global food and energy security.</li></ul><p><strong>By the numbers</strong></p><ul><li>$99: Oil price jump after Houthi attacks on Saudi tankers.</li><li>20%: Proposed fee on cargoes passing through the Strait of Hormuz.</li><li>8: Russian fuel tankers hit by Ukraine in the Sea of Azov in one night.</li></ul><p><strong>Between the lines</strong></p><ul><li>Maritime chokepoints are being converted into financial leverage tools.</li><li>Shipping flags have become geopolitical liabilities, evidenced by the Panama-China row.</li><li>Environmental crises, such as the Rhine drought, are creating internal bottlenecks that compound external war shocks.</li></ul><p><strong>What's next</strong></p><ul><li>Dubai will pursue a new port to bypass the Strait of Hormuz.</li><li>Shipping demand will spike as customers stockpile to avoid anticipated US tariffs.</li></ul>", "artificial intelligence": "<p>Big Tech is spending trillions on AI infrastructure while investors demand immediate productivity gains.</p><p><strong>Why it matters:</strong> Massive capital expenditure is creating a fragile market equilibrium. Any delay in revenue realization triggers extreme stock volatility.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1 trillion+:</strong> Total AI spending by Google, Amazon, Microsoft, and Meta.</li><li><strong>$450 billion:</strong> Market cap added to Microsoft following cloud revenue surges.</li><li><strong>$50 billion:</strong> Amazon's investment in OpenAI for a ~5% stake.</li><li><strong>$3.3 billion:</strong> Valuation of AI chip start-up Olix.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Hardware shifts:</strong> China is challenging ASML's monopoly, and Mexico is becoming a critical hub for server production.</li><li><strong>Regulatory pressure:</strong> The EU is mandating labels for AI-generated content to combat deepfakes and misinformation.</li><li><strong>The productivity gap:</strong> Despite record spending, widespread economic gains are only now beginning to materialize.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Sector consolidation:</strong> Semiconductor firms like NXP are acquiring specialized designers to prepare for the AI revolution.</li><li><strong>Agent-based monetization:</strong> Meta and others are pivoting toward personalized AI agents to drive new revenue streams.</li><li><strong>Trust erosion:</strong> The removal of Google Earth's AI tools due to fake imagery signals a growing crisis in data verification.</li></ul>", "us-china relations": "<p>U.S.-China competition is evolving into a systemic struggle for global hegemony.</p><p><strong>Why it matters:</strong></p><ul><li>Beijing is leveraging critical minerals to coerce trade partners and secure strategic advantages.</li><li>U.S. domestic volatility is eroding the perceived reliability of American security guarantees.</li></ul><p><strong>Between the lines</strong></p><ul><li>China is testing a \"tribute system\" model to exert influence without resorting to direct war.</li><li>Global trust is shifting as nations hedge against U.S. political instability and \"Trumpian caprice.\"</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Military:</strong> China is testing ballistic missiles in Pacific nuclear-free zones, alarming Japan and Australia.</li><li><strong>Trade:</strong> The IMF warns that \"tit-for-tat\" trade warfare is becoming self-defeating for the global economy.</li><li><strong>Resources:</strong> Beijing is tightening controls on rare earth exports and detaining foreign nationals for smuggling.</li></ul><p><strong>What's next</strong></p><ul><li>A rise in \"non-alignment\" as middle powers refuse to choose between the two blocs.</li><li>Increased weaponization of critical mineral supply chains to gain geopolitical leverage.</li></ul>", "us elections": "<p>A heavily funded Republican machine faces a Democratic party fractured by internal ideological warfare.</p><p><strong>Why it matters:</strong> Democratic infighting over Israel and socialist surges undermine a unified opposition. Meanwhile, Trump's approval is sliding due to inflation and the Iran war.</p><p><strong>By the numbers</strong></p><ul><li>$400 million: War chest built by pro-Trump Super PAC Maga Inc.</li><li>$300 billion: Proposed fund for Iran contingent on a peace deal.</li></ul><p><strong>Between the lines</strong></p><ul><li>Progressive victories in New York and Colorado signal a rejection of the Democratic establishment.</li><li>Silicon Valley billionaires are successfully leveraging political power to defeat AI-regulation candidates.</li><li>Trump is shifting toward a \"hyper-populist\" economic strategy to court the industrial heartland.</li></ul><p><strong>What's next</strong></p><ul><li>Maine's Senate race will test the Democrats' ability to recover from candidate scandals.</li><li>Midterm results will dictate the level of congressional resistance to Trump's second-term agenda.</li></ul>", "central banks": "<p>Central banks are shifting toward aggressive currency intervention and opaque communication as geopolitical shocks destabilize global markets.</p><p><strong>Why it matters:</strong></p><ul><li>US-Japan coordination signals a return to \"currency activism\" to prevent disorderly market swings.</li><li>A lack of clear guidance from the Fed is eroding its influence over Treasury markets, spiking borrowing costs.</li></ul><p><strong>The volatility drivers</strong></p><ul><li><strong>Geopolitical shocks:</strong> The Iran war is driving oil prices higher, forcing the BoE and ECB to weigh rate hikes against economic instability.</li><li><strong>Communication gaps:</strong> Fed Chair Kevin Warsh’s \"less is more\" approach is fueling investor anxiety and market volatility.</li><li><strong>Technological risk:</strong> BIS economists warn the AI boom makes it harder for banks to time GDP and inflation responses.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>19 years:</strong> The high reached by US borrowing costs as investors fret over inflation.</li><li><strong>76%:</strong> The downward revision of official sector gold purchases in early 2026.</li><li><strong>£22.5bn:</strong> The estimated extra capital burden UK banks carry compared to US rivals.</li></ul><p><strong>Between the lines</strong> The era of predictable, forward-guidance-led monetary policy is ending. Central banks are now reacting in real-time to \"black swan\" events, prioritizing immediate stability over long-term transparency.</p><p><strong>What's next</strong></p><ul><li><strong>ECB Pivot:</strong> Watch for a September tightening if the Strait of Hormuz remains closed.</li><li><strong>Fed Pressure:</strong> Expect increased market pressure for a rate hike if energy prices continue to surge.</li></ul>", "us banks": "<p>US banks are posting record profits driven by an AI-fueled investment boom and a surge in wealth management assets.</p><p><strong>Why it matters:</strong> The convergence of Big Tech and traditional finance is creating a new profit engine, but it increases systemic vulnerability to AI market volatility.</p><p><strong>The growth drivers</strong></p><ul><li><strong>AI Infrastructure:</strong> Morgan Stanley is leading the financing of data center build-outs.</li><li><strong>Wealth Management:</strong> SpaceX and other high-profile IPOs are funneling billions in new assets into bank portfolios.</li><li><strong>Equities Trading:</strong> A revival in large-scale deals is pushing investment banking fees to a four-year high.</li></ul><p><strong>The risk factors</strong></p><ul><li><strong>Concentration Risk:</strong> Hedge funds are facing collateral calls as AI stocks tumble, signaling potential contagion.</li><li><strong>Regulatory Friction:</strong> Debates are intensifying over the efficacy of stress tests and the impact of Quantitative Tightening (QT).</li><li><strong>Compliance Hurdles:</strong> The rise of prediction markets and blockchain records is forcing a rewrite of internal compliance and record-keeping.</li></ul><p><strong>Between the lines</strong> The \"Big Four\" (JPMorgan, Goldman, Citi, BofA) are no longer just financial intermediaries; they are functioning as proxies for the AI trade. If the AI bubble bursts, the banking sector's current \"blockbuster\" earnings will evaporate quickly.</p><p><strong>What's next</strong></p><ul><li><strong>Digital Pivot:</strong> BNY's adoption of blockchain for records marks a shift toward tokenized finance.</li><li><strong>Restructuring:</strong> Citigroup continues a \"ruthless\" overhaul under Jane Fraser to close the profitability gap with peers.</li><li><strong>Political Tension:</strong> JPMorgan's Jamie Dimon is leveraging infrastructure investments to fight proposed tax hikes in the UK.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>04 Aug 2026 12:38 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
