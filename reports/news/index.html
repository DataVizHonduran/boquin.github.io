/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Geopolitical friction and energy volatility are destabilizing global commodity markets.</p><p><strong>Why it matters:</strong> Divergent national interests are stalling climate transitions and triggering supply shocks. This creates a volatile environment where energy costs drive industrial shutdowns and political instability.</p><p><strong>The energy crunch</strong></p><ul><li><strong>UK:</strong> Household energy bills will rise 26% in January due to surging wholesale gas costs.</li><li><strong>Europe:</strong> High power costs have forced the closure of Trafigura’s Dutch zinc operations and suspended one-third of EU ammonia production.</li><li><strong>Grid Stress:</strong> Britain's grid operator is issuing record calls for power as cold weather hits and Scottish wind transmission fails.</li></ul><p><strong>Market volatility</strong></p><ul><li><strong>OPEC+:</strong> Members face a \"complicated\" clash over production estimates as markets shift toward oversupply.</li><li><strong>Critical Minerals:</strong> DR Congo reimposed a cobalt export ban to artificially shore up prices.</li><li><strong>Russia:</strong> Financier Todd Boehly is acquiring frozen Lukoil assets.</li></ul><p><strong>The climate deadlock</strong></p><ul><li><strong>COP31:</strong> Talks collapsed after the EU rejected a deal it claimed \"green washed\" fossil fuels, leaving an \"unbridgeable\" gap between the EU and Arab nations.</li><li><strong>Hydrogen:</strong> China's hydrogen transport goals are faltering in Foshan due to high costs and falling subsidies.</li><li><strong>Carbon Capture:</strong> The UK's £1bn Acorn project gained a new developer, EnEarth, to advance North Sea decarbonization.</li></ul><p><strong>What's next:</strong> Watch for increased reliance on energy imports in Europe and potential production cuts from OPEC+ to counter the looming global glut.</p>", "corporate earnings and results": "<p>AI is forcing a brutal restructuring across the global software and tech sectors.</p><p><strong>Why it matters:</strong> Rapid AI adoption is shifting the value proposition from human-led services to automated processing. This creates a \"productivity paradox\" where tech firms must cut headcount to protect margins while racing to build the infrastructure that replaces their old business models.</p><p><strong>The fallout</strong></p><ul><li><strong>Labor:</strong> SAP is exploring cuts of at least 10,000 jobs as AI disrupts traditional software delivery.</li><li><strong>Capital:</strong> VC investors are dumping legacy funds at steep discounts to liquidate cash for AI startups.</li><li><strong>Hardware:</strong> Nvidia has halted chip shipments to Southeast Asia, signaling supply chain volatility.</li></ul><p><strong>Between the lines</strong> The \"AI boom\" is transitioning from speculative excitement to operational execution. Companies are no longer just buying AI; they are restructuring their entire cost bases to survive the transition.</p><p><strong>What's next</strong> Watch for a wave of consolidation. As seen with Altria's potential bid for Imperial Brands and UniCredit's move on Commerzbank, firms are using volatility to acquire distressed or undervalued assets.</p>", "middle east war": "<p>The U.S. and Iran are locked in a volatile cycle of tit-for-tat escalation that threatens regional stability and global energy flows.</p><p><strong>Why it matters:</strong> Direct military exchanges and Houthi strikes on Saudi infrastructure signal a breakdown in deterrence. This instability risks a full-scale confrontation that could disrupt the global economy.</p><p><strong>The escalation map</strong></p><ul><li><strong>Direct strikes:</strong> Iranian attacks have killed foreign contractors in Kuwait; the U.S. is considering further strikes.</li><li><strong>Asymmetric war:</strong> The IRGC's \"Shahid Kaveh\" unit is targeting U.S. and European industrial controls via cyberattacks.</li><li><strong>Proxy pressure:</strong> Houthi rebels have shifted targets to Saudi Arabia's sovereign wealth fund (PIF) headquarters.</li></ul><p><strong>The economic fallout</strong></p><ul><li><strong>Oil flows:</strong> Crude exports through the Strait of Hormuz are falling as strikes increase.</li><li><strong>Market shift:</strong> The IEA claims markets can survive without Hormuz, but only with significant time and investment.</li><li><strong>Bond markets:</strong> The traditional link between oil prices and borrowing costs has decoupled.</li></ul><p><strong>Israeli political instability</strong></p><ul><li><strong>Leadership crisis:</strong> Opposition leader Eisenkot is forming coalitions to oust Benjamin Netanyahu.</li><li><strong>Legal battle:</strong> While some bribery charges may be dropped, the Attorney General has frozen key West Bank settlement projects.</li></ul><p><strong>What's next:</strong> Watch for the U.S. military's readiness levels. Officials warn that indefinite deployments and potential budget cuts are eroding the capacity to sustain a long-term conflict into the new year.</p>", "shipping": "<p>Global shipping is entering a high-risk era as geopolitical conflicts weaponize critical maritime chokepoints.</p><p><strong>Why it matters:</strong> Escalating attacks in the Black Sea and the Strait of Hormuz are driving up operational costs, threatening food security, and forcing a total reconfiguration of global trade routes.</p><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24:</strong> Tankers targeted by Iran in a two-week window.</li><li><strong>24.6 million:</strong> Daily barrels of Gulf oil exports, currently exceeding pre-war levels.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Tactical shifts:</strong> Iran is moving from harassment to direct sabotage using limpet mines.</li><li><strong>Deception:</strong> Russia is using coordinated \"spoofing\" to hide tanker locations and evade sanctions.</li><li><strong>Logistical strain:</strong> The Black Sea's volatility is forcing Russian grain exports into the Arctic, increasing costs for global buyers.</li><li><strong>Infrastructure pivot:</strong> London Gateway is poised to overtake Felixstowe as the primary hub for Chinese EV imports.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> Courts will decide if the Baltic Exchange can continue publishing price estimates for high-risk war zones.</li><li><strong>Political friction:</strong> U.S. state governors may block Russian diesel shipments, challenging federal energy deals.</li><li><strong>Industry consolidation:</strong> Maersk is aggressively acquiring vessels to compete with CMA CGM amid volatile demand.</li></ul>", "artificial intelligence": "<p>The AI trade is shifting from blind optimism to a volatile search for sustainable value.</p><p><strong>Why it matters:</strong> Investors are moving past the \"hardware phase\" to question whether software and services can actually monetize the technology. This transition is creating extreme volatility in chip stocks and a widening gap between AI hype and operational reality.</p><p><strong>By the numbers</strong></p><ul><li><strong>£659 million:</strong> Amount extracted from UK victims by AI-powered \"industrialized\" fraud in H1 2026.</li><li><strong>$35 billion:</strong> The threatened IPO value of data center group Nscale amid the tech sell-off.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Geopolitical friction:</strong> Europe is pursuing \"sovereign AI\" to break dependence on U.S. tech, while China struggles to innovate without U.S.-style capital markets.</li><li><strong>The productivity paradox:</strong> While firms rush to adopt AI for efficiency, researchers warn of \"hidden costs\" and the loss of creative friction.</li><li><strong>Market rotation:</strong> Investors are no longer treating all AI plays as a monolith, separating semiconductor winners from software laggards.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory scrutiny:</strong> Expect increased focus on AI safety and guidance for youth, particularly in the UK.</li><li><strong>Sector correction:</strong> Drug development and economics will likely see a \"reality check\" as the limits of AI in complex, high-stakes discovery become clear.</li></ul>", "us-china relations": "<p>The U.S., China, and Russia are attempting to establish a \"Yalta 2.0\" framework to carve up global spheres of influence.</p><p><strong>Why it matters:</strong> A trilateral agreement between Trump, Xi, and Putin threatens to sideline middle powers and dismantle the current rules-based international order. This shift would prioritize great-power stability over democratic sovereignty and regional autonomy.</p><p><strong>Between the lines</strong></p><ul><li><strong>China's play:</strong> Beijing is leveraging the summit to project global leadership and reshape the international order on its own terms.</li><li><strong>Russia's gain:</strong> Putin is utilizing the meeting to gain legitimacy and potentially secure territorial concessions in Europe.</li><li><strong>U.S. volatility:</strong> The approach reflects a transactional foreign policy that prioritizes short-term deals over long-term alliances.</li></ul><p><strong>The ripple effect</strong></p><ul><li><strong>Middle powers:</strong> Smaller nations face increasing dependency as AI dominance and geopolitical maneuvering limit their strategic autonomy.</li><li><strong>Europe:</strong> The EU faces a security vacuum if the U.S. retreats from its role as a security guarantor.</li><li><strong>Ukraine:</strong> The push for a rapid peace deal risks rewarding aggression to achieve a diplomatic win.</li></ul><p><strong>What's next:</strong> Watch for a \"joint statement\" from the trilateral summit that could formally redefine boundaries in Eastern Europe and the Indo-Pacific.</p>", "us elections": "<p>Democrats secured a sweeping victory in the US midterms, seizing control of Congress and dealing a blow to the MAGA movement.</p><p><strong>Why it matters:</strong> The shift in power enables Democrats to launch aggressive corruption investigations into the Trump administration and pivot the party's focus from \"woke\" politics to class-based economic issues.</p><p><strong>By the numbers</strong></p><ul><li><strong>56:</strong> The Democratic tally in the 100-member Senate.</li><li><strong>$500 million:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>1881:</strong> The last time a Black senator represented Mississippi until Scott Colom's victory.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Gerrymandering failed:</strong> Republican redistricting efforts were insufficient to stop the Democratic wave.</li><li><strong>Demographic shift:</strong> Older voters, traditionally Republican, moved toward Democrats in significant numbers.</li><li><strong>Media collapse:</strong> Trump's grip on the podcast and new media landscape weakened as allies abandoned the administration.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership transitions:</strong> Hakeem Jeffries is positioned to become the first Black Speaker of the House.</li><li><strong>Oversight surge:</strong> House Democrats plan to use their majority to probe administration conflicts of interest, specifically regarding Navy budget appointments.</li><li><strong>2028 horizon:</strong> Early momentum is building for Alexandria Ocasio-Cortez as a future presidential contender.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is aggressively pivoting Germany toward a \"security-first\" posture amid rising Russian aggression and internal political instability.</p><p><strong>Why it matters:</strong> Germany is abandoning its post-Cold War caution to lead European defense, but this shift is colliding with domestic fiscal constraints and a surging far-right.</p><p><strong>The security pivot</strong></p><ul><li><strong>Ukraine:</strong> Merz is using EU budget ultimatums to force unanimous financial support for Kyiv.</li><li><strong>Intelligence:</strong> Spy agencies received sweeping new powers to conduct disruptive operations against foreign adversaries.</li><li><strong>Military:</strong> Christian Freuding, a Ukraine-linked officer, now leads the Bundeswehr's transformation.</li></ul><p><strong>Internal friction</strong></p><ul><li><strong>Fiscal tension:</strong> The Council of Economic Experts warns against defense borrowing to avoid a 98% debt-to-GDP ratio by 2040.</li><li><strong>Political instability:</strong> The resignation of the labor minister and CDU scandals regarding AfD ties are straining the coalition.</li><li><strong>Far-right rise:</strong> The AfD is gaining institutional footholds, including its first regional parliament president.</li></ul><p><strong>Between the lines</strong> The \"firewall\" Merz claims to lead is leaking. While he pushes for a hardline geopolitical stance, the domestic cost—unpopular reforms and the rise of the AfD—threatens the stability required to sustain that leadership.</p><p><strong>What's next</strong> Watch for the March transition of the presidency to Ilse Aigner and the outcome of the investment summit, where the government must convince skeptical executives that Germany remains open for business despite political volatility.</p>", "central banks": "<p>Central banks are pivoting toward aggressive inflation control while grappling with the systemic risks of the AI boom.</p><p><strong>Why it matters:</strong> Persistent inflation is forcing a return to hawkish policies, while massive AI capital expenditures create new, opaque financial vulnerabilities.</p><p><strong>The leadership shift</strong></p><ul><li>Pablo Hernández de Cos will succeed Christine Lagarde as ECB president.</li><li>He enters the role facing a \"baptism of fire\": the end of a tightening cycle and political instability in France.</li></ul><p><strong>The policy landscape</strong></p><ul><li><strong>Bank of England:</strong> Raised rates to 4% with a clear signal that further hikes are coming to prevent entrenched inflation.</li><li><strong>Federal Reserve:</strong> Considering a 50bp hike in December if inflation fails to slow; balance sheet volatility remains a key risk.</li><li><strong>Bank of Korea:</strong> Increased benchmark rates to 3.25% amid an AI-driven economic surge.</li><li><strong>Bank of Japan:</strong> Rate hikes in December are now uncertain due to contracting real GDP.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Bubble:</strong> The ECB warns that AI borrowing patterns mirror the subprime bubble, citing trillions in off-balance sheet commitments by hyperscalers.</li><li><strong>Growth Paradox:</strong> Fed officials suggest AI could sustain higher GDP growth without triggering inflation, potentially decoupling the traditional growth-inflation link.</li></ul><p><strong>What's next</strong></p><ul><li>Watch for the Fed's December decision on whether to implement a larger-than-expected rate hike.</li><li>Monitor the ECB's transition under Hernández de Cos as it balances inflation targets with potential debt crises.</li></ul>", "us banks": "<p>Wall Street is pivoting toward AI integration and talent retention as traditional trading booms face a potential cooldown.</p><p><strong>Why it matters:</strong> Banks are fighting a two-front war: competing with private credit for borrowers while preventing AI agents from automating deposit flight to higher-yield competitors.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks if AI agents shift deposits to better rates.</li><li><strong>30%:</strong> Goldman Sachs' Q3 net income increase, driven by equities.</li><li><strong>$350 million:</strong> Amex fine for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> Bank of America fine contributing to a 17% profit drop.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Talent War:</strong> Citi is shortening analyst programs to two years to stop private equity poaching. Goldman is elevating a record number of engineers to partner to secure tech talent.</li><li><strong>The AI Paradox:</strong> Banks are deploying AI for supervision and efficiency but restricting AI agents from account access to protect low-interest deposit bases.</li><li><strong>Regulatory Friction:</strong> Divergent US and EU banking reforms are widening, while US lenders face increasing scrutiny over AML (Anti-Money Laundering) compliance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>China Expansion:</strong> Citi's new securities business approval sets the stage for strategic moves ahead of US-China diplomatic meetings.</li><li><strong>Leadership Shifts:</strong> JPMorgan and Evercore are restructuring executive ranks to manage succession and operational scale.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>26 Nov 2026 19:46 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
