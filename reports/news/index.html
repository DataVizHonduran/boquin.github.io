const SUMMARIES = {"oil and gas": "<p>Global oil markets are caught between plummeting U.S. inventories and weakening Chinese demand.</p><p><strong>Why it matters:</strong> A critical supply-demand tug-of-war is preventing a price breakout while increasing geopolitical vulnerability.</p><p><strong>The tension</strong></p><ul><li><strong>Bearish:</strong> China's import cuts are shielding the market, keeping crude prices below $100 a barrel.</li><li><strong>Bullish:</strong> U.S. oil stocks have hit their lowest levels since 2004 due to conflict in Iran.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure pivots:</strong> Gulf states are planning pipelines to bypass the Strait of Hormuz to mitigate shipping disruptions.</li><li><strong>Financial shifts:</strong> U.S. and Japanese banks are increasing fossil fuel financing, while European banks retreat.</li><li><strong>Corporate instability:</strong> BP faces investor backlash and leadership turmoil, undermining its strategic clarity.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Price volatility:</strong> Markets will likely spike once U.S. inventories hit a \"critically low\" threshold.</li><li><strong>Production shifts:</strong> OPEC+ is raising quotas, though shipping restrictions will limit the actual market impact.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are facing a volatile convergence of geopolitical instability and structural market shifts.</p><p><strong>Why it matters:</strong> Geopolitical shocks and regulatory hurdles are directly eroding profit margins while forcing a pivot toward private capital.</p><p><strong>The pressure points</strong></p><ul><li><strong>Geopolitical risk:</strong> WHSmith shares plummeted 19% following profit warnings linked to the Iran conflict.</li><li><strong>Operational barriers:</strong> American manufacturing growth is stalled by skills shortages and permitting complexities.</li><li><strong>Regulatory friction:</strong> UK small business filing changes and EU steel tariffs are creating new compliance and trade costs.</li></ul><p><strong>The private pivot</strong></p><ul><li><strong>Capital flight:</strong> Private equity giants Apollo and Blackstone are filling the gap, evidenced by a $35bn deal to fund Anthropic.</li><li><strong>Alternative assets:</strong> Ares raised $8.5bn by targeting non-traditional debt like music royalties and data centers.</li><li><strong>Market scarcity:</strong> A potential surge in IPOs from SpaceX and OpenAI may reduce the buybacks that have historically supported equity prices.</li></ul><p><strong>What's next</strong></p><ul><li><strong>AI integration:</strong> Companies are leveraging \"financial engineering\" to attract risk-averse investors into AI ventures.</li><li><strong>Infrastructure bets:</strong> BYD is investing €2bn in European charging tech to disrupt legacy automotive earnings.</li></ul>", "middle east war": "<p>The U.S., Israel, and Iran are locked in a volatile cycle of retaliatory strikes that threaten to collapse a fragile ceasefire.</p><p><strong>Why it matters:</strong> Escalation risks a total regional war, triggering global energy shocks and straining the U.S.-Israel strategic alliance.</p><p><strong>The friction points</strong></p><ul><li><strong>U.S. vs. Iran:</strong> Washington hit Iranian radar sites and reservoirs after a U.S. helicopter was downed; Tehran retaliated against U.S. facilities in Jordan and Bahrain.</li><li><strong>U.S. vs. Israel:</strong> President Trump is clashing with PM Netanyahu over war goals, insisting the U.S. \"calls the shots\" to force a peace deal.</li><li><strong>Israel vs. Iran:</strong> Both nations recently halted counterstrikes after a series of ballistic missile exchanges and strikes in Beirut.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100 billion:</strong> Estimated hit to airlines from jet fuel costs following Iranian energy shocks.</li><li><strong>20,000:</strong> People in Iran left without water after U.S. strikes on reservoir tanks.</li><li><strong>101:</strong> Days of conflict as the region navigates a precarious two-month truce.</li></ul><p><strong>Between the lines</strong></p><ul><li>Trump is shifting from diplomatic mediation to coercive pressure, threatening that Iran will \"pay the price\" for delaying a deal.</li><li>Netanyahu’s reliance on a purely military strategy is creating a diplomatic rift with the White House.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Financial leverage:</strong> The U.S. is weighing the seizure of Iranian assets to compensate Gulf allies for war damages.</li><li><strong>Diplomatic pressure:</strong> Trump is pushing Netanyahu to accept a deal with Tehran to end the cycle of retaliation.</li></ul>", "shipping": "<p>Global shipping is fracturing as the Strait of Hormuz crisis reshapes energy routes and spikes operational costs.</p><p><strong>Why it matters:</strong> The instability of a primary global chokepoint forces a shift toward alternative fuels and riskier \"shadow\" fleets, creating long-term volatility in energy pricing and maritime safety.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk due to the Iran conflict.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as trade routes shift.</li><li><strong>$0:</strong> Total business generated by the U.S. $40bn insurance facility due to lack of naval escorts.</li><li><strong>50%:</strong> Percentage of \"shadow fleet\" tankers posing high environmental risks.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic pivots:</strong> Asian nations are spiking coal imports to replace disrupted gas supplies.</li><li><strong>Market fragility:</strong> Tanker owners fear a crash in freight rates if the Strait of Hormuz reopens, following a period of war-driven windfall profits.</li><li><strong>Operational decay:</strong> Ships trapped in the Gulf face biological infestation (barnacles/jellyfish), potentially delaying their exit once lanes reopen.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to capture freight and offshore wind growth.</li><li><strong>Last-mile evolution:</strong> Walmart is repurposing empty drugstores into delivery hubs to compete with Amazon's logistics speed.</li><li><strong>Legal battles:</strong> Lawsuits between shipping exchanges and traders (e.g., Mercuria vs. Baltic Exchange) will determine how \"disrupted\" routes are priced.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative tool to a massive driver of global capital and geopolitical friction.</p><p><strong>Why it matters:</strong> Massive private and public investments are fueling a \"picks and shovels\" boom, while simultaneously triggering labor anxiety and regulatory debates over taxation and legal personhood.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1tn+:</strong> Expected valuation for OpenAI following its IPO filing.</li><li><strong>$35bn:</strong> Private credit raised by Apollo and Blackstone for Anthropic.</li><li><strong>$2.4bn:</strong> New valuation for UK-based AI start-up PhysicsX.</li><li><strong>$50bn:</strong> Total value of PE software acquisitions, a post-pandemic low.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure wins:</strong> Traditional industrial firms like Caterpillar are benefiting from the surge in data center construction.</li><li><strong>The trust gap:</strong> Despite corporate assurances (e.g., Walmart), public anxiety is fueling a rise in anti-AI populism.</li><li><strong>Governance risks:</strong> The tendency for humans to \"rubber-stamp\" AI output is creating critical vulnerabilities in professional decision-making.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Public markets:</strong> Investors will soon price AI capabilities into the IPOs of OpenAI and SpaceX.</li><li><strong>Policy shifts:</strong> Governments are weighing AI-specific taxes and sovereign-wealth-style funds to distribute AI equity to citizens.</li><li><strong>Product evolution:</strong> OpenAI is recasting ChatGPT to pivot toward higher-margin products to justify its valuation.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony defined by asymmetry and instability.</p><p><strong>Why it matters:</strong> The shift toward a \"might is right\" world order erodes multilateral governance, forcing middle powers to seek new alliances to survive.</p><p><strong>Between the lines</strong></p><ul><li><strong>Power Vacuum:</strong> Washington is retreating from global leadership; Beijing is attempting to fill the void but avoids the responsibilities of a global hegemon.</li><li><strong>Strategic Leverage:</strong> Power now derives from the ability to convert imbalances into leverage rather than raw economic size.</li><li><strong>Soft Power Shift:</strong> Beijing is capitalizing on U.S. diplomatic volatility to improve its global image.</li><li><strong>The Russia Factor:</strong> Putin’s strategic errors have created a one-sided dependency on China, granting Xi significant leverage.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>2:</strong> Number of F1 races cancelled due to geopolitical risk in the Gulf.</li><li><strong>46:</strong> Days of active conflict in the Middle East, driving a surge in geopolitical risk management for global business.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Diplomatic pivots:</strong> Expect an increase in \"middleman\" diplomacy via special envoys to bypass traditional diplomatic stalemates.</li><li><strong>Alliance restructuring:</strong> Middle powers will prioritize agility and coalition-building over reliance on a single superpower.</li></ul>", "us elections": "<p>The U.S. electoral landscape is shifting toward high-risk, populist candidates as primary results signal a deepening divide between party bases and general election viability.</p><p><strong>Why it matters:</strong> Trump’s ability to install \"Maga warriors\" in primaries may alienate moderate swing voters, potentially handing Democrats an opening in key Senate races.</p><p><strong>The Texas Tension</strong></p><ul><li><strong>The Win:</strong> Trump-backed Ken Paxton ousted a Republican incumbent, proving the president's grip on the GOP base.</li><li><strong>The Risk:</strong> Democrats view Paxton’s controversial profile as a liability that could make the Texas Senate seat competitive in November.</li></ul><p><strong>Swing State Signals</strong></p><ul><li><strong>Pennsylvania:</strong> A former firefighter won the Democratic nomination on a populist platform, signaling a shift toward working-class appeals.</li><li><strong>Maine:</strong> Democrat Graham Platner won the primary despite misconduct allegations, setting up a challenge against incumbent Susan Collins.</li><li><strong>California:</strong> Former UK adviser Steve Hilton will face Democrat Xavier Becerra for governor.</li></ul><p><strong>Trump's Headwinds</strong></p><ul><li><strong>Economic Drag:</strong> FT polling shows voters blame Trump for inflation and rising grocery prices.</li><li><strong>Base Erosion:</strong> Evangelicals are questioning if Trump's rhetoric aligns with Christian values.</li><li><strong>Legislative Friction:</strong> The GOP-led House blocked Trump from conducting further strikes in the Middle East without approval.</li></ul><p><strong>Between the lines</strong> The \"Pyrrhic victory\" trend is emerging: Trump is winning the battle for party purity but may be losing the war for the center.</p><p><strong>What's next</strong></p><ul><li><strong>November Midterms:</strong> Focus shifts to whether populist primary winners can pivot to attract moderates.</li><li><strong>2028 Positioning:</strong> VP JD Vance and Secretary of State Marco Rubio are already emerging as future White House contenders.</li></ul>", "german politics": "<p>Germany is aggressively accelerating its military build-up while facing severe diplomatic friction with the U.S. and internal political instability.</p><p><strong>Why it matters:</strong> Berlin is attempting to pivot from a culture of fiscal restraint to a security-first posture, but bureaucratic inefficiency and a volatile relationship with Donald Trump threaten this transition.</p><p><strong>The defense pivot</strong></p><ul><li>Germany aims to hit NATO's 3.5% GDP spending target six years ahead of schedule.</li><li>Berlin is overhauling its procurement agency and buying a 40% stake in tank maker KNDS to speed up arms acquisition.</li><li>Rheinmetall has bid €12bn to rescue a failing warship project.</li></ul><p><strong>The Trump friction</strong></p><ul><li>Chancellor Friedrich Merz’s criticism of U.S. strategy in Iran has triggered a diplomatic crisis.</li><li>Trump is reviewing U.S. troop presence in Germany, including a potential withdrawal of 5,000 soldiers.</li><li>Merz is attempting to salvage relations with a trip to Washington to secure Tomahawk missile purchases.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political shifts:</strong> The far-right AfD is topping polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>Leadership threats:</strong> Merz faces internal pressure from younger conservative Hendrik Wüst as polls slide.</li><li><strong>Fiscal discipline:</strong> The Finance Ministry is threatening to cut funding for ministries failing to spend a €500bn infrastructure fund.</li></ul><p><strong>Between the lines</strong> Germany is struggling to balance its \"single market\" rhetoric with protectionist instincts. While pushing for EU financial integration, Berlin is simultaneously facing criticism for blocking the UniCredit-Commerzbank merger and proposing investment mandates for streamers like Netflix.</p><p><strong>What's next</strong> Watch for the outcome of the KNDS listing and whether the U.S. troop withdrawal moves from a threat to a formal order.</p>", "central banks": "<p>Central banks are shifting from pandemic-era stabilization to a volatile regime of persistent inflation and geopolitical fragmentation.</p><p><strong>Why it matters:</strong> Divergent inflation paths and political pressures are eroding the traditional predictability of monetary policy, forcing banks to prioritize currency stability over growth.</p><p><strong>The policy pivot</strong></p><ul><li><strong>Fed:</strong> Strong payroll data has stalled rate cut expectations; leadership is shifting toward reducing \"forward guidance\" to regain flexibility.</li><li><strong>ECB:</strong> Rising core inflation and energy spillover are driving a push for June rate hikes.</li><li><strong>BoJ:</strong> Quantitative tightening is accelerating through reduced bond purchases to combat volatility.</li><li><strong>Emerging Markets:</strong> Indonesia is utilizing off-cycle rate hikes to defend currencies against market routs.</li></ul><p><strong>The reserve shift</strong></p><ul><li><strong>Diversification:</strong> Gold has overtaken US Treasuries as the top reserve asset, now comprising 27% of reserves.</li><li><strong>Risk:</strong> US Treasuries are transitioning from \"safe havens\" to potential financial chokepoints.</li><li><strong>Innovation:</strong> The Fed and BoE are testing blockchain prototypes to enable near-instant cross-border settlements.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political Risk:</strong> Central bank independence is under threat from executive interference (US) and fiscal pressures driven by aging demographics.</li><li><strong>Data Gaps:</strong> Policymakers are increasingly making bets on corporate pricing strategies with insufficient evidence.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership transition:</strong> The new Fed chair faces immediate pressure to justify rate paths amid a \"stress test\" of institutional independence.</li><li><strong>Global friction:</strong> Trade volatility and reduced international cooperation threaten to trigger systemic financial instability.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand balance sheets and pivot toward high-growth sectors.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing giants like JPMorgan to pursue massive acquisitions while non-bank trading firms erode traditional Wall Street margins.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via deregulation.</li><li><strong>$114 billion:</strong> Combined revenue for elite trading firms (e.g., Jane Street, Citadel) challenging traditional banks.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon says JPMorgan could deploy.</li><li><strong>$9.4 billion:</strong> Total 2025 employee compensation at Jane Street.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Shadow\" Threat:</strong> Non-bank market makers are no longer just partners; they are competitors capturing record profits from volatility.</li><li><strong>Risk Migration:</strong> Banks are actively offloading \"concentrated\" risks, specifically private equity-linked loans and AI-driven data center debt, to avoid systemic shocks.</li><li><strong>Geopolitical Friction:</strong> Security concerns in China are forcing operational splits, evidenced by Morgan Stanley issuing China-only hardware to staff.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail Expansion:</strong> JPMorgan is pushing its Chase digital brand into Germany to capture European retail market share.</li><li><strong>Product Evolution:</strong> Morgan Stanley is integrating spot crypto trading into E*Trade to capture retail digital asset flows.</li><li><strong>Internal Turmoil:</strong> Goldman Sachs faces leadership friction as it expands its management committee and navigates executive departures.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>10 Jun 2026 14:01 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
