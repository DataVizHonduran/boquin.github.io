const SUMMARIES = {"oil and gas": "<p>Geopolitical volatility and resource nationalism are destabilizing global energy markets.</p><p><strong>Why it matters:</strong> Conflict in the Strait of Hormuz and Chinese export controls create supply shocks that drive price spikes and force a scramble for alternative energy sources.</p><p><strong>The volatility loop</strong></p><ul><li><strong>Hormuz Crisis:</strong> Tit-for-tat strikes between the U.S. and Iran have spiked oil prices and depleted stockpiles.</li><li><strong>LNG Competition:</strong> Tensions threaten winter heating for Asia and Europe, forcing them to compete for limited cargoes.</li><li><strong>Sanction Gaps:</strong> Greece is blocking EU sanctions on Russia to protect shipping interests in Arctic LNG.</li></ul><p><strong>The strategic shift</strong></p><ul><li><strong>Resource Nationalism:</strong> Beijing is using export controls on rare earths to distort markets.</li><li><strong>Portfolio Pivots:</strong> Shell is exiting Indian renewables ($1.8B sale) to refocus on core oil and gas.</li><li><strong>AI Influence:</strong> Energy IPOs are surging as investors seek infrastructure plays for the AI boom.</li></ul><p><strong>Between the lines</strong> The \"energy transition\" is bifurcating. While Google and Australian consumers double down on solar and batteries, European heavy industry is lobbying for more time to emit carbon.</p><p><strong>What's next</strong></p><ul><li><strong>Fusion Commercialization:</strong> The sector is moving from labs to supply chains, with General Fusion preparing for a Nasdaq debut.</li><li><strong>Infrastructure Risk:</strong> Security threats in Pakistan and strikes in Australia are imperiling critical mineral projects.</li></ul>", "corporate earnings and results": "<p>Global corporate earnings are shifting as AI monetization slows and consolidation accelerates.</p><p><strong>Why it matters:</strong> Discrepancies between AI hype and actual revenue are triggering profit warnings. Simultaneously, large-cap firms are using cash reserves to acquire rivals to sustain growth.</p><p><strong>The AI reality check</strong></p><ul><li><strong>IBM</strong> issued a profit warning, signaling that AI revenue growth may lag behind hyperscaler projections.</li><li><strong>Moonshot (China)</strong> is launching the Kimi K3 model to challenge Anthropic, narrowing the frontier AI gap between the U.S. and China.</li></ul><p><strong>Consolidation trends</strong></p><ul><li><strong>Uber</strong> agreed to a €13bn deal to acquire Delivery Hero.</li><li><strong>ABB</strong> is purchasing Rotork for £4.1bn.</li><li><strong>Stripe</strong> is reportedly pursuing an acquisition of PayPal.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>TSMC</strong> increased its U.S. production commitment to $265bn to secure supply chains.</li><li><strong>UBS</strong> is aggressively targeting the U.S. market to shift its valuation from a European bank to a global wealth manager.</li></ul><p><strong>What's next:</strong> Watch for further valuation corrections in legacy tech firms that failed to convert AI pilots into scalable earnings.</p>", "middle east war": "<p>The U.S. and Iran are locked in a high-stakes military confrontation over control of the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The Strait is a global energy chokepoint. Disruptions trigger immediate spikes in oil prices and destabilize global equity markets.</p><p><strong>By the numbers</strong></p><ul><li><strong>$87:</strong> Recent peak for Brent crude as hostilities escalated.</li><li><strong>20%:</strong> The cargo fee President Trump initially proposed to fund waterway security.</li><li><strong>7:</strong> The number of U.S. strike waves launched against Iranian targets.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic deadlock:</strong> The U.S. is relying on air strikes, but former defense officials warn bombing alone cannot change Tehran's behavior.</li><li><strong>Economic warfare:</strong> Iran is using cruise missiles against tankers to force U.S. concessions; the U.S. is alternating between military strikes and financial threats.</li><li><strong>Cyber vulnerability:</strong> Tehran is leveraging ad tech and roaming data to track U.S. military personnel in the region.</li></ul><p><strong>The ripple effect</strong></p><ul><li><strong>Regional shifts:</strong> Dubai is planning a new port on the UAE's east coast to bypass the Strait entirely.</li><li><strong>Political instability:</strong> In Israel, Prime Minister Netanyahu is trailing in polls ahead of October elections.</li><li><strong>Proxy escalation:</strong> Houthi missile strikes in Saudi Arabia signal a widening conflict beyond the U.S.-Iran axis.</li></ul><p><strong>What's next:</strong> Markets remain in \"risk-off\" mode as investors wait to see if Tehran's gamble on U.S. hesitation pays off or triggers a full-scale regional war.</p>", "shipping": "<p>Global shipping is facing a surge in geopolitical volatility and regulatory pressure.</p><p><strong>Why it matters:</strong> Conflict in the Sea of Azov and the Strait of Hormuz disrupts critical energy corridors, while new EU carbon fees and G7 sanctions force a costly reconfiguration of global trade routes.</p><p><strong>The conflict zones</strong></p><ul><li><strong>Ukraine:</strong> Kyiv is conducting an \"unprecedented\" drone campaign in the Sea of Azov, targeting Russian fuel tankers supplying Crimea.</li><li><strong>Strait of Hormuz:</strong> Tit-for-tat strikes between the U.S. and Iran create high-risk zones near Oman, though transits recently quadrupled during a brief ceasefire.</li><li><strong>Taiwan:</strong> Investigations reveal a nexus between maritime blacklists and North Korean smuggling networks.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Shadow fleets:</strong> Russian tankers are avoiding the English Channel due to naval interceptions, opting for longer North Atlantic routes.</li><li><strong>Profit centers:</strong> Greek shipping firms earned nearly $4B transporting Russian oil under G7 price cap regimes.</li><li><strong>Logistics:</strong> CMA CGM is expanding its U.S. footprint via a $1.4B acquisition of a FedEx logistics unit.</li></ul><p><strong>The green transition</strong></p><ul><li><strong>Regulation:</strong> The EU is closing loopholes on carbon emissions fees, increasing costs for shipowners.</li><li><strong>Technology:</strong> The industry is fracturing as companies pivot back to \"dirty\" fossil fuels or nuclear power due to the slow adoption of green alternatives.</li></ul><p><strong>What's next:</strong> Maersk's return to the Suez Canal suggests a cautious reopening of key routes, but freight rates may drop as delivery times shorten.</p>", "artificial intelligence": "<p>AI is shifting from a general-purpose gold rush to a fragmented battle over specialized efficiency and infrastructure.</p><p><strong>Why it matters:</strong> High operational costs and infrastructure bottlenecks are forcing a pivot toward domain-specific models and non-traditional supply chains.</p><p><strong>The efficiency pivot</strong></p><ul><li><strong>Cost cutting:</strong> Companies like DoorDash and Airbnb are adopting Chinese models to reduce reliance on expensive U.S. technology.</li><li><strong>Specialization:</strong> Domain-expert models are challenging Big Tech's dominance by delivering superior results at a fraction of the cost.</li><li><strong>Cannibalization:</strong> IBM shares plunged 25% as customers diverted spending from traditional servers and storage to fund AI initiatives.</li></ul><p><strong>Infrastructure bottlenecks</strong></p><ul><li><strong>Hardware hunger:</strong> ASML raised forecasts as chipmaking demand surges, while a black market for semiconductors thrives to bypass U.S. export controls to China.</li><li><strong>Power constraints:</strong> New York suspended new data center development for one year due to infrastructure strain.</li><li><strong>Market concentration:</strong> TSMC, SK Hynix, and Samsung now control 29% of the MSCI Emerging Markets index.</li></ul><p><strong>Emerging risks</strong></p><ul><li><strong>Legal gaps:</strong> The shift toward autonomous \"agents\" is creating insurance voids for businesses facing new types of legal claims.</li><li><strong>Safety urgency:</strong> DeepMind's Demis Hassabis is calling for a U.S.-led body to test \"frontier\" models before the window for preparation closes.</li></ul><p><strong>What's next:</strong> Expect a surge in \"AI banks\" and specialized funding rounds as the industry moves from foundational research to commercial deployment.</p>", "us-china relations": "<p>US-China relations are shifting toward a \"might is right\" world order defined by strategic volatility and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and the rise of Chinese assertiveness are dismantling the post-WWII rules-based system. This creates a power vacuum that increases the risk of direct military conflict.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China is testing boundaries via ballistic missile launches in nuclear-free zones.</li><li>  <strong>Resource warfare:</strong> Beijing is weaponizing critical minerals, evidenced by the detention of Japanese nationals over rare earth smuggling.</li><li>  <strong>Economic instability:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten global growth.</li></ul><p><strong>Between the lines</strong> Beijing is positioning itself as a \"pillar of stability\" to attract non-aligned nations. While the US struggles with internal political volatility and erratic diplomacy, China is leveraging a \"tribute system\" model to expand influence without immediate resort to war.</p><p><strong>What's next</strong></p><ul><li>  <strong>Alliance restructuring:</strong> Middle powers (Japan, Germany) are aggressively seeking new capabilities and diversified security deals to hedge against US unpredictability.</li><li>  <strong>Systemic competition:</strong> The struggle will move beyond trade into a battle over who defines the global order for the next century.</li></ul>", "us elections": "<p>The U.S. electoral landscape is fracturing as internal party volatility and foreign policy failures erode candidate stability.</p><p><strong>Why it matters:</strong> Internal ideological warfare and personal scandals are creating openings for opponents, while economic discontent is alienating traditional base voters.</p><p><strong>The Democratic Divide</strong></p><ul><li><strong>Socialist surge:</strong> Progressive victories in New York and Colorado signal a growing rift between party establishment and radical wings.</li><li><strong>Candidate instability:</strong> The Graham Platner scandal in Maine forces Democrats into a last-minute scramble to salvage a Senate bid.</li><li><strong>Corporate friction:</strong> Big Tech lobbying successfully ousted pro-regulation candidates in House primaries.</li></ul><p><strong>The Republican Gamble</strong></p><ul><li><strong>Trump fatigue:</strong> Voter dissatisfaction in Pennsylvania and questioning among evangelicals suggest a weakening grip on key demographics.</li><li><strong>Economic backlash:</strong> Tariffs and inflation are alienating rural voters, specifically Maine's lobster industry.</li></ul><p><strong>The Iran Factor</strong></p><ul><li><strong>Approval dip:</strong> FT polling shows the Iran conflict is actively dragging down Trump's approval ratings.</li><li><strong>Legislative pushback:</strong> The House and Senate are moving to rein in presidential war powers, signaling bipartisan disquiet.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California's gauge:</strong> The governor's race will serve as a primary indicator of the national appetite for MAGA-aligned politics.</li><li><strong>Midterm volatility:</strong> Parties must reconcile ideological extremes or risk losing winnable seats to fragmented messaging.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion while battling internal instability and a surging far-right.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to secure European defense, but procurement failures and political polarization threaten the execution of this shift.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Germany will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> Berlin is overhauling its arms agency to speed up spending and has secured a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> Germany is distancing itself from France on fighter jet projects to gain more control proportional to its funding.</li><li><strong>Failures:</strong> Cost overruns led Berlin to scrap the F126 frigate, its largest planned warship since WWII.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts and is pushing for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Privatization:</strong> The government is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>Efficiency:</strong> The Finance Ministry will now punish government agencies that fail to spend infrastructure funds quickly.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>The AfD:</strong> The far-right party leads opinion polls, fueled by fuel price anger and ties to Kremlin associates.</li><li><strong>Internal Rivalry:</strong> Merz faces \"chancellor swap\" rumors as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's decision on the Strait of Hormuz mission and whether Merz can maintain coalition unity on labor reforms and EU debt opposition.</p>", "central banks": "<p>Central banks are shifting from a unified fight against inflation to a fragmented era of institutional reform and divergent policy.</p><p><strong>Why it matters:</strong> Divergent interest rate paths and a \"trust deficit\" in leadership are increasing market volatility and risking long-run inflation expectations.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is aggressively restructuring the U.S. central bank:</p><ul><li><strong>Reform:</strong> Established five task forces led by business and academic leaders to overhaul operations.</li><li><strong>Communication:</strong> Moving away from traditional \"Fedspeak\" and forward guidance to seek more fundamental market data.</li><li><strong>Independence:</strong> Vowed to maintain price stability despite political pressure from the White House.</li></ul><p><strong>Global divergence</strong> Policymakers are no longer moving in lockstep:</p><ul><li><strong>ECB:</strong> Signaling a less aggressive approach to inflation than in 2022-23, though some officials urge holding rates despite oil surges.</li><li><strong>RBNZ:</strong> Raised rates for the first time in three years to combat persistent inflation.</li><li><strong>BoJ:</strong> Facing currency volatility as \"Mr. Yen\" keeps intervention tactics ambiguous.</li></ul><p><strong>Systemic risks</strong> New technological and structural threats are emerging:</p><ul><li><strong>AI Volatility:</strong> The Bank of England is considering \"kill switches\" for AI-powered trading to prevent herding behavior.</li><li><strong>QT Danger:</strong> Critics argue Quantitative Tightening (QT) is becoming riskier due to how previous stimulus changed bank balance sheets.</li><li><strong>Leverage:</strong> The BoE is limiting hedge fund leverage to stabilize the gilt market, despite fears of higher funding costs.</li></ul><p><strong>What's next:</strong> Markets will watch for the ECB's next meeting and the impact of Warsh's communication shift on U.S. Treasury volatility.</p>", "us banks": "<p>Wall Street banks are posting record quarterly profits driven by an AI-fueled equities boom.</p><p><strong>Why it matters:</strong> The surge in AI optimism and a revival of large-scale deals are decoupling bank earnings from traditional interest rate dependencies.</p><p><strong>The drivers</strong></p><ul><li><strong>AI Frenzy:</strong> Increased trading volumes and investment banking fees are shattering forecasts.</li><li><strong>Wealth Influx:</strong> High-net-worth clients, including SpaceX millionaires, are boosting wealth management revenues.</li><li><strong>Global Recovery:</strong> Securities units in China are posting record profits.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal Turmoil:</strong> JPMorgan is resetting its succession plan, abruptly removing top contender Marianne Lake.</li><li><strong>Regulatory Friction:</strong> Banks are lobbying to ease Basel capital rules while facing criticism over deregulation and risk management.</li><li><strong>Compliance Risks:</strong> The rise of prediction markets (e.g., Polymarket) is forcing firms like Goldman Sachs to tighten employee betting policies.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$700 billion:</strong> Potential losses US banks would face in a severe economic crash, per Fed stress tests.</li><li><strong>4 years:</strong> The current investment banking fee haul is the largest in this timeframe.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Citi's Pivot:</strong> Investors are watching if Jane Fraser's asset sales and job cuts can close the profitability gap with JPMorgan and BofA.</li><li><strong>Policy Shifts:</strong> Potential changes in /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>16 Jul 2026 11:59 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
