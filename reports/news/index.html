.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Strait of Hormuz is driving global oil and gas prices to record highs.</p><p><strong>Why it matters:</strong> Supply shocks from Saudi pipeline attacks and Hormuz blockages are triggering immediate inflation and forcing Asian markets to seek LNG alternatives.</p><p><strong>By the numbers</strong></p><ul><li><strong>$109:</strong> Current price of oil following Saudi export pipeline closures.</li><li><strong>$5 billion:</strong> ExxonMobil's approved investment for a Texas carbon capture project.</li><li><strong>$80 billion:</strong> Estimated cost to transform Alaska into an LNG superpower.</li><li><strong>$230 million:</strong> Loss incurred by Poland in a failed crypto-based Venezuelan oil trade.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>China's pivot:</strong> Beijing is ending its strategic stock drawdown, removing a key cushion that previously stabilized global prices.</li><li><strong>Energy transition friction:</strong> EU wind and metal sectors are struggling to compete with state-supported Chinese manufacturers.</li><li><strong>US Policy shift:</strong> The Trump administration is aggressively dismantling Biden-era climate protections to prioritize fossil fuel production.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market volatility:</strong> Natural gas prices will likely climb further as winter approaches amid extended Hormuz outages.</li><li><strong>Tech convergence:</strong> Geothermal developers are increasingly adopting oil and gas fracturing techniques to access deep-rock heat.</li><li><strong>Infrastructure shifts:</strong> Major oil firms (BP, Shell) are exiting retail forecourts, leaving gaps for refinery-backed operators like Essar.</li></ul>", "corporate earnings and results": "<p>PwC revenues have fallen for the first time in 20 years.</p><p><strong>Why it matters:</strong> The decline signals a cooling demand for high-end consulting and a specific regional collapse in the Middle East.</p><p><strong>By the numbers</strong></p><ul><li><strong>20 years:</strong> The duration of PwC's previous uninterrupted revenue growth streak.</li><li><strong>1:</strong> The number of primary regions (Middle East) cited as the driver of the slump.</li></ul><p><strong>Between the lines</strong></p><ul><li>Professional services are highly sensitive to geopolitical instability and regional economic shifts.</li><li>The slump suggests a correction in the post-pandemic consulting boom.</li></ul><p><strong>What's next</strong></p><ul><li>Expect further consolidation or restructuring within the \"Big Four\" to offset regional losses.</li><li>Firms will likely pivot resources away from volatile markets toward stable growth sectors.</li></ul>", "middle east war": "<p>The Middle East is shifting from a regional proxy conflict to a systemic economic shock.</p><p><strong>Why it matters:</strong> Escalating attacks on energy infrastructure and shipping arteries are driving global inflation and depleting U.S. military stockpiles.</p><p><strong>By the numbers</strong></p><ul><li><strong>$38 billion:</strong> Total U.S. fiscal cost of the Iran war.</li><li><strong>$61 million:</strong> Amount laundered by Chinese groups via Binance from Iranian oil.</li><li><strong>Two:</strong> Daily air defense time slots now limited for tankers in the Strait of Hormuz.</li></ul><p><strong>The strategic breakdown</strong></p><ul><li><strong>Energy vulnerability:</strong> Houthi seizure of Red Sea islands and attacks on Saudi pipelines have closed critical \"relief valves,\" forcing oil prices upward.</li><li><strong>Saudi instability:</strong> Crown Prince Mohammed bin Salman faces a \"war on all fronts\" from Houthi rebels and Iraqi militants.</li><li><strong>Asymmetric warfare:</strong> Iran is leveraging \"Chosen Brick\" spyware and crypto-laundering to bypass sanctions and target critics.</li></ul><p><strong>Between the lines</strong> The conflict is no longer contained to the battlefield. It is manifesting as supply chain inflation for U.S. manufacturers and a real estate slump in Dubai.</p><p><strong>What's next</strong></p><ul><li><strong>Winter energy crunch:</strong> US and European markets face acute supply risks as Saudi exports falter.</li><li><strong>Diplomatic pivots:</strong> France and Lebanon will push to extend UN peacekeeping mandates to prevent total collapse in the south.</li></ul>", "shipping": "<p>Global shipping is facing a structural collapse driven by geopolitical conflict and climate volatility.</p><p><strong>Why it matters:</strong> The convergence of \"shadow fleets,\" chokepoint closures, and extreme weather is dismantling established maritime rules and inflating global trade costs.</p><p><strong>The chokepoint crisis</strong></p><ul><li><strong>Strait of Hormuz:</strong> US-Iran violence and Iranian threats to confiscate ships have created \"existential risk\" for hubs like Dubai's Jebel Ali.</li><li><strong>Panama Canal:</strong> El Niño-driven droughts are forcing transit cuts, diverting traffic and increasing rates.</li><li><strong>Black Sea:</strong> Ukrainian grain exports remain choked, triggering global food price surges.</li></ul><p><strong>The \"Shadow\" shift</strong></p><ul><li><strong>Sanctions evasion:</strong> A \"ghost fleet\" of Russian tankers is using improvised drone defenses and legal loopholes in UK insurance to bypass restrictions.</li><li><strong>Regulatory decay:</strong> 18 maritime authorities warn that war and shadow fleets are causing a permanent \"structural shift\" in how trade is governed.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>Arctic routes:</strong> South Korea is investing in polar highways to bypass traditional chokepoints and reduce reliance on the Middle East.</li><li><strong>Nuclear power:</strong> The US is partnering with Core Power to launch nuclear-powered merchant ships by 2028 to counter Chinese shipbuilding dominance.</li><li><strong>Green tech:</strong> Maersk is installing wind sails to hedge against future fuel costs.</li></ul><p><strong>The bottom line</strong> While disruptions have provided a \"temporary reprieve\" for container shipping profits via higher freight rates, the long-term trend is one of instability. Institutional investors are now pivoting toward shipping as a \"hard asset\" hedge against Middle East volatility.</p>", "artificial intelligence": "<p>The AI industry is fracturing into two camps: safety advocates calling for a slowdown and tech giants racing toward Artificial General Intelligence (AGI).</p><p><strong>Why it matters:</strong> Unchecked acceleration increases existential risk and market volatility, while a forced pause threatens economic competitiveness and investor returns.</p><p><strong>The Great Divide</strong></p><ul><li><strong>The Alarmists:</strong> Leaders at DeepMind, OpenAI, and Anthropic warn that models are escaping human control and could cause human extinction.</li><li><strong>The Accelerators:</strong> Nvidia and Meta bosses reject coordination on slowdowns, prioritizing rapid deployment and market dominance.</li><li><strong>The Political Split:</strong> US-China rivalry prevents a global safety pact, as both nations view AI supremacy as a national security imperative.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 trillion:</strong> The potential valuation OpenAI is weighing for its next funding round.</li><li><strong>>10%:</strong> The extinction risk probability cited in Anthropic's risk disclosures.</li><li><strong>$270 million:</strong> Funding raised by Exein to combat AI-driven hacking.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market Fragility:</strong> Wall Street is hypersensitive to safety warnings; calls for a slowdown have already triggered slides in chip stocks.</li><li><strong>Economic Shift:</strong> While elites debate doomsday, practical AI is already slashing labor costs in sectors like hospitality and auditing.</li><li><strong>Political Convergence:</strong> Rare bipartisan alignment is emerging in the US, with figures from opposite ends of the spectrum demanding regulation.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Pressure:</strong> Washington is shifting focus from physical infrastructure (data centers) to the behavior of the models themselves.</li><li><strong>Labor Adaptation:</strong> A growing focus on how the next generation can remain economically viable as automation replaces cognitive tasks.</li></ul>", "us-china relations": "<p>The U.S. is shifting toward a transactional, zero-sum foreign policy, accelerating the formation of a rival geopolitical bloc led by China.</p><p><strong>Why it matters:</strong></p><ul><li>U.S. unpredictability and the threat of tariffs are driving historically divided nations toward the BRICS alliance.</li><li>The abandonment of traditional democratic leadership creates a power vacuum that empowers autocrats and weakens U.S. security guarantees in Asia.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>GDP:</strong> BRICS now accounts for a larger share of the global economy than the G7.</li><li><strong>Alliances:</strong> U.S. military scaling in South Korea is forcing Japan to reconsider its lack of a \"Plan B\" for defense.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Trumpism\" Effect:</strong> While hawks in Congress remain rigid, a surprising alignment is emerging between Trump and Gen Z voters who are more open to cooperation with Beijing.</li><li><strong>AI Hegemony:</strong> Despite global efforts to build local data centers, the U.S. maintains a structural lead in AI power through hardware control.</li><li><strong>Institutional Flight:</strong> Threatened U.S. funding cuts are prompting international organizations to consider leaving Geneva for Gulf or European capitals.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bloc Formation:</strong> Overlapping conflicts in Ukraine and the Middle East are pushing the world toward two distinct, rival camps.</li><li><strong>Trade Weaponization:</strong> Expect increased use of sanctions and tariffs as the \"win-win\" era of globalization is replaced by scarcity-driven competition.</li></ul>", "german politics": "<p>The far-right Alternative for Germany (AfD) has shattered the political center with a dominant victory in Saxony-Anhalt.</p><p><strong>Why it matters:</strong> The result signals a collapse of traditional conservative dominance in eastern Germany and creates a volatile path toward the next federal election.</p><p><strong>The breakdown</strong></p><ul><li><strong>The Result:</strong> AfD became the largest party in Saxony-Anhalt, though it fell short of an absolute majority.</li><li><strong>The Kingmaker:</strong> The hard-left BSW party now holds the balance of power, complicating coalition building.</li><li><strong>The Fallout:</strong> CDU leader Friedrich Merz is under severe pressure as the party fails to stem the rightward surge.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Emotional Faultlines:</strong> AfD is leveraging nostalgia for \"friendly\" Russians and a perceived failure of reunification to win over eastern voters.</li><li><strong>Generational Shift:</strong> Younger voters, disconnected from the memories of communism and fascism, are increasingly open to radicalism.</li><li><strong>Global Alignment:</strong> The Kremlin and the Trump administration view the AfD's rise as a strategic win for anti-establishment movements.</li></ul><p><strong>The security paradox</strong></p><ul><li><strong>Hybrid War:</strong> Berlin is battling Russian drone attacks and hybrid warfare while simultaneously running a \"guerrilla unit\" to fast-track arms for Ukraine.</li><li><strong>Internal Crackdown:</strong> Senior officials are now calling for the top court to ban the AfD's most radical flank.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Federal Ambitions:</strong> The AfD is using regional wins as a blueprint to target 40% of the vote in national polls.</li><li><strong>Center Response:</strong> The political center must deliver tangible economic and social results quickly or risk further erosion.</li></ul>", "central banks": "<p>Central banks are trapped between stubborn inflation and rising fiscal instability.</p><p><strong>Why it matters:</strong> High public deficits and volatile energy prices are stripping central banks of their autonomy. This forces a choice between risking recession to kill inflation or allowing price instability to erode currency value.</p><p><strong>The current friction</strong></p><ul><li><strong>The Fed:</strong> Strong U.S. payroll data and political pressure from the Trump camp are complicating the timing of rate hikes.</li><li><strong>The ECB:</strong> Middle East conflicts are driving oil prices up, forcing the bank to raise rates to 2.5% with warnings that inflation will persist into 2027.</li><li><strong>The BoJ:</strong> Governor Kazuo Ueda is caught between domestic pressure to raise rates and external volatility fueled by U.S. Treasury interventions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>2.5%:</strong> The ECB's new interest rate level.</li><li><strong>5%:</strong> The critical Treasury yield threshold that analysts warn could derail the AI investment boom.</li><li><strong>2027:</strong> The projected window for price shocks to linger in the Eurozone.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Fiscal dominance:</strong> Massive government debt is undermining monetary policy. Central banks can no longer fight inflation in a vacuum when fiscal spending remains aggressive.</li><li><strong>Credibility gaps:</strong> Political interference—specifically regarding the BoJ and the Fed—is increasing the \"risk premium\" investors demand to hold government bonds.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Balance sheet stagnation:</strong> Quantitative easing has left a permanent mark; central bank balance sheets are unlikely to return to pre-pandemic levels.</li><li><strong>Leadership churn:</strong> European capitals are currently bartering over Christine Lagarde’s successor, signaling a potential shift in ECB strategy.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>16 Sep 2026 15:17 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
