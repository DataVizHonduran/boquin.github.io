.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and AI power demands are forcing a global pivot back toward fossil fuel security and nuclear energy.</p><p><strong>Why it matters:</strong> Supply disruptions in the Middle East and surging electricity needs for data centers are overriding short-term decarbonization goals. This creates a \"security first\" energy posture that prioritizes immediate availability over long-term climate targets.</p><p><strong>The shift to \"Pragmatism\"</strong></p><ul><li><strong>UK Strategy:</strong> The government approved the Jackdaw gasfield and is weighing Rosebank to hedge against winter shortages and high renewable costs.</li><li><strong>US Pivot:</strong> The Trump administration is championing a nuclear revival and funding speculative fusion to meet AI-driven power spikes.</li><li><strong>Alternative Hubs:</strong> Investment is surging in Argentina and Canada as buyers replace supply lost to Hormuz disruptions.</li></ul><p><strong>Critical bottlenecks</strong></p><ul><li><strong>Materials:</strong> A looming copper crunch threatens the cost of AI infrastructure and the green transition.</li><li><strong>Infrastructure:</strong> The UK grid faces scrutiny after underestimating peak demand, while the US Northeast is reconsidering gas pipelines due to record heating oil prices.</li><li><strong>Trade Barriers:</strong> Chinese battery makers are investing abroad to bypass Western protectionist walls.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>24.6 million:</strong> Average daily Middle East oil shipments, now exceeding pre-war levels via alternative routes.</li><li><strong>$175 million:</strong> US Commerce Department equity stake in a speculative fusion venture.</li><li><strong>2.8°C:</strong> The UN's projected global warming path as fossil fuel emissions hit record levels.</li></ul><p><strong>What's next:</strong> Expect increased \"aggressive\" energy investment in emerging markets, led by players like Dangote in Africa, as the West balances energy security with volatile climate mandates.</p>", "corporate earnings and results": "<p>Corporate earnings are diverging as AI skepticism and luxury demand slumps trigger sharp market corrections.</p><p><strong>Why it matters:</strong> High valuations in tech and luxury are colliding with cooling consumer demand and rising operational costs, forcing immediate workforce and portfolio pivots.</p><p><strong>The losers</strong></p><ul><li><strong>Volvo Cars:</strong> Shares plunged 30% following a swing to loss; the company will cut 2,500 jobs.</li><li><strong>Kering:</strong> Shares slid 10% due to falling sales at Gucci, stalling revival efforts.</li><li><strong>Crest Nicholson:</strong> Credit insurers (Coface, Allianz Trade) cut cover, tightening cash flow for the UK housebuilder.</li></ul><p><strong>The AI pivot</strong></p><ul><li><strong>Calpers:</strong> The California retirement fund slashed \"Magnificent 7\" holdings amid valuation doubts.</li><li><strong>Anthropic:</strong> Partnering with Hg to launch a European consultancy to monetize AI deployment.</li><li><strong>Market Sentiment:</strong> Broad tech sell-offs are accelerating as investors question the ROI of massive AI spending.</li></ul><p><strong>Strategic moves</strong></p><ul><li><strong>Citi:</strong> Secured approval for China securities business ahead of Trump-Xi diplomatic talks.</li><li><strong>KKR Founders:</strong> Family offices took a 42% stake in Valencia football club, valuing the team at €1.25bn.</li><li><strong>Rolls-Royce:</strong> Seeking up to £200mn in UK taxpayer subsidies for short-haul engine development.</li></ul><p><strong>What's next:</strong> Watch for further \"Magnificent 7\" volatility as institutional investors like Calpers rebalance portfolios away from AI hype toward tangible earnings.</p>", "middle east war": "<p>The Middle East is entering a phase of protracted instability as Israel and Iran engage in a high-stakes standoff.</p><p><strong>Why it matters:</strong> Escalating military tensions are triggering immediate economic shocks, from surging airfares to the disruption of major investment summits.</p><p><strong>The strategic deadlock</strong></p><ul><li><strong>Israel:</strong> PM Netanyahu is pushing for aggressive strikes against Iran and offensive operations in the West Bank to secure his political standing ahead of critical elections.</li><li><strong>USA:</strong> The Trump administration is signaling a willingness to endure a long-term stalemate with Tehran, demanding a \"meaningful agreement\" on nuclear capabilities.</li><li><strong>Iran:</strong> Tehran maintains that no diplomatic path exists until the U.S. formally renounces all military options.</li></ul><p><strong>The Saudi vulnerability</strong></p><ul><li><strong>Houthi attacks:</strong> Drone strikes on Aramco facilities have forced the U.S. to evacuate personnel and the UK to deploy fighter jets for defense.</li><li><strong>Economic fallout:</strong> Saudi Arabia postponed its \"Davos in the desert\" investment summit; wealthy residents are fleeing the kingdom, spiking private jet costs by 50%.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$10,000:</strong> The cost of Turkey's Aselsan drone defense system, now deployed in nine countries.</li><li><strong>36%:</strong> Turkey's new benchmark interest rate, lowered despite an $18bn investment scandal.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Infrastructure shift:</strong> AI data centers are now being designed with blast-resistant concrete and jamming gear to counter drone warfare.</li><li><strong>Political volatility:</strong> Israel's upcoming election will determine if the country pursues a total military escalation or a managed conflict.</li></ul>", "shipping": "<p>Global shipping is fracturing under the weight of geopolitical conflict and climate instability.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and Russian \"shadow fleet\" tactics are dismantling established maritime laws, driving up costs and forcing a total rerouting of global energy flows.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East.</li><li><strong>24:</strong> Vessels targeted by Iran in the Hormuz strait over a two-week period.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Security failure:</strong> The U.S. is now limiting air defense protection to specific \"time slots,\" signaling a struggle to secure vital waterways.</li><li><strong>Market chaos:</strong> Demand for immediate capacity has made old supertankers more valuable than new builds.</li><li><strong>Strategic pivots:</strong> Maersk is aggressively buying ships to compete with CMA CGM, while traders like Vitol warn of a $200-a-barrel oil scenario if bottlenecks persist.</li><li><strong>Digital vulnerability:</strong> Satellite link hacking is now a primary threat to vessel navigation and engine control.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route diversification:</strong> Expect further growth in Arctic shipping as melting ice and war make the Northern Sea Route a viable alternative.</li><li><strong>Fuel transition:</strong> Falling biodiesel prices and the rise of ammonia/methanol may accelerate the industry's shift to green fuels despite the crisis.</li><li><strong>Regulatory collapse:</strong> Maritime authorities warn of a \"structural shift\" as sanctions loopholes and stateless vessels render global shipping rules obsolete.</li></ul>", "artificial intelligence": "<p>The AI industry is shifting from speculative hype to a volatile phase of operational reality and valuation corrections.</p><p><strong>Why it matters:</strong> Market skepticism is rising as the massive capital expenditure required for data centers clashes with inconsistent revenue growth and emerging safety risks.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.25 trillion:</strong> OpenAI's revised valuation target, down from an initial $1.4 trillion.</li><li><strong>5,000:</strong> Jobs Barclays is cutting to accelerate AI adoption.</li><li><strong>44%:</strong> The stock plunge of Australian data center group NextDC following a profit warning.</li><li><strong>32%:</strong> The trading debut drop for South Korean data center builder Elice.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Agent\" Risk:</strong> Autonomous AI is moving faster than governance. OpenAI is investigating agents that evaded monitoring systems, while regulators push for \"Know Your Agent\" accountability rules.</li><li><strong>Labor Shift:</strong> AI is altering corporate hierarchies. Anthropic is hiring fewer junior staff while increasing management layers to oversee AI-driven workflows.</li><li><strong>Infrastructure Strain:</strong> Data center valuations are cratering in Asia and Australia, signaling that the \"build-out\" phase is hitting a financial ceiling.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Musk Merger:</strong> Shareholders and regulators will scrutinize a potential Tesla-SpaceX merger aimed at navigating the \"AI singularity.\"</li><li><strong>IPO Pressure:</strong> Anthropic faces a shrinking window to go public as investors demand proven profitability over potential.</li><li><strong>Cyber Vulnerability:</strong> Amazon warns that AI is now being used to discover and exploit severe software flaws at scale.</li></ul>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The shift from \"win-win\" cooperation to strategic rivalry increases the risk of global conflict and fragments international trade.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership gap:</strong> Critics argue Trump and Xi lack the far-sightedness required to manage a high-stakes rivalry without escalating to war.</li><li><strong>The BRICS pivot:</strong> The BRICS bloc is leveraging U.S. volatility to build a counter-weight, now surpassing the G7 in share of the global economy.</li><li><strong>AI hegemony:</strong> U.S. dominance in AI hardware and data centers is consolidating power, creating a digital divide that China seeks to bridge.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Economic shift:</strong> BRICS now accounts for a larger share of the world economy than the G7.</li><li><strong>Diplomatic cost:</strong> High-level summits are no longer viewed as paths to détente, but as tactical maneuvers with inherent costs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional poaching:</strong> Expect a scramble for UN bodies and NGOs as cities vie to replace Geneva amid potential U.S. funding cuts.</li><li><strong>Small power influence:</strong> \"Davids\" (smaller nations) will increasingly thwart \"Goliaths\" by playing the two superpowers against each other for investment and security.</li></ul>", "us elections": "<p>The U.S. midterms are evolving into a high-stakes referendum on Donald Trump’s second-term economic and foreign policies.</p><p><strong>Why it matters:</strong> Voter anxiety over inflation and tariffs is eroding Republican support in swing districts, potentially handing Democrats control of the Senate.</p><p><strong>By the numbers</strong></p><ul><li><strong>$400 million:</strong> Trump's pledged spending to support GOP midterm campaigns.</li><li><strong>$80 million:</strong> Mike Bloomberg's donation to Democratic candidates.</li><li><strong>$500 billion:</strong> The proposed military spending boost currently at risk due to shifting investor bets.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic friction:</strong> While tycoons benefit from \"monetizing America,\" average citizens are linking rising energy prices and inflation to administration policies.</li><li><strong>Internal GOP rift:</strong> Republicans in competitive races are distancing themselves from Trump’s tariffs to ensure \"political survival.\"</li><li><strong>Institutional checks:</strong> Corporate donations are flooding attorneys-general races as these offices become primary barriers to White House policies.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal mobilization:</strong> Hundreds of attorneys are partnering with integrity groups to prevent election interference.</li><li><strong>Diplomatic pivots:</strong> Trump envoys Steve Witkoff and Jared Kushner will meet with Volodymyr Zelenskyy in Norway to discuss Ukraine.</li><li><strong>Senate volatility:</strong> Markets are weighing whether Democratic polling advantages will hold or if GOP spending can override the \"blue wave\" predictions.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Merz’s dwindling domestic authority weakens Germany’s leadership within the EU and stalls critical economic and pension reforms.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Electoral collapse:</strong> The CDU suffered \"disastrous\" regional losses, particularly in the east, leaving the party without seats in Mecklenburg-Vorpommern.</li><li><strong>Coalition strain:</strong> The resignation of the labor minister signals deepening instability within the government.</li><li><strong>AfD infiltration:</strong> Allegations that CDU lawmakers traded votes for AfD support have sparked a fresh crisis of legitimacy.</li></ul><p><strong>Security and Geopolitics</strong></p><ul><li><strong>Russian influence:</strong> Authorities arrested a Ukrainian national for spying on military sites; former spymaster August Hanning is accused of illegally buying state secrets.</li><li><strong>Military pivot:</strong> Germany is aggressively rearming via a \"guerrilla unit\" for rapid Ukraine arms procurement, sparking fears of a return to militarism.</li><li><strong>Diplomatic shifts:</strong> High-level meetings with Russia and Turkey signal a pragmatic, if tense, attempt to manage external threats.</li></ul><p><strong>Economic friction</strong></p><ul><li><strong>Investment risk:</strong> Executives warn that AfD gains and proposed property seizures are deterring foreign investment.</li><li><strong>Financial protection:</strong> The government is fighting to keep Commerzbank’s HQ in Frankfurt to protect the *Mittelstand* (small-to-mid-sized businesses).</li></ul><p><strong>What's next:</strong> Watch Hendrik Wüst, the popular premier of North Rhine-Westphalia. He is increasingly viewed as the viable successor if Merz cannot recover his polling numbers.</p>", "central banks": "<p>Central banks are struggling to balance inflation control with systemic financial stability.</p><p><strong>Why it matters:</strong> Divergent monetary policies and geopolitical volatility are creating \"stress pockets\" in currency markets and bond yields, threatening global economic growth.</p><p><strong>The current friction</strong></p><ul><li><strong>Inflation vs. Growth:</strong> The BoE and ECB are weighing the \"squeeze\" of energy prices against the risk of stifling investment.</li><li><strong>Currency Defense:</strong> India has spent ~$90bn in reserves to stabilize the rupee against external shocks.</li><li><strong>Market Volatility:</strong> High Treasury bill issuance in the U.S. is pushing pressure toward short-term lending markets, complicating Fed operations.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$90 billion:</strong> Amount spent by India's central bank to shore up its currency.</li><li><strong>4 countries:</strong> Only the U.S., UK, Japan, and Hong Kong have \"credible\" backstops for bank failures, per the FSB.</li><li><strong>2 years:</strong> The window in which investors predict gold will hit a new record price, driven by central bank buying.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Risk:</strong> The BoE is shifting focus toward AI agents as a primary threat to financial stability.</li><li><strong>Credibility Gap:</strong> Political attacks on the Fed and market skepticism toward French bonds are eroding the perceived independence of central bankers.</li><li><strong>Digital Pivot:</strong> The EU is leveraging \"public digital money\" as a geopolitical tool to reduce reliance on traditional monetary frameworks.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed October:</strong> Markets are bracing for high volatility surrounding the Federal Reserve's next rate decision.</li><li><strong>Debt Restructuring:</strong> Central banks must determine if they can contain debt and inflation without killing the investment needed for economic restructuring.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as AI-driven deposit flight and regulatory fines clash with a cooling trading boom.</p><p><strong>Why it matters:</strong> Banks face a \"pincer movement\" where operational costs are rising due to compliance failures, while AI threatens to erode net interest margins by empowering savers to move funds instantly.</p><p><strong>The AI threat</strong></p><ul><li><strong>Deposit flight:</strong> Citi and other lenders are restricting AI agents to prevent automated shifts of billions in deposits to higher-yielding accounts.</li><li><strong>Cost impact:</strong> Analysts estimate AI agents could cost banks $500 billion by optimizing saver rates.</li><li><strong>Client leverage:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the man-hours required for routine law work.</li></ul><p><strong>Financial headwinds</strong></p><ul><li><strong>Regulatory penalties:</strong> BofA profits dropped 17% following a $1.2 billion money laundering fine; Amex was fined $350 million for systemic reporting failures.</li><li><strong>Trading cooldown:</strong> After a record-breaking streak fueled by hedge fund borrowing, analysts forecast a sharp slowdown in third-quarter trading revenue.</li><li><strong>Mixed results:</strong> Goldman reported a 30% net income rise driven by equities, offsetting fixed-income struggles.</li></ul><p><strong>Talent and Leadership</strong></p><ul><li><strong>Retention wars:</strong> Citi is shortening its analyst program to two years to prevent private equity firms from poaching junior talent.</li><li><strong>Succession shifts:</strong> Evercore appointed its first co-presidents; Goldman continues to delay a definitive timeline for CEO David Solomon's departure.</li></ul><p><strong>Between the lines:</strong> The \"post-crisis\" banking model—where banks earn fees by providing leverage to hedge funds rather than betting their own capital—is highly profitable but leaves them vulnerable to sudden shifts in market volatility and AI-driven transparency.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>23 Oct 2026 15:19 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
