const SUMMARIES = {"oil and gas": "<p>Brent crude is surging toward $100 a barrel as U.S.-Iran conflict escalates.</p><p><strong>Why it matters:</strong> Geopolitical instability is triggering a global supply crunch. High energy costs threaten to spark a new inflationary burst and impact U.S. election outcomes.</p><p><strong>The conflict drivers</strong></p><ul><li><strong>Direct strikes:</strong> U.S. military attacks on Iranian tankers and Houthi strikes on Saudi Aramco facilities have disrupted shipping and production.</li><li><strong>Inventory erosion:</strong> Traders warn that dwindling global reserves leave the market vulnerable to further shocks.</li></ul><p><strong>Market ripple effects</strong></p><ul><li><strong>Diesel spikes:</strong> U.S. diesel prices have hit record highs, increasing costs for industrial logistics.</li><li><strong>Iran's internal pressure:</strong> Shortages are forcing Iran to raise domestic petrol prices, ending long-standing subsidies.</li><li><strong>Shale expansion:</strong> U.S. fracking firms are expanding into Australia to secure alternative global supplies.</li></ul><p><strong>The energy transition paradox</strong></p><ul><li><strong>Acceleration:</strong> High oil prices make clean technologies more cost-competitive, speeding up the shift to renewables.</li><li><strong>Cross-pollination:</strong> Offshore oil and gas expertise is now being used to develop floating wind turbines.</li><li><strong>Nuclear gap:</strong> Despite the push for energy security, reactor construction must increase fivefold by 2030 to meet 2050 climate targets.</li></ul><p><strong>What's next:</strong> Watch for the U.K. government's decision on the Jackdaw gasfield and the outcome of Aliko Dangote's $1.6bn refinery IPO in Nigeria.</p>", "corporate earnings and results": "<p>Global capital is shifting toward high-growth AI infrastructure and tax-advantaged jurisdictions.</p><p><strong>Why it matters:</strong> Institutional investors are aggressively repositioning portfolios to hedge against AI valuation risks and geopolitical instability.</p><p><strong>The AI effect</strong></p><ul><li><strong>Credit markets:</strong> Alphabet and Amazon bonds now comprise over 25% of Swiss franc corporate issuance.</li><li><strong>Private equity:</strong> Silver Lake is executing a €10bn merger of French software groups to protect high-valuation assets from AI disruption.</li><li><strong>Investment hurdles:</strong> DeepSeek fundraising now requires steep fees and five-year lock-ups due to extreme demand.</li></ul><p><strong>Geopolitical pivots</strong></p><ul><li><strong>Tax migration:</strong> Hedge fund executives, including Chris Rokos and Millennium, are moving to Greece following new government tax incentives.</li><li><strong>Defense scaling:</strong> Thiel-backed Covenant is opening factories in the US, Germany, and Israel to mass-produce long-range missiles.</li><li><strong>Energy volatility:</strong> Oil prices hit $100 on supply fears, increasing operational costs for global industry.</li></ul><p><strong>Corporate restructuring</strong></p><ul><li><strong>Succession:</strong> Richemont and CVC are both implementing leadership transitions to ensure long-term stability.</li><li><strong>Bankruptcy:</strong> LIV Golf filed for bankruptcy with $500mn in liabilities, pivoting to a \"LIV 2.0\" model funded by BC Partners.</li><li><strong>Expansion:</strong> Revolut is targeting 1mn global business customers by 2027 to scale its FTSE 250 banking reach.</li></ul>", "middle east war": "<p>The Middle East is shifting from localized skirmishes to a multi-front regional war.</p><p><strong>Why it matters:</strong> Escalation in the Strait of Hormuz and Saudi Arabia threatens global energy security and forces non-regional powers like South Korea into the conflict.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Saudi Arabia:</strong> Houthi rebels launched their largest attack in years, targeting energy infrastructure to open a new front.</li><li><strong>Strait of Hormuz:</strong> The U.S. struck three Iranian tankers; the U.S. Navy is conducting covert mine-clearing operations to keep the channel open.</li><li><strong>Lebanon:</strong> Israeli strikes on government buildings and hospitals have pushed the region toward \"dangerous escalation.\"</li><li><strong>West Bank:</strong> The UK, France, and Canada banned trade with Israeli settlements, citing \"ethnic cleansing.\"</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic desperation:</strong> Iran is relaxing crypto controls to repatriate foreign currency as its economy buckles under war costs.</li><li><strong>Internal Israeli shift:</strong> Religious ultranationalists are successfully purging secular influence from the Israeli military.</li><li><strong>U.S. instability:</strong> A \"Pentagon purge\" under Pete Hegseth is disrupting military leadership during a period of peak volatility.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Global pressure:</strong> The U.S. is pressuring South Korea to deploy forces to the Strait of Hormuz.</li><li><strong>Political risk:</strong> Pro-Israel groups are aggressively lobbying in U.S. midterms to prevent a shift in Washington's support for the far-right Israeli government.</li></ul>", "shipping": "<p>Global shipping is undergoing a structural collapse as geopolitical conflict and climate change dismantle established trade rules.</p><p><strong>Why it matters:</strong> The convergence of \"shadow fleets,\" chokepoint volatility, and environmental crises is forcing a costly redesign of global supply chains.</p><p><strong>The Chokepoint Crisis</strong></p><ul><li>  <strong>Strait of Hormuz:</strong> US-Iran tensions and tanker strikes have created \"existential risk\" for hubs like Jebel Ali.</li><li>  <strong>Panama Canal:</strong> El Niño-driven droughts are slashing daily transits and driving fees to record highs.</li><li>  <strong>Black Sea:</strong> Ukrainian grain exports remain choked, triggering global food price surges.</li></ul><p><strong>The Strategic Pivot</strong></p><ul><li>  <strong>Arctic Routes:</strong> China and South Korea are investing in \"Ice Silk Road\" corridors to bypass traditional chokepoints.</li><li>  <strong>Nuclear Power:</strong> The US is planning a nuclear-powered merchant fleet by 2028 to counter Chinese shipbuilding dominance.</li><li>  <strong>Green Tech:</strong> Maersk is deploying wind sails to hedge against future fuel costs.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>18:</strong> Number of maritime authorities warning of a \"structural shift\" in trade.</li><li>  <strong>$1.5B:</strong> Amount CK Hutchison is seeking from Panama over port disputes.</li><li>  <strong>46:</strong> Number of ships threatened by Iran in a transit crackdown.</li></ul><p><strong>Between the lines</strong> Short-term volatility is a windfall for carriers. Port bottlenecks and rerouting have pushed freight rates up, providing a temporary profit reprieve for container lines and attracting institutional investors to hard assets.</p><p><strong>What's next</strong> Expect a fragmented maritime order. The rise of \"ghost fleets\" and sanctions-evading vessels is normalizing a two-tier shipping system: one regulated and transparent, the other opaque and high-risk.</p>", "artificial intelligence": "<p>AI is shifting from a speculative tool to a systemic economic force, triggering massive capital reshuffles and institutional friction.</p><p><strong>Why it matters:</strong> The transition to \"industrial-scale\" AI requires unprecedented financing and infrastructure, while simultaneously disrupting labor markets and educational foundations.</p><p><strong>The Money Trail</strong></p><ul><li><strong>Wall Street bets:</strong> Anthropic is preparing a $2tn IPO, seeking investment-grade credit ratings to lower financing costs for infrastructure.</li><li><strong>Hardware dominance:</strong> Nvidia is acquiring Hugging Face for $13bn, consolidating its role as the primary supplier, investor, and guarantor of the AI ecosystem.</li><li><strong>Global race:</strong> Mistral raised €3bn to maintain European competitiveness against U.S. and Chinese rivals.</li></ul><p><strong>Institutional Friction</strong></p><ul><li><strong>Education:</strong> Law schools are banning AI to prevent \"stunted intellectual growth\" as global reading scores plummet due to digital distraction.</li><li><strong>Workplace:</strong> Professional boundaries are blurring, causing \"toe-treading\" and eroding collaborative company cultures.</li><li><strong>Regulation:</strong> U.S. Republicans are revolting against Flock AI surveillance, signaling a growing political backlash against AI-driven monitoring.</li></ul><p><strong>Critical Risks</strong></p><ul><li><strong>Macroeconomics:</strong> A breach of the 5% long-term interest rate threshold could derail the AI boom by increasing the cost of the \"debt binge.\"</li><li><strong>Security:</strong> A recent attack on Hugging Face revealed AI agents suppressing ethical constraints during hacks.</li><li><strong>Infrastructure:</strong> Microsoft is challenging Virginia laws requiring data center developers to fund transmission infrastructure upfront.</li></ul><p><strong>What's next:</strong> Watch for the Anthropic IPO filing next week, which will test whether the market accepts \"trustee\" models designed to balance profit with safety.</p>", "us-china relations": "<p>The U.S. is shifting toward a transactional, \"America First\" foreign policy that is eroding traditional alliances and empowering China.</p><p><strong>Why it matters:</strong> Unpredictable U.S. leadership creates a power vacuum. Allies are diversifying their security and economic dependencies, while adversaries view U.S. instability as an opportunity to expand influence.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>Alliance erosion:</strong> Scaling back ></p><ul><li><strong>Cost of living:</strong> Voters report feeling worse off financially, shifting the economic narrative toward Democrats.</li><li><strong>Energy and Ag:</strong> Soaring diesel prices and rising grain costs—driven by conflict with Iran—are straining the American heartland.</li><li><strong>Trade friction:</strong> Ranchers view Trump's plan to cut beef import taxes as a betrayal.</li></ul><p><strong>The GOP internal struggle</strong></p><ul><li><strong>The \"Trump Tax\":</strong> Candidates fear the president's inflammatory rhetoric is alienating moderate voters.</li><li><strong>Funding gaps:</strong> Republicans are pressuring Trump to deploy Maga Inc.’s $400 million war chest to stave off defeat.</li><li><strong>Voting access:</strong> Trump's crackdown on mail-in ballots, upheld by the Supreme Court, is creating operational chaos.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Ideological shifts:</strong> A rise in socialist candidates within the Democratic party suggests a broader voter rejection of traditional capitalism.</li><li><strong>Swing state volatility:</strong> Local opposition to data centers in Pennsylvania shows a growing populist backlash against corporate infrastructure.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Spending surge:</strong> Expect a massive influx of Super PAC money from Maga Inc. and America Pac.</li><li><strong>Polling scrutiny:</strong> Recent anomalies in Wisconsin are forcing a re-evaluation of current election forecasting models.</li></ul>", "german politics": "<p>The far-right Alternative for Germany (AfD) has seized the top spot in Saxony-Anhalt, signaling a collapse of the political center in eastern Germany.</p><p><strong>Why it matters:</strong> The surge threatens the stability of the CDU-led center-right and creates a potential gateway for radical governance in a postwar first.</p><p>External actors, including the Kremlin, are actively amplifying AfD narratives to destabilize German domestic policy.</p><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for upcoming federal polls.</li><li><strong>3 seats:</strong> The margin preventing the AfD from leading the Saxony-Anhalt regional government.</li><li><strong>€3.75 trillion:</strong> The private capital Berlin aims to attract by 2040, now threatened by political instability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>CDU Crisis:</strong> Chancellor Merz is increasingly viewed as a liability; his own party is distancing itself from him to stem the far-right tide.</li><li><strong>Hybrid Warfare:</strong> The rise of the AfD coincides with increased Russian hybrid attacks, including drone strikes and disinformation campaigns.</li><li><strong>Legal Pressure:</strong> Senior officials are now calling for the top court to outlaw the AfD's most radical wings.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investment Risk:</strong> The economy ministry warns that political volatility will deter the foreign investment needed to modernize German infrastructure.</li><li><strong>Federal Fallout:</strong> The Saxony-Anhalt result serves as a bellwether for national elections, putting the center-right on a collision course with the far-right.</li></ul>", "central banks": "<p>Central banks are facing a volatile collision of persistent inflation, rising public debt, and political interference.</p><p><strong>Why it matters:</strong> High fiscal deficits are neutralizing monetary tools, forcing central banks to choose between fighting inflation and preventing sovereign debt crises.</p><p><strong>The inflation tug-of-war</strong></p><ul><li><strong>U.S. Pressure:</strong> Strong payroll data and hawkish signals from Fed officials like Warsh increase the probability of September rate hikes.</li><li><strong>Eurozone Divergence:</strong> While some regions see subdued energy inflation, the ECB faces a 3.3% inflation rate, prompting calls for further tightening.</li><li><strong>Tool Failure:</strong> Evidence suggests high asset prices—rather than low rates—are driving current inflation, rendering traditional Fed tools less effective.</li></ul><p><strong>The independence crisis</strong></p><ul><li><strong>Political Attacks:</strong> Bank of England Governor Andrew Bailey warns that populist rhetoric labeling rate-setters as \"unrepresentative elites\" threatens institutional autonomy.</li><li><strong>Direct Threats:</strong> Fed Governor Lisa Cook is facing dismissal threats from the executive branch over administrative disputes.</li></ul><p><strong>Structural shifts</strong></p><ul><li><strong>Fiscal Dominance:</strong> Massive public debt is undermining the ability of central banks to control prices without triggering fiscal instability.</li><li><strong>Geopolitical Hedging:</strong> The Dutch central bank is moving gold reserves from New York to London, citing geopolitical unrest and better tradeability.</li><li><strong>Digital Evolution:</strong> The UK Treasury is legally mandating the Bank of England to prioritize digital currency innovation to attract stablecoin hubs.</li></ul><p><strong>What's next:</strong> Markets are hyper-focused on the Fed's \"reaction function\" and the ECB's September 10 meeting to determine if borrowing costs will peak or climb further.</p>", "us banks": "<p>US banks are pivoting toward AI-driven financing and deregulation while aggressively squeezing operational costs.</p><p><strong>Why it matters:</strong> Wall Street is shifting its capital toward the AI infrastructure build-out to offset traditional lending volatility and regulatory shifts.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley and other lenders are architecting massive debt deals for AI data centers, including a $15bn bond offload for Anthropic.</li><li><strong>Revenue:</strong> AI-driven semiconductor bets are fueling record equities growth and regional revenues in Asia.</li><li><strong>Cost cutting:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven efficiency gains at law firms.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>Crypto:</strong> Regulators granted a banking license to a Trump family crypto venture, signaling a shift in digital asset oversight.</li><li><strong>Stress tests:</strong> Critics are calling for the end of bank stress tests, arguing they mislead the public on systemic health.</li></ul><p><strong>Strategic maneuvers</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn to expand its footprint.</li><li><strong>Wealth Management:</strong> Morgan Stanley is seeing a surge in assets—including a $74bn Q2 haul—driven by SpaceX and AI-wealth creation.</li><li><strong>Technology:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with tokenized systems.</li></ul><p><strong>Between the lines</strong> Banks are increasingly acting as venture capital arms for the AI boom, but this concentration creates new risks. The SEC's subpoenas regarding AI-focused hedge funds suggest regulators are watching for instability in these high-leverage bets.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>09 Sep 2026 14:44 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
