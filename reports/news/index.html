.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

ng></p><ul><li><strong>Military:</strong> China is testing boundaries by firing ballistic missiles into Pacific nuclear-free zones.</li><li><strong>Resources:</strong> Beijing is weaponizing critical minerals, evidenced by the detention of Japanese nationals over rare earth smuggling.</li><li><strong>Economics:</strong> The IMF warns that trade weaponization is \"self-defeating\" and threatens global stability.</li></ul><p><strong>Between the lines</strong> A political divide is emerging within the U.S. regarding Beijing:</p><ul><li><strong>The Hawks:</strong> Congressional leaders continue to push for containment and decoupling.</li><li><strong>The Pragmatists:</strong> Gen Z voters and Donald Trump show increased openness to a cooperative relationship.</li></ul><p><strong>What's next</strong> Watch for a transition toward \"transactional diplomacy.\" As U.S. hegemony faces a crisis of trust globally, China is positioning itself as a more reliable partner for non-aligned nations.</p>", "us elections": "<p>The U.S. midterm landscape is shifting toward ideological extremes as progressives challenge Democratic leadership and Trump leverages massive financial reserves.</p><p><strong>Why it matters:</strong> Internal Democratic fractures and a record-breaking GOP war chest create a volatile path to congressional control.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Progressive surge:</strong> Wins by Abdul El-Sayed (Michigan) and Melat Kiros (Colorado) signal a rebuke of party establishment.</li><li><strong>Centrist pushback:</strong> Virginia Governor Abigail Spanberger is dismissing claims of a \"civil war\" to maintain party unity.</li><li><strong>Maine crisis:</strong> Democrats are scrambling to salvage a Senate bid after candidate Graham Platner exited following sexual assault allegations.</li></ul><p><strong>The Trump strategy</strong></p><ul><li><strong>Financial dominance:</strong> The Maga Inc. Super PAC has amassed $400 million, the largest >Strategic shifts:</strong> Berlin is ditching France for a new fighter jet project and buying a 40% stake in Europe's largest tank maker.</li><li><strong>Failures:</strong> Cost overruns forced the cancellation of the F126 frigate, the largest warship since WWII.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Internal dissent:</strong> Merz faces \"chancellor swap\" rumors as popularity slides and younger rival Hendrik Wüst gains momentum.</li><li><strong>Personnel losses:</strong> The resignation of parliamentary leader Jens Spahn over a surrogacy controversy has weakened the CDU leadership.</li><li><strong>External threats:</strong> Russian \"Matryoshka\" campaigns are targeting voters, while the AfD maintains ties with the Kremlin.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission; a delay would signal a growing gap between Merz's global ambitions and legislative willpower.</p>", "central banks": "<p>Central banks are shifting toward aggressive currency activism and opaque communication as geopolitical volatility spikes.</p><p><strong>Why it matters:</strong> Uncoordinated interventions and \"less is more\" messaging are eroding market predictability, driving Treasury yields to 19-year highs.</p><p><strong>The Yen Intervention</strong> The U.S. Treasury and New York Fed executed a historic euro sale to prop up the yen.</p><ul><li><strong>The signal:</strong> Washington is entering an era of \"currency activism\" to stop trades that harm U.S. interests.</li><li><strong>The friction:</strong> The move blindsided the ECB, signaling a breakdown in traditional central bank coordination.</li></ul><p><strong>The Fed's Communication Crisis</strong> Chair Kevin Warsh is facing investor backlash for a stripped-back, \"knowingly opaque\" communication style.</p><ul><li><strong>The conflict:</strong> Warsh views lean messaging as a reform; traders argue it erodes the Fed's influence over the Treasury market.</li><li><strong>The result:</strong> Borrowing costs hit their highest levels since 2007 as investors fret over inflation shocks from the Iran war.</li></ul><p><strong>Global Divergence</strong></p><ul><li><strong>Bank of England:</strong> Holding rates at 3.75% with a split committee (6-3) weighing energy price volatility.</li><li><strong>Japan:</strong> Revisiting neutral rate estimates upward while vowing further joint interventions with the U.S.</li><li><strong>Indonesia:</strong> Policy unpredictability spiked following the abrupt resignation of the central bank governor.</li></ul><p><strong>Between the lines</strong> The U.S. dollar's status as the primary reserve currency is weakening, forcing the Treasury to use direct market intervention rather than relying on interest rate guidance alone.</p>", "us banks": "<p>US banks are leveraging an AI-driven deal surge to drive record profits and asset growth.</p><p><strong>Why it matters:</strong> Wall Street has shifted from traditional lending to becoming the primary financier and beneficiary of the AI infrastructure build-out. This creates a feedback loop where AI-driven IPOs and debt deals fuel wealth management inflows.</p><p><strong>The AI effect</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley is leading the architecture for data center debt; banks are offloading $15bn in Anthropic debt to maintain lending capacity.</li><li><strong>Revenue:</strong> AI-related semiconductor investments are driving record equity runs in Asia for US lenders.</li><li><strong>Wealth Management:</strong> SpaceX and AI-linked IPOs generated a $74bn second-quarter asset haul for Morgan Stanley.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Digital Infrastructure:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with digital assets.</li><li><strong>Talent War:</strong> JPMorgan is aggressively poaching specialists, such as Amy Lissauer, to build out activism defense practices.</li><li><strong>Restructuring:</strong> Citigroup continues a \"ruthless\" overhaul under Jane Fraser to close the profitability gap with peers.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory Friction:</strong> Critics argue current stress tests are obsolete rituals that mislead the public.</li><li><strong>Global Edge:</strong> UK lenders claim US banks hold a competitive advantage due to lower capital burden requirements.</li><li><strong>Market Risk:</strong> Recent AI stock tumbles have forced hedge funds to increase collateral, signaling growing risk aversion.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fee Surge:</strong> Investment banking fees are projected to hit a four-year high as large-scale deals revive.</li><li><strong>Political Tension:</strong> JPMorgan's Jamie Dimon is leveraging planned UK investments to lobby against potential bank tax raids.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>08 Aug 2026 10:59 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>

</html>
