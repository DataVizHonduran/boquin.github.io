const SUMMARIES = {"oil and gas": "<p>Global energy markets are fracturing under the weight of geopolitical conflict and corporate instability.</p><p><strong>Why it matters:</strong> Supply shocks in the Middle East are driving immediate price volatility while internal turmoil at oil majors threatens long-term transition strategies.</p><p><strong>The BP Crisis</strong></p><ul><li>Boardroom instability peaks with the removal of Chair Albert Manifold following \"bullying\" allegations.</li><li>Executive churn continues as William Lin, head of gas and low carbon, exits after 30 years.</li><li>CEO Meg O'Neill faces intensified pressure to stabilize the company during a strategic turnaround.</li></ul><p><strong>Geopolitical Chokepoints</strong></p><ul><li><strong>Strait of Hormuz:</strong> Blockades have removed up to 13 million barrels per day, depleting global supply buffers.</li><li><strong>Iraq:</strong> Dependence on Iranian gas is triggering summer blackouts as temperatures exceed 45C.</li><li><strong>Russia:</strong> Danish shipyard Fayard remains the sole EU facility servicing Siberian LNG tankers.</li></ul><p><strong>The Transition Struggle</strong></p><ul><li><strong>Cost Pressures:</strong> Six EU nations are requesting carbon cost shields to protect heavy industry.</li><li><strong>Critical Minerals:</strong> Western rare earth efforts face legal battles over tech theft and environmental protests.</li><li><strong>Infrastructure:</strong> DigitalBridge’s $1bn acquisition of ArcLight signals a pivot toward securing power for data centers.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>13%:</strong> Expected rise in UK household energy bills starting July.</li><li><strong>$4bn:</strong> Value of Zijin’s bid for Allied Gold, currently delayed by instability in Mali.</li><li><strong>4:</strong> Number of CEOs and Chairs BP has cycled through in three years.</li></ul><p><strong>What's next:</strong> Watch for Chevron's predicted summer price spikes and the ECB's reaction to potential U.S. trade volatility under a Trump administration.</p>", "corporate earnings and results": "<p>AI infrastructure and consolidation are driving a massive shift in global market valuations.</p><p><strong>Why it matters:</strong> Massive capital inflows into AI are creating new market leaders while traditional sectors face volatility from regulatory crackdowns and macroeconomic stress.</p><p><strong>The AI surge</strong></p><ul><li><strong>SoftBank:</strong> Now Japan's largest company by market cap, overtaking Toyota.</li><li><strong>Anthropic:</strong> Filed for IPO following a $65bn funding round; valued at $900bn.</li><li><strong>Nvidia:</strong> Expanding into the consumer PC market with a new \"superchip\" to challenge Apple and Intel.</li><li><strong>Ardian:</strong> Backing a €5bn AI \"gigafactory\" in France to build a European digital backbone.</li></ul><p><strong>M&A activity</strong></p><ul><li><strong>MGM Resorts:</strong> Received an $18bn take-private bid from Barry Diller’s People Inc.</li><li><strong>Taylor Morrison:</strong> Acquired by Berkshire Hathaway for $8.5bn.</li><li><strong>Svalner Atlas:</strong> Purchased by US tax adviser Ryan for $400mn.</li></ul><p><strong>Risk factors</strong></p><ul><li><strong>Regulatory:</strong> Wise shares slumped following a Belgian money laundering probe.</li><li><strong>Geopolitical:</strong> OECD reports Chinese firms receive 8x more state subsidies than rich-world rivals.</li><li><strong>Labor:</strong> Caddell Construction faces \"quasi-slavery\" allegations in Italy.</li></ul><p><strong>What's next</strong> Investors are monitoring if AI productivity gains can translate into real GDP growth or if the current valuation spike mirrors the dotcom bubble.</p>", "middle east war": "<p>The Middle East is entering a volatile cycle of simultaneous escalation and high-stakes diplomacy.</p><p><strong>Why it matters:</strong> Conflicting signals between military offensives and ceasefire talks are creating extreme market volatility and geopolitical instability.</p><p><strong>The current flashpoints</strong></p><ul><li><strong>Lebanon:</strong> Israel is expanding its offensive against Hizbollah, capturing strategic positions like the Crusader castle and intensifying Beirut bombings.</li><li><strong>Gaza:</strong> Prime Minister Netanyahu has ordered the seizure of 70% of the enclave to squeeze Hamas.</li><li><strong>Strait of Hormuz:</strong> Iran has threatened to close the waterway, a move that would disrupt global energy supplies.</li></ul><p><strong>The diplomatic tug-of-war</strong></p><ul><li><strong>The Deal:</strong> The Trump administration is nearing a ceasefire extension with Tehran, though Iran remains skeptical of U.S. concessions.</li><li><strong>The Leverage:</strong> President Trump insists economic pressures will not force his hand, while Defense Secretary Hegseth warns the U.S. is ready to resume attacks.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Oil:</strong> Brent crude saw its biggest monthly decline since 2020 on hopes of a deal.</li><li><strong>Markets:</strong> U.S. stocks hit their longest weekly winning streak since 2023, driven by AI optimism and ceasefire hopes.</li><li><strong>Economics:</strong> Analysts expect the \"war inflation shock\" to be lower than the 2022 Ukraine surge.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Warfare:</strong> Tehran is leveraging Western AI models to accelerate malware development and cyber operations.</li><li><strong>Internal Shifts:</strong> Abu Dhabi’s Sheikh Khaled is emerging as a central figure in global diplomacy as he prepares for power.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Security Talks:</strong> Washington is scheduled to host security talks between Israel and Lebanon.</li><li><strong>Truce Stability:</strong> The fragility of the U.S.-Iran truce remains high following recent exchanges of drone and missile fire.</li></ul>", "shipping": "<p>Global shipping is fracturing as conflict in the Strait of Hormuz disrupts energy flows and forces a permanent reshaping of trade routes.</p><p><strong>Why it matters:</strong></p><ul><li>Blockages in key waterways trigger immediate spikes in freight costs and force a shift toward riskier, inefficient logistics.</li><li>Geopolitical instability accelerates the use of \"shadow fleets,\" increasing the probability of catastrophic environmental disasters.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$500 million:</strong> Monthly cost increase for Maersk due to the Iran conflict.</li><li><strong>15%:</strong> Revenue increase for the Panama Canal as ships divert from Middle East routes.</li><li><strong>$0:</strong> Total business generated by the U.S. $40bn insurance facility due to lack of naval escorts.</li><li><strong>$1.3 billion:</strong> Belfast Harbour's investment to compete with Dublin via freight and wind energy.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Energy pivots:</strong> Asian nations are returning to coal to replace disrupted gas supplies.</li><li><strong>Logistics desperation:</strong> Gulf businesses are replacing ships with trucks, drastically increasing costs while reducing cargo volume.</li><li><strong>Regulatory deadlock:</strong> U.S. opposition is stalling global agreements on shipping carbon levies and emission regulations.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Infrastructure shifts:</strong> Walmart is repurposing empty drugstores into last-mile hubs to bypass traditional shipping delays.</li><li><strong>Environmental risk:</strong> Pressure is mounting to scrap aging, sanctioned tankers currently used by Iran for floating storage.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from speculative hype to a high-stakes infrastructure and regulatory battle.</p><p><strong>Why it matters:</strong> Massive capital injections into hardware and data centers are outpacing software utility, creating a volatile gap between market valuation and actual productivity.</p><p><strong>The money trail</strong></p><ul><li><strong>Anthropic:</strong> Finalized a $65bn funding deal, pushing its valuation to $965bn.</li><li><strong>SoftBank:</strong> Pledging €75bn for a massive AI facility in France.</li><li><strong>Intel:</strong> Targeting a new inference GPU release by year-end to recapture data center market share.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Efficiency vs. Usage:</strong> Amazon is scrapping AI leaderboards to curb \"usage for the sake of usage\" as operational costs climb.</li><li><strong>Economic Uncertainty:</strong> SpaceX IPO filings highlight a lack of clarity regarding the basic business models of frontier models.</li><li><strong>Institutional Pressure:</strong> UK government officials warn that avoiding AI in public services is a \"choice for decline.\"</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Ethics:</strong> The UK military is considering autonomous lethal strikes without human approval.</li><li><strong>Labor:</strong> Debate is intensifying over \"human capital\" value and the morality of AI-driven job displacement.</li><li><strong>Governance:</strong> The Vatican is actively challenging Silicon Valley on the societal risks of the technology.</li></ul><p><strong>What's next</strong> Investors will watch if new hardware releases from Intel and others can sustain the current semiconductor rally as software returns diminish.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global influence amid a vacuum of multilateral leadership.</p><p><strong>Why it matters:</strong></p><ul><li>Beijing is leveraging U.S. volatility to position itself as a stable alternative for global partners.</li><li>Washington's shift toward preemptive action and unilateralism is eroding traditional alliances and institutional trust.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric leverage:</strong> Power is shifting from raw economic size to the ability to exploit geopolitical imbalances.</li><li><strong>The Russia factor:</strong> Putin’s strategic errors have created a one-sided dependency, granting Xi significant leverage over Moscow.</li><li><strong>Soft power flip:</strong> While the U.S. burns diplomatic bridges, China is actively courting foreign officials to repair its global image.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Hegemony vs. Responsibility:</strong> Both powers seek dominance, but neither is currently willing to shoulder the costs of global stability.</li><li><strong>The \"Stalemate\" Era:</strong> Increasing polarization makes decisive victories rare, favoring \"middleman\" diplomacy and special envoys.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Institutional overhaul:</strong> Existing multilateral bodies must be reinvented or risk total irrelevance in a fractured world.</li><li><strong>Risk evolution:</strong> Global businesses and governments are shifting focus from efficiency to resilience and contingency planning.</li></ul>", "us elections": "<p>Trump’s influence over the GOP is creating strategic vulnerabilities ahead of the midterm elections.</p><p><strong>Why it matters:</strong></p><ul><li>  Prioritizing MAGA loyalty over general election viability risks flipping key Senate seats in swing states.</li><li>  Economic instability and internal party fractures are eroding the Republican base in critical districts.</li></ul><p><strong>The Texas risk</strong></p><ul><li>  Trump-backed Ken Paxton won the primary but is viewed as too divisive for moderate voters.</li><li>  Democrats see this as a primary opening to seize the Senate seat.</li></ul><p><strong>Economic headwinds</strong></p><ul><li>  Over 50% of voters disapprove of Trump’s economic handling.</li><li>  Tariffs and fuel costs are alienating key demographics, including Maine lobster fishermen.</li><li>  Low tax refunds are increasing financial pressure on consumers.</li></ul><p><strong>Internal fractures</strong></p><ul><li>  <strong>GOP:</strong> \"America First\" nationalists claim Trump betrayed his pledge via the Iran war.</li><li>  <strong>Democrats:</strong> A DNC autopsy blames the Biden White House for Harris's loss, citing a lack of unity.</li><li>  <strong>Policy:</strong> Senate Republicans are blocking Trump’s $1.8bn \"anti-weaponization\" fund.</li></ul><p><strong>What's next</strong></p><ul><li>  Democrats are pivoting toward working-class, populist candidates to reclaim swing districts in Pennsylvania.</li><li>  The 2028 presidential pipeline is already forming, with JD Vance and Marco Rubio emerging as primary contenders.</li></ul>", "german politics": "<p>Germany is aggressively pivoting toward military expansion and fiscal discipline amid deteriorating relations with the U.S.</p><p><strong>Why it matters:</strong> Berlin is attempting to lead European defense and stabilize its economy while facing a surge in far-right populism and a volatile partnership with Donald Trump.</p><p><strong>Defense and Security</strong></p><ul><li><strong>Rapid Re-armament:</strong> Berlin plans to hit the 3.5% GDP NATO spending target six years early.</li><li><strong>Structural Overhaul:</strong> The government is restructuring its arms procurement agency to accelerate spending.</li><li><strong>Strategic Assets:</strong> Berlin is buying a 40% stake in tank maker KNDS and pursuing Tomahawk missile acquisitions.</li></ul><p><strong>The Trump Friction</strong></p><ul><li><strong>Diplomatic Rift:</strong> Chancellor Friedrich Merz’s criticism of U.S. strategy in Iran has soured relations with Donald Trump.</li><li><strong>Military Fallout:</strong> The Pentagon is reviewing troop levels and pulling 5,000 soldiers out of Germany in retaliation.</li></ul><p><strong>Economic Shifts</strong></p><ul><li><strong>Fiscal Pressure:</strong> The Finance Ministry is threatening to cut funding for ministries failing to spend a €500bn infrastructure fund.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>EU Integration:</strong> Germany is prioritizing a Capital Markets Union over national interests to boost financial services.</li></ul><p><strong>Political Volatility</strong></p><ul><li><strong>AfD Surge:</strong> The far-right party is topping polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>CDU Instability:</strong> Friedrich Merz faces internal pressure as younger conservative Hendrik Wüst emerges as a potential alternative.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the September elections in eastern states, which will determine if the AfD's momentum translates into governing power.</p>", "central banks": "<p>Central banks are facing a simultaneous crisis of political independence and macroeconomic volatility.</p><p><strong>Why it matters:</strong> Geopolitical shocks and political pressure are eroding the \"policy put,\" limiting the ability of central banks to stabilize markets without triggering inflation.</p><p><strong>The friction points</strong></p><ul><li><strong>Political interference:</strong> Former Fed leadership warns that attempts to fire central bankers undermine the rule of law and institutional autonomy.</li><li><strong>Geopolitical inflation:</strong> Conflict in Iran is driving up borrowing costs and forcing the Fed and ECB to consider rate hikes despite market hopes for cuts.</li><li><strong>Fiscal constraints:</strong> Aging demographics and rising public debt are limiting the effectiveness of independent monetary policy.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$219 billion:</strong> The size of the Exchange Stabilization Fund currently targeted by U.S. Senators to restrict foreign funding.</li><li><strong>2007:</strong> The benchmark year for current U.S. government borrowing costs, which have hit their highest levels since then.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market disconnect:</strong> A widening gap exists between professional forecasters and money markets regarding the timing of rate pivots.</li><li><strong>Tech risk:</strong> The ECB is treating AI-driven financial flaws as a systemic risk, necessitating urgent supervisory intervention.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Policy shifts:</strong> The Bank of Japan and ECB are signaling rate increases for June.</li><li><strong>Infrastructure:</strong> The Fed and BoE are moving toward near-instantaneous cross-border settlements via blockchain prototypes.</li></ul>", "us banks": "<p>US banks are aggressively leveraging deregulation to expand balance sheets and pursue global growth.</p><p><strong>Why it matters:</strong> Lighter regulatory oversight under the Trump administration has unlocked billions in excess capital, giving US lenders a competitive edge over constrained European and Swiss rivals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital freed for top US and UK banks via regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital JPMorgan claims is now available due to deregulation.</li><li><strong>$20 billion:</strong> The potential acquisition budget Jamie Dimon is considering.</li><li><strong>$9.4 billion:</strong> Total 2025 employee pay at Jane Street following record $40bn revenues.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Risk shifting:</strong> Banks are actively offloading exposure to private equity-linked loans and AI-driven data center debt to avoid systemic \"choking.\"</li><li><strong>Geopolitical friction:</strong> Security concerns are forcing operational splits, evidenced by Morgan Stanley issuing China-only iPhones to Hong Kong staff and Goldman restricting AI tools in the region.</li><li><strong>Strategic pivots:</strong> Citi is shifting from internal revenue sharing to direct employee referral payments to accelerate its turnaround.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail expansion:</strong> JPMorgan is scaling its \"Chase\" digital bank into Germany after its UK launch.</li><li><strong>Crypto integration:</strong> Morgan Stanley will launch spot crypto trading on E*Trade, further mainstreaming digital assets.</li><li><strong>Treasury surge:</strong> Primary dealers are boosting Treasury holdings to 2007 levels to facilitate increased government debt trading.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>01 Jun 2026 16:24 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
