const SUMMARIES = {"oil and gas": "<p>AI power demands and geopolitical instability are reviving the strategic importance of oil and gas.</p><p><strong>Why it matters:</strong></p><ul><li>Data center growth is outpacing renewable capacity, forcing a return to gas-fired power to maintain AI leadership.</li><li>Middle East conflict is disrupting critical transit corridors and volatile supply chains.</li></ul><p><strong>By the numbers</strong></p><ul><li>400+: Ships waiting near the Strait of Hormuz for full reopening.</li><li>20 years: Length of the Chevron-Microsoft deal to power AI data centers.</li><li>2019: Global gas flaring has reached its highest level since this year.</li></ul><p><strong>Between the lines</strong></p><ul><li>Energy policy is shifting from climate-first to security-first. New York is weakening its opposition to fossil fuels to prevent electricity shortages.</li><li>The US and China are prioritizing energy reliability to win the AI arms race over strict adherence to green targets.</li></ul><p><strong>What's next</strong></p><ul><li>EU methane regulations may trigger a gas supply crunch as the US and Qatar push back.</li><li>Political shifts in the UK could lead to increased oil and gas exploration following Conservative gains in Aberdeen.</li></ul>", "corporate earnings and results": "<p>AI demand and geopolitical instability are driving a wave of high-stakes corporate restructuring and capital raises.</p><p><strong>Why it matters:</strong></p><ul><li>AI is shifting capital toward chipmakers and data centers while destabilizing traditional labor models.</li><li>Trade disputes and regulatory scrutiny are complicating global supply chains and multi-billion dollar mergers.</li></ul><p><strong>By the numbers</strong></p><ul><li>$240 billion: Venezuela's estimated debt pile.</li><li>$111 billion: Paramount’s proposed takeover of Warner Bros.</li><li>$29 billion: SK Hynix’s planned US listing.</li><li>£12.6 billion: Rejected Prologis bid for Segro.</li></ul><p><strong>Between the lines</strong></p><ul><li>Defense stocks are surging as the US and Europe prioritize rearmament.</li><li>European carmakers are struggling to reduce bloated costs, forcing potential alliances with China.</li><li>Automation is triggering direct labor conflict, evidenced by strikes at Hyundai.</li></ul><p><strong>What's next</strong></p><ul><li>The KNDS IPO will test investor appetite for defense assets.</li><li>Brussels will determine the regulatory remedies required to clear the Paramount-Warner Bros merger.</li></ul>", "middle east war": "<p>The U.S. and Iran are negotiating a peace deal in Switzerland to end a four-month conflict.</p><p><strong>Why it matters:</strong> A resolution is critical to reopening the Strait of Hormuz and stabilizing global maritime trade. The deal's viability depends on Iran reining in Hizbollah and the U.S. releasing frozen assets.</p><p><strong>By the numbers</strong></p><ul><li><strong>1,200:</strong> Cargo ships stranded by the Hormuz blockade.</li><li><strong>$125 billion:</strong> Value of goods caught in the maritime deadlock.</li><li><strong>$6 billion:</strong> Frozen Iranian funds Trump may release for U.S. medical and agricultural goods.</li><li><strong>500:</strong> U.S. aircraft that utilized Italian bases during Operation Epic Fury.</li></ul><p><strong>Between the lines</strong></p><ul><li>The Israel-Hizbollah ceasefire provides the necessary diplomatic window for the U.S.-Iran agreement.</li><li>Domestic friction is rising in Washington, with the Senate passing a resolution to limit presidential war powers.</li><li>Allied unity is fraying, highlighted by public disputes between the U.S. and Italy over military base usage.</li></ul><p><strong>What's next</strong></p><ul><li>Negotiators will determine if a partial deal can restore trade normality and address Iran's nuclear program.</li><li>The German Bundestag must decide whether to approve minesweepers to clear the Strait of Hormuz.</li></ul>", "shipping": "<p>A US-Iran accord is reopening the Strait of Hormuz, shifting the crisis from military conflict to financial negotiation.</p><p><strong>Why it matters:</strong> The waterway is a vital energy artery; Iran's push for \"insurance fees\" creates a new precedent for transit tolls in international waters.</p><p><strong>Between the lines</strong></p><ul><li>Iran now requires vessels to hold Tehran-approved insurance policies to use the strait.</li><li>Some shipping tycoons prefer a flat fee—up to $200,000—over the uncertainty of strategic closures.</li><li>Tanker owners face a potential market crash as conflict-driven record profits evaporate.</li></ul><p><strong>The shadow fleet risk</strong></p><ul><li>The UK is intercepting Russian shadow fleet tankers in the English Channel to disrupt war funding.</li><li>More than 50% of shadow fleet vessels are flagged as environmental disaster risks due to age and poor maintenance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Logistics:</strong> Analysts warn the Hormuz backlog may take weeks to clear, leaving oil flows vulnerable.</li><li><strong>Industry:</strong> South Korea is expanding its economy by capitalizing on the AI race and global defense demand.</li><li><strong>Defense:</strong> The UK is repositioning shipyards like Cammell Laird for a Royal Navy refresh.</li></ul>", "artificial intelligence": "<p>AI has evolved into a critical lever for geopolitical power and economic disruption.</p><p><strong>Why it matters:</strong> US export bans are fueling illicit hardware markets while AI lobbying is successfully neutralizing regulatory threats in Washington.</p><p><strong>By the numbers</strong></p><ul><li>2x: Price jump for banned Nvidia chips on China’s black market.</li><li>700,000: Delivery jobs in China threatened by robotics.</li><li>$400 billion: Market value shed by SpaceX amid bond yield volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li>Western intelligence warns the current AI lead may evaporate within months.</li><li>Private equity firms are now using AI replicas to automate due diligence on software targets.</li><li>The \"white-collar\" workforce is facing a structural decline in demand.</li></ul><p><strong>What's next</strong></p><ul><li>OpenAI is pitching ad models to marketers to stabilize losses before a potential IPO.</li><li>AI integration is scaling into high-stakes sectors, specifically drug discovery and professional legal services.</li></ul>", "us-china relations": "<p>The US and China are competing to fill a global leadership vacuum created by the decay of the post-WWII order.</p><p><strong>Why it matters:</strong></p><ul><li>The shift toward a \"might is right\" system increases the risk of direct great-power conflict.</li><li>Beijing is leveraging US instability to position itself as the primary pillar of global stability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetric leverage:</strong> Power is shifting from raw wealth to the ability to exploit imbalances.</li><li><strong>The Russia factor:</strong> Putin’s strategic missteps have locked Russia into a one-sided dependency on China.</li><li><strong>Responsibility gap:</strong> Both Washington and Beijing seek hegemony but avoid the costs of maintaining global governance.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Strategic stalemate:</strong> Expect a prolonged period where neither power can achieve a decisive victory.</li><li><strong>Diplomatic pivots:</strong> Increased reliance on special envoys and \"middlemen\" to manage volatility.</li><li><strong>Alliance pressure:</strong> US allies will demand clearer security commitments to prevent a deterrence gap.</li></ul>", "us elections": "<p>Trump controls the Republican primary process while economic pressure creates vulnerabilities for the general election.</p><p><strong>Why it matters:</strong> Trump’s preference for divisive candidates may alienate swing voters in critical Senate races. Inflation and cost-of-living spikes are eroding support among key demographics, including evangelicals and rural workers.</p><p><strong>Between the lines</strong></p><ul><li><strong>Texas Risk:</strong> Ken Paxton’s primary victory confirms Trump's influence but may hand the Senate seat to Democrats due to Paxton's limited appeal outside the MAGA base.</li><li><strong>Democratic Pivot:</strong> A populist victory in Pennsylvania suggests Democrats are shifting strategy to recapture working-class voters.</li><li><strong>California Proxy:</strong> The governor's race between Steve Hilton and Xavier Becerra will gauge the appetite for MAGA-aligned politics in the West.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$300 billion:</strong> Proposed fund for Iran if a peace deal is upheld.</li><li><strong>$1.8 billion:</strong> Trump's contested \"anti-weaponization\" fund for alleged \"lawfare\" victims.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Midterm tests:</strong> November elections will determine if MAGA-backed candidates can win general elections or if they are limited to primary victories.</li><li><strong>2028 Outlook:</strong> The DoJ probe into Gavin Newsom could shift the Democratic presidential field.</li><li><strong>Judicial impact:</strong> The Supreme Court's decision in *Louisiana vs Callais* may alter Black voter enfranchisement.</li></ul>", "german politics": "<p>Germany is overhauling its military procurement and economic strategy to counter domestic instability and shifting global alliances.</p><p><strong>Why it matters:</strong> Berlin is pivoting toward strategic autonomy as relations with the U.S. and France fray. Simultaneously, the AfD's polling surge is forcing a rightward shift in national security and cultural policy.</p><p><strong>By the numbers</strong></p><ul><li>40%: Berlin's planned stake in tank maker KNDS.</li><li>€500bn: The infrastructure fund facing strict spending deadlines.</li><li>€2.35mn: The illegal donation the AfD must return per court order.</li><li>25%: The target stake for Berlin in Uniper following privatization.</li></ul><p><strong>Between the lines</strong> Defense procurement remains dysfunctional. Scrapping the F126 frigate program highlights chronic cost overruns and delays.</p><p>Chancellor Friedrich Merz is fighting a two-front war: managing a volatile relationship with Donald Trump and fending off internal rivals like Hendrik Wüst.</p><p>The AfD is leveraging economic anxiety—specifically fuel prices—to dominate opinion polls and build ties with the Kremlin.</p><p><strong>What's next</strong></p><ul><li>Berlin will seek new partners for its fighter jet project after breaking with France.</li><li>The government will implement a Swedish-style capital-market pension fund to modernize retirement savings.</li><li>A planned IPO for KNDS will test Germany's ability to privatize strategic defense assets.</li></ul>", "central banks": "<p>Kevin Warsh is stripping the Federal Reserve of its forward guidance to prioritize agility over predictability.</p><p><strong>Why it matters:</strong> Removing \"dot plots\" and policy signals increases market volatility but prevents the Fed from being boxed into outdated commitments.</p><p>Geopolitical instability, specifically the Iran war, has pushed inflation toward double the Fed's target, forcing a pivot toward higher rates.</p><p><strong>By the numbers</strong></p><ul><li><strong>1%:</strong> Bank of Japan's new rate, the highest since 1995.</li><li><strong>3.75%:</strong> Bank of England's current hold.</li><li><strong>2x:</strong> Approximate level of current US inflation relative to the Fed's target.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Communication shift:</strong> Warsh is rejecting the \"reaction-function\" model to avoid providing a roadmap for traders.</li><li><strong>Security hedge:</strong> Central banks are repatriating gold reserves to mitigate s banks deploy excess capital.</li><li>Watch for continued lobbying efforts to further ease Basel capital rules.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>24 Jun 2026 12:36 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
