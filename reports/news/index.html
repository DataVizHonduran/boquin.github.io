.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

t global camps.</li><li><strong>Strategic hedging:</strong> Allies like Japan and South Korea are questioning US security guarantees, forcing a search for \"Plan B\" security architectures.</li></ul>", "us banks": "<p>US banks are aggressively pivoting toward AI infrastructure and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is transitioning from traditional lending to becoming the primary financier and beneficiary of the AI boom, creating new systemic dependencies on tech valuations.</p><p><strong>The AI Pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley and others are architecting the debt structures for AI data centers; banks are offloading $15bn in Anthropic debt to maintain lending capacity.</li><li><strong>Revenue:</strong> AI-driven semiconductor investments are fueling record equities growth in Asia.</li><li><strong>Efficiency:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven productivity gains at law firms.</li></ul><p><strong>Regulatory Shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>Crypto:</strong> Regulators granted a banking license to a Trump family crypto venture, signaling a shift in digital asset policy.</li><li><strong>Stress Tests:</strong> Critics are calling for the end of bank stress tests, arguing they provide a false sense of security.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn to expand its footprint.</li><li><strong>Wealth Management:</strong> Morgan Stanley is seeing a surge in assets (including a $74bn Q2 haul) driven by SpaceX and AI-wealth creation.</li><li><strong>Infrastructure:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>14 Sep 2026 16:44 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
