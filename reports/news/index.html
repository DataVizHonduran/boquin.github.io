const SUMMARIES = {"oil and gas": "<p>Global energy security is colliding with climate mandates, creating a volatile landscape of geopolitical deadlock and infrastructure vulnerability.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Policy Paralysis:</strong> The failure of COP31 to secure a fossil fuel phaseout signals a shift toward carbon capture and energy security over aggressive decarbonization.</li><li>  <strong>Systemic Risk:</strong> Cyberattacks on U.S. crude hubs and refinery strikes in Russia highlight the fragility of global energy supply chains.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>£2,000+:</strong> Projected January energy price cap for UK households.</li><li>  <strong>$7bn:</strong> Amazon's investment in India, signaling a broader shift in regional capital.</li><li>  <strong>2 years:</strong> The delay in EU methane emission rules following industry lobbying.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The \"Green Wash\" Divide:</strong> A deepening fracture exists between the EU's strict climate goals and the Arab group's protection of fossil fuel interests.</li><li>  <strong>Strategic Pivot:</strong> The U.S. is aggressively countering China's mineral dominance, evidenced by securing rare earth deposits in Kenya.</li><li>  <strong>Technology Reality Check:</strong> High costs are stalling hydrogen adoption in China, while nuclear energy (SMRs) becomes the new frontier for U.S.-China leadership.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Market Adaptation:</strong> The IEA suggests global oil markets can survive a closure of the Strait of Hormuz, though it will require significant investment.</li><li>  <strong>Fiscal Pressure:</strong> UK energy producers are exiting the North Sea due to high taxes, shifting capital toward higher-return jurisdictions.</li></ul>", "corporate earnings and results": "<p>Global markets are shifting as corporate giants flee London for New York and AI costs surge.</p><p><strong>Why it matters:</strong> Capital flight from the UK and rising infrastructure costs for AI are squeezing margins and altering where the world's largest companies seek liquidity.</p><p><strong>The London Exodus</strong></p><ul><li><strong>Compass Group:</strong> The £43bn catering giant plans to move its main listing to New York.</li><li><strong>The Catalyst:</strong> A lack of \"bold incentives\" and high capital gains taxes are deterring biotech and tech firms from listing in the UK.</li><li><strong>The Result:</strong> Britain is struggling with technology adoption and capital attraction compared to US markets.</li></ul><p><strong>The AI Cost Crunch</strong></p><ul><li><strong>Pricing spikes:</strong> Dell, HPE, Lenovo, and Supermicro have raised AI server prices by up to 45% post-contract.</li><li><strong>Consolidation:</strong> Amazon is pursuing a $7.5bn acquisition of Decart to compete with Nvidia for computing power.</li><li><strong>IPO volatility:</strong> Anthropic's share price weakness suggests banks may have misjudged the timing of \"greenshoe\" stock issuances.</li></ul><p><strong>Market Friction</strong></p><ul><li><strong>Private Equity:</strong> Co-investors are pushing back against \"sell-to-yourself\" deals via continuation vehicles.</li><li><strong>Retail:</strong> US retailers report strong holiday sales despite pessimistic consumer sentiment surveys.</li><li><strong>Trade:</strong> Small Chinese e-commerce imports to the UK have increased fourfold over two years.</li></ul><p><strong>What's next:</strong> Watch for the official Compass Group announcement and the impact of Nscale's spending cuts ahead of its planned $35bn IPO.</p>", "middle east war": "<p>The U.S. and Iran are locked in a volatile cycle of tit-for-tat strikes that threatens global energy stability and U.S. military readiness.</p><p><strong>Why it matters:</strong> Escalation in the Strait of Hormuz directly impacts crude exports, while indefinite troop deployments strain the U.S. defense budget and operational readiness.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Direct Conflict:</strong> U.S. strikes on Qeshm Island followed Iranian attacks on a Bahraini base.</li><li><strong>Regional Spillover:</strong> Iran has expanded targets to include Bahrain and Kuwait.</li><li><strong>Asymmetric Warfare:</strong> Houthi rebels struck the Saudi Public Investment Fund headquarters.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Oil:</strong> Crude exports are \"increasingly fragile\" as shipping through Hormuz drops.</li><li><strong>Diplomacy:</strong> The UK blacklisted eight Israeli firms over West Bank settlements.</li><li><strong>Politics:</strong> Israel's far-right coalition faces setbacks with a new parliamentary Speaker and potential Haredi party defections.</li></ul><p><strong>Between the lines</strong> The traditional economic hedge is failing. Gold is no longer protecting portfolios during tech volatility, and the historical correlation between crude prices and bond markets has broken.</p><p><strong>What's next</strong> The Trump administration must decide between further escalation or a strategic exit from the \"Iranian quagmire\" as military officials warn of eroding force readiness.</p>", "shipping": "<p>Geopolitical conflict is fracturing global shipping lanes and driving up operational costs.</p><p><strong>Why it matters:</strong> War in the Black Sea and the Strait of Hormuz is forcing vessels into longer, more expensive routes. This instability triggers fuel shortages, spikes crew wages, and disrupts food security.</p><p><strong>The danger zones</strong></p><ul><li><strong>Black Sea:</strong> Now the world's deadliest shipping route. Russia is diverting grain to Arctic ports, increasing costs for global buyers.</li><li><strong>Strait of Hormuz:</strong> Iranian attacks on tankers have surged, with 24 vessels targeted in two weeks.</li><li><strong>Gulf of Oman:</strong> U.S. naval blockades and strikes on tankers are escalating tensions.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24.6 million:</strong> Daily barrels of Middle East oil exports, currently exceeding prewar levels via alternative routes.</li><li><strong>10%:</strong> Drop in Maersk shares following disappointing Q3 results despite data center demand.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Tactical shifts:</strong> Iran is returning to limpet mine attacks, while Russia is using coordinated location-spoofing to hide tanker movements.</li><li><strong>Political friction:</strong> U.S. domestic disputes over Russian diesel deals are threatening port deliveries on the East Coast.</li><li><strong>Infrastructure pivots:</strong> London Gateway is poised to overtake Felixstowe as the U.K.'s top port, driven by Chinese EV imports.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> A court case between Mercuria and the Baltic Exchange will determine the validity of shipping price estimates in war zones.</li><li><strong>Corporate pivots:</strong> Maersk is aggressively acquiring ships to compete with CMA CGM.</li></ul>", "artificial intelligence": "<p>AI is transitioning from a speculative market bubble to a volatile era of geopolitical conflict and industrial scaling.</p><p><strong>Why it matters:</strong> Massive capital expenditures are colliding with diminishing investor patience and intensifying US-China trade restrictions. This shift forces AI labs to move from research milestones to sustainable enterprise revenue.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.5 trillion:</strong> Anthropic's valuation following a record $81 billion IPO.</li><li><strong>$40 billion:</strong> The value of semiconductor chips SpaceX is attempting to launch into orbit.</li><li><strong>167 years:</strong> The age of the Riemann hypothesis, which an Anthropic staffer claims to have solved using AI.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market fatigue:</strong> Wall Street is questioning the \"AI spending boom,\" leading to a bear market for several major tech stocks.</li><li><strong>Security risks:</strong> AI-driven cyberattacks have reached \"critical\" levels in Germany, signaling a new era of automated threats.</li><li><strong>Geopolitical friction:</strong> The US is tightening supply chain controls, putting companies like Nscale at risk of blacklisting.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Enterprise pivot:</strong> Companies like Anthropic and Sage must prove they can function as full technology platforms to justify their valuations.</li><li><strong>Labor evolution:</strong> AI is replacing technical tasks for junior professionals (e.g., accountants) but cannot yet replicate relational human work.</li></ul>", "us-china relations": "<p>China is leveraging a trilateral summit with the U.S. and Russia to position itself as the primary architect of a new global order.</p><p><strong>Why it matters:</strong> Beijing is pursuing a \"Yalta 2.0\" strategy to reshape international governance. By mediating between Donald Trump and Vladimir Putin, Xi Jinping signals that the U.S.-led era is being replaced by a multipolar system centered on Chinese leadership.</p><p><strong>Between the lines</strong></p><ul><li><strong>Strategic Alignment:</strong> China is using the summit to embolden Russia, creating a counterweight to Western influence.</li><li><strong>U.S. Retrenchment:</strong> Beijing views American political volatility and potential isolationism as an opening to fill the global power vacuum.</li><li><strong>The \"Big Three\" Dynamic:</strong> The meeting suggests a shift toward \"great power\" diplomacy, where global spheres of influence are negotiated by a few leaders rather than through international law.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Ukraine Resolution:</strong> The U.S. is pushing for a peace deal before January, which could serve as a litmus test for the trilateral agreement's viability.</li><li><strong>European Response:</strong> EU leaders must decide whether to engage with this new power bloc or double down on independent defense and diplomacy.</li></ul>", "us elections": "<p>Democrats secured a sweeping victory in the U.S. midterms, fundamentally shifting the balance of power in Washington.</p><p><strong>Why it matters:</strong> The results signal a rejection of MAGA populism and a strategic pivot by Democrats away from \"woke\" politics toward class-based issues. This shift creates a power vacuum within the GOP and elevates new Democratic leadership.</p><p><strong>By the numbers</strong></p><ul><li><strong>56 seats:</strong> The Democratic tally in the 100-member Senate.</li><li><strong>$500 million:</strong> The amount Elon Musk donated to Republicans before distancing himself from the party.</li><li><strong>$4.2 trillion:</strong> The loss in data center construction stocks as the AI trade unravels.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Demographic shifts:</strong> High turnout among older voters and historic wins in \"red\" states like Mississippi indicate a breakdown in traditional political identities.</li><li><strong>Strategic failure:</strong> Republican gerrymandering efforts failed to stop the Democratic wave.</li><li><strong>Internal GOP strife:</strong> Party leaders are blaming Big Tech and AI infrastructure rather than Donald Trump for the losses.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership transition:</strong> Hakeem Jeffries is on track to become the first Black lawmaker to lead the House.</li><li><strong>Oversight:</strong> Democrats plan to target administration officials for conflicts of interest.</li><li><strong>2028 horizon:</strong> Socialists in New York are already backing Alexandria Ocasio-Cortez for a future presidential run.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a more aggressive military and geopolitical posture amid deepening domestic instability.</p><p><strong>Why it matters:</strong> Berlin is attempting to lead Europe's defense and support for Ukraine while its own coalition fractures and the far-right AfD gains institutional power.</p><p><strong>The strategic shift</strong></p><ul><li><strong>Military expansion:</strong> Germany is appointing Ukraine-aligned leadership to the Bundeswehr and expanding spy agency powers to conduct \"disruptive operations.\"</li><li><strong>Geopolitical leverage:</strong> Merz is using EU budget negotiations as a tool to force unanimous financial support for Kyiv.</li><li><strong>Security risks:</strong> Increased military activity is triggering friction with France over nuclear escalation and warnings of \"intense\" Russian espionage.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of the labor minister and deadlocks over ECB appointments signal a failing government structure.</li><li><strong>AfD ascent:</strong> The far-right has secured its first regional parliament president, fueled by alleged secret support from CDU lawmakers.</li><li><strong>Economic tension:</strong> The Council of Economic Experts is warning against defense borrowing to prevent GDP debt from hitting 98% by 2040.</li></ul><p><strong>Between the lines</strong> Merz is positioning himself as the \"firewall\" against the far-right, but his push for unpopular reforms and military rearmament is creating a vacuum that the AfD is actively filling.</p><p><strong>What's next</strong></p><ul><li><strong>March:</strong> The expected inauguration of Ilse Aigner as Germany's first female president.</li><li><strong>Investment Summit:</strong> Markets will watch if AfD gains deter foreign investors during upcoming Berlin talks.</li></ul>", "central banks": "<p>Central banks are pivoting back to aggressive tightening as inflation proves more entrenched than previously forecasted.</p><p><strong>Why it matters:</strong> Persistent price pressures and strong labor markets are forcing policymakers to abandon \"transitory\" assumptions. Failure to act now risks second-round inflation effects that could permanently raise borrowing costs.</p><p><strong>The divergence</strong></p><ul><li><strong>U.S. & UK:</strong> The Fed and BoE are signaling further rate hikes. Fed Governor Christopher Waller is weighing a 50bp move if inflation fails to slow.</li><li><strong>Eurozone:</strong> The ECB remains on a tightening path as core inflation stays well above the 2% target.</li><li><strong>Japan:</strong> Weak GDP growth is stalling the Bank of Japan's plans for a December rate rise.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Risk:</strong> The ECB warns that hyperscalers' off-balance sheet commitments mirror the subprime bubble's systemic risk.</li><li><strong>AI Opportunity:</strong> Conversely, some officials argue AI-driven productivity could sustain higher GDP growth without triggering inflation.</li><li><strong>Leadership Shift:</strong> The race to succeed Christine Lagarde at the ECB is intensifying, with candidates like Klaas Knot signaling a willingness to invent new tools for debt crises.</li></ul><p><strong>What's next</strong> Watch for December policy meetings. The Fed and BoE will decide if strong economic data necessitates a \"hawkish\" surprise to prevent inflation from becoming structural.</p>", "us banks": "<p>US banks are pivoting toward AI integration and talent retention while battling regulatory fines and geopolitical friction.</p><p><strong>Why it matters:</strong> Banks are facing a dual-threat environment where AI risks eroding deposit margins, while systemic compliance failures are triggering billion-dollar penalties.</p><p><strong>The AI paradox</strong></p><ul><li><strong>The Risk:</strong> AI agents could shift billions in deposits to higher-yielding accounts, potentially costing banks $500 billion.</li><li><strong>The Hedge:</strong> Lenders are restricting AI agent access to accounts to prevent automated capital flight.</li><li><strong>The Upside:</strong> Regulators are exploring AI to identify cultural red flags that led to the SVB collapse.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 billion:</strong> The money laundering fine that contributed to a 17% profit drop for Bank of America.</li><li><strong>$350 million:</strong> The fine levied against Amex for failing to report $13 billion in suspicious transactions.</li><li><strong>30%:</strong> The rise in Goldman Sachs' third-quarter net income, driven by a trading boom.</li><li><strong>$500 million:</strong> The amount Goldman is paying top executives in special equity bonuses.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Talent War:</strong> Citi is shortening junior banker programs to two years to stop private equity poaching.</li><li><strong>Strategic Shifts:</strong> Goldman is aggressively promoting engineers to partner ranks, signaling a shift from traditional finance to tech-driven trading.</li><li><strong>Geopolitical Friction:</strong> The US-EU banking rift is widening, while Citi is leveraging new China securities approvals ahead of US-China diplomatic meetings.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Earnings Volatility:</strong> Analysts expect the record-breaking trading streak to cool in upcoming reports.</li><li><strong>Leadership Transitions:</strong> Markets are watching for a definitive timeline for Goldman CEO David Solomon's departure.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>22 Nov 2026 17:59 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
