.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>AI demand is forcing a global energy pivot toward nuclear and high-capacity storage.</p><p><strong>Why it matters:</strong> The massive power requirements of AI data centers are outpacing current grid capacities and renewable subsidies, driving a resurgence in \"baseload\" power.</p><p><strong>The AI energy surge</strong></p><ul><li><strong>Nuclear bets:</strong> Proxima Fusion reached a €2.4bn valuation; Holtec is pursuing an IPO to meet AI-driven energy demand.</li><li><strong>Grid strain:</strong> US regulators (FERC) are issuing ultimatums to grid operators to streamline \"large load\" connections for data centers.</li><li><strong>Storage boom:</strong> Battery start-ups report \"crazy\" demand to manage power surges caused by AI processor clusters.</li></ul><p><strong>Global oil & gas shifts</strong></p><ul><li><strong>China's play:</strong> Beijing is increasing Middle East oil imports as Saudi Arabia drops export prices to 6-year lows.</li><li><strong>Canadian autonomy:</strong> Canada is planning a new pipeline to Asia (1mn barrels/day) to reduce reliance on US transit.</li><li><strong>Strategic expansion:</strong> UAE’s Adnoc acquired Shell’s South African fuels business for $1bn.</li></ul><p><strong>Between the lines</strong> The \"energy transition\" is becoming \"energy addition.\" While green goals remain, the immediate necessity of AI infrastructure is reviving interest in fossil fuels and nuclear power to ensure stability.</p><p><strong>What's next</strong></p><ul><li><strong>Price hikes:</strong> US clean power prices are expected to soar as Biden-era subsidies expire and AI demand peaks.</li><li><strong>Regulatory battles:</strong> The EU is weighing weaker climate rules for data centers following Big Tech lobbying.</li></ul>", "corporate earnings and results": "<p>Corporate earnings and valuations are increasingly driven by technical market mechanics rather than fundamental business performance.</p><p><strong>Why it matters:</strong> Technicals are displacing fundamentals in pricing assets. This disconnect creates volatility and exposes firms to sharp corrections when sentiment shifts.</p><p><strong>The AI Correction</strong></p><ul><li><strong>South Korea:</strong> The Kospi entered a bear market, dropping 20% from its June peak.</li><li><strong>The Driver:</strong> Investor skepticism regarding the long-term prospects of AI chipmakers Samsung Electronics and SK Hynix.</li></ul><p><strong>Strategic Pivots</strong></p><ul><li><strong>Tesco:</strong> Exploring the sale of its European business to refocus exclusively on the UK home market.</li><li><strong>Santander:</strong> Axing top China leadership to shift corporate banking focus toward Southeast Asia.</li><li><strong>Apple:</strong> Committing $30B to Broadcom for US-made chips to align with political priorities.</li></ul><p><strong>Market Imbalances</strong></p><ul><li><strong>London IPOs:</strong> Takeover bids for listed companies are worth 27x more than the value of new entrants.</li><li><strong>The Gap:</strong> Bids total nearly £60B, while new listings total only £2.2B.</li></ul><p><strong>What's next:</strong> Watch for further consolidation in the European banking sector as UniCredit moves toward majority control of Commerzbank.</p>", "middle east war": "<p>The Middle East is entering a volatile transition as Iran leverages a leadership vacuum to project regional power.</p><p><strong>Why it matters:</strong> The intersection of Iranian instability, U.S. economic sanctions, and shifting alliances threatens global energy security and disrupts the existing world order.</p><p><strong>The Iran Pivot</strong></p><ul><li><strong>Power Play:</strong> Tehran is using the funeral processions of its slain supreme leader to mobilize Shia influence in Iraq and signal regime unity.</li><li><strong>Economic War:</strong> The U.S. revoked oil sale waivers following tanker strikes in the Strait of Hormuz, escalating the financial squeeze on Tehran.</li><li><strong>Logistics Crisis:</strong> Freight experts warn that land-based trucking cannot replace the shipping volume of the Strait of Hormuz, risking global supply chain shocks.</li></ul><p><strong>Regional Fractures</strong></p><ul><li><strong>Gulf Tension:</strong> Saudi Arabia is blocking payments to UAE accounts, signaling a sharp rise in economic friction between the two regional heavyweights.</li><li><strong>Syrian Vacuum:</strong> President Macron’s visit to Damascus marks the first EU leadership presence since the fall of the Assad regime.</li><li><strong>Gaza Shift:</strong> Hamas claims it will dissolve its civilian governing arm, though critics argue the group will retain military control.</li></ul><p><strong>The U.S. Factor</strong></p><ul><li><strong>Political Cost:</strong> An FT poll indicates U.S. voters believe the \"Iran war\" is not worth the cost, dragging down President Trump's approval ratings.</li><li><strong>Turkey Pivot:</strong> Trump is signaling a reversal of the F-35 ban for Turkey, prioritizing a bilateral relationship over traditional NATO consensus.</li></ul><p><strong>What's next:</strong> Watch for the emergence of a successor to the Iranian supreme leader; the absence of Mojtaba Khamenei from key events suggests an internal power struggle.</p>", "shipping": "<p>Global shipping is currently caught between geopolitical volatility in the Middle East and a surge in trade driven by looming U.S. tariffs.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the Red Sea is creating extreme price volatility, while \"front-loading\" shipments to avoid tariffs is artificially inflating freight rates.</p><p><strong>The Hormuz Volatility</strong></p><ul><li><strong>The Blockade:</strong> A recent closure stranded ~1,200 ships carrying $125bn in goods.</li><li><strong>The Recovery:</strong> Transits quadrupled following a US-Iran ceasefire, though naval mines and \"unknown projectiles\" keep risk high.</li><li><strong>The Cost:</strong> Insurers slashed war premiums by over 50% as the ceasefire held, but Iran is now seeking to implement its own \"insurance fees\" for passage.</li></ul><p><strong>The Tariff Effect</strong></p><ul><li><strong>Demand Spike:</strong> Maersk raised profit guidance as U.S. companies stockpile goods to beat new tariffs.</li><li><strong>Rate Surge:</strong> Freight costs have hit their highest levels since the 2024 Red Sea crisis due to this rush.</li><li><strong>Route Shifts:</strong> Maersk is returning to the Suez Canal, which lowers delivery times but threatens to depress freight rates.</li></ul><p><strong>The Shadow Fleet</strong></p><ul><li><strong>Revenue:</strong> Greek firms earned nearly $4bn transporting Russian oil over three years despite G7 price caps.</li><li><strong>Tactics:</strong> Sanctioned \"shadow tankers\" are now bypassing the English Channel to avoid European naval interceptions.</li><li><strong>Escalation:</strong> Ukraine is currently seeking legal justification to launch direct attacks on these tankers.</li></ul><p><strong>Strategic Moves</strong></p><ul><li><strong>Consolidation:</strong> CMA CGM is spending $1.4bn to buy FedEx's logistics unit to expand its U.S. supply chain footprint.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative hype cycle to a high-stakes industrial reset.</p><p><strong>Why it matters:</strong> Massive capital expenditures are colliding with regulatory friction and security vulnerabilities, forcing a pivot from \"experimentation\" to \"infrastructure.\"</p><p><strong>The financial tension</strong></p><ul><li><strong>High costs:</strong> OpenAI and Anthropic face punishing frontier costs that complicate potential IPOs.</li><li><strong>Market volatility:</strong> Samsung shares dropped 10% despite record profits, as investors worry that massive AI investments may outweigh short-term gains.</li><li><strong>Concentrated bets:</strong> SoftBank’s Masa Son has pivoted his entire portfolio to AI, increasing systemic risk.</li></ul><p><strong>Critical risks</strong></p><ul><li><strong>Cybersecurity:</strong> The ECB and ESRB warn that frontier models could exploit IT weaknesses in minutes.</li><li><strong>Infrastructure backlash:</strong> Local protests are halting data center projects, such as Blackstone’s Virginia campus.</li><li><strong>Geopolitical leaks:</strong> Anthropic is struggling to block Chinese users from accessing Claude via technical loopholes.</li></ul><p><strong>The regulatory divide</strong></p><ul><li><strong>US approach:</strong> Outgoing advisers indicate Trump will oppose centralized AI regulation to maintain a competitive edge.</li><li><strong>UK approach:</strong> London is pushing for \"AI sovereignty\" to avoid becoming a mere US outpost.</li><li><strong>Retail finance:</strong> The FCA warns of an \"arms race\" as millions use AI for personal finance, demanding more oversight.</li></ul><p><strong>What's next:</strong> Expect a \"reset\" in market returns as investors stop rewarding AI mentions and start demanding proven margins and sustainable energy solutions for data centers.</p>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition that is destabilizing global trade and security.</p><p><strong>Why it matters:</strong> Escalating military posturing and trade protectionism create a \"might is right\" world order. This volatility threatens global economic stability and weakens traditional alliances.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military:</strong> China is testing ballistic missiles in nuclear-free zones, increasing tensions with Pacific allies.</li><li>  <strong>Trade:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and risk a global downturn.</li><li>  <strong>Resources:</strong> Beijing is tightening control over critical minerals, using rare earth smuggling detentions to pressure Japan.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>U.S. Instability:</strong> Internal political volatility and debates over hegemony make Washington an unpredictable partner for NATO and G7 allies.</li><li>  <strong>China's Strategy:</strong> Beijing is positioning itself as a \"pillar of stability\" to attract foreign officials while leveraging a one-sided partnership with a weakened Russia.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance Shifts:</strong> Middle powers (Japan, EU) are prioritizing \"resilience\" and new capabilities to hedge against both superpowers.</li><li>  <strong>Security Gaps:</strong> NATO allies are demanding clarity on U.S. troop levels to prevent a deterrence gap against Russia.</li></ul>", "us elections": "<p>Internal party fractures and economic discontent are reshaping the US midterm landscape.</p><p><strong>Why it matters:</strong> Ideological splits within the Democratic Party and voter frustration over inflation are creating volatility in key swing states.</p><p><strong>The Democratic Divide</strong></p><ul><li><strong>Progressive surge:</strong> Socialist victories in Colorado and New York signal a growing rebellion against party establishment.</li><li><strong>Candidate volatility:</strong> Sexual assault allegations against Maine's Graham Platner create legal and electoral instability.</li><li><strong>Internal friction:</strong> The First Lady's memoir is reviving party tensions during a critical rebuilding phase.</li></ul><p><strong>The Republican Risk</strong></p><ul><li><strong>MAGA purity:</strong> Trump’s endorsement of Ken Paxton in Texas secures the base but may alienate moderate general election voters.</li><li><strong>Base erosion:</strong> Evangelicals are questioning Trump's alignment with Christian values.</li><li><strong>Economic backlash:</strong> Maine lobster fishermen are pivoting away from Trump due to tariffs and fuel costs.</li></ul><p><strong>Key Pressure Points</strong></p><ul><li><strong>Inflation:</strong> FT polling shows voters increasingly blame Trump for high grocery prices and the cost of living.</li><li><strong>Foreign Policy:</strong> The House and Senate are moving to rein in Trump's war powers regarding Iran.</li><li><strong>Corporate Influence:</strong> Silicon Valley billionaires successfully targeted pro-regulation candidates in House primaries.</li></ul><p><strong>What's next:</strong> California's primary results will serve as a primary gauge for the national appetite for MAGA-style politics heading into November.</p>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to address security gaps and stagnant growth, risking internal political instability and friction with EU partners.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Germany will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> Berlin is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> France fears Germany is \"going it alone\" after Berlin ditched a joint fighter jet project to seek more control.</li><li><strong>Failures:</strong> Cost overruns led to the cancellation of the F126 frigate, the largest warship planned since WWII.</li></ul><p><strong>Economic shifts</strong></p><ul><li><strong>Growth:</strong> Merz introduced €10bn in tax cuts and is pushing for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Deregulation:</strong> The coalition agreed to longer Sunday opening hours and stricter sick-leave rules.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political volatility</strong></p><ul><li><strong>Far-right surge:</strong> The AfD leads opinion polls, fueled by anger over fuel prices and ties to Kremlin associates.</li><li><strong>Internal threats:</strong> Merz faces \"chancellor swap\" rumors as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism linked to Middle East tensions.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission and the outcome of the KNDS IPO.</p>", "central banks": "<p>Central banks are shifting toward a fragmented, high-volatility era as new leadership and geopolitical shocks disrupt traditional policy.</p><p><strong>Why it matters:</strong> Divergent national strategies and opaque communication are increasing market instability. This creates a \"guessing game\" for investors, raising the risk of sudden rate shocks.</p><p><strong>The Fed transition</strong> New Chair Kevin Warsh is overhaulilng how the Federal Reserve communicates with markets.</p><ul><li><strong>The shift:</strong> Moving away from traditional \"forward guidance\" toward a more fundamental, less predictable approach.</li><li><strong>The risk:</strong> Markets are reporting increased volatility as traders struggle to decode \"Fedspeak.\"</li><li><strong>The priority:</strong> Warsh is emphasizing AI-driven productivity and maintaining independence from White House pressure.</li></ul><p><strong>Global divergence</strong> Central banks are no longer moving in lockstep.</p><ul><li><strong>New Zealand:</strong> Raising rates for the first time in three years to combat persistent inflation.</li><li><strong>Eurozone:</strong> ECB President Christine Lagarde signals a \"modest\" approach to rate hikes compared to 2022.</li><li><strong>Japan:</strong> Authorities are using opaque tactics to defend the yen after a 40-year low.</li></ul><p><strong>Systemic threats</strong> Regulators are pivoting to address non-inflationary risks.</p><ul><li><strong>AI Volatility:</strong> The Bank of England is considering \"kill switches\" for AI-powered trading to prevent market herding.</li><li><strong>Leverage:</strong> The BoE is limiting hedge fund leverage to stabilize the gilt market.</li><li><strong>QT Stress:</strong> Geopolitical crises (e.g., Iran) are complicating Quantitative Tightening programs.</li></ul><p><strong>What's next:</strong> Watch for a clash between the U.S. executive branch and the Fed over governor appointments, as the Supreme Court continues to define the limits of presidential power over central bank independence.</p>", "us banks": "<p>US banks are leveraging deregulation and international expansion to drive growth while facing internal leadership volatility.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing lenders to aggressively pursue acquisitions and global market share.</p><p><strong>The JPMorgan shuffle</strong> CEO Jamie Dimon is radically restructuring his succession pipeline.</p><ul><li><strong>The purge:</strong> Longtime contender Marianne Lake was abruptly removed from the CEO race.</li><li><strong>The new guard:</strong> Doug Petno and Troy Rohrbaugh now lead the bank's largest divisions.</li><li><strong>The war chest:</strong> Dimon indicates the bank could spend $20B on new acquisitions due to regulatory easing.</li></ul><p><strong>Global strategy</strong> Wall Street is pivoting toward high-growth regions and digital scale.</p><ul><li><strong>China boom:</strong> Goldman Sachs, Morgan Stanley, and JPMorgan reported record profits in China.</li><li><strong>European push:</strong> JPMorgan is expanding its digital retail bank into France, Spain, and Italy.</li><li><strong>Security risks:</strong> Morgan Stanley is issuing China-only iPhones to Hong Kong staff to mitigate data security threats.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital handed back to US and UK banks via deregulation.</li><li><strong>$700 billion:</strong> Potential losses for US banks in a severe economic crash, per Fed stress tests.</li><li><strong>$114 billion:</strong> Revenue for non-bank trading firms (e.g., Citadel, Jane Street) eating into traditional bank margins.</li></ul><p><strong>Between the lines</strong> A tension exists between short-term profit and long-term stability. While banks are lobbying to further ease Basel capital rules, critics warn that \"checklist\" deregulation is weakening systemic resilience.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>08 Jul 2026 12:02 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
