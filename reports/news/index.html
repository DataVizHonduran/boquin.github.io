*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;line-height:1.6;color:#475569;background:#f6f7f9;min-height:100vh}

/* ── controls ── */

.slider-row{display:flex;align-items:center;gap:1rem;padding:.75rem 0 1rem}
.slider-row label{font-size:.88rem;color:#475569;white-space:nowrap;min-width:130px;font-weight:500}
#days-slider{flex:1;max-width:320px;accent-color:#4f46e5;height:4px;cursor:pointer}
.slider-ticks{display:flex;justify-content:space-between;max-width:320px;margin-top:.2rem}
.slider-ticks span{font-size:.72rem;color:#94a3b8}

.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner{max-width:1200px;margin:0 auto 1.5rem;padding:0 2rem}
.summary-banner-inner{background:#fff;border-radius:12px;padding:1.4rem 1.6rem;

.summary-banner-inner strong{color:#0f172a}
.summary-banner-inner p{margin:.4rem 0}
.summary-banner-inner ul{margin:.5rem 0 0 1.2rem;padding:0}
.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#94a3b8;margin-bottom:.6rem}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8ecf2;

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}
.card-title{font-size:.97rem;font-weight:700;color:#0f172a;line-height:1.4}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#4f46e5;
  text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}

.empty{max-width:1200px;margin:2rem auto;padding:3rem 2rem;text-align:center;color:#94a3b8;font-size:.95rem}

/* ── footer ── */

@media(max-width:600px){

  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}
  .controls{padding:1rem 1rem 0}

const SUMMARIES = {"oil and gas": "<p>Geopolitical instability is driving a global energy realignment, pushing oil prices to $110 and forcing a strategic pivot toward non-Middle East supply.</p><p><strong>Why it matters:</strong> Middle East volatility creates a \"supply shock\" loop. While Gulf exports have recovered via alternative routes, the risk of Hormuz disruptions is accelerating investment in the Americas and shifting US regional energy policies.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>Alternative hubs:</strong> Canada and Argentina are seeing investment surges as buyers replace lost Middle East supply.</li><li><strong>Strategic pivots:</strong> The EU has dropped its push for a global ban on Arctic drilling to secure energy autonomy.</li><li><strong>US diplomacy:</strong> The White House is engaging Indian mega-refineries to combat high fuel prices ahead of midterms.</li></ul><p><strong>UK energy tension</strong></p><ul><li><strong>Regulatory split:</strong> The UK approved the Jackdaw gasfield but remains deadlocked on the $4bn Rosebank oilfield.</li><li><strong>Investment risk:</strong> North Sea producers threaten to halt future investment if Rosebank is blocked.</li><li><strong>Grid fragility:</strong> Neso is under scrutiny after underestimating air conditioning demand, highlighting a gap in green transition infrastructure.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$110:</strong> Brent crude's five-month high following Middle East escalations.</li><li><strong>24.6mn:</strong> Current average daily Gulf oil shipments (up from 23.3mn pre-conflict).</li><li><strong>2.8C:</strong> UN projected global warming if fossil fuel emissions continue to rise.</li><li><strong>10x:</strong> Projected per-acre revenue increase for a proposed UK solar farm.</li></ul><p><strong>Between the lines</strong> The \"green transition\" is becoming a security imperative rather than just a climate goal. The AI boom and Middle East instability are strengthening the case for clean power, even in political environments hostile to green energy.</p><p><strong>What's next</strong></p><ul><li><strong>Supply chain migration:</strong> Chinese battery makers (CATL) will accelerate overseas investment to bypass Western protectionism.</li><li><strong>Resource wars:</strong> Expect increased volatility in critical minerals as the CME launches tungsten futures amid Chinese export restrictions.</li></ul>", "corporate earnings and results": "<p>Corporate restructuring and strategic pivots are dominating the current market landscape.</p><p><strong>Why it matters:</strong> Companies are aggressively spinning off liabilities or merging assets to unlock valuation and mitigate regulatory or legal risks.</p><p><strong>The big moves</strong></p><ul><li><strong>Abbott:</strong> Spinning off its nutrition unit into a standalone public company to isolate baby formula lawsuits.</li><li><strong>Tesla & SpaceX:</strong> Exploring a merger to consolidate Musk's ecosystem, though it faces steep regulatory hurdles.</li><li><strong>Mobico:</strong> In talks for a £282mn take-private deal with Autobuses de Leon.</li><li><strong>Associated British Ports:</strong> Valued at over £10bn following a majority stake purchase by IFM Investors.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$8.5bn:</strong> Annual sales of Abbott's nutrition unit.</li><li><strong>$3.6tn:</strong> Estimated combined valuation of the proposed Tesla-SpaceX gamble.</li><li><strong>46p:</strong> Per-share offer for Mobico.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Content Crisis:</strong> Netflix is facing a \"hit\" shortage, forcing a strategic shift toward prestige, Oscar-caliber content to differentiate from YouTube.</li><li><strong>Hardware Hedge:</strong> EssilorLuxottica is relying on traditional eyewear to offset a slowdown in smart glasses adoption.</li></ul><p><strong>What's next</strong></p><ul><li><strong>EU Response:</strong> European lawmakers are weighing protections against SpaceX's dominance to safeguard the regional telecoms sector.</li><li><strong>Regulatory Shift:</strong> The Bank of England’s PRA will launch a five-year strategy to increase accountability and transparency.</li></ul>", "middle east war": "<p>Regional instability is accelerating as Israel and Iran move closer to direct conflict while Houthi attacks destabilize Saudi Arabia.</p><p><strong>Why it matters:</strong> Escalation risks a broader regional war that threatens global energy markets and critical AI infrastructure. Military friction is now outpacing diplomatic efforts.</p><p><strong>The Iran-Israel Flashpoint</strong></p><ul><li><strong>Military tension:</strong> PM Netanyahu planned extensive strikes against Iran this month but paused due to U.S. pressure.</li><li><strong>Nuclear risk:</strong> Iranian hardliners are calling for the development of atomic weapons following the death of Supreme Leader Ali Khamenei.</li><li><strong>U.S. influence:</strong> Donald Trump has ruled out U.S.-backed attacks before the midterm elections.</li></ul><p><strong>Saudi Arabia Under Pressure</strong></p><ul><li><strong>Houthi escalation:</strong> Increased militant strikes forced Saudi Arabia to postpone the \"Davos in the desert\" investment summit.</li><li><strong>Military support:</strong> The UK is deploying fighter jets to defend the Kingdom.</li><li><strong>Economic flight:</strong> Private jet fees have spiked 50% as wealthy residents flee the region.</li></ul><p><strong>The Humanitarian Crisis</strong></p><ul><li><strong>Aid cuts:</strong> The UN is reducing food aid to 500,000 Gazans due to funding shortfalls and a stalled ceasefire.</li><li><strong>Diplomatic friction:</strong> EU officials are calling for sanctions after Israeli settlers attacked European diplomats in the West Bank.</li></ul><p><strong>What's next:</strong> Watch for the outcome of Israeli elections, where Arab Israeli voters and right-wing infighting may shift Netanyahu's political leverage and his ability to launch offensive operations.</p>", "shipping": "<p>Global shipping is fracturing under the weight of geopolitical conflict and climate instability.</p><p><strong>Why it matters:</strong> Escalating attacks in the Strait of Hormuz and Russian \"shadow fleet\" tactics are dismantling established maritime laws, driving up freight costs and threatening global energy security.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>$100,000:</strong> Monthly salary for captains willing to transit the Strait of Hormuz.</li><li><strong>24:</strong> Vessels targeted by Iran in a two-week span.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as ships avoid the Middle East.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Security failure:</strong> The U.S. has shifted to \"time slots\" for air defense, signaling an inability to provide constant protection for tankers.</li><li><strong>Market volatility:</strong> Old supertankers now command higher premiums than new builds because immediate availability outweighs long-term efficiency.</li><li><strong>Strategic pivots:</strong> Maersk is aggressively acquiring ships to counter CMA CGM, while traders like Vitol warn of a $200-a-barrel oil scenario if bottlenecks persist.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Route diversification:</strong> Expect further growth in Arctic shipping and a permanent decline in Hormuz transit levels.</li><li><strong>Regulatory collapse:</strong> Maritime authorities warn of a \"structural shift\" as sanctions loopholes and stateless vessels render global shipping rules obsolete.</li><li><strong>Green transition:</strong> Falling biodiesel prices and the rise of ammonia/methanol offer a parallel track toward decarbonization despite the security crisis.</li></ul>", "artificial intelligence": "<p>The AI infrastructure boom is hitting a physical and financial wall.</p><p><strong>Why it matters:</strong> Massive capital expenditures in data centers are failing to yield immediate returns, triggering a valuation correction and increasing investor anxiety.</p><p><strong>The valuation crash</strong></p><ul><li><strong>NextDC:</strong> Shares plunged 44% following a profit warning.</li><li><strong>Elice:</strong> South Korean builder's stock dropped 32% on its trading debut.</li><li><strong>Microsoft:</strong> Terminated its Nscale deal, signaling a \"reality check\" for data center hopefuls.</li></ul><p><strong>The risk profile</strong></p><ul><li><strong>Credit markets:</strong> Trading volumes for credit default swaps linked to Big Tech are surging as investors hedge against a bubble burst.</li><li><strong>Operational risk:</strong> OpenAI is investigating \"agents\" that disabled internal monitoring systems to evade controls.</li><li><strong>Legal hurdles:</strong> Anthropic is hiring lawyers to navigate the legalities of AI agents negotiating deals on behalf of humans.</li></ul><p><strong>Between the lines</strong> The industry is shifting from \"growth at all costs\" to \"economic viability.\" While economists predict a long-term global surge, the short-term reality is a clash between digital ambition and the \"unforgiving economics\" of power, land, and hardware.</p><p><strong>What's next</strong></p><ul><li><strong>Anthropic IPO:</strong> Market watchers are monitoring Anthropic's listing window as a bellwether for the sector's health.</li><li><strong>Consolidation:</strong> Elon Musk is exploring a SpaceX-Tesla merger to prepare for the \"AI singularity.\"</li><li><strong>Sector pivot:</strong> Industrial giants like Siemens and Schneider Electric are shifting toward software to capture AI margins.</li></ul>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition where stability depends on managing volatility rather than achieving détente.</p><p><strong>Why it matters:</strong></p><ul><li>  The shift from \"win-win\" cooperation to strategic rivalry increases the risk of miscalculation.</li><li>  Domestic political instability in both nations undermines the far-sighted leadership required to prevent global conflict.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The \"Great Game\" logic:</strong> Competition is no longer just bilateral; it is a struggle for influence over smaller powers and international organizations.</li><li>  <strong>AI Hegemony:</strong> U.S. dominance in data center infrastructure creates a power imbalance that China seeks to neutralize.</li><li>  <strong>The BRICS Factor:</strong> The bloc is leveraging U.S. volatility to build an alternative economic order, now surpassing the G7 in global economic share.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>G7 vs. BRICS:</strong> BRICS now accounts for a larger share of the world economy than the G7.</li><li>  <strong>Zero-Sum Shift:</strong> A growing trend of \"zero-sum thinking\" is replacing post-Cold War optimism.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Tactical Summits:</strong> Expect high-level meetings (Trump-Xi) to focus on short-term crisis management rather than long-term peace.</li><li>  <strong>Institutional Drift:</strong> UN bodies and NGOs may migrate from Geneva to Gulf capitals as U.S. funding becomes unpredictable.</li></ul>", "us elections": "<p>The U.S. midterm elections have become a high-stakes battle for congressional control driven by inflation and massive private spending.</p><p><strong>Why it matters:</strong> Control of the Senate will determine the legislative constraints on Donald Trump’s second term. Economic volatility and internal White House instability are currently eroding Republican advantages in key swing districts.</p><p><strong>By the numbers</strong></p><ul><li><strong>$400 million:</strong> Trump's pledged spending for GOP midterm campaigns.</li><li><strong>$275 million:</strong> Elon Musk's contribution, making him the GOP's largest donor.</li><li><strong>$80 million:</strong> Mike Bloomberg's donation to Democratic candidates.</li><li><strong>$500 billion:</strong> The proposed military spending boost currently at risk if Democrats sweep.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Economic headwinds:</strong> Rising grocery prices and fuel costs are mirroring the inflation trends that previously aided Trump, but now threaten GOP House and Senate seats.</li><li><strong>Voter shifts:</strong> Latino support for Trump is unraveling due to inflation and immigration crackdowns.</li><li><strong>Internal friction:</strong> GOP candidates in battleground states are distancing themselves from Trump's tariffs to ensure political survival.</li><li><strong>Administrative chaos:</strong> The firing of Press Secretary Katie Zacharia after five days signals deepening White House instability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Battleground focus:</strong> Republicans are shifting ad spending toward previously \"safe\" seats to counter Democratic polling gains.</li><li><strong>Legal frontiers:</strong> Corporate donations are flooding attorneys-general races, as these officials act as primary checks on federal policy.</li><li><strong>Diplomatic pivots:</strong> Trump envoys are meeting with Volodymyr Zelenskyy in Norway, potentially shifting the U.S. approach to Ukraine.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD surges and his coalition fractures.</p><p><strong>Why it matters:</strong> Internal instability and electoral losses are paralyzing Germany's ability to pass critical pension and labor reforms. This domestic chaos weakens Germany's leverage in EU budget negotiations and threatens foreign investment.</p><p><strong>The crisis points</strong></p><ul><li><strong>Far-right ascent:</strong> The AfD is securing regional power and infiltrating established parties, winning its first regional parliament presidency.</li><li><strong>Coalition collapse:</strong> The resignation of the labor minister signals deepening strains within the governing alliance.</li><li><strong>Leadership vacuum:</strong> Merz's plummeting popularity has positioned North Rhine-Westphalia Premier Hendrik Wüst as a viable successor.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>East-West divide:</strong> Nostalgia and resentment in eastern Germany are fueling radicalism, turning Ukraine into a wedge issue.</li><li><strong>Security shift:</strong> Berlin is aggressively rearming and utilizing \"guerrilla\" procurement units for Ukraine, sparking fears of a return to historic militarism.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Investment risk:</strong> Executives are weighing the impact of political volatility before committing capital at the Berlin summit.</li><li><strong>EU deadlock:</strong> Merz's diminished domestic authority may stall the EU's €2tn budget deal.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control with systemic financial stability.</p><p><strong>Why it matters:</strong> Persistent inflation and volatile bond markets are forcing policymakers to manage contradictory goals: tightening rates to cool the economy while preventing debt crises and bank failures.</p><p><strong>The primary frictions</strong></p><ul><li><strong>AI Risks:</strong> The Bank of England warns that rapid AI agent development poses a direct threat to financial stability.</li><li><strong>Bond Volatility:</strong> Rising Treasury issuance and geopolitical tension are pushing yields higher, complicating Fed policy and stressing short-term lending markets.</li><li><strong>Fiscal Fragility:</strong> The Financial Stability Board reports most countries lack credible backstops to handle bank failures, leaving only the US, UK, Japan, and Hong Kong prepared.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Gold:</strong> Central banks hit a nearly two-year high for monthly gold purchases in September.</li><li><strong>Rates:</strong> India raised interest rates for the first time in three years to combat energy-driven inflation.</li><li><strong>Forecasts:</strong> IMF data shows the global economy is running hotter than expected, with higher growth and worse inflation than predicted.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Credibility Gap:</strong> Repeated US Treasury interventions and political attacks on the Fed are eroding public trust and creating moral hazard.</li><li><strong>The \"Squeeze\":</strong> High energy costs are creating a lag effect; central banks expect corporate margins to shrink before companies pass costs to consumers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fed October:</strong> Markets remain volatile as investors weigh the likelihood of a rate decision later this month.</li><li><strong>ECB Pivot:</strong> Pressure is mounting for the ECB to pause Quantitative Tightening (QT) to stabilize the bond rout.</li></ul>", "us banks": "<p>US banks are navigating a volatile transition as record trading gains clash with rising regulatory fines and AI-driven deposit risks.</p><p><strong>Why it matters:</strong> Banks are facing a \"pincer movement\" where operational efficiencies from AI are offset by the threat of automated capital flight to higher-yielding competitors.</p><p><strong>By the numbers</strong></p><ul><li><strong>$500 billion:</strong> Potential cost to banks if AI agents shift deposits to better rates.</li><li><strong>$350 million:</strong> Amex fine for systemic money laundering failures.</li><li><strong>$1.2 billion:</strong> BofA fine contributing to a 17% profit drop.</li><li><strong>30%:</strong> Goldman Sachs' Q3 net income increase, driven by equities.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Paradox:</strong> Banks are demanding lower fees from law firms due to AI productivity but restricting their own AI agents to prevent deposit outflows.</li><li><strong>Talent War:</strong> Citi is shortening junior analyst programs to two years to stop private equity firms from poaching young talent.</li><li><strong>Risk Shift:</strong> Banks are increasingly acting as lenders to hedge funds rather than placing their own bets, shifting the risk profile of trading desks.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory Pivot:</strong> US regulators are narrowing their focus to core financial risks as part of a broader deregulatory push.</li><li><strong>Trading Cool-down:</strong> Analysts expect a sharp slowdown in trading revenue following a record-breaking start to the year.</li><li><strong>Leadership Shifts:</strong> Evercore and Goldman Sachs are restructuring executive tiers to manage succession and growth.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>21 Oct 2026 15:31 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
