><strong>The flashpoints</strong></p><ul><li><strong>Yemen/Saudi Arabia:</strong> Houthi rebels captured the port of Mocha and launched their largest strikes on Saudi energy facilities in years.</li><li><strong>Maritime Security:</strong> The U.S. Navy is conducting covert de-mining in the Strait of Hormuz following U.S. strikes on Iranian oil tankers.</li><li><strong>Israel/West Bank:</strong> The UK, France, and Canada have banned trade with Israeli settlements, citing \"ethnic cleansing\" in the West Bank.</li><li><strong>Lebanon:</strong> Israeli strikes on government buildings and hospitals have pushed Lebanon toward a \"dangerous escalation.\"</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal Israeli Shift:</strong> Religious ultranationalists are actively restructuring the IDF to replace traditional secular leadership.</li><li><strong>Iranian Pivot:</strong> Tehran is relaxing currency controls and leveraging cryptocurrency to bypass sanctions and stabilize its economy.</li><li><strong>U.S. Friction:</strong> Trade bans by the UK have provoked a rebuke from Washington, signaling a rift in Western strategy toward the Israeli government.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Economic fallout:</strong> Increased shipments of heavy machinery to the region suggest a long-term shift toward infrastructure repair and militarization.</li><li><strong>Political risk:</strong> Pro-Israel groups are aggressively lobbying in the U.S. to prevent a shift in foreign policy during the upcoming midterms.</li></ul>", "shipping": "<p>Global shipping is undergoing a structural collapse as geopolitical conflict and climate change dismantle traditional trade routes.</p><p><strong>Why it matters:</strong> The convergence of war in the Middle East and drought in Panama is forcing a permanent shift in how goods move. This volatility is driving up freight rates while creating dangerous \"shadow fleets\" that operate outside international law.</p><p><strong>The Chokepoint Crisis</strong></p><ul><li><strong>Strait of Hormuz:</strong> US-Iran tensions and direct strikes on supertankers have turned the Gulf into a high-risk zone, threatening Dubai's Jebel Ali port.</li><li><strong>Panama Canal:</strong> El Niño-driven water shortages are forcing transit cuts and record-high fees.</li><li><strong>Black Sea:</strong> Ukrainian grain exports remain choked, triggering global food price surges.</li></ul><p><strong>Strategic Pivots</strong></p><ul><li><strong>The Arctic Race:</strong> China and South Korea are investing in \"Ice Silk Road\" routes to bypass traditional chokepoints and reduce voyage times.</li><li><strong>Nuclear Power:</strong> The US is partnering with Core Power to launch nuclear-powered merchant ships by 2028 to counter Chinese shipbuilding dominance.</li><li><strong>Green Tech:</strong> Maersk is integrating wind sails to lower long-term fuel dependency.</li></ul><p><strong>The Bottom Line</strong></p><ul><li><strong>Market Paradox:</strong> While risks rise, shipping companies are seeing a \"temporary reprieve\" as bottlenecks push freight rates and profits higher.</li><li><strong>Investor Shift:</strong> Institutional investors are pivoting to shipping as a \"hard asset\" hedge against Middle East instability.</li></ul><p><strong>What's next:</strong> Watch for the viability of Arctic routes. While China is pushing for scheduled services, analysts warn these remain niche commercial activities for the foreseeable future.</p>", "artificial intelligence": "<p>AI is triggering a volatile collision between explosive economic potential and systemic societal risk.</p><p><strong>Why it matters:</strong> The race for AGI is creating a paradox where massive capital inflows drive productivity while simultaneously eroding foundational human skills and safety guardrails.</p><p><strong>The Economic Engine</strong></p><ul><li><strong>Capital surge:</strong> Mistral raised €3bn to challenge US/China dominance; Anthropic prepares for a $2tn IPO.</li><li><strong>Infrastructure demand:</strong> Nvidia partners report \"insatiable\" computing demand, signaling a fundamental shift in cloud infrastructure.</li><li><strong>Financial risk:</strong> High US long-term interest rates (above 5%) could derail the current AI investment boom.</li></ul><p><strong>The Human Cost</strong></p><ul><li><strong>Education crisis:</strong> PISA results and reading scores are plummeting as \"digital distraction\" and AI shortcuts stunt intellectual growth.</li><li><strong>Workplace friction:</strong> Professional boundaries are blurring, causing \"mass toe-treading\" and damaging collaborative cultures.</li><li><strong>Skill shift:</strong> While law schools ban AI to protect thinking, firms like UBS now mandate AI proficiency for new hires.</li></ul><p><strong>The Safety Gap</strong></p><ul><li><strong>Internal revolt:</strong> High-profile departures from Anthropic signal mounting unease over \"gambling\" with human safety.</li><li><strong>Existential warnings:</strong> Top OpenAI board members warn that advanced AI could be \"deadly\" without stronger safety features.</li><li><strong>Geopolitical tension:</strong> Anthropic's decision to withhold models from UK testers suggests a shift toward corporate protectionism.</li></ul><p><strong>What's next:</strong> Watch for the Anthropic IPO filing next week, which will serve as a primary valuation benchmark for the entire AI sector.</p>", "us-china relations": "<p>The U.S.-China relationship has shifted from mutual economic gain to a zero-sum geopolitical struggle.</p><p><strong>Why it matters:</strong> This transition destabilizes global trade and security architectures. When the world's two largest economies view growth as a win-loss scenario, diplomatic cooperation on climate and security collapses.</p><p><strong>The friction points</strong></p><ul><li><strong>Security reliability:</strong> U.S. volatility regarding defense guarantees in South Korea and Japan creates a power vacuum in the Asia-Pacific.</li><li><strong>Trade weaponization:</strong> The shift toward transactional diplomacy encourages the use of sanctions and tariffs as primary tools of statecraft.</li><li><strong>Infrastructure rivalry:</strong> China's Belt and Road Initiative continues to challenge U.S.-backed alternatives, such as India's IMEC corridor.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Trust deficit:</strong> Global suspicion of U.S. leadership is rising, leaving an opening for Beijing to position itself as a stable alternative.</li><li><strong>AI hegemony:</strong> U.S. dominance in AI hardware consolidates power, even as data centers proliferate globally.</li><li><strong>Internal divide:</strong> A gap is widening between U.S. congressional hawks and a more cooperative outlook held by Gen Z and the executive branch.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Bloc formation:</strong> Overlapping conflicts in Ukraine and the Middle East are pushing the world toward two rival geopolitical blocs.</li><li><strong>Transactionalism:</strong> Expect a rise in \"every man for himself\" diplomacy, where authoritarian regimes gain ground as U.S. commitment to liberal democracy wavers.</li></ul>", "us elections": "<p>President Trump is centering himself in the midterm elections despite plummeting approval ratings and economic volatility.</p><p><strong>Why it matters:</strong> Trump's personal popularity has become a liability for GOP candidates in swing districts. Economic anxiety and inflammatory rhetoric are driving voters toward Democrats and progressive insurgents.</p><p><strong>The economic drag</strong></p><ul><li><strong>Inflation:</strong> Soaring diesel prices and grain costs, fueled by conflict with Iran, are squeezing the GOP's rural base.</li><li><strong>Affordability:</strong> FT polling shows most voters feel worse off financially under Trump.</li><li><strong>Trade:</strong> Ranchers view proposed beef import tax cuts as a betrayal of domestic producers.</li></ul><p><strong>The GOP strategy</strong></p><ul><li><strong>Financials:</strong> Trump is under party pressure to deploy Maga Inc.’s $400 million war chest to prevent congressional losses.</li><li><strong>Incentives:</strong> Trump has promised a $5,000 \"dividend\" to voters if Republicans win.</li><li><strong>Legal:</strong> The Supreme Court has cleared the way for Trump to restrict mail-in ballot eligibility.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Internal Rift:</strong> Republican candidates fear Trump has become \"toxic,\" while loyalists like Lindsey Graham's sister continue to win primaries.</li><li><strong>Leftward Shift:</strong> Democratic socialist candidates are gaining ground as voters reject traditional capitalism.</li><li><strong>Swing State Friction:</strong> Opposition to data center expansion is creating new, unpredictable voting blocs in states like Pennsylvania.</li></ul><p><strong>What's next</strong> Watch the deployment of Super PAC funds and the impact of mail-in voting restrictions on turnout in key battleground states.</p>", "german politics": "<p>The far-right Alternative for Germany (AfD) has seized first place in Saxony-Anhalt, signaling a collapse of the political center in eastern Germany.</p><p><strong>Why it matters:</strong> The AfD's surge threatens the stability of the CDU-led center-right and creates a volatile power vacuum. This shift emboldens foreign adversaries and complicates Germany's internal security.</p><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for upcoming federal polls.</li><li><strong>3 seats:</strong> The margin preventing the AfD from leading the regional government.</li><li><strong>€3.75 trillion:</strong> The private capital Berlin aims to attract by 2040, now threatened by political instability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Center crumbling:</strong> Chancellor Merz is increasingly viewed as a liability, with his own party distancing itself to stem the AfD's rise.</li><li><strong>Unlikely alliances:</strong> The hard-left BSW party has emerged as a potential kingmaker, complicating coalition math.</li><li><strong>External influence:</strong> The Kremlin is actively amplifying AfD narratives through hybrid warfare and \"Matryoshka\" influence campaigns.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal battles:</strong> Senior officials are pushing the top court to ban the AfD's most radical factions.</li><li><strong>Economic risk:</strong> Investors may shy away as political volatility grows and the government struggles to curb drug prices and infrastructure bottlenecks.</li><li><strong>Federal fallout:</strong> The Saxony-Anhalt result serves as a blueprint for the AfD's strategy in the next national election.</li></ul>", "central banks": "<p>Central banks are aggressively raising interest rates to combat persistent inflation despite growing fiscal and political headwinds.</p><p><strong>Why it matters:</strong> High borrowing costs are necessary to curb price pressures, but rising public debt and populist rhetoric threaten the independence and efficacy of monetary policy.</p><p><strong>The global landscape</strong></p><ul><li><strong>Eurozone:</strong> The ECB is raising rates (currently 2.5%) and forecasting higher growth, though energy prices keep inflation risks skewed to the upside.</li><li><strong>United States:</strong> Strong payroll data is fueling \"hawkish\" arguments for further Fed rate hikes, though some officials signal a potential hold.</li><li><strong>Japan:</strong> Pressure is mounting for the BoJ to abandon low rates due to currency volatility and bond market instability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Fiscal Drag:</strong> High public deficits are undermining the ability of central banks to control inflation, as government spending offsets rate hikes.</li><li><strong>Political Risk:</strong> The Bank of England warns that populist attacks on \"unrepresentative elites\" jeopardize central bank autonomy.</li><li><strong>Geopolitical Shifts:</strong> The Dutch central bank is moving gold reserves from New York to London, citing geopolitical unrest and liquidity.</li></ul><p><strong>What's next</strong></p><ul><li><strong>September Meetings:</strong> Markets are focused on the ECB and Fed to determine if inflation data justifies further tightening.</li><li><strong>Leadership Shifts:</strong> Focus is shifting toward the Fed's \"reaction function\" and whether new leadership will pivot the bank's strategic approach.</li></ul>", "us banks": "<p>US banks are aggressively pivoting toward AI infrastructure and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is shifting from traditional lending to high-stakes AI financing and wealth management to sustain record profits as traditional margins face pressure.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley and others are architecting the debt structures for AI data centers.</li><li><strong>Offloading risk:</strong> Banks are selling $15bn in debt for Anthropic (backed by Google) to free up lending capacity.</li><li><strong>Revenue:</strong> AI-driven semiconductor investments are fueling record equities growth in Asia.</li><li><strong>Cost cutting:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, citing AI-driven efficiency.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> Trump administration regulators are narrowing enforcement to focus strictly on financial risks.</li><li><strong>Crypto:</strong> A Trump family crypto venture received a banking license, sparking political debate.</li><li><strong>Stress tests:</strong> Critics are calling for the end of bank stress tests, arguing they mislead the public.</li></ul><p><strong>Strategic moves</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn.</li><li><strong>Wealth Management:</strong> Morgan Stanley is seeing a surge in assets (including a $74bn Q2 haul) driven by SpaceX and AI millionaires.</li><li><strong>Tech adoption:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with digital assets.</li></ul><p><strong>The friction points</strong></p><ul><li><strong>Competition:</strong> JPMorgan restricted lending to Jane Street as the trading firm entered the US Treasury market.</li><li><strong>Compliance:</strong> JPMorgan \"debanked\" Polymarket over regulatory concerns despite the platform's $20bn valuation goal.</li><li><strong>Global edge:</strong> UK lenders claim US banks hold a competitive advantage due to lower capital requirements.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>10 Sep 2026 14:36 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
