const SUMMARIES = {"oil and gas": "<p>Geopolitical instability in the Middle East is colliding with shifting global demand to create extreme volatility in oil markets.</p><p><strong>Why it matters:</strong> The conflict involving Iran has depleted U.S. inventories to 20-year lows and threatened the Strait of Hormuz, the world's most critical oil chokepoint.</p><p><strong>The tension:</strong></p><ul><li><strong>Supply risk:</strong> Gulf states and ADNOC are fast-tracking pipelines to bypass Hormuz to avoid total export paralysis.</li><li><strong>Demand hedge:</strong> Falling Chinese imports are currently acting as a price ceiling, keeping crude below $100 a barrel.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$4.1bn:</strong> Trafigura's net profit for Oct-March, more than doubling as volatility spikes.</li><li><strong>2004:</strong> The last time U.S. oil stocks were this low.</li><li><strong>87%:</strong> The emissions cut by 2040 proposed by UK Energy Secretary Ed Miliband.</li></ul><p><strong>Between the lines:</strong> The \"Energy Transition\" is facing a dual crisis of execution and politics.</p><ul><li><strong>Execution:</strong> Botched heat pump installations in the UK are eroding consumer confidence in green tech.</li><li><strong>Politics:</strong> Seven U.S. states are suing the government over a $1bn payment to push TotalEnergies out of wind and back into fossil fuels.</li></ul><p><strong>What's next:</strong> A critical minerals arms race.</p><ul><li><strong>Lithium:</strong> EnergyX (Texas) and Atana Elements (Europe) are racing to break China's supply chain dominance.</li><li><strong>Nuclear:</strong> The U.S. is investing billions in New Mexico to replace Russian uranium imports.</li></ul>", "corporate earnings and results": "<p>Corporate earnings and valuations are diverging as AI hype hits a reality check and private credit liquidity tightens.</p><p><strong>Why it matters:</strong> Market volatility is shifting from broad indices to specific sector vulnerabilities. Disappointing forecasts in hardware and redemption surges in private funds signal a transition from speculative growth to operational scrutiny.</p><p><strong>The AI Divide</strong></p><ul><li><strong>Broadcom:</strong> Facing a potential $300bn market cap loss after missing revenue forecasts.</li><li><strong>Nvidia:</strong> Expanding its moat by moving from data centers into the laptop market to challenge Apple and Intel.</li><li><strong>Regional Shift:</strong> Taiwan and South Korea are outpacing India in AI-driven stock gains due to chipmaker dominance.</li></ul><p><strong>Private Credit Strain</strong></p><ul><li><strong>Blackstone:</strong> Capped withdrawals from its flagship private credit fund following $4.5bn in Q2 redemption requests.</li><li><strong>Partners Group:</strong> Preparing similar withdrawal caps for its US-based wealthy investor fund.</li><li><strong>The Cause:</strong> Mounting sector fears are triggering a liquidity crunch as investors seek exits.</li></ul><p><strong>Sector Divergence</strong></p><ul><li><strong>Consumer Goods:</strong> Struggling growth patterns contrast with the broader US economic narrative.</li><li><strong>Luxury Spirits:</strong> Rémy Cointreau expects a €100mn profit boost via emerging markets and travel retail.</li><li><strong>Professional Services:</strong> The \"Big Four\" audit firms have entrenched their dominance as UK regulatory pressure eases.</li></ul><p><strong>What's next:</strong> Watch for a \"flight to quality\" in AI investments. Investors will likely pivot from infrastructure providers to companies demonstrating tangible software monetization and operational efficiency.</p>", "middle east war": "<p>Israel and Hezbollah have agreed to a US-brokered ceasefire to halt hostilities in Lebanon.</p><p><strong>Why it matters:</strong> The deal aims to prevent a full-scale regional escalation and alleviate a humanitarian crisis that has displaced nearly 1 million Lebanese citizens.</p><p><strong>Between the lines:</strong></p><ul><li><strong>US Leverage:</strong> President Trump exerted direct pressure on Prime Minister Netanyahu to halt assaults on Beirut, echoing the 1982 standoff.</li><li><strong>Fragile Peace:</strong> The ceasefire coincides with volatile US-Iran relations, characterized by simultaneous strikes and stalled formal peace talks.</li><li><strong>Economic Ripple:</strong> Middle East instability is driving Eurozone inflation to 3.2%, forcing the ECB to consider rate hikes.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>1 million:</strong> People displaced in Lebanon.</li><li><strong>3.2%:</strong> Eurozone inflation rate in May, fueled by energy shocks.</li><li><strong>6 ships:</strong> Dynacom vessels positioned to resume transit through the Strait of Hormuz.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Congressional Oversight:</strong> The Republican-led House has moved to block the US president from conducting further Middle East strikes without approval.</li><li><strong>Strategic Shifts:</strong> Gulf states are seeking deeper drone-defense ties with Ukraine to counter Iranian threats.</li></ul>", "shipping": "<p>Geopolitical conflict in the Strait of Hormuz is destabilizing global energy flows and inflating logistics costs.</p><p><strong>Why it matters:</strong> Disruptions in this narrow waterway force a shift in global trade routes, driving up freight rates and pushing nations toward alternative energy sources.</p><p><strong>The Gulf Crisis</strong></p><ul><li><strong>Operational risks:</strong> Seized vessels and \"shadow fleet\" tankers—aging, sanctioned ships—increase the likelihood of environmental disasters.</li><li><strong>Economic fallout:</strong> Maersk reports costs have surged by $500 million per month.</li><li><strong>Logistics pivots:</strong> Cargo is shifting from ships to trucks, adding thousands of dollars in extra costs per shipment.</li><li><strong>Failed interventions:</strong> A $40 billion U.S. insurance facility has seen zero uptake due to a lack of naval escorts.</li></ul><p><strong>Market Ripples</strong></p><ul><li><strong>Energy shifts:</strong> Asian nations are increasing coal shipments to replace disrupted gas supplies.</li><li><strong>Route redirection:</strong> The Panama Canal reports a 15% revenue increase as traders bypass conflict zones.</li><li><strong>Price volatility:</strong> Brent crude dropped nearly 6% following the successful passage of two China-bound supertankers.</li></ul><p><strong>Between the lines</strong> The reliance on \"ghost tankers\" to bypass sanctions has created a precarious maritime ecosystem. These vessels lack proper maintenance and insurance, turning a geopolitical struggle into a looming ecological crisis.</p><p><strong>What's next</strong></p><ul><li><strong>Infrastructure bets:</strong> Belfast Harbour is investing £1.3bn to capture freight and offshore wind business.</li><li><strong>Last-mile evolution:</strong> Walmart is repurposing empty drugstores as stockrooms to accelerate delivery speeds and compete with Amazon.</li></ul>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative tool to a massive capital-intensive industrial race.</p><p><strong>Why it matters:</strong> Massive infrastructure spending is creating a divide between \"hyperscalers\" with deep pockets and traditional knowledge workers facing devaluation.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.78 trillion:</strong> SpaceX's targeted valuation, driven by rocket and AI integration.</li><li><strong>$85 billion:</strong> Google's equity raise to fund AI infrastructure.</li><li><strong>$100 billion:</strong> Meta's estimated gamble to secure an AI edge.</li><li><strong>$55 billion:</strong> Cost of SpaceX's contested AI chip plant in Texas.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Labor devaluation:</strong> High-skill roles, such as translation, are being fragmented into routine tasks.</li><li><strong>Education lag:</strong> Formal curricula cannot keep pace, forcing employers to handle AI training.</li><li><strong>Legal volatility:</strong> Courts are now deciding if AI developers are liable for synthetic harmful content.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Monetization pivot:</strong> Meta is deploying AI agents to turn WhatsApp into a primary revenue driver.</li><li><strong>Regulatory tension:</strong> Nations like Argentina are resisting early regulation to attract development.</li><li><strong>The \"Superintelligence\" race:</strong> Industry leaders are pursuing self-improving AI, while safety experts warn of a lack of safeguards.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony characterized by strategic asymmetry and a vacuum of multilateral leadership.</p><p><strong>Why it matters:</strong></p><ul><li>  The erosion of traditional diplomatic norms increases the risk of direct conflict.</li><li>  Beijing is leveraging U.S. volatility to position itself as a stable alternative for global partners.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The Russia Pivot:</strong> Putin’s strategic missteps have created a one-sided dependency on Beijing, granting China significant leverage over Moscow.</li><li>  <strong>Soft Power Shift:</strong> While the U.S. pursues pre-emptive and unilateral actions, China is aggressively building soft power to fill the leadership void.</li><li>  <strong>The Leverage Game:</strong> Power now derives from the ability to convert imbalances into leverage rather than raw economic or military size.</li></ul><p><strong>The geopolitical friction</strong></p><ul><li>  <strong>The \"Simultaneity\" Trap:</strong> The U.S. faces the challenge of managing multiple high-intensity crises (Iran, Ukraine, China) simultaneously.</li><li>  <strong>The Stability Gap:</strong> Despite high-level summits, both powers crave dominance without accepting the responsibilities of global governance.</li><li>  <strong>Middle Power Rise:</strong> Smaller nations are adopting \"armadillo\" strategies—defensive, resilient postures—to survive the great power stalemate.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Institutional Reform:</strong> Pressure is mounting to reinvent multilateral institutions to prevent a total collapse of the rules-based order.</li><li>  <strong>Risk Evolution:</strong> Global businesses and governments are shifting from growth-centric models to crisis preparedness and resilience planning.</li></ul>", "us elections": "<p>The U.S. midterm landscape is shifting as Donald Trump’s influence over the GOP creates strategic vulnerabilities in key swing states.</p><p><strong>Why it matters:</strong> Trump's preference for \"MAGA warriors\" over moderate incumbents is alienating swing voters and providing Democrats a path to the Senate.</p><p><strong>The Texas Tension</strong></p><ul><li>Trump-backed Ken Paxton won the primary, consolidating the MAGA base.</li><li>Democrats view Paxton’s controversial profile as a liability that could flip the seat in November.</li></ul><p><strong>Swing State Signals</strong></p><ul><li><strong>Pennsylvania:</strong> A populist former firefighter winning the Democratic nomination suggests a strategic shift toward working-class voters.</li><li><strong>Maine:</strong> Rising tariffs and fuel costs are driving a \"lobster revolt,\" eroding Trump's support among rural fishermen.</li><li><strong>California:</strong> Steve Hilton leads the governor's primary, setting up a high-stakes clash with Democrat Xavier Becerra.</li></ul><p><strong>Internal Fractures</strong></p><ul><li><strong>GOP:</strong> Senators are stalling a $1.8bn \"anti-weaponisation\" fund, sparking a public feud between Trump and his own party.</li><li><strong>Democrats:</strong> A DNC autopsy blames the Biden White House for Kamala Harris's loss, citing a lack of party unity.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>50%+:</strong> Proportion of voters who disapprove of Trump’s economic handling, per FT poll.</li><li><strong>$1.8B:</strong> Amount earmarked for Trump's proposed \"lawfare\" victim fund.</li></ul><p><strong>What's next</strong> Watch the 2028 trajectory as JD Vance and Marco Rubio emerge as early rivals for the future Republican nomination.</p>", "german politics": "<p>Germany is aggressively pivoting toward military autonomy and fiscal discipline amid a collapsing relationship with the U.S.</p><p><strong>Why it matters:</strong> Friction with Donald Trump over the Iran war is forcing Berlin to accelerate its own defense capabilities to avoid strategic vulnerability.</p><p><strong>The defense pivot</strong></p><ul><li><strong>Spending:</strong> Berlin aims to hit the 3.5% GDP NATO target six years ahead of schedule.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency and buying a 40% stake in tank maker KNDS to speed up production.</li><li><strong>Strategic shift:</strong> Germany published its first military strategy since WWII, signaling a move to take \"more responsibility\" for European security.</li></ul><p><strong>Fiscal friction</strong></p><ul><li><strong>Internal pressure:</strong> The Finance Ministry is threatening to cut funding for ministries failing to spend a €500bn infrastructure fund.</li><li><strong>EU stance:</strong> Berlin opposes new EU debt, urging member states to make \"painful\" budget choices for rearmament.</li><li><strong>Privatization:</strong> The government is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Leadership:</strong> Chancellor Friedrich Merz faces internal challenges from Hendrik Wüst as polls slide.</li><li><strong>Far-right surge:</strong> The AfD is topping polls by leveraging voter anger over fuel prices and the Iran war.</li><li><strong>Legal blow:</strong> A Berlin court ordered the AfD to return a record €2.35mn illegal donation.</li></ul><p><strong>The U.S. rift</strong></p><ul><li><strong>Retaliation:</strong> The Pentagon is pulling 5,000 soldiers from Germany following Merz's criticism of U.S. strategy in Iran.</li><li><strong>Diplomatic failure:</strong> Merz's public swipe at Trump has effectively erased a year of rapport-building.</li></ul><p><strong>What's next:</strong> Watch for the outcome of the KNDS listing and whether Merz can stabilize his coalition as the U.S. troop withdrawal begins.</p>", "central banks": "<p>Central banks are shifting from a decade of stability toward a volatile era of geopolitical fragmentation and institutional stress.</p><p><strong>Why it matters:</strong> The traditional \"policy put\"—the expectation that central banks will rescue markets during shocks—is eroding. Rising debt costs and political interference are limiting the ability of banks to manage inflation without triggering crises.</p><p><strong>The big shift</strong></p><ul><li><strong>Reserve Diversification:</strong> Gold has replaced U.S. Treasuries as the top reserve asset, now making up 27% of holdings as banks hedge against dollar dominance.</li><li><strong>Technological Pivot:</strong> The Fed and BoE successfully tested cross-border blockchain payments to enable near-instant settlement.</li><li><strong>AI Integration:</strong> While AI boosts GDP in regions like Korea, the ECB is warning banks that AI models are creating new systemic financial risks.</li></ul><p><strong>Policy friction</strong></p><ul><li><strong>The Fed:</strong> Incoming chair Kevin Warsh faces a \"complicated inheritance,\" balancing an intensifying Iran war and rising inflation against a desire to roll back forward guidance.</li><li><strong>The ECB:</strong> Core inflation is forcing a pivot toward tightening in June as energy price shocks spill into the wider economy.</li><li><strong>The BoJ:</strong> Japan is accelerating quantitative tightening by reducing bond purchases to combat market volatility.</li></ul><p><strong>Between the lines</strong> Central bank independence is under siege. Former Fed Chair Powell and ECB officials warn that political attempts to fire bankers or restrict Treasury funding undermine the rule of law and global financial stability.</p><p><strong>What's next</strong></p><ul><li><strong>Rate Divergence:</strong> A growing disconnect persists between professional forecasters and money markets regarding the timing of Fed and BoE cuts.</li><li><strong>Fiscal Constraints:</strong> Demographic shifts are expected to increase fiscal pressures, further constraining the independence of monetary policy.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand balance sheets and challenge non-bank competitors.</p><p><strong>Why it matters:</strong> Lower regulatory hurdles are freeing billions in capital, allowing giants like JPMorgan to pursue massive acquisitions and international retail growth. Simultaneously, agile trading firms are eroding the traditional dominance of Wall Street investment banks.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks via regulatory loosening.</li><li><strong>$114 billion:</strong> Combined revenues for top trading firms (e.g., Jane Street, Citadel) as they encroach on bank territory.</li><li><strong>$20 billion:</strong> Potential acquisition budget Jamie Dimon says JPMorgan could deploy.</li><li><strong>$40 billion:</strong> Record revenue for Jane Street alone, driven by market volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Shadow\" Threat:</strong> Trading firms are outperforming traditional banks by capturing volatility and commodities gains more efficiently.</li><li><strong>Risk Migration:</strong> Banks are actively offloading \"concentrated\" risks—specifically private equity-linked loans and AI data center debt—to avoid systemic shocks.</li><li><strong>Geopolitical Friction:</strong> Security concerns in China are forcing operational pivots, such as Morgan Stanley issuing China-specific hardware to staff.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Retail War:</strong> JPMorgan is scaling its \"Chase\" digital bank into Germany and other European markets.</li><li><strong>Crypto Integration:</strong> Morgan Stanley is moving deeper into retail digital assets via spot crypto trading on E*Trade.</li><li><strong>Strategic Partnerships:</strong> Citi is pivoting toward asset managers (BlackRock) to fund private lending, shifting the risk profile of corporate finance.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>04 Jun 2026 13:43 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
