const SUMMARIES = {"oil and gas": "<p>Global oil and gas markets are facing a volatile convergence of geopolitical instability, legal climate challenges, and shipping bottlenecks.</p><p><strong>Why it matters:</strong> Supply chain fragility and legal liabilities are creating a high-risk environment for capital investment. This instability threatens to spike consumer inflation and accelerate the shift toward energy independence.</p><p><strong>The shipping squeeze</strong></p><ul><li><strong>The risk:</strong> Vitol warns of a tanker shortage that could push oil toward $200 a barrel.</li><li><strong>The gamble:</strong> A US trader is betting $2bn on tankers as carriers avoid the Strait of Hormuz.</li><li><strong>The buffer:</strong> Saudi Aramco warns global stockpiles are \"scarily thin\" and could take two years to rebuild.</li></ul><p><strong>Legal and regulatory headwinds</strong></p><ul><li><strong>Climate liability:</strong> The US Supreme Court is weighing whether \"Big Oil\" is liable for climate change costs.</li><li><strong>Regional blocks:</strong> Australian courts are ruling against coal mining impacts; the UK faces warnings that blocking North Sea projects makes the region \"uninvestable.\"</li><li><strong>Trade wars:</strong> The Trump administration is pressuring the EU to release diesel stocks under threat of US export bans.</li></ul><p><strong>Strategic pivots</strong></p><ul><li><strong>New frontiers:</strong> ExxonMobil is targeting Trinidad and Tobago to replicate its Guyana success.</li><li><strong>Gas surpluses:</strong> Aramco is exploring export options for the giant Jafurah field.</li><li><strong>Diversification:</strong> Ineos is using oil and gas earnings to offset a €2.2bn loss in its chemicals division.</li></ul><p><strong>What's next:</strong> Watch for the US Supreme Court ruling on climate damages, as it will determine the financial liability framework for the entire fossil fuel industry.</p>", "corporate earnings and results": "<p>S&P 500 earnings are forecast to rise 27% this season.</p><p><strong>Why it matters:</strong> Robust AI spending is driving corporate growth despite elevated borrowing costs and record stock market highs.</p><p><strong>By the numbers</strong></p><ul><li><strong>27%:</strong> Projected earnings growth for the S&P 500.</li><li><strong>$500B:</strong> Potential cost to banks as AI agents help savers find better rates.</li><li><strong>£725M:</strong> Volkswagen's latest provision for finance mis-selling.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI Divergence:</strong> While Big Tech (Google) and the broader S&P 500 benefit from AI investment, traditional sectors like banking face margin compression from AI-driven transparency.</li><li><strong>Strategic Pivots:</strong> Stagnant sectors are chasing high-growth niches. European telcos are shifting capital toward data centers to escape low-growth legacy markets.</li><li><strong>Exclusivity Plays:</strong> Luxury brands (Porsche) are raising prices to boost margins, betting that high-end demand is decoupled from broader economic headwinds.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Trade Volatility:</strong> EU-China tensions over hybrid cars and chemicals may lead to temporary import limits or tariffs, threatening automotive supply chains.</li><li><strong>Consolidation:</strong> Expect increased M&A in retail (Sainsbury's) and pharmacy (Boots) as firms seek scale in stagnant markets.</li></ul>", "middle east war": "<p>The Middle East conflict is expanding into a multi-front regional war with severe implications for global trade and security.</p><p><strong>Why it matters:</strong> Escalating attacks by Iran-backed proxies are forcing a realignment of military alliances and driving up the cost of global logistics.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Yemen:</strong> Saudi Arabia has deployed 100 fighter jets to support Yemeni forces attempting to recapture Sana’a and the Bab al-Mandab Strait.</li><li><strong>UK/US:</strong> The US recalled B-1 bombers from RAF Fairford following an alleged Iranian-linked terror plot.</li><li><strong>Israel:</strong> Domestic political instability grows as the government pushes West Bank settlements ahead of elections.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$100,000:</strong> Monthly salary for ship captains risking transit through the Strait of Hormuz.</li><li><strong>$6 billion:</strong> Cost savings target for Skydance as broader economic volatility hits media debt.</li><li><strong>7:</strong> Arrests made in the UK regarding the RAF Fairford security breach.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Security shifts:</strong> Saudi Arabia, Pakistan, and Turkey have triggered a mutual defense pact in response to Houthi aggression.</li><li><strong>Economic resilience:</strong> Global oil markets have remained surprisingly stable despite Iranian disruptions, though fuel prices are creating political pressure in the US.</li><li><strong>Diplomatic friction:</strong> The UK is threatening to expel Israeli diplomats over the potential closure of the Jerusalem consulate.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Election volatility:</strong> The Israeli Supreme Court's decision to allow Arab parties to run could lead to a hung parliament.</li><li><strong>Maritime risk:</strong> Continued Houthi missile barrages on Riyadh and Aden will likely sustain high shipping premiums and rerouting costs.</li></ul>", "shipping": "<p>Geopolitical conflict and climate change are forcing a structural redesign of global shipping routes.</p><p><strong>Why it matters:</strong> Traditional chokepoints like the Strait of Hormuz and the Panama Canal are becoming unreliable. This creates a volatile market where immediate vessel availability outweighs long-term asset value.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.2 million:</strong> Record daily cost for oil tankers due to Middle East disruptions.</li><li><strong>4x:</strong> Increase in Northern Sea Route transits as Arctic ice melts.</li><li><strong>33%:</strong> Growth in the Russian-flagged fleet to bypass Western sanctions.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Shadow Fleet\" effect:</strong> Sanctions and wars are eroding global maritime rules, leading to a rise in stateless vessels and insurance loopholes.</li><li><strong>Speed over specs:</strong> Old supertankers now command higher prices than new builds because they are available for immediate deployment.</li><li><strong>Diversification:</strong> South Korea and Russia are aggressively pivoting to Arctic routes to eliminate dependence on Middle Eastern chokepoints.</li></ul><p><strong>The green transition</strong></p><ul><li><strong>Fuel shift:</strong> Biodiesel is now cheaper than conventional fuels, accelerating emissions targets.</li><li><strong>Hybrid tech:</strong> Maersk is integrating wind sails and exploring ammonia/methanol to cut greenhouse gases.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Cyber risk:</strong> Increased reliance on satellite-linked \"edge devices\" makes vessel navigation and engines vulnerable to hacking.</li><li><strong>Financialization:</strong> Institutional investors are shifting toward shipping as a \"hard asset\" hedge against Middle East instability.</li></ul>", "artificial intelligence": "<p>AI has shifted from a speculative tool to a systemic risk across global finance, security, and social structures.</p><p><strong>Why it matters:</strong> Massive capital concentration in AI infrastructure is creating a fragile market bubble while simultaneously introducing new vectors for cyber warfare and legal liability.</p><p><strong>By the numbers</strong></p><ul><li><strong>$40 billion:</strong> The amount SpaceX is seeking to raise specifically for Nvidia chips.</li><li><strong>Dozens:</strong> The number of hacks OpenAI has uncovered, increasing legal vulnerability for Sam Altman.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Market Fragility:</strong> Pension funds and investors are diversifying away from US equities to hedge against \"AI concentration risk\" and stretched valuations.</li><li><strong>Security Shift:</strong> AI is no longer just a tool for efficiency; it is being weaponized for bank cyber attacks and deepfake impersonations of world leaders.</li><li><strong>Cognitive Erosion:</strong> Experts warn that \"artificial intimacy\" and a reliance on generative AI are degrading human companionship and critical thinking.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal Precedents:</strong> Insurers are preparing for multimillion-dollar claims as \"rogue\" AI agents cause real-world damages.</li><li><strong>Geopolitical Friction:</strong> US-China trade tensions are hindering cross-border AI research, forcing a fragmented \"tribal\" approach to model development.</li><li><strong>Labor Evolution:</strong> While economists dispute total job loss, the nature of work is undergoing rapid, disruptive reconfiguration.</li></ul>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic competition.</p><p><strong>Why it matters:</strong> The collapse of \"win-win\" diplomacy is driving a global realignment. This shift forces neutral nations to hedge and accelerates the fragmentation of trade and security.</p><p><strong>Between the lines</strong></p><ul><li><strong>Leadership deficit:</strong> Current leadership in both Washington and Beijing is viewed as lacking the far-sightedness required to prevent escalation.</li><li><strong>Reliability gap:</strong> U.S. volatility regarding defense guarantees is pushing allies like Japan and South Korea to question their security architecture.</li><li><strong>The BRICS pivot:</strong> Economic gravity is shifting; the BRICS bloc now holds a larger share of the global economy than the G7.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>AI dominance:</strong> U.S. national data center projects are consolidating an American lead in AI power, despite global hardware dispersion.</li><li><strong>Economic shift:</strong> BRICS unity is increasing as a direct response to U.S. tariffs and sanctions.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Tactical engagement:</strong> Expect continued high-level summits, but these are tools for crisis management, not a return to détente.</li><li><strong>Institutional poaching:</strong> As the U.S. cuts aid, Gulf and European capitals will compete to lure UN bodies away from Geneva.</li></ul>", "us elections": "<p>Economic instability and demographic shifts are threatening Republican control of Congress.</p><p><strong>Why it matters:</strong> High living costs and aggressive redistricting are alienating key voting blocs. These factors create a volatility gap that could lead to historic GOP losses.</p><p><strong>The volatility drivers</strong></p><ul><li><strong>Affordability:</strong> Mortgage rates exceeding 7% and soaring housing costs are turning private equity and inflation into primary campaign targets.</li><li><strong>Demographics:</strong> Latino voters remain the \"moveable middle,\" while Black voters are mobilizing against Supreme Court-sanctioned gerrymandering.</li><li><strong>Internal Friction:</strong> Trump’s pivot toward Big Tech and AI is alienating his populist base.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1 billion:</strong> The amount Republicans are spending on an ad blitz to counter Trump's declining popularity.</li><li><strong>7%:</strong> The mortgage rate threshold breached, intensifying voter anger over the cost of living.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Message vs. Money:</strong> Massive spending is attempting to mask a fragmented GOP message and a distracted leader.</li><li><strong>The AI Pivot:</strong> Trump's rapprochement with AI leaders (Anthropic, Google, Meta) creates a policy contradiction with his \"anti-elite\" branding.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate Battle:</strong> Control of the Senate remains on a \"knife edge,\" contingent on whether Democrats successfully pivot to economic messaging.</li><li><strong>Market Impact:</strong> Investors are monitoring if a divided government will stall or sustain the current administration's agenda.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the CDU's eastern strongholds.</p><p><strong>Why it matters:</strong> The AfD's surge creates a power vacuum in the center, weakening Germany's leverage in EU budget negotiations and destabilizing the federal government's authority.</p><p><strong>The crisis points</strong></p><ul><li><strong>Regional collapse:</strong> The CDU suffered disastrous losses in Mecklenburg-Vorpommern and Saxony-Anhalt.</li><li><strong>Far-right infiltration:</strong> The AfD secured its first regional parliament president via secret support from established party lawmakers.</li><li><strong>Internal instability:</strong> Hendrik Wüst, premier of North Rhine-Westphalia, is emerging as a popular alternative to the unpopular Merz.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"East\" divide:</strong> Nostalgia and Ukraine-related wedge issues are driving voters toward the AfD and the hard-left BSW.</li><li><strong>Generational shift:</strong> Younger voters are increasingly disconnected from the historical warnings against fascism and communism.</li><li><strong>Strategic desperation:</strong> Merz is skipping international summits to contain the CDU's internal crisis.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Federal risk:</strong> The AfD is targeting 40% of the vote in the next federal elections.</li><li><strong>Leadership shuffle:</strong> Pressure is mounting for Merz to step aside for Wüst to stabilize the center.</li><li><strong>Diplomatic friction:</strong> Germany continues high-stakes balancing acts with Russia and Turkey amid domestic volatility.</li></ul>", "central banks": "<p>Central banks are struggling to balance inflation control with escalating political pressure and systemic financial risks.</p><p><strong>Why it matters:</strong> Persistent inflation and geopolitical shocks are forcing a shift toward \"tightening\" cycles, while populist attacks undermine the institutional independence required to manage these pivots.</p><p><strong>The global landscape</strong></p><ul><li><strong>India:</strong> The RBI raised rates for the first time in three years to combat energy costs and inflation.</li><li><strong>Philippines:</strong> Central bank officials are bracing for \"Godzilla\" El Niño weather events to spike food prices.</li><li><strong>United States:</strong> The Fed faces a dual crisis of declining public trust and critical security deficiencies.</li></ul><p><strong>European instability</strong></p><ul><li><strong>France:</strong> Bond yields are surging, leaving the country at risk of being \"strangled\" by interest rates.</li><li><strong>ECB:</strong> Internal leadership is shifting as Isabel Schnabel departs for the IMF, while some call for a halt to Quantitative Tightening (QT) to stabilize markets.</li></ul><p><strong>Emerging risks</strong></p><ul><li><strong>AI Debt:</strong> The Bank of England warns that an AI-driven debt surge could trigger a sharp market correction.</li><li><strong>Treasury Shift:</strong> US government bonds are losing their status as \"money,\" reducing their effectiveness as a global safe haven.</li></ul><p><strong>What's next:</strong> Watch for a potential pivot in the Fed's communication strategy as critics target the \"incoherent\" dot plot and demand a clearer economic narrative.</p>", "us banks": "<p>US banks are pivoting toward AI-driven revenue and deregulation while battling a talent war for junior staff.</p><p><strong>Why it matters:</strong> The sector is shifting from traditional lending to high-margin asset management and AI-integrated services to offset slowing trading revenues.</p><p><strong>The AI effect</strong></p><ul><li><strong>New Revenue:</strong> Goldman Sachs earned $200M+ in fees from AI-focused hedge fund Situational Awareness.</li><li><strong>Cost Pressure:</strong> Big banks are demanding lower legal bills, arguing AI has reduced the time required for routine law work.</li><li><strong>Financing Limits:</strong> Banks are offloading $15B in debt for Anthropic data centers to free up capital for other mega AI deals.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks under the Trump administration.</li><li><strong>SVB Fallout:</strong> A White House review blamed a \"culture of risk aversion\" among regulators for mishandling the Silicon Valley Bank collapse.</li><li><strong>New Entrants:</strong> The Trump family crypto venture received a banking license, while Erebor has surged to $7B in deposits targeting the tech sector.</li></ul><p><strong>The talent war</strong></p><ul><li><strong>Retention:</strong> Citi is shortening its analyst program to two years to prevent poaching by private equity firms.</li><li><strong>Poaching:</strong> JPMorgan continues to aggressively recruit top M&A talent from rivals like Bank of America.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$2.3B:</strong> Goldman Sachs' potential acquisition cost for ETF provider Neos.</li><li><strong>$250B:</strong> Bank of America's commitment to US projects to align with \"America First\" policies.</li><li><strong>$74B:</strong> Wealth management assets gained by Morgan Stanley following high-profile IPOs like SpaceX.</li></ul><p><strong>What's next:</strong> Expect a decline in traditional stress tests as critics argue they mislead the public, replaced by a more streamlined, risk-focused regulatory framework.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>07 Oct 2026 17:33 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
