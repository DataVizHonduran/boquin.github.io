.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const TOPICS    = [{"tag": "oil and gas", "label": "Oil & Gas", "color": "#d97706", "bg": "#fffbeb"}, {"tag": "corporate earnings and results", "label": "Corporate Earnings", "color": "#059669", "bg": "#ecfdf5"}, {"tag": "middle east war", "label": "Middle East War", "color": "#dc2626", "bg": "#fef2f2"}, {"tag": "shipping", "label": "Shipping", "color": "#2563eb", "bg": "#eff6ff"}, {"tag": "artificial intelligence", "label": "Artificial Intelligence", "color": "#7c3aed", "bg": "#f5f3ff"}, {"tag": "us-china relations", "label": "US–China Relations", "color": "#ea580c", "bg": "#fff7ed"}, {"tag": "us elections", "label": "US Elections", "color": "#0d9488", "bg": "#f0fdfa"}, {"tag": "german politics", "label": "German Politics", "color": "#db2777", "bg": "#fdf2f8"}, {"tag": "central banks", "label": "Central Banks", "color": "#0891b2", "bg": "#ecfeff"}, {"tag": "us banks", "label": "US Banks", "color": "#4338ca", "bg": "#eef2ff"}];
const SUMMARIES = {"oil and gas": "<p>Geopolitical instability and the AI power surge are driving a volatile realignment of global energy infrastructure.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Supply shocks:</strong> The closure of the Strait of Hormuz is depleting global stockpiles, spiking petrol prices, and threatening a winter LNG price war between Asia and Europe.</li><li>  <strong>Demand pivots:</strong> AI data centers are creating an unprecedented power vacuum, triggering a surge in energy IPOs and massive utility investments.</li></ul><p><strong>The Geopolitical Map</strong></p><ul><li>  <strong>Iraq:</strong> US majors are returning; ConocoPhillips is entering the Kirkuk field, while Chevron seeks a Syria pipeline to bypass the Strait of Hormuz.</li><li>  <strong>UAE:</strong> Adnoc is investing $6.2B in natural gas to achieve self-sufficiency amid a failing supply deal with Qatar.</li><li>  <strong>India:</strong> PM Modi is aggressively securing uranium and critical minerals to hedge against Iran-driven supply disruptions.</li><li>  <strong>Venezuela:</strong> US \"wildcatters\" are leveraging Trump-era exploration booms to strike new deals in Caracas.</li></ul><p><strong>The UK Energy Crisis</strong></p><ul><li>  <strong>Policy Clash:</strong> The Burnham government is maintaining the North Sea exploration ban, drawing fire from industry and unions.</li><li>  <strong>Grid Instability:</strong> National Grid is paying consumers to cut usage as climate change and renewables make blackout prevention more difficult.</li><li>  <strong>Utility Distress:</strong> Thames Water and South East Water are struggling for funding, with creditors pushing \"golden shares\" to avoid nationalization.</li></ul><p><strong>Regulatory Friction</strong></p><ul><li>  <strong>EU Methane:</strong> The EU is delaying fines for methane leaks following US pressure, though industry is demanding a full legal rewrite.</li><li>  <strong>Carbon Credits:</strong> Heavy industry is successfully lobbying the EU for more time to emit carbon and more funds to decarbonize.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$1.75B:</strong> National Grid's investment in AI-focused power developers.</li><li>  <strong>$6.2B:</strong> Adnoc's spend on UAE gas self-sufficiency.</li><li>  <strong>$4:</strong> The threshold US petrol prices have breached due to Iran tensions.</li><li>  <strong>42%:</strong> ConocoPhillips' new stake in the Kirkuk oilfield redevelopment.</li></ul>", "corporate earnings and results": "<p>Corporate earnings reports reveal a fragmented global landscape defined by sector-specific rebounds and intensifying regulatory scrutiny.</p><p><strong>Why it matters:</strong> Divergent results between financial services and industrial sectors signal a shift in where capital is flowing and where accounting risks are mounting.</p><p><strong>The winners</strong></p><ul><li><strong>Julius Baer:</strong> Net profits more than doubled to SFr673mn, signaling an early turnaround.</li><li><strong>Linklaters:</strong> Partners received record £2.5mn payouts driven by US growth and Hong Kong listings.</li><li><strong>SBI Funds Management:</strong> Shares jumped 9% in India's largest listing this year, reviving local IPO sentiment.</li></ul><p><strong>The red flags</strong></p><ul><li><strong>Accounting Fraud:</strong> Berenberg uncovered profit manipulation that slashed reported net profit from €81.6mn to €20.2mn.</li><li><strong>Oracle:</strong> Faces a potential $7bn collateral bill for a Wisconsin data center due to rising power costs and AI spending.</li><li><strong>Diageo:</strong> Undergoing a board revamp and restructuring to stabilize a struggling spirits business.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>M&A Surge:</strong> The £3.1bn Mitie/OCS deal and record biotech acquisitions show a \"fear of missing out\" (FOMO) driving consolidation.</li><li><strong>Regulatory Pressure:</strong> US authorities are probing the insurance-private capital nexus, while JPMorgan warns that UK tax raids could stall a £3bn London office project.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market Evolution:</strong> The London Stock Exchange will launch 24/7 trading next year to increase liquidity.</li><li><strong>AI Pivot:</strong> Venture capital is pouring into AI drug discovery (Dimension Capital raised $800mn) despite a gap in regulatory approvals.</li></ul>", "middle east war": "<p>The U.S. and Iran have entered a direct military escalation centered on the Strait of Hormuz.</p><p><strong>Why it matters:</strong> Tehran is using asymmetric warfare to force economic relief and security guarantees, while the U.S. is employing targeted strikes and port blockades to compel Iranian concessions.</p><p><strong>The current flashpoints</strong></p><ul><li><strong>Maritime Security:</strong> Iran is targeting tankers and threatening the Strait of Hormuz, driving oil prices toward $90.</li><li><strong>Regional Proxies:</strong> Houthi rebels are threatening a blockade of Saudi crude exports in the Red Sea.</li><li><strong>Direct Conflict:</strong> U.S. forces have expanded strikes deeper into Iranian infrastructure following troop casualties in Jordan.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>100:</strong> U.S. troops injured in two weeks, primarily via concussions.</li><li><strong>$90:</strong> The price ceiling oil touched following Iranian tanker attacks.</li><li><strong>October:</strong> The date of Israel's election, where Gadi Eisenkot is challenging Benjamin Netanyahu.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Iran's Gamble:</strong> Tehran believes escalation will eventually force Washington to negotiate a new security framework.</li><li><strong>U.S. Strategy:</strong> The Trump administration is shifting from negotiation toward regime change and economic strangulation.</li><li><strong>Gulf Vulnerability:</strong> Kuwait remains a primary \"soft target\" for Iranian proxies due to its historical instability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Lebanon Deal:</strong> A proposed peace plan involving the Lebanese army moving into \"pilot zones\" to facilitate Israeli withdrawal.</li><li><strong>Diplomatic Pivot:</strong> Calls for a \"Helsinki Act\" for the Middle East to establish détente without requiring mutual trust.</li></ul>", "shipping": "<p>Global shipping is fracturing into high-risk conflict zones and fragmented regulatory regimes.</p><p><strong>Why it matters:</strong> Geopolitical volatility in the Strait of Hormuz and the Black Sea is forcing a structural redesign of trade routes and vessel flagging.</p><p><strong>The conflict map</strong></p><ul><li><strong>Strait of Hormuz:</strong> Tit-for-tat US-Iran strikes and proposed cargo fees have pushed Dubai to build new ports on its east coast to bypass the waterway.</li><li><strong>Black Sea/Azov:</strong> Ukrainian drone assaults on Russian tankers are now outpacing the intensity of the 1980s Iran-Iraq tanker wars.</li><li><strong>Taiwan Strait:</strong> Blacklisted vessels are increasingly linked to North Korean smuggling networks rather than just state agencies.</li></ul><p><strong>Market disruptions</strong></p><ul><li><strong>Freight Rates:</strong> Maersk's return to the Suez Canal triggered a 7% share drop as shorter routes threaten to lower freight rates.</li><li><strong>Flagging:</strong> Vessels are rapidly stripping Panamanian flags to avoid Chinese detentions.</li><li><strong>Sanctions:</strong> Russian \"shadow tankers\" are avoiding the English Channel to evade European naval interceptions.</li></ul><p><strong>The energy transition</strong></p><ul><li><strong>Fuel Split:</strong> The industry is fracturing into camps backing nuclear power, \"dirty\" fossil fuels, or green tech as consensus on decarbonization fails.</li><li><strong>Carbon Costs:</strong> New EU emissions fees are closing loopholes, increasing costs for global carriers and risking trade tensions.</li></ul><p><strong>What's next:</strong> Watch for the stability of the US-Iran ceasefire; a recent quadrupling of Hormuz transits suggests a fragile return to normalcy.</p>", "artificial intelligence": "<p>AI is evolving from a productivity tool into a geopolitical and security weapon.</p><p><strong>Why it matters:</strong> Dependence on foreign AI infrastructure creates strategic vulnerabilities while \"synthetic\" threats bypass traditional corporate security.</p><p><strong>The security gap</strong></p><ul><li><strong>Synthetic Insiders:</strong> Hackers are using industrial-scale deepfakes to create fake employees and infiltrate corporate networks.</li><li><strong>Cyber Escalation:</strong> AI is lowering the barrier for reckless hackers and narrowing the technical gap between Chinese and U.S. models.</li><li><strong>Supply Chain:</strong> AI-driven attacks are targeting systemic weaknesses in third-party vendor integrations.</li></ul><p><strong>The economic shift</strong></p><ul><li><strong>Infrastructure Play:</strong> Meta and Anthropic are pursuing multi-billion dollar data center deals, shifting the focus toward physical compute power.</li><li><strong>Market Volatility:</strong> Semiconductor stocks are seeing sharp corrections as \"momentum trades\" fail, though Apple remains resilient.</li><li><strong>Corporate Adoption:</strong> UK businesses are stagnating, relying on free tools for efficiency rather than innovating new products.</li></ul><p><strong>The workplace friction</strong></p><ul><li><strong>Knowledge Capture:</strong> Companies are using AI training as a \"power play\" to extract tacit knowledge from employees' heads.</li><li><strong>Entry-Level Evolution:</strong> AI is not erasing junior roles but forcing a redesign of professional services and legal apprenticeships.</li></ul><p><strong>What's next:</strong> The EU will push for \"strategic autonomy\" to reduce reliance on U.S. AI capabilities, while corporations pivot toward defending against AI-generated internal threats.</p>", "us-china relations": "<p>US-China relations are shifting toward a \"might is right\" era of great power competition.</p><p><strong>Why it matters:</strong> The erosion of US hegemony and the rise of Chinese assertiveness are destabilizing global trade and security architectures. This creates a vacuum that forces middle powers to hedge between two volatile superpowers.</p><p><strong>The friction points</strong></p><ul><li><strong>Military escalation:</strong> China is testing boundaries with ballistic missile launches in Pacific nuclear-free zones.</li><li><strong>Resource warfare:</strong> Beijing is weaponizing critical minerals, evidenced by the detention of Japanese nationals over rare earth smuggling.</li><li><strong>Economic instability:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten the global economy.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The Stability Play:</strong> While the US is viewed as erratic under Trumpian influence, Beijing is positioning itself as a \"pillar of stability\" to attract foreign officials.</li><li><strong>The Tribute Model:</strong> China is exploring a \"tribute system\" to exercise power through economic leverage rather than direct kinetic war.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Alliance reshuffling:</strong> Japan and EU nations are seeking \"resilience\" and new capabilities to survive a world without guaranteed US security umbrellas.</li><li><strong>Systemic risk:</strong> The competition between the US and China is accelerating the return of non-alignment as nations avoid picking a side.</li></ul>", "us elections": "<p>The U.S. midterm landscape is defined by a massive Republican financial advantage and deep ideological fractures within the Democratic Party.</p><p><strong>Why it matters:</strong> Trump's financial dominance and populist economic pivots aim to secure the GOP majority, while Democrats are struggling to reconcile a radical progressive wing with establishment goals.</p><p><strong>By the numbers</strong></p><ul><li><strong>$400 million:</strong> The war chest built by the pro-Trump Super PAC Maga Inc.</li><li><strong>$300 billion:</strong> The potential fund the administration is considering for Iran if a peace deal is reached.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Democratic instability:</strong> Progressive victories in Colorado and New York, combined with the Graham Platner scandal in Maine, signal a party in internal turmoil.</li><li><strong>Trump's vulnerabilities:</strong> FT polling shows voters are souring on the president due to inflation and the costs of the Iran conflict.</li><li><strong>Corporate influence:</strong> The defeat of pro-regulation candidate Alex Bores highlights the significant political leverage of the AI lobby and Silicon Valley billionaires.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California's gauge:</strong> The gubernatorial race between Steve Hilton and Xavier Becerra will serve as a primary indicator of voter appetite for MAGA-style politics.</li><li><strong>Legislative friction:</strong> The House's move to rein in war powers suggests a growing bipartisan reluctance to grant the president unilateral military authority in the Middle East.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is aggressively pivoting Germany toward a debt-funded military powerhouse and a market-driven economy.</p><p><strong>Why it matters:</strong> Berlin is abandoning its traditional fiscal restraint and diplomatic caution to fill the security vacuum left by waning U.S. support and European instability.</p><p><strong>The military pivot</strong></p><ul><li><strong>Historic spending:</strong> Germany will borrow €800bn for rearmament, the largest debt-fueled surge since reunification.</li><li><strong>Strategic shifts:</strong> Berlin is ditching French partnerships for fighter jets and scrapping the F126 frigate due to cost overruns.</li><li><strong>Operational learning:</strong> The Bundeswehr is integrating Ukrainian battlefield expertise to modernize land forces.</li><li><strong>Industrial control:</strong> The government is buying a 40% stake in tank maker KNDS to secure domestic production.</li></ul><p><strong>Economic restructuring</strong></p><ul><li><strong>Growth stimulus:</strong> Merz unveiled €10bn in tax cuts and pushed for looser Sunday trading laws.</li><li><strong>Pension reform:</strong> Berlin is pursuing a Swedish-style public fund to invest pension contributions in capital markets.</li><li><strong>Privatization:</strong> The state is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Internal instability</strong></p><ul><li><strong>Political friction:</strong> The AfD is leading polls and maintaining ties with the Kremlin, while left-wing terrorism is rising.</li><li><strong>Leadership threats:</strong> Merz faces internal pressure from younger conservative Hendrik Wüst as polling slides.</li><li><strong>Personnel losses:</strong> CDU parliamentary leader Jens Spahn resigned following a surrogacy controversy.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission and the effectiveness of the new arms procurement agency in deploying the €500bn infrastructure fund.</p>", "central banks": "<p>Central banks are shifting from predictable guidance to strategic ambiguity.</p><p><strong>Why it matters:</strong> The era of \"forward guidance\" is ending. By refusing to signal future rate moves, central banks aim to regain flexibility but risk increasing market volatility and eroding investor trust.</p><p><strong>The Fed's pivot</strong> New Chair Kevin Warsh is dismantling traditional communication strategies:</p><ul><li><strong>Silence as strategy:</strong> Warsh is avoiding near-term rate steers to prevent hedge fund front-running.</li><li><strong>Structural reform:</strong> Five new task forces, led by business and academic outsiders, are redesigning Fed operations.</li><li><strong>AI optimism:</strong> Warsh views AI as a primary driver for productivity-based growth.</li></ul><p><strong>Global friction points</strong> Central banks are diverging on policy and facing political pressure:</p><ul><li><strong>Japan:</strong> Facing a \"Liz Truss moment\" as fiscal stimulus and a weak yen threaten central bank independence.</li><li><strong>UK:</strong> The Bank of England faces backlash over Quantitative Tightening (QT) and plans to limit hedge fund leverage to stabilize the gilt market.</li><li><strong>EU:</strong> The Bundesbank is pushing the ECB to hold rates steady despite rising oil prices.</li><li><strong>New Zealand:</strong> The RBNZ has pivoted back to rate hikes to combat persistent inflation.</li></ul><p><strong>Between the lines</strong> A \"trust deficit\" is emerging. Markets are struggling to price long-term inflation because they no longer trust central bank signals. This instability is compounded by:</p><ul><li><strong>Political risk:</strong> Potential White House pressure on Fed independence.</li><li><strong>Tech risk:</strong> BoE warnings that AI-powered trading may require \"kill switches\" to prevent market crashes.</li><li><strong>Liquidity risk:</strong> The transition from QE to QT is creating dangerous imbalances in bank balance sheets.</li></ul><p><strong>What's next</strong> Watch for a \"markets reckoning\" if bond investors lose patience with U.S. fiscal instability or if the Fed's lack of transparency triggers a liquidity spike.</p>", "us banks": "<p>Wall Street banks are posting record profits driven by an AI-fueled trading boom and a revival in investment banking fees.</p><p><strong>Why it matters:</strong> The convergence of Big Tech and Big Finance is creating a new profit engine. Banks are no longer just intermediaries; they are now primary beneficiaries of the AI equity rally.</p><p><strong>By the numbers</strong></p><ul><li><strong>4 years:</strong> The longest period since investment banking fees have reached these levels.</li><li><strong>Record highs:</strong> Quarterly profits for JPMorgan, Goldman Sachs, Citigroup, and BofA.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The AI Effect:</strong> Banks are \"AI stocks\" by proxy, gaining from both the trading volume of tech shares and the wealth of AI millionaires.</li><li><strong>Structural Shifts:</strong> Citigroup is undergoing a \"ruthless\" restructuring under Jane Fraser to close the profitability gap with peers.</li><li><strong>Compliance Friction:</strong> The rise of prediction markets (Kalshi, Polymarket) is forcing banks to tighten employee betting policies to avoid regulatory risk.</li></ul><p><strong>The risks</strong></p><ul><li><strong>Regulatory gaps:</strong> Critics argue \"ill-timed deregulation\" is eroding bank resilience.</li><li><strong>Overpayment:</strong> Boutique firms (Evercore, Lazard) are struggling with high salaries paid to \"star bankers\" before the deal upswing fully materialized.</li><li><strong>Leadership instability:</strong> High-profile succession shifts at JPMorgan signal ongoing volatility at the top of the industry.</li></ul><p><strong>What's next</strong></p><ul><li><strong>IPO Pipeline:</strong> Banks are leveraging ties to high-profile private firms like SpaceX to drive future underwriting revenue.</li><li><strong>Fed Transition:</strong> Markets are bracing for volatility as potential new Fed leadership alters communication styles regarding interest rates.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>21 Jul 2026 12:15 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
