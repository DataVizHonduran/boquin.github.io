.slider-ticks span{font-size:.72rem;color:#94a3b8}

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

/strong> Watch for a \"security-first\" energy policy where Western nations prioritize domestic production and grid hardening over aggressive decarbonization targets.</p>", "corporate earnings and results": "<p>Wall Street expects global corporate earnings growth to drop from 33.5% to 16% next year.</p><p><strong>Why it matters:</strong> The deceleration signals a cooling period for the AI-driven investment surge. Lower profit forecasts suggest the initial \"capex boom\" is hitting a plateau of diminishing returns.</p><p><strong>By the numbers</strong></p><ul><li><strong>16%:</strong> Projected global profit growth for next year.</li><li><strong>33.5%:</strong> The previous growth rate analysts are now discounting.</li><li><strong>$104bn:</strong> Revenue Nvidia booked through its Singapore subsidiary last year.</li><li><strong>$2bn:</strong> The amount of \"hung\" software debt JPMorgan is attempting to clear via steep price cuts.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>AI instability:</strong> A rush to patch AI-discovered bugs is causing systemic outages at Microsoft, JPMorgan, and the FAA.</li><li><strong>Financial risk:</strong> The ECB warns that hyperscalers' off-balance sheet commitments mirror the subprime mortgage bubble.</li><li><strong>Strategic pivots:</strong> Traditional sectors are diversifying; GM is moving to double its defense revenue as automotive tech integrates into weapons production.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Anthropic IPO:</strong> The upcoming listing is expected to redistribute power among venture capital firms and provide a $100bn windfall for early investors.</li><li><strong>Defense consolidation:</strong> European firms are eyeing space-sector mergers, specifically between Iceye and Avio, to scale military capabilities.</li></ul>", "middle east war": "<p>The Middle East is spiraling into a multi-front conflict as direct US-Iran hostilities collide with internal Israeli political instability.</p><p><strong>Why it matters:</strong> Escalation in the Gulf threatens global energy corridors and food security, while Israel's domestic fragility weakens its strategic posture.</p><p><strong>The Gulf Flashpoint</strong></p><ul><li><strong>Direct Combat:</strong> The US and Iran have exchanged fire, with US strikes hitting Qeshm Island and tankers in the Strait of Hormuz.</li><li><strong>Regional Spillover:</strong> Iran has launched barrages against Bahrain and Kuwait, ending months of relative calm.</li><li><strong>Yemen Shift:</strong> Saudi-backed forces are retreating from the Red Sea, granting Houthis greater control over the Bab al-Mandeb Strait.</li></ul><p><strong>Israel's Internal Crisis</strong></p><ul><li><strong>Political Fracture:</strong> The appointment of Matan Kahana as Speaker and shifts within Haredi parties threaten Benjamin Netanyahu’s coalition.</li><li><strong>Diplomatic Isolation:</strong> The UK is sanctioning settlement firms, and the US-Israel alliance has reached a \"crisis point.\"</li><li><strong>Legal Friction:</strong> The Attorney General froze the E1 settlement project, a key pillar of the far-right agenda.</li></ul><p><strong>Between the lines</strong> The US is pivoting away from diplomacy. President Trump has signaled an end to Iran peace deal efforts, prioritizing domestic concerns over regional stability.</p><p><strong>What's next</strong> Watch for the fallout of the US-Iran kinetic exchanges. If the Strait of Hormuz remains volatile, global shipping costs and food supply chains—already strained in the UAE—will spike.</p>", "shipping": "<p>Global shipping is fracturing as geopolitical conflict and climate change force a massive redirection of trade routes.</p><p><strong>Why it matters:</strong> Escalating violence in the Black Sea and Strait of Hormuz is driving up operational costs and risking a global energy price shock.</p><p><strong>The danger zones</strong></p><ul><li><strong>Black Sea:</strong> Now the world's deadliest shipping route; Russia is diverting grain to the Arctic to bypass combat zones.</li><li><strong>Strait of Hormuz:</strong> Iran has targeted 24 vessels in two weeks, causing oil prices to jump and transit volumes to fall.</li><li><strong>The Cost:</strong> Captains are earning $100,000 monthly bonuses to navigate these high-risk waters.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Arctic Boom:</strong> Transits via the Northern Sea Route have quadrupled due to melting ice and Middle East instability.</li><li><strong>UK Infrastructure:</strong> DP World’s London Gateway is poised to overtake Felixstowe, fueled by a surge in Chinese EV imports.</li><li><strong>Corporate Pivot:</strong> Maersk is aggressively buying ships to compete with CMA CGM despite a 10% dip in share price.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$200:</strong> The potential price per barrel of oil warned by Vitol if shipping bottlenecks persist.</li><li><strong>$2 billion:</strong> The scale of a US oil trader's gamble on tankers to bypass Hormuz.</li><li><strong>24.6 million:</strong> Daily barrels of Middle East oil exports, currently exceeding pre-war levels via alternative routes.</li></ul><p><strong>What's next:</strong> Watch for New Jersey's potential blockade of Russian diesel cargoes, which could trigger a legal and political clash over US fuel shortages.</p>", "artificial intelligence": "<p>AI is shifting from speculative hype to a volatile phase of infrastructure stress and regulatory friction.</p><p><strong>Why it matters:</strong> Massive capital expenditures in data centers are hitting a wall of public opposition and financial risk. Meanwhile, the gap between AI's technical utility and its systemic reliability remains wide.</p><p><strong>By the numbers</strong></p><ul><li><strong>20%:</strong> Average decline of the year's ten biggest IPOs as the AI frenzy cools.</li><li><strong>$17 billion:</strong> Amazon's Ohio data center investment currently threatened by voter backlash.</li><li><strong>$900 billion:</strong> The scale of the data center bet underpinning Anthropic’s IPO trajectory.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Infrastructure fragility:</strong> Banks are offloading debt tied to chips and data centers as local communities revolt against Big Tech expansion.</li><li><strong>The \"Talisman\" risk:</strong> Markets are increasingly tying the valuation of AI giants to specific leaders, specifically Nvidia's Jensen Huang.</li><li><strong>Utility vs. Trust:</strong> AI is outperforming humans in niche tasks (e.g., KPMG audits) but fails to earn systemic trust due to existential risks and \"machine-readable\" corporate power shifts.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Regulatory pivot:</strong> The EU is accelerating pushes for global AI rules, sensing a window of opportunity following US political volatility.</li><li><strong>GDP impact:</strong> Economists suggest AI innovation could sustain higher US growth rates without triggering inflation.</li><li><strong>Hardware evolution:</strong> Focus is shifting toward specialized applications, including AI eyewear for the visually impaired and profitable industrial robotics in China.</li></ul>", "us-china relations": "<p>The U.S. and China are navigating a volatile shift toward a multipolar world where traditional superpower dominance is eroding.</p><p><strong>Why it matters:</strong></p><ul><li>U.S. political instability and potential retrenchment create a power vacuum that China is actively attempting to fill.</li><li>A shift toward \"great power\" deals—potentially involving Russia—threatens to replace international law with a \"carve-up\" of global influence.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"Big Three\" Illusion:</strong> Efforts by Trump, Xi, and Putin to act as global arbiters ignore the rising influence of \"middle powers\" and smaller nations.</li><li><strong>Strategic Opportunity:</strong> China views American domestic turmoil and a potential retreat from global security guarantees as a window to reshape the global order on its own terms.</li><li><strong>The Democracy Gap:</strong> The conflict in Ukraine serves as a proxy for the broader systemic struggle between democratic governance and autocratic stability.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Sovereignty shifts:</strong> Expect \"middle powers\" (like Australia) to prioritize economic diversification to avoid becoming collateral damage in U.S.-China competition.</li><li><strong>Security realignment:</strong> Europe must pivot toward strategic autonomy as it can no longer assume a consistent U.S. security umbrella.</li></ul>", "us elections": "<p>Democrats secured a sweeping midterm victory, shifting the balance of power in Washington and dealing a blow to Trump-led populism.</p><p><strong>Why it matters:</strong> The result signals a rejection of \"America First\" rhetoric and a strategic pivot by Democrats away from \"woke\" politics toward class-based economic issues.</p><p><strong>By the numbers</strong></p><ul><li><strong>56:</strong> The number of Senate seats now held by Democrats.</li><li><strong>1881:</strong> The last time a Black senator represented Mississippi until Scott Colom's historic win.</li><li><strong>$4.2tn:</strong> Market value lost in AI data center stocks amid a broader tech sell-off.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Demographic shifts:</strong> Older voters abandoned long-term political identities to fuel the \"blue wave.\"</li><li><strong>Gerrymandering failure:</strong> Republican redistricting efforts failed to stop the Democratic surge.</li><li><strong>Media collapse:</strong> Trump's grip on the podcast and new media landscape weakened.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Leadership transitions:</strong> Hakeem Jeffries is set to become the first Black House Speaker.</li><li><strong>Internal GOP struggle:</strong> Republicans must decide between maintaining \"America First\" or returning to pragmatism.</li><li><strong>2028 outlook:</strong> New York socialists are already backing Alexandria Ocasio-Cortez for the presidency.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is struggling to project stability as internal coalition fractures and the rise of the far-right AfD undermine Germany's leadership in Europe.</p><p><strong>Why it matters:</strong> Domestic instability weakens Berlin's leverage in the EU and NATO. Inconsistent governance delays critical defense procurement and budget agreements necessary to counter Russian aggression.</p><p><strong>The internal crisis</strong></p><ul><li><strong>Coalition collapse:</strong> The resignation of Labor Minister Bärbel Bas stalls pension and labor reforms.</li><li><strong>Policy deadlock:</strong> Disagreements between the Chancellor and Finance Minister have frozen appointments to the ECB.</li><li><strong>AfD surge:</strong> The far-right is infiltrating regional governments and deterring foreign investment.</li></ul><p><strong>Defense and Security</strong></p><ul><li><strong>Strategic setbacks:</strong> Italy rejected Germany's bid for equal partnership in the UK-Japan-Italy fighter jet project.</li><li><strong>Nuclear tension:</strong> France is demanding clarity on Germany's long-range missile doctrine to prevent accidental nuclear escalation.</li><li><strong>Espionage:</strong> The government warned MPs of iPhone hacks amid \"intense\" Russian intelligence operations.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>98%:</strong> The projected debt-to-GDP ratio by 2040 if military spending is not shifted to the regular budget.</li><li><strong>€2 trillion:</strong> The EU budget deal currently at risk due to Merz's diminished political authority.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Presidential /* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>18 Nov 2026 18:58 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
