.meta-row{font-size:.8rem;color:#94a3b8;padding:.25rem 0 1.25rem;border-bottom:1px solid #e4e8ef;margin-bottom:1.5rem}

.summary-banner-inner p{margin:.4rem 0}

.summary-banner-inner li{margin:.2rem 0}
.summary-banner-label{font-size:.72rem;font-weight:700;text-transform:uppercase;

/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── card ── */
.card{background:#fff;border-radius:12px;padding:1.25rem 1.4rem 1.1rem;

.badge{padding:.18rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:700;

.card-date{font-size:.75rem;color:#94a3b8;flex-shrink:0;padding-top:.1rem}

.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:#4f46e5;text-decoration:underline}
.card-summary{font-size:.83rem;color:#64748b;line-height:1.5;

  .grid{grid-template-columns:1fr;padding:0 1rem 3rem}

const SUMMARIES = {"oil and gas": "<p>Global oil markets are facing a critical supply squeeze driven by shipping bottlenecks and depleted reserves.</p><p><strong>Why it matters:</strong> A combination of Russian export bans and Middle East instability is stripping the world of its safety net. This creates a high-probability path toward extreme price volatility and systemic inflation.</p><p><strong>The supply crunch</strong></p><ul><li><strong>Tanker shortage:</strong> Vitol warns shipping bottlenecks could push crude toward $200 a barrel.</li><li><strong>Thin buffers:</strong> Saudi Aramco reports global stockpiles are \"scarily thin\" and may take two years to recover.</li><li><strong>Russian curbs:</strong> Moscow has extended diesel export bans following refinery strikes, tightening global fuel availability.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>US pressure:</strong> The Trump administration is pressuring the EU to release strategic diesel reserves under threat of US export bans.</li><li><strong>UK instability:</strong> Equinor warns that blocking North Sea projects (Rosebank, Jackdaw) makes the region \"uninvestable.\"</li><li><strong>Investment shifts:</strong> South Korea has pledged $200 billion for US energy projects in Alaska and Texas.</li></ul><p><strong>Economic fallout</strong></p><ul><li><strong>Refinery windfalls:</strong> US refiners have seen margins increase fourfold as wars drive up consumer fuel costs.</li><li><strong>Inflation risk:</strong> The ECB is warning that high energy prices are fueling wider Eurozone inflation, necessitating preemptive rate action.</li><li><strong>Household impact:</strong> UK energy price caps are forecast to hit nearly £2,000 due to Iranian conflict tensions.</li></ul><p><strong>Between the lines:</strong> The industry is shifting from a period of stability to one of \"disruption.\" While majors like TotalEnergies see opportunity in turmoil, the broader economy faces a structural diesel deficit that the Dallas Fed suggests will last at least a year.</p>", "corporate earnings and results": "<p>Corporate consolidation is accelerating across healthcare, media, and telecoms as firms chase scale and cost efficiencies.</p><p><strong>Why it matters:</strong> High interest rates and shifting valuations are forcing companies to merge to survive or optimize margins.</p><p><strong>The big deals</strong></p><ul><li><strong>Media:</strong> Paramount and Warner Bros. closed a $111B merger to form Skydance, targeting $6B in cost savings.</li><li><strong>Healthcare:</strong> McKesson and CD&R are acquiring Option Care Health for $5.8B, capitalizing on low valuation multiples.</li><li><strong>Events:</strong> Informa is buying Clarion from Blackstone for £2.2B to pivot toward live operations.</li><li><strong>Telecoms:</strong> BT acquired TalkTalk, though the deal likely leaves most TalkTalk creditors with zero recovery.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory shifts:</strong> Sainsbury’s is pursuing Morrisons, signaling a belief that regulators are now more open to retail consolidation.</li><li><strong>Sector instability:</strong> Private equity consolidation in accountancy is making traditional partnership models unsustainable.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Fiscal uncertainty:</strong> UK banks (Barclays, HSBC, NatWest) face potential tax increases as Chancellor Healey warns of a \"challenging\" fiscal picture.</li><li><strong>Cyber risk:</strong> AI-driven attacks on banks are creating a \"new kind of crisis,\" as highlighted by South Korea's president.</li></ul>", "middle east war": "<p>The Middle East is sliding toward a wider regional conflict as Iran-linked security breaches trigger massive U.S. military reinforcements.</p><p><strong>Why it matters:</strong> Escalating tensions between the U.S., UK, and Iran are shifting from proxy skirmishes to direct threats against Western military infrastructure.</p><p><strong>The flashpoints</strong></p><ul><li><strong>RAF Fairford:</strong> The U.S. recalled B-1 bombers from the UK base following an alleged Iranian-backed terror plot.</li><li><strong>Yemen:</strong> Saudi Arabia deployed 100 fighter jets to support Yemeni forces attempting to recapture Sana’a and the Bab al-Mandab Strait.</li><li><strong>Aviation:</strong> The UAE and Israel are investigating a Flydubai hijacking attempt, with Australian authorities probing potential domestic links.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>Thousands:</strong> U.S. troops currently deploying to the region.</li><li><strong>1:</strong> Aircraft carrier (USS Theodore Roosevelt) arriving by late November.</li><li><strong>7:</strong> Arrests made in connection with the RAF Fairford security breach.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Strategic shifts:</strong> Saudi Arabia, Pakistan, and Turkey have triggered a mutual defense pact in response to Houthi attacks, though Turkey's lack of ratification limits ground troop deployment.</li><li><strong>Internal Israeli chaos:</strong> Netanyahu faces a volatile election cycle marked by settlement expansion and a Supreme Court ruling allowing Arab parties to run.</li></ul><p><strong>What's next</strong></p><ul><li><strong>U.S. Action:</strong> President Trump is weighing direct strikes on Iran as military assets consolidate in the region.</li><li><strong>Diplomatic friction:</strong> The UK may expel Israeli diplomats if the Jerusalem consulate is closed, signaling a fraying alliance.</li></ul>", "shipping": "<p>Global shipping is undergoing a structural shift as geopolitical conflict and climate change force a redesign of trade routes.</p><p><strong>Why it matters:</strong> Traditional maritime chokepoints are becoming liabilities. Diversion to Arctic routes and the rise of \"shadow fleets\" are eroding established international shipping rules.</p><p><strong>The volatility drivers</strong></p><ul><li><strong>Conflict:</strong> Attacks in the Strait of Hormuz and Bab al-Mandeb have spiked supertanker rates to record highs ($1.2M/day) and forced the U.S. to implement timed air-defense windows.</li><li><strong>Climate:</strong> Melting ice is quadrupling Northern Sea Route transits, while drought-driven cuts at the Panama Canal are straining global flows.</li><li><strong>Sanctions:</strong> Russia has expanded its fleet by 33% to bypass Western restrictions, fueling a \"shadow fleet\" that undermines global maritime authority.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>80%:</strong> Current level of Middle Eastern oil exports relative to pre-war averages.</li><li><strong>1/3:</strong> Growth in the number of ships sailing under the Russian flag.</li><li><strong>2028:</strong> Target date for the first U.S.-backed nuclear-powered merchant vessel.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asset flip:</strong> Old supertankers are now more valuable than new builds because immediate availability outweighs vessel age in a high-rate market.</li><li><strong>Security gaps:</strong> Digital vulnerability is rising as hackers target satellite links connected to critical engine and navigation systems.</li><li><strong>Green transition:</strong> Biodiesel is now cheaper than conventional fuel, and Maersk is piloting wind sails to cut long-term costs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Strategic pivots:</strong> South Korea is investing in Arctic trade to reduce reliance on the Strait of Hormuz and revive the port of Busan.</li><li><strong>Financialization:</strong> High returns from Middle East instability are attracting institutional investors and driving IPOs, such as Trafigura's Volare Shipping.</li></ul>", "artificial intelligence": "<p>AI is shifting from a speculative gold rush to a high-risk operational phase.</p><p><strong>Why it matters:</strong> Rapid deployment is creating systemic vulnerabilities in legal liability, financial stability, and geopolitical security.</p><p><strong>The risk landscape</strong></p><ul><li><strong>Legal liability:</strong> Insurers and lawyers are preparing for multimillion-dollar claims over \"rogue\" AI agents and security hacks at OpenAI.</li><li><strong>Identity theft:</strong> High-profile figures, including Italian PM Giorgia Meloni and Sony Music artists, are fighting deepfake impersonations.</li><li><strong>Academic friction:</strong> Students are hiring lawyers to challenge university AI misconduct accusations.</li></ul><p><strong>Financial volatility</strong></p><ul><li><strong>Concentration risk:</strong> Global pension funds are cutting US equities to avoid over-exposure to a few AI giants.</li><li><strong>Balance sheet strain:</strong> Amazon is attempting to offload $8bn in Nvidia chips to offset soaring AI spending.</li><li><strong>Pricing instability:</strong> Token price deflation and unpredictable compute costs are forcing a rethink of AI pricing models.</li></ul><p><strong>Geopolitical friction</strong></p><ul><li><strong>US-China rivalry:</strong> US startups are launching models to counter Chinese \"open\" models, while trade tensions block cross-border research.</li><li><strong>Industrial warfare:</strong> Japan and South Korea are deploying AI robotics in shipyards to challenge China's maritime dominance.</li></ul><p><strong>Between the lines</strong> The narrative is pivoting from \"will AI replace jobs\" to \"how do we manage the fallout.\" While economists dismiss total job loss, the focus has shifted to the \"disruptive change\" in work and the fragility of the infrastructure supporting the boom.</p><p><strong>What's next</strong> Watch for a wave of \"frontier lab\" IPOs (like Anthropic) to test whether public markets will sustain current valuations amid rising operational costs and legal threats.</p>", "us-china relations": "<p>The U.S. and China have entered a zero-sum era of systemic rivalry.</p><p><strong>Why it matters:</strong> The shift from \"win-win\" cooperation to strategic competition destabilizes global trade and security. This friction forces third-party nations to hedge their bets or align with a rising BRICS bloc.</p><p><strong>By the numbers</strong></p><ul><li><strong>GDP Shift:</strong> BRICS now accounts for a larger share of the global economy than the G7.</li><li><strong>AI Gap:</strong> U.S. national data center projects are consolidating an American lead in AI infrastructure.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Reliability Crisis:</strong> U.S. volatility regarding defense guarantees in South Korea and Japan is eroding trust in American security umbrellas.</li><li><strong>Tactical Dialogue:</strong> High-level summits are now tools for crisis management, not a return to détente.</li><li><strong>Institutional Flight:</strong> Potential U.S. funding cuts are prompting international organizations to consider leaving Geneva for Gulf or European capitals.</li></ul><p><strong>What's next</strong></p><ul><li><strong>BRICS Expansion:</strong> Expect the bloc to leverage its economic weight to challenge U.S. sanctions and tariffs.</li><li><strong>Tech Nationalism:</strong> Competition will intensify over AI hardware and data sovereignty as a primary source of geopolitical power.</li></ul>", "us elections": "<p>Economic volatility and shifting demographics are destabilizing Republican confidence ahead of the U.S. midterms.</p><p><strong>Why it matters:</strong> High inflation and housing costs are alienating rural and swing voters, forcing the GOP to pivot strategy to avoid historic losses.</p><p><strong>The economic pressure</strong></p><ul><li><strong>Affordability:</strong> Mortgage rates exceeding 7% and high fuel prices are driving voter anger.</li><li><strong>Diesel crisis:</strong> Republicans are pressuring Trump to ban diesel exports to lower costs in rural heartlands.</li><li><strong>Housing:</strong> Private equity firms are becoming primary targets as institutional investment drives up home prices.</li></ul><p><strong>The political friction</strong></p><ul><li><strong>The \"Moveable Middle\":</strong> Latino voters have emerged as the decisive swing demographic.</li><li><strong>Base divide:</strong> Trump’s alignment with Big Tech and AI is alienating traditional MAGA supporters.</li><li><strong>Legal battles:</strong> Supreme Court rulings on gerrymandering and voter immigration status are fueling Black voter mobilization.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1 billion:</strong> The scale of the Republican ad blitz intended to counter Trump's declining popularity.</li><li><strong>7%:</strong> The threshold breached by mortgage rates, intensifying the affordability crisis.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Senate volatility:</strong> Control of the Senate is currently \"on a knife edge,\" determining the viability of Trump's second-term agenda.</li><li><strong>AI diplomacy:</strong> The White House is attempting to soothe data center backlash through the AI Infrastructure Coalition.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is fighting for political survival as the far-right AfD dismantles the conservative stronghold in eastern Germany.</p><p><strong>Why it matters:</strong> The AfD's surge creates a power vacuum in the center, weakening Germany's leverage in EU budget negotiations and destabilizing the CDU's national leadership.</p><p><strong>The political shift</strong></p><ul><li><strong>Far-right ascent:</strong> The AfD secured a \"dream result\" in Saxony-Anhalt and gained its first regional parliament president via secret cross-party support.</li><li><strong>The \"Kingmaker\":</strong> The hard-left BSW party has emerged as a critical power broker, potentially enabling far-right influence.</li><li><strong>Generational gap:</strong> Younger voters are decoupling from postwar historical warnings, viewing fascism and communism as distant history.</li></ul><p><strong>The Merz crisis</strong></p><ul><li><strong>Electoral rout:</strong> Merz is facing \"disaster\" in regional polls, including a total loss of seats in Mecklenburg-Vorpommern.</li><li><strong>Leadership vacuum:</strong> Low popularity ratings have positioned North Rhine-Westphalia Premier Hendrik Wüst as the \"chancellor-in-waiting.\"</li><li><strong>Diplomatic cost:</strong> Merz's domestic weakness is hobbling his authority in Brussels regarding the EU's €2tn budget.</li></ul><p><strong>Between the lines</strong> The AfD is no longer seeking regional influence; its recent campaigns serve as a blueprint for seizing federal power.</p><p><strong>What's next</strong></p><ul><li><strong>Federal trajectory:</strong> The AfD is targeting 40% of the vote in the next federal election.</li><li><strong>Diplomatic pivots:</strong> Germany is maintaining high-stakes channels with Russia and Turkey to manage regional instability.</li><li><strong>Internal CDU struggle:</strong> Merz must deliver immediate policy wins to stave off a leadership challenge from Wüst.</li></ul>", "central banks": "<p>Central banks are facing a simultaneous crisis of institutional trust, market volatility, and emerging systemic risks.</p><p><strong>Why it matters:</strong> Political pressure and unpredictable bond markets are eroding the perceived independence and effectiveness of monetary policy.</p><p><strong>The primary pressures</strong></p><ul><li>  <strong>Political instability:</strong> The U.S. Fed is battling a decline in public trust following political attacks and internal leadership friction.</li><li>  <strong>Bond market turbulence:</strong> Rising yields in France and the U.S. are forcing a rethink of \"moneyness\" and pushing the ECB to consider pausing quantitative tightening (QT).</li><li>  <strong>New risk vectors:</strong> The Bank of England is warning that AI-driven debt surges could trigger a sharp market correction.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>2026:</strong> The year analysts expect a potential return to rate hikes to combat persistent inflation.</li><li>  <strong>October:</strong> The immediate window where Fed officials are signaling a \"hold\" on rates despite market volatility.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Tool exhaustion:</strong> There is a growing consensus that interest rates are a blunt instrument incapable of solving supply-side shocks or climate-driven inflation (e.g., El Niño in the Philippines).</li><li>  <strong>Security gaps:</strong> Watchdogs are warning that the U.S. central bank is vulnerable to foreign cyber and security breaches.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Remit reviews:</strong> The UK Parliament is questioning if the Bank of England's current mandate is \"fit for purpose\" amid populist pressure.</li><li>  <strong>Leadership shifts:</strong> Isabel Schnabel’s early departure from the ECB to the IMF will likely trigger a top-level reshuffle.</li></ul>", "us banks": "<p>Wall Street is pivoting toward AI-driven efficiency and asset management as traditional trading revenues plateau.</p><p><strong>Why it matters:</strong> Banks are aggressively restructuring talent pipelines and product offerings to offset slowing trading growth and navigate a shifting regulatory landscape under the Trump administration.</p><p><strong>The AI effect</strong></p><ul><li><strong>Cost pressure:</strong> Goldman, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the man-hours required for routine work.</li><li><strong>New revenue:</strong> Goldman earned $200M+ in fees from AI-focused hedge fund Situational Awareness, though the SEC is now subpoenaing banks over the fund's near-collapse.</li><li><strong>Infrastructure:</strong> Banks are offloading $15B in debt for Anthropic data centers to free up capital for further AI-related lending.</li></ul><p><strong>Strategic shifts</strong></p><ul><li><strong>Talent war:</strong> Citi is shortening its analyst program to two years to prevent private equity firms from poaching junior bankers.</li><li><strong>Asset growth:</strong> Goldman is acquiring ETF provider Neos for up to $2.3B to expand its asset management footprint.</li><li><strong>Tech adoption:</strong> BNY is moving records to blockchain to integrate traditional finance with digital assets.</li></ul><p><strong>Regulatory landscape</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks, signaling a broader deregulatory push.</li><li><strong>Political ties:</strong> Bank of America pledged $250B to US projects to align with the \"America First\" agenda.</li><li><strong>SVB fallout:</strong> Postmortems continue to highlight a \"culture of risk aversion\" among regulators that contributed to the Silicon Valley Bank collapse.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$74B:</strong> Assets Morgan Stanley hauled into wealth management following high-profile IPOs like SpaceX.</li><li><strong>38%:</strong> The drop in Shein's share price since its Hong Kong listing, despite a $220M investment from Goldman.</li><li><strong>$20B:</strong> The target valuation for Polymarket, despite JPMorgan \"debanking\" the platform over regulatory concerns.</li></ul>"};

  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>06 Oct 2026 16:56 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
