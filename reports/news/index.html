const SUMMARIES = {"oil and gas": "<p>AI demand is forcing a global pivot back to fossil fuels and nuclear power.</p><p><strong>Why it matters:</strong> The energy intensity of AI data centers is outpacing the rollout of renewables, creating a \"power gap\" that threatens climate goals and spikes electricity costs.</p><p><strong>The AI effect</strong></p><ul><li><strong>Fossil fuel resurgence:</strong> US spending on fossil fuel power is set to surpass China's for the first time in decades due to gas turbine demand.</li><li><strong>Nuclear revival:</strong> Holtec is pursuing an IPO as AI-driven energy needs make nuclear power commercially \"rational\" again.</li><li><strong>Grid strain:</strong> US regulators (FERC) are issuing ultimatums to grid operators to justify how \"large loads\" from data centers are connected.</li><li><strong>Storage boom:</strong> Battery start-ups report \"crazy\" demand to manage power surges caused by AI processor clusters.</li></ul><p><strong>Geopolitical shifts</strong></p><ul><li><strong>Canada:</strong> Planning a new pipeline to Asia to export 1mn barrels per day and reduce reliance on the US.</li><li><strong>Falklands:</strong> Potential commercial production by 2028 is sparking diplomatic tension with Argentina.</li><li><strong>UK:</strong> Ministers shifted biofuel stances following US lobbying, raising concerns over carbon emission targets.</li></ul><p><strong>Corporate volatility</strong></p><ul><li><strong>Leadership:</strong> BP faces further instability as Deputy CEO Carol Howle retires shortly after appointment.</li><li><strong>Legal:</strong> Shell faces allegations of misleading UK courts regarding pollution in the Niger Delta.</li><li><strong>M&A:</strong> Top investors are blocking a £5.7bn private equity bid for energy group DCC.</li></ul><p><strong>What's next:</strong> Expect a surge in clean power purchase agreement prices as Biden-era subsidies expire and Big Tech competition for energy intensifies.</p>", "corporate earnings and results": "<p>Corporate consolidation is accelerating across the AI supply chain, aviation, and media sectors.</p><p><strong>Why it matters:</strong> High-interest rates and streaming competition are forcing legacy firms to scale rapidly or spin off non-core assets to unlock shareholder value.</p><p><strong>The big deals</strong></p><ul><li><strong>Honeywell:</strong> Spinning off a materials business via a $14.5B deal for Element to target the AI supply chain.</li><li><strong>EasyJet:</strong> Reached an outline agreement for a £5.5B takeover by US private credit group Castlelake.</li><li><strong>Sky:</strong> Agreed to a £1.6B deal with ITV to combat streaming rivals.</li><li><strong>Novartis:</strong> Acquiring a UK biotech firm for $1.5B to bolster cancer research.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Private Credit dominance:</strong> Castlelake's EasyJet bid and massive institutional inflows into private credit signal a shift away from public equity for large-scale acquisitions.</li><li><strong>AI Capital Intensity:</strong> OpenAI and Anthropic face \"punishing\" costs to maintain frontier status, complicating potential IPO paths.</li><li><strong>Strategic Pivots:</strong> Baillie Gifford is implementing \"voluntary exits\" to refocus on US and Asian family offices.</li></ul><p><strong>What's next</strong> Watch for further \"SaaS\" consolidation as companies move from growth-at-all-costs to protecting \"moats\" through strategic M&A.</p>", "middle east war": "<p>The U.S.-Iran conflict is entering a volatile transition phase as Tehran mourns its supreme leader and Washington pursues a fragile ceasefire.</p><p><strong>Why it matters:</strong> The death of Ayatollah Ali Khamenei creates a power vacuum in Iran, while a tentative ceasefire is stabilizing global energy arteries and financial markets.</p><p><strong>The state of play</strong></p><ul><li><strong>Iran's transition:</strong> Millions are attending Khamenei's funeral to signal regime unity, though the absence of successor Mojtaba Khamenei suggests internal friction.</li><li><strong>Diplomatic efforts:</strong> U.S. envoys Witkoff and Kushner are in Doha for deal talks, though direct meetings with Iranian officials are not currently planned.</li><li><strong>Regional ripple effects:</strong> Lebanon's stability remains tethered to the Iran-U.S. outcome, while Syria is restructuring its parliament to replace Assad-era laws.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>4x:</strong> The increase in ship transits through the Strait of Hormuz since the ceasefire began.</li><li><strong>$60:</strong> The projected price of Brent crude per barrel by Christmas, per Citi forecasts.</li><li><strong>195,000:</strong> U.S. defense jobs sustained by Europe's rearmament drive.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political risk:</strong> In the U.S., the cost of the Iran war is actively dragging down presidential approval ratings ahead of midterms.</li><li><strong>Institutional strain:</strong> In Israel, the Netanyahu government is risking a constitutional crisis by defying Supreme Court rulings on TV regulation.</li><li><strong>NATO friction:</strong> Turkey is using the NATO summit backdrop to crack down on domestic political rivals and journalists.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Market shift:</strong> Investors are pivoting from war-related volatility toward a \"new AI trade.\"</li><li><strong>Security pressure:</strong> The U.S. is explicitly linking NATO \"goodies\" to increased defense spending by allies.</li></ul>", "shipping": "<p>Global shipping is facing a volatile convergence of geopolitical conflict, trade wars, and strategic consolidation.</p><p><strong>Why it matters:</strong> Instability in the Strait of Hormuz and the English Channel is forcing vessels into costly detours, while looming US tariffs are triggering a massive, artificial surge in cargo volume.</p><p><strong>The Hormuz Crisis</strong> A recent blockade and subsequent US-Iran accord have left the waterway in flux:</p><ul><li><strong>The Backlog:</strong> Nearly 1,200 ships carrying $125B in goods were stranded.</li><li><strong>The Cost:</strong> Iran is now seeking to implement mandatory \"insurance fees\" for passage.</li><li><strong>The Risk:</strong> Vessel operators remain hesitant to return to full capacity until the ceasefire is deemed \"material.\"</li></ul><p><strong>The Shadow Fleet War</strong> Sanctioned Russian tankers are under increasing pressure from Western navies:</p><ul><li><strong>Interceptions:</strong> UK naval actions in the English Channel are forcing \"dark\" tankers to take longer North Atlantic routes.</li><li><strong>Escalation:</strong> Ukraine is currently seeking legal justification to strike shadow fleet vessels directly.</li></ul><p><strong>Trade & Logistics Shifts</strong> Market players are repositioning to hedge against political instability:</p><ul><li><strong>Tariff Rush:</strong> Maersk is raising profit guidance as US companies stockpile goods to beat upcoming levies, driving freight rates to their highest levels since the Red Sea crisis.</li><li><strong>Consolidation:</strong> CMA CGM is spending $1.4B to acquire a FedEx logistics unit to deepen its US supply chain footprint.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$125B:</strong> Value of goods stranded during the Hormuz blockade.</li><li><strong>400+:</strong> Ships currently waiting for full reopening of the Strait of Hormuz.</li><li><strong>$1.4B:</strong> Value of the FedEx-CMA CGM logistics deal.</li></ul>", "artificial intelligence": "<p>AI is shifting from a technical novelty to a geopolitical and regulatory battleground.</p><p><strong>Why it matters:</strong> National security and economic sovereignty now depend on AI control. Divergent regulatory paths between the US, UK, and EU are creating fragmented global markets.</p><p><strong>The geopolitical divide</strong></p><ul><li><strong>US Strategy:</strong> The Trump administration signals a move away from centralized regulation to maintain a competitive edge.</li><li><strong>UK Ambition:</strong> London is fighting to avoid becoming a \"US outpost\" by pivoting AI strategy toward local community utility.</li><li><strong>EU Bottleneck:</strong> Excessive red tape, rather than lack of funding, is stalling European competitiveness.</li></ul><p><strong>Key frictions</strong></p><ul><li><strong>Infrastructure:</strong> Local protests are killing data center projects, such as Blackstone's Virginia campus.</li><li><strong>Security:</strong> Anthropic is struggling to block Chinese users from bypassing Claude's restrictions.</li><li><strong>Labor:</strong> AI-generated legal filings are overwhelming employment tribunals.</li></ul><p><strong>The power play</strong></p><ul><li><strong>OpenAI:</strong> Sam Altman is exploring a 5% equity stake for the US government to align political interests.</li><li><strong>Safety:</strong> A tension exists between lab-led safety proposals and demands for democratic oversight.</li></ul><p><strong>What's next:</strong> Watch for the White House's upcoming AI model standards, which will define the baseline for government intervention in model rollouts.</p>", "us-china relations": "<p>US-China relations are shifting toward a volatile \"might is right\" era defined by military brinkmanship and economic warfare.</p><p><strong>Why it matters:</strong> The erosion of the rules-based order increases the risk of direct conflict. Both nations are pursuing hegemony while avoiding the diplomatic responsibilities of global leadership.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Military escalation:</strong> China is testing strategic capabilities, including submarine-launched ballistic missiles in Pacific zones.</li><li>  <strong>Resource warfare:</strong> Beijing is weaponizing critical minerals, evidenced by the detention of Japanese nationals over rare earth smuggling.</li><li>  <strong>Economic instability:</strong> The IMF warns that \"tit-for-tat\" trade wars are self-defeating and threaten global growth.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>The Russia factor:</strong> Putin’s strategic errors have created a one-sided dependency on Beijing, granting China significant leverage.</li><li>  <strong>The leadership vacuum:</strong> As the US retreats from traditional hegemony, China is positioning itself as a \"pillar of stability\" to attract foreign officials.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance reshuffling:</strong> Middle powers like Japan are prioritizing \"resilience\" and new capabilities to survive great power competition.</li><li>  <strong>Strategic instability:</strong> The lack of a coordinated global framework increases the likelihood of miscalculation in narrow seas and contested zones.</li></ul>", "us elections": "<p>Internal party fractures and economic discontent are reshaping the U.S. electoral landscape.</p><p><strong>Why it matters:</strong> Ideological shifts within both parties are creating volatility. Democrats face a progressive insurgency, while Republicans risk alienating moderate voters by prioritizing MAGA loyalty over general electability.</p><p><strong>The Democratic divide</strong></p><ul><li><strong>Leftward shift:</strong> Socialist victories in Colorado and New York signal a growing rejection of party establishment leadership.</li><li><strong>Internal turmoil:</strong> Misconduct allegations against candidates in Maine are complicating the party's path to Senate gains.</li></ul><p><strong>The Republican risk</strong></p><ul><li><strong>The \"MAGA\" gamble:</strong> Trump-backed candidates, such as Ken Paxton in Texas, dominate primaries but may struggle with general election moderates.</li><li><strong>Base erosion:</strong> Evangelicals are questioning Trump's rhetoric, while tariffs are alienating key rural sectors like Maine's lobster industry.</li></ul><p><strong>Economic and foreign pressure</strong></p><ul><li><strong>Inflation:</strong> Polls show voters increasingly blame Trump for high grocery prices and the cost of living.</li><li><strong>Iran conflict:</strong> Bipartisan disquiet over the Iran war has led the House and Senate to move toward reining in presidential war powers.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California's gauge:</strong> The governor's race between Steve Hilton and Xavier Becerra will serve as a bellwether for the national appetite for MAGA-aligned politics.</li><li><strong>The 2028 horizon:</strong> A DoJ probe into Gavin Newsom is already influencing early speculation regarding the next presidential cycle.</li></ul>", "german politics": "<p>Chancellor Friedrich Merz is pivoting Germany toward a debt-fueled military expansion and market-driven economic overhaul.</p><p><strong>Why it matters:</strong> Berlin is abandoning its historic fiscal restraint to address security gaps and stagnant growth, signaling a fundamental shift in Germany's role within Europe and the global order.</p><p><strong>The military pivot</strong></p><ul><li><strong>Spending:</strong> Berlin will borrow €800bn for rearmament, the largest debt surge since reunification.</li><li><strong>Procurement:</strong> The government is overhauling its arms agency to speed up spending and buying a 40% stake in tank maker KNDS.</li><li><strong>Friction:</strong> Germany is ditching France for a new fighter jet project to ensure leadership commensurate with its financial input.</li><li><strong>Failures:</strong> Cost overruns led Berlin to scrap the F126 frigate, its largest planned warship since WWII.</li></ul><p><strong>Economic restructuring</strong></p><ul><li><strong>Growth:</strong> Merz is implementing €10bn in tax cuts and pushing for a Swedish-style public pension fund invested in capital markets.</li><li><strong>Labor:</strong> The coalition agreed to tighter sick-leave rules and expanded Sunday opening hours.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Political instability</strong></p><ul><li><strong>Far-right surge:</strong> The AfD currently leads opinion polls, fueled by fuel price anger and ties to Kremlin associates.</li><li><strong>Internal rift:</strong> Merz faces \"chancellor swap\" rumors as younger conservative Hendrik Wüst gains popularity.</li><li><strong>Security:</strong> Intelligence agencies warn of rising left-wing terrorism reacting to far-right extremism and Middle East conflicts.</li></ul><p><strong>What's next:</strong> Watch for the Bundestag's vote on the Strait of Hormuz mission and the potential IPO of KNDS.</p>", "central banks": "<p>Central banks are navigating a volatile transition defined by leadership shifts and technological disruption.</p><p><strong>Why it matters:</strong> New leadership at the Fed and shifting inflation dynamics are creating market instability. Divergent policies across G7 nations risk systemic financial fragmentation.</p><p><strong>The Warsh Effect</strong> New Fed Chair Kevin Warsh is pivoting away from traditional guidance:</p><ul><li><strong>End of \"Dot Plots\":</strong> Warsh is axing forward guidance, leading to increased rate volatility and higher borrowing costs.</li><li><strong>Independence:</strong> He has vowed to maintain price stability despite potential White House pressure.</li><li><strong>AI Optimism:</strong> Warsh expects AI to drive productivity-based growth, though BoE officials warn AI-powered trading may require \"kill switches\" to prevent market crashes.</li></ul><p><strong>Global Divergence</strong> Central banks are no longer moving in lockstep:</p><ul><li><strong>ECB:</strong> President Lagarde signals a shift toward \"modest\" rate increases rather than the aggressive force used in 2022.</li><li><strong>Bank of Japan:</strong> Authorities are using opaque tactics to defend the yen after it hit a 40-year low.</li><li><strong>Bank of England:</strong> Moving to limit hedge fund leverage in the gilt market to increase resilience, despite risks of higher funding costs.</li></ul><p><strong>Between the lines</strong> The era of predictable \"Fedspeak\" is ending. By removing the roadmap for interest rates, the Fed is shifting the burden of risk onto investors, which may increase short-term turbulence in exchange for long-term flexibility.</p><p><strong>What's next</strong></p><ul><li><strong>Legal Battles:</strong> Continued tension over the executive branch's power to remove Fed governors.</li><li><strong>QT Rethink:</strong> Pressure to adjust Quantitative Tightening programs as geopolitical crises (e.g., Iran) disrupt balance sheet reductions.</li><li><strong>Private Shift:</strong> Sovereign wealth funds are moving capital from public markets to private credit to capture AI growth.</li></ul>", "us banks": "<p>US banks are leveraging deregulation and international expansion to drive growth while facing internal leadership volatility.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing lenders to aggressively pursue acquisitions and global retail markets.</p><p><strong>The JPMorgan Shuffle</strong> CEO Jamie Dimon is resetting the succession timeline.</p><ul><li><strong>The purge:</strong> Longtime contender Marianne Lake was abruptly removed from the CEO race.</li><li><strong>The new guard:</strong> Doug Petno and Troy Rohrbaugh now lead the bank's largest divisions.</li><li><strong>The war chest:</strong> Dimon suggests the bank could spend $20B on new acquisitions due to regulatory easing.</li></ul><p><strong>Global Strategy</strong> Wall Street is pivoting toward high-growth and high-risk regions.</p><ul><li><strong>China boom:</strong> Goldman, Morgan Stanley, and JPMorgan reported record profits in China securities units.</li><li><strong>European push:</strong> JPMorgan is expanding its digital retail bank into France, Spain, and Italy.</li><li><strong>Security risks:</strong> Morgan Stanley is issuing China-only iPhones to Hong Kong staff to protect data.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital handed back to US and UK banks via deregulation.</li><li><strong>$700 billion:</strong> Potential losses for US banks in a severe economic crash, per Fed stress tests.</li><li><strong>$114 billion:</strong> Revenue for non-bank trading firms (e.g., Citadel, Jane Street) challenging traditional banks.</li></ul><p><strong>Between the lines</strong> The industry is entering a period of \"regulatory arbitrage.\" While US banks lobby to ease Basel capital rules, they face rising competition from agile private trading firms and internal instability at the executive level.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>06 Jul 2026 14:06 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
