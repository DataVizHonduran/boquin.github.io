const SUMMARIES = {"oil and gas": "<p>AI demand is forcing a massive pivot back to fossil fuels in the U.S.</p><p><strong>Why it matters:</strong> Data center power requirements are outpacing renewable deployment. This creates a \"perfect storm\" of rising clean energy prices and a renewed reliance on gas turbines to prevent grid collapse.</p><p><strong>The AI energy crunch</strong></p><ul><li><strong>Fossil fuel resurgence:</strong> U.S. spending on fossil fuel power is set to surpass China's for the first time in decades.</li><li><strong>Grid instability:</strong> FERC has issued a 60-day ultimatum to grid operators to justify how they connect \"large loads\" (data centers).</li><li><strong>Price spikes:</strong> Clean power purchase agreements are soaring as AI demand hits just as Biden-era subsidies expire.</li><li><strong>Storage gap:</strong> Battery start-ups are seeing \"crazy\" demand to smooth power surges caused by AI processor clusters.</li></ul><p><strong>Global strategic shifts</strong></p><ul><li><strong>Canada:</strong> Planning a new pipeline to Asia (1mn barrels/day) to end dependence on U.S. markets.</li><li><strong>Argentina:</strong> Tensions are rising over potential commercial oil production in the Falklands by 2028.</li><li><strong>China:</strong> China Resources New Energy raised $3.6bn in Asia's largest IPO this year, signaling strong retail appetite for energy.</li></ul><p><strong>Corporate volatility</strong></p><ul><li><strong>BP:</strong> Deputy CEO Carol Howle is retiring less than three months after her appointment, marking further leadership upheaval.</li><li><strong>Shell:</strong> Facing new allegations of misleading UK courts regarding pollution in the Niger Delta.</li><li><strong>Eni & Mercuria:</strong> Forming a partnership to capture commodity trading profits.</li></ul><p><strong>Between the lines:</strong> The \"green transition\" is hitting a physical wall. Big Tech's AI ambitions are currently incompatible with existing renewable capacity, handing a strategic lifeline to natural gas and traditional oil infrastructure.</p>", "corporate earnings and results": "<p>Corporate earnings are shifting as legacy industries pivot to efficiency and digital-first models.</p><p><strong>Why it matters:</strong> Companies are prioritizing margin expansion and cost-cutting to offset declining user bases or shifting consumer habits.</p><p><strong>The bottom line</strong></p><ul><li><strong>Big Tobacco:</strong> Financials are improving despite falling smoker numbers due to aggressive workforce reductions.</li><li><strong>UBS:</strong> Targeting an 18% pre-tax profit margin in its U.S. wealth business by 2028.</li><li><strong>Sony:</strong> Transitioning away from physical discs to digital distribution to align with consumer behavior and reduce overhead.</li><li><strong>Burberry:</strong> Reporting operating profit again following a new executive reward policy designed to align leadership with performance.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Efficiency over growth:</strong> Tobacco and UBS are focusing on internal margins rather than expanding their customer footprints.</li><li><strong>Digital migration:</strong> Sony's move signals a broader corporate trend of eliminating physical supply chains to capture higher recurring revenue.</li></ul><p><strong>What's next</strong> Investors will monitor if these efficiency gains can sustain stock valuations as traditional markets saturate.</p>", "middle east war": "<p>The U.S. and Iran have reached a tentative ceasefire to halt strikes and resume diplomatic talks.</p><p><strong>Why it matters:</strong> A sustained truce reduces the immediate risk of a regional escalation that has volatile impacts on global energy markets and shipping lanes.</p><p><strong>The current state</strong></p><ul><li><strong>Diplomacy:</strong> U.S. envoys Steve Witkoff and Jared Kushner are in Doha for high-level meetings, though Tehran has not officially confirmed further negotiations.</li><li><strong>Logistics:</strong> Ship transits through the Strait of Hormuz have quadrupled over the past week as tankers return.</li><li><strong>Internal Iran:</strong> The regime is using the massive funeral for the slain Supreme Leader Ayatollah Ali Khamenei to project strength and public unity.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$60:</strong> The potential price of Brent crude per barrel by Christmas, according to Citi, as the market shifts toward a surplus.</li><li><strong>195,000:</strong> The number of U.S. defense jobs sustained by Europe's current rearmament drive.</li><li><strong>15-year low:</strong> The risk level for EU gas stocks heading into winter due to slow refilling.</li></ul><p><strong>Between the lines</strong> The ceasefire is fragile. While markets are rebounding and shipping is resuming, Hezbollah and its allies are already signaling they will not adhere to the U.S.-backed peace deal in Lebanon.</p><p><strong>What's next</strong> Watch for the official outcome of the Doha talks and whether the Iranian regime can maintain internal stability following the transition of power.</p>", "shipping": "<p>Global shipping is facing a volatile convergence of geopolitical conflict and trade policy shifts.</p><p><strong>Why it matters:</strong> Disruptions in the Strait of Hormuz and the rise of \"shadow fleets\" are destabilizing energy flows, while anticipated U.S. tariffs are triggering a surge in freight costs.</p><p><strong>The Hormuz Crisis</strong> A recent blockade and subsequent fragile US-Iran accord have left the waterway in flux:</p><ul><li><strong>The Backlog:</strong> Nearly 1,200 ships carrying $125B in goods were stranded; 400+ vessels remain waiting for full reopening.</li><li><strong>New Costs:</strong> Iran is seeking to implement mandatory \"insurance fees\" for passage.</li><li><strong>Operational Strain:</strong> Safe routes are limited to half of pre-war levels, causing fuel shortages and crew burnout.</li></ul><p><strong>Trade & Geopolitics</strong> Political instability is reshaping logistics and pricing:</p><ul><li><strong>Tariff Rush:</strong> Shipping rates have hit their highest levels since the 2024 Red Sea crisis as firms race to beat new Trump tariffs.</li><li><strong>Shadow Fleets:</strong> The UK is actively intercepting Russian tankers to curb war funding, while Ukraine argues for the legal right to attack these vessels.</li><li><strong>Strategic Shifts:</strong> FedEx is selling its logistics unit to France's CMA CGM for $1.4B to strengthen US supply chain footprints.</li></ul><p><strong>Between the lines</strong> The industry is shifting from \"just-in-time\" to \"just-in-case\" logistics. Increased defense spending is benefiting shipbuilding hubs in the UK and South Korea, signaling a long-term pivot toward militarized maritime security.</p><p><strong>What's next</strong> Watch for the 60-day window on the US-Iran deal. If Tehran successfully implements passage fees, it will create a permanent new cost layer for global oil transit.</p>", "artificial intelligence": "<p>AI is shifting from a theoretical tool to a disruptive force triggering systemic legal, political, and economic friction.</p><p><strong>Why it matters:</strong> Rapid deployment is outpacing governance, creating volatility in financial markets and overloading judicial systems. National security concerns are forcing a fragmented \"AI geography\" through strict access controls and localized strategies.</p><p><strong>The friction points</strong></p><ul><li>  <strong>Legal:</strong> AI-generated employment claims are overwhelming tribunal systems.</li><li>  <strong>Financial:</strong> Central banks warn of \"herding behavior\" in AI trading, potentially requiring emergency kill switches.</li><li>  <strong>Infrastructure:</strong> Local protests are successfully halting data center expansions, such as Blackstone's Virginia project.</li><li>  <strong>Geopolitical:</strong> Anthropic is tightening loopholes to block Chinese access; the UK is pivoting its strategy to favor local communities over US firms.</li></ul><p><strong>Political maneuvering</strong></p><ul><li>  <strong>OpenAI:</strong> Sam Altman is proposing a 5% stake for the Trump administration to mitigate political pressure.</li><li>  <strong>White House:</strong> The US government is accelerating AI model standards following interventions in OpenAI and Anthropic rollouts.</li><li>  <strong>Europe:</strong> Experts argue red tape, not a lack of funding, is the primary barrier to EU tech competitiveness.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Sector expansion:</strong> Anthropic's \"Claude Science\" signals a pivot toward high-revenue pharma and drug discovery.</li><li>  <strong>Regulatory shift:</strong> A move toward citizen-led rule-making to replace the current lab-driven safety approach.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony as the U.S.-led world order fractures.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Economic instability:</strong> \"Tit-for-tat\" trade wars and critical mineral disputes threaten global supply chains and GDP.</li><li>  <strong>Power vacuum:</strong> Washington's perceived retreat from global leadership creates a void that Beijing is attempting to fill through diplomatic outreach and \"tribute\" systems.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Asymmetric alliance:</strong> China's bet on Russia has created a one-sided relationship, granting Beijing significant leverage over Moscow.</li><li>  <strong>Strategic fragility:</strong> Both powers seek dominance but avoid the \"responsibility\" of maintaining global stability.</li><li>  <strong>Resource warfare:</strong> Beijing is weaponizing rare earth minerals to exert pressure on rivals, including Japan.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Alliance reshuffling:</strong> Middle powers (Japan, EU) are prioritizing \"resilience\" and new capabilities to survive great power volatility.</li><li>  <strong>Increased risk:</strong> The shift toward a \"might is right\" world order raises the probability of direct conflict in narrow seas and critical waterways.</li></ul>", "us elections": "<p>Internal fractures and economic discontent are reshaping the US electoral landscape ahead of the midterms.</p><p><strong>Why it matters:</strong></p><ul><li>  <strong>Democratic instability:</strong> Progressive wins in Colorado and New York signal a growing rift between the party establishment and its socialist wing.</li><li>  <strong>Republican volatility:</strong> Trump’s preference for MAGA loyalists, like Ken Paxton in Texas, may alienate moderate swing voters.</li></ul><p><strong>The economic drag</strong> Voters are increasingly penalizing incumbents over cost-of-living crises:</p><ul><li>  <strong>Inflation:</strong> FT polling shows voters blame Trump for rising grocery prices.</li><li>  <strong>Industry unrest:</strong> Maine lobster fishermen are pivoting away from Trump due to tariffs and fuel costs.</li><li>  <strong>Urban displacement:</strong> Corporate investment in cities like Nashville is pricing out local residents.</li></ul><p><strong>Power struggles</strong> The balance of power is shifting through legislative and financial pressure:</p><ul><li>  <strong>War powers:</strong> The Senate and House are moving to restrict Trump’s unilateral military action in Iran.</li><li>  <strong>Tech influence:</strong> Silicon Valley billionaires successfully targeted pro-regulation candidates in House primaries.</li><li>  <strong>Intra-party war:</strong> Trump is openly attacking Republicans who oppose his $1.8bn \"anti-weaponisation\" fund.</li></ul><p><strong>What's next</strong> Watch these key indicators for November:</p><ul><li>  <strong>California Governor race:</strong> The matchup between Steve Hilton and Xavier Becerra will serve as a proxy for MAGA's general appeal.</li><li>  <strong>Texas Senate race:</strong> Whether Ken Paxton's base-driven victory translates to a general election win or a Democratic opportunity.</li><li>  <strong>Evangelical shift:</strong> Whether Trump's rhetoric continues to alienate his core Christian constituency.</li></ul>", "german politics": "<p>Germany is pivoting toward aggressive fiscal deregulation and military restructuring amid rising domestic instability.</p><p><strong>Why it matters:</strong> Chancellor Friedrich Merz is attempting to shock-start a stagnant economy while navigating a volatile security environment and a surging far-right.</p><p><strong>The economic pivot</strong></p><ul><li><strong>Tax cuts:</strong> Merz proposed €10bn in tax relief to stimulate growth.</li><li><strong>Pension reform:</strong> Berlin is pursuing a Swedish-style public fund to invest contributions in capital markets.</li><li><strong>Spending discipline:</strong> The Finance Ministry will penalize agencies that fail to deploy the €500bn infrastructure fund.</li><li><strong>Privatization:</strong> Government is reducing its stake in gas importer Uniper from 99% to 25%.</li></ul><p><strong>Defense and security friction</strong></p><ul><li><strong>Procurement chaos:</strong> Berlin scrapped the F126 frigate program due to cost overruns but is overhauling its arms agency to speed up spending.</li><li><strong>Strategic shifts:</strong> Germany is seeking new fighter jet partners after distancing itself from France.</li><li><strong>Geopolitical tension:</strong> Relations with the U.S. have hit a low, though Berlin continues to pursue Tomahawk missile acquisitions.</li><li><strong>Internal threats:</strong> Intelligence warns of rising left-wing terrorism fueled by Middle East tensions and far-right extremism.</li></ul><p><strong>The political threat</strong></p><ul><li><strong>AfD surge:</strong> The far-right party leads opinion polls by leveraging voter anger over fuel prices and foreign policy.</li><li><strong>Kremlin ties:</strong> Senior AfD officials are meeting Russian associates to discuss restarting Nord Stream gas flows.</li><li><strong>Internal rivalry:</strong> Merz faces a \"chancellor swap\" challenge from younger conservative Hendrik Wüst as polls slide.</li></ul><p><strong>Between the lines:</strong> Germany is struggling to balance its role as Europe's financial anchor with the urgent need for military modernization and political stability.</p>", "central banks": "<p>Central banks are entering a period of high volatility as new leadership and diverging inflation paths disrupt traditional market guidance.</p><p><strong>Why it matters:</strong> The shift toward less predictable communication—specifically from the U.S. Federal Reserve—increases borrowing costs and market instability.</p><p><strong>The Warsh Effect</strong> New Fed Chair Kevin Warsh is pivoting away from \"Fedspeak\" and traditional guidance (like the dot plot).</p><ul><li>  <strong>The Goal:</strong> Greater flexibility and a focus on productivity-based growth driven by AI.</li><li>  <strong>The Risk:</strong> Investors warn that removing forward guidance will spike volatility and raise U.S. borrowing costs.</li><li>  <strong>The Stance:</strong> Warsh maintains a commitment to Fed independence despite potential White House pressure.</li></ul><p><strong>Global Divergence</strong> Central banks are no longer moving in lockstep.</p><ul><li>  <strong>ECB:</strong> President Lagarde signals a shift away from the aggressive force used in 2022-23, though modest rate increases remain possible.</li><li>  <strong>Bank of England:</strong> Prioritizing gilt market resilience by limiting hedge fund leverage, despite risks to funding costs.</li><li>  <strong>Bank of Japan:</strong> Maintaining ambiguity on currency intervention as the yen hits 40-year lows.</li></ul><p><strong>Between the lines</strong> The battle for central bank independence is moving to the courts. The Supreme Court's decision to block the firing of Governor Lisa Cook reinforces the legal shield protecting regulators from executive interference.</p><p><strong>What's next</strong> Watch for a \"fragmentation\" of G7 policies. Without coordinated government action, diverging interest rate paths may trigger broader financial instability.</p>", "us banks": "<p>US banks are leveraging a wave of deregulation to expand balance sheets and pursue aggressive international growth.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, allowing Wall Street giants to outpace European and Swiss competitors.</p><p><strong>The JPMorgan Shuffle</strong> CEO Jamie Dimon is aggressively restructuring his inner circle and global footprint:</p><ul><li><strong>Succession:</strong> Dimon axed top contender Marianne Lake, promoting Doug Petno and Troy Rohrbaugh to key divisions.</li><li><strong>Expansion:</strong> Chase is targeting France, Spain, and Italy to grow its digital retail presence.</li><li><strong>War Chest:</strong> Dimon claims deregulation freed $50bn in excess capital, with up to $20bn earmarked for new acquisitions.</li></ul><p><strong>The Regulatory Tug-of-War</strong> Banks are pushing for further easing of Basel capital rules despite recent wins.</p><ul><li><strong>The Risk:</strong> Critics warn that \"checklist\" deregulation weakens systemic resilience.</li><li><strong>The Stress:</strong> Fed tests show US banks could lose $700bn in a severe economic crash.</li><li><strong>The Edge:</strong> Regulatory loosening has handed top US and UK banks $1.3tn in capacity.</li></ul><p><strong>Competitive Pressures</strong> Traditional lenders face threats from non-bank entities and geopolitical shifts.</p><ul><li><strong>Shadow Banking:</strong> Trading firms like Citadel and Jane Street hit $114bn in revenue, eating into traditional bank territory.</li><li><strong>China Risk:</strong> Morgan Stanley is issuing China-only iPhones to Hong Kong staff to mitigate data security threats.</li><li><strong>Private Credit:</strong> Citi partnered with BlackRock in a €15bn deal to compete in private European lending.</li></ul>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>04 Jul 2026 11:52 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
