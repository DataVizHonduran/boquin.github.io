/* ── grid ── */
.grid{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;

const SUMMARIES = {"oil and gas": "<p>Global oil prices are surging toward $100 a barrel as conflict in the Middle East triggers severe supply shocks.</p><p><strong>Why it matters:</strong></p><ul><li>Saudi Arabia has shut its East-West pipeline and cut production to yearly lows following Houthi threats and Iranian tensions.</li><li>Supply constraints are driving US diesel to a record $6 per gallon, threatening agricultural and industrial stability.</li></ul><p><strong>By the numbers:</strong></p><ul><li><strong>$100:</strong> Current Brent crude price target amid US-Iran escalation.</li><li><strong>11%:</strong> Decline in coal-fired electricity generation in H1 2026.</li><li><strong>5x:</strong> Required increase in nuclear reactor construction to meet 2050 targets.</li></ul><p><strong>Between the lines:</strong></p><ul><li><strong>Inflation loop:</strong> High energy costs are forcing the ECB to consider further rate hikes to combat renewed inflation risks.</li><li><strong>Strategic pivots:</strong> The supply crisis is accelerating government interest in clean hydrogen and floating wind turbines.</li><li><strong>Corporate shifts:</strong> Shell is prioritizing free cash flow via acquisitions (ARC Resources), while BP and Shell lean into agility to compete with state-backed majors.</li></ul><p><strong>What's next:</strong></p><ul><li><strong>Demand drop:</strong> The IEA warns of a \"lost period\" in global oil demand as soaring refined product prices price out consumers.</li><li><strong>Regulatory friction:</strong> EU regulators are weighing Chinese control of resources via the Anglo nickel deal.</li><li><strong>Infrastructure bottlenecks:</strong> Market pressure from new entrants like Elon Musk may force gas turbine manufacturers to expand output.</li></ul>", "corporate earnings and results": "<p>Corporate earnings are increasingly decoupled from traditional fundamentals, driven instead by AI speculation and geopolitical volatility.</p><p><strong>Why it matters:</strong> Investors are shifting from valuing current cash flows to betting on AI infrastructure, creating extreme volatility in tech valuations and traditional sectors.</p><p><strong>The AI Paradox</strong></p><ul><li><strong>Oracle:</strong> Larry Ellison is selling $7.5B in stock as revenue rises from data centers, yet investors fear the company is overcommitted to AI.</li><li><strong>Hedge Funds:</strong> JPMorgan halted lending to Situational Awareness following billions in AI-driven losses.</li><li><strong>Macro Impact:</strong> The UK economy grew 0.4% in July, a surge attributed directly to AI integration.</li></ul><p><strong>Geopolitical Shifts</strong></p><ul><li><strong>Canada:</strong> Seeking $1tn in investment to decouple from the U.S. amid political hostility.</li><li><strong>South Korea:</strong> Expanding espionage laws to protect semiconductor intellectual property from foreign theft.</li><li><strong>Middle East:</strong> U.S. air defense restrictions in the Hormuz Strait signal rising operational risks for shipping.</li></ul><p><strong>Market Signals</strong></p><ul><li><strong>Luxury:</strong> Kering is pushing China's Icicle into Western markets to offset a global luxury downturn.</li><li><strong>IPOs:</strong> The potential Belron \"megadeal\" is viewed as a catalyst to reopen Europe's stagnant IPO window.</li></ul><p><strong>What's next:</strong> Watch for a correction in AI-linked equities as the market demands tangible productivity gains over infrastructure spending.</p>", "middle east war": "<p>The Middle East is shifting from localized conflicts to a systemic regional war.</p><p><strong>Why it matters:</strong> Houthi advances in Yemen and Israeli operations in Lebanon are destabilizing global energy corridors and triggering diplomatic fractures between Western allies and Israel.</p><p><strong>The flashpoints</strong></p><ul><li><strong>Yemen:</strong> Houthis have seized the port of Mocha and Red Sea islands, threatening the Bab al-Man opolitical:</strong> Conflict in the Strait of Hormuz and the Black Sea is stalling oil and grain exports, triggering price surges.</li><li>  <strong>Environmental:</strong> Droughts in the Panama Canal are forcing transit cuts, limiting capacity during a period of high demand.</li><li>  <strong>Regulatory:</strong> Sanctions loopholes and \"ghost fleets\" are eroding the authority of global maritime rules.</li></ul><p><strong>By the numbers</strong></p><ul><li>  <strong>$1.5 billion:</strong> Amount CK Hutchison is seeking from Panama over port disputes.</li><li>  <strong>46 ships:</strong> Number of vessels threatened by Iran in a Hormuz transit crackdown.</li><li>  <strong>2028:</strong> Target date for the first US nuclear-powered merchant vessel to challenge Chinese dominance.</li></ul><p><strong>Between the lines</strong></p><ul><li>  <strong>Artificial buoyancy:</strong> High freight rates are currently driven by bottlenecks and disruptions, not organic growth.</li><li>  <strong>Strategic pivots:</strong> South Korea is eyeing Arctic routes to bypass traditional chokepoints, though commercial viability remains low.</li><li>  <strong>Hard asset hedge:</strong> Institutional investors are moving into shipping as a hedge against Middle East instability.</li></ul><p><strong>What's next</strong></p><ul><li>  <strong>Tech shifts:</strong> Maersk is testing wind sails to cut fuel costs as the industry seeks decarbonization.</li><li>  <strong>Safety risks:</strong> Shipping lines are lobbying for stricter battery declarations to prevent vessel fires.</li><li>  <strong>US Policy:</strong> The Trump administration's focus on customs fraud and nuclear shipbuilding aims to decouple maritime logistics from China.</li></ul>", "artificial intelligence": "<p>AI is shifting from a software novelty to a high-stakes geopolitical and systemic risk.</p><p><strong>Why it matters:</strong> The race for superintelligence is creating a dangerous gap between rapid infrastructure scaling and lagging safety governance.</p><p><strong>The risk landscape</strong></p><ul><li><strong>Existential threats:</strong> Top officials and researchers warn that advanced AI could be \"deadly\" or \"kill most people\" without drastic safety interventions.</li><li><strong>Biosecurity:</strong> Anthropic reports users are already attempting to circumvent controls to develop potential bioweapons.</li><li><strong>Security gaps:</strong> Recent hacks suggest commercial AI tools are insufficient for defense, driving a push toward open-weight models.</li></ul><p><strong>The economic engine</strong></p><ul><li><strong>Infrastructure surge:</strong> Oracle and Vantage Data Centers are aggressively scaling capacity, though Wall Street banks are beginning to limit exposure.</li><li><strong>SaaS evolution:</strong> Software companies are pivoting from being \"targets\" of AI to beneficiaries, sparking a \"RenaiSaaS\" era.</li><li><strong>Macro threats:</strong> Mounting U.S. national debt poses a systemic risk to the AI investment bubble.</li></ul><p><strong>The regulatory divide</strong></p><ul><li><strong>EU Strategy:</strong> Europe is prioritizing data sovereignty as its primary lever for growth and control.</li><li><strong>UK Friction:</strong> Tensions are rising as AI labs (e.g., Anthropic) withhold models from government testing agencies.</li><li><strong>Healthcare:</strong> The UK is proposing \"L-plates\" (live monitoring) for AI tools entering patient care.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Corporate autonomy:</strong> Large firms, such as Latham & Watkins, are bypassing Big Tech APIs to build in-house systems using Nvidia servers.</li><li><strong>Educational crisis:</strong> PISA results indicate a decline in basic skills, forcing a total rethink of pedagogy in the AI era.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a zero-sum competition for global hegemony.</p><p><strong>Why it matters:</strong> The shift from \"win-win\" cooperation to strategic rivalry is fracturing international trade, eroding U.S. security guarantees, and forcing neutral nations to choose sides.</p><p><strong>The geopolitical shift</strong></p><ul><li><strong>BRICS dominance:</strong> The grouping now holds a larger share of the global economy than the G7.</li><li><strong>U.S. reliability:</strong> Scaling back military exercises and shifting defense commitments in South Korea and Japan are undermining faith in American security umbrellas.</li><li><strong>Transactional diplomacy:</strong> A perceived U.S. retreat from championing democracy is creating space for authoritarians in Africa and Asia.</li></ul><p><strong>The AI and trade war</strong></p><ul><li><strong>Hardware hegemony:</strong> U.S. national data center projects are consolidating an AI lead that hardware dispersion cannot decentralize.</li><li><strong>Weaponized trade:</strong> Trade is increasingly used as a tool of coercion, mirroring deadlocks seen in the Strait of Hormuz.</li><li><strong>Infrastructure rivalry:</strong> Political instability in the Middle East threatens the India-Mediterranean corridor, favoring China’s Belt and Road Initiative.</li></ul><p><strong>Between the lines</strong> While hawks in Congress push for decoupling, a disconnect is emerging domestically. Both Donald Trump and Gen Z voters show a higher openness to cooperation with Beijing than the established political elite.</p><p><strong>What's next</strong> Expect the formation of two distinct rival blocs as regional conflicts in Ukraine and Iran overlap, forcing a global realignment of trust and trade.</p>", "us elections": "<p>Donald Trump is centering the midterm elections around himself, leveraging massive Super PAC funding and cash incentives to offset plummeting approval ratings.</p><p><strong>Why it matters:</strong> Economic volatility and Trump's personal unpopularity are creating a strategic rift within the GOP. Candidates must balance loyalty to the rom a regional protest movement to a national contender. Its success creates a \"cordon sanitaire\" crisis, leaving mainstream parties unable to form stable coalitions without risking far-right influence.</p><p><strong>By the numbers</strong></p><ul><li><strong>40%:</strong> The AfD's target vote share for upcoming federal elections.</li><li><strong>3 seats:</strong> The narrow margin preventing the AfD from leading the Saxony-Anhalt regional government.</li><li><strong>€3.75 trillion:</strong> The private capital Berlin aims to attract by 2040, now threatened by political instability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>The \"East-West\" Divide:</strong> Support is driven by nostalgia and emotional fault lines remaining from reunification.</li><li><strong>Unlikely Alliances:</strong> The hard-left BSW party has emerged as a potential kingmaker, further complicating coalition math.</li><li><strong>External Influence:</strong> The Kremlin is actively amplifying AfD narratives via hybrid warfare and \"Matryoshka\" influence campaigns.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Legal Battles:</strong> Senior officials are pushing the top court to ban the AfD's most radical flank.</li><li><strong>CDU Pivot:</strong> Friedrich Merz must distance himself from the current administration to stop the conservative bleed to the far right.</li><li><strong>Economic Risk:</strong> Investors may shy away from Germany as political volatility increases and infrastructure bottlenecks, like the Rhine drought, persist.</li></ul>", "central banks": "<p>Central banks are struggling to balance sticky inflation against rising fiscal instability and political interference.</p><p><strong>Why it matters:</strong> High public deficits are eroding the effectiveness of monetary policy. When governments overspend, central banks must keep rates higher for longer to combat inflation, increasing the risk of a debt crisis.</p><p><strong>The global landscape</strong></p><ul><li><strong>ECB:</strong> Raised rates to 2.5% with hawkish guidance. President Christine Lagarde warns Middle East conflicts could extend inflation shocks into 2027.</li><li><strong>BoJ:</strong> Facing pressure to raise rates amid currency volatility and external criticism from U.S. Treasury officials.</li><li><strong>Fed:</strong> Divided. Strong payroll data supports rate hikes, while some officials signal a preference for holding steady.</li><li><strong>BoE:</strong> Governor Andrew Bailey warns that populist attacks on central bank independence threaten policy stability.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Credibility gap:</strong> Political interventions—specifically from U.S. Treasury Secretary Scott Bessent—are damaging market perceptions of central bank independence, particularly in Japan.</li><li><strong>The \"Debt Binge\":</strong> The U.S. is losing \"captive creditors.\" As Treasuries become less attractive, the cost of borrowing is rising, potentially threatening the AI investment boom if yields breach 5%.</li><li><strong>QE Hangover:</strong> Balance sheets will remain bloated, limiting the ability of banks to respond to future shocks.</li></ul><p><strong>What's next</strong></p><ul><li><strong>September Meetings:</strong> Markets are focused on the ECB (Sept 10) and BoE (Sept 17) to determine if tightening cycles have peaked.</li><li><strong>Geopolitical Shifts:</strong> The Dutch central bank moving gold from New York to London signals a growing distrust in U.S. geopolitical stability.</li></ul>", "us banks": "<p>US banks are pivoting toward AI-driven infrastructure and asset management while navigating a shifting regulatory landscape.</p><p><strong>Why it matters:</strong> Wall Street is shifting capital from traditional lending to high-growth AI ecosystems to maintain record profits as traditional margins face pressure.</p><p><strong>The AI pivot</strong></p><ul><li><strong>Financing:</strong> Morgan Stanley and others are architecting the debt structures for AI data centers; banks are offloading $15bn in Anthropic debt to free up capacity for more mega-deals.</li><li><strong>Revenue:</strong> AI-driven semiconductor investments are fueling record equities growth in Asia.</li><li><strong>Efficiency:</strong> Goldman Sachs, Morgan Stanley, and Citi are demanding lower legal fees, arguing AI has reduced the time required for routine legal work.</li></ul><p><strong>Regulatory shifts</strong></p><ul><li><strong>Deregulation:</strong> US regulators are narrowing enforcement to focus strictly on financial risks, signaling a broader Trump-era deregulatory push.</li><li><strong>Crypto:</strong> Regulators granted a banking license to a Trump family crypto venture, intensifying political scrutiny.</li><li><strong>Compliance:</strong> JPMorgan \"debanked\" Polymarket over regulatory concerns despite the platform's $20bn valuation goal.</li></ul><p><strong>Strategic moves</strong></p><ul><li><strong>Asset Management:</strong> Goldman Sachs is acquiring ETF provider Neos for up to $2.3bn to expand its footprint.</li><li><strong>Wealth Management:</strong> Morgan Stanley saw a $74bn Q2 asset surge, driven by SpaceX millionaires and AI-boom IPOs.</li><li><strong>Technology:</strong> BNY is adopting blockchain for record-keeping to merge traditional finance with digital assets.</li></ul><p><strong>The bottom line:</strong> Banks are trading traditional risk for AI exposure, betting that infrastructure financing and wealth management for tech elites will offset regulatory volatility.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>12 Sep 2026 13:45 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>

</html>
