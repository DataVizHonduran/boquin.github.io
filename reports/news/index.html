const SUMMARIES = {"oil and gas": "<p>The global oil market is pivoting from a crisis-driven shortage to a looming supply glut.</p><p><strong>Why it matters:</strong> The reopening of the Strait of Hormuz and a Middle East peace deal are restoring flows, erasing fears of $200 oil and shifting the focus to oversupply.</p><p><strong>By the numbers</strong></p><ul><li><strong>400+:</strong> Ships previously stalled near Hormuz as operators awaited ceasefire stability.</li><li><strong>$765M:</strong> Amount the Trump administration will pay to cancel offshore wind projects in favor of natural gas and geothermal.</li><li><strong>1983:</strong> The year of the previous low for U.S. Strategic Petroleum Reserve stocks, now matched.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Demand divergence:</strong> While OPEC maintains optimistic projections, the IEA warns that returning production will outstrip demand.</li><li><strong>Geopolitical shifts:</strong> Conflict in Iran has inadvertently accelerated EV adoption in Africa, benefiting Chinese manufacturers.</li><li><strong>Political friction:</strong> In the UK, Conservative wins in Aberdeen signal a pushback against limits on new oil and gas exploration.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Consolidation:</strong> Activist investors are targeting shale players like Devon Energy, signaling a wave of mergers in the U.S. patch.</li><li><strong>Infrastructure lag:</strong> Despite the immediate relief in jet fuel prices, markets will take months to fully resolve the structural shocks from the Hormuz closure.</li></ul>", "corporate earnings and results": "<p>Corporate M&A is accelerating as firms pivot toward strategic scale and specialized technology.</p><p><strong>Why it matters:</strong> High-value acquisitions in construction and pharma signal a return to aggressive capital deployment to secure market share and R&D pipelines.</p><p><strong>The big deals</strong></p><ul><li><strong>CRH:</strong> Acquiring Arcosa for $8.5bn to expand construction materials footprint.</li><li><strong>AbbVie:</strong> Spending $10.9bn on Apogee to secure inflammatory disease drug assets.</li><li><strong>KNDS:</strong> Germany securing a 40% stake in Europe's largest tank maker to enable an IPO.</li></ul><p><strong>Sector shifts</strong></p><ul><li><strong>Aviation:</strong> EasyJet rejected a £4.7bn bid from Castlelake, signaling a gap between private credit valuations and board expectations.</li><li><strong>Retail:</strong> UK out-of-town retail parks have reached capacity, driving up demand for limited new sites.</li><li><strong>Housing:</strong> Savills forecasts a miss on the UK government's 1.5mn new home target.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Automation risk:</strong> JD.com warns that robots will eventually replace 700,000 delivery workers.</li><li><strong>Legal disruption:</strong> AI law firms are securing their first court wins in the UK, lowering costs for small-scale claims.</li></ul>", "middle east war": "<p>The U.S. and Iran have reached a tenuous interim deal to end their four-month conflict.</p><p><strong>Why it matters:</strong> The agreement stabilizes global energy markets and unlocks frozen assets, but fragile security dynamics in Lebanon threaten to collapse the truce.</p><p><strong>The deal's mechanics</strong></p><ul><li><strong>Financials:</strong> Iran gains phased access to $6 billion in frozen funds held in Qatar to purchase U.S. goods.</li><li><strong>Trade:</strong> Cargo vessels are returning to the Gulf as the Strait of Hormuz reopens.</li><li><strong>Diplomacy:</strong> Negotiations are centered in Switzerland, though trust remains lower than during the 2015 JCPOA.</li></ul><p><strong>By the numbers</strong></p><ul><li><strong>$6 billion:</strong> Frozen Iranian funds being released.</li><li><strong>$4 billion:</strong> Cost of the Kushner resort project in Albania currently facing Iran-linked protests.</li><li><strong>Pre-war levels:</strong> Current price of urea fertilizer following a demand drop.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Political fallout:</strong> Donald Trump faces criticism from Democrats and allies for the terms of the ceasefire, which some label a national security failure.</li><li><strong>Israeli instability:</strong> Prime Minister Benjamin Netanyahu achieved the goal of degrading Iran but faces his weakest domestic political position in years.</li><li><strong>Economic lag:</strong> Central banks remain cautious on inflation despite falling energy prices.</li></ul><p><strong>What's next</strong></p><ul><li><strong>The Lebanon risk:</strong> Continued friction between Israel and Hizbollah could trigger new Iranian escalations.</li><li><strong>Maritime tension:</strong> Iran is attempting to implement \"insurance fees\" for vessels passing through the Strait of Hormuz.</li><li><strong>Legislative hurdles:</strong> Germany's Bundestag is unlikely to approve minesweeper deployments to the region before the summer recess.</li></ul>", "shipping": "<p>The global shipping industry is bracing for a volatile transition as a US-Iran accord attempts to reopen the Strait of Hormuz.</p><p><strong>Why it matters:</strong> The waterway is a critical energy chokepoint. Prolonged closures have spiked oil prices, strained crew mental health, and fueled a risky \"shadow fleet\" of aging tankers.</p><p><strong>The Hormuz deadlock</strong></p><ul><li><strong>Financial risk:</strong> Shipowners fear a market crash and plummeting rates after record war-time profits.</li><li><strong>New costs:</strong> Industry executives warn Tehran may introduce transit fees or tolls similar to the Strait of Malacca.</li><li><strong>Operational lag:</strong> Backlogs will last weeks; trapped vessels face physical degradation from barnacles and jellyfish.</li></ul><p><strong>The \"Shadow Fleet\" problem</strong></p><ul><li><strong>Security:</strong> The UK is actively intercepting Russian-linked tankers to curb Ukraine war funding.</li><li><strong>Environment:</strong> Over 50% of sanctioned \"dark\" tankers are deemed high-risk for environmental disasters due to age.</li></ul><p><strong>Geopolitical winners</strong></p><ul><li><strong>South Korea:</strong> Capitalizing on the \"chips, ships, and guns\" trend, booming via AI and global defense demand.</li><li><strong>UK Shipyards:</strong> Cammell Laird's acquisition signals a pivot toward increased Royal Navy spending.</li></ul><p><strong>What's next:</strong> Market stability depends on whether the US-Iran deal is \"material\" enough to restore fleet owner confidence and normalize energy flows to Asia.</p>", "artificial intelligence": "<p>Artificial intelligence is shifting from a speculative tool to a disruptive economic force that is restructuring labor, budgets, and global trade.</p><p><strong>Why it matters:</strong> AI is creating a \"productivity paradox\" where increased efficiency triggers corporate cost strains and threatens traditional white-collar business models.</p><p><strong>The labor shift</strong></p><ul><li><strong>Role evolution:</strong> Junior employees are being pushed into managerial decision-making roles as AI handles entry-level execution.</li><li><strong>Job displacement:</strong> Nobel laureates and industry data suggest a permanent reduction in the need for traditional white-collar headcount.</li><li><strong>Sector impact:</strong> AI is boosting hardware giants like Samsung while battering traditional IT service roles.</li></ul><p><strong>Corporate friction</strong></p><ul><li><strong>Budget strain:</strong> Early adopters including Amazon, Walmart, and Uber are capping AI usage to control spiraling costs.</li><li><strong>Business model risk:</strong> Accenture shares hit a seven-year low as investors fear AI will cannibalize IT consultancy services.</li><li><strong>Operational errors:</strong> Financial chatbots and police paperwork tools are producing costly mistakes and legal reviews.</li></ul><p><strong>Geopolitical and market ripples</strong></p><ul><li><strong>Supply chain:</strong> Data center demand is diverting components, driving up prices for consumer electronics like Sony and Nintendo.</li><li><strong>Sovereign AI:</strong> The U.S. is mirroring Chinese strategy by treating AI as a strategic industry requiring government protection and investment.</li><li><strong>Regulatory tension:</strong> Anthropic and OpenAI are navigating a fragmented global landscape of export bans and G7 cooperation efforts.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Physical simulation:</strong> Major investments from Nvidia and Amazon into world-simulating models will move AI from text to physical environment mastery.</li><li><strong>Policy pressure:</strong> Growing calls for \"wealth sharing\" to mitigate mass job losses before they trigger widespread social backlash.</li></ul>", "us-china relations": "<p>The U.S. and China are locked in a systemic competition for global hegemony as Washington retreats from traditional leadership.</p><p><strong>Why it matters:</strong> A leadership vacuum is creating a \"might is right\" world order. This instability forces middle powers to hedge their bets and increases the risk of direct great-power conflict.</p><p><strong>The strategic shift</strong></p><ul><li><strong>Beijing's play:</strong> China is leveraging U.S. volatility to project itself as a \"pillar of stability,\" utilizing a tribute-style system to exercise power without open war.</li><li><strong>Washington's pivot:</strong> The U.S. is shifting toward pre-emptive attacks and transactional diplomacy, eroding the transatlantic alliances that previously secured its global reach.</li><li><strong>The Russia factor:</strong> Putin’s strategic missteps have locked Moscow into a one-sided dependency on Beijing, granting Xi Jinping significant leverage.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Asymmetry is the new currency:</strong> Power no longer stems from raw wealth or size, but from the ability to convert geopolitical imbalances into leverage.</li><li><strong>Soft power flip:</strong> While the U.S. burns diplomatic bridges, China is successfully courting foreign officials to improve its global image.</li></ul><p><strong>What's next</strong></p><ul><li><strong>Multilateral collapse:</strong> Existing global governance institutions are failing, necessitating a total rethink of how the world manages conflict.</li><li><strong>The \"Stalemate Century\":</strong> Expect a prolonged period where decisive victories are rare, and stability is maintained through low-expectation summits and middleman envoys.</li></ul>", "us elections": "<p>US elections are shifting toward a high-stakes battle over populist appeal and candidate viability.</p><p><strong>Why it matters:</strong> Trump’s influence remains dominant within the GOP, but his preference for polarizing candidates is creating strategic vulnerabilities in key swing states.</p><p><strong>The GOP landscape</strong></p><ul><li><strong>Texas risk:</strong> Trump-backed Ken Paxton won the primary, but analysts warn his limited appeal outside the MAGA base may hand the Senate seat to Democrats.</li><li><strong>Internal friction:</strong> Republican senators are blocking Trump’s $1.8bn \"anti-weaponization\" fund, signaling a rift over \"lawfare\" spending.</li><li><strong>2028 positioning:</strong> VP JD Vance and Marco Rubio are already emerging as primary contenders for the next presidential cycle.</li></ul><p><strong>Democratic pivots</strong></p><ul><li><strong>Populist shift:</strong> A former firefighter's win in Pennsylvania suggests the party is moving toward working-class messaging to regain swing districts.</li><li><strong>Internal turmoil:</strong> A DNC autopsy blames the Biden White House for the Harris loss, citing a lack of unity.</li><li><strong>Maine volatility:</strong> Graham Platner’s primary win introduces a controversial figure to challenge incumbent Susan Collins.</li></ul><p><strong>Key vulnerabilities</strong></p><ul><li><strong>Economic discontent:</strong> FT polling shows voters blame Trump for inflation and high grocery prices.</li><li><strong>Base erosion:</strong> Evangelicals are questioning if Trump’s rhetoric aligns with Christian values.</li><li><strong>Industry revolt:</strong> Maine lobster fishermen are rethinking GOP support due to tariffs and fuel costs.</li></ul><p><strong>What's next</strong></p><ul><li><strong>California Governor race:</strong> Steve Hilton will face Xavier Becerra in November.</li><li><strong>Senate Midterms:</strong> Texas and Maine will serve as bellwethers for whether MAGA-aligned candidates can win general elections.</li></ul>", "german politics": "<p>Germany is entering a period of acute political and strategic instability.</p><p><strong>Why it matters:</strong> A combination of rising far-right influence, deteriorating relations with the U.S., and internal leadership struggles is undermining Berlin's role as Europe's stabilizer.</p><p><strong>The AfD surge</strong> The far-right Alternative for Germany (AfD) is leveraging economic anger and Kremlin ties to dominate polls.</p><ul><li><strong>Cultural war:</strong> The party is reviving Nazi-era attacks on modernist institutions like the Bauhaus.</li><li><strong>Foreign influence:</strong> Senior officials are maintaining direct ties with Kremlin associates to push for Nord Stream's return.</li><li><strong>Legal setbacks:</strong> A Berlin court recently ordered the party to return a record €2.35 million in illegal donations.</li></ul><p><strong>Defense and Diplomacy</strong> Berlin is pivoting toward unilateralism in defense, straining ties with France and the U.S.</p><ul><li><strong>U.S. friction:</strong> President Trump is withdrawing 5,000 troops from Germany following a public fallout with Chancellor Friedrich Merz.</li><li><strong>EU tension:</strong> Germany is ditching France for new fighter jet partners and blocking UniCredit’s bid for Commerzbank, sparking \"single market\" concerns.</li><li><strong>Procurement chaos:</strong> Berlin is overhauling its arms agency to speed up spending, while two lawmakers hold veto power over contracts exceeding €25 million.</li></ul><p><strong>Economic shifts</strong> The government is balancing aggressive rearmament with strict fiscal discipline.</p><ul><li><strong>Spending pressure:</strong> The Finance Ministry is threatening to cut funding for ministries failing to utilize a €500 billion infrastructure fund.</li><li><strong>Privatization:</strong> Berlin is reducing its stake in gas importer Uniper from 99% to 25%.</li><li><strong>Protectionism:</strong> New proposals requiring streamers like Netflix to invest more in Europe are facing accusations of protectionism.</li></ul><p><strong>What's next:</strong> Chancellor Merz faces a double threat: a sliding poll numbers that have empowered \"dark horse\" conservative rivals like Hendrik Wüst, and a precarious security vacuum as U.S. military support wavers.</p>", "central banks": "<p>Global central banks are pivoting toward tighter monetary policy to combat energy shocks and geopolitical instability.</p><p><strong>Why it matters:</strong> Rising inflation, triggered largely by conflict in Iran, is forcing a reversal of the \"easy money\" era. This shift increases borrowing costs and triggers volatility in global bond markets.</p><p><strong>The \"Warsh Effect\" at the Fed</strong> New Fed Chair Kevin Warsh is aggressively reforming the U.S. central bank:</p><ul><li><strong>Guidance axe:</strong> Warsh eliminated \"dot plot\" forward guidance and policy statement fluff to increase flexibility.</li><li><strong>Hawkish tilt:</strong> The Fed dropped its bias for rate cuts as inflation nearly doubled the bank's target.</li><li><strong>Market reaction:</strong> Investors warn that the lack of clear guidance will spike U.S. borrowing costs.</li></ul><p><strong>Global Divergence</strong> Central banks are reacting to localized pressures:</p><ul><li><strong>ECB:</strong> First G7 bank to raise rates since 2023, citing a \"broadening\" of price rises across the Eurozone.</li><li><strong>Bank of Japan:</strong> Raised rates to 1% for the first time since 1995 and is slowing bond purchases.</li><li><strong>SE Asia:</strong> Indonesia and the Philippines raised rates to defend crashing currencies against energy shocks.</li><li><strong>Bank of England:</strong> Held rates at 3.75% as a US-Iran deal temporarily lowered oil prices.</li></ul><p><strong>Between the lines</strong> Central banks are losing trust in global stability. Institutions are repatriating gold reserves to avoid sanctions and insecurity, signaling a move toward financial nationalism.</p><p><strong>What's next</strong></p><ul><li><strong>Bond reordering:</strong> A structural shift in the asset class as investors price in higher long-term rates.</li><li><strong>Inflation watch:</strong> Markets are monitoring whether the ECB and Fed can tame the \"inflation python\" without triggering a deep recession.</li></ul>", "us banks": "<p>US banks are leveraging a wave of deregulation to aggressively expand their balance sheets and global footprints.</p><p><strong>Why it matters:</strong> Lower capital requirements are freeing billions in liquidity, shifting the competitive advantage toward US lenders over their EU and Swiss counterparts.</p><p><strong>By the numbers</strong></p><ul><li><strong>$1.3 trillion:</strong> Total capital unlocked for top US and UK banks due to regulatory loosening.</li><li><strong>$50 billion:</strong> Excess capital Jamie Dimon claims was freed by the Trump administration's lighter regulatory approach.</li><li><strong>$20 billion:</strong> The potential acquisition budget JPMorgan may deploy using this surplus.</li><li><strong>$114 billion:</strong> Combined revenues of trading firms like Citadel and Jane Street, signaling a growing threat to traditional bank dominance.</li></ul><p><strong>The strategic pivot</strong></p><ul><li><strong>European Expansion:</strong> JPMorgan is scaling its digital bank, Chase, into France, Spain, Italy, and Germany.</li><li><strong>Private Credit:</strong> Citi is partnering with BlackRock in a €15bn deal to compete in private European lending.</li><li><strong>Crypto Integration:</strong> Morgan Stanley is adding spot crypto trading to its E*Trade platform to capture retail digital asset flows.</li></ul><p><strong>Between the lines</strong></p><ul><li><strong>Regulatory Arbitrage:</strong> Wall Street is lobbying for further Basel rule easements to maintain a capital advantage over international rivals.</li><li><strong>Geopolitical Friction:</strong> Morgan Stanley is issuing China-specific iPhones to Hong Kong staff, highlighting acute data security fears in mainland China.</li><li><strong>Internal Volatility:</strong> High-profile executive departures at Goldman Sachs and lawsuits at Citi suggest cultural friction amid leadership shifts.</li></ul><p><strong>What's next</strong> Watch for a surge in M&A activity as US banks deploy their \"excess capital\" and a continued push into retail banking across the EU.</p>"};

/* build tag buttons */
const tagBar = document.getElementById('tag-bar');
TOPICS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.tag = t.tag;
  btn.textContent = t.label;
  btn.style.color = t.color;
  btn.style.background = t.bg;
  btn.style.borderColor = t.color + '55';
  tagBar.appendChild(btn);
});

const topicMap = {};
TOPICS.forEach(t => topicMap[t.tag] = t);

/* state */
let activeTag  = 'all';
let activeDays = 7;

/* controls */
const slider      = document.getElementById('days-slider');
const daysVal     = document.getElementById('days-val');
const grid        = document.getElementById('grid');
const empty       = document.getElementById('empty');
const metaRow     = document.getElementById('meta-row');
const banner      = document.getElementById('summary-banner');
const bannerInner = document.getElementById('summary-banner-inner');

slider.addEventListener('input', () => {
  activeDays = +slider.value;
  daysVal.textContent = activeDays;
  render();
});

tagBar.addEventListener('click', e => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  activeTag = btn.dataset.tag;
  tagBar.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('active');
    const t = topicMap[b.dataset.tag];
    if (t) { b.style.color = t.color; b.style.background = t.bg; b.style.borderColor = t.color + '55'; }
  });
  btn.classList.add('active');
  if (btn.dataset.tag === 'all') {
    btn.style.cssText = 'background:#0f172a;color:#fff;border-color:#0f172a';
  } else {
    const t = topicMap[activeTag];
    btn.style.background = t.color;
    btn.style.color = '#fff';
    btn.style.borderColor = t.color;
  }
  render();
});

function render() {
  const cutoff = new Date(Date.now() - activeDays * 864e5).toISOString();
  const filtered = ARTICLES.filter(a =>
    (activeTag === 'all' || a.tag === activeTag) &&
    (!a.date_iso || a.date_iso >= cutoff)
  );

  metaRow.innerHTML = `Showing <strong>${filtered.length}</strong> article${filtered.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Fetched <strong>22 Jun 2026 15:39 UTC</strong>`;

  /* summary banner */
  if (activeTag !== 'all' && SUMMARIES[activeTag]) {
    const t = topicMap[activeTag];
    bannerInner.style.borderLeftColor = t.color;
    bannerInner.innerHTML = '<div class="summary-banner-label">AI Briefing</div>' + SUMMARIES[activeTag];
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(a => {
    const t = topicMap[a.tag] || {color:'#64748b', bg:'#f1f5f9', label: a.tag};
    return `<div class="card">
      <div class="card-top">
        <span class="badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
        <span class="card-date">${a.date_label}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${escHtml(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${escHtml(a.summary)}</div>` : ''}
      <a class="card-link" href="${a.url}" target="_blank" rel="noopener">Read on FT ↗</a>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
