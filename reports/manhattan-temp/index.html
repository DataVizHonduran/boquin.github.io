  const b=D.bands[lo+'_'+hi];

}
function setHi(btn){
  hi=+btn.dataset.val;
  document.querySelectorAll('#hi-btns button').forEach(b=>b.classList.remove('active'));

  Plotly.restyle(gd,{theta:[b.theta],r:[b.r],name:[lo+'–'+hi+'th pct']},[0]);
}
