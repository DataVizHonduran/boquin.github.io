name: Update Options Chain

on:
  schedule:
    - cron: '0 21 * * 1-5'  # Weekdays at 21:00 UTC (US market close)
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol (e.g. GOOGL, AAPL)'
        required: true
        default: 'GOOGL'

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run options chain publisher
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/options_chain_publisher.py ${{ github.event.inputs.ticker || 'GOOGL' }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/options-chain/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Options Chain ${{ github.event.inputs.ticker }} — $(date +'%Y-%m-%d') 🤖"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "Push attempt $i failed — retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
