name: Update H.8 Credit Risk Monitor

on:
  schedule:
    - cron: '0 22 * * 5'  # Fridays 22:00 UTC — after ~21:15 UTC H.8 release
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/generate_h8_monitor.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/h8-monitor/
          git diff --staged --quiet || (git commit -m "Update H.8 Credit Risk Monitor - $(date +'%Y-%m-%d') 🤖 Automated weekly update" && git pull --rebase && git push)
