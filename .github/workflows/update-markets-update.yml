name: Daily US Markets Update

on:
  schedule:
    - cron: '30 14 * * 1-5'  # 10:30am ET (14:30 UTC), Mon-Fri — after 8:30am releases
  workflow_dispatch:          # allow manual trigger

concurrency:
  group: markets-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # Gemma 4 31B can be slow; allow enough time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub

      - name: Generate markets update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_markets_update.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/markets-update/
          git diff --staged --quiet || (
            git commit -m "Daily markets update — $(date +'%Y-%m-%d') 🤖" &&
            git pull --rebase &&
            git push
          )
