name: Update FOMC Analyzer

on:
  schedule:
    - cron: '0 8 * * *'   # Daily 08:00 UTC — 10 pairs/day, backfill completes ~22 days
  workflow_dispatch:
    inputs:
      force:
        description: 'Reprocess the latest pair even if it already exists'
        required: false
        default: 'false'
        type: boolean
      limit:
        description: 'Max pairs to process per run (leave blank for default behavior)'
        required: false
        default: ''
        type: string

jobs:
  update-fomc-analyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FOMC Analyzer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          LIMIT_FLAG="--limit 10"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/generate_fomc_analyzer.py $FORCE_FLAG $LIMIT_FLAG

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/fomc-analyzer/
          git diff --staged --quiet || (
            git commit -m "FOMC Analyzer — $(date +'%Y-%m-%d') 🤖" &&
            git pull --rebase &&
            git push
          )
