name: Update BIS REER Dashboard

on:
  schedule:
    # 8th of each month at 08:00 UTC — after BIS publishes monthly EER update
    - cron: "0 8 8 * *"
  workflow_dispatch:   # manual trigger any time

jobs:
  update-bis-reer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Run BIS REER generator
        run: |
          cd ${{ github.workspace }}
          python scripts/generate_bis_reer.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/bis-reer/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: BIS REER Dashboard $(date +'%Y-%m-%d')"
            git push
          fi
