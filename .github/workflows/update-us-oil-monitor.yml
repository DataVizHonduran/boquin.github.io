name: Update US Oil Monitor

on:
  schedule:
    - cron: '30 15 * * 3'  # Wednesdays 15:30 UTC (after EIA 10:30 AM ET release)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        run: python scripts/generate_us_oil_monitor.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/us-oil-monitor/
          git diff --staged --quiet || (git commit -m "Update US Oil Monitor - $(date +'%Y-%m-%d') 🤖" && git pull --rebase && git push)
