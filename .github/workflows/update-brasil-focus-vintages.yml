name: Update Brasil FOCUS Vintages

on:
  schedule:
    - cron: '0 15 * * 1'  # Every Monday at 15:00 UTC (10:00 AM EST)
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        run: python scripts/generate_brasil_focus_vintages.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/brasil-focus-vintages/
          git diff --staged --quiet || (git commit -m "Update Brasil FOCUS Vintages - $(date +'%Y-%m-%d') 🤖 Automated weekly update" && git pull --rebase --autostash && git push)
