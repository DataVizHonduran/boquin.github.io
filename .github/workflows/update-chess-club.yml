name: Update PS11 Chess Club Stats

on:
  schedule:
    - cron: '0 12 * * *'  # Daily, 12:00 UTC
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate chart
        run: |
          mkdir -p reports/chess-club
          python scripts/chess_club_stats.py \
            --school PS11 --x ck_rating --y uscf_rating \
            --min-x 900 --z-thresh 1.5 \
            --out reports/chess-club/fragment.html
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="UTF-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
            echo '<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>♟️</text></svg>">'
            echo '</head><body style="margin:0;background:#fcfcfb;">'
            cat reports/chess-club/fragment.html
            echo '</body></html>'
          } > reports/chess-club/index.html
          rm reports/chess-club/fragment.html

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/chess-club/
          git diff --staged --quiet || (git commit -m "Update PS11 Chess Club chart - $(date +'%Y-%m-%d') 🤖" && git pull --rebase --autostash && git push)
