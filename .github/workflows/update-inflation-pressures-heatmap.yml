name: Update Inflation Pressures Heat Map

on:
  schedule:
    - cron: '0 10 * * *'   # Daily at 10:00 UTC (after FRED updates)
  workflow_dispatch:

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Inflation Pressures Heat Map
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/generate_inflation_pressures_heatmap.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/inflation-pressures/
          git diff --staged --quiet || (
            git commit -m "Inflation Pressures Heat Map — $(date +'%Y-%m-%d') 🤖" &&
            git pull --rebase --autostash origin main &&
            git push
          )
