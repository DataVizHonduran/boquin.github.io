name: Update Macro Aviation Pulse

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:   # manual trigger any time

jobs:
  update-aviation-pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests plotly pandas

      - name: Run aviation pulse generator
        env:
          OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
        run: |
          cd ${{ github.workspace }}
          python scripts/generate_aviation_pulse.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/macro-aviation-pulse/index.html \
                  reports/macro-aviation-pulse/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Macro Aviation Pulse $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
