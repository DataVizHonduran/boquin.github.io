name: Update G10 Classic PPP Fair Value

on:
  schedule:
    - cron: '0 6 5 * *'  # Run monthly on the 5th at 6:00 AM UTC (CPI/HICP data lags ~1-5 days into the month)
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update-g10-ppp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate G10 PPP dashboard
        run: python scripts/generate_g10_ppp.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/g10-ppp/
          git diff --staged --quiet || (git commit -m "Update G10 PPP fair value - $(date +'%Y-%m-%d') 🤖 Automated monthly update" && git pull --rebase --autostash && git push)
