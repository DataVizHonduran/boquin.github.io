name: Hourly NYT News Feed

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  nyt-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull latest before running
        run: git pull

      - name: Generate NYT News page
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_nyt_news.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/nyt-news/index.html
          git diff --staged --quiet || (
            git commit -m "NYT News Feed — $(date +'%Y-%m-%d %H:%M UTC') 🤖" &&
            git pull --rebase --autostash &&
            git push
          )
