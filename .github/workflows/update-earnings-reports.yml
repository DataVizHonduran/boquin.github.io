name: Update Earnings Reports

on:
  schedule:
    - cron: '0 14 * * *'  # Run daily at 2:00 PM UTC (9:00 AM EST)
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate earnings index page
        run: |
          cd scripts
          python generate_earnings_index.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/earnings/
          git diff --staged --quiet || (
            git commit -m "Update earnings reports - $(date +'%Y-%m-%d')

          🤖 Automated daily update" &&
            git pull --rebase origin main &&
            git push
          )
