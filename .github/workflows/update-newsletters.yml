name: Weekly Newsletter Digest

on:
  schedule:
    - cron: '0 8 * * 1'   # 8am UTC every Monday
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  newsletter-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull latest before running
        run: git pull

      - name: Run Newsletter Digest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/newsletter_digest.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/newsletters/
          git diff --staged --quiet || (
            git commit -m "Newsletter Digest — $(date +'%Y-%m-%d') 🤖" &&
            git pull --rebase --autostash &&
            git push
          )
