name: Update Crude Oil Stocks Weekly Chart

on:
  schedule:
    # 15:30 UTC = 1:30 PM ET — gives EIA API 3h to ingest after 10:30 AM report
    - cron: '30 15 * * 3'
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib

      - name: Generate chart
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/generate_crude_stocks_weekly.py

      - name: Generate AI commentary
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/petroleum_stocks_commentary.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/petroleum-stocks/
          git diff --staged --quiet || (git commit -m "Update Petroleum Stocks + AI Commentary - $(date +'%Y-%m-%d') 🤖" && git pull --rebase --autostash -X theirs && git push)
