name: Update Crude Oil Stocks Weekly Chart

on:
  schedule:
    # 17:30 UTC = 1:30 PM ET — gives EIA API 3h to ingest after 10:30 AM report
    - cron: '30 17 * * 3'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib

      - name: Generate chart
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/generate_crude_stocks_weekly.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/crude-stocks/
          git diff --staged --quiet || (git commit -m "Update Crude Oil Stocks Weekly Chart - $(date +'%Y-%m-%d') 🤖" && git pull --rebase && git push)

