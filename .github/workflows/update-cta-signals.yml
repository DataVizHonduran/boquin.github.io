name: Update CTA Signals

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-cta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate CTA signals
        run: python scripts/generate_cta_signals.py

      - name: Generate index page
        run: python scripts/generate_index.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/cta-signals/
          git diff --staged --quiet || (git commit -m "Update CTA signals - $(date +'%Y-%m-%d') 🤖 Automated daily update" && git pull --rebase --autostash && git push)
