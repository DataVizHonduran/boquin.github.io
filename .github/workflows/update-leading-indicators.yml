name: Update US Leading Indicators

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at 12:00 UTC (same cadence as original repo)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/generate_leading_indicators.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/leading-indicators/
          git diff --staged --quiet || (git commit -m "Update US Leading Indicators - $(date +'%Y-%m-%d') 🤖 Automated weekly update" && git pull --rebase && git push)
