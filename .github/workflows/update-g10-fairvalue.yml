name: Update G10 FX Fair Value

on:
  schedule:
    - cron: '0 3 * * *'  # Run daily at 3:00 AM UTC (after CTA signals at 2 AM)
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-g10-fairvalue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate G10 fair value dashboard
        run: python scripts/generate_g10_fairvalue.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/g10-fairvalue/
          git diff --staged --quiet || (git commit -m "Update G10 FX fair value - $(date +'%Y-%m-%d') 🤖 Automated daily update" && git pull --rebase --autostash && git push)
