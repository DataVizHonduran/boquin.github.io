name: Update Crypto CTA Signals

on:
  # schedule:
  #   - cron: '0 6 * * *'  # Run daily at 6:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-crypto-cta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Crypto CTA signals
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/generate_crypto_cta_signals.py

      - name: Generate index page
        run: python scripts/generate_crypto_index.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/crypto-cta-signals/
          # Check for changes, then pull and rebase before pushing
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update Crypto CTA signals - $(date +'%Y-%m-%d') 🤖 Automated daily update"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
