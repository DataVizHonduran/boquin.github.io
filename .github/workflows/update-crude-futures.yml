name: Update Crude Futures Dashboard

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        run: python scripts/generate_crude_futures.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/crude-futures/
          git diff --staged --quiet || (git commit -m "Update Crude Futures Dashboard - $(date +'%Y-%m-%d') 🤖" && git pull --rebase && git push)
