name: Update US 10Y Fair Value

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4:00 AM UTC
  workflow_dispatch:

jobs:
  update-10y-fair-value:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate US 10Y fair value report
        run: python scripts/generate_10y_fair_value.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/us-10y-fair-value/
          git diff --staged --quiet || (git commit -m "Update US 10Y fair value - $(date +'%Y-%m-%d') 🤖 Automated weekly update" && git pull --rebase --autostash && git push)
