name: Update Disneyland Paris Wait Times

on:
  schedule:
    - cron: '*/10 6-23 * * *'  # Every 10 min, 06:00-23:00 UTC (covers park hours)
  workflow_dispatch:

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        run: python scripts/generate_disney_wait_times.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/disney-wait-times/
          git diff --staged --quiet || (git commit -m "Update Disneyland Paris Wait Times - $(date +'%Y-%m-%d %H:%M') 🤖" && git pull --rebase --autostash && git push)
