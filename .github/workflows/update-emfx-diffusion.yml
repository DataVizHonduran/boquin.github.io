name: Update EMFX Diffusion Dashboard

on:
  schedule:
    - cron: '0 19 * * 1-5'  # Weekdays at 19:00 UTC (after US market close)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Data fetch takes ~7 min (25 symbols × 15s sleep)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/generate_emfx_diffusion.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/emfx-risk-diffusion/
          git diff --staged --quiet || (git commit -m "Update EMFX Diffusion Dashboard - $(date +'%Y-%m-%d') 🤖 Automated daily update" && git pull --rebase --autostash && git push)
