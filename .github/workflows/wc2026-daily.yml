name: Daily FIFA WC 2026 stats refresh

on:
  schedule:
    # 6am EST fixed (UTC-5) — fires at 7am local during EDT (DST), 6am during EST.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install plotly

      - name: Build charts
        run: python3 scripts/wc2026/build_wc2026_charts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/fifa-wc-2026/*.html
          git diff --cached --quiet || git commit -m "Daily refresh: FIFA WC 2026 stats"
          git push
