name: Update Fed District Monitor

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-fed-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Fed District Monitor (scrape + AI enrichment)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/fed_district_ai_processor.py \
            --scrape \
            --days 3 \
            --output-dir reports/fed-monitor/ \
            --cache reports/fed-monitor/cache.json \
            --date $(date +%Y-%m-%d)

      - name: Generate month-to-date report
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/fed_district_ai_processor.py \
            --monthly \
            --output-dir reports/fed-monitor/ \
            --cache reports/fed-monitor/cache.json \
            --date $(date +%Y-%m-%d)

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || (
            git commit -m "Fed District Monitor — $(date +'%Y-%m-%d') 🤖" &&
            git pull --rebase --autostash origin main &&
            git push
          )
